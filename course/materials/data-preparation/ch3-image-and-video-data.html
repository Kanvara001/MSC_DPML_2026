<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Preparation for ML and AI — Chapter 3: Image and video data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0F7A6A;
  --accent-soft:#E6F3F0;
  --accent-ink:#0B5A4E;
  --paper:#EDF1F6;
  --card:#FFFFFF;
  --ink:#111823;
  --ink-2:#41505F;
  --ink-3:#78859A;
  --rule:#D3DCE6;
  --rule-2:#E7EDF3;
  --shell:#171E28;
  --shell-2:#212A36;
  --shell-3:#2E3946;
  --ok:#0F7A6A;
  --warn:#A3384F;
  --f-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-thai:"Noto Sans Thai","Archivo",sans-serif;
  --W:1280px; --H:720px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================ CHROME ============================ */
.bar{
  position:fixed;left:0;right:0;top:0;height:44px;z-index:40;
  background:var(--shell-2);border-bottom:1px solid #000;
  display:flex;align-items:center;gap:10px;padding:0 12px;color:#C6D1DD;
}
.bar .ch{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;flex:none;
}
.bar .tt{font-family:var(--f-ui);font-size:13px;font-weight:600;color:#EAF0F6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.bar .sec{font-family:var(--f-mono);font-size:10.5px;color:#7C8C9C;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.bar .grp{display:flex;gap:4px;align-items:center;flex:none}
.tb{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:6px 9px;
  border:1px solid var(--shell-3);border-radius:5px;color:#A9B7C5;background:transparent;white-space:nowrap;
}
.tb:hover{background:var(--shell-3);color:#fff}
.tb[aria-pressed="true"]{background:#E9EEF3;color:var(--shell);border-color:#E9EEF3;font-weight:600}
.tb.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.count{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;padding:0 4px;flex:none}
.count b{color:#fff}

/* ============================ STAGE ============================ */
.stage{
  position:fixed;inset:44px 0 30px 0;display:grid;place-items:center;overflow:hidden;
  background:var(--shell);
}
body.notes-on .stage{right:340px}
.holder{width:var(--W);height:var(--H);transform-origin:center center;position:relative}
.slide{
  width:var(--W);height:var(--H);background:var(--card);position:relative;overflow:hidden;
  box-shadow:0 12px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;
}

/* progress */
.prog{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:40;background:var(--shell-2);
  border-top:1px solid #000;display:flex;align-items:center;gap:10px;padding:0 12px}
.track{flex:1;height:6px;background:#0D131A;border-radius:3px;position:relative;overflow:hidden;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;transition:width .15s}
.ticks{position:absolute;inset:0}
.ticks i{position:absolute;top:0;bottom:0;width:1px;background:#33404E}
.prog .hint{font-family:var(--f-mono);font-size:9.5px;color:#5F6E7D;letter-spacing:.05em;white-space:nowrap}
.timer{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;min-width:52px;text-align:right}

/* ============================ SLIDE LAYOUTS ============================ */
.pad{padding:52px 64px 46px}
.slide{--k:1}
.slide .kick{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px;
}
.slide .kick .dot{width:22px;height:2px;background:var(--accent);display:inline-block}
.slide h2{
  font-family:var(--f-ui);font-size:calc(37px * var(--k));line-height:1.14;letter-spacing:-.022em;
  font-weight:650;margin:0 0 6px;color:var(--ink);
}
.slide h2.sm{font-size:calc(31px * var(--k))}
.slide .lead{
  font-size:calc(18.5px * var(--k));line-height:1.5;color:var(--ink-2);margin:calc(12px * var(--k)) 0 0;max-width:96ch;font-style:italic;
}
.slide .lead b{font-style:normal;color:var(--ink);font-weight:600}
.rule{height:2px;background:var(--accent);width:64px;margin:calc(16px * var(--k)) 0 calc(20px * var(--k));flex:none}

ul.bul{list-style:none;margin:0;padding:0}
ul.bul>li{
  position:relative;padding:0 0 0 24px;margin:0 0 calc(13px * var(--k));font-size:calc(17.5px * var(--k));line-height:1.48;color:var(--ink-2);
}
ul.bul>li:before{
  content:"";position:absolute;left:3px;top:11px;width:9px;height:2px;background:var(--accent);
}
ul.bul>li b,ul.bul>li strong{color:var(--ink);font-weight:600}
ul.bul>li em{font-style:italic;color:var(--ink)}
ul.bul.tight>li{margin-bottom:calc(9px * var(--k));font-size:calc(16.5px * var(--k))}
ul.bul.sm>li{font-size:calc(15.5px * var(--k));margin-bottom:calc(8px * var(--k));padding-left:20px}
ul.bul.sm>li:before{width:7px;top:10px}
.k{font-family:var(--f-mono);font-size:.86em;background:#EEF3F8;border:1px solid var(--rule-2);
  border-radius:3px;padding:1px 5px;color:var(--ink)}
.cite{font-family:var(--f-mono);font-size:.8em;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
.th{font-family:var(--f-thai)}

/* two column body */
.body{flex:1;min-height:0;display:flex;gap:34px}
.body.v{flex-direction:column;gap:16px}
.col{flex:1;min-width:0}
.col.narrow{flex:0 0 40%}
.col.wide{flex:0 0 58%}
.figwrap{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;flex:1 1 auto}
.figbox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.figbox svg{width:100%;height:100%;max-height:100%;display:block}
.figcap{
  font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.45;
  border-top:1px solid var(--rule-2);padding-top:8px;
}
.figcap b{color:var(--ink-2);font-weight:600}

/* columns layout */
.cols{display:grid;gap:18px;flex:1;min-height:0}
.cols.n2{grid-template-columns:1fr 1fr}
.cols.n3{grid-template-columns:1fr 1fr 1fr}
.cols.n4{grid-template-columns:repeat(4,1fr)}
.cbox{
  border:1px solid var(--rule);border-radius:9px;padding:calc(16px * var(--k)) 17px;background:#FBFDFE;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.cbox.acc{border-color:var(--accent);background:var(--accent-soft)}
.cbox h4{
  font-family:var(--f-ui);font-size:calc(15px * var(--k));font-weight:650;margin:0 0 4px;letter-spacing:-.01em;color:var(--ink);
}
.cbox .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 9px;font-weight:600}
.cbox p{margin:0 0 calc(8px * var(--k));font-size:calc(14.5px * var(--k));line-height:1.46;color:var(--ink-2)}
.cbox ul.bul>li{font-size:calc(14.5px * var(--k));margin-bottom:calc(7px * var(--k));padding-left:18px}
.cbox ul.bul>li:before{width:7px;top:9px}

/* title slide */
.slide.title{background:var(--shell);color:#E9EFF5;justify-content:center}
.slide.title .pad{padding:0 78px}
.slide.title .no{
  font-family:var(--f-mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 20px;
}
.slide.title h1{
  font-family:var(--f-ui);font-size:60px;line-height:1.06;letter-spacing:-.03em;font-weight:700;
  margin:0 0 20px;max-width:20ch;color:#fff;
}
.slide.title .dek{font-size:20px;line-height:1.5;color:#9DAEBE;max-width:62ch;margin:0 0 30px;font-style:italic}
.slide.title .meta{
  font-family:var(--f-mono);font-size:12px;color:#6F7F90;letter-spacing:.05em;line-height:1.9;
  border-top:1px solid #303B48;padding-top:18px;max-width:62ch;
}
.slide.title .meta b{color:#C3D0DC;font-weight:500}
.slide.title:after{
  content:"";position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.30;
}
.slide.title:before{
  content:"";position:absolute;right:-40px;bottom:-240px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.16;
}

/* divider */
.slide.divider{background:var(--accent-soft);justify-content:center}
.slide.divider .pad{padding:0 78px}
.slide.divider .n{
  font-family:var(--f-mono);font-size:96px;line-height:1;font-weight:600;letter-spacing:-.05em;
  color:var(--accent);opacity:.30;margin:0 0 6px;
}
.slide.divider h2{font-size:46px;max-width:22ch;color:var(--accent-ink)}
.slide.divider .lead{color:var(--ink-2);font-size:19px;max-width:70ch}
.slide.divider .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px;max-width:84ch}
.slide.divider .chips span{
  font-family:var(--f-mono);font-size:11px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--accent);color:var(--accent-ink);background:rgba(255,255,255,.6);
}

/* refs */
ol.refs{list-style:none;counter-reset:r;margin:0;padding:0;column-gap:34px}
ol.refs.two{column-count:2}
ol.refs>li{
  counter-increment:r;position:relative;padding:0 0 0 30px;margin:0 0 11px;
  font-size:calc(14.5px * var(--k));line-height:1.45;color:var(--ink-2);break-inside:avoid;
}
ol.refs>li:before{
  content:counter(r);position:absolute;left:0;top:2px;font-family:var(--f-mono);font-size:10px;
  font-weight:600;color:#fff;background:var(--accent);width:19px;height:19px;border-radius:4px;
  display:grid;place-items:center;
}
ol.refs>li b{color:var(--ink);font-weight:600}
ol.refs>li i{color:var(--ink-3);font-style:italic}

/* callout / lab / vilab */
.callout{
  border-left:3px solid var(--accent);background:var(--accent-soft);padding:calc(14px * var(--k)) 18px;border-radius:0 8px 8px 0;
  margin-top:calc(16px * var(--k));
}
.callout .h{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:600;margin-bottom:6px;
}
.callout p{margin:0;font-size:calc(15.5px * var(--k));line-height:1.5;color:var(--ink-2)}
.slide.vilab{background:linear-gradient(180deg,#FBFDFE 0%,#F2F6FA 100%)}
.slide.vilab .badge{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff;background:var(--ink);
  padding:5px 11px;border-radius:20px;margin-bottom:14px;
}
.slide.vilab .badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.slide.lab{background:#FCFBF6}
.stat{display:flex;gap:calc(26px * var(--k));margin:calc(18px * var(--k)) 0 0;flex-wrap:wrap}
.stat div{flex:0 0 auto}
.stat .v{font-family:var(--f-ui);font-size:calc(34px * var(--k));font-weight:700;letter-spacing:-.03em;color:var(--accent);line-height:1}
.stat .l{margin-top:calc(6px * var(--k))!important}
.stat .l{font-family:var(--f-mono);font-size:calc(10px * var(--k));letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-top:6px;max-width:22ch;line-height:1.5}

/* table */
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:0 12px 9px;border-bottom:2px solid var(--accent);font-weight:600;
}
table.t td{padding:calc(10px * var(--k)) 12px;font-size:calc(14.5px * var(--k));border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top;line-height:1.42}
table.t td:first-child{font-weight:600;color:var(--ink)}
table.t tr:last-child td{border-bottom:none}

/* per-slide citation footnotes */
sup.fn{font-family:var(--f-mono);font-size:.62em;font-weight:600;color:var(--accent);
  vertical-align:super;line-height:0;padding-left:1px}
.cites{
  flex:none;margin-top:calc(9px * var(--k));padding-top:6px;border-top:1px solid var(--rule-2);
  display:flex;flex-direction:column;gap:calc(2px * var(--k));
}
.cites .c{
  font-family:var(--f-ui);font-size:calc(10.5px * var(--k));line-height:1.42;color:var(--ink-3);
  display:flex;gap:6px;align-items:baseline;
}
.cites .c b{color:var(--accent);font-weight:700;flex:none;font-family:var(--f-mono);font-size:.94em}
.cites .c i{color:var(--ink-2);font-style:italic}
.cites .c .ed{min-width:0}
.slide.figure .cites,.slide.split .cites,.slide.splitr .cites{margin-top:calc(8px * var(--k))}

/* slide footer */
.foot{
  position:absolute;left:64px;right:64px;bottom:16px;display:flex;align-items:center;gap:12px;
  font-family:var(--f-mono);font-size:9.5px;color:#9FADBC;letter-spacing:.08em;text-transform:uppercase;
  border-top:1px solid var(--rule-2);padding-top:9px;
}
.foot .sp{flex:1}
.foot .tag{padding:2px 7px;border-radius:3px;border:1px solid var(--rule);letter-spacing:.09em}
.foot .tag.frontier{color:var(--warn);border-color:#E4BCC4;background:#FDF2F4}
.foot .tag.textbook{color:#3A4A57;border-color:#C3CCD4;background:#F2F5F7}
.foot .tag.both{color:#8A6A12;border-color:#E0D0A4;background:#FDF8EA}
.slide.title .foot,.slide.divider .foot{display:none}

/* editing */
body.edit .ed{border-radius:3px;cursor:text}
body.edit .ed:hover{background:#F1F7FC;box-shadow:0 0 0 4px #F1F7FC}
body.edit .ed:focus{background:#FFFBE6;box-shadow:0 0 0 4px #FFFBE6;outline:none}
.slide.title .ed:hover,.slide.title .ed:focus{background:#2C3742!important;box-shadow:0 0 0 4px #2C3742!important}

/* ============================ OVERVIEW ============================ */
.ov{position:fixed;inset:44px 0 30px 0;z-index:35;background:#10161E;overflow-y:auto;display:none;padding:20px}
body.ov-on .ov{display:block}
body.ov-on .stage{visibility:hidden}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;max-width:1500px;margin:0 auto}
.ovc{position:relative;cursor:pointer;border-radius:6px;overflow:hidden;background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.35);border:2px solid transparent}
.ovc:hover{border-color:var(--accent)}
.ovc.cur{border-color:#fff}
.ovc .mini{width:var(--W);height:var(--H);transform-origin:top left;pointer-events:none}
.ovc .shell{position:relative;overflow:hidden}
.ovc .lb{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.82));
  color:#fff;font-family:var(--f-mono);font-size:9.5px;padding:16px 8px 6px;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovc .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;
  font-family:var(--f-mono);font-size:9.5px;padding:2px 6px;border-radius:3px}
.ovsec{grid-column:1/-1;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7E8E9E;border-bottom:1px solid #29333F;padding:14px 0 7px;margin-top:6px}

/* ============================ NOTES ============================ */
.notes{
  position:fixed;right:0;top:44px;bottom:30px;width:340px;z-index:38;background:#131A23;
  border-left:1px solid #000;display:none;flex-direction:column;
}
body.notes-on .notes{display:flex}
.notes .nh{padding:12px 14px;border-bottom:1px solid #262F3B;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E8E9E}
.notes .nb{flex:1;overflow-y:auto;padding:12px 14px}
.notes .nxt{background:#0D131A;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.notes .nxt .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#5D6C7B;margin-bottom:5px}
.notes .nxt .t{font-family:var(--f-ui);font-size:13px;color:#C6D3DF;line-height:1.35}
.notes textarea{
  width:100%;min-height:280px;background:#0D131A;border:1px solid #262F3B;border-radius:6px;
  color:#D2DCE6;padding:11px 12px;font-family:var(--f-body);font-size:14px;line-height:1.55;resize:vertical;
}
.notes textarea:focus{outline:none;border-color:var(--accent)}
.notes .tip{font-family:var(--f-mono);font-size:9.5px;color:#4F5D6B;line-height:1.7;margin-top:12px}

/* ============================ MODAL ============================ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,17,.72);display:none;padding:26px}
.modal.on{display:flex;align-items:center;justify-content:center}
.sheet{background:#fff;border-radius:10px;width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.sheet header h3{margin:0;font-family:var(--f-ui);font-size:15px;font-weight:650;flex:1}
.sheet .mb{padding:0;flex:1;overflow:auto;min-height:0}
.sheet textarea{width:100%;height:56vh;border:0;padding:16px 20px;font-family:var(--f-mono);font-size:11.5px;
  line-height:1.6;resize:none;outline:none;background:#F7F9FB;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.mbtn{font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:6px;
  border:1px solid var(--rule);background:#fff;color:var(--ink)}
.mbtn:hover{border-color:var(--ink-3)}
.mbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.help{padding:6px 20px 20px}
.help table{width:100%;border-collapse:collapse;font-size:13.5px}
.help td{padding:7px 10px;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
.help td:first-child{width:150px}
.help kbd{font-family:var(--f-mono);font-size:11px;background:#EEF3F8;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--ink)}
.help h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:20px 0 6px}

/* search */
.srch{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:55;width:min(680px,92vw);display:none}
body.srch-on .srch{display:block}
.srch input{width:100%;padding:13px 16px;border-radius:9px;border:1px solid #33404E;background:#0D131A;
  color:#E4EBF2;font-family:var(--f-ui);font-size:15px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.srch input:focus{outline:none;border-color:var(--accent)}
.sres{margin-top:6px;background:#131A23;border:1px solid #262F3B;border-radius:9px;max-height:52vh;
  overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sres button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid #1E2732;color:#C0CDD9}
.sres button:hover{background:#1C2530;color:#fff}

332\" y=\"283.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">serial</text><rect x=\"584\" y=\"46\" width=\"260\" height=\"300\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"584\" y=\"46\" width=\"260\" height=\"5\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"600\" y=\"78\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">NIfTI and volumes</text><text x=\"600\" y=\"96\" font-size=\"10\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">.nii .nii.gz .mha .zarr</text><circle cx=\"605\" cy=\"120\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"616\" y=\"124.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">An affine matrix maps voxel</text><text x=\"616\" y=\"137.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">indices to world millimetres</text><circle cx=\"605\" cy=\"155.0\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"616\" y=\"159.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">RAS versus LPS: get the</text><text x=\"616\" y=\"172.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">convention wrong and left</text><text x=\"616\" y=\"186.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">becomes right</text><circle cx=\"605\" cy=\"203.5\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"616\" y=\"207.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Spacing is usually anisotropic</text><text x=\"616\" y=\"221.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">— 0.7 × 0.7 × 5.0 mm is normal</text><circle cx=\"605\" cy=\"238.5\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"616\" y=\"242.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">No patient tags by design, but</text><text x=\"616\" y=\"256.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the face is still in the voxels</text><rect x=\"868\" y=\"46\" width=\"260\" height=\"300\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"868\" y=\"46\" width=\"260\" height=\"5\" rx=\"2\" fill=\"#8A6A12\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"884\" y=\"78\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Whole-slide images</text><text x=\"884\" y=\"96\" font-size=\"10\" text-anchor=\"start\" fill=\"#8A6A12\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">.svs .ndpi .mrxs</text><rect x=\"884.0\" y=\"122\" width=\"168\" height=\"32\" rx=\"4\" fill=\"#E7D3A6\" stroke=\"#8A6A12\" stroke-width=\"1.4\"/><text x=\"968\" y=\"143\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">40x</text><path d=\"M968 155 L968.0 153.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M968.0 160.0 L972.4 151.0 L963.6 151.0 z\" fill=\"#8494A5\"/><rect x=\"906.0\" y=\"162\" width=\"124\" height=\"32\" rx=\"4\" fill=\"#F3E7CC\" stroke=\"#8A6A12\" stroke-width=\"1.4\"/><text x=\"968\" y=\"183\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">20x</text><path d=\"M968 195 L968.0 193.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M968.0 200.0 L972.4 191.0 L963.6 191.0 z\" fill=\"#8494A5\"/><rect x=\"925.0\" y=\"202\" width=\"86\" height=\"32\" rx=\"4\" fill=\"#F3E7CC\" stroke=\"#8A6A12\" stroke-width=\"1.4\"/><text x=\"968\" y=\"223\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">10x</text><path d=\"M968 235 L968.0 233.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M968.0 240.0 L972.4 231.0 L963.6 231.0 z\" fill=\"#8494A5\"/><rect x=\"943.0\" y=\"242\" width=\"50\" height=\"32\" rx=\"4\" fill=\"#F3E7CC\" stroke=\"#8A6A12\" stroke-width=\"1.4\"/><text x=\"968\" y=\"263\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">2.5x</text><text x=\"1114\" y=\"142\" font-size=\"9\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">level 0</text><text x=\"1114\" y=\"262\" font-size=\"9\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">thumb</text><circle cx=\"889\" cy=\"286\" r=\"3.2\" fill=\"#8A6A12\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"900\" y=\"290.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">One slide can be 100,000 px</text><text x=\"900\" y=\"303.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">wide and several GB — it never</text><text x=\"900\" y=\"317.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">loads at once. Read tiles at a</text><text x=\"900\" y=\"330.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">chosen level.</text><rect x=\"16\" y=\"358\" width=\"556\" height=\"94\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"384\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Stored value is not physical value</text><text x=\"36\" y=\"406\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Apply the rescale first, then assert the result lies in a plausible</text><text x=\"36\" y=\"422\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Hounsfield range. Every CT pipeline bug starts here.</text><text x=\"36\" y=\"440\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">HU = RescaleSlope × stored + RescaleIntercept</text><rect x=\"578\" y=\"358\" width=\"556\" height=\"94\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"384\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">Window and level is a display convention</text><text x=\"598\" y=\"406\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">It is a look-up table applied for a human eye. The pixels do not change. A</text><text x=\"598\" y=\"422\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">model trained on 8-bit PNGs exported from a viewer has silently inherited</text><text x=\"598\" y=\"438\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">one radiologist's window — and everything outside it is gone.</text></svg>", "f_aspect": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">The source is 3:4. The network wants 1:1. Three answers, three different objects</text><rect x=\"16\" y=\"44\" width=\"347\" height=\"296\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"16\" y=\"44\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"34\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Squash</text><text x=\"34\" y=\"94\" font-size=\"11\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">resize, ignore aspect</text><rect x=\"42\" y=\"108\" width=\"84\" height=\"112\" rx=\"5\" fill=\"#E9EFF5\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"84\" cy=\"164\" r=\"22\" fill=\"#9FB6C9\" stroke=\"#8494A5\" stroke-width=\"1.2\"/><text x=\"84\" y=\"236\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">source 3:4</text><path d=\"M134 164 L157.0 164.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M164.0 164.0 L155.0 159.6 L155.0 168.4 z\" fill=\"#8494A5\"/><rect x=\"174\" y=\"108\" width=\"112\" height=\"112\" rx=\"5\" fill=\"#E9EFF5\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><ellipse cx=\"230.0\" cy=\"164.0\" rx=\"29.3\" ry=\"22\" fill=\"#9FB6C9\" stroke=\"#8494A5\" stroke-width=\"1.2\"/><text x=\"230\" y=\"236\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">circle became an ellipse</text><line x1=\"34\" y1=\"254\" x2=\"345\" y2=\"254\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"34\" y=\"276\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Every object is stretched by 4/3 horizontally.</text><text x=\"34\" y=\"291\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Any class defined by shape — a nodule, a</text><text x=\"34\" y=\"306\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">vehicle type, a character — is now a different</text><text x=\"34\" y=\"321\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">shape.</text><rect x=\"401\" y=\"44\" width=\"347\" height=\"296\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"401\" y=\"44\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"419\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Centre crop</text><text x=\"419\" y=\"94\" font-size=\"11\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">cut to the square</text><rect x=\"427\" y=\"108\" width=\"84\" height=\"112\" rx=\"5\" fill=\"#E9EFF5\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"469\" cy=\"164\" r=\"22\" fill=\"#9FB6C9\" stroke=\"#8494A5\" stroke-width=\"1.2\"/><text x=\"469\" y=\"236\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">source 3:4</text><path d=\"M519 164 L542.0 164.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M549.0 164.0 L540.0 159.6 L540.0 168.4 z\" fill=\"#8494A5\"/><rect x=\"559\" y=\"108\" width=\"112\" height=\"112\" rx=\"5\" fill=\"#E9EFF5\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"615\" cy=\"164\" r=\"22\" fill=\"#9FB6C9\" stroke=\"#8494A5\" stroke-width=\"1.2\"/><rect x=\"427\" y=\"108\" width=\"84\" height=\"14\" rx=\"0\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\" opacity=\"0.34\"/><rect x=\"427\" y=\"206\" width=\"84\" height=\"14\" rx=\"0\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\" opacity=\"0.34\"/><text x=\"615\" y=\"236\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">shape kept, content cut</text><line x1=\"419\" y1=\"254\" x2=\"730\" y2=\"254\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"419\" y=\"276\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Geometry is preserved and content is lost.</text><text x=\"419\" y=\"291\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Whatever sat in the top and bottom eighth of</text><text x=\"419\" y=\"306\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the frame has left the dataset without a log</text><text x=\"419\" y=\"321\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">line.</text><rect x=\"786\" y=\"44\" width=\"347\" height=\"296\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"786\" y=\"44\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"804\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Letterbox</text><text x=\"804\" y=\"94\" font-size=\"11\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">scale to fit, pad the rest</text><rect x=\"812\" y=\"108\" width=\"84\" height=\"112\" rx=\"5\" fill=\"#E9EFF5\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"854\" cy=\"164\" r=\"22\" fill=\"#9FB6C9\" stroke=\"#8494A5\" stroke-width=\"1.2\"/><text x=\"854\" y=\"236\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">source 3:4</text><path d=\"M904 164 L927.0 164.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M934.0 164.0 L925.0 159.6 L925.0 168.4 z\" fill=\"#8494A5\"/><rect x=\"944\" y=\"108\" width=\"112\" height=\"112\" rx=\"5\" fill=\"#E9EFF5\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"944\" y=\"108\" width=\"112\" height=\"14\" rx=\"0\" fill=\"#C3CCD4\" stroke=\"none\" stroke-width=\"1.4\"/><rect x=\"944\" y=\"206\" width=\"112\" height=\"14\" rx=\"0\" fill=\"#C3CCD4\" stroke=\"none\" stroke-width=\"1.4\"/><circle cx=\"1000\" cy=\"164\" r=\"16.5\" fill=\"#9FB6C9\" stroke=\"#8494A5\" stroke-width=\"1.2\"/><text x=\"1000\" y=\"236\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">shape kept, resolution spent</text><line x1=\"804\" y1=\"254\" x2=\"1115\" y2=\"254\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"804\" y=\"276\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Geometry preserved, nothing discarded, but you</text><text x=\"804\" y=\"291\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">spend 25% of the pixels on grey and the</text><text x=\"804\" y=\"306\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">padding value becomes a feature the model can</text><text x=\"804\" y=\"321\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">key on.</text><rect x=\"16\" y=\"356\" width=\"556\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"382\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Interpolation is a per-tensor decision, not a global one</text><text x=\"36\" y=\"404\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Bilinear, bicubic or Lanczos for the image; nearest-neighbour for masks and</text><text x=\"36\" y=\"420\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">label maps, because anything else invents classes that do not exist.</text><text x=\"36\" y=\"436\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Anti-alias when downsampling or you fold texture into the batch as noise.</text><rect x=\"578\" y=\"356\" width=\"556\" height=\"96\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"382\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">FixRes — the train/test resolution discrepancy</text><text x=\"598\" y=\"404\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">RandomResizedCrop at train and CenterCrop at test present objects at</text><text x=\"598\" y=\"420\" font-size=\"11.5\" text-anchor=\ sharray=\"3 3\" opacity=\"0.75\"/><rect x=\"16\" y=\"356\" width=\"556\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"382\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The pixels never changed</text><text x=\"36\" y=\"404\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Windowing is a look-up table for a human retina. Exporting 8-bit PNGs from a</text><text x=\"36\" y=\"420\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">viewer bakes one clinician's choice into your dataset permanently. Keep the</text><text x=\"36\" y=\"436\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">raw stored values, apply the rescale, and let the model see the full range.</text><rect x=\"578\" y=\"356\" width=\"556\" height=\"96\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"382\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">What nnU-Net does for CT instead</text><text x=\"598\" y=\"404\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Pool foreground intensities across the dataset, clip at the 0.5 and 99.5</text><text x=\"598\" y=\"420\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">percentiles, then z-score with the global mean and standard deviation —</text><text x=\"598\" y=\"436\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">legitimate here precisely because HU is an absolute scale.</text></svg>", "f_stain": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"22\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">The same tissue, two laboratories, three ways to make the colours agree</text><r d to one reference</text><line x1=\"34\" y1=\"186\" x2=\"345\" y2=\"186\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"34\" y=\"206.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Match the mean and variance of each channel to</text><text x=\"34\" y=\"220.5\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">a reference image in a decorrelated colour</text><text x=\"34\" y=\"235.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">space. Fast and trivial to implement.</text><text x=\"34\" y=\"258\" font-size=\"11\" text-anchor=\"start\" fill=\"#8A3B4E\" font-weight=\"400\">Weak on the least-dominant channel; a global</text><text x=\"34\" y=\"272\" font-size=\"11\" text-anchor=\"start\" fill=\"#8A3B4E\" font-weight=\"400\">statistic cannot separate two stains.</text><rect x=\"401\" y=\"44\" width=\"347\" height=\"254\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"401\" y=\"44\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"419\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Macenko (2009)</text><text x=\"419\" y=\"94\" font-size=\"11\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">colour deconvolution</text><rect x=\"425\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#E3CFE6\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"470.5616\" cy=\"133.712\" r=\"6.6080000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"453.1904\" cy=\"115.904\" r=\"5.292\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"435.8192\" cy=\"131.696\" r=\"3.9760000000000004\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"455.408\" cy=\"113.888\" r=\"5.46\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"438.03679999999997\" cy=\"129.68\" r=\"4.144\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><text x=\"453\" y=\"170\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">lab A</text><rect x=\"489\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#F0DCC4\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"511.2768\" cy=\"112.544\" r=\"4.844\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"530.8656\" cy=\"128.336\" r=\"6.328000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"513.4944\" cy=\"144.128\" r=\"5.0120000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"533.0832\" cy=\"126.32\" r=\"6.496000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"515.712\" cy=\"142.112\" r=\"5.180000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><text x=\"517\" y=\"170\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">lab B</text><path d=\"M557 128 L582.0 128.0\" fill=\"none\" stroke=\"#0F7A6A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M589.0 128.0 L580.0 123.6 L580.0 132.4 z\" fill=\"#0F7A6A\"/><rect x=\"599\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#E9D6E9\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"644.5616\" cy=\"133.712\" r=\"6.6080000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"627.1904\" cy=\"115.904\" r=\"5.292\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"609.8192\" cy=\"131.696\" r=\"3.9760000000000004\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"629.408\" cy=\"113.888\" r=\"5.46\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"612.0368\" cy=\"129.68\" r=\"4.144\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><rect x=\"663\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#E9D6E9\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"685.2768\" cy=\"112.544\" r=\"4.844\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"704.8656\" cy=\"128.336\" r=\"6.328000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"687.4944\" cy=\"144.128\" r=\"5.0120000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"707.0832\" cy=\"126.32\" r=\"6.496000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"689.712\" cy=\"142.112\" r=\"5.180000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><text x=\"663\" y=\"170\" font-size=\"9\" text-anchor=\"middle\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">normalised to one reference</text><line x1=\"419\" y1=\"186\" x2=\"730\" y2=\"186\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"419\" y=\"206.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Estimate the two stain vectors from the</text><text x=\"419\" y=\"220.5\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">optical-density plane, then re-mix onto the</text><text x=\"419\" y=\"235.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">reference stain matrix.</text><text x=\"419\" y=\"258\" font-size=\"11\" text-anchor=\"start\" fill=\"#8A3B4E\" font-weight=\"400\">Fails outright when the stain-vector estimate</text><text x=\"419\" y=\"272\" font-size=\"11\" text-anchor=\"start\" fill=\"#8A3B4E\" font-weight=\"400\">fails — sparse tissue, pen marks, fat.</text><rect x=\"786\" y=\"44\" width=\"347\" height=\"254\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"786\" y=\"44\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"804\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Vahadane (2016)</text><text x=\"804\" y=\"94\" font-size=\"11\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">sparse stain separation</text><rect x=\"810\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#E3CFE6\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"850.0176\" cy=\"128.672\" r=\"6.188000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"832.6464\" cy=\"144.464\" r=\"4.872000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"852.2352\" cy=\"126.656\" r=\"6.356000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"834.864\" cy=\"142.448\" r=\"5.040000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"854.4528\" cy=\"124.64\" r=\"6.524000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><text x=\"838\" y=\"170\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">lab A</text><rect x=\"874\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#F0DCC4\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"890.7328\" cy=\"141.10399999999998\" r=\"4.424\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"910.3216\" cy=\"123.296\" r=\"5.908\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"892.9504\" cy=\"139.088\" r=\"4.5920000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"912.5391999999999\" cy=\"121.28\" r=\"6.0760000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"895.168\" cy=\"137.072\" r=\"4.760000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><text x=\"902\" y=\"170\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">lab B</text><path d=\"M942 128 L967.0 128.0\" fill=\"none\" stroke=\"#6A4C93\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M974.0 128.0 L965.0 123.6 L965.0 132.4 z\" fill=\"#6A4C93\"/><rect x=\"984\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#E9D6E9\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"1024.0176\" cy=\"128.672\" r=\"6.188000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1006.6464\" cy=\"144.464\" r=\"4.872000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1026.2352\" cy=\"126.656\" r=\"6.356000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1008.864\" cy=\"142.448\" r=\"5.040000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1028.4528\" cy=\"124.64\" r=\"6.524000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><rect x=\"1048\" y=\"100\" width=\"56\" height=\"56\" rx=\"5\" fill=\"#E9D6E9\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"1064.7328\" cy=\"141.10399999999998\" r=\"4.424\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1084.3216\" cy=\"123.296\" r=\"5.908\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1066.9504\" cy=\"139.088\" r=\"4.5920000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1086.5392\" cy=\"121.28\" r=\"6.0760000000000005\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><circle cx=\"1069.168\" cy=\"137.072\" r=\"4.760000000000001\" fill=\"#C9A8C4\" stroke=\"#9B7C97\" stroke-width=\"1\"/><text x=\"1048\" y=\"170\" font-size=\"9\" text-anchor=\"middle\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">normalised to one reference</text><line x1=\"804\" y1=\"186\" x2=\"1115\" y2=\"186\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"804\" y=\"206.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Non-negative sparse factorisation into stain</text><text x=\"804\" y=\"220.5\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">density maps, preserving which structure each</text><text x=\"804\" y=\"235.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">stain actually marks.</text><text x=\"804\" y=\"258\" font-size=\"11\" text-anchor=\"start\" fill=\"#8A3B4E\" font-weight=\"400\">Best structure preservation of the three; the</text><text x=\"804\" y=\"272\" font-size=\"11\" text-anchor=\"start\" fill=\"#8A3B4E\" font-weight=\"400\">slowest, and still reference-dependent.</text><rect x=\"16\" y=\"312\" width=\"556\" height=\"140\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"338\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">No single method dominates</text><text x=\"36\" y=\"360\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Multicentre benchmarks find that the ranking flips with the metric and with</text><text x=\"36\" y=\"376\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the cohort: the method that best preserves structure is not the one that</text><text x=\"36\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">best matches colour statistics. Deep alternatives such as StainGAN and</text><text x=\"36\" y=\"408\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">StainNet swap the failure mode rather than removing it. Choose by downstream</text><text x=\"36\" y=\"424\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">external-centre performance, and report which reference image you used — it</text><text x=\"36\" y=\"440\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">is a hyper-parameter, and it must not come from the test centre.</text><rect x=\"578\" y=\"312\" width=\"556\" height=\"140\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"338\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">Tellez et al., Medical Image Analysis, 2019</text><text x=\"598\" y=\"360\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Their systematic comparison finds that stain augmentation — deliberately</text><text x=\"598\" y=\"376\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">perturbing the stain during training — often generalises better than stain</text><text x=\"598\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">normalisation alone. The two are not exclusive, and the combination is</text><text x=\"598\" y=\"408\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">usually the strongest option. The general lesson is worth stating out loud:</text><text x=\"598\" y=\"424\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">teaching a model to tolerate a nuisance factor beats trying to erase it from</text><text x=\"598\" y=\"440\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the data, because your eraser will itself fail on the next centre.</text></svg>", "f_capturegate": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Refusing bad input at capture time</text><text x=\"20\" y=\"44\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">mass opisthorchiasis screening with a rapid diagnostic test</text><rect x=\"20\" y=\"58\" width=\"560\" height=\"152\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"80\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">THE PIPELINE IN THE FIELD</text><rect x=\"34\" y=\"94\" width=\"108\" height=\"52\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"88.0\" y=\"117.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">phone</text><text x=\"88.0\" y=\"133.0\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">capture</text><path d=\"M144 120 L161.0 120.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M168.0 120.0 L159.0 115.6 L159.0 124.4 z\" fill=\"#8494A5\"/><rect x=\"176\" y=\"90\" width=\"148\" height=\"60\" rx=\"8\" fill=\"#E6F3F0\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"250.0\" y=\"117.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">capture-quality</text><text x=\"250.0\" y=\"133.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">YOLOv5m</text><path d=\"M326 108 L349.2363554227913 101.80363855392233\" fill=\"none\" stroke=\"#0F7A6A\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M356.0 100.0 L346.2 98.1 L348.4 106.6 z\" fill=\"#0F7A6A\"/><path d=\"M326 134 L350.35516502901004 151.86045435460738\" fill=\"none\" stroke=\"#A3384F\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M356.0 156.0 L351.3 147.1 L346.1 154.2 z\" fill=\"#A3384F\"/><rect x=\"364\" y=\"76\" width=\"200\" height=\"46\" rx=\"8\" fill=\"#E2E9F1\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"464.0\" y=\"104.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">grading model</text><rect x=\"364\" y=\"140\" width=\"200\" height=\"46\" rx=\"8\" fill=\"#F9E7EB\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"464.0\" y=\"159.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">reject — capture again</text><text x=\"464.0\" y=\"175.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">now</text><path d=\"M 464 188 L 464 202 L 250 202 L 250 154\" fill=\"none\" stroke=\"#A3384F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><text x=\"348\" y=\"195\" font-size=\"9\" text-anchor=\"middle\" fill=\"#A3384F\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">while the patient is still there</text><rect x=\"20\" y=\"222\" width=\"560\" height=\"130\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"244\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">THREE DATASETS, THREE JOBS</text><rect x=\"36\" y=\"254\" width=\"166\" height=\"84\" rx=\"7\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"119\" y=\"288\" font-size=\"25\" text-anchor=\"middle\" fill=\"#2D5C8A\" font-weight=\"700\">8,624</text><text x=\"119\" y=\"308\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">expert-annotated test images</text><text x=\"119\" y=\"324\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">6,900 train / 1,724 test</text><rect x=\"214\" y=\"254\" width=\"166\" height=\"84\" rx=\"7\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"297\" y=\"288\" font-size=\"25\" text-anchor=\"middle\" fill=\"#0F7A6A\" font-weight=\"700\">574</text><text x=\"297\" y=\"308\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">images to train the gate</text><text x=\"297\" y=\"324\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">capture-quality model</text><rect x=\"392\" y=\"254\" width=\"166\" height=\"84\" rx=\"7\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"475\" y=\"288\" font-size=\"25\" text-anchor=\"middle\" fill=\"#6A4C93\" font-weight=\"700\">200</text><text x=\"475\" y=\"308\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">images to evaluate the gate</text><text x=\"475\" y=\"324\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">100 good / 100 failed</text><rect x=\"20\" y=\"364\" width=\"560\" height=\"78\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"388\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">The quality gate needs its own dataset and its own metric</text><text x=\"38\" y=\"408\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">In a field deployment the largest quality win is usually not a better</text><text x=\"38\" y=\"422\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">classifier. It is a second model whose only job is to refuse an unusable</text><text x=\"38\" y=\"436\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">image before it ever enters the dataset.</text><rect x=\"20\" y=\"452\" width=\"560\" height=\"54\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"474\" font-size=\"10\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Junsawang, Techasen, Wiratchawa, Wanna, Wongphutorn, Worasith, Sithithaworn,</text> ppears only in long schedules — and on a small clinical set</text><text x=\"36\" y=\"420\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">heavy mixing can wash the finding out entirely. AugMix (Hendrycks et al.,</text><text x=\"36\" y=\"436\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">ICLR 2020) is the same family, aimed at corruption robustness.</text><rect x=\"578\" y=\"340\" width=\"556\" height=\"112\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"366\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">What mixing does to your label space</text><text x=\"598\" y=\"388\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Soft labels break hard-label metrics and every calibration assumption, so</text><text x=\"598\" y=\"404\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">report calibration against an un-mixed validation set. In detection and</text><text x=\"598\" y=\"420\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">segmentation the mixed example must stay geometrically valid, or the</text><text x=\"598\" y=\"436\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">augmentation is quietly manufacturing label noise.</text></svg>", "f_randtrivial": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"22\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">How many knobs does an augmentation policy actually need?</text><rect x=\"16\" y=\"44\" width=\"347\" height=\"292\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"16\" y=\"44\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"34\" y=\" h=\"10\" height=\"22\" rx=\"2\" fill=\"#E1E8EF\" stroke=\"none\" stroke-width=\"1.4\"/><rect x=\"1115.0\" y=\"302\" width=\"10\" height=\"22\" rx=\"2\" fill=\"#E1E8EF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"200.0\" y=\"342\" font-size=\"10\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">hits the peak, but inherits the cut detector's errors</text><text x=\"1120.0\" y=\"342\" font-size=\"10\" text-anchor=\"end\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">2 event frames captured</text><rect x=\"16\" y=\"364\" width=\"556\" height=\"88\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"390\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Clip length against coverage</text><text x=\"36\" y=\"412\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A long clip is likely to contain the event and is mostly near-duplicate</text><text x=\"36\" y=\"427\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">frames; a short clip is cheap and may contain nothing. Segment-based</text><text x=\"36\" y=\"442\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">sampling (Wang et al., TSN 2016) is the standard compromise.</text><rect x=\"578\" y=\"364\" width=\"556\" height=\"88\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"390\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">And then there is the split (§0.3.7)</text><text x=\"598\" y=\"412\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Frames one second apart are almost perfectly correlated, so a frame-level</text><text x=\"598\" y=\"427\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">random split is measuring memorisation. Group by camera and by session,</text ment</text><text x=\"419\" y=\"94\" font-size=\"11\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">offset in ms against days</text><line x1=\"459\" y1=\"134.0\" x2=\"713\" y2=\"134.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"459\" y1=\"168.0\" x2=\"713\" y2=\"168.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"459\" y1=\"202.0\" x2=\"713\" y2=\"202.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"459\" y1=\"236\" x2=\"713\" y2=\"236\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"459\" y1=\"100\" x2=\"459\" y2=\"236\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"459.0\" y1=\"236\" x2=\"459.0\" y2=\"241\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"459.0\" y=\"256\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">0</text><line x1=\"543.6666666666666\" y1=\"236\" x2=\"543.6666666666666\" y2=\"241\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"543.6666666666666\" y=\"256\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">30</text><line x1=\"628.3333333333334\" y1=\"236\" x2=\"628.3333333333334\" y2=\"241\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"628.3333333333334\" y=\"256\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">60</text><line x1=\"713.0\" y1=\"236\" x2=\"713.0\" y2=\"241\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"713.0\" y=\"256\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" f \"347\" height=\"268\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"786\" y=\"44\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"804\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Masking is part of ingest</text><text x=\"804\" y=\"94\" font-size=\"11\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">static ROI · dynamic blur</text><rect x=\"810\" y=\"96\" width=\"300\" height=\"140\" rx=\"6\" fill=\"#DDE5EC\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"810\" y=\"184\" width=\"300\" height=\"52\" rx=\"0\" fill=\"#C6D2DE\" stroke=\"none\" stroke-width=\"1.4\"/><path d=\"M1006 102 L1104 102 L1104 180 L986 180 z\" fill=\"#5E6B78\" stroke=\"#4B5A6B\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.86\"/><text x=\"1046\" y=\"144\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">static ROI mask</text><text x=\"1046\" y=\"160\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#DCE4EC\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">neighbour's door</text><circle cx=\"844\" cy=\"168\" r=\"12\" fill=\"#9FB6C9\" stroke=\"none\" stroke-width=\"1.4\"/><circle cx=\"917\" cy=\"182\" r=\"11\" fill=\"#9FB6C9\" stroke=\"none\" stroke-width=\"1.4\"/><rect x=\"832\" y=\"126\" width=\"24\" height=\"24\" rx=\"3\" fill=\"#8494A5\" stroke=\"#A3384F\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"861\" y=\"146\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">face</text><rect x=\"906\" y=\"142\" width=\"22\" height=\"22\" rx=\"3\" fill=\"#8494A5\" stroke=\"#A3384F\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"933\" y=\"160\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">face</text><rect x=\"836\" y=\"196\" width=\"60\" height=\"22\" rx=\"3\" fill=\"#8494A5\" stroke=\"#A3384F\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"901\" y=\"214\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">plate</text><text x=\"804\" y=\"262.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Blur before the frame is written to disk, or</text><text x=\"804\" y=\"276.5\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the archive itself is the disclosure.</text><rect x=\"16\" y=\"324\" width=\"556\" height=\"128\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"350\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Sync is a data-preparation problem, not an IT problem</text><text x=\"36\" y=\"372\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A 300 ms offset makes cross-camera association wrong for anything that</text><text x=\"36\" y=\"387\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">moves, and a few milliseconds per hour becomes seconds over a season.</text><text x=\"36\" y=\"402\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Measure the offset with a shared event, store the corrected timestamp beside</text><text x=\"36\" y=\"417\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the raw one, and treat an un-synced camera as a failed sensor rather than a</text><text x=\"36\" y=\"432\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">noisy one. Re-calibrate after any physical knock: extrinsics are not</text><text x=\"36\" y=\"447\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">permanent.</text><rect x=\"578\" y=\"324\" width=\"556\" height=\"128\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"350\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">Preprocessing must be identical on the edge</text><text x=\"598\" y=\"372\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">The device decodes with its own codec, resizes with its own kernel and</text><text x=\"598\" y=\"387\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">converts colour with its own matrix. If training used a different resize,</text><text x=\"598\" y=\"402\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">you have shipped a different model. Export the exact deployment transform,</text><text x=\"598\" y=\"417\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">run a replay test that asserts the two tensors match to tolerance, and pin</text><text x=\"598\" y=\"432\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the pair — this is training/serving skew (§0.8.6) with a camera attached.</text></svg>", "f_fingerprint": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"22\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">A preprocessing plan derived by stated rules from measured dataset properties</text><rect x=\"16\" y=\"52\" width=\"330\" height=\"296\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"16\" y=\"52\" width=\"330\" height=\"5\" rx=\"2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"34\" y=\"84\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">1 · Dataset fingerprint</text><text x=\"34\" y=\"102\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">measured, not assumed</text><circle cx=\"39\" cy=\"126\" r=\"3.2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"50\" y=\"130.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">image shapes and the number of cases</text><circle cx=\"39\" cy=\"147.5\" r=\"3.2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"50\" y=\"151.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">voxel spacing: median, and the anisotropy ratio</text><circle cx=\"39\" cy=\"169.0\" r=\"3.2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"50\" y=\"173.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">modality — CT, MRI, or other</text><circle cx=\"39\" cy=\"190.5\" r=\"3.2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"50\" y=\"194.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">intensity distribution of foreground voxels</text><circle cx=\"39\" cy=\"212.0\" r=\"3.2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"50\" y=\"216.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">class ratios and label volumes</text><rect x=\"386\" y=\"52\" width=\"280\" height=\"296\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"386\" y=\"52\" width=\"280\" height=\"5\" rx=\"2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"404\" y=\"84\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">2 · Rules</text><text x=\"404\" y=\"102\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">explicit heuristics</text><circle cx=\"409\" cy=\"126\" r=\"3.2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"420\" y=\"130.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">CT → clip at 0.5 / 99.5 pct, global</text><text x=\"420\" y=\"143.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">z-score</text><circle cx=\"409\" cy=\"161.0\" r=\"3.2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"420\" y=\"165.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">MRI → per-case z-score</text><circle cx=\"409\" cy=\"182.5\" r=\"3.2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"420\" y=\"186.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">resample to the median spacing</text><circle cx=\"409\" cy=\"204.0\" r=\"3.2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"420\" y=\"208.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">anisotropic axis handled separately</text><circle cx=\"409\" cy=\"225.5\" r=\"3.2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"420\" y=\"229.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">crop to the non-zero bounding box</text><circle cx=\"409\" cy=\"247.0\" r=\"3.2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"420\" y=\"251.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">grow the patch until GPU memory is</text><text x=\"420\" y=\"264.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">spent</text><circle cx=\"409\" cy=\"282.0\" r=\"3.2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"420\" y=\"286.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">depth follows patch size; batch ≥ 2</text><rect x=\"706\" y=\"52\" width=\"428\" height=\"296\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"706\" y=\"52\" width=\"428\" height=\"5\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"724\" y=\"84\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">3 · Configuration</text><text x=\"724\" y=\"102\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">written out, runnable</text><circle cx=\"729\" cy=\"126\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"740\" y=\"130.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">target spacing + interpolation order</text><circle cx=\"729\" cy=\"147.5\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"740\" y=\"151.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">normalisation scheme, per modality</text><circle cx=\"729\" cy=\"169.0\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"740\" y=\"173.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">foreground crop and patch size</text><circle cx=\"729\" cy=\"190.5\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"740\" y=\"194.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">batch size and pooling depth per axis</text><circle cx=\"729\" cy=\"212.0\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"740\" y=\"216.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">2D / 3D full-resolution / 3D cascade</text><circle cx=\"729\" cy=\"233.5\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"740\" y=\"237.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">fixed augmentation: rotation, scaling, elastic, gamma, simulated</text><text x=\"740\" y=\"251.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">low resolution, mirroring</text><circle cx=\"729\" cy=\"268.5\" r=\"3.2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"740\" y=\"272.5\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">5-fold cross-validation, then post-processing chosen on</text><text x=\"740\" y=\"286.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">validation</text><path d=\"M350 200 L373.0 200.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M380.0 200.0 L371.0 195.6 L371.0 204.4 z\" fill=\"#8494A5\"/><path d=\"M670 200 L693.0 200.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M700.0 200.0 L691.0 195.6 L691.0 204.4 z\" fill=\"#8494A5\"/><text x=\"365\" y=\"188\" font-size=\"9\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\"></text><rect x=\"16\" y=\"360\" width=\"556\" height=\"92\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"386\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Isensee et al., Nature Methods, 2021</text><text x=\"36\" y=\"408\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Preprocessing, architecture, training and post-processing set with no manual</text><text x=\"36\" y=\"423\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">tuning, matching the field across many segmentation challenges — with an</text><text x=\"36\" y=\"438\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">unremarkable U-Net. The network was never the interesting variable.</text><rect x=\"578\" y=\"360\" width=\"556\" height=\"92\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"598\" y=\"386\" font-size=\"13\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">Two things to take from it</text><text x=\"598\" y=\"408\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">First, this is what a Methods section should look like: every choice</text><text x=\"598\" y=\"423\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">traceable to a measured property. Second, it is the honest baseline — beat</text><text x=\"598\" y=\"438\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the out-of-the-box configuration or you have not shown anything.</text></svg>", "f_bitnet": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">BiTNet: ultrasound screening of the biliary tract</text><text x=\"20\" y=\"44\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">upper-abdominal abnormalities, including cholangiocarcinoma</text><rect x=\"20\" y=\"58\" width=\"560\" height=\"104\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"36\" y=\"76\" width=\"68\" height=\"68\" rx=\"5\" fill=\"#E9EFF5\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><circle cx=\"70.0\" cy=\"110.0\" r=\"22.44\" fill=\"#5D6B7A\" stroke=\"none\" stroke-width=\"1.4\"/><circle cx=\"75.44\" cy=\"105.92\" r=\"6.12\" fill=\"#D7DEE5\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"70\" y=\"156\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">ultrasound</text><path d=\"M110 110 L129.0 110.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M136.0 110.0 L127.0 105.6 L127.0 114.4 z\" fill=\"#8494A5\"/><rect x=\"144\" y=\"80\" width=\"190\" height=\"60\" rx=\"8\" fill=\"#E6F3F0\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"239.0\" y=\"107.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">BiTNet</text><text x=\"239.0\" y=\"123.0\" font-size=\"9.5\" text-anchor=\"middl
