3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"304\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">READING WITH BITNET AS AN ASSISTING TOOL</text><line x1=\"78\" y1=\"392\" x2=\"478\" y2=\"392\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><rect x=\"118\" y=\"354.0\" width=\"52\" height=\"38.0\" rx=\"4\" fill=\"#8494A5\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"144\" y=\"346.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">0.50</text><text x=\"144\" y=\"407\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">without</text><rect x=\"180\" y=\"335.76\" width=\"52\" height=\"56.24\" rx=\"4\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"206\" y=\"327.76\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">0.74</text><text x=\"206\" y=\"407\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">with</text><text x=\"175\" y=\"422\" font-size=\"10\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">mean accuracy</text><rect x=\"310\" y=\"357.04\" width=\"52\" height=\"34.96\" rx=\"4\" fill=\"#8494A5\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"336\" y=\"349.04\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">0.46</text><text x=\"336\" y=\"407\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">without</text><rect x=\"372\" y=\"345.64\" width=\"52\" height=\"46.36\" rx=\"4\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"398\" y=\"337.64\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">0.61</text><text x=\"398\" y=\"407\" font-size=\"9\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">with</text><text x=\"367\" y=\"422\" font-size=\"10\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">precision</text><text x=\"560\" y=\"340\" font-size=\"11\" text-anchor=\"end\" fill=\"#0F7A6A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">p &lt; 0.001</text><text x=\"560\" y=\"356\" font-size=\"9.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">11 professionals,</text><text x=\"560\" y=\"370\" font-size=\"9.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">four experience levels</text><rect x=\"20\" y=\"442\" width=\"560\" height=\"64\" rx=\"9\" fill=\"#F3F9F7\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"464\" font-size=\"10\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Intharah, Wiratchawa, Wanna, Junsawang, Techasen, Worasith, Sithithaworn &amp;</text><text x=\"38\" y=\"477\" font-size=\"10\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Khuntikeo. Artificial Intelligence in Medicine, 2023. The paper also releases an</text><text x=\"38\" y=\"490\" font-size=\"10\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">ultrasound image dataset for the human biliary tract.</text></svg>"}, "slides": [{"kind": "title", "kick": "Research Master · Data Science and Machine Learning", "title": "Image and video data", "lead": "Where preprocessing is least separable from the model: the augmentation policy is part of the architecture, and in medical imaging the normalisation recipe often matters more than the network.", "meta": "<b>Chapter 3 of 4</b> &nbsp;·&nbsp; Data Preparation for Machine Learning and AI<br>Thanapong Intharah &nbsp;·&nbsp; Visual Intelligence Laboratory &nbsp;·&nbsp; Khon Kaen University<br>Maps to weeks 9, 10 and 11 of the twelve-week plan", "notes": "Open by asking what the first three lines of their image dataloader do. Almost everyone says resize, to-tensor, normalise with the ImageNet mean and standard deviation. Ask why those numbers. Nobody knows. That is the chapter in one exchange."}, {"kind": "split", "sec": "3.0", "secTitle": "Why this chapter is different", "kick": "Orientation", "title": "Preprocessing is not a pre-step here", "wide": "text", "lead": "In Chapters 1 and 2 the transform chain sits before the model and can be reasoned about separately. In vision it cannot.", "b": ["<b>The augmentation policy is a modelling decision.</b> It states which transformations must not change the answer — which is a claim about the world, enforced through the loss.", "<b>The normalisation recipe can outweigh the architecture.</b> nnU-Net wins segmentation challenges with an unremarkable U-Net and a preprocessing plan derived from the data.", "<b>The artefact you deploy is the pair.</b> Weights without their transform chain are not a model; they are half of one.", "<b>Self-supervised learning makes this explicit.</b> There is no label, so the augmentation distribution <em>is</em> the task.", "<b>And the data is heavy.</b> A slide is gigabytes, a camera-year is terabytes. Every decision here has an I/O cost attached."], "fig": "f_partofarch", "figcap": "The block diagram everyone draws, and the artefact that actually ships. A change to either half is a change to the product.", "callout": {"h": "The organising claim", "p": "<b>A preprocessing change is an architecture change</b> — and in a regulated medical product, literally a device change. Version-pin the transform chain with the weights."}, "notes": "Ask the room to name the resize interpolation used by their last project. Then ask what their deployment code uses. In my experience roughly half of applied projects have a mismatch and have never checked."}, {"kind": "cols", "title": "What you should be able to do by the end", "kick": "Learning outcomes", "sm": true, "cols": [{"sub": "Handle", "h": "Get the pixels right", "b": ["Read DICOM, NIfTI and whole-slide images without corrupting the values", "Apply rescale slope and intercept, and explain why windowing is not normalisation", "Choose an aspect-ratio and interpolation policy and defend it", "Resample a volume to a target spacing with anisotropy handled per axis"]}, {"sub": "Design", "h": "Derive the invariance set from the task", "b": ["Write the augmentation list from the physics of acquisition, not from a library", "Say why a chest radiograph is never flipped vertically", "Construct SSL views that preserve the diagnostic signal", "Ablate augmentation at a fixed compute budget"], "acc": true}, {"sub": "Curate", "h": "Build and audit an image corpus", "b": ["Deduplicate perceptually and semantically before splitting", "Build a capture-quality gate with its own dataset and metric", "Report what a CLIP-score filter removed, and from whom", "Split by patient, site, camera and session — never by frame"]}, {"sub": "Ship", "h": "Make it reproducible and lawful", "b": ["Version-pin a transform chain alongside the weights", "Find PHI burned into pixels that no tag-scrubber catches", "Match training preprocessing to on-device preprocessing exactly", "Report against CLAIM and TRIPOD+AI"]}], "notes": "The four verbs again: handle, design, curate, ship. Lab 8 and Lab 9 in Chapter 4 assess the middle two directly.", "cites": ["Radford et al. <i>Learning Transferable Visual Models From Natural Language Supervision (CLIP).</i> ICML, 2021.", "Mongan et al. <i>Checklist for Artificial Intelligence in Medical Imaging (CLAIM).</i> Radiology: Artificial Intelligence, 2020.", "Collins et al. <i>TRIPOD+AI statement.</i> BMJ, 2024."], "sec": "3.0", "secTitle": "Why this chapter is different"}, {"kind": "table", "title": "The eleven sections of this chapter", "kick": "Chapter map", "sm": true, "table": {"head": ["Section", "What it settles", "Week"], "rows": [["3.1 Acquisition, formats and I/O", "What the bytes actually mean, and what it costs to read them", "9"], ["3.2 Geometric standardisation", "Resize, crop, orientation, spacing — and what each does to object geometry", "9"], ["3.3 Intensity normalisation", "The section where medical imaging stops looking like ImageNet", "9"], ["3.4 Cleaning and curating image datasets", "Integrity, duplicates, quality gates, label errors, privacy filters", "9"], ["3.5 Standard augmentation", "Deriving the invariance set from the task rather than from a library", "10"], ["3.6 Mixing and learned augmentation", "Mixup, CutMix, copy-paste, and the search that turned out to be unnecessary", "10"], ["3.7 Generative and synthetic images", "When a realistic-looking scan is still clinically impossible", "10"], ["3.8 Self-supervised and image-text pipelines", "View construction as the task; CLIP-score filtering and DataComp", "10–11"], ["3.9 Video and CCTV", "Frame sampling, sync and drift, privacy masking, edge parity", "10"], ["3.10 Medical imaging specifics", "The dataset fingerprint, patient and site splits, defacing, regulation", "11"], ["3.11 Reduction and efficiency for vision", "Coresets, the filtering track, and resolution as the real lever", "11"]]}, "callout": {"h": "How to use the deck", "p": "Press <b>E</b> to edit any line in place, <b>N</b> for the speaker-notes panel, <b>O</b> for the slide grid, and <b>P</b> to print a handout with notes underneath each slide."}, "notes": "Sections 3.3, 3.9 and 3.10 carry the most weight for this cohort. If time is short, set 3.7 as reading — it is largely Chapter 0 §0.6 with pixels.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Yun et al. <i>CutMix: Regularization Strategy to Train Strong Classifiers with Localizable Features.</i> ICCV, 2019.", "Gadre et al. <i>DataComp: In search of the next generation of multimodal datasets.</i> NeurIPS Datasets & Benchmarks, 2023."], "sec": "3.0", "secTitle": "Why this chapter is different"}, {"kind": "divider", "sec": "3.1", "secTitle": "Acquisition, formats and I/O", "no": "3.1", "title": "Acquisition, formats and I/O", "lead": "Before any transform: what do the bytes mean, who is hiding in them, and what does it cost to read a million of them?", "chips": ["Natural-image formats", "DICOM", "Whole-slide pyramids", "Hidden identifiers", "Colour spaces and bit depth", "Throughput", "Video containers"]}, {"kind": "figure", "title": "Four format families, four different contracts", "kick": "3.1.1–3.1.3", "tag": "textbook", "lead": "A JPEG hands you display-ready 8-bit colour. A DICOM hands you an integer array and a promise you must redeem yourself.", "fig": "f_formats", "figcap": "<b>The single most common medical-imaging bug:</b> training on stored values without applying <span class='k'>RescaleSlope</span> and <span class='k'>RescaleIntercept</span>, so the model learns one scanner's offset instead of the anatomy.", "notes": "Concrete war story: a CT model that generalised badly between two hospitals because one exported with intercept −1024 and the other with 0. Both looked fine on screen. Ask the room how they would have caught it — the answer is an assertion that air is near −1000 HU.", "sec": "3.1", "secTitle": "Acquisition, formats and I/O"}, {"kind": "bullets", "title": "The identifiers your scrubber will miss", "kick": "3.1.4", "tag": "both", "lead": "De-identification in imaging is three separate jobs, and most teams do only the first.", "b": ["<b>Tags.</b> DICOM carries name, ID, birth date, accession number, institution, referring physician and device serial. Anonymisation profiles exist; use one, and record which.", "<b>Pixels.</b> Ultrasound, endoscopy, fluoroscopy and most screen-captured modalities <b>burn the patient banner into the image itself</b>. No tag scrubber will ever touch it. You need OCR or a fixed-region mask, plus a manual audit of a random sample.", "<b>Private and sequence tags.</b> Vendor-private blocks and the <span class='k'>ImageComments</span> free-text field routinely contain what somebody typed in a hurry.", "<b>Geometry.</b> A head CT or MRI is a 3D scan of a face. Schwarz et al.<sup class=\"fn\">1</sup> (<i>NEJM</i>, 2019) matched surface renders to photographs with off-the-shelf face recognition — so defacing is a de-identification step, not a courtesy (§3.10).", "<b>EXIF.</b> On phone-captured clinical photography, GPS coordinates and device identity ride along by default.", "<b>The audit that actually works:</b> sample 100 images at random after the pipeline and look at them. Every time we have done this, something got through."], "callout": {"h": "Order of operations", "p": "De-identify at ingest, before the data lands anywhere reusable. Retrofitting privacy onto an already-shared export is not a task, it is an incident."}, "notes": "For a Thai cohort, connect to PDPA and to the IRB text they will actually have to write. Ask who has ever run OCR over their own image set. Usually nobody.", "cites": ["Schwarz et al. <i>Identification of Anonymous MRI Research Participants with Face-Recognition Software.</i> NEJM, 2019."], "sec": "3.1", "secTitle": "Acquisition, formats and I/O"}, {"kind": "table", "title": "Throughput: the loader is the bottleneck before the GPU is", "kick": "3.1.6–3.1.7", "tag": "both", "sm": true, "lead": "A sawtooth GPU-utilisation graph is a data-preparation bug, not a modelling one.", "table": {"head": ["Choice", "Use it for", "Why it matters"], "rows": [["WebDataset / TFRecord shards", "Large natural-image and frame corpora", "Sequential reads at line rate; 200k small files on a network filesystem will starve the GPU no matter how fast it is"], ["Zarr / HDF5, chunked", "3D volumes and whole-slide images", "Partial reads of one chunk; essential when a single item exceeds RAM"], ["Pre-decoded fixed-size arrays", "Small images, many epochs", "Removes JPEG decode from the hot loop entirely, at the cost of disk"], ["GPU decode (NVIDIA DALI, nvJPEG)", "Decode-bound pipelines", "Moves JPEG decode and resize off the CPU; often a 2–3× loader speed-up before any model change"], ["Video: sparse seek vs sequential decode", "Clip sampling from long recordings", "Seeking to an arbitrary frame costs a keyframe interval of decoding; variable frame rate makes frame index and timestamp disagree"], ["Pre-extracted frames or tiles", "CCTV and whole-slide training", "Trades storage for determinism and speed, and makes the sampling policy explicit and auditable"]]}, "callout": {"h": "Diagnostic", "p": "Profile the loader before you touch the architecture. Time one epoch with the model replaced by a no-op. If the epoch time barely changes, the model was never the constraint."}, "notes": "Mention that for video, frame index and presentation timestamp diverge under variable frame rate — which quietly breaks any annotation keyed on frame number. This bites CCTV work constantly.", "sec": "3.1", "secTitle": "Acquisition, formats and I/O"}, {"kind": "refs", "title": "Section 3.1 — references", "kick": "Reading", "sm": true, "refs": ["Szeliski. <b>Computer Vision: Algorithms and Applications</b>, 2nd ed., 2022; Gonzalez &amp; Woods, <b>Digital Image Processing</b>.", "<b>DICOM PS3</b> standard, NEMA — in particular the attribute confidentiality profiles for de-identification.", "Goode, Gilbert, Harkes, Jukic &amp; Satyanarayanan. <b>OpenSlide: A vendor-neutral software foundation for digital pathology.</b> <i>Journal of Pathology Informatics</i>, 2013.", "Schwarz et al. <b>Identification of Anonymous MRI Research Participants with Face-Recognition Software.</b> <i>NEJM</i>, 2019.", "Tooling: pydicom, SimpleITK, ITK, nibabel, OpenSlide, tifffile, Zarr, WebDataset, NVIDIA DALI, PyAV / FFmpeg, decord.", "Chapter 0 §0.8.7 for storage formats and §0.7.1 for the de-identification frame that this section instantiates."], "sec": "3.1", "secTitle": "Acquisition, formats and I/O"}, {"kind": "divider", "sec": "3.2", "secTitle": "Geometric standardisation", "no": "3.2", "title": "Geometric standardisation", "lead": "Making every input the same shape is not a formality. It is the step where object geometry, and sometimes the label, quietly changes.", "chips": ["Interpolation", "Aspect-ratio policy", "Cropping and FixRes", "Canonical orientation", "EXIF rotation", "3D voxel spacing", "Registration", "Foreground cropping"]}, {"kind": "figure", "title": "The source is 3:4. The network wants 1:1.", "kick": "3.2.1–3.2.3", "tag": "textbook", "lead": "Three standard answers. They are not interchangeable, and only one of them is usually right for your task.", "fig": "f_aspect", "figcap": "Pick the policy from the task: <b>squash</b> when shape is irrelevant and framing is not, <b>centre crop</b> when the subject is reliably central, <b>letterbox</b> when geometry is diagnostic — which in medical imaging it usually is.", "notes": "Ask which policy their favourite library uses by default. torchvision's Resize with a single int preserves aspect ratio; with a tuple it squashes. Most people do not know which one they wrote.", "cites": ["Touvron et al. <i>Fixing the train-test resolution discrepancy (FixRes).</i> NeurIPS, 2019."], "sec": "3.2", "secTitle": "Geometric standardisation"}, {"kind": "bullets", "title": "Canonical orientation, spacing, and the silent label-scrambler", "kick": "3.2.4–3.2.7", "tag": "both", "b": ["<b>EXIF orientation is a trap.</b> Some decoders honour the flag, some ignore it. A dataset read with two different libraries contains the same photograph in two orientations — and if the label depends on left versus right, half of them are now wrong. <b>Fix:</b> normalise orientation once at ingest and strip the flag.", "<b>RAS versus LPS.</b> NIfTI and DICOM disagree about which way the axes point. Reorient every volume to one canonical convention on read, then assert it. Getting this wrong turns a left-sided finding into a right-sided one with no visible symptom.", "<b>Radiograph laterality.</b> The L/R marker is part of the image. A horizontal flip destroys it and manufactures anatomy that does not occur — see §3.5.", "<b>3D resampling.</b> Choose the target spacing from the dataset distribution — the median is the defensible default — and treat a strongly anisotropic axis separately, because interpolating 5 mm slices to 1 mm invents structure that was never measured.", "<b>Registration</b> — rigid, affine or deformable — aligns time points, modalities or an atlas. It is preprocessing with a failure mode: a bad registration is worse than none, so score it and reject.", "<b>Foreground cropping</b> to the non-zero or tissue bounding box removes computation without removing anatomy. Free accuracy per unit compute, and one of nnU-Net's standard steps."], "callout": {"h": "The assertion to add today", "p": "After loading, assert the spacing, the orientation code and the intensity range. Three lines. They will catch more real bugs than any validation-set metric you monitor."}, "notes": "The EXIF story is worth telling slowly: it is the cleanest example in the whole course of a preprocessing detail that silently corrupts labels rather than degrading them visibly.", "sec": "3.2", "secTitle": "Geometric standardisation"}, {"kind": "splitr", "title": "Cropping to the region, then asking the model where it looked", "kick": "From the VI Lab", "tag": "both", "wide": "text", "cls": "vilab", "lead": "OPG-SHAP — age and sex estimation from dental panoramic radiographs, on a 943-patient Thai X-ray dataset.", "b": ["<b>The preprocessing is the method.</b> A panoramic radiograph is mostly background and mandible; the signal for age sits in a few anatomical regions. YOLO detects those regions, and the classifier sees crops rather than the whole film.", "<b>Why this is a data slide.</b> Region cropping raises the effective resolution of the informative pixels at fixed compute — the trade-off revisited in §3.11 — and it removes the scanner border, which is exactly the kind of shortcut a network will otherwise take.", "<b>Attribution as dataset debugging.</b> SHAP over the detected regions answers which anatomy drove the prediction. If the attribution lands on the image border or a fixed corner artefact, the finding is about the machine, not the patient.", "<b>Small, real and clinical.</b> 943 patients is a normal size for a hospital study and an abnormal size for a vision paper. Everything in this chapter has to survive that regime."], "fig": "f_opgshap", "figcap": "Detect the regions, crop, predict, then attribute back to the regions. The attribution is a check on the dataset as much as on the model.", "notes": "Use this to make the general point: explanation methods are usually sold as model tools, but their highest-value use in a small clinical project is finding out that your dataset has a shortcut in it.", "cites": ["Lundberg & Lee. <i>A Unified Approach to Interpreting Model Predictions (SHAP).</i> NeurIPS, 2017.", "Hirunchavarod et al. <i>OPG-SHAP: A Dental AI Tool for Explaining Learned Orthopantomogram Image Recognition.</i> ITC-CSCC, 2024."], "sec": "3.2", "secTitle": "Geometric standardisation"}, {"kind": "refs", "title": "Section 3.2 — references", "kick": "Reading", "sm": true, "refs": ["Touvron, Vedaldi, Douze &amp; Jégou. <b>Fixing the train-test resolution discrepancy (FixRes).</b> <i>NeurIPS</i>, 2019.", "Isensee, Jaeger, Kohl, Petersen &amp; Maier-Hein. <b>nnU-Net: a self-configuring method for deep learning-based biomedical image segmentation.</b> <i>Nature Methods</i>, 2021 — for target spacing and foreground cropping.", "Hirunchavarod, Dangsungnoen, Thongprasant, Phuphatham, Prathansap, Sributsayakarn, Pornprasertsuk-Damrongsri, Jirarattanasopha &amp; Intharah. <b>OPG-SHAP: A Dental AI Tool for Explaining Learned Orthopantomogram Image Recognition.</b> <i>ITC-CSCC</i>, 2024.", "Lundberg &amp; Lee. <b>A Unified Approach to Interpreting Model Predictions (SHAP).</b> <i>NeurIPS</i>, 2017.", "Redmon, Divvala, Girshick &amp; Farhadi. <b>You Only Look Once.</b> <i>CVPR</i>, 2016 — the detector family used for region proposal.", "Tooling: SimpleITK and ITK for resampling and registration, ANTs for deformable registration, torchvision v2 and Albumentations for 2D geometry, MONAI for volumes."], "sec": "3.2", "secTitle": "Geometric standardisation"}, {"kind": "divider", "sec": "3.3", "secTitle": "Intensity normalisation", "no": "3.3", "title": "Intensity normalisation", "lead": "The section where medical imaging stops behaving like ImageNet. CT has absolute units, MRI has none, and histopathology has a different colour in every laboratory.", "chips": ["Dataset vs per-image statistics", "Scaling schemes", "Hounsfield units", "Windowing", "MRI arbitrary units", "Bias-field correction", "Stain normalisation", "Stain augmentation"]}, {"kind": "table", "title": "Which statistics do you fit, and on what?", "kick": "3.3.1–3.3.2", "tag": "textbook", "sm": true, "lead": "Every scheme below is a fitted transform. Chapter 0 §0.3.5 applies without modification: it is fitted on the training split only.", "table": {"head": ["Scheme", "What it assumes", "Where it breaks"], "rows": [["ImageNet mean / std", "Your images are natural photographs with a similar colour distribution", "Inherited by copy-paste into grayscale, 16-bit and single-channel medical data, where the numbers mean nothing"], ["Min–max to [0,1] or [−1,1]", "The extremes are meaningful and stable", "One hot pixel, one metal artefact, one burned-in caption rescales the entire image"], ["Per-image z-score", "Each image is its own reference; absolute level carries no information", "Correct for MRI. Wrong for CT, where you have just discarded a physically meaningful scale"], ["Dataset-level z-score", "Intensity is comparable across cases and devices", "Only defensible when the modality is calibrated — CT yes, MRI no, most cameras no"], ["Percentile clipping, then z-score", "Tails are artefact, the body of the distribution is signal", "The nnU-Net CT default (0.5 / 99.5). Choose the percentiles from the data and record them"], ["CLAHE, gamma, denoising", "Local contrast enhancement helps the model as it helps the eye", "Amplifies artefacts and noise as enthusiastically as findings; ablate it, never assume it"]]}, "callout": {"h": "The question to ask before choosing", "p": "Is the absolute intensity of a pixel physically meaningful? If yes (CT, some quantitative MRI, calibrated microscopy) use dataset statistics and preserve the scale. If no (most MRI, most cameras, most ultrasound) use per-image statistics and stop pretending."}, "notes": "Ask how many have used the ImageNet constants on grayscale medical data. Most hands go up. It is not fatal with a pretrained backbone, but nobody in the room chose it — it was inherited, and that is the problem.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012."], "sec": "3.3", "secTitle": "Intensity normalisation"}, {"kind": "figure", "title": "CT: an absolute scale, and a display convention", "kick": "3.3.3", "tag": "frontier", "lead": "Hounsfield units are physics. Window and level are a look-up table for a human retina. Confusing the two is the most consequential error in this section.", "fig": "f_windowing", "figcap": "Same voxels, three windows, three different-looking studies — and not one pixel value changed. <b>Baking a window into an 8-bit export is a permanent decision about which pathology remains visible.</b>", "notes": "Ask: if windowing is only display, why do so many published CT papers feed windowed images to the network? Two honest answers — pretrained RGB backbones, and it sometimes helps. Both are fine if stated and ablated; neither is fine if unexamined. Multi-window stacking as three channels is a reasonable middle path.", "sec": "3.3", "secTitle": "Intensity normalisation"}, {"kind": "bullets", "title": "MRI has no units", "kick": "3.3.4–3.3.5", "tag": "both", "lead": "The same tissue, the same patient, the same protocol, a different scanner: completely different numbers. Nothing in the physics fixes the scale.", "b": ["<b>Per-case z-scoring</b> is the sane default, and it is what nnU-Net does for non-CT modalities. Compute it over the foreground, not over a volume that is 60% air.", "<b>Histogram standardisation</b> (Nyúl &amp; Udupa<sup class=\"fn\">1</sup>, 1999) learns a set of intensity landmarks from a training cohort and piecewise-linearly maps every new scan onto them. It makes intensities comparable across scanners, which per-case z-scoring alone does not.", "<b>White-stripe</b> and similar tissue-referenced methods normalise to a reference tissue rather than to the whole-image distribution.", "<b>Bias-field correction</b> (N4ITK; Tustison et al.<sup class=\"fn\">2</sup>, <i>IEEE TMI</i>, 2010) removes the smooth, low-frequency intensity shading caused by coil inhomogeneity. It is slow, and it is the one step that genuinely belongs <em>before</em> normalisation — you cannot standardise a histogram that is smeared by a multiplicative field.", "<b>Order matters and is not commutative:</b> bias correction → skull strip or foreground mask → histogram standardisation → per-case z-score → resample. Write the order down; it is a result-affecting choice.", "<b>Site effects survive all of this.</b> When residual scanner signal remains, ComBat-style harmonisation (Johnson et al.<sup class=\"fn\">3</sup>, 2007; Fortin et al., 2018) models site as a batch effect — and site must be treated as a confounder to be modelled, not noise to be averaged away (§3.10)."], "callout": {"h": "Evaluation trap", "p": "Fitting histogram landmarks or ComBat parameters using scans from the external test site is leakage of type L1.2 (§0.3.3). It is extremely common in the harmonisation literature. Fit on training sites; apply to the held-out site."}, "notes": "The ComBat leakage point is worth dwelling on — it is subtle, it is published repeatedly, and students find it genuinely surprising that a 'harmonisation' step can be a leak.", "cites": ["Nyúl & Udupa. <i>On standardizing the MR image intensity scale.</i> Magnetic Resonance in Medicine, 1999.", "Tustison et al. <i>N4ITK: Improved N3 Bias Correction.</i> IEEE TMI, 2010.", "Johnson et al. <i>Adjusting batch effects in microarray expression data using empirical Bayes methods (ComBat).</i> Biostatistics, 2007."], "sec": "3.3", "secTitle": "Intensity normalisation"}, {"kind": "figure", "title": "Stain normalisation, and why augmentation often wins", "kick": "3.3.6–3.3.8", "tag": "both", "lead": "Two laboratories, two haematoxylin batches, two scanners: the same tissue in visibly different colours. Three classical answers, and a fourth that sidesteps the problem.", "fig": "f_stain", "figcap": "Reinhard<sup class=\"fn\">1</sup> (2001), Macenko<sup class=\"fn\">2</sup> (2009) and Vahadane (2016). <b>Multicentre benchmarks find no single method dominates on all metrics</b> — the ranking changes with the metric and the cohort. Tellez et al.<sup class=\"fn\">3</sup> (<i>MedIA</i>, 2019) find stain <em>augmentation</em> often generalises better than normalisation alone.", "notes": "The general principle is bigger than histopathology: teaching a model to tolerate a nuisance factor beats trying to erase it, because your eraser will itself fail on the next centre. Same argument reappears for camera colour pipelines in §3.9.", "cites": ["Reinhard et al. <i>Color Transfer between Images.</i> IEEE CG&A, 2001.", "Macenko et al. <i>A method for normalizing histology slides for quantitative analysis.</i> ISBI, 2009.", "Tellez et al. <i>Quantifying the effects of data augmentation and stain color normalization in convolutional….</i> Medical Image Analysis, 2019."], "sec": "3.3", "secTitle": "Intensity normalisation"}, {"kind": "refs", "title": "Section 3.3 — references", "kick": "Reading", "sm": true, "refs": ["Isensee, Jaeger, Kohl, Petersen &amp; Maier-Hein. <b>nnU-Net.</b> <i>Nature Methods</i>, 2021 — the 0.5 / 99.5 percentile clip and global z-score for CT, per-case z-score otherwise.", "Tustison, Avants, Cook, Zheng, Egan, Yushkevich &amp; Gee. <b>N4ITK: Improved N3 Bias Correction.</b> <i>IEEE TMI</i>, 2010.", "Nyúl &amp; Udupa. <b>On standardizing the MR image intensity scale.</b> <i>Magnetic Resonance in Medicine</i>, 1999.", "Shinohara et al. <b>Statistical normalization techniques for magnetic resonance imaging (white-stripe).</b> <i>NeuroImage: Clinical</i>, 2014.", "Reinhard, Ashikhmin, Gooch &amp; Shirley. <b>Color Transfer between Images.</b> <i>IEEE CG&amp;A</i>, 2001.", "Macenko et al. <b>A method for normalizing histology slides for quantitative analysis.</b> <i>ISBI</i>, 2009; Vahadane et al. <b>Structure-Preserving Color Normalization.</b> <i>IEEE TMI</i>, 2016.", "Tellez et al. <b>Quantifying the effects of data augmentation and stain color normalization in convolutional neural networks for computational pathology.</b> <i>Medical Image Analysis</i>, 2019.", "Johnson, Li &amp; Rabinovic. <b>Adjusting batch effects in microarray expression data using empirical Bayes methods (ComBat).</b> <i>Biostatistics</i>, 2007; Fortin et al., <i>NeuroImage</i>, 2018."], "sec": "3.3", "secTitle": "Intensity normalisation"}, {"kind": "divider", "sec": "3.4", "secTitle": "Cleaning and curating image datasets", "no": "3.4", "title": "Cleaning and curating image datasets", "lead": "Everything between “we have a folder of images” and “we have a dataset” — and the gate that stops bad input entering in the first place.", "chips": ["Integrity checks", "Perceptual and semantic dedup", "Split contamination", "Quality filters", "OOD screening", "Label errors", "Dense-task QC", "Privacy filtering"]}, {"kind": "cols", "title": "Four passes before you split anything", "kick": "3.4.1–3.4.5", "tag": "both", "sm": true, "lead": "In that order. Each pass is cheap, and each one changes what the next pass sees.", "cols": [{"sub": "Pass 1", "h": "Integrity", "b": ["Truncated, zero-byte and non-decodable files", "Grayscale stored as three identical RGB channels — and RGB stored as grayscale", "Unexpected bit depth, palette images, CMYK JPEGs", "Extension that disagrees with the magic bytes", "<b>Deliverable:</b> a manifest with a decode status per file"]}, {"sub": "Pass 2", "h": "Duplicates", "b": ["Exact: content hash — free, do it first", "Near: perceptual hashing (pHash, dHash) for crops, re-encodes and watermarks", "Semantic: embedding nearest neighbours, then SemDeDup-style within-cluster pruning (Abbas et al.<sup class=\"fn\">1</sup>, 2023)", "<b>Then</b> split — near-duplicates across the boundary are the classic vision inflation (§0.3.6)"], "acc": true}, {"sub": "Pass 3", "h": "Quality and protocol", "b": ["Blur (variance of Laplacian), exposure, resolution floor, extreme aspect ratios", "A <b>view or modality classifier</b> that rejects off-protocol acquisitions — a lateral film in a frontal cohort", "Compression level: a corpus mixing quality-95 and quality-40 JPEGs has a confound", "Every threshold here is a sampling decision; count what it removed"]}, {"sub": "Pass 4", "h": "Outliers and labels", "b": ["Embedding distance and density to surface scanner faults, wrong body parts, mis-filed studies", "Confident learning on classification labels (§0.4.8), then adjudicate the top flags by hand", "Geometric consistency for boxes and masks: zero-area, inverted, out-of-frame, duplicated instances", "Missing instances are invisible to every automatic check — sample and re-annotate"]}], "notes": "Emphasise the ordering. If you deduplicate after applying quality filters, you have thrown away the higher-quality member of some duplicate pairs. Ask the room what order they used last time; almost nobody has thought about it.", "cites": ["Abbas et al. <i>SemDeDup: Data-efficient learning at web-scale through semantic deduplication.</i> 2023."], "sec": "3.4", "secTitle": "Cleaning and curating image datasets"}, {"kind": "splitr", "title": "Refusing bad input at capture time", "kick": "From the VI Lab", "tag": "both", "wide": "text", "cls": "vilab", "lead": "An AI-enhanced rapid diagnostic testing platform for mass opisthorchiasis screening — where the biggest quality win was not a better classifier.", "b": ["<b>The dataset.</b> 8,624 expert-annotated rapid-test images, split 6,900 for training and 1,724 for test. That is the grading problem, and it is the part that looks like a normal vision paper.", "<b>The part that made it work in the field.</b> A separate <b>574-image</b> set trains a YOLOv5m <b>capture-quality model</b>, and a further <b>200-image</b> set — 100 good captures and 100 failed ones — evaluates it.", "<b>Why a second model, and not a threshold.</b> “Bad capture” means glare, partial cassette, motion blur, wrong distance, a finger over the window. That is a visual concept, so it needs a visual model, its own annotation protocol and its own metric.", "<b>The generalisable lesson.</b> A quality gate is not a utility bolted on at the end. It is a modelling problem with its own dataset, its own labels and its own error budget — and it belongs in the Methods section. Rejecting an image while the participant is still present costs seconds; discovering it in the analysis costs a repeat visit."], "fig": "f_capturegate", "figcap": "Three datasets doing three different jobs. Only the first would appear in a conventional results table.", "notes": "Connect back to Chapter 0 §0.3.7: the grouping unit here is the specimen, not the image. And ask the room what their own project's equivalent of a failed capture is — every applied project has one, and almost none of them have a model for it.", "cites": ["Junsawang et al. <i>AI-enhanced rapid diagnostic testing platform for mass opisthorchiasis screening.</i> Scientific Reports 15:31062, 2025."], "sec": "3.4", "secTitle": "Cleaning and curating image datasets"}, {"kind": "bullets", "title": "Dense-task QC, and filtering people out of the frame", "kick": "3.4.6–3.4.8", "tag": "both", "b": ["<b>For segmentation, the ceiling is inter-annotator Dice.</b> Have two annotators mark an overlap set, report their agreement, and stop celebrating a model that has reached it.", "<b>Boundary disagreement is not random.</b> It concentrates on ambiguous edges — exactly the voxels a Dice loss weights most. Report boundary-distance metrics alongside Dice, and adjudicate rather than average.", "<b>The failure automatic checks cannot see</b> is the instance nobody drew. Sample studies for a second full pass; a missing lesion trains the model that lesions are background.", "<b>Face, plate and NSFW filtering</b> are part of the pipeline for any web-scraped or surveillance corpus. Detect and blur at ingest, not on export.", "<b>Measure the cost of the blur.</b> Occluding faces removes information the detector may legitimately have been using; report accuracy with and without the privacy transform, and treat the gap as the price of compliance rather than pretending it is zero.", "<b>And measure the detector's recall.</b> A face blurrer that misses 3% of faces has not anonymised anything — it has produced a corpus in which the un-blurred people are the ones the model found hardest to see."], "callout": {"h": "Report the funnel", "p": "Publish the counts at every stage — files in, decoded, deduplicated, quality-passed, labelled, split — with subgroup breakdowns where you have them. It takes one table and it converts an unauditable pipeline into a reproducible one."}, "notes": "The 'un-blurred people are the hardest to see' point usually lands hard. It generalises: any imperfect privacy filter leaves a non-random residue.", "sec": "3.4", "secTitle": "Cleaning and curating image datasets"}, {"kind": "refs", "title": "Section 3.4 — references", "kick": "Reading", "sm": true, "refs": ["Abbas, Tirumala, Simig, Ganguli &amp; Morcos. <b>SemDeDup: Data-efficient learning at web-scale through semantic deduplication.</b> 2023.", "Northcutt, Athalye &amp; Mueller. <b>Pervasive Label Errors in Test Sets Destabilize Machine Learning Benchmarks.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2021 — roughly 6% of the ImageNet validation set.", "Northcutt, Jiang &amp; Chuang. <b>Confident Learning.</b> <i>JAIR</i> 70, 2021.", "Junsawang, Techasen, Wiratchawa, Wanna, Wongphutorn, Worasith, Sithithaworn, Bulathwela &amp; Intharah. <b>AI-enhanced rapid diagnostic testing platform for mass opisthorchiasis screening.</b> <i>Scientific Reports</i> 15:31062, 2025.", "Kirillov et al. <b>Segment Anything.</b> <i>ICCV</i>, 2023 — for annotation bootstrapping and mask QC.", "Tooling: cleanlab, imagededup, FAISS, fastdup, CVAT, Label Studio; Chapter 0 §0.4 for the annotation and label-noise material this section applies."], "sec": "3.4", "secTitle": "Cleaning and curating image datasets"}, {"kind": "divider", "sec": "3.5", "secTitle": "Standard augmentation", "no": "3.5", "title": "Standard augmentation", "lead": "Not a bag of tricks. A written statement of which transformations must not change the answer — which is a claim about the world.", "chips": ["Geometric", "Photometric", "Occlusion", "The invariance set", "Test-time augmentation", "Implementation stacks", "Order and determinism"]}, {"kind": "figure", "title": "Three families, one scene", "kick": "3.5.1–3.5.3", "tag": "textbook", "lead": "Geometric transforms buy invariance to pose and framing, photometric to illumination and sensor, occlusion to over-reliance on one patch.", "fig": "f_auggrid", "figcap": "Cutout (DeVries &amp; Taylor<sup class=\"fn\">1</sup>, 2017) and Random Erasing (Zhong et al.<sup class=\"fn\">2</sup>, <i>AAAI</i> 2020) are the occlusion family: they force the network to distribute evidence rather than key on a single discriminative region.", "notes": "For cross-scanner and cross-camera work the photometric row is worth more than the geometric one, and it is the row people tune least. Ask which row they spent time on last project.", "cites": ["DeVries & Taylor. <i>Improved Regularization of Convolutional Neural Networks with Cutout.</i> 2017.", "Zhong et al. <i>Random Erasing Data Augmentation.</i> AAAI, 2020."], "sec": "3.5", "secTitle": "Standard augmentation"}, {"kind": "figure", "title": "The invariance set must come from the task", "kick": "3.5.4", "tag": "textbook", "lead": "Every cell in this table is a claim about what can physically happen. Fill it in before you write the pipeline, not after the first disappointing validation curve.", "fig": "f_invariance", "figcap": "Histopathology tiles are genuinely rotation- and flip-invariant, because a slide has no canonical orientation. A chest radiograph has exactly one. <b>Never vertically flip a chest X-ray.</b>", "notes": "This is the slide to slow down on and the one to examine on. Make each group fill the column for their own project on the board. The arguments inside groups are the learning. Dermoscopy is the instructive one: hue is diagnostic, so colour jitter has to be bounded, not free.", "sec": "3.5", "secTitle": "Standard augmentation"}, {"kind": "bullets", "title": "Test-time augmentation, and the parts nobody writes down", "kick": "3.5.5–3.5.7", "tag": "both", "b": ["<b>Test-time augmentation</b> averages predictions over transformed copies. It reliably buys a small accuracy gain and better-behaved uncertainty, at a multiple of inference cost — which on an edge device is a decision, not a free win.", "<b>TTA must use the same invariance set as training.</b> Averaging over a flip the task does not have is not ensembling; it is adding noise to the mean.", "<b>Where it runs.</b> CPU worker processes are the default and the usual bottleneck; Kornia and NVIDIA DALI move the work to the GPU; MONAI provides the dictionary-based transforms that keep image and mask in step for volumes.", "<b>Order is not commutative.</b> Crop-then-jitter and jitter-then-crop produce different distributions; normalise last, after every spatial and photometric operation, or your statistics no longer describe the tensor you feed the network.", "<b>Determinism.</b> Seed per worker and per epoch, or you cannot reproduce a batch — which means you cannot debug one either. Record the augmentation config with the run, exactly as you record the learning rate.", "<b>Augment the training split only.</b> Applying a random transform to validation makes the metric a random variable and hides regressions inside its variance."], "callout": {"h": "Ablate at a fixed budget", "p": "Augmentation and training length trade against each other: heavier augmentation needs longer schedules to pay off. Comparing an augmented 100-epoch run against a plain 100-epoch run measures both effects at once. Fix the compute, vary one thing."}, "notes": "The normalise-last rule catches people constantly: they normalise in the dataset class, then apply colour jitter in the collate function, and wonder why the mean drifted.", "sec": "3.5", "secTitle": "Standard augmentation"}, {"kind": "refs", "title": "Section 3.5 — references", "kick": "Reading", "sm": true, "refs": ["Shorten &amp; Khoshgoftaar. <b>A survey on Image Data Augmentation for Deep Learning.</b> <i>Journal of Big Data</i>, 2019 — the standard survey.", "Krizhevsky, Sutskever &amp; Hinton. <b>ImageNet Classification with Deep Convolutional Neural Networks.</b> <i>NeurIPS</i>, 2012 — where augmentation became standard practice.", "DeVries &amp; Taylor. <b>Improved Regularization of Convolutional Neural Networks with Cutout.</b> 2017.", "Zhong, Zheng, Kang, Li &amp; Yang. <b>Random Erasing Data Augmentation.</b> <i>AAAI</i>, 2020.", "Buslaev, Iglovikov, Khvedchenya, Parinov, Druzhinin &amp; Kalinin. <b>Albumentations: Fast and Flexible Image Augmentations.</b> <i>Information</i>, 2020.", "Tooling: torchvision v2 transforms, Albumentations, Kornia (differentiable, GPU), MONAI transforms for medical volumes, NVIDIA DALI."], "sec": "3.5", "secTitle": "Standard augmentation"}, {"kind": "divider", "sec": "3.6", "secTitle": "Mixing and learned augmentation", "no": "3.6", "title": "Mixing and learned augmentation", "lead": "Building training examples that were never photographed, and the two-year search for a policy that a uniform random draw turned out to match.", "chips": ["Mixup", "CutMix", "AugMix", "Copy-paste", "AutoAugment", "RandAugment", "TrivialAugment", "3D augmentation", "Task constraints"]}, {"kind": "figure", "title": "Mixup, CutMix and copy-paste", "kick": "3.6.1–3.6.4, 3.6.7", "tag": "both", "lead": "Three ways to synthesise an example, three different assumptions about where the evidence for a label lives.", "fig": "f_mixing", "figcap": "Copy-paste (Ghiasi et al.<sup class=\"fn\">1</sup>, <i>CVPR</i> 2021) is the one to reach for first in medical detection and segmentation: it directly addresses rare classes and small lesions, and it needs instance masks you often already have.", "notes": "The CutMix caveat is the teaching point — an area-proportional label assumes evidence is spread uniformly. For a 12-pixel nodule in a 512-pixel image that assumption is simply false, and the method quietly manufactures label noise.", "cites": ["Ghiasi et al. <i>Simple Copy-Paste is a Strong Data Augmentation Method for Instance Segmentation.</i> CVPR, 2021.", "Yun et al. <i>CutMix: Regularization Strategy to Train Strong Classifiers with Localizable Features.</i> ICCV, 2019.", "Hendrycks et al. <i>AugMix.</i> ICLR, 2020."], "sec": "3.6", "secTitle": "Mixing and learned augmentation"}, {"kind": "figure", "title": "The search that turned out to be unnecessary", "kick": "3.6.5–3.6.6, 3.6.9", "tag": "frontier", "lead": "AutoAugment searched a policy space with reinforcement learning. RandAugment reduced it to two numbers. TrivialAugment removed the numbers.", "fig": "f_randtrivial", "figcap": "RandAugment reaches <b>85.0%</b> on ImageNet with EfficientNet-B7. TrivialAugment is <b>parameter-free</b> — one random augmentation at random strength — and matches or beats the tuned methods. Cite this whenever someone proposes a search.", "notes": "Ask the room what the honest baseline for their own method is. The TrivialAugment result is the vision instance of §0.5.8, and it is the single most useful anecdote in this chapter for improving how they design experiments. Also mention nnU-Net's 3D augmentation set — rotation, scaling, elastic, gamma, simulated low resolution, mirroring — which is fixed, not searched, and works across dozens of datasets.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Cubuk et al. <i>AutoAugment.</i> CVPR, 2019.", "Cubuk et al. <i>RandAugment: Practical automated data augmentation with a reduced search space.</i> NeurIPS, 2020."], "sec": "3.6", "secTitle": "Mixing and learned augmentation"}, {"kind": "refs", "title": "Section 3.6 — references", "kick": "Reading", "sm": true, "refs": ["Zhang, Cissé, Dauphin &amp; Lopez-Paz. <b>mixup: Beyond Empirical Risk Minimization.</b> <i>ICLR</i>, 2018.", "Yun, Han, Oh, Chun, Choe &amp; Yoo. <b>CutMix: Regularization Strategy to Train Strong Classifiers with Localizable Features.</b> <i>ICCV</i>, 2019.", "Hendrycks, Mu, Cubuk, Zoph, Gilmer &amp; Lakshminarayanan. <b>AugMix.</b> <i>ICLR</i>, 2020.", "Ghiasi, Cui, Srinivas, Qian, Lin, Cubuk, Le &amp; Zoph. <b>Simple Copy-Paste is a Strong Data Augmentation Method for Instance Segmentation.</b> <i>CVPR</i>, 2021.", "Cubuk, Zoph, Mané, Vasudevan &amp; Le. <b>AutoAugment.</b> <i>CVPR</i>, 2019; Lim et al., <b>Fast AutoAugment</b>, <i>NeurIPS</i> 2019; Ho et al., <b>Population Based Augmentation</b>, <i>ICML</i> 2019.", "Cubuk, Zoph, Shlens &amp; Le. <b>RandAugment: Practical automated data augmentation with a reduced search space.</b> <i>NeurIPS</i>, 2020.", "Müller &amp; Hutter. <b>TrivialAugment: Tuning-free Yet State-of-the-Art Data Augmentation.</b> <i>ICCV</i>, 2021.", "Isensee et al. <b>nnU-Net.</b> <i>Nature Methods</i>, 2021 — the fixed 3D augmentation pipeline."], "sec": "3.6", "secTitle": "Mixing and learned augmentation"}, {"kind": "divider", "sec": "3.7", "secTitle": "Generative and synthetic images", "no": "3.7", "title": "Generative and synthetic images", "lead": "Sometimes the right answer, rarely the easy one — and in medicine a realistic-looking scan can still be clinically impossible.", "chips": ["GAN augmentation", "Diffusion and inpainting", "Domain randomisation", "Anatomical plausibility", "FID and its limits", "Feedback loops"]}, {"kind": "cols", "title": "Four routes, four different reasons", "kick": "3.7.1–3.7.4", "tag": "frontier", "sm": true, "lead": "Chapter 0 §0.6.1 asked which of five motivations you have. Here is what each one buys in vision.", "cols": [{"sub": "Route 1", "h": "Class-conditional GAN synthesis", "b": ["Generate more of a rare finding", "Mode collapse and limited fidelity remain the standard failure", "Gains are usually small and highly dataset-specific", "<b>Ask first:</b> would 200 more real annotated cases be cheaper?"]}, {"sub": "Route 2", "h": "Diffusion, conditioned", "b": ["Text- and mask-conditioned generation gives controllable attributes", "<b>Inpainting-based lesion insertion</b> into real background is the most credible medical use — the anatomy stays real", "Lets you build a stress set: same lesion, varied size, site and contrast", "Mark every generated file at creation (§0.6.6)"], "acc": true}, {"sub": "Route 3", "h": "Simulation and domain randomisation", "b": ["Render scenes and randomise nuisance parameters — lighting, texture, pose, camera", "The strongest option when the scenario exists but was never captured: night-time CCTV, an occlusion pattern, a rare vehicle", "Sim-to-real gap is the whole research problem", "Tobin et al.<sup class=\"fn\">1</sup>, <i>IROS</i> 2017"]}, {"sub": "Route 4", "h": "Constrained generation", "b": ["A plausible-looking scan can be anatomically impossible: a structure on the wrong side, an implausible size, a physically inconsistent intensity", "Constrain with anatomy: masks, atlases, shape priors, physics-based forward models", "<b>Have a clinician look at 50 samples.</b> This is the cheapest and most informative evaluation available"]}], "notes": "Inpainting-based lesion insertion is the one to recommend for clinical projects — you keep real anatomy and vary only the finding, which also gives you a controllable sensitivity experiment.", "cites": ["Tobin et al. <i>Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World.</i> IROS, 2017."], "sec": "3.7", "secTitle": "Generative and synthetic images"}, {"kind": "bullets", "title": "Evaluating synthetic images, and the loop to avoid", "kick": "3.7.5–3.7.6", "tag": "frontier", "lead": "FID is a convenience, not a verdict. The decisive metric is downstream utility on real held-out data.", "b": ["<b>FID and KID compare feature statistics under an ImageNet-trained Inception network</b> — a feature space with no reason to be meaningful for CT, MRI or histology. They are also sensitive to sample size and to the implementation, so numbers are not comparable across papers.", "<b>The protocol that means something</b> is Chapter 0's: train on synthetic, test on real (TSTR), always against a real-data baseline <em>at the same size</em>, plus coverage and per-subgroup counts to detect collapse.", "<b>Expert visual Turing test.</b> Mix real and synthetic, ask clinicians to classify, and report their accuracy — near 50% is the only version of “realistic” that a reviewer will accept.", "<b>Privacy is not optional here.</b> A generator trained on 400 scans can memorise them. Report distance-to-closest-record and a membership-inference result, or you have shipped the training set in a new format.", "<b>The feedback loop.</b> Once synthetic images circulate, the next model trains on them. Shumailov et al.<sup class=\"fn\">3</sup> (<i>Nature</i> 631:755–759, 2024) show the tails go first — the rare presentation, the unusual anatomy, the minority phenotype.", "<b>Which is why provenance marking is the whole game.</b> Mark at creation, keep the flag through every downstream join, and refuse any evaluation set that cannot prove it is real."], "callout": {"h": "Cross-reference", "p": "The fidelity–utility–privacy trilemma and the mixing-ratio result from Chapter 0 §0.6 apply here unchanged. Nothing about pixels makes the evaluation discipline easier — if anything, the fact that synthetic images <em>look</em> convincing makes it harder."}, "notes": "Make the point that a synthetic image is far more persuasive to a human than a synthetic table, which is exactly why the evaluation bar has to be higher, not lower.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Shumailov et al. <i>AI models collapse when trained on recursively generated data.</i> Nature 631:755–759, 2024."], "sec": "3.7", "secTitle": "Generative and synthetic images"}, {"kind": "refs", "title": "Section 3.7 — references", "kick": "Reading", "sm": true, "refs": ["Shumailov, Shumaylov, Zhao, Papernot, Anderson &amp; Gal. <b>AI models collapse when trained on recursively generated data.</b> <i>Nature</i> 631:755–759, 2024.", "Tobin, Fong, Ray, Schneider, Zaremba &amp; Abbeel. <b>Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World.</b> <i>IROS</i>, 2017.", "Heusel, Ramsauer, Unterthiner, Nessler &amp; Hochreiter. <b>GANs Trained by a Two Time-Scale Update Rule Converge to a Local Nash Equilibrium (FID).</b> <i>NeurIPS</i>, 2017 — read alongside the critiques of its use outside natural images.", "Esteban, Hyland &amp; Rätsch. <b>Real-valued (Medical) Time Series Generation with Recurrent Conditional GANs.</b> 2017 — origin of the TSTR protocol.", "Shokri, Stronati, Song &amp; Shmatikov. <b>Membership Inference Attacks Against Machine Learning Models.</b> <i>IEEE S&amp;P</i>, 2017.", "Chapter 0 §0.6 — the trilemma, the four evidence protocols, mixing ratios and provenance marking, all of which apply here without modification."], "sec": "3.7", "secTitle": "Generative and synthetic images"}, {"kind": "divider", "sec": "3.8", "secTitle": "Self-supervised and image-text pipelines", "no": "3.8", "title": "Self-supervised and image-text pipelines", "lead": "Where the data work stops being preparation and becomes the contribution. No labels means the augmentation distribution is the task, and at web scale the filter is the method.", "chips": ["View construction", "Masked image modelling", "Alt-text", "CLIP-score filtering", "DataComp", "MetaCLIP capping", "Data filtering networks", "Recaptioning", "Who gets filtered"]}, {"kind": "figure", "title": "Augmentation defines what is learned", "kick": "3.8.1–3.8.2", "tag": "frontier", "lead": "In supervised learning the label tells the network what to encode. In self-supervised learning nothing does — except the set of transformations you declared irrelevant.", "fig": "f_views", "figcap": "SimCLR (Chen et al.<sup class=\"fn\">1</sup>, <i>ICML</i> 2020) and MAE (He et al.<sup class=\"fn\">2</sup>, <i>CVPR</i> 2022). The colour-jitter finding is the cleanest demonstration in the literature that a missing augmentation lets the network solve the pretext task with a shortcut instead of a representation.", "notes": "Push the medical implication hard: if you pretrain a histopathology encoder with a natural-image view recipe, you have told it that colour is nuisance — and stain is colour. If you pretrain a dermoscopy encoder that way, hue is diagnostic and you have just discarded it. Ask each group what their view distribution should exclude.", "cites": ["Chen et al. <i>A Simple Framework for Contrastive Learning of Visual Representations (SimCLR).</i> ICML, 2020.", "He et al. <i>Masked Autoencoders Are Scalable Vision Learners.</i> CVPR, 2022."], "sec": "3.8", "secTitle": "Self-supervised and image-text pipelines"}, {"kind": "figure", "title": "When the dataset is the submission", "kick": "3.8.3–3.8.5", "tag": "frontier", "lead": "DataComp fixes the architecture, the training procedure and the compute, and asks entrants to submit a dataset. It is the cleanest controlled evidence we have that curation is a first-class research contribution.", "fig": "f_datacomp", "figcap": "<b>DataComp-1B</b> trains a CLIP ViT-L/14 from scratch to <b>79.2%</b> zero-shot ImageNet, <b>3.7 points above</b> OpenAI's CLIP ViT-L/14 at 75.5%, on the same procedure and compute <span class='cite'>Gadre et al., NeurIPS 2023, arXiv:2304.14108</span>. <b>MetaCLIP</b> builds a query list from WordNet and Wikipedia, matches captions to queries, then caps each concept to flatten the head <span class='cite'>Xu et al., ICLR 2024</span>.", "notes": "The MetaCLIP capping idea is worth generalising out loud: balancing by concept rather than filtering by score is a different lever entirely, and it is the one that protects the tail. Ask what the equivalent of a concept cap would be in their own dataset — usually per-site, per-camera or per-patient caps.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Radford et al. <i>Learning Transferable Visual Models From Natural Language Supervision (CLIP).</i> ICML, 2021.", "Li et al. <i>DataComp-LM (DCLM).</i> 2024."], "sec": "3.8", "secTitle": "Self-supervised and image-text pipelines"}, {"kind": "bullets", "title": "Alt-text, recaptioning, and who gets removed", "kick": "3.8.3, 3.8.6–3.8.9", "tag": "frontier", "b": ["<b>Where the pairs come from.</b> Alt-text on the open web, harvested at Common Crawl scale (LAION; Schuhmann et al.<sup class=\"fn\">4</sup>, <i>NeurIPS</i> 2022). Most of it is a filename, an SEO string or a shop's product code. The text side is the weak side.", "<b>CLIP-score filtering</b> ranks pairs by image–text similarity and keeps a top fraction. The threshold is a hyper-parameter with a real optimum, and it is scored by the very model family you are about to train — a circularity worth stating.", "<b>Data filtering networks</b> (Fang et al., 2023) invert the usual instinct: train a small model on a high-quality pool <em>specifically to filter</em> a much larger one. The filter, not the final model, is the artefact.", "<b>Recaptioning</b> replaces or blends model-generated captions with the originals, and the mixing probability is tuned rather than assumed. It helps, and it also injects one captioner's vocabulary and blind spots into the corpus.", "<b>T-MARS</b> masks text rendered inside images before scoring, because a picture of the word “dog” scores well against the caption “dog” while teaching optical character recognition rather than vision.", "<b>Who gets filtered out.</b> Audits of DataComp-style filtering find it removes content associated with particular languages, regions and groups. A CLIP-score threshold is not a neutral quality gate; it is a preference expressed by whoever trained the scorer."], "callout": {"h": "For a Thai research group specifically", "p": "English-language alt-text scores better under an English-trained scorer, so aggressive CLIP-score filtering systematically thins non-English regions of the pool. If your target deployment is Thai, evaluate the filter on Thai-relevant slices before adopting a threshold someone else tuned."}, "notes": "Visual instruction data for multimodal fine-tuning is the current active area; the text-side selection methods from Chapter 2 §2.9 transfer almost directly, including the finding that random selection is hard to beat on diverse pools.", "cites": ["Gadre et al. <i>DataComp: In search of the next generation of multimodal datasets.</i> NeurIPS Datasets & Benchmarks, 2023.", "Radford et al. <i>Learning Transferable Visual Models From Natural Language Supervision (CLIP).</i> ICML, 2021.", "Li et al. <i>DataComp-LM (DCLM).</i> 2024.", "Schuhmann et al. <i>LAION-5B: An open large-scale dataset for training next generation image-text models.</i> NeurIPS Datasets & Benchmarks, 2022."], "sec": "3.8", "secTitle": "Self-supervised and image-text pipelines"}, {"kind": "refs", "title": "Section 3.8 — references", "kick": "Reading", "sm": true, "refs": ["Gadre et al. <b>DataComp: In search of the next generation of multimodal datasets.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2023 (arXiv:2304.14108).", "Xu, Xu, Chen, Wang, Zhang, Feichtenhofer et al. <b>Demystifying CLIP Data (MetaCLIP).</b> <i>ICLR</i>, 2024.", "Radford et al. <b>Learning Transferable Visual Models From Natural Language Supervision (CLIP).</b> <i>ICML</i>, 2021.", "Schuhmann et al. <b>LAION-5B: An open large-scale dataset for training next generation image-text models.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2022.", "Chen, Kornblith, Norouzi &amp; Hinton. <b>A Simple Framework for Contrastive Learning of Visual Representations (SimCLR).</b> <i>ICML</i>, 2020.", "He, Chen, Xie, Li, Dollár &amp; Girshick. <b>Masked Autoencoders Are Scalable Vision Learners.</b> <i>CVPR</i>, 2022; Caron et al., <b>DINO</b>, <i>ICCV</i> 2021; Grill et al., <b>BYOL</b>, <i>NeurIPS</i> 2020.", "Fang, Jose, Jain, Schmidt, Toshev &amp; Shankar. <b>Data Filtering Networks.</b> 2023; Maini et al., <b>T-MARS</b>, 2023; Nguyen et al. on recaptioning, 2023.", "Chapter 2 §2.5 for the text-side equivalents of model-based quality filtering, and §2.5.7 on filters encoding values."], "sec": "3.8", "secTitle": "Self-supervised and image-text pipelines"}, {"kind": "divider", "sec": "3.9", "secTitle": "Video and CCTV", "no": "3.9", "title": "Video and CCTV", "lead": "Video is not a stack of images. It is a correlated stream from a physical device with a clock, a viewpoint, a legal context and an owner who wants an answer on the box.", "chips": ["Frame sampling", "Shot segmentation", "Temporal augmentation", "Calibration and sync", "Drift", "ROI and privacy masking", "Tracking annotation", "Rare events", "Edge parity"]}, {"kind": "figure", "title": "Sixty frames, six of them matter", "kick": "3.9.1–3.9.3", "tag": "both", "lead": "The sampling policy decides what the model ever sees. It is chosen far more casually than the architecture, and it matters more.", "fig": "f_framesample", "figcap": "Segment-based sampling (Wang et al.<sup class=\"fn\">1</sup>, <b>TSN</b>, 2016) is the reliable default: divide the video into K segments and take one snippet from each, so a single clip spans the whole recording. <b>Temporal augmentation must be consistent across the clip</b> — the same crop, the same flip, the same jitter for every frame, or you have taught the network that the camera shakes.", "notes": "Shot and scene segmentation matters before any of this: a clip-level label is only meaningful if the clip is one shot. Ask what happens to a 'fight detected' label when the clip spans a camera switch.", "cites": ["Wang et al. <i>Temporal Segment Networks: Towards Good Practices for Deep Action Recognition.</i> ECCV, 2016."], "sec": "3.9", "secTitle": "Video and CCTV"}, {"kind": "figure", "title": "What a real deployment does to your data", "kick": "3.9.4–3.9.5", "tag": "both", "lead": "Three problems that do not exist in a benchmark and dominate a live installation.", "fig": "f_cctv", "figcap": "Calibration and timestamp alignment make multi-camera association possible at all; drift silently destroys it over months; masking has to happen at ingest, because an archive of un-masked frames <em>is</em> the privacy incident.", "notes": "This is the section closest to what our startup actually does. Real anecdote worth telling: a camera whose NTP quietly failed, discovered only when cross-camera tracks stopped joining, months of recordings with a growing offset. The fix was a pipeline that logs the offset against a shared event every night.", "sec": "3.9", "secTitle": "Video and CCTV"}, {"kind": "bullets", "title": "Rare events, and what tracking annotation actually costs", "kick": "3.9.6–3.9.7", "tag": "both", "lead": "In surveillance the positive class is a rounding error, and the labels are the most expensive in this course.", "b": ["<b>The base rate.</b> A camera running for a month produces on the order of 2.5 million frames at 1 fps. An event of interest might occupy a few hundred. Training on uniformly sampled frames means the model sees the event roughly never.", "<b>Event-centred sampling.</b> Build the training set around annotated events plus a controlled negative budget, and state the ratio — it is a design parameter that changes the operating point, not a detail.", "<b>Hard-negative mining.</b> The useful negatives are the ones that look like events: shadows at dusk, a plastic bag, a reflection, a cleaner at 3 a.m. Mine them from the model's own false positives and re-train, iteratively.", "<b>Then fix the threshold on the real base rate.</b> A model tuned on a 1:10 balanced set and deployed at 1:10,000 will drown the operator in false alarms — this is Chapter 1 §1.9 with a camera attached, and the alarm budget is a human-factors constraint, not a metric.", "<b>Identity-consistent tracking labels are the expensive part.</b> Boxes are cheap; keeping the same identity across occlusion, camera hand-off and a change of clothing is slow expert work. Budget in annotator-hours per video-minute and measure it on a pilot before promising a schedule.", "<b>Use MOT-style formats</b> and treat interpolation between keyframes as a labelling assistant, not as ground truth — an interpolated box through an occlusion is a guess with a confident-looking rectangle around it."], "callout": {"h": "The split, again", "p": "Group by <b>camera</b> and by <b>session</b>. A model evaluated on held-out frames from cameras it trained on is measuring how well it memorised those viewpoints, backgrounds and lighting — and it will fall over on camera number eleven."}, "notes": "Ask the room to estimate the annotator-hours for one hour of multi-object tracking video. Estimates are usually out by an order of magnitude, which is exactly why video projects slip.", "sec": "3.9", "secTitle": "Video and CCTV"}, {"kind": "table", "title": "Edge constraints, and the parity requirement", "kick": "3.9.8", "tag": "frontier", "sm": true, "lead": "When inference runs on the box, preprocessing runs on the box — and the box does it differently from your training script.", "table": {"head": ["Where it differs", "What the device does", "What to do about it"], "rows": [["Decode", "Hardware H.264/H.265 decode, sometimes with a different chroma upsampling than FFmpeg", "Decode a fixed reference clip on both paths and compare tensors, not visually"], ["Resize", "A vendor kernel, often bilinear without anti-aliasing, sometimes fixed-point", "Match the training resize to the device kernel, not the other way round"], ["Colour conversion", "YUV to RGB with a different matrix and range (limited vs full)", "Pin the conversion explicitly; a 16–235 vs 0–255 mismatch is a visible contrast shift"], ["Frame rate and resolution", "Dropped frames under load; a lower capture resolution than the archive", "Train at the deployed resolution and frame rate, or measure the loss from the gap"], ["Quantisation", "INT8 conversion changes the effective input distribution", "Calibrate on frames from the deployed cameras, not on the public benchmark"], ["Model update", "The transform chain ships with the binary and may lag the weights", "Version the pair, and refuse to deploy a mismatch — this is §0.8.6 skew with a camera"]]}, "callout": {"h": "The replay test", "p": "Keep ten reference clips. On every release, run them through the training path and the device path and assert the two preprocessed tensors match to tolerance. It is twenty lines of code and it catches an entire class of “great in the notebook, useless on site” failures."}, "notes": "The limited-range vs full-range YUV bug is the one to tell as a story: it looks like a mild contrast difference to a human and shifts every intensity statistic the model relies on.", "sec": "3.9", "secTitle": "Video and CCTV"}, {"kind": "refs", "title": "Section 3.9 — references", "kick": "Reading", "sm": true, "refs": ["Wang, Xiong, Wang, Qiao, Lin, Tang &amp; Van Gool. <b>Temporal Segment Networks: Towards Good Practices for Deep Action Recognition.</b> <i>ECCV</i>, 2016.", "Feichtenhofer, Fan, Malik &amp; He. <b>SlowFast Networks for Video Recognition.</b> <i>ICCV</i>, 2019 — two sampling rates as an architectural choice.", "Milan, Leal-Taixé, Reid, Roth &amp; Schindler. <b>MOT16: A Benchmark for Multi-Object Tracking.</b> 2016 — for the annotation format and its cost model.", "Zhang, Sun, Jiang, Yu &amp; Wang. <b>ByteTrack: Multi-Object Tracking by Associating Every Detection Box.</b> <i>ECCV</i>, 2022 — for tracking-assisted annotation.", "Hartley &amp; Zisserman. <b>Multiple View Geometry in Computer Vision.</b> 2nd ed., 2004 — intrinsics, extrinsics and multi-camera geometry.", "Chapter 0 §0.3.7 for camera- and session-level grouping, §0.8.6 for training/serving skew, and Chapter 1 §1.9 for operating under extreme imbalance.", "Tooling: FFmpeg / PyAV, decord, NVIDIA DeepStream, CVAT for video annotation, OpenCV camera calibration."], "sec": "3.9", "secTitle": "Video and CCTV"}, {"kind": "divider", "sec": "3.10", "secTitle": "Medical imaging specifics", "no": "3.10", "title": "Medical imaging specifics", "lead": "The centre of gravity of this chapter. Everything so far, plus a regulator, a patient and a reporting standard.", "chips": ["Dataset fingerprint", "Rule-based configuration", "Patch sampling", "WSI tiling", "Multi-site harmonisation", "Patient and site splits", "Defacing", "Locked preprocessing", "CLAIM and TRIPOD+AI"]}, {"kind": "figure", "title": "The dataset fingerprint, and the configuration derived from it", "kick": "3.10.1–3.10.3", "tag": "frontier", "lead": "nnU-Net's contribution is not an architecture. It is the demonstration that a preprocessing plan can be derived from measured dataset properties by stated rules, and that this beats expert intuition.", "fig": "f_fingerprint", "figcap": "Isensee et al.<sup class=\"fn\">1</sup>, <i>Nature Methods</i>, 2021. Median voxel spacing, image dimensions, intensity distribution and class ratios in; preprocessing, architecture, training and post-processing out, with <b>no manual tuning</b>. Foreground-oversampled patch sampling is part of the same plan — a 12-voxel lesion is never seen otherwise.", "notes": "Lab 9 is built on this: run the automatic configuration on a public dataset, then deliberately change the normalisation and quantify the damage. Students are consistently shocked by how much a normalisation swap costs relative to an architecture swap.", "cites": ["Isensee et al. <i>nnU-Net: a self-configuring method for deep learning-based biomedical image segmentation.</i> Nature Methods, 2021."], "sec": "3.10", "secTitle": "Medical imaging specifics"}, {"kind": "table", "title": "Nothing here is an independent sample", "kick": "3.10.4, 3.10.7", "tag": "textbook", "sm": true, "lead": "Medical imaging data is nested five levels deep. Choose the level of your split and you have chosen which question your number answers.", "table": {"head": ["Level", "What it is", "A split at this level tests"], "rows": [["Tile / patch", "One 256 px tile from a slide, or one patch from a volume", "Nothing. Tiles from one slide share stain, scanner, tissue and patient — this is not a split, it is a leak"], ["Slice / frame", "One slice of a CT, one frame of a study", "Almost nothing. Adjacent slices are near-duplicates"], ["Image / study", "One acquisition", "Whether the model generalises across acquisitions of the <em>same</em> patient. Rarely the question you are asking"], ["Patient", "All studies of one person, on one side only", "The minimum for any clinical claim. Assume this is what a reviewer means by “held out”"], ["Site / scanner", "An entire hospital or device held out", "The standard for a credible generalisation claim, and the one that reveals how much of your accuracy was scanner signature"]]}, "callout": {"h": "Whole-slide tiling in one line", "p": "Detect tissue, choose a magnification and record it, tile with a stated size and stride, reject background and pen marks — then carry the <b>slide and patient identifier on every tile</b> so the grouping survives every shuffle downstream. Losing that identifier at the tiling step is the most common leak in computational pathology."}, "notes": "Ask what fraction of the pathology papers they have read report the split level. It is a minority. Then ask what fraction report tile-level accuracy — it is most of them.", "sec": "3.10", "secTitle": "Medical imaging specifics"}, {"kind": "splitr", "title": "Screening ultrasound, and what an assisting tool is measured on", "kick": "From the VI Lab", "tag": "both", "wide": "text", "cls": "vilab", "lead": "BiTNet — ultrasound image analysis of the human biliary tract, for screening upper-abdominal abnormalities including cholangiocarcinoma.", "b": ["<b>Why ultrasound is the hard modality for everything on this deck.</b> It is operator-dependent, has no absolute intensity scale, carries speckle rather than noise, and burns the acquisition banner into the pixels. Every normalisation slide in §3.3 has to be re-argued for it.", "<b>What the model does.</b> BiTNet modifies EfficientNet to address the over-confidence of deep convolutional classifiers — a calibration problem, which in a screening setting is the difference between a useful triage and an unusable alarm rate.", "<b>What the paper reports.</b> A <b>35% reduction in radiologist workload</b>, with false negatives at approximately <b>1 in 455 images</b>. With BiTNet as an assisting tool, participant mean accuracy rose from <b>0.50 to 0.74</b> and precision from <b>0.46 to 0.61</b> (p&lt;0.001), across <b>11 healthcare professionals at four experience levels</b>.", "<b>The dataset is part of the contribution.</b> The paper releases an ultrasound image dataset for the human biliary tract — for a region where cholangiocarcinoma is endemic and public data is scarce, arguably the longer-lived half of the work."], "fig": "f_bitnet", "figcap": "State the numbers exactly as the paper does, including what they are measured over. A workload reduction is only meaningful alongside the false-negative rate it was bought with.", "notes": "Use this to model good citation hygiene: name the metric, the denominator and the population. Then ask the room what the study design would have to be to claim a clinical outcome rather than a reader-study improvement — that gap is the honest limitation.", "cites": ["Intharah et al. <i>BiTNet: Hybrid deep convolutional model for ultrasound image analysis of human biliary tract….</i> Artificial Intelligence in Medicine, 2023."], "sec": "3.10", "secTitle": "Medical imaging specifics"}, {"kind": "bullets", "title": "Defacing, locked preprocessing and what you must report", "kick": "3.10.5–3.10.6, 3.10.8–3.10.10", "tag": "frontier", "b": ["<b>Defacing is de-identification.</b> Schwarz et al.<sup class=\"fn\">4</sup> (<i>NEJM</i>, 2019) matched 3D surface renders of research MRI to photographs using off-the-shelf face recognition. Use a validated defacing tool, and record which — and note that defacing can itself perturb nearby measurements, so it belongs in the Methods section too.", "<b>Skull stripping and organ masking</b> shrink the problem and reduce identifiability at the same time. Two benefits, one step, and a failure mode: an over-aggressive mask removes pathology at the margin.", "<b>Site is a confounder, not noise.</b> If prevalence differs by site — and it always does — a model can learn the scanner and score well. ComBat-style harmonisation (§3.3) helps; a held-out site is the only real test.", "<b>Locked, version-pinned preprocessing.</b> For a regulated product the transform chain is part of the device. Changing an interpolation kernel, a percentile, a resize order or a library version is a change to the device, with the regulatory consequences that implies. Pin the container digest, not just the package version.", "<b>Report against the standards.</b> <b>CLAIM</b> for medical imaging AI manuscripts, <b>TRIPOD+AI</b> for prediction-model reporting, <b>STARD-AI</b> for diagnostic accuracy studies. Each asks explicitly how data was selected, excluded and preprocessed.", "<b>The honest test of your Methods section:</b> could a competent group at another hospital reproduce your preprocessing from the text alone? Try it once, with a real collaborator, before submission rather than after review."], "callout": {"h": "For a Thai medical-AI project", "p": "The combination that recurs in our own work: IRB approval defining the permitted use, identifier removal at ingest, <b>PHI in pixel data checked separately from the tags</b>, patient-level splits with an external site for the headline claim, and a preprocessing version recorded alongside the weights. None of this is optional and all of it is cheaper done first."}, "notes": "Reporting checklists sound bureaucratic until a student realises the checklist items are exactly the things they cannot currently answer about their own pipeline. Hand out CLAIM in week 11.", "cites": ["Johnson et al. <i>Adjusting batch effects in microarray expression data using empirical Bayes methods (ComBat).</i> Biostatistics, 2007.", "Mongan et al. <i>Checklist for Artificial Intelligence in Medical Imaging (CLAIM).</i> Radiology: Artificial Intelligence, 2020.", "Collins et al. <i>TRIPOD+AI statement.</i> BMJ, 2024.", "Schwarz et al. <i>Identification of Anonymous MRI Research Participants with Face-Recognition Software.</i> NEJM, 2019."], "sec": "3.10", "secTitle": "Medical imaging specifics"}, {"kind": "refs", "title": "Section 3.10 — references", "kick": "Reading", "sm": true, "refs": ["Isensee, Jaeger, Kohl, Petersen &amp; Maier-Hein. <b>nnU-Net: a self-configuring method for deep learning-based biomedical image segmentation.</b> <i>Nature Methods</i>, 2021.", "Intharah, Wiratchawa, Wanna, Junsawang, Techasen, Worasith, Sithithaworn &amp; Khuntikeo. <b>BiTNet: Hybrid deep convolutional model for ultrasound image analysis of human biliary tract and its applications.</b> <i>Artificial Intelligence in Medicine</i>, 2023.", "Schwarz et al. <b>Identification of Anonymous MRI Research Participants with Face-Recognition Software.</b> <i>NEJM</i>, 2019.", "Johnson, Li &amp; Rabinovic. <b>Adjusting batch effects in microarray expression data using empirical Bayes methods (ComBat).</b> <i>Biostatistics</i>, 2007; Fortin et al. <b>Harmonization of cortical thickness measurements across scanners and sites.</b> <i>NeuroImage</i>, 2018.", "Mongan, Moy &amp; Kahn. <b>Checklist for Artificial Intelligence in Medical Imaging (CLAIM).</b> <i>Radiology: Artificial Intelligence</i>, 2020.", "Collins et al. <b>TRIPOD+AI statement.</b> <i>BMJ</i>, 2024; Sounderajah et al. <b>Developing a reporting guideline for artificial intelligence-centred diagnostic test accuracy studies (STARD-AI).</b> <i>BMJ Open</i>, 2021.", "Chapter 0 §0.3.7 for patient and site grouping, §0.7.1 for de-identification, and §0.7.9 for the regulatory floor."], "sec": "3.10", "secTitle": "Medical imaging specifics"}, {"kind":
