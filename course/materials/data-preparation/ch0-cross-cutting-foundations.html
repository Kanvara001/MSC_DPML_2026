<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Preparation for ML and AI — Chapter 0: Cross-cutting foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#A3384F;
  --accent-soft:#FAEEF2;
  --accent-ink:#7E2A3D;
  --paper:#EDF1F6;
  --card:#FFFFFF;
  --ink:#111823;
  --ink-2:#41505F;
  --ink-3:#78859A;
  --rule:#D3DCE6;
  --rule-2:#E7EDF3;
  --shell:#171E28;
  --shell-2:#212A36;
  --shell-3:#2E3946;
  --ok:#0F7A6A;
  --warn:#A3384F;
  --f-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-thai:"Noto Sans Thai","Archivo",sans-serif;
  --W:1280px; --H:720px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================ CHROME ============================ */
.bar{
  position:fixed;left:0;right:0;top:0;height:44px;z-index:40;
  background:var(--shell-2);border-bottom:1px solid #000;
  display:flex;align-items:center;gap:10px;padding:0 12px;color:#C6D1DD;
}
.bar .ch{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;flex:none;
}
.bar .tt{font-family:var(--f-ui);font-size:13px;font-weight:600;color:#EAF0F6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.bar .sec{font-family:var(--f-mono);font-size:10.5px;color:#7C8C9C;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.bar .grp{display:flex;gap:4px;align-items:center;flex:none}
.tb{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:6px 9px;
  border:1px solid var(--shell-3);border-radius:5px;color:#A9B7C5;background:transparent;white-space:nowrap;
}
.tb:hover{background:var(--shell-3);color:#fff}
.tb[aria-pressed="true"]{background:#E9EEF3;color:var(--shell);border-color:#E9EEF3;font-weight:600}
.tb.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.count{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;padding:0 4px;flex:none}
.count b{color:#fff}

/* ============================ STAGE ============================ */
.stage{
  position:fixed;inset:44px 0 30px 0;display:grid;place-items:center;overflow:hidden;
  background:var(--shell);
}
body.notes-on .stage{right:340px}
.holder{width:var(--W);height:var(--H);transform-origin:center center;position:relative}
.slide{
  width:var(--W);height:var(--H);background:var(--card);position:relative;overflow:hidden;
  box-shadow:0 12px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;
}

/* progress */
.prog{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:40;background:var(--shell-2);
  border-top:1px solid #000;display:flex;align-items:center;gap:10px;padding:0 12px}
.track{flex:1;height:6px;background:#0D131A;border-radius:3px;position:relative;overflow:hidden;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;transition:width .15s}
.ticks{position:absolute;inset:0}
.ticks i{position:absolute;top:0;bottom:0;width:1px;background:#33404E}
.prog .hint{font-family:var(--f-mono);font-size:9.5px;color:#5F6E7D;letter-spacing:.05em;white-space:nowrap}
.timer{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;min-width:52px;text-align:right}

/* ============================ SLIDE LAYOUTS ============================ */
.pad{padding:52px 64px 46px}
.slide{--k:1}
.slide .kick{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px;
}
.slide .kick .dot{width:22px;height:2px;background:var(--accent);display:inline-block}
.slide h2{
  font-family:var(--f-ui);font-size:calc(37px * var(--k));line-height:1.14;letter-spacing:-.022em;
  font-weight:650;margin:0 0 6px;color:var(--ink);
}
.slide h2.sm{font-size:calc(31px * var(--k))}
.slide .lead{
  font-size:calc(18.5px * var(--k));line-height:1.5;color:var(--ink-2);margin:calc(12px * var(--k)) 0 0;max-width:96ch;font-style:italic;
}
.slide .lead b{font-style:normal;color:var(--ink);font-weight:600}
.rule{height:2px;background:var(--accent);width:64px;margin:calc(16px * var(--k)) 0 calc(20px * var(--k));flex:none}

ul.bul{list-style:none;margin:0;padding:0}
ul.bul>li{
  position:relative;padding:0 0 0 24px;margin:0 0 calc(13px * var(--k));font-size:calc(17.5px * var(--k));line-height:1.48;color:var(--ink-2);
}
ul.bul>li:before{
  content:"";position:absolute;left:3px;top:11px;width:9px;height:2px;background:var(--accent);
}
ul.bul>li b,ul.bul>li strong{color:var(--ink);font-weight:600}
ul.bul>li em{font-style:italic;color:var(--ink)}
ul.bul.tight>li{margin-bottom:calc(9px * var(--k));font-size:calc(16.5px * var(--k))}
ul.bul.sm>li{font-size:calc(15.5px * var(--k));margin-bottom:calc(8px * var(--k));padding-left:20px}
ul.bul.sm>li:before{width:7px;top:10px}
.k{font-family:var(--f-mono);font-size:.86em;background:#EEF3F8;border:1px solid var(--rule-2);
  border-radius:3px;padding:1px 5px;color:var(--ink)}
.cite{font-family:var(--f-mono);font-size:.8em;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
.th{font-family:var(--f-thai)}

/* two column body */
.body{flex:1;min-height:0;display:flex;gap:34px}
.body.v{flex-direction:column;gap:16px}
.col{flex:1;min-width:0}
.col.narrow{flex:0 0 40%}
.col.wide{flex:0 0 58%}
.figwrap{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;flex:1 1 auto}
.figbox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.figbox svg{width:100%;height:100%;max-height:100%;display:block}
.figcap{
  font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.45;
  border-top:1px solid var(--rule-2);padding-top:8px;
}
.figcap b{color:var(--ink-2);font-weight:600}

/* columns layout */
.cols{display:grid;gap:18px;flex:1;min-height:0}
.cols.n2{grid-template-columns:1fr 1fr}
.cols.n3{grid-template-columns:1fr 1fr 1fr}
.cols.n4{grid-template-columns:repeat(4,1fr)}
.cbox{
  border:1px solid var(--rule);border-radius:9px;padding:calc(16px * var(--k)) 17px;background:#FBFDFE;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.cbox.acc{border-color:var(--accent);background:var(--accent-soft)}
.cbox h4{
  font-family:var(--f-ui);font-size:calc(15px * var(--k));font-weight:650;margin:0 0 4px;letter-spacing:-.01em;color:var(--ink);
}
.cbox .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 9px;font-weight:600}
.cbox p{margin:0 0 calc(8px * var(--k));font-size:calc(14.5px * var(--k));line-height:1.46;color:var(--ink-2)}
.cbox ul.bul>li{font-size:calc(14.5px * var(--k));margin-bottom:calc(7px * var(--k));padding-left:18px}
.cbox ul.bul>li:before{width:7px;top:9px}

/* title slide */
.slide.title{background:var(--shell);color:#E9EFF5;justify-content:center}
.slide.title .pad{padding:0 78px}
.slide.title .no{
  font-family:var(--f-mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 20px;
}
.slide.title h1{
  font-family:var(--f-ui);font-size:60px;line-height:1.06;letter-spacing:-.03em;font-weight:700;
  margin:0 0 20px;max-width:20ch;color:#fff;
}
.slide.title .dek{font-size:20px;line-height:1.5;color:#9DAEBE;max-width:62ch;margin:0 0 30px;font-style:italic}
.slide.title .meta{
  font-family:var(--f-mono);font-size:12px;color:#6F7F90;letter-spacing:.05em;line-height:1.9;
  border-top:1px solid #303B48;padding-top:18px;max-width:62ch;
}
.slide.title .meta b{color:#C3D0DC;font-weight:500}
.slide.title:after{
  content:"";position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.30;
}
.slide.title:before{
  content:"";position:absolute;right:-40px;bottom:-240px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.16;
}

/* divider */
.slide.divider{background:var(--accent-soft);justify-content:center}
.slide.divider .pad{padding:0 78px}
.slide.divider .n{
  font-family:var(--f-mono);font-size:96px;line-height:1;font-weight:600;letter-spacing:-.05em;
  color:var(--accent);opacity:.30;margin:0 0 6px;
}
.slide.divider h2{font-size:46px;max-width:22ch;color:var(--accent-ink)}
.slide.divider .lead{color:var(--ink-2);font-size:19px;max-width:70ch}
.slide.divider .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px;max-width:84ch}
.slide.divider .chips span{
  font-family:var(--f-mono);font-size:11px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--accent);color:var(--accent-ink);background:rgba(255,255,255,.6);
}

/* refs */
ol.refs{list-style:none;counter-reset:r;margin:0;padding:0;column-gap:34px}
ol.refs.two{column-count:2}
ol.refs>li{
  counter-increment:r;position:relative;padding:0 0 0 30px;margin:0 0 11px;
  font-size:calc(14.5px * var(--k));line-height:1.45;color:var(--ink-2);break-inside:avoid;
}
ol.refs>li:before{
  content:counter(r);position:absolute;left:0;top:2px;font-family:var(--f-mono);font-size:10px;
  font-weight:600;color:#fff;background:var(--accent);width:19px;height:19px;border-radius:4px;
  display:grid;place-items:center;
}
ol.refs>li b{color:var(--ink);font-weight:600}
ol.refs>li i{color:var(--ink-3);font-style:italic}

/* callout / lab / vilab */
.callout{
  border-left:3px solid var(--accent);background:var(--accent-soft);padding:calc(14px * var(--k)) 18px;border-radius:0 8px 8px 0;
  margin-top:calc(16px * var(--k));
}
.callout .h{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:600;margin-bottom:6px;
}
.callout p{margin:0;font-size:calc(15.5px * var(--k));line-height:1.5;color:var(--ink-2)}
.slide.vilab{background:linear-gradient(180deg,#FBFDFE 0%,#F2F6FA 100%)}
.slide.vilab .badge{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff;background:var(--ink);
  padding:5px 11px;border-radius:20px;margin-bottom:14px;
}
.slide.vilab .badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.slide.lab{background:#FCFBF6}
.stat{display:flex;gap:calc(26px * var(--k));margin:calc(18px * var(--k)) 0 0;flex-wrap:wrap}
.stat div{flex:0 0 auto}
.stat .v{font-family:var(--f-ui);font-size:calc(34px * var(--k));font-weight:700;letter-spacing:-.03em;color:var(--accent);line-height:1}
.stat .l{margin-top:calc(6px * var(--k))!important}
.stat .l{font-family:var(--f-mono);font-size:calc(10px * var(--k));letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-top:6px;max-width:22ch;line-height:1.5}

/* table */
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:0 12px 9px;border-bottom:2px solid var(--accent);font-weight:600;
}
table.t td{padding:calc(10px * var(--k)) 12px;font-size:calc(14.5px * var(--k));border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top;line-height:1.42}
table.t td:first-child{font-weight:600;color:var(--ink)}
table.t tr:last-child td{border-bottom:none}

/* per-slide citation footnotes */
sup.fn{font-family:var(--f-mono);font-size:.62em;font-weight:600;color:var(--accent);
  vertical-align:super;line-height:0;padding-left:1px}
.cites{
  flex:none;margin-top:calc(9px * var(--k));padding-top:6px;border-top:1px solid var(--rule-2);
  display:flex;flex-direction:column;gap:calc(2px * var(--k));
}
.cites .c{
  font-family:var(--f-ui);font-size:calc(10.5px * var(--k));line-height:1.42;color:var(--ink-3);
  display:flex;gap:6px;align-items:baseline;
}
.cites .c b{color:var(--accent);font-weight:700;flex:none;font-family:var(--f-mono);font-size:.94em}
.cites .c i{color:var(--ink-2);font-style:italic}
.cites .c .ed{min-width:0}
.slide.figure .cites,.slide.split .cites,.slide.splitr .cites{margin-top:calc(8px * var(--k))}

/* slide footer */
.foot{
  position:absolute;left:64px;right:64px;bottom:16px;display:flex;align-items:center;gap:12px;
  font-family:var(--f-mono);font-size:9.5px;color:#9FADBC;letter-spacing:.08em;text-transform:uppercase;
  border-top:1px solid var(--rule-2);padding-top:9px;
}
.foot .sp{flex:1}
.foot .tag{padding:2px 7px;border-radius:3px;border:1px solid var(--rule);letter-spacing:.09em}
.foot .tag.frontier{color:var(--warn);border-color:#E4BCC4;background:#FDF2F4}
.foot .tag.textbook{color:#3A4A57;border-color:#C3CCD4;background:#F2F5F7}
.foot .tag.both{color:#8A6A12;border-color:#E0D0A4;background:#FDF8EA}
.slide.title .foot,.slide.divider .foot{display:none}

/* editing */
body.edit .ed{border-radius:3px;cursor:text}
body.edit .ed:hover{background:#F1F7FC;box-shadow:0 0 0 4px #F1F7FC}
body.edit .ed:focus{background:#FFFBE6;box-shadow:0 0 0 4px #FFFBE6;outline:none}
.slide.title .ed:hover,.slide.title .ed:focus{background:#2C3742!important;box-shadow:0 0 0 4px #2C3742!important}

/* ============================ OVERVIEW ============================ */
.ov{position:fixed;inset:44px 0 30px 0;z-index:35;background:#10161E;overflow-y:auto;display:none;padding:20px}
body.ov-on .ov{display:block}
body.ov-on .stage{visibility:hidden}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;max-width:1500px;margin:0 auto}
.ovc{position:relative;cursor:pointer;border-radius:6px;overflow:hidden;background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.35);border:2px solid transparent}
.ovc:hover{border-color:var(--accent)}
.ovc.cur{border-color:#fff}
.ovc .mini{width:var(--W);height:var(--H);transform-origin:top left;pointer-events:none}
.ovc .shell{position:relative;overflow:hidden}
.ovc .lb{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.82));
  color:#fff;font-family:var(--f-mono);font-size:9.5px;padding:16px 8px 6px;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovc .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;
  font-family:var(--f-mono);font-size:9.5px;padding:2px 6px;border-radius:3px}
.ovsec{grid-column:1/-1;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7E8E9E;border-bottom:1px solid #29333F;padding:14px 0 7px;margin-top:6px}

/* ============================ NOTES ============================ */
.notes{
  position:fixed;right:0;top:44px;bottom:30px;width:340px;z-index:38;background:#131A23;
  border-left:1px solid #000;display:none;flex-direction:column;
}
body.notes-on .notes{display:flex}
.notes .nh{padding:12px 14px;border-bottom:1px solid #262F3B;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E8E9E}
.notes .nb{flex:1;overflow-y:auto;padding:12px 14px}
.notes .nxt{background:#0D131A;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.notes .nxt .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#5D6C7B;margin-bottom:5px}
.notes .nxt .t{font-family:var(--f-ui);font-size:13px;color:#C6D3DF;line-height:1.35}
.notes textarea{
  width:100%;min-height:280px;background:#0D131A;border:1px solid #262F3B;border-radius:6px;
  color:#D2DCE6;padding:11px 12px;font-family:var(--f-body);font-size:14px;line-height:1.55;resize:vertical;
}
.notes textarea:focus{outline:none;border-color:var(--accent)}
.notes .tip{font-family:var(--f-mono);font-size:9.5px;color:#4F5D6B;line-height:1.7;margin-top:12px}

/* ============================ MODAL ============================ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,17,.72);display:none;padding:26px}
.modal.on{display:flex;align-items:center;justify-content:center}
.sheet{background:#fff;border-radius:10px;width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.sheet header h3{margin:0;font-family:var(--f-ui);font-size:15px;font-weight:650;flex:1}
.sheet .mb{padding:0;flex:1;overflow:auto;min-height:0}
.sheet textarea{width:100%;height:56vh;border:0;padding:16px 20px;font-family:var(--f-mono);font-size:11.5px;
  line-height:1.6;resize:none;outline:none;background:#F7F9FB;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.mbtn{font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:6px;
  border:1px solid var(--rule);background:#fff;color:var(--ink)}
.mbtn:hover{border-color:var(--ink-3)}
.mbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.help{padding:6px 20px 20px}
.help table{width:100%;border-collapse:collapse;font-size:13.5px}
.help td{padding:7px 10px;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
.help td:first-child{width:150px}
.help kbd{font-family:var(--f-mono);font-size:11px;background:#EEF3F8;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--ink)}
.help h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:20px 0 6px}

/* search */
.srch{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:55;width:min(680px,92vw);display:none}
body.srch-on .srch{display:block}
.srch input{width:100%;padding:13px 16px;border-radius:9px;border:1px solid #33404E;background:#0D131A;
  color:#E4EBF2;font-family:var(--f-ui);font-size:15px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.srch input:focus{outline:none;border-color:var(--accent)}
.sres{margin-top:6px;background:#131A23;border:1px solid #262F3B;border-radius:9px;max-height:52vh;
  overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sres button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid #1E2732;color:#C0CDD9}
.sres button:hover{background:#1C2530;color:#fff}

ke-linecap=\"round\"/><path d=\"M970 316 L993.0 316.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M1000.0 316.0 L991.0 311.6 L991.0 320.4 z\" fill=\"#8494A5\"/><text x=\"540.0\" y=\"338\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">calendar time</text><rect x=\"16\" y=\"358\" width=\"552\" height=\"88\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"386\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Why the gap exists</text><text x=\"36\" y=\"408\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Any feature computed over a window that straddles the boundary — a</text><text x=\"36\" y=\"424\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">30-day rolling mean, a centred filter, a label defined by a future</text><text x=\"36\" y=\"440\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">event — leaks the test period into training.</text><rect x=\"582\" y=\"358\" width=\"552\" height=\"88\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"602\" y=\"386\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">The two classic silent failures</text><text x=\"602\" y=\"408\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A centred rolling window (uses the future by construction), and target</text><text x=\"602\" y=\"424\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">encoding computed over the whole series. Both look like ordinary</text><text x=\"602\" y=\"440\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">feature engineering.</text></svg>", "f_confident": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Confident learning: estimate the joint, then rank</text><text x=\"20\" y=\"48\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">The object of study is the joint distribution of the noisy given label</text><text x=\"20\" y=\"62\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">and the latent true label — not the model's accuracy.</text><text x=\"204.0\" y=\"112\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">normal</text><text x=\"312.0\" y=\"112\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">stone</text><text x=\"420.0\" y=\"112\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">mass</text><text x=\"140\" y=\"165.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">normal</text><text x=\"140\" y=\"243.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">stone</text><text x=\"140\" y=\"321.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">mass</text><rect x=\"150\" y=\"122\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#D9E7F1\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"203.0\" y=\"165.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">412</text><rect x=\"258\" y=\"122\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#FBE7EB\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"311.0\" y=\"165.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">18</text><rect x=\"366\" y=\"122\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#FBE7EB\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"419.0\" y=\"165.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">6</text><rect x=\"150\" y=\"200\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#F6C9D2\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"203.0\" y=\"243.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">24</text><rect x=\"258\" y=\"200\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#D9E7F1\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"311.0\" y=\"243.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">281</text><rect x=\"366\" y=\"200\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#F6C9D2\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"419.0\" y=\"243.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">31</text><rect x=\"150\" y=\"278\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#FBE7EB\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"203.0\" y=\"321.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">9</text><rect x=\"258\" y=\"278\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#F6C9D2\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"311.0\" y=\"321.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">37</text><rect x=\"366\" y=\"278\" width=\"106\" height=\"76\" rx=\"4\" fill=\"#D9E7F1\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"419.0\" y=\"321.5\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">196</text><text x=\"312.0\" y=\"82\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">predicted (confident) label</text><g transform=\"translate(88,239.0) rotate(-90)\"><text x=\"0\" y=\"0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">label the annotator gave</text></g><rect x=\"20\" y=\"378\" width=\"560\" height=\"62\" rx=\"8\" fill=\"#FBF0F2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"38\" y=\"400\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">off-diagonal mass = candidate label errors</text><text x=\"38\" y=\"418\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Prune-by-noise-rate ranks them so a human adjudicates the worst first,</text><text x=\"38\" y=\"432\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">model-agnostically. It needs only calibrated out-of-sample probabilities.</text><rect x=\"20\" y=\"448\" width=\"560\" height=\"62\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"470\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Where it bites</text><text x=\"38\" y=\"488\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Northcutt et al. estimate ~3.4% average label error across ten canonical test sets,</text><text x=\"38\" y=\"502\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">including ~6% of the ImageNet validation set — enough to reorder model rankings.</text></svg>", "f_prune": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Pruning can beat power-law scaling</text><line x1=\"76\" y1=\"138.5\" x2=\"556\" y2=\"138.5\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"76\" y1=\"201.0\" x2=\"556\" y2=\"201.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\" ight=\"400\" font-family=\"IBM Plex Mono,monospace\">F</text><text x=\"622\" y=\"161\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Cholangiocarcinoma</text><text x=\"436\" y=\"187\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">50–59</text><text x=\"500\" y=\"187\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">402**</text><text x=\"578\" y=\"187\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">M</text><text x=\"622\" y=\"187\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Gallstones</text><text x=\"436\" y=\"213\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">50–59</text><text x=\"500\" y=\"213\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">402**</text><text x=\"578\" y=\"213\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">M</text><text x=\"622\" y=\"213\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Fatty liver</text><text x=\"436\" y=\"239\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">50–59</text><text x=\"500\" y=\"239\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">402**</text><text x=\"578\" y=\"239\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">M</text><text x=\"622\" y=\"239\" font-size=\"11.5\" text-ancho -size=\"11.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">All three attacked in turn.</text><rect x=\"30\" y=\"316\" width=\"1090\" height=\"116\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"50\" y=\"344\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">The homogeneity attack, in one line:</text><text x=\"50\" y=\"370\" font-size=\"13\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">every 30-something woman in postcode 400** has the same diagnosis — so knowing your neighbour's age and postcode is enough, even though k = 3.</text><text x=\"50\" y=\"400\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-style=\"italic\">This is why the field moved to differential privacy: a guarantee about the mechanism, not a property of the released table.</text></svg>", "f_bias": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Bias is not one thing that appears at the end — it enters at named points</text><rect x=\"40\" y=\"130\" width=\"155\" height=\"56\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"117.5\" y=\"163.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">The world</text><path d=\"M199 158 L212.0 158.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M219.0 158.0 L210.0 153.6 L210.0 162.4 z\" fill=\"#8494A5\"/><rect x=\"225\" y=\"130\" width=\"155\" height=\"56\" rx=\"8\" fill=\"#FAEEF2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"302.5\" y=\"163.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Sampling</text><path d=\"M384 158 L397.0 158.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M404.0 158.0 L395.0 153.6 L395.0 162.4 z\" fill=\"#8494A5\"/><rect x=\"410\" y=\"130\" width=\"155\" height=\"56\" rx=\"8\" fill=\"#FAEEF2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"487.5\" y=\"163.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Measurement</text><path d=\"M569 158 L582.0 158.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M589.0 158.0 L580.0 153.6 L580.0 162.4 z\" fill=\"#8494A5\"/><rect x=\"595\" y=\"130\" width=\"155\" height=\"56\" rx=\"8\" fill=\"#FAEEF2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"672.5\" y=\"163.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Preparation</text><path d=\"M754 158 L767.0 158.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M774.0 158.0 L765.0 153.6 L765.0 162.4 z\" fill=\"#8494A5\"/><rect x=\"780\" y=\"130\" width=\"155\" height=\"56\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"857.5\" y=\"163.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Model</text><path d=\"M939 158 L952.0 158.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M959.0 158.0 L950.0 153.6 L950.0 162.4 z\" fill=\"#8494A5\"/><rect x=\"965\" y=\"130\" width=\"155\" height=\"56\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"1042.5\" y=\"163.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Deployment</text><line x1=\"302.5\" y1=\"190\" x2=\"302.5\" y2=\"216\" stroke=\"#A3384F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"4 4\"/><rect x=\"40\" y=\"222\" width=\"340\" height=\"122\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"58\" y=\"250\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">Representation bias</text><text x=\"58\" y=\"274\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the sampled population is not the target</text><text x=\"58\" y=\"290\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">population — one hospital, one scanner, one</text><text x=\"58\" y=\"306\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">city</text><path d=\"M302.5 216 L216.99346424156505 219.69757992468908\" fill=\"none\" stroke=\"#A3384F\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 4\"/><path d=\"M210.0 220.0 L219.2 224.0 L218.8 215.2 z\" fill=\"#A3384F\"/><line x1=\"487.5\" y1=\"190\" x2=\"487.5\" y2=\"216\" stroke=\"#A3384F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"4 4\"/><rect x=\"402\" y=\"222\" width=\"340\" height=\"122\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"420\" y=\"250\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">Measurement bias</text><text x=\"420\" y=\"274\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the proxy is not the construct — cost of</text><text x=\"420\" y=\"290\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">care as a proxy for need, coded diagnosis as</text><text x=\"420\" y=\"306\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">a proxy for disease</text><path d=\"M487.5 216 L565.0078297063897 219.66900969024329\" fill=\"none\" stroke=\"#A3384F\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 4\"/><path d=\"M572.0 220.0 L563.2 215.2 L562.8 224.0 z\" fill=\"#A3384F\"/><line x1=\"672.5\" y1=\"190\" x2=\"672.5\" y2=\"216\" stroke=\"#A3384F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"4 4\"/><rect x=\"764\" y=\"222\" width=\"340\" height=\"122\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"782\" y=\"250\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">Aggregation bias</text><text x=\"782\" y=\"274\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">one model for groups that need different</text><text x=\"782\" y=\"290\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">models; and filtering / resampling that</text><text x=\"782\" y=\"306\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">quietly removes a subgroup</text><path d=\"M672.5 216 L927.0008187822834 219.89293795460472\" fill=\"none\" stroke=\"#A3384F\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"4 4\"/><path d=\"M934.0 220.0 L925.1 215.5 L924.9 224.3 z\" fill=\"#A3384F\"/><rect x=\"40\" y=\"362\" width=\"1070\" height=\"78\" rx=\"9\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"60\" y=\"390\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The preparation-specific warning:</text><text x=\"300\" y=\"390\" font-size=\"13\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">every reduction step — quality filtering, deduplication, coreset selection, toxicity filtering — is a sampling decision.</text><text x=\"60\" y=\"418\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-style=\"italic\">Count your subgroups before and after each filter, and put the two counts in the paper. That single table pre-empts most fairness reviews.</text></svg>", "f_lineage": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">A result you cannot trace to exact bytes is an anecdote</text><rect x=\"60\" y=\"66\" width=\"470\" height=\"46\" rx=\"7\" fill=\"#DDE5EC\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"80\" y=\"94\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">raw/2024-11-03/  — immutable snapshot</text><path d=\"M295 116 L295.0 131.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M295.0 138.0 L299.4 129.0 L290.6 129.0 z\" fill=\"#8494A5\"/><rect x=\"60\" y=\"142\" width=\"470\" height=\"46\" rx=\"7\" fill=\"#C6D3DF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"80\" y=\"170\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">clean.v3  — content hash a91f…</text><path d=\"M295 192 L295.0 207.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M295.0 214.0 L299.4 205.0 L290.6 205.0 z\" fill=\"#8494A5\"/><rect x=\"60\" y=\"218\" width=\"470\" height=\"46\" rx=\"7\" fill=\"#AEC0D0\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"80\" y=\"246\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">split.seed42.groups=patient</text><path d=\"M295 268 L295.0 283.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M295.0 290.0 L299.4 281.0 L290.6 281.0 z\" fill=\"#8494A5\"/><rect x=\"60\" y=\"294\" width=\"470\" height=\"46\" rx=\"7\" fill=\"#93A9BD\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"80\" y=\"322\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">features.v3  — config pinned</text><path d=\"M295 344 L295.0 359.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M295.0 366.0 L299.4 357.0 L290.6 357.0 z\" fill=\"#8494A5\"/><rect x=\"60\" y=\"370\" width=\"470\" height=\"46\" rx=\"7\" fill=\"#A3384F\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"80\" y=\"398\" font-size=\"12\" text-anchor=\"start\" fill=\"#fff\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">model.2024-11-09  — weights + prep config</text><rect x=\"20\" y=\"446\" width=\"560\" height=\"64\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"470\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Ship the preprocessing config with the weights</text><text x=\"38\" y=\"488\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">For a regulated product, a preprocessing change is a device change.</text><text x=\"38\" y=\"502\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Version-pin the whole transform chain.</text></svg>", "f_skew": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Training / serving skew: the same transform, defined twice, drifting apart</text><rect x=\"30\" y=\"52\" width=\"500\" height=\"152\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"50\" y=\"80\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Offline: training</text><text x=\"50\" y=\"104\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">pandas notebook · batch · full history available</text><rect x=\"50\" y=\"118\" width=\"460\" height=\"66\" rx=\"7\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"66\" y=\"144\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">mean_bp = df.groupby('pid').bp.mean()</text><text x=\"66\" y=\"166\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">df['bp_z'] = (df.bp - mean_bp) / df.bp.std()</text><rect x=\"620\" y=\"52\" width=\"500\" height=\"152\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"640\" y=\"80\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Online: serving</text><text x=\"640\" y=\"104\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Java service · one row · only the last 24 h in cache</text><rect x=\"640\" y=\"118\" width=\"460\" height=\"66\" rx=\"7\" fill=\"#FBF0F2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"656\" y=\"144\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">double z = (bp - CACHED_MEAN) / SD;</text><text x=\"656\" y=\"166\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">// re-implemented in 2023, never re-checked</text><path d=\"M534 128 L609.0 128.0\" fill=\"none\" stroke=\"#A3384F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"7 5\"/><path d=\"M616.0 128.0 L607.0 123.6 L607.0 132.4 z\" fill=\"#A3384F\"/><text x=\"575.0\" y=\"118\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#A3384F\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">should be identical</text><rect x=\"30\" y=\"224\" width=\"1090\" height=\"96\" rx=\"9\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"50\" y=\"252\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The fix is architectural, not disciplinary:</text><text x=\"348\" y=\"252\" font-size=\"13\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">one transform definition, executed in both paths — a feature store, or the model artefact carrying its own preprocessing graph.</text><text x=\"50\" y=\"282\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\">Then add the test that actually catches it: replay a day of production requests through the offline path and assert the feature vectors match to tolerance.</text><text x=\"50\" y=\"304\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\">Point-in-time correctness is the other half — an offline join must only see what was knowable at the timestamp being scored.</text><text x=\"575.0\" y=\"358\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">This is where a large share of “the model was great in the notebook and useless in the clinic” stories actually end up.</text><text x=\"575.0\" y=\"390\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\" font-style=\"italic\">It is a data-preparation bug, not a modelling bug, and it is invisible to every offline metric you have.</text></svg>", "f_ovrdt": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Preparation as a deployed model: the OV-RDT screening platform (Sci Rep 2025)</text><rect x=\"30\" y=\"74\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"130.0\" y=\"106.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Field photo</text><text x=\"130.0\" y=\"122.0\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">phone, variable light</text><path d=\"M233 109 L246.0 109.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M253.0 109.0 L244.0 104.6 L244.0 113.4 z\" fill=\"#8494A5\"/><rect x=\"258\" y=\"74\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FAEEF2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"358.0\" y=\"106.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Capture QC</text><text x=\"358.0\" y=\"122.0\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">YOLOv5m detector</text><path d=\"M461 109 L474.0 109.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M481.0 109.0 L472.0 104.6 L472.0 113.4 z\" fill=\"#8494A5\"/><rect x=\"486\" y=\"74\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FAEEF2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"586.0\" y=\"106.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Crop + normalise</text><text x=\"586.0\" y=\"122.0\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">test strip only</text><path d=\"M689 109 L702.0 109.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M709.0 109.0 L700.0 104.6 L700.0 113.4 z\" fill=\"#8494A5\"/><rect x=\"714\" y=\"74\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"814.0\" y=\"106.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Grading model</text><text x=\"814.0\" y=\"122.0\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">infection intensity</text><path d=\"M917 109 L930.0 109.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M937.0 109.0 L928.0 104.6 L928.0 113.4 z\" fill=\"#8494A5\"/><rect x=\"942\" y=\"74\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"1042.0\" y=\"106.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Result</text><text x=\"1042.0\" y=\"122.0\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">with a refusal option</text><path d=\"M236 152 q0.0 0 0.0 0.0 L236.0 152.0 q0.0 0 0.0 0.0 M236 152 q0.0 0 0.0 0.0 L236.0 152.0 q0.0 0 0.0 0.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"244\" y1=\"156\" x2=\"672\" y2=\"156\" stroke=\"#A3384F\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"458\" y=\"176\" font-size=\"12\" text-anchor=\"middle\" fill=\"#A3384F\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">data preparation, shipped as models, with their own metrics</text><rect x=\"30\" y=\"208\" width=\"356\" height=\"132\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"48\" y=\"236\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The datasets behind it</text><text x=\"48\" y=\"262\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">8,624</text><text x=\"150\" y=\"262\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">expert-annotated images</text><text x=\"48\" y=\"282\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">6,900 / 1,724</text><text x=\"150\" y=\"282\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train / test, split first</text><text x=\"48\" y=\"302\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">574</text><text x=\"150\" y=\"302\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">images for the QC model</text><text x=\"48\" y=\"322\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">100 + 100</text><text x=\"150\" y=\"322\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">good / failed, for QC eval</text><rect x=\"398\" y=\"208\" width=\"356\" height=\"132\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"416\" y=\"236\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Why QC is a separate model</text><text x=\"416\" y=\"260\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A blurred or half-framed strip is not a hard</text><text x=\"416\" y=\"276\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">example, it is an un-answerable one. Rejecting</text><text x=\"416\" y=\"292\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">it at capture time is cheaper and safer than</text><text x=\"416\" y=\"308\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">asking the grading model to be robust to it.</text><rect x=\"766\" y=\"208\" width=\"356\" height=\"132\" rx=\"9\" fill=\"#FAEEF2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"784\" y=\"236\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">The transferable lesson</text><text x=\"784\" y=\"260\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">In a field deployment, the largest quality</text><text x=\"784\" y=\"276\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">gains come from refusing bad input, not from a</text><text x=\"784\" y=\"292\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">better classifier. Budget annotation for the</text><text x=\"784\" y=\"308\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">gate, not only for the task.</text><text x=\"575.0\" y=\"380\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Junsawang, Techasen, Wiratchawa, Wanna, Wongphutorn, Worasith, Sithithaworn, Bulathwela &amp; Intharah, Scientific Reports 15:31062 (2025)</text><text x=\"575.0\" y=\"418\" font-size=\"13\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Ask the room: what is the equivalent “refuse to answer” gate in your project, and who currently plays that role?</text></svg>", "f_docstack": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Four documents, four different readers</text><rect x=\"24\" y=\"62\" width=\"552\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"62\" width=\"6\" height=\"96\" rx=\"3\" fill=\"#C6D3DF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"46\" y=\"88\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Datasheet for datasets</text><text x=\"46\" y=\"110\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">motivation, composition, collection, preprocessing, uses,</text><text x=\"46\" y=\"125\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">distribution, maintenance</text><text x=\"46\" y=\"148\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Gebru et al., CACM 2021</text><rect x=\"24\" y=\"170\" width=\"552\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"170\" width=\"6\" height=\"96\" rx=\"3\" fill=\"#AEC0D0\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"46\" y=\"196\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Data statement / Data card</text><text x=\"46\" y=\"218\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">who is represented, in what language, gathered how, with what</text><text x=\"46\" y=\"233\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">known gaps</text><text x=\"46\" y=\"256\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Bender &amp; Friedman 2018; Pushkarna et al. 2022</text><rect x=\"24\" y=\"278\" width=\"552\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"278\" width=\"6\" height=\"96\" rx=\"3\" fill=\"#93A9BD\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"46\" y=\"304\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Model card</text><text x=\"46\" y=\"326\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">intended use, out-of-scope use, metrics disaggregated by</text><text x=\"46\" y=\"341\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">subgroup</text><text x=\"46\" y=\"364\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Mitchell et al. 2019</text><rect x=\"24\" y=\"386\" width=\"552\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"386\" width=\"6\" height=\"96\" rx=\"3\" fill=\"#A3384F\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"46\" y=\"412\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font- 8 C433.8 225.8 433.8 231.7 437.5 231.7 C441.2 231.7 441.2 236.5 445.0 236.5 C448.8 236.5 448.8 240.2 452.5 240.2 C456.2 240.2 456.2 243.0 460.0 243.0 C463.8 243.0 463.8 245.1 467.5 245.1 C471.2 245.1 471.2 246.7 475.0 246.7 C478.8 246.7 478.8 247.8 482.5 247.8 C486.2 247.8 486.2 248.5 490.0 248.5 C493.8 248.5 493.8 249.1 497.5 249.1 C501.2 249.1 501.2 249.4 505.0 249.4 C508.8 249.4 508.8 249.6 512.5 249.6 C516.2 249.6 516.2 249.8 520.0 249.8 C523.8 249.8 523.8 249.9 527.5 249.9 C531.2 249.9 531.2 249.9 535.0 249.9 C538.8 249.9 538.8 250.0 542.5 250.0 C546.2 250.0 546.2 250.0 550.0 250.0\" fill=\"none\" stroke=\"#A3384F\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"78\" y1=\"114\" x2=\"96\" y2=\"114\" stroke=\"#2D5C8A\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"102\" y=\"118\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">query on D</text><line x1=\"78\" y1=\"135\" x2=\"96\" y2=\"135\" stroke=\"#A3384F\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"102\" y=\"139\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">query on D without you</text><text x=\"310.0\" y=\"274\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">indistinguishable up to e^ε</text><rect x=\"20\" y=\"288\" width=\"560\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"314\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The cost, stated honestly</text><text x=\"38\" y=\"336\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">DP-SGD adds clipped-gradient noise. On a small clinical cohort the accuracy</text><text x=\"38\" y=\"351\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">cost is real and grows as ε shrinks. Report the utility curve across ε, not</text><text x=\"38\" y=\"366\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">a single operating point, and never quote ε without δ and the composition</text><text x=\"38\" y=\"381\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">accounting.</text><rect x=\"20\" y=\"396\" width=\"560\" height=\"110\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"38\" y=\"422\" font-size=\"13\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">What DP does not do</text><text x=\"38\" y=\"444\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">It does not protect a group-level fact you were happy to publish. It does</text><text x=\"38\" y=\"459\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">not fix a dataset whose very existence is the disclosure. And an ε large</text><text x=\"38\" y=\"474\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">enough to keep accuracy acceptable may offer little practical protection —</text><text x=\"38\" y=\"489\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">say so in the paper rather than letting the acronym do the work.</text></svg>"}, "slides": [{"kind": "title", "kick": "Research Master · Data Science and Machine Learning", "title": "Cross-cutting foundations", "lead": "Everything that is true whether your data is a table, a corpus or a scan — and where most published mistakes actually live.", "meta": "<b>Chapter 0 of 4</b> &nbsp;·&nbsp; Data Preparation for Machine Learning and AI<br>Thanapong Intharah &nbsp;·&nbsp; Visual Intelligence Laboratory &nbsp;·&nbsp; Khon Kaen University<br>Maps to weeks 1, 2 and 12 of the twelve-week plan", "notes": "Open by asking the room how they currently split their data. Most will say random 80/20. Hold that answer; you come back to it in section 0.3 and it will look different by then."}, {"kind": "split", "sec": "0.0", "secTitle": "Why this chapter comes first", "kick": "Orientation", "title": "Why this chapter comes first", "lead": "The tabular, text and image chapters are technique catalogues. This one is the discipline that decides whether any of those techniques produced a real number.", "b": ["Every later chapter has a step where a transform is fitted. <b>Where</b> you fit it is decided here.", "Every later chapter has labels. <b>How much you trust them</b> is decided here.", "Every later chapter reduces data — filtering, deduplication, pruning, resampling. Whether that reduction was a <b>sampling decision with a victim</b> is decided here.", "And every later chapter produces a claim someone will try to reproduce."], "fig": "f_crisp", "figcap": "<b>CRISP-DM, 1996/2000.</b> Still the best shared vocabulary for where preparation sits. Its blind spots are the reason this course exists.", "callout": {"h": "The organising claim", "p": "Curation choices now drive downstream performance at least as much as architecture — so they need the same evaluation rigour we already demand of models."}, "notes": "The two highlighted phases in the diagram are the whole course. Point out what CRISP-DM does NOT model: labels as an object of study, corpus-scale curation, and preparation as the main experimental variable.", "cites": ["Chapman et al. <i>CRISP-DM 1.0 Step-by-step data mining guide.</i> 2000."]}, {"kind": "cols", "title": "What you should be able to do by the end", "kick": "Learning outcomes", "sm": true, "cols": [{"sub": "Diagnose", "h": "Read a pipeline and find the leak", "b": ["Name the split design a claim requires and say why", "Apply the eight-type leakage taxonomy to a published paper", "Spot preprocessing fitted outside the fold in someone else's code", "Recognise duplicate-driven and temporal leakage"]}, {"sub": "Measure", "h": "Put a number on data quality", "b": ["Operationalise the six quality dimensions as computable tests", "Choose a drift statistic and state its sample-size caveat", "Estimate label error with confident learning", "Report subgroup counts before and after every filter"]}, {"sub": "Decide", "h": "Justify a curation choice", "b": ["Argue a missingness mechanism, a pruning metric, a privacy model", "Report the honest baseline you had to beat", "Choose between de-identification, DP and federation", "Say what a filter removed, and from whom"], "acc": true}, {"sub": "Document", "h": "Make the work reproducible", "b": ["Write a datasheet and a valid Croissant record", "Version data so a result traces to exact bytes", "Ship the preprocessing config with the weights", "Fill in a model info sheet before submission"]}], "notes": "These four verbs map onto the assessment rubric in Chapter 4: diagnose, measure, decide, document.", "sec": "0.0", "secTitle": "Why this chapter comes first"}, {"kind": "table", "title": "The eight sections of this chapter", "kick": "Chapter map", "sm": true, "table": {"head": ["Section", "What it settles", "Week"], "rows": [["0.1 Framing", "Where preparation sits, and the three separate engineering problems hiding inside “data work”", "1"], ["0.2 Quality and validation", "Turning quality adjectives into computable, failing tests", "1"], ["0.3 Splitting and leakage", "The anchor section — evaluation hygiene, and the eight ways it breaks", "2"], ["0.4 Labels and label noise", "Annotation protocols, agreement, and estimating how wrong your labels are", "3"], ["0.5 Reduction and valuation", "Which examples to keep when you cannot keep them all", "11"], ["0.6 Synthetic data", "The fidelity–utility–privacy trilemma, and model collapse", "5"], ["0.7 Privacy, fairness and law", "De-identification, differential privacy, bias entry points, the EU AI Act", "12"], ["0.8 Documentation and infrastructure", "Datasheets, Croissant, versioning, feature stores, throughput", "12"]]}, "callout": {"h": "How to use the deck", "p": "Press <b>E</b> to edit any line in place, <b>N</b> for the speaker-notes panel, <b>O</b> for the slide grid, and <b>P</b> to print a handout with notes underneath each slide."}, "notes": "Sections 0.3 and 0.4 carry the most weight. If time is short, cut 0.5 and set it as reading.", "sec": "0.0", "secTitle": "Why this chapter comes first"}, {"kind": "divider", "sec": "0.1", "secTitle": "Framing: where preparation sits", "no": "0.1", "title": "Framing: where preparation sits", "lead": "Before any technique: what problem are we actually solving, and against what metric?", "chips": ["The data-centric turn", "Three-goal decomposition", "CRISP-DM and its limits", "The 80% folklore", "Task-first design", "DC-Check", "Automated preparation"]}, {"kind": "figure", "title": "The data-centric turn", "kick": "0.1.1", "tag": "frontier", "lead": "Same compute budget. The difference is which of the two things you hold constant.", "fig": "f_datacentric", "figcap": "Andrew Ng's framing, formalised in the data-centric AI surveys. The claim is not that architecture stopped mattering — it is that at a fixed model, systematic data improvement is now the higher-yield lever, and it is far less explored.", "notes": "Ask: in your last project, how many hours went to the left loop and how many to the right? Nearly everyone reports the left. That asymmetry is the opportunity.", "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "figure", "title": "Three goals that get collapsed into one", "kick": "0.1.2", "tag": "frontier", "lead": "Zha et al.<sup class=\"fn\">1</sup> split data work into three problems with three different success criteria. Keeping them apart is most of the discipline.", "fig": "f_threegoal", "figcap": "<b>Teaching use:</b> when a student says “I improved the data”, ask which of the three columns they mean, and which metric moved.", "notes": "The classic student failure: improve training data, evaluate on an inference set built from the same contaminated pool, and report a gain that is really an overlap.", "cites": ["Zha et al. <i>Data-centric Artificial Intelligence: A Survey.</i> ACM Computing Surveys, 2025."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "bullets", "title": "The “80% of the time” claim, and how to replace it", "kick": "0.1.3–0.1.4", "tag": "textbook", "lead": "The number is folklore repeated from industry surveys with small, self-selected samples. It is a useful conversation opener and a bad citation.", "b": ["<b>What it gets right:</b> preparation dominates the calendar in most applied projects, and it is undervalued in publication.", "<b>What it hides:</b> the fraction varies enormously by data family. A curated tabular benchmark is not a hospital PACS export.", "<b>Better move:</b> measure it in your own project. Log hours against CRISP-DM phases for one term and report your own number in the capstone.", "<b>Even better:</b> log <em>rework</em> hours separately — time spent redoing preparation after a downstream discovery. That is the number that motivates validation gates.", "This is also the honest answer when a reviewer asks why a data paper deserves a slot: because the effort is real and currently invisible."], "callout": {"h": "Habit to build", "p": "Whenever you meet a striking quantitative claim in this course, ask three questions: who measured it, on what sample, and were they the same people who benefit from the answer? Several claims in the later chapters are the dataset authors' own ablations."}, "notes": "This slide is where you set the epistemic tone for the whole module.", "cites": ["Chapman et al. <i>CRISP-DM 1.0 Step-by-step data mining guide.</i> 2000."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "cols", "title": "Task-first design, and DC-Check as a project gate", "kick": "0.1.5–0.1.6", "tag": "both", "sm": true, "lead": "Every transform should be traceable to a decision you already made about the task. If it is not, you are decorating.", "cols": [{"sub": "Decide first", "h": "Four commitments before you touch the data", "b": ["<b>Downstream task</b> — classification, ranking, segmentation, generation?", "<b>Unit of analysis</b> — patient, visit, image, camera-hour, document, chunk?", "<b>Evaluation metric</b> — and the decision it stands in for", "<b>Deployment constraint</b> — latency, device, who acts on the output"]}, {"sub": "Then derive", "h": "Each one constrains the preparation", "b": ["The unit of analysis fixes the <b>split design</b> and the join grain", "The metric fixes whether <b>calibration</b> matters or only ranking", "The deployment constraint fixes the <b>preprocessing budget</b> at inference", "The task fixes what counts as an <b>outlier</b> versus a rare event"], "acc": true}, {"sub": "Then check", "h": "DC-Check, stage by stage", "b": ["A data-centric checklist answered <em>before</em> building, not after", "Forces the uncomfortable questions early: provenance, subgroup coverage, drift plan", "Works well as the first deliverable of a research project", "Seedat<sup class=\"fn\">1</sup>, Imrie & van der Schaar, 2022"]}], "notes": "Make the four commitments a required section of the project proposal. Students who skip them produce the leakage you will diagnose in week 2.", "cites": ["Seedat & Imrie. <i>DC-Check: A Data-Centric AI Checklist to Guide the Development of Reliable Machine Learning….</i> 2022."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "split", "title": "Automated data preparation, and why it lags AutoML", "kick": "0.1.7", "tag": "frontier", "wide": "text", "lead": "Model search is largely solved as an engineering problem. Preparation search is not, and the reasons are instructive.", "b": ["<b>The search space is not closed.</b> A model space is a set of known architectures; a preparation space includes “construct a feature nobody has named yet”.", "<b>The objective is not scalar.</b> Fidelity, fairness, privacy and cost all move, and a single validation score hides three of them.", "<b>Order matters and is not commutative.</b> Impute-then-scale differs from scale-then-impute; filter ordering changes corpus composition.", "<b>Validation is fragile.</b> The thing being searched is the thing that leaks — so a naive AutoML loop over preprocessing overfits the validation set faster than model search does.", "<b>Where it works today:</b> constrained, well-typed pipelines with strong fold discipline. Treat published pipeline-search results with the same scepticism you apply to any tuned number."], "fig": "f_validgate", "figcap": "Any automated search is only as honest as the gate it must pass through.", "notes": "Good thesis territory: pipeline optimisation with a multi-objective criterion and nested validation.", "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "refs", "title": "Section 0.1 — references", "kick": "Reading", "sm": true, "refs": ["Zha, Bhat, Lai, Yang, Jiang, Zhong &amp; Hu. <b>Data-centric Artificial Intelligence: A Survey.</b> <i>ACM Computing Surveys</i>, 2025 (arXiv:2303.10158).", "Jakubik, Vössing, Kühl, Walk &amp; Satzger. <b>Data-centric Artificial Intelligence.</b> 2024 (arXiv:2212.11854).", "Seedat, Imrie &amp; van der Schaar. <b>DC-Check: A Data-Centric AI Checklist to Guide the Development of Reliable Machine Learning Systems.</b> 2022.", "Chapman et al. <b>CRISP-DM 1.0 Step-by-step data mining guide.</b> 2000; Fayyad, Piatetsky-Shapiro &amp; Smyth, <b>From Data Mining to Knowledge Discovery.</b> <i>AI Magazine</i>, 1996.", "Whang, Roh, Song &amp; Lee. <b>Data Collection and Quality Challenges in Deep Learning: A Data-Centric AI Perspective.</b> <i>VLDB Journal</i>, 2023.", "Mazumder et al. <b>DataPerf: Benchmarks for Data-Centric AI Development.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2023."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "divider", "sec": "0.2", "secTitle": "Data quality, profiling and validation", "no": "0.2", "title": "Quality, profiling and validation", "lead": "A quality dimension you cannot compute is an adjective. This section turns six adjectives into failing tests.", "chips": ["Six dimensions", "Profiling", "Schema contracts", "Unit tests for data", "Drift taxonomy", "Drift statistics", "Corpus auditing"]}, {"kind": "figure", "title": "Six quality dimensions, operationalised", "kick": "0.2.1", "tag": "textbook", "lead": "Wang &amp; Strong<sup class=\"fn\">1</sup>'s dimensions are forty years old and still the right list. The teaching move is to insist on the third line of each box.", "fig": "f_quality", "figcap": "Adapted from Wang &amp; Strong (1996) and Batini &amp; Scannapieco. The right-hand test column is the part students skip.", "notes": "Exercise, five minutes: pick any dataset in the room and write the six tests. Most groups stall on Accuracy — which is the point, because it needs a reference standard they have not defined.", "cites": ["Wang & Strong. <i>Beyond Accuracy: What Data Quality Means to Data Consumers.</i> JMIS, 1996."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "bullets", "title": "Profiling: the first pass you never skip", "kick": "0.2.2", "tag": "textbook", "b": ["<b>Per column:</b> type, cardinality, null rate, min/max, distribution shape, top values, and how many values are impossible.", "<b>Per pair:</b> correlation, and the missingness co-occurrence map — columns that go missing together tell you about the collection process.", "<b>Per row:</b> duplicate rate, near-duplicate rate, and completeness profile.", "<b>Per group:</b> everything above, stratified by site, scanner, camera, clinician or time window. This is where site effects announce themselves.", "<b>Tooling:</b> <span class='k'>ydata-profiling</span>, <span class='k'>Sweetviz</span>, <span class='k'>pandas.describe</span> for a first look; <span class='k'>Great Expectations</span>, <span class='k'>TFDV</span>, <span class='k'>Deequ</span> once you know what to assert.", "The profiling report is <em>not</em> a deliverable. The assertions you write after reading it are."], "callout": {"h": "Teaching point", "p": "Tukey<sup class=\"fn\">1</sup>'s <i>Exploratory Data Analysis</i> (1977) argued for looking before modelling. The modern version of that argument is: look, then encode what you saw as a test that will fail next month when it stops being true."}, "notes": "Show a real ydata-profiling report on screen for two minutes. Then close it and ask what they would assert.", "cites": ["Tukey. <i>Exploratory Data Analysis. Addison-Wesley.</i> 1977."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "split", "title": "Schema contracts and unit tests for data", "kick": "0.2.3–0.2.4", "tag": "both", "wide": "text", "b": ["<b>Declare the contract:</b> expected types, ranges, allowed categories, referential integrity, row-count bounds, and the acceptable null rate per column.", "<b>Assert twice:</b> once on the raw source, once after transformation. A transform that silently produces NaNs passes the first gate and fails the second.", "<b>Fail loudly.</b> A warning in a log is not a gate. The pipeline stops and a human is paged.", "<b>Treat data like code:</b> assertions, fixtures, golden files, and CI that runs on every data refresh — the ML Test Score framing (Breck et al.<sup class=\"fn\">1</sup>, 2017).", "<b>Version the contract</b> alongside the data. A relaxed threshold is a decision that should appear in a diff.", "<b>What to assert about distributions:</b> not equality, but bounded divergence from the previous accepted release."], "fig": "f_validgate", "figcap": "Two suites, not one: the raw gate catches upstream change, the post-transform gate catches your own bugs.", "notes": "War story worth telling: a unit change upstream (mg/dL to mmol/L) that passed every type check and silently halved a model's sensitivity for four months.", "cites": ["Breck et al. <i>The ML Test Score.</i> IEEE Big Data, 2017."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "figure", "title": "Three shifts, three responses", "kick": "0.2.5", "tag": "textbook", "lead": "Covariate shift, prior shift and concept drift look identical on a dashboard. They demand different fixes.", "fig": "f_drift", "figcap": "Taxonomy after Quiñonero-Candela et al.<sup class=\"fn\">1</sup> (2009) and Moreno-Torres et al.<sup class=\"fn\">2</sup> (2012). The distinction matters because only the third one forces you to relabel.", "notes": "Concrete Thai examples: a new ultrasound machine at a district hospital is covariate shift; moving screening from a referral clinic to a village is prior shift; a revised diagnostic guideline is concept drift.", "cites": ["Quiñonero-Candela et al. <i>Dataset Shift in Machine Learning. MIT Press.</i> 2009.", "Moreno-Torres et al. <i>A unifying view on dataset shift.</i> Pattern Recognition, 2012."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "table", "title": "Choosing a drift statistic — and its caveat", "kick": "0.2.6", "tag": "both", "sm": true, "table": {"head": ["Statistic", "What it compares", "Where it misleads"], "rows": [["PSI (population stability index)", "Binned marginal distributions", "Bin choice dominates the value; industry thresholds (0.1 / 0.25) are conventions, not theory"], ["Kolmogorov–Smirnov", "Empirical CDFs, one dimension", "Univariate only, and at n &gt; 10⁵ it flags differences far too small to matter"], ["Chi-square", "Categorical frequencies", "Sensitive to rare categories and to sample size in the same way"], ["MMD (kernel two-sample)", "Full multivariate distributions", "Kernel and bandwidth choice; expensive; hard to attribute to a column"], ["Classifier two-sample test", "Can a model tell old from new?", "The most interpretable — the classifier's importances name the drifting feature — but it needs its own honest split"]]}, "callout": {"h": "The caveat that matters most", "p": "Every one of these is a hypothesis test. With enough rows, everything is significant. Monitor <b>effect size and downstream metric impact</b>, not p-values — and always ask whether the change is one you should adapt to or one you should reject at the gate."}, "notes": "The classifier two-sample test is the one to teach in the lab: it is trivial to implement and it tells you WHICH feature moved.", "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "bullets", "title": "Auditing what is actually in a corpus", "kick": "0.2.7", "tag": "frontier", "lead": "For anything web-scale, the README is a hypothesis. Treat it as one.", "b": ["<b>Search it, do not trust it.</b> Elazar et al.<sup class=\"fn\">1</sup>, <em>What's In My Big Data?</em> (ICLR 2024), built tooling precisely because nobody could answer basic questions about their own pretraining corpora.", "<b>Documented findings that should worry you:</b> benchmark contamination, large volumes of machine-generated and duplicated text, and PII sitting in supposedly public data.", "<b>Dodge et al.<sup class=\"fn\">2</sup> (2021)</b> did the same for C4 and found blocklist filtering removing whole registers of legitimate text along with the noise.", "<b>Minimum audit for any corpus you use:</b> sample 200 documents at random and read them. Yes, actually read them. It takes an afternoon and it changes every downstream decision.", "<b>Then quantify:</b> language mix, source-domain mix, duplication rate, date distribution, and overlap with every benchmark you intend to report."], "callout": {"h": "Seminar exercise", "p": "Hand each student a different public dataset and one instruction: “find three things in it that its documentation does not mention.” Nobody has ever come back empty-handed."}, "notes": "This is the highest-value-per-minute exercise in the whole module.", "cites": ["Elazar et al. <i>What's In My Big Data?.</i> ICLR, 2024.", "Dodge et al. <i>Documenting Large Webtext Corpora: A Case Study on the Colossal Cl
