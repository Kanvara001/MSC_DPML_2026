ean Crawled Corpus.</i> EMNLP, 2021."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "refs", "title": "Section 0.2 — references", "kick": "Reading", "sm": true, "refs": ["Wang &amp; Strong. <b>Beyond Accuracy: What Data Quality Means to Data Consumers.</b> <i>JMIS</i>, 1996.", "Breck, Cai, Nielsen, Salib &amp; Sculley. <b>The ML Test Score.</b> <i>IEEE Big Data</i>, 2017.", "Quiñonero-Candela, Sugiyama, Schwaighofer &amp; Lawrence. <b>Dataset Shift in Machine Learning.</b> MIT Press, 2009.", "Moreno-Torres, Raeder, Alaiz-Rodríguez, Chawla &amp; Herrera. <b>A unifying view on dataset shift.</b> <i>Pattern Recognition</i>, 2012.", "Elazar et al. <b>What's In My Big Data?</b> <i>ICLR</i>, 2024.", "Dodge et al. <b>Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus.</b> <i>EMNLP</i>, 2021.", "Tukey. <b>Exploratory Data Analysis.</b> Addison-Wesley, 1977.", "Tooling: Great Expectations, TensorFlow Data Validation, Amazon Deequ, ydata-profiling, Evidently, NannyML."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "divider", "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene", "no": "0.3", "title": "Splitting, leakage and evaluation hygiene", "lead": "The anchor section of the whole module. If a student remembers one thing from this course, make it this.", "chips": ["Split designs", "Cross-validation", "Eight leakage types", "Fitting inside folds", "Duplicates", "Temporal validity", "Contamination", "Model info sheets"]}, {"kind": "figure", "title": "The same data, split three ways", "kick": "0.3.1", "tag": "textbook", "lead": "Only one of these designs answers the question a clinical or surveillance claim is actually making.", "fig": "f_splits", "figcap": "Eight patients, three images each. The grouping unit is a modelling decision, not a technicality — and it must be declared before the first experiment.", "notes": "This is the slide to slow down on. Ask each group to name the grouping unit for their own project and write it on the board. Disagreements within a group are the interesting part.", "cites": ["Intharah et al. <i>BiTNet: Hybrid deep convolutional model for ultrasound image analysis of human biliary tract….</i> Artificial Intelligence in Medicine, 2023.", "Kapoor & Narayanan. <i>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</i> Patterns 4(9), 2023."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "split", "title": "Cross-validation, and the variant you probably need", "kick": "0.3.2", "tag": "textbook", "wide": "text", "b": ["<b>k-fold</b> — the default. Fine when rows are exchangeable and plentiful, which in health data they almost never are.", "<b>Stratified k-fold</b> — preserves class balance per fold. Mandatory under imbalance; still wrong if rows are grouped.", "<b>Group k-fold / leave-one-group-out</b> — the correct default for patients, sites, scanners, cameras and sessions.", "<b>Nested CV</b> — an inner loop for tuning, an outer loop for estimating. Without it, the reported score includes the model-selection search (Cawley &amp; Talbot<sup class=\"fn\">3</sup>, 2010).", "<b>Blocked / walk-forward</b> — for anything with a time index. Covered in 0.3.8.", "<b>Repeated CV</b> — reduces variance of the estimate; does <em>not</em> reduce bias from a wrong design. Repeating a leaky split just gives you a precise wrong number."], "fig": "f_foldfit", "figcap": "Whichever variant you pick, the transform must be fitted inside the training portion of every fold.", "callout": {"h": "The rule of thumb", "p": "Pick the split that makes the training set <em>least</em> like the test set among all designs that are still honest. Optimism comes from similarity you did not intend."}, "notes": "Varma & Simon (2006) is the cleanest demonstration that selecting features on all data then cross-validating gives near-zero error on pure noise.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013.", "Cawley & Talbot. <i>On Over-fitting in Model Selection and Subsequent Selection Bias in Performance Evaluation.</i> JMLR, 2010."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "table", "title": "The eight-type leakage taxonomy", "kick": "0.3.3", "tag": "frontier", "sm": true, "lead": "Kapoor &amp; Narayanan<sup class=\"fn\">1</sup> surveyed 22 reviews and found leakage in 17 fields, collectively affecting 294 papers.", "table": {"head": ["#", "Type", "How it shows up in practice"], "rows": [["L1.1", "No test set at all", "The reported number is training performance, sometimes without the authors realising"], ["L1.2", "Pre-processing on the full dataset", "Scaler, imputer, encoder or PCA fitted before the split"], ["L1.3", "Feature selection on the full dataset", "Screening by correlation with y across all rows, then cross-validating what survives"], ["L1.4", "Duplicates across the split", "Exact or near-duplicate rows, images, frames or documents on both sides"], ["L2", "Illegitimate features", "A feature that is a proxy for the target, or is only recorded after the outcome is known"], ["L3.1", "Temporal leakage", "Training on data from after the prediction time; centred windows; future-looking aggregates"], ["L3.2", "Non-independence", "Same patient, site, device, author or session on both sides of the split"], ["L3.3", "Sampling bias in test", "The test set is not drawn from the population the claim is about"]]}, "callout": {"h": "The finding worth quoting", "p": "In their civil-war-prediction reproduction, once the leakage is corrected, complex ML models do <b>not</b> perform substantively better than decades-old logistic regression."}, "notes": "Print this table. It becomes the marking rubric for the paper-clinic seminar in Chapter 4.", "cites": ["Kapoor & Narayanan. <i>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</i> Patterns 4(9), 2023."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "figure", "title": "Where you fit the transform", "kick": "0.3.5", "tag": "textbook", "lead": "The single most common leak in applied machine learning, and the easiest to prevent in code.", "fig": "f_foldfit", "figcap": "The guard is architectural: wrap every stateful transform in a <span class='k'>Pipeline</span> / <span class='k'>ColumnTransformer</span> and hand the pipeline — never a pre-fitted array — to the cross-validator.", "notes": "Ask them to name a stateful transform they have fitted outside a fold. Everyone has. The honest answer normalises the discussion and makes the lab less threatening.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "split", "title": "The optimism gap, measured", "kick": "0.3.5", "tag": "frontier", "lead": "Leakage does not produce a small bias. It produces the difference between a publishable result and a real one.", "b": ["Every bar to the left of the dashed line is a <b>result someone has published</b>, in some field, in the last five years.", "The gap is largest exactly where data is scarcest and grouping is strongest — which is to say, in clinical research.", "<b>Lab 1 is built on this figure:</b> students fit the same model with transforms inside and outside the folds, then quantify their own gap.", "Writing it up against the eight-type taxonomy is the deliverable, not the number.", "<b>The professional habit:</b> report both numbers. “Random split 0.94, patient-grouped split 0.79” is a stronger paper than either number alone, because it demonstrates you knew to look."], "fig": "f_leakbars", "figcap": "Illustrative shape only — the point is the ordering and the size of the gap, not these specific values.", "notes": "Be explicit that the bar heights are illustrative. Students will otherwise cite them.", "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "split", "title": "Duplicates, and grouping in clinical and CCTV data", "kick": "0.3.6–0.3.7", "tag": "both", "wide": "text", "b": ["<b>Near-duplicates are the silent accuracy inflator.</b> Two frames one second apart, the same slide scanned twice, the same report copy-forwarded, the same web page under two URLs.", "<b>Detection:</b> exact hashing, then perceptual hashing or MinHash/LSH for the near cases, then embedding nearest-neighbours for the semantic ones. Cheap; do it before you split.", "<b>In clinical imaging</b> the grouping unit is the <b>patient</b> at minimum, and the <b>site or scanner</b> for any generalisation claim.", "<b>In video and CCTV</b> the unit is the <b>camera and the session</b> — never the frame. Frames within a clip are almost perfectly correlated.", "<b>In text</b> it is the <b>document or the author</b>, and for RAG evaluation it is the <b>source document</b>, not the chunk.", "<b>The test:</b> if two rows would still be in the dataset had you sampled one fewer patient, camera or document, they belong to the same group."], "fig": "f_ovrdt", "figcap": "In our own OV-RDT work the grouping unit is the specimen, and capture quality is handled by a separate model before grading — a preparation decision that carries its own dataset and its own metric.", "notes": "Cite: Junsawang et al., Sci Rep 15:31062 (2025). Emphasise that the QC detector needed its own 574-image annotated set — preparation work that would be invisible in a results table.", "cites": ["Junsawang et al. <i>AI-enhanced rapid diagnostic testing platform for mass opisthorchiasis screening.</i> Scientific Reports 15:31062, 2025."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "figure", "title": "Temporal validity: walk forward and cut a hole", "kick": "0.3.8", "tag": "textbook", "lead": "For anything with a time index, the only honest evaluation trains on the past and tests on the future.", "fig": "f_walkforward", "figcap": "The purge/embargo band exists because features and labels have width in time. López de Prado's treatment is the clearest, though the problem is not specific to finance.", "notes": "The clinical version: a label defined as 'died within 30 days' makes the last 30 days of the training window unusable, because the label is not yet knowable.", "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "cols", "title": "Contamination, test-set reuse, and the fix", "kick": "0.3.9–0.3.10", "tag": "frontier", "sm": true, "cols": [{"sub": "Benchmark contamination", "h": "The eval set is in the training corpus", "b": ["At web scale it is the default, not the exception", "Detect with n-gram overlap and embedding-based matching", "Decontaminate <em>before</em> training, and publish a contamination report", "Revisited in Chapter 2 for pretraining corpora"]}, {"sub": "Adaptive overfitting", "h": "A thousand papers tuned on one test set", "b": ["Each paper is honest; the community is not", "Recht et al.<sup class=\"fn\">2</sup> (2019) rebuilt CIFAR-10 and ImageNet test sets and saw accuracy drop across the board", "Reassuringly, the <em>ranking</em> largely survived — so relative claims aged better than absolute ones", "Argues for fresh held-out sets, not just bigger ones"]}, {"sub": "The fix", "h": "Model info sheets", "b": ["A fill-in template forcing authors to state, <b>per leakage type</b>, why their setup is clean", "Kapoor &amp; Narayanan<sup class=\"fn\">3</sup> propose it precisely because informal reporting failed", "Cheap to adopt: one page, eight rows", "<b>Make it a required appendix</b> in every project you supervise"], "acc": true}], "notes": "The model info sheet is the single highest-leverage thing you can impose on a research group.", "cites": ["Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Kapoor & Narayanan. <i>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</i> Patterns 4(9), 2023."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "refs", "title": "Section 0.3 — references", "kick": "Reading", "sm": true, "refs": ["<b>Kapoor &amp; Narayanan. Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</b> <i>Patterns</i> 4(9), 2023 (arXiv:2207.07048). <i>Anchor reading for the whole module.</i>", "Cawley &amp; Talbot. <b>On Over-fitting in Model Selection and Subsequent Selection Bias in Performance Evaluation.</b> <i>JMLR</i>, 2010.", "Varma &amp; Simon. <b>Bias in error estimation when using cross-validation for model selection.</b> <i>BMC Bioinformatics</i>, 2006.", "Ambroise &amp; McLachlan. <b>Selection bias in gene extraction on the basis of microarray gene-expression data.</b> <i>PNAS</i>, 2002.", "Recht, Roelofs, Schmidt &amp; Shankar. <b>Do ImageNet Classifiers Generalize to ImageNet?</b> <i>ICML</i>, 2019.", "Hastie, Tibshirani &amp; Friedman. <b>The Elements of Statistical Learning</b>, ch. 7. 2009.", "López de Prado. <b>Advances in Financial Machine Learning</b>, ch. 7 (purging and embargo). 2018.", "Pedregosa et al. <b>Scikit-learn.</b> <i>JMLR</i>, 2011 — for <span class='k'>Pipeline</span> and <span class='k'>ColumnTransformer</span> semantics."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "divider", "sec": "0.4", "secTitle": "Labels, annotation and label noise", "no": "0.4", "title": "Labels, annotation and label noise", "lead": "The label is not ground truth. It is a measurement, made by a person, under a protocol, with an error rate you can estimate.", "chips": ["Annotation protocol", "Agreement statistics", "Aggregating annotators", "Weak supervision", "Active learning", "Noisy-label learning", "Confident learning"]}, {"kind": "bullets", "title": "Designing an annotation protocol", "kick": "0.4.1", "tag": "textbook", "lead": "Most label noise is not carelessness. It is an under-specified protocol meeting a genuinely ambiguous case.", "b": ["<b>Label definitions</b> written as decision rules, not as nouns. “Mass” is a noun; “a focal lesion ≥ 5 mm distinguishable from surrounding parenchyma on two planes” is a rule.", "<b>An edge-case catalogue</b> that grows during annotation and is versioned. Every disagreement resolved becomes a new entry.", "<b>A pilot round</b> on 50–100 items before the real run, scored for agreement. If agreement is poor, the protocol is wrong, not the annotators.", "<b>A defined reference standard</b> for clinical tasks: histopathology, follow-up outcome, or an adjudication panel — and an honest statement when the reference is itself imperfect.", "<b>Gold questions</b> seeded through the task to monitor drift in annotator behaviour over time.", "<b>A refusal option.</b> Forcing a label on an un-answerable item manufactures noise. “Uninterpretable” is a legitimate class."], "callout": {"h": "Cost reality", "p": "In our lab's experience, the pilot round and the edge-case catalogue are the cheapest quality investment available — and the first things cut when a deadline moves."}, "notes": "Tie to BiTNet and OV-RDT: both needed expert annotation, and in both the definition of an uninterpretable image mattered as much as the positive class definition.", "sec": "0.4", "secTitle": "Labels, annotation and label noise"}, {"kind": "cols", "title": "Agreement statistics, and how to read them", "kick": "0.4.2", "tag": "textbook", "sm": true, "cols": [{"sub": "Two annotators", "h": "Cohen's κ", "b": ["Chance-corrected agreement for nominal labels", "Use <b>weighted κ</b> for ordinal scales — disagreeing by one grade is not the same as disagreeing by three", "Landis &amp; Koch bands (0.61–0.80 “substantial”) are conventions, not thresholds"]}, {"sub": "Many annotators", "h": "Fleiss' κ, Krippendorff's α", "b": ["α handles missing data, any number of raters, and any measurement level", "Prefer α when annotators did not all see every item — which is the usual case", "Artstein &amp; Poesio<sup class=\"fn\">1</sup> (2008) is the definitive treatment for language tasks"]}, {"sub": "Continuous / dense", "h": "ICC, Dice, boundary distance", "b": ["ICC for continuous ratings; report which of the six ICC forms you used", "For segmentation, inter-annotator <b>Dice</b> is the ceiling your model is chasing", "Report it. A model at 0.85 Dice against annotators who agree at 0.82 has saturated"], "acc": true}, {"sub": "The trap", "h": "High κ is not high quality", "b": ["Two annotators trained on the same wrong protocol agree perfectly", "κ collapses when one class dominates, even with excellent agreement — the <b>kappa paradox</b>", "Always report the confusion pattern alongside the coefficient"]}], "notes": "The kappa paradox catches nearly everyone: 95% raw agreement with κ = 0.2 under heavy imbalance.", "cites": ["Artstein & Poesio. <i>Inter-Coder Agreement for.</i> Computational Linguistics, 2008."], "sec": "0.4", "secTitle": "Labels, annotation and label noise"}, {"kind": "split", "title": "Aggregating annotators, and buying labels cheaply", "kick": "0.4.3–0.4.5", "tag": "both", "wide": "text", "b": ["<b>Majority vote</b> is the baseline and is often fine. It assumes annotators are equally skilled, which they are not.", "<b>Dawid &amp; Skene<sup class=\"fn\">3</sup> (1979)</b> models each annotator's confusion matrix and infers the latent label — still the reference method after forty-five years.", "<b>Adjudication panels</b> beat both when the disagreement is substantive rather than random. Budget for the tie-breaking senior clinician.", "<b>Weak supervision (Snorkel):</b> write labelling <em>functions</em> — rules, patterns, existing classifiers — and learn a generative model of their accuracies. Trades label cost for engineering.", "<b>Active learning:</b> uncertainty, margin, entropy, query-by-committee, core-set, BALD. Real gains exist, but so do cold-start and batch-diversity failures.", "<b>Honest baseline, again:</b> many active-learning methods do not beat random sampling at moderate budgets. Report the random curve."], "fig": "f_confident", "figcap": "Once labels exist, confident learning gives you an estimate of how many are wrong.", "notes": "For a clinical audience, frame weak supervision as 'encoding what the senior clinician already knows as rules, then letting the model reconcile them'.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Dawid & Skene. <i>Maximum Likelihood Estimation of Observer Error-Rates Using the EM Algorithm.</i> JRSS-C, 1979."], "sec": "0.4", "secTitle": "Labels, annotation and label noise"}, {"kind": "split", "title": "Label errors in benchmark test sets", "kick": "0.4.7–0.4.8", "tag": "frontier", "lead": "The datasets we use to rank models contain enough label error to change the ranking.", "b": ["<b>The consequence is not academic:</b> on datasets with higher noise, lower-capacity models can outperform higher-capacity ones on the <em>corrected</em> labels, reversing the published ordering.", "<b>Method:</b> confident learning estimates the joint distribution of noisy and true labels from out-of-sample predicted probabilities, then ranks candidates by Prune-By-Noise-Rate.", "<b>Protocol:</b> run it, adjudicate the top few hundred flags by hand, re-benchmark. Lab 10 does exactly this."], "stats": [{"v": "~3.4%", "l": "mean label error, ten benchmark test sets"}, {"v": "~6%", "l": "of the ImageNet validation set"}], "fig": "f_confident", "figcap": "Off-diagonal mass is where the candidate errors live. Human adjudication is still required — the method ranks, it does not decide.", "notes": "If someone objects that 3.4% is small: point out that the gap between the top ten ImageNet models is smaller than that.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012."], "sec": "0.4", "secTitle": "Labels, annotation and label noise"}, {"kind": "bullets", "title": "When cleaning is not an option: learning with noisy labels", "kick": "0.4.6", "tag": "frontier", "b": ["<b>Loss correction</b> — estimate the noise transition matrix and correct the loss (Patrini et al.<sup class=\"fn\">1</sup>, 2017). Needs anchor points or a clean subset.", "<b>Co-teaching</b> — two networks each select small-loss examples for the other, exploiting the fact that networks fit clean data first.", "<b>Robust losses</b> — MAE, generalised cross-entropy, symmetric cross-entropy: bounded loss functions that refuse to chase outliers.", "<b>Sample reweighting</b> — learn per-example weights on a small clean validation set.", "<b>Early stopping as a noise-robust method</b> — the memorisation of noisy labels happens late in training; stopping early is a surprisingly strong baseline.", "<b>Choose deliberately:</b> if you can afford to clean 500 labels, cleaning usually beats every method on this slide. These techniques are for when the noise is structural and unaffordable to fix."], "callout": {"h": "Diagnostic worth teaching", "p": "Plot training and validation loss over epochs. A widening gap that appears late, with training accuracy climbing past the estimated clean rate, is memorisation of label noise — not ordinary overfitting."}, "notes": "Song et al. (2022) is the survey to assign here.", "cites": ["Patrini et al. <i>Making Deep Neural Networks Robust to Label Noise.</i> CVPR, 2017."], "sec": "0.4", "secTitle": "Labels, annotation and label noise"}, {"kind": "refs", "title": "Section 0.4 — references", "kick": "Reading", "sm": true, "refs": ["Northcutt, Jiang &amp; Chuang. <b>Confident Learning: Estimating Uncertainty in Dataset Labels.</b> <i>JAIR</i> 70, 2021 (arXiv:1911.00068).", "Northcutt, Athalye &amp; Mueller. <b>Pervasive Label Errors in Test Sets Destabilize Machine Learning Benchmarks.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2021.", "Dawid &amp; Skene. <b>Maximum Likelihood Estimation of Observer Error-Rates Using the EM Algorithm.</b> <i>JRSS-C</i>, 1979.", "Artstein &amp; Poesio. <b>Inter-Coder Agreement for Computational Linguistics.</b> <i>Computational Linguistics</i>, 2008.", "Ratner, Bach, Ehrenberg, Fries, Wu &amp; Ré. <b>Snorkel: Rapid Training Data Creation with Weak Supervision.</b> <i>VLDB</i>, 2017.", "Settles. <b>Active Learning Literature Survey.</b> 2009; Sener &amp; Savarese, <b>Active Learning for CNNs: A Core-Set Approach</b>, <i>ICLR</i> 2018.", "Song, Kim, Park, Shin &amp; Lee. <b>Learning from Noisy Labels with Deep Neural Networks: A Survey.</b> <i>IEEE TNNLS</i>, 2022.", "Patrini, Rozza, Menon, Nock &amp; Qu. <b>Making Deep Neural Networks Robust to Label Noise.</b> <i>CVPR</i>, 2017.", "Tooling: cleanlab, Snorkel, Label Studio, CVAT."], "sec": "0.4", "secTitle": "Labels, annotation and label noise"}, {"kind": "divider", "sec": "0.5", "secTitle": "Data reduction, selection and valuation", "no": "0.5", "title": "Reduction, selection and valuation", "lead": "When you cannot keep everything: which examples earn their place, and what is each one worth?", "chips": ["Sampling designs", "Difficulty scores", "Coresets", "Difficulty vs diversity", "Pruning and scaling laws", "Data valuation", "Distillation", "The random baseline"]}, {"kind": "split", "title": "Difficulty and dynamics scores", "kick": "0.5.2", "tag": "frontier", "wide": "text", "lead": "Cheap per-example signals you get almost free from a training run you were doing anyway.", "b": ["<b>Forgetting events</b> (Toneva et al.<sup class=\"fn\">3</sup>, ICLR 2019) — how often an example flips from correct to incorrect during training. Never-forgotten examples are prunable.", "<b>EL2N and GraNd</b> (Paul et al.<sup class=\"fn\">4</sup>, NeurIPS 2021) — error-L2-norm and gradient-norm early in training. Computable after a handful of epochs.", "<b>Area under the margin</b> (Pleiss et al., 2020) — separates hard-but-correct from mislabelled, which the other scores conflate.", "<b>Prediction entropy</b> — the cheapest, and the weakest, because it confuses ambiguity with ignorance.", "<b>The regime flip that decides everything:</b> in the scarce-data regime keep the <em>easy</em> examples, because they define the class. In the abundant-data regime keep the <em>hard</em> ones, because the easy ones are already learned.", "<b>A score that ignores the regime will lose to random selection</b> — and frequently does."], "fig": "f_prune", "figcap": "With a good metric, error can fall faster than power-law scaling (Sorscher et al., NeurIPS 2022, Outstanding Paper).", "notes": "The regime flip is the insight students find genuinely surprising. Draw it on the board twice.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Toneva et al. <i>An Empirical Study of Example Forgetting.</i> ICLR, 2019.", "Paul et al. <i>Deep Learning on a Data Diet: Finding Important Examples Early in Training.</i> NeurIPS, 2021."], "sec": "0.5", "secTitle": "Data reduction, selection and valuation"}, {"kind": "cols", "title": "Coresets, diversity, and what an example is worth", "kick": "0.5.3–0.5.7", "tag": "frontier", "sm": true, "cols": [{"sub": "Geometry", "h": "Coreset selection", "b": ["<b>k-center greedy</b> — cover the embedding space, minimise the maximum distance to a selected point", "<b>Herding</b> — match the mean of the full set incrementally", "<b>Moderate coresets</b> (Xia et al.<sup class=\"fn\">1</sup>, ICLR 2023) — pick examples at median distance to the class centre, robust across pruning rates", "<b>Coverage-centric</b> selection wins at high pruning rates where difficulty scores collapse"]}, {"sub": "The failure mode", "h": "Difficulty without diversity", "b": ["Pure hard-example selection collapses onto one region of the space — usually the ambiguous boundary between two classes", "<b>D2 Pruning</b> (Maharana et al.<sup class=\"fn\">2</sup>, ICLR 2024) runs message passing on a graph so selected points repel each other", "The general lesson: any single-score ranking needs a diversity constraint bolted on"], "acc": true}, {"sub": "Valuation", "h": "What is this row worth?", "b": ["<b>Leave-one-out</b> — exact, and computationally hopeless", "<b>Data Shapley</b> (Ghorbani &amp; Zou<sup class=\"fn\">3</sup>, 2019) — the game-theoretic answer, with Monte-Carlo approximations", "<b>Influence functions</b> (Koh &amp; Liang, 2017) — a second-order approximation that also explains predictions", "Use it to prune, to prioritise annotation, or to <em>price</em> data in a partnership"]}, {"sub": "The extreme", "h": "Distillation and condensation", "b": ["Synthesise a tiny surrogate set by gradient, distribution or trajectory matching", "Impressive on MNIST/CIFAR; the accuracy ceiling on realistic data is still low", "Teach it as a research direction, not a tool", "Yu<sup class=\"fn\">4</sup>, Liu &amp; Wang, <i>IEEE TPAMI</i>, 2023"]}], "notes": "For a health-data audience, data valuation is the most immediately useful: it answers 'which 200 scans should we pay to annotate next?'", "cites": ["Xia et al. <i>Moderate Coreset.</i> ICLR, 2023.", "Maharana et al. <i>D2 Pruning: Message Passing for Balancing Diversity and Difficulty.</i> ICLR, 2024.", "Ghorbani & Zou. <i>Data Shapley.</i> ICML, 2019.", "Yu et al. <i>Dataset Distillation: A Comprehensive Review.</i> IEEE TPAMI, 2023."], "sec": "0.5", "secTitle": "Data reduction, selection and valuation"}, {"kind": "bullets", "title": "The baseline every selection paper must beat", "kick": "0.5.8", "tag": "frontier", "lead": "Random selection is not a straw man. It is a strong, unbiased, zero-cost method, and a large fraction of published selection methods do not beat it.", "b": ["<b>Random is unbiased by construction.</b> It preserves the class distribution, the subgroup distribution and the difficulty distribution in expectation. No clever method gets that for free.", "<b>Random has no hyper-parameters,</b> so it cannot be tuned on the test set — which several of its competitors quietly are.", "<b>Random is embarrassingly cheap.</b> Any method costing a full training run to compute scores must beat random by enough to justify that run.", "<b>Report the random curve across budgets,</b> not a single point. Methods often win at 10% and lose at 50%, and papers tend to plot only the budget where they win.", "<b>Report variance.</b> Random selection has a distribution; a single draw is not a baseline.", "<b>If your method loses to random, that is a result</b> — and a more useful one than a marginal win nobody can reproduce."], "callout": {"h": "Rubric line", "p": "In this module, any submitted work involving data selection must plot the random baseline with error bars across at least three budgets. Absence of the baseline is a failed criterion, not a stylistic preference."}, "notes": "This slide does more for research quality than any technique slide in the module.", "sec": "0.5", "secTitle": "Data reduction, selection and valuation"}, {"kind": "refs", "title": "Section 0.5 — references", "kick": "Reading", "sm": true, "refs": ["Sorscher, Geirhos, Shekhar, Ganguli &amp; Morcos. <b>Beyond Neural Scaling Laws: Beating Power Law Scaling via Data Pruning.</b> <i>NeurIPS</i>, 2022 (Outstanding Paper).", "Toneva, Sordoni, Combes, Trischler, Bengio &amp; Gordon. <b>An Empirical Study of Example Forgetting.</b> <i>ICLR</i>, 2019.", "Paul, Ganguli &amp; Dziugaite. <b>Deep Learning on a Data Diet: Finding Important Examples Early in Training.</b> <i>NeurIPS</i>, 2021.", "Pleiss, Zhang, Elenberg &amp; Weinberger. <b>Identifying Mislabeled Data using the Area Under the Margin Ranking.</b> <i>NeurIPS</i>, 2020.", "Xia, Liu, Wang, Han, Gong, Niu &amp; Sugiyama. <b>Moderate Coreset.</b> <i>ICLR</i>, 2023.", "Maharana, Yadav &amp; Bansal. <b>D2 Pruning: Message Passing for Balancing Diversity and Difficulty.</b> <i>ICLR</i>, 2024.", "Ghorbani &amp; Zou. <b>Data Shapley.</b> <i>ICML</i>, 2019; Koh &amp; Liang, <b>Understanding Black-box Predictions via Influence Functions</b>, <i>ICML</i> 2017.", "Yu, Liu &amp; Wang. <b>Dataset Distillation: A Comprehensive Review.</b> <i>IEEE TPAMI</i>, 2023."], "sec": "0.5", "secTitle": "Data reduction, selection and valuation"}, {"kind": "divider", "sec": "0.6", "secTitle": "Synthetic data as a preparation strategy", "no": "0.6", "title": "Synthetic data as a preparation strategy", "lead": "Sometimes the right answer. Rarely the easy one, and never evaluable on fidelity alone.", "chips": ["Why synthesise", "The trilemma", "TSTR and TRTS", "Model collapse", "Mixing ratios", "Provenance marking"]}, {"kind": "split", "title": "Why synthesise — match the reason to the method", "kick": "0.6.1", "tag": "both", "wide": "text", "b": ["<b>Scarcity</b> — too few examples of anything. Generative augmentation, or transfer from a related domain. Hardest case to win.", "<b>Imbalance</b> — enough data overall, too few of one class. Often better solved by thresholds and class weights (Chapter 1, section 1.9).", "<b>Privacy</b> — the real data cannot leave the hospital. Differentially private synthesis, evaluated on downstream utility.", "<b>Coverage of rare events</b> — the scenario exists but was never captured. Simulation and domain randomisation, especially for CCTV and robotics.", "<b>Stress testing</b> — deliberately construct the hard case to probe a failure mode. The most reliably successful use, and the least published.", "<b>The diagnostic question:</b> which of these five is your reason? If you cannot answer in one sentence, the synthetic data will not help."], "fig": "f_trilemma", "figcap": "Push any corner and at least one other corner moves. An evaluation that reports only fidelity is not an evaluation.", "notes": "Stress testing is worth dwelling on — it is the use case where synthetic data is unambiguously the right tool.", "sec": "0.6", "secTitle": "Synthetic data as a preparation strategy"}, {"kind": "cols", "title": "The minimum acceptable evidence", "kick": "0.6.2–0.6.3", "tag": "frontier", "sm": true, "lead": "Four protocols. A synthetic-data paper that reports only the first one has not shown you anything actionable.", "cols": [{"sub": "Fidelity", "h": "Does it look right?", "b": ["Marginal distributions per column or per channel", "Pairwise correlations and joint structure", "Discriminator AUC — can a classifier tell real from synthetic?", "<b>Necessary, nowhere near sufficient.</b> A copy of the training set scores perfectly"]}, {"sub": "Utility", "h": "TSTR / TRTS", "b": ["<b>TSTR</b> — train on synthetic, test on real. The headline number", "<b>TRTS</b> — train on real, test on synthetic. Diagnoses coverage gaps", "Always against a <b>real-data baseline at the same size</b>", "Esteban<sup class=\"fn\">1</sup>, Hyland &amp; Rätsch (2017) established the protocol"], "acc": true}, {"sub": "Privacy", "h": "Did it memorise?", "b": ["Distance to closest record — the cheap screen", "Membership-inference AUC — the meaningful one", "A formal DP budget if you claim a guarantee", "A generator that memorises scores <em>well</em> on fidelity and utility"]}, {"sub": "Diversity", "h": "Did it collapse?", "b": ["Coverage and recall against the real distribution", "Per-class and per-subgroup counts, not just the aggregate", "Mode collapse shows up as excellent fidelity with poor coverage", "Report it or a reviewer will ask"]}], "notes": "Emphasise the trap on the fidelity card: a memorising generator wins on fidelity and utility and fails catastrophically on privacy. That is why all four are required.", "cites": ["Esteban et al. <i>Real-valued (Medical) Time Series Generation with Recurrent Conditional GANs.</i> 2017."], "sec": "0.6", "secTitle": "Synthetic data as a preparation strategy"}, {"kind": "figure", "title": "Model collapse", "kick": "0.6.4", "tag": "frontier", "lead": "What happens when each generation of models trains on the previous generation's output.", "fig": "f_collapse", "figcap": "Shumailov et al.<sup class=\"fn\">1</sup>, <i>Nature</i> 631:755–759 (2024). Cite the Nature paper, not the earlier “Curse of Recursion” preprint. The tails go first — which is to say, the rare disease, the minority dialect, the unusual presentation.", "notes": "The Thai-language angle: low-resource languages are disproportionately represented in the tails of web corpora, so recursive training degrades them fastest.", "cites": ["Shumailov et al. <i>AI models collapse when trained on recursively generated data.</i> Nature 631:755–759, 2024."], "sec": "0.6", "secTitle": "Synthetic data as a preparation strategy"}, {"kind": "bullets", "title": "Mixing ratios and provenance marking", "kick": "0.6.5–0.6.6", "tag": "both", "b": ["<b>The ratio is a hyper-parameter with a sharp optimum.</b> Small amounts of synthetic data often help; replacing real data with synthetic almost always hurts.", "<b>Anchor to real data.</b> The mitigation that works in the model-collapse literature is keeping a fixed pool of real data in every generation, not merely adding more synthetic.", "<b>Tune the ratio on real validation data only.</b> Tuning it on synthetic validation data is a closed loop that will happily converge to nonsense.", "<b>Mark every synthetic record at creation.</b> A boolean column, a filename convention, a metadata field — whatever survives your pipeline.", "<b>Why marking matters:</b> unmarked synthetic records leak into evaluation sets, into the next training corpus, and into the corpus your collaborator builds from your release.", "<b>Institutional version:</b> a release that mixes real and synthetic without a provenance flag is not reusable, whatever its licence says."], "callout": {"h": "Connects forward", "p": "Chapter 1 §1.10 covers CTGAN, TabDDPM and GReaT for tables; Chapter 2 §2.9 covers Self-Instruct and Evol-Instruct for instruction data; Chapter 3 §3.7 covers diffusion-based image synthesis. The evaluation discipline on this slide applies unchanged to all three."}, "notes": "Provenance marking is boring and it is the slide that saves someone's PhD.", "cites": ["Xu et al. <i>Modeling Tabular Data using Conditional GAN (CTGAN/TVAE).</i> NeurIPS, 2019.", "Kotelnikov et al. <i>TabDDPM: Modelling Tabular Data with Diffusion Models.</i> ICML, 2023.", "Borisov et al. <i>Language Models are Realistic Tabular Data Generators (GReaT).</i> ICLR, 2023."], "sec": "0.6", "secTitle": "Synthetic data as a preparation strategy"}, {"kind": "refs", "title": "Section 0.6 — references", "kick": "Reading", "sm": true, "refs": ["Shumailov, Shumaylov, Zhao, Papernot, Anderson &amp; Gal. <b>AI models collapse when trained on recursively generated data.</b> <i>Nature</i> 631:755–759, 2024.", "Esteban, Hyland &amp; Rätsch. <b>Real-valued (Medical) Time Series Generation with Recurrent Conditional GANs.</b> 2017 — origin of the TSTR protocol.", "Xu, Skoularidou, Cuesta-Infante &amp; Veeramachaneni. <b>Modeling Tabular Data using Conditional GAN (CTGAN/TVAE).</b> <i>NeurIPS</i>, 2019.", "Kotelnikov, Baranchuk, Rubachev &amp; Babenko. <b>TabDDPM: Modelling Tabular Data with Diffusion Models.</b> <i>ICML</i>, 2023.", "Jordon, Yoon &amp; van der Schaar. <b>PATE-GAN: Generating Synthetic Data with Differential Privacy Guarantees.</b> <i>ICLR</i>, 2019.", "Manousakas &amp; Aydöre. <b>On the Usefulness of Synthetic Tabular Data Generation.</b> DMLR workshop at <i>ICML</i>, 2023 — the sceptical counterweight.", "Tooling: SDV (Synthetic Data Vault), synthcity."], "sec": "0.6", "secTitle": "Synthetic data as a preparation strategy"}, {"kind": "divider", "sec": "0.7", "secTitle": "Privacy, governance, fairness and law", "no": "0.7", "title": "Privacy, governance, fairness and law", "lead": "The constraints that are not negotiable, and the biases that enter through preparation rather than modelling.", "chips": ["De-identification", "k-anonymity and successors", "Differential privacy", "Attacks", "Federated preparation", "Bias entry points", "Subgroup audits", "EU AI Act"]}, {"kind": "figure", "title": "De-identification, and why it is not enough", "kick": "0.7.1–0.7.2", "tag": "textbook", "lead": "HIPAA Safe Harbor lists eighteen identifiers to remove. Removing them is necessary, and demonstrably insufficient.", "fig": "f_kanon", "figcap": "The homogeneity attack against k-anonymity, in one table. Each successor model closes one attack and opens the next — which is why the field moved to guarantees about the <em>mechanism</em>.", "notes": "Sweeney's original demonstration: 87% of the US population uniquely identified by ZIP, birth date and sex. Ask the room what the Thai equivalent quasi-identifier set is.", "sec": "0.7", "secTitle": "Privacy, governance, fairness and law"}, {"kind": "split", "title": "Differential privacy: what it does and does not promise", "kick": "0.7.3", "tag": "frontier", "wide": "text", "b": ["<b>The guarantee</b> is about the mechanism: any one person's presence changes the output distribution by at most a factor of e<sup>ε</sup> (with a δ slack term).", "<b>It composes.</b> Every query spends budget. Track it, or the guarantee you quote is not the one you have.", "<b>DP-SGD</b> (Abadi et al.<sup class=\"fn\">1</sup>, CCS 2016) clips per-example gradients and adds calibrated noise. It is the practical route for deep models.", "<b>The cost is real on small cohorts.</b> Report the utility-versus-ε curve, not a single operating point — and never quote ε without δ and the accounting method.", "<b>What it does not do:</b> protect a group-level fact you intended to publish; fix a dataset whose existence is itself the disclosure; or mean anything useful at ε values large enough to preserve accuracy.", "<b>Say so plainly in the paper.</b> An acronym is not a privacy analysis."], "fig": "f_dp", "figcap": "Two datasets differing in one person. The guarantee is that you cannot tell which one produced the output.", "notes": "Push back on ε-theatre. Many published 'DP' results use ε in the tens, where the formal guarantee is weak.", "cites": ["Abadi et al. <i>Deep Learning with Differential Privacy (DP-SGD).</i> ACM CCS, 2016."], "sec": "0.7", "secTitle": "Privacy, governance, fairness and law"}, {"kind": "cols", "title": "The attacks that define the risk", "kick": "0.7.4", "tag": "frontier", "sm": true, "lead": "Privacy is defined by what an adversary can do. Teach the attacks first; the defences then make sense.", "cols": [{"sub": "Membership", "h": "Were you in the training set?", "b": ["Shokri et al.<sup class=\"fn\">1</sup> (2017): train shadow models, learn to recognise the confidence signature of a training member", "In a cohort of cancer patients, membership <em>is</em> the sensitive attribute", "Now the standard privacy metric for synthetic data"]}, {"sub": "Attribute", "h": "What else can be inferred?", "b": ["Recover a redacted field from the remaining ones", "Works because features are correlated — which is also why the model works", "Redaction of one column rarely removes the information"]}, {"sub": "Extraction", "h": "Verbatim memorisation", "b": ["Carlini et al.<sup class=\"fn\">2</sup> (2021): extract training sequences from a language model by prompting", "Duplication is the main driver — deduplication is therefore a <b>privacy control</b>, not only a quality one", "Revisited in Chapter 2 §2.6"], "acc": true}, {"sub": "Re-identification", "h": "Linkage to an outside table", "b": ["The Netflix Prize and the Massachusetts hospital records are the canonical demonstrations", "3D renders of head MRI are re-identifiable (Schwarz et al.<sup class=\"fn\">3</sup>, <i>NEJM</i> 2019) — hence defacing", "The adversary's auxiliary data is the variable you cannot control"]}], "notes": "The extraction/deduplication link is the one that surprises people: a data-quality operation turns out to be the most effective privacy intervention available at pretraining scale.", "cites": ["Shokri et al. <i>Membership Inference Attacks Against Machine Learning Models.</i> IEEE S&P, 2017.", "Carlini et al. <i>Extracting Training Data from Large Language Models.</i> USENIX Security, 2021.", "Schwarz et al. <i>Identification of Anonymous MRI Research Participants with Face-Recognition Software.</i> NEJM, 2019."], "sec": "0.7", "secTitle": "Privacy, governance, fairness and law"}, {"kind": "figure", "title": "Bias enters at named points", "kick": "0.7.7–0.7.8", "tag": "textbook", "lead": "Suresh &amp; Guttag<sup class=\"fn\">1</sup>'s framing: not one “bias”, but distinct mechanisms with distinct diagnoses.", "fig": "f_bias", "figcap": "Every reduction step in this course — quality filtering, deduplication, coreset selection, toxicity filtering — is a sampling decision. Count subgroups before and after each one.", "notes": "The before/after subgroup table is one page and pre-empts most fairness reviews. Make it a required appendix, like the model info sheet.", "cites": ["Suresh & Guttag. <i>A Framework for Understanding Sources of Harm throughout the Machine Learning Life Cycle.</i> EAAMO, 2021."], "sec": "0.7", "secTitle": "Privacy, governance, fairness and law"}, {"kind": "bullets", "title": "Consent, licensing and the regulatory floor", "kick": "0.7.6, 0.7.9", "tag": "frontier", "b": ["<b>Provenance is now auditable.</b> The Data Provenance Initiative (Longpre et al.<sup class=\"fn\">1</sup>, 2024) found widespread licence mis-labelling in popular instruction datasets — “open” frequently was not.", "<b>Crawler opt-out signals</b> (robots.txt, meta directives) are increasingly treated as a compliance obligation rather than a courtesy. Record what you honoured and when.", "<b>EU AI Act</b> imposes data-governance obligations on high-risk systems: examination for bias, relevance and representativeness of training data, and documented gaps. Medical AI is high-risk by classification.", "<b>FDA and Thai FDA</b> expect a locked, versioned preprocessing chain. A change to normalisation is a change to the device.", "<b>GDPR / PDPA</b>: pseudonymisation is not anonymisation. Pseudonymised data is still personal data, with the full obligation set attached.", "<b>Practical minimum for a research group:</b> a licence and provenance column in your dataset registry, filled in at acquisition. Retrofitting it is a project, not a task."], "callout": {"h": "For Thai medical AI specifically", "p": "The combination that recurs in our own work: IRB approval defining the permitted use, HIPAA-equivalent identifier removal, PHI burned into pixel data checked separately from DICOM tags, and a locked preprocessing version recorded alongside the model."}, "notes": "Thailand's PDPA maps closely onto GDPR for these purposes. Worth ten minutes if the cohort is Thai.", "cites": ["Longpre et al. <i>The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing and Attribution in AI.</i> 2024."], "sec": "0.7", "secTitle": "Privacy, governance, fairness and law"}, {"kind": "refs", "title": "Section 0.7 — references", "kick": "Reading", "sm": true, "refs": ["Sweeney. <b>k-anonymity: A Model for Protecting Privacy.</b> <i>IJUFKS</i>, 2002; Machanavajjhala et al., <b>l-diversity</b>, 2007.", "Dwork &amp; Roth. <b>The Algorithmic Foundations of Differential Privacy.</b> 2014.", "Abadi, Chu, Goodfellow, McMahan, Mironov, Talwar &amp; Zhang. <b>Deep Learning with Differential Privacy (DP-SGD).</b> <i>ACM CCS</i>, 2016.", "Shokri, Stronati, Song &amp; Shmatikov. <b>Membership Inference Attacks Against Machine Learning Models.</b> <i>IEEE S&amp;P</i>, 2017.", "Carlini et al. <b>Extracting Training Data from Large Language Models.</b> <i>USENIX Security</i>, 2021.", "Suresh &amp; Guttag. <b>A Framework for Understanding Sources of Harm throughout the Machine Learning Life Cycle.</b> <i>EAAMO</i>, 2021.", "Mehrabi, Morstatter, Saxena, Lerman &amp; Galstyan. <b>A Survey on Bias and Fairness in Machine Learning.</b> <i>ACM Computing Surveys</i>, 2021.", "Kairouz et al. <b>Advances and Open Problems in Federated Learning.</b> 2021; McMahan et al., 2017.", "Longpre et al. <b>The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing and Attribution in AI.</b> 2024.", "Schwarz et al. <b>Identification of Anonymous MRI Research Participants with Face-Recognition Software.</b> <i>NEJM</i>, 2019."], "sec": "0.7", "secTitle": "Privacy, governance, fairness and law"}, {"kind": "divider", "sec": "0.8", "secTitle": "Documentation, versioning and infrastructure", "no": "0.8", "title": "Documentation, versioning and infrastructure", "lead": "The unglamorous half that decides whether anything in the previous seven sections survives contact with a second person.", "chips": ["Datasheets", "Data and model cards", "Croissant", "Versioning", "Reproducibility", "Feature stores", "Storage formats", "Out-of-core"]}, {"kind": "figure", "title": "Four documents, four different readers", "kick": "0.8.1–0.8.3", "tag": "both", "lead": "They are not redundant. Each answers a question the others do not.", "fig": "f_docstack", "figcap": "NeurIPS now requires a Croissant record for dataset-track submissions. That is the point at which documentation stopped being optional and became infrastructure.", "notes": "Assign the datasheet questionnaire as homework against a dataset the student already uses. The questions they cannot answer are the finding.", "cites": ["Pushkarna et al. <i>Data Cards.</i> ACM FAccT, 2022."], "sec": "0.8", "secTitle": "Documentation, versioning and infrastructure"}, {"kind": "split", "title": "Versioning and reproducibility", "kick": "0.8.4–0.8.5", "tag": "both", "wide": "text", "b": ["<b>Content hashing over file names.</b> <span class='k'>data_final_v2_REAL.csv</span> is not a version. A hash is.", "<b>Immutable raw snapshots.</b> The raw layer is append-only. Every correction is a new derived version with a recorded reason.", "<b>Tooling:</b> DVC, lakeFS, Git-LFS, or a dated object-store prefix with a manifest. The tool matters far less than the discipline.", "<b>Pin the environment:</b> seeds, determinism flags, library versions, container digest. A result that needs a specific BLAS build should say so.", "<b>Record the preprocessing config <em>with the weights</em>.</b> A model artefact without its transform chain is not deployable and not reproducible.", "<b>The test:</b> can a colleague, given only your repository and your dataset identifier, reproduce the number in your abstract? Try it once per project, with a real colleague."], "fig": "f_lineage", "figcap": "Each arrow is a recorded transformation with a hash on both ends. That is all “lineage” means.", "notes": "The 'try it with a real colleague' exercise is brutal and useful. Schedule it in week 10 of a project.", "sec": "0.8", "secTitle": "Documentation, versioning and infrastructure"}, {"kind": "figure", "title": "Training / serving skew", "kick": "0.8.6", "tag": "both", "lead": "The same transform, defined twice, drifting apart. Invisible to every offline metric you have.", "fig": "f_skew", "figcap": "The fix is architectural: one transform definition executed in both paths, plus a replay test that asserts the two feature vectors match to tolerance.", "notes": "This is where a large share of 'great in the notebook, useless in the clinic' stories actually end up. It is a data-preparation bug, not a modelling bug.", "sec": "0.8", "secTitle": "Documentation, versioning and infrastructure"}, {"kind": "table", "title": "Storage, throughput and out-of-core preparation", "kick": "0.8.7–0.8.8", "tag": "textbook", "sm": true, "lead": "I/O is the real bottleneck more often than compute. Choosing the format is a preparation decision.", "table": {"head": ["Format / approach", "Use it for", "Why"], "rows": [["Parquet / Arrow", "Tables of any size", "Columnar, compressed, predicate pushdown; read one column of a 100 GB file in seconds"], ["WebDataset / TFRecord", "Sharded image, audio and video training sets", "Sequential reads at line rate; no random small-file access to kill a network filesystem"], ["Zarr / HDF5", "3D volumes, whole-slide images, large arrays", "Chunked, compressed, partial reads; essential when one item exceeds RAM"], ["Memory-mapped arrays", "Fixed-shape numeric data", "Zero-copy access, OS page cache does the work"], ["Dask / Polars lazy / Spark", "Transforms over data larger than RAM", "Chunked or lazy execution with a query plan; Polars is usually the right first reach on one machine"], ["Streaming transforms", "Continuously arriving data", "Bounded memory, and the same code path as the online serving transform"]]}, "callout": {"h": "Rule of thumb", "p": "If the GPU utilisation graph is a sawtooth, the problem is the data pipeline, not the model. Profile the loader before you touch the architecture."}, "notes": "Concrete number worth mentioning: converting a folder of 200k JPEGs to WebDataset shards routinely takes training from I/O-bound to GPU-bound on a shared cluster.", "sec": "0.8", "secTitle": "Documentation, versioning and infrastructure"}, {"kind": "refs", "title": "Section 0.8 — references", "kick": "Reading", "sm": true, "refs": ["Gebru, Morgenstern, Vecchione, Vaughan, Wallach, Daumé &amp; Crawford. <b>Datasheets for Datasets.</b> <i>CACM</i> 64(12), 2021.", "Bender &amp; Friedman. <b>Data Statements for Natural Language Processing.</b> <i>TACL</i>, 2018.", "Pushkarna, Zaldivar &amp; Kjartansson. <b>Data Cards.</b> <i>ACM FAccT</i>, 2022.", "Mitchell et al. <b>Model Cards for Model Reporting.</b> <i>ACM FAT*</i>, 2019.", "Benjelloun et al. <b>Croissant: A Metadata Format for ML-Ready Datasets.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2024; MLCommons.", "Kleppmann. <b>Designing Data-Intensive Applications.</b> O'Reilly, 2017 — for the storage and streaming material.", "Sculley et al. <b>Hidden Technical Debt in Machine Learning Systems.</b> <i>NeurIPS</i>, 2015.", "Tooling: DVC, lakeFS, MLflow, Feast, Delta Lake, Apache Iceberg, NVIDIA DALI."], "sec": "0.8", "secTitle": "Documentation, versioning and infrastructure"}, {"kind": "cols", "sec": "0.9", "secTitle": "Closing", "title": "Labs and seminars driven by this chapter", "kick": "Chapter 4 cross-reference", "sm": true, "cls": "lab", "cols": [{"sub": "Lab 1", "h": "Build a leak-proof pipeline, then break it", "b": ["Fit the same model with transforms inside and outside the CV folds", "Measure your own optimism gap on a clinical table", "Write it up against the eight-type taxonomy", "<b>Deliverable:</b> a completed model info sheet"], "acc": true}, {"sub": "Lab 10", "h": "Label-error hunt", "b": ["Run confident learning on a course dataset", "Manually adjudicate the top 100 flagged items", "Re-benchmark three models on the corrected labels", "<b>Deliverable:</b> did the ranking change?"]}, {"sub": "Lab 11", "h": "Documentation sprint", "b": ["Write a datasheet and a valid Croissant record for a dataset your group owns", "Hand it to another group with no verbal explanation", "They attempt to use it from the documentation alone", "<b>Deliverable:</b> their list of what was missing"]}, {"sub": "Seminar", "h": "Paper clinic — find the leakage", "b": ["Each student takes one published applied-ML paper", "Fills in a model info sheet on the authors' behalf", "Presents whether the headline result survives scrutiny", "<b>Rule:</b> be specific and be fair — name the type, quote the sentence"]}], "notes": "Lab 1 and the paper clinic are the two that change behaviour. Run them early."}, {"kind": "bullets", "title": "What to take from Chapter 0", "kick": "Key takeaways", "lead": "Eight sentences. If a student leaves with only these, the chapter worked.", "b": ["<b>Name the three data problems separately</b> — training-data development, inference-data development, maintenance — and give each its own metric.", "<b>A quality dimension you cannot compute is an adjective.</b> Turn the six into failing tests, and make the pipeline stop.", "<b>The grouping unit is a modelling decision.</b> Declare it before the first experiment, and report the number under both the naive and the honest split.", "<b>Fit every stateful transform inside the fold.</b> Enforce it architecturally, not by remembering.", "<b>Labels are measurements with an error rate.</b> Estimate it; adjudicate the worst; report the inter-annotator ceiling.", "<b>Random selection is a real baseline.</b> Plot it across budgets, with error bars, or your selection result means nothing.", "<b>Synthetic data has three axes and you must report all three</b> — fidelity, utility, privacy — plus diversity.", "<b>Every filter is a sampling decision.</b> Count subgroups before and after, and put the table in the paper."], "callout": {"h": "The sentence to leave on the board", "p": "The number in your abstract is a property of your split design, your label quality and your fold discipline at least as much as it is a property of your model."}, "notes": "End here if you are out of time. The next slide is navigation only.", "sec": "0.9", "secTitle": "Closing"}, {"kind": "cols", "title": "Where this chapter is used", "kick": "Onward", "sm": true, "lead": "Chapter 0 is the discipline. The next three chapters are the technique catalogues that need it.", "cols": [{"sub": "Chapter 1", "h": "Classical and tabular data", "p": "Missingness mechanisms, encoding, imbalance and calibration, tabular foundation models, longitudinal EHR cohorts.", "b": ["Uses §0.3 for split design and §0.4 for label quality", "Weeks 3–5"]}, {"sub": "Chapter 2", "h": "Text: NLP and LLM data", "p": "Thai and unsegmented scripts, subword tokenisation and fairness, web-corpus filtering, deduplication, instruction and RAG data.", "b": ["Uses §0.2 for corpus auditing and §0.6 for synthetic instructions", "Weeks 6–8"]}, {"sub": "Chapter 3", "h": "Image and video data", "p": "DICOM and WSI handling, intensity and stain normalisation, augmentation, image-text curation, CCTV and medical imaging.", "b": ["Uses §0.3 for patient- and camera-level grouping", "Weeks 9–11"]}, {"sub": "Chapter 4", "h": "Teaching scaffold", "p": "The eleven labs, the seminar track, the assessment rubric and the capstone brief.", "b": ["Every lab traces back to a section in this chapter", "Runs throughout"], "acc": true}], "notes": "Use the Course index button in the toolbar to move between decks.", "sec": "0.9", "secTitle": "Closing"}]}</script>
<script>
(function(){
"use strict";
function boom(e){
  try{var b=document.getElementById("err");b.style.display="block";
    b.textContent="Something broke: "+((e&&e.message)||e)+"\n"+((e&&e.stack)||"");}catch(_){}
  if(window.console)console.error(e);
}
window.addEventListener("error",function(ev){boom(ev.error||ev.message);});

try{

var D      = JSON.parse(document.getElementById("deckdata").textContent);
var SLIDES = D.slides, FIGS = D.figs, META = D.meta, SECS = D.secs || [];
var KEY    = "dpslides-"+META.key+"-v1";
var EDITS  = {}, NOTES = {};
var cur = 0, editing = false, ovOn = false, notesOn = false;
var t0 = null, tAcc = 0;

/* ---------------- storage ---------------- */
var Store = {
  get:function(){
    try{ if(window.storage&&window.storage.get)
      return window.storage.get(KEY).then(function(r){return r&&r.value?r.value:null;}).catch(function(){return null;}); }catch(e){}
    try{ return Promise.resolve(window.localStorage.getItem(KEY)); }catch(e){ return Promise.resolve(null); }
  },
  set:function(v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(KEY,v).catch(function(){}); return; } }catch(e){}
    try{ window.localStorage.setItem(KEY,v); }catch(e){}
  }
};
var svT=null;
function save(){ clearTimeout(svT); svT=setTimeout(function(){
  try{ Store.set(JSON.stringify({v:1,edits:EDITS,notes:NOTES})); }catch(e){} },350); }

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function txt(h){var d=document.createElement("div");d.innerHTML=h==null?"":h;return (d.textContent||"").trim();}
function val(i,path,dflt){ var k=i+"."+path; return (k in EDITS)?EDITS[k]:dflt; }
function ed(i,path,html,cls,tag){
  tag=tag||"div";
  return "<"+tag+' class="ed '+(cls||"")+'" data-k="'+i+"."+path+'">'+(val(i,path,html)||"")+"</"+tag+">";
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1800);}

/* ---------------- slide rendering ---------------- */
function bullets(i,arr,key,cls){
  if(!arr||!arr.length)return "";
  var h='<ul class="bul '+(cls||"")+'">';
  for(var j=0;j<arr.length;j++){
    h+='<li class="ed" data-k="'+i+"."+key+"."+j+'">'+(val(i,key+"."+j,arr[j])||"")+"</li>";
  }
  return h+"</ul>";
}
function fig(s){
  if(!s.fig)return "";
  var svg=FIGS[s.fig]||'<svg viewBox="0 0 900 380"><rect width="900" height="380" fill="#F1F5F9"/><text x="450" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#8A97A6">figure: '+esc(s.fig)+"</text></svg>";
  return svg;
}
function figblock(i,s){
  if(!s.fig)return "";
  return '<div class="figwrap col"><div class="figbox">'+fig(s)+"</div>"+
    (s.figcap?'<div class="figcap ed" data-k="'+i+'.figcap">'+val(i,"figcap",s.figcap)+"</div>":"")+"</div>";
}
function head(i,s,small){
  var h="";
  if(s.kick)h+='<p class="kick"><span class="dot"></span><span class="ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick)+"</span></p>";
  if(s.title)h+=ed(i,"title",s.title,small?"sm":"","h2");
  if(s.lead)h+=ed(i,"lead",s.lead,"lead","p");
  return h;
}
function citesHTML(i,s){
  if(!s.cites||!s.cites.length)return "";
  var h='<div class="cites">';
  for(var j=0;j<s.cites.length;j++)
    h+='<span class="c"><b>'+(j+1)+'</b><span class="ed" data-k="'+i+".cites."+j+'">'+
       val(i,"cites."+j,s.cites[j])+"</span></span>";
  return h+"</div>";
}
function foot(i,s){
  var sec=s.sec?("&sect; "+s.sec+(s.secTitle?" &nbsp;"+s.secTitle:"")):META.title;
  return '<div class="foot"><span>'+esc(META.short)+"</span><span>"+sec+'</span><span class="sp"></span>'+
    (s.tag?'<span class="tag '+s.tag+'">'+s.tag+"</span>":"")+
    "<span>"+(i+1)+" / "+SLIDES.length+"</span></div>";
}
function colsHTML(i,s){
  var n=s.cols.length,h='<div class="cols n'+n+'">';
  for(var j=0;j<n;j++){
    var c=s.cols[j];
    h+='<div class="cbox'+(c.acc?" acc":"")+'">';
    if(c.sub)h+='<div class="sub ed" data-k="'+i+".cols."+j+'.sub">'+val(i,"cols."+j+".sub",c.sub)+"</div>";
    if(c.h)h+='<h4 class="ed" data-k="'+i+".cols."+j+'.h">'+val(i,"cols."+j+".h",c.h)+"</h4>";
    if(c.p)h+='<p class="ed" data-k="'+i+".cols."+j+'.p">'+val(i,"cols."+j+".p",c.p)+"</p>";
    if(c.b&&c.b.length){
      h+='<ul class="bul">';
      for(var m=0;m<c.b.length;m++)
        h+='<li class="ed" data-k="'+i+".cols."+j+".b."+m+'">'+val(i,"cols."+j+".b."+m,c.b[m])+"</li>";
      h+="</ul>";
    }
    h+="</div>";
  }
  return h+"</div>";
}
function tableHTML(i,s){
  var h='<table class="t"><thead><tr>';
  s.table.head.forEach(function(x){h+="<th>"+x+"</th>";});
  h+="</tr></thead><tbody>";
  s.table.rows.forEach(function(r,ri){
    h+="<tr>";
    r.forEach(function(c,ci){h+='<td class="ed" data-k="'+i+".table."+ri+"."+ci+'">'+val(i,"table."+ri+"."+ci,c)+"</td>";});
    h+="</tr>";
  });
  return h+"</tbody></table>";
}
function statHTML(i,s){
  var h='<div class="stat">';
  s.stats.forEach(function(x,j){
    h+='<div><div class="v ed" data-k="'+i+".stats."+j+'.v">'+val(i,"stats."+j+".v",x.v)+"</div>"+
       '<div class="l ed" data-k="'+i+".stats."+j+'.l">'+val(i,"stats."+j+".l",x.l)+"</div></div>";
  });
  return h+"</div>";
}
function refsHTML(i,s){
  var h='<ol class="refs'+(s.refs.length>7?" two":"")+'">';
  for(var j=0;j<s.refs.length;j++)
    h+='<li class="ed" data-k="'+i+".refs."+j+'">'+val(i,"refs."+j,s.refs[j])+"</li>";
  return h+"</ol>";
}
function calloutHTML(i,s){
  return '<div class="callout"><div class="h">'+esc(s.callout.h||"Teaching point")+"</div>"+
    '<p class="ed" data-k="'+i+'.callout.p">'+val(i,"callout.p",s.callout.p)+"</p></div>";
}

function slideHTML(i){
  var s=SLIDES[i],k=s.kind||"bullets",h="";
  var cls="slide "+k+(s.cls?" "+s.cls:"");

  if(k==="title"){
    h='<div class="pad">'+
      '<p class="no ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick||"")+"</p>"+
      ed(i,"title",s.title,"","h1")+
      (s.lead?ed(i,"lead",s.lead,"dek","p"):"")+
      (s.meta?'<div class="meta ed" data-k="'+i+'.meta">'+val(i,"meta",s.meta)+"</div>":"")+
      "</div>";
  }else if(k==="divider"){
    h='<div class="pad">'+
      '<div class="n">'+esc(s.no||"")+"</div>"+
      ed(i,"title",s.title,"","h2")+
      (s.lead?ed(i,"lead",s.lead,"lead","p"):"")+
      (s.chips&&s.chips.length?'<div class="chips">'+s.chips.map(function(c){return "<span>"+esc(c)+"</span>";}).join("")+"</div>":"")+
      "</div>";
  }else{
    var inner="";
    if(k==="figure"){
      inner='<div class="body v">'+figblock(i,s).replace('class="figwrap col"','class="figwrap"')+
            (s.callout?calloutHTML(i,s):"")+"</div>";
    }else if(k==="split"||k==="splitr"){
      var left='<div class="col '+(s.wide==="text"?"wide":"")+'">'+bullets(i,s.b,"b")+
        (s.callout?calloutHTML(i,s):"")+(s.stats?statHTML(i,s):"")+"</div>";
      var right=figblock(i,s);
      if(s.wide==="text")right=right.replace('class="figwrap col"','class="figwrap col narrow"');
      inner='<div class="body">'+(k==="splitr"?right+left:left+right)+"</div>";
    }else if(k==="cols"){
      inner=colsHTML(i,s)+(s.callout?calloutHTML(i,s):"");
    }else if(k==="refs"){
      inner='<div class="body v">'+refsHTML(i,s)+"</div>";
    }else if(k==="table"){
      inner='<div class="body v">'+tableHTML(i,s)+(s.callout?calloutHTML(i,s):"")+"</div>";
    }else{
      inner='<div class="body v">'+bullets(i,s.b,"b",s.b&&s.b.length>6?"tight":"")+
        (s.stats?statHTML(i,s):"")+(s.callout?calloutHTML(i,s):"")+"</div>";
    }
    h='<div class="pad" style="flex:1;display:flex;flex-direction:column;min-height:0">'+
      head(i,s,s.sm)+'<div class="rule"></div>'+inner+citesHTML(i,s)+"</div>"+foot(i,s);
  }
  return '<section class="'+cls+'" data-i="'+i+'">'+h+
    '<div class="pnotes">'+esc(NOTES[i]||s.notes||"")+"</div></section>";
}

/* ---------------- shrink-to-fit ---------------- */
function autofit(sl){
  try{
    if(!sl)return;
    var box=sl.querySelector(".body")||sl.querySelector(".cols");
    if(!box)return;
    var foot=sl.querySelector(".foot"),cit=sl.querySelector(".cites");
    sl.style.setProperty("--k","1");
    for(var i=0;i<9;i++){
      var lim=cit?cit.getBoundingClientRect().top
              :(foot?foot.getBoundingClientRect().top:sl.getBoundingClientRect().bottom);
      var over=(box.scrollHeight>box.clientHeight+1)||(box.getBoundingClientRect().bottom>lim+1);
      var kid=false;
      var cbs=sl.querySelectorAll(".cbox");
      for(var j=0;j<cbs.length;j++)if(cbs[j].scrollHeight>cbs[j].clientHeight+1){kid=true;break;}
      if(!over&&!kid)break;
      sl.style.setProperty("--k",(1-0.035*(i+1)).toFixed(3));
    }
  }catch(e){}
}

/* ---------------- layout / scale ---------------- */
function fit(){
  var st=document.querySelector(".stage"),ho=document.getElementById("holder");
  if(!st)return;
  var pad=26;
  var sc=Math.min((st.clientWidth-pad*2)/1280,(st.clientHeight-pad*2)/720);
  if(!isFinite(sc)||sc<=0)sc=.5;
  ho.style.transform="scale("+sc+")";
}
window.addEventListener("resize",fit);

/* ---------------- render current ---------------- */
function render(){
  var ho=document.getElementById("holder");
  ho.innerHTML=slideHTML(cur);
  applyEdit();
  autofit(ho.querySelector(".slide"));
  fit();
  var s=SLIDES[cur];
  document.getElementById("secNow").innerHTML=s.sec?("&sect; "+s.sec+" &nbsp;"+(s.secTitle||"")):"";
  document.getElementById("cnt").innerHTML="<b>"+(cur+1)+"</b> / "+SLIDES.length;
  var f=document.querySelector(".fill");
  if(f)f.style.width=((cur+1)/SLIDES.length*100)+"%";
  var nb=document.getElementById("noteBox");
  if(nb)nb.value=NOTES[cur]!=null?NOTES[cur]:(SLIDES[cur].notes||"");
  var nx=document.getElementById("nxt");
  if(nx)nx.textContent=cur+1<SLIDES.length?txt(val(cur+1,"title",SLIDES[cur+1].title||"—")):"End of deck";
  if(ovOn)markOv();
  if(location.hash!=="#"+(cur+1))history.replaceState(null,"","#"+(cur+1));
}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur){render();return;}
  cur=i;render();
}
function applyEdit(){
  var els=document.querySelectorAll("#holder .ed");
  for(var i=0;i<els.length;i++){
    if(editing)els[i].setAttribute("contenteditable","true");
    else els[i].removeAttribute("contenteditable");
  }
}

/* ---------------- overview ---------------- */
function buildOv(){
  var g=document.getElementById("ovgrid"),h="",lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    var sk=(s.sec||"")+"|"+(s.secTitle||"");
    if(sk!==lastSec){
      lastSec=sk;
      h+='<div class="ovsec">'+(s.sec?esc(s.sec)+" &nbsp; "+esc(s.secTitle||""):esc(META.short))+"</div>";
    }
    h+='<div class="ovc" data-go="'+i+'"><div class="shell" data-shell><div class="mini" data-mini>'+
      slideHTML(i)+'</div></div><div class="no">'+(i+1)+'</div><div class="lb">'+
      esc(txt(val(i,"title",s.title||""))||(s.kind==="divider"?"Section":"Slide"))+"</div></div>";
  }
  g.innerHTML=h;
  var ms=g.querySelectorAll(".mini .slide");
  for(var q=0;q<ms.length;q++)autofit(ms[q]);
  // scale minis
  var cards=g.querySelectorAll(".ovc");
  for(var j=0;j<cards.length;j++){
    var shell=cards[j].querySelector("[data-shell]"),mini=cards[j].querySelector("[data-mini]");
    var w=cards[j].clientWidth||232,sc=w/1280;
    mini.style.transform="scale("+sc+")";
    shell.style.height=(720*sc)+"px";
  }
  markOv();
}
function markOv(){
  var cards=document.querySelectorAll(".ovc");
  for(var i=0;i<cards.length;i++)cards[i].classList.toggle("cur",+cards[i].getAttribute("data-go")===cur);
  var c=document.querySelector(".ovc.cur");
  if(c)c.scrollIntoView({block:"nearest"});
}

/* ---------------- export ---------------- */
function toMarkdown(){
  var L=[];
  L.push("# "+META.title);
  L.push("");
  L.push("_"+META.short+" · "+SLIDES.length+" slides · exported from the editable HTML deck._");
  L.push("");
  var lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    if(s.sec&&s.sec!==lastSec){lastSec=s.sec;L.push("");L.push("## "+s.sec+" "+(s.secTitle||""));L.push("");}
    var t=txt(val(i,"title",s.title||""));
    L.push("### ["+(i+1)+"] "+(t||"(untitled)"));
    var ld=txt(val(i,"lead",s.lead||""));
    if(ld)L.push("");
    if(ld)L.push("_"+ld+"_");
    if(s.b&&s.b.length){L.push("");for(var j=0;j<s.b.length;j++)L.push("- "+txt(val(i,"b."+j,s.b[j])));}
    if(s.cols)s.cols.forEach(function(c,j){
      L.push("");L.push("**"+txt(val(i,"cols."+j+".h",c.h||""))+"**");
      var p=txt(val(i,"cols."+j+".p",c.p||""));if(p)L.push(p);
      (c.b||[]).forEach(function(x,m){L.push("- "+txt(val(i,"cols."+j+".b."+m,x)));});
    });
    if(s.table){L.push("");L.push("| "+s.table.head.join(" | ")+" |");
      L.push("|"+s.table.head.map(function(){return "---";}).join("|")+"|");
      s.table.rows.forEach(function(r,ri){L.push("| "+r.map(function(c,ci){
        return txt(val(i,"table."+ri+"."+ci,c));}).join(" | ")+" |");});}
    if(s.stats){L.push("");s.stats.forEach(function(x,j){
      L.push("- **"+txt(val(i,"stats."+j+".v",x.v))+"** — "+txt(val(i,"stats."+j+".l",x.l)));});}
    if(s.callout){L.push("");L.push("> **"+(s.callout.h||"Teaching point")+".** "+txt(val(i,"callout.p",s.callout.p)));}
    if(s.figcap){L.push("");L.push("_Figure: "+txt(val(i,"figcap",s.figcap))+"_");}
    if(s.refs){L.push("");s.refs.forEach(function(r,j){L.push((j+1)+". "+txt(val(i,"refs."+j,r)));});}
    if(s.cites&&s.cites.length){L.push("");
      L.push("_Sources: "+s.cites.map(function(c,j){
        return "["+(j+1)+"] "+txt(val(i,"cites."+j,c));}).join(" · ")+"_");}
    var nt=(NOTES[i]!=null?NOTES[i]:(s.notes||"")).trim();
    if(nt){L.push("");L.push("> **Speaker notes.** "+nt.replace(/\n/g," "));}
    L.push("");
  }
  return L.join("\n");
}
function openModal(title,text,name,mode){
  var m=document.getElementById("modal");
  document.getElementById("mTitle").textContent=title;
  var body=document.getElementById("mBody");
  if(mode==="help"){ body.innerHTML=HELP; }
  else{
    body.innerHTML='<textarea id="mText" spellcheck="false"></textarea>';
    var ta=document.getElementById("mText");ta.value=text;ta.setAttribute("data-name",name||"export.txt");
  }
  document.querySelector('[data-act="mcopy"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mdl"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mload"]').style.display=mode==="import"?"":"none";
  m.classList.add("on");
}
var HELP='<div class="help"><h4>Moving around</h4><table>'+
  '<tr><td><kbd>&rarr;</kbd> <kbd>&larr;</kbd> <kbd>Space</kbd></td><td>Next / previous slide</td></tr>'+
  '<tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>First / last slide</td></tr>'+
  '<tr><td><kbd>O</kbd></td><td>Overview grid of every slide, click one to jump</td></tr>'+
  '<tr><td><kbd>/</kbd></td><td>Search titles, bullets, references and your notes</td></tr>'+
  '<tr><td>number then <kbd>Enter</kbd></td><td>Jump to that slide</td></tr>'+
  '<tr><td><kbd>F</kbd></td><td>Fullscreen</td></tr></table>'+
  '<h4>Teaching and editing</h4><table>'+
  '<tr><td><kbd>E</kbd></td><td>Edit mode: click any heading, bullet, caption, table cell or reference and rewrite it</td></tr>'+
  '<tr><td><kbd>N</kbd></td><td>Speaker-notes panel, with the next slide title shown above it</td></tr>'+
  '<tr><td><kbd>T</kbd></td><td>Start / pause the lecture timer</td></tr>'+
  '<tr><td><kbd>P</kbd></td><td>Print or save as PDF, one slide per page with notes underneath</td></tr>'+
  '</table><h4>Keeping your work</h4><table>'+
  '<tr><td>Autosave</td><td>Edits and notes save to this browser automatically</td></tr>'+
  '<tr><td>Export</td><td>Markdown for handouts and lecture prep, JSON as a portable backup</td></tr>'+
  '<tr><td>Import</td><td>Paste a JSON backup to move your edits to another machine</td></tr>'+
  '</table></div>';

/* ---------------- search ---------------- */
function slideText(i){
  var s=SLIDES[i],parts=[txt(val(i,"title",s.title||"")),txt(val(i,"lead",s.lead||""))];
  (s.b||[]).forEach(function(x,j){parts.push(txt(val(i,"b."+j,x)));});
  (s.refs||[]).forEach(function(x,j){parts.push(txt(val(i,"refs."+j,x)));});
  (s.cols||[]).forEach(function(c,j){parts.push(txt(val(i,"cols."+j+".h",c.h||"")));
    parts.push(txt(val(i,"cols."+j+".p",c.p||"")));
    (c.b||[]).forEach(function(x,m){parts.push(txt(val(i,"cols."+j+".b."+m,x)));});});
  if(s.table)s.table.rows.forEach(function(r,ri){r.forEach(function(c,ci){
    parts.push(txt(val(i,"table."+ri+"."+ci,c)));});});
  if(s.figcap)parts.push(txt(val(i,"figcap",s.figcap)));
  (s.cites||[]).forEach(function(c,j){parts.push(txt(val(i,"cites."+j,c)));});
  if(s.callout)parts.push(txt(val(i,"callout.p",s.callout.p)));
  parts.push(NOTES[i]||s.notes||"");
  parts.push(s.sec||"",s.secTitle||"");
  return parts.join("  ");
}
function doSearch(q){
  var box=document.getElementById("sres");
  q=(q||"").trim();
  if(q.length<2){box.innerHTML="";return;}
  var lq=q.toLowerCase(),h="",n=0;
  for(var i=0;i<SLIDES.length&&n<40;i++){
    var t=slideText(i),p=t.toLowerCase().indexOf(lq);
    if(p<0)continue;
    n++;
    var a=Math.max(0,p-46),snip=esc(t.slice(a,p))+"<mark>"+esc(t.slice(p,p+q.length))+"</mark>"+esc(t.slice(p+q.length,p+q.length+80));
    h+='<button data-go="'+i+'"><span class="n">slide '+(i+1)+(SLIDES[i].sec?" &nbsp;&sect; "+esc(SLIDES[i].sec):"")+
       '</span><div class="t">'+esc(txt(val(i,"title",SLIDES[i].title||"")))+'</div><div class="n" style="margin-top:3px">'+
       (a>0?"…":"")+snip+"…</div></button>";
  }
  box.innerHTML=h||'<button style="cursor:default"><span class="n">no match</span></button>';
}

/* ---------------- timer ---------------- */
function tick(){
  var el=document.querySelector(".timer");if(!el)return;
  var ms=tAcc+(t0?(Date.now()-t0):0),s=Math.floor(ms/1000);
  el.textContent=(t0?"":"⏸ ")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
setInterval(tick,500);

/* ---------------- events ---------------- */
document.addEventListener("click",function(ev){
try{
  var t=ev.target;
  var g=t.closest?t.closest("[data-go]"):null;
  if(g){ go(+g.getAttribute("data-go"));
    if(ovOn)setOv(false);
    document.body.classList.remove("srch-on");
    return; }
  var b=t.closest?t.closest("[data-act]"):null;
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="next"){go(cur+1);return;}
  if(a==="prev"){go(cur-1);return;}
  if(a==="ov"){setOv(!ovOn);return;}
  if(a==="notes"){notesOn=!notesOn;document.body.classList.toggle("notes-on",notesOn);
    b.setAttribute("aria-pressed",String(notesOn));fit();return;}
  if(a==="edit"){editing=!editing;document.body.classList.toggle("edit",editing);
    b.setAttribute("aria-pressed",String(editing));applyEdit();
    toast(editing?"Edit mode on — click any text to rewrite it":"Edit mode off");return;}
  if(a==="search"){document.body.classList.toggle("srch-on");
    if(document.body.classList.contains("srch-on"))document.getElementById("q").focus();return;}
  if(a==="print"){printAll();return;}
  if(a==="help"){openModal("Keyboard and features","","","help");return;}
  if(a==="hub"){window.location.href=META.hub;return;}
  if(a==="export"){
    openModal("Export — Markdown",toMarkdown(),META.key+"-slides.md");
    document.getElementById("mSeg").innerHTML=
      '<button class="mbtn" data-act="expmd">Markdown</button>'+
      '<button class="mbtn" data-act="expjson">JSON backup</button>'+
      '<button class="mbtn" data-act="expimp">Import…</button>';
    return;}
  if(a==="expmd"){document.getElementById("mTitle").textContent="Export — Markdown";
    var t1=document.getElementById("mText");if(t1){t1.value=toMarkdown();t1.setAttribute("data-name",META.key+"-slides.md");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expjson"){document.getElementById("mTitle").textContent="Export — JSON backup";
    var t2=document.getElementById("mText");if(t2){t2.value=JSON.stringify({v:1,edits:EDITS,notes:NOTES},null,2);
      t2.setAttribute("data-name",META.key+"-backup.json");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expimp"){document.getElementById("mTitle").textContent="Import — paste a JSON backup, then Load";
    var t3=document.getElementById("mText");if(t3)t3.value="";
    document.querySelector('[data-act="mload"]').style.display="";return;}
  if(a==="mload"){
    try{ var o=JSON.parse(document.getElementById("mText").value);
      EDITS=o.edits||{};NOTES=o.notes||{};save();render();
      document.getElementById("modal").classList.remove("on");toast("Backup loaded");
    }catch(e){toast("That is not valid JSON");}
    return;}
  if(a==="mclose"){document.getElementById("modal").classList.remove("on");return;}
  if(a==="mcopy"){var ta=document.getElementById("mText");if(!ta)return;
    ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast("Copied");},function(){toast("Select and copy manually");});
    else toast(ok?"Copied to clipboard":"Select and copy manually");return;}
  if(a==="mdl"){var ta2=document.getElementById("mText");if(!ta2)return;
    var nm=ta2.getAttribute("data-name")||"export.txt";
    var bl=new Blob([ta2.value],{type:"text/plain;charset=utf-8"});
    var A=document.createElement("a");A.href=URL.createObjectURL(bl);A.download=nm;
    document.body.appendChild(A);A.click();A.remove();toast("Downloaded "+nm);return;}
}catch(e){boom(e);}
},false);

function setOv(on){
  ovOn=on;document.body.classList.toggle("ov-on",on);
  var b=document.querySelector('[data-act="ov"]');if(b)b.setAttribute("aria-pressed",String(on));
  if(on)buildOv();
}
function printAll(){
  var ho=document.getElementById("holder"),h="";
  for(var i=0;i<SLIDES.length;i++)h+=slideHTML(i);
  ho.innerHTML=h;ho.style.transform="none";
  var ps=ho.querySelectorAll(".slide");
  for(var q=0;q<ps.length;q++)autofit(ps[q]);
  document.body.classList.add("handout");
  window.print();
  setTimeout(function(){document.body.classList.remove("handout");render();},400);
}

/* progress bar click */
document.addEventListener("mousedown",function(ev){
  var tr=ev.target.closest?ev.target.closest(".track"):null;
  if(!tr)return;
  var r=tr.getBoundingClientRect();
  go(Math.round((ev.clientX-r.left)/r.width*(SLIDES.length-1)));
});

/* edits */
document.addEventListener("focusout",function(ev){
  try{
    var t=ev.target;
    if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
      var k=t.getAttribute("data-k");
      if(k){EDITS[k]=t.innerHTML.trim();save();}
    }
  }catch(e){boom(e);}
},true);
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="noteBox"){NOTES[cur]=t.value;save();return;}
  if(t.id==="q"){doSearch(t.value);return;}
});
document.addEventListener("paste",function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
    ev.preventDefault();
    var s=(ev.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,s);
  }
});

/* keys */
var numBuf="";
document.addEventListener("keydown",function(ev){
try{
  var tag=(ev.target.tagName||"").toLowerCase();
  var typing=ev.target.isContentEditable||tag==="input"||tag==="textarea";
  if(ev.key==="Escape"){
    document.getElementById("modal").classList.remove("on");
    document.body.classList.remove("srch-on");
    if(ovOn)setOv(false);
    if(ev.target.isContentEditable)ev.target.blur();
    return;
  }
  if(typing){
    if(ev.target.id==="q"&&ev.key==="Enter"){
      var f=document.querySelector("#sres [data-go]");
      if(f){go(+f.getAttribute("data-go"));document.body.classList.remove("srch-on");}
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==="ArrowRight"||ev.key==="PageDown"||ev.key===" "){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="ArrowDown"){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="Home"){ev.preventDefault();go(0);return;}
  if(ev.key==="End"){ev.preventDefault();go(SLIDES.length-1);return;}
  if(ev.key>="0"&&ev.key<="9"){numBuf+=ev.key;return;}
  if(ev.key==="Enter"&&numBuf){go(parseInt(numBuf,10)-1);numBuf="";return;}
  var k=ev.key.toLowerCase();
  numBuf="";
  if(k==="o"){setOv(!ovOn);return;}
  if(k==="n"){document.querySelector('[data-act="notes"]').click();return;}
  if(k==="e"){document.querySelector('[data-act="edit"]').click();return;}
  if(k==="p"){ev.preventDefault();printAll();return;}
  if(k==="/"||k==="?"){ev.preventDefault();
    if(ev.key==="?"){openModal("Keyboard and features","","","help");return;}
    document.body.classList.add("srch-on");document.getElementById("q").focus();return;}
  if(k==="t"){ if(t0){tAcc+=Date.now()-t0;t0=null;}else{t0=Date.now();} tick(); return;}
  if(k==="f"){ if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); return;}
}catch(e){boom(e);}
},false);

/* progress bar dom */
(function(){
  var p=document.createElement("div");p.className="prog";
  var ticks="";
  for(var i=0;i<SLIDES.length;i++){
    if(SLIDES[i].kind==="divider")ticks+='<i style="left:'+(i/(SLIDES.length-1)*100)+'%"></i>';
  }
  p.innerHTML='<span class="hint">&larr;/&rarr; move &nbsp;·&nbsp; O overview &nbsp;·&nbsp; E edit &nbsp;·&nbsp; N notes &nbsp;·&nbsp; T timer &nbsp;·&nbsp; ? help</span>'+
    '<div class="track"><div class="ticks">'+ticks+'</div><div class="fill"></div></div>'+
    '<span class="timer">⏸ 00:00</span>';
  document.body.appendChild(p);
})();

/* boot */
Store.get().then(function(raw){
  try{ if(raw){var o=JSON.parse(raw);EDITS=o.edits||{};NOTES=o.notes||{};} }catch(e){}
  var h=parseInt((location.hash||"").replace("#",""),10);
  if(h>0&&h<=SLIDES.length)cur=h-1;
  render();
  if(raw)toast("Your saved edits and notes are back");
}).catch(function(){render();});

}catch(e){boom(e);}
})();
</script>
