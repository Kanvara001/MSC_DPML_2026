<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Preparation for ML and AI — Chapter 4: Labs, seminars and assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#8A6A12;
  --accent-soft:#F8F1DF;
  --accent-ink:#6B520D;
  --paper:#EDF1F6;
  --card:#FFFFFF;
  --ink:#111823;
  --ink-2:#41505F;
  --ink-3:#78859A;
  --rule:#D3DCE6;
  --rule-2:#E7EDF3;
  --shell:#171E28;
  --shell-2:#212A36;
  --shell-3:#2E3946;
  --ok:#0F7A6A;
  --warn:#A3384F;
  --f-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-thai:"Noto Sans Thai","Archivo",sans-serif;
  --W:1280px; --H:720px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================ CHROME ============================ */
.bar{
  position:fixed;left:0;right:0;top:0;height:44px;z-index:40;
  background:var(--shell-2);border-bottom:1px solid #000;
  display:flex;align-items:center;gap:10px;padding:0 12px;color:#C6D1DD;
}
.bar .ch{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;flex:none;
}
.bar .tt{font-family:var(--f-ui);font-size:13px;font-weight:600;color:#EAF0F6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.bar .sec{font-family:var(--f-mono);font-size:10.5px;color:#7C8C9C;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.bar .grp{display:flex;gap:4px;align-items:center;flex:none}
.tb{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:6px 9px;
  border:1px solid var(--shell-3);border-radius:5px;color:#A9B7C5;background:transparent;white-space:nowrap;
}
.tb:hover{background:var(--shell-3);color:#fff}
.tb[aria-pressed="true"]{background:#E9EEF3;color:var(--shell);border-color:#E9EEF3;font-weight:600}
.tb.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.count{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;padding:0 4px;flex:none}
.count b{color:#fff}

/* ============================ STAGE ============================ */
.stage{
  position:fixed;inset:44px 0 30px 0;display:grid;place-items:center;overflow:hidden;
  background:var(--shell);
}
body.notes-on .stage{right:340px}
.holder{width:var(--W);height:var(--H);transform-origin:center center;position:relative}
.slide{
  width:var(--W);height:var(--H);background:var(--card);position:relative;overflow:hidden;
  box-shadow:0 12px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;
}

/* progress */
.prog{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:40;background:var(--shell-2);
  border-top:1px solid #000;display:flex;align-items:center;gap:10px;padding:0 12px}
.track{flex:1;height:6px;background:#0D131A;border-radius:3px;position:relative;overflow:hidden;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;transition:width .15s}
.ticks{position:absolute;inset:0}
.ticks i{position:absolute;top:0;bottom:0;width:1px;background:#33404E}
.prog .hint{font-family:var(--f-mono);font-size:9.5px;color:#5F6E7D;letter-spacing:.05em;white-space:nowrap}
.timer{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;min-width:52px;text-align:right}

/* ============================ SLIDE LAYOUTS ============================ */
.pad{padding:52px 64px 46px}
.slide{--k:1}
.slide .kick{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px;
}
.slide .kick .dot{width:22px;height:2px;background:var(--accent);display:inline-block}
.slide h2{
  font-family:var(--f-ui);font-size:calc(37px * var(--k));line-height:1.14;letter-spacing:-.022em;
  font-weight:650;margin:0 0 6px;color:var(--ink);
}
.slide h2.sm{font-size:calc(31px * var(--k))}
.slide .lead{
  font-size:calc(18.5px * var(--k));line-height:1.5;color:var(--ink-2);margin:calc(12px * var(--k)) 0 0;max-width:96ch;font-style:italic;
}
.slide .lead b{font-style:normal;color:var(--ink);font-weight:600}
.rule{height:2px;background:var(--accent);width:64px;margin:calc(16px * var(--k)) 0 calc(20px * var(--k));flex:none}

ul.bul{list-style:none;margin:0;padding:0}
ul.bul>li{
  position:relative;padding:0 0 0 24px;margin:0 0 calc(13px * var(--k));font-size:calc(17.5px * var(--k));line-height:1.48;color:var(--ink-2);
}
ul.bul>li:before{
  content:"";position:absolute;left:3px;top:11px;width:9px;height:2px;background:var(--accent);
}
ul.bul>li b,ul.bul>li strong{color:var(--ink);font-weight:600}
ul.bul>li em{font-style:italic;color:var(--ink)}
ul.bul.tight>li{margin-bottom:calc(9px * var(--k));font-size:calc(16.5px * var(--k))}
ul.bul.sm>li{font-size:calc(15.5px * var(--k));margin-bottom:calc(8px * var(--k));padding-left:20px}
ul.bul.sm>li:before{width:7px;top:10px}
.k{font-family:var(--f-mono);font-size:.86em;background:#EEF3F8;border:1px solid var(--rule-2);
  border-radius:3px;padding:1px 5px;color:var(--ink)}
.cite{font-family:var(--f-mono);font-size:.8em;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
.th{font-family:var(--f-thai)}

/* two column body */
.body{flex:1;min-height:0;display:flex;gap:34px}
.body.v{flex-direction:column;gap:16px}
.col{flex:1;min-width:0}
.col.narrow{flex:0 0 40%}
.col.wide{flex:0 0 58%}
.figwrap{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;flex:1 1 auto}
.figbox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.figbox svg{width:100%;height:100%;max-height:100%;display:block}
.figcap{
  font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.45;
  border-top:1px solid var(--rule-2);padding-top:8px;
}
.figcap b{color:var(--ink-2);font-weight:600}

/* columns layout */
.cols{display:grid;gap:18px;flex:1;min-height:0}
.cols.n2{grid-template-columns:1fr 1fr}
.cols.n3{grid-template-columns:1fr 1fr 1fr}
.cols.n4{grid-template-columns:repeat(4,1fr)}
.cbox{
  border:1px solid var(--rule);border-radius:9px;padding:calc(16px * var(--k)) 17px;background:#FBFDFE;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.cbox.acc{border-color:var(--accent);background:var(--accent-soft)}
.cbox h4{
  font-family:var(--f-ui);font-size:calc(15px * var(--k));font-weight:650;margin:0 0 4px;letter-spacing:-.01em;color:var(--ink);
}
.cbox .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 9px;font-weight:600}
.cbox p{margin:0 0 calc(8px * var(--k));font-size:calc(14.5px * var(--k));line-height:1.46;color:var(--ink-2)}
.cbox ul.bul>li{font-size:calc(14.5px * var(--k));margin-bottom:calc(7px * var(--k));padding-left:18px}
.cbox ul.bul>li:before{width:7px;top:9px}

/* title slide */
.slide.title{background:var(--shell);color:#E9EFF5;justify-content:center}
.slide.title .pad{padding:0 78px}
.slide.title .no{
  font-family:var(--f-mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 20px;
}
.slide.title h1{
  font-family:var(--f-ui);font-size:60px;line-height:1.06;letter-spacing:-.03em;font-weight:700;
  margin:0 0 20px;max-width:20ch;color:#fff;
}
.slide.title .dek{font-size:20px;line-height:1.5;color:#9DAEBE;max-width:62ch;margin:0 0 30px;font-style:italic}
.slide.title .meta{
  font-family:var(--f-mono);font-size:12px;color:#6F7F90;letter-spacing:.05em;line-height:1.9;
  border-top:1px solid #303B48;padding-top:18px;max-width:62ch;
}
.slide.title .meta b{color:#C3D0DC;font-weight:500}
.slide.title:after{
  content:"";position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.30;
}
.slide.title:before{
  content:"";position:absolute;right:-40px;bottom:-240px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.16;
}

/* divider */
.slide.divider{background:var(--accent-soft);justify-content:center}
.slide.divider .pad{padding:0 78px}
.slide.divider .n{
  font-family:var(--f-mono);font-size:96px;line-height:1;font-weight:600;letter-spacing:-.05em;
  color:var(--accent);opacity:.30;margin:0 0 6px;
}
.slide.divider h2{font-size:46px;max-width:22ch;color:var(--accent-ink)}
.slide.divider .lead{color:var(--ink-2);font-size:19px;max-width:70ch}
.slide.divider .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px;max-width:84ch}
.slide.divider .chips span{
  font-family:var(--f-mono);font-size:11px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--accent);color:var(--accent-ink);background:rgba(255,255,255,.6);
}

/* refs */
ol.refs{list-style:none;counter-reset:r;margin:0;padding:0;column-gap:34px}
ol.refs.two{column-count:2}
ol.refs>li{
  counter-increment:r;position:relative;padding:0 0 0 30px;margin:0 0 11px;
  font-size:calc(14.5px * var(--k));line-height:1.45;color:var(--ink-2);break-inside:avoid;
}
ol.refs>li:before{
  content:counter(r);position:absolute;left:0;top:2px;font-family:var(--f-mono);font-size:10px;
  font-weight:600;color:#fff;background:var(--accent);width:19px;height:19px;border-radius:4px;
  display:grid;place-items:center;
}
ol.refs>li b{color:var(--ink);font-weight:600}
ol.refs>li i{color:var(--ink-3);font-style:italic}

/* callout / lab / vilab */
.callout{
  border-left:3px solid var(--accent);background:var(--accent-soft);padding:calc(14px * var(--k)) 18px;border-radius:0 8px 8px 0;
  margin-top:calc(16px * var(--k));
}
.callout .h{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:600;margin-bottom:6px;
}
.callout p{margin:0;font-size:calc(15.5px * var(--k));line-height:1.5;color:var(--ink-2)}
.slide.vilab{background:linear-gradient(180deg,#FBFDFE 0%,#F2F6FA 100%)}
.slide.vilab .badge{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff;background:var(--ink);
  padding:5px 11px;border-radius:20px;margin-bottom:14px;
}
.slide.vilab .badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.slide.lab{background:#FCFBF6}
.stat{display:flex;gap:calc(26px * var(--k));margin:calc(18px * var(--k)) 0 0;flex-wrap:wrap}
.stat div{flex:0 0 auto}
.stat .v{font-family:var(--f-ui);font-size:calc(34px * var(--k));font-weight:700;letter-spacing:-.03em;color:var(--accent);line-height:1}
.stat .l{margin-top:calc(6px * var(--k))!important}
.stat .l{font-family:var(--f-mono);font-size:calc(10px * var(--k));letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-top:6px;max-width:22ch;line-height:1.5}

/* table */
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:0 12px 9px;border-bottom:2px solid var(--accent);font-weight:600;
}
table.t td{padding:calc(10px * var(--k)) 12px;font-size:calc(14.5px * var(--k));border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top;line-height:1.42}
table.t td:first-child{font-weight:600;color:var(--ink)}
table.t tr:last-child td{border-bottom:none}

/* per-slide citation footnotes */
sup.fn{font-family:var(--f-mono);font-size:.62em;font-weight:600;color:var(--accent);
  vertical-align:super;line-height:0;padding-left:1px}
.cites{
  flex:none;margin-top:calc(9px * var(--k));padding-top:6px;border-top:1px solid var(--rule-2);
  display:flex;flex-direction:column;gap:calc(2px * var(--k));
}
.cites .c{
  font-family:var(--f-ui);font-size:calc(10.5px * var(--k));line-height:1.42;color:var(--ink-3);
  display:flex;gap:6px;align-items:baseline;
}
.cites .c b{color:var(--accent);font-weight:700;flex:none;font-family:var(--f-mono);font-size:.94em}
.cites .c i{color:var(--ink-2);font-style:italic}
.cites .c .ed{min-width:0}
.slide.figure .cites,.slide.split .cites,.slide.splitr .cites{margin-top:calc(8px * var(--k))}

/* slide footer */
.foot{
  position:absolute;left:64px;right:64px;bottom:16px;display:flex;align-items:center;gap:12px;
  font-family:var(--f-mono);font-size:9.5px;color:#9FADBC;letter-spacing:.08em;text-transform:uppercase;
  border-top:1px solid var(--rule-2);padding-top:9px;
}
.foot .sp{flex:1}
.foot .tag{padding:2px 7px;border-radius:3px;border:1px solid var(--rule);letter-spacing:.09em}
.foot .tag.frontier{color:var(--warn);border-color:#E4BCC4;background:#FDF2F4}
.foot .tag.textbook{color:#3A4A57;border-color:#C3CCD4;background:#F2F5F7}
.foot .tag.both{color:#8A6A12;border-color:#E0D0A4;background:#FDF8EA}
.slide.title .foot,.slide.divider .foot{display:none}

/* editing */
body.edit .ed{border-radius:3px;cursor:text}
body.edit .ed:hover{background:#F1F7FC;box-shadow:0 0 0 4px #F1F7FC}
body.edit .ed:focus{background:#FFFBE6;box-shadow:0 0 0 4px #FFFBE6;outline:none}
.slide.title .ed:hover,.slide.title .ed:focus{background:#2C3742!important;box-shadow:0 0 0 4px #2C3742!important}

/* ============================ OVERVIEW ============================ */
.ov{position:fixed;inset:44px 0 30px 0;z-index:35;background:#10161E;overflow-y:auto;display:none;padding:20px}
body.ov-on .ov{display:block}
body.ov-on .stage{visibility:hidden}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;max-width:1500px;margin:0 auto}
.ovc{position:relative;cursor:pointer;border-radius:6px;overflow:hidden;background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.35);border:2px solid transparent}
.ovc:hover{border-color:var(--accent)}
.ovc.cur{border-color:#fff}
.ovc .mini{width:var(--W);height:var(--H);transform-origin:top left;pointer-events:none}
.ovc .shell{position:relative;overflow:hidden}
.ovc .lb{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.82));
  color:#fff;font-family:var(--f-mono);font-size:9.5px;padding:16px 8px 6px;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovc .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;
  font-family:var(--f-mono);font-size:9.5px;padding:2px 6px;border-radius:3px}
.ovsec{grid-column:1/-1;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7E8E9E;border-bottom:1px solid #29333F;padding:14px 0 7px;margin-top:6px}

/* ============================ NOTES ============================ */
.notes{
  position:fixed;right:0;top:44px;bottom:30px;width:340px;z-index:38;background:#131A23;
  border-left:1px solid #000;display:none;flex-direction:column;
}
body.notes-on .notes{display:flex}
.notes .nh{padding:12px 14px;border-bottom:1px solid #262F3B;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E8E9E}
.notes .nb{flex:1;overflow-y:auto;padding:12px 14px}
.notes .nxt{background:#0D131A;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.notes .nxt .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#5D6C7B;margin-bottom:5px}
.notes .nxt .t{font-family:var(--f-ui);font-size:13px;color:#C6D3DF;line-height:1.35}
.notes textarea{
  width:100%;min-height:280px;background:#0D131A;border:1px solid #262F3B;border-radius:6px;
  color:#D2DCE6;padding:11px 12px;font-family:var(--f-body);font-size:14px;line-height:1.55;resize:vertical;
}
.notes textarea:focus{outline:none;border-color:var(--accent)}
.notes .tip{font-family:var(--f-mono);font-size:9.5px;color:#4F5D6B;line-height:1.7;margin-top:12px}

/* ============================ MODAL ============================ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,17,.72);display:none;padding:26px}
.modal.on{display:flex;align-items:center;justify-content:center}
.sheet{background:#fff;border-radius:10px;width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.sheet header h3{margin:0;font-family:var(--f-ui);font-size:15px;font-weight:650;flex:1}
.sheet .mb{padding:0;flex:1;overflow:auto;min-height:0}
.sheet textarea{width:100%;height:56vh;border:0;padding:16px 20px;font-family:var(--f-mono);font-size:11.5px;
  line-height:1.6;resize:none;outline:none;background:#F7F9FB;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.mbtn{font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:6px;
  border:1px solid var(--rule);background:#fff;color:var(--ink)}
.mbtn:hover{border-color:var(--ink-3)}
.mbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.help{padding:6px 20px 20px}
.help table{width:100%;border-collapse:collapse;font-size:13.5px}
.help td{padding:7px 10px;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
.help td:first-child{width:150px}
.help kbd{font-family:var(--f-mono);font-size:11px;background:#EEF3F8;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--ink)}
.help h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:20px 0 6px}

/* search */
.srch{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:55;width:min(680px,92vw);display:none}
body.srch-on .srch{display:block}
.srch input{width:100%;padding:13px 16px;border-radius:9px;border:1px solid #33404E;background:#0D131A;
  color:#E4EBF2;font-family:var(--f-ui);font-size:15px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.srch input:focus{outline:none;border-color:var(--accent)}
.sres{margin-top:6px;background:#131A23;border:1px solid #262F3B;border-radius:9px;max-height:52vh;
  overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sres button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid #1E2732;color:#C0CDD9}
.sres button:hover{background:#1C2530;color:#fff}

no,monospace\">S4 ethics</text><rect x=\"100\" y=\"317\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#A3384F\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"117\" y=\"328\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Chapter 0 · foundations</text><rect x=\"268.56\" y=\"317\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"285.56\" y=\"328\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Ch 1 · tabular</text><rect x=\"385.64\" y=\"317\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"402.64\" y=\"328\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Ch 2 · text</text><rect x=\"485.56\" y=\"317\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"502.56\" y=\"328\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Ch 3 · image</text><rect x=\"591.2\" y=\"317\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#8A6A12\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"608.2\" y=\"328\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">lab</text><rect x=\"16\" y=\"344\" width=\"552\" height=\"104\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"370\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Read it as a load chart, not a syllabus</text><text x=\"36\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Weeks 1 and 9 carry no lab on purpose: week 1 is orientation and</text><text x=\"36\" y=\"407\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">week 9 opens the image block with three lecture-heavy sections.</text><text x=\"36\" y=\"422\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Week 8 carries two. If the term is short, Lab 7 is the one to</text><text x=\"36\" y=\"437\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">set as reading.</text><rect x=\"582\" y=\"344\" width=\"552\" height=\"104\" rx=\"9\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1.4\"/><text x=\"602\" y=\"370\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#8A6A12\" font-weight=\"700\">Every column has a Chapter 0 dependency</text><text x=\"602\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Even the weeks with no red band lean on §0.3 for the split</text><text x=\"602\" y=\"407\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">design and §0.8 for the documentation. That is the argument for</text><text x=\"602\" y=\"422\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">teaching Chapter 0 first and revisiting it in week 12 rather</text><text x=\"602\" y=\"437\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">than treating it as an appendix.</text></svg>", "f_labanatomy": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">A lab brief is not a title</text><text x=\"20\" y=\"46\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Seven fields. A brief missing any one of them produces a notebook</text><text x=\"20\" y=\"60\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">that runs and an artefact nobody can mark.</text><rect x=\"24\" y=\"82\" width=\"552\" height=\"42\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"82\" width=\"7\" height=\"42\" rx=\"3\" fill=\"#C6D3DF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"44\" y=\"101\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Dataset</text><text x=\"44\" y=\"117\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">named, public, and small enough to finish</text><text x=\"566\" y=\"108\" font-size=\"13\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">1</text><rect x=\"24\" y=\"129\" width=\"552\" height=\"42\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"129\" width=\"7\" height=\"42\" rx=\"3\" fill=\"#BCCBDA\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"44\" y=\"148\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The comparison</text><text x=\"44\" y=\"164\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">exactly two or three arms, everything else held fixed</text><text x=\"566\" y=\"155\" font-size=\"13\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">2</text><rect x=\"24\" y=\"176\" width=\"552\" height=\"42\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"176\" width=\"7\" height=\"42\" rx=\"3\" fill=\"#B2C3D5\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"44\" y=\"195\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Deliverable</text><text x=\"44\" y=\"211\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the artefact, not the number</text><text x=\"566\" y=\"202\" font-size=\"13\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">3</text><rect x=\"24\" y=\"223\" width=\"552\" height=\"42\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"223\" width=\"7\" height=\"42\" rx=\"3\" fill=\"#A8BCD0\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"44\" y=\"242\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Marking criterion</text><text x=\"44\" y=\"258\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">which rubric rows this lab is graded on</text><text x=\"566\" y=\"249\" font-size=\"13\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">4</text><rect x=\"24\" y=\"270\" width=\"552\" height=\"42\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"270\" width=\"7\" height=\"42\" rx=\"3\" fill=\"#9EB4CB\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"44\" y=\"289\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Expected time</text><text x=\"44\" y=\"305\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">supervised hours plus own hours, stated honestly</text><text x=\"566\" y=\"296\" font-size=\"13\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">5</text><rect x=\"24\" y=\"317\" width=\"552\" height=\"42\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"317\" width=\"7\" height=\"42\" rx=\"3\" fill=\"#8A6A12\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"44\" y=\"336\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Expected failure mode</text><text x=\"44\" y=\"352\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">what they will get wrong, and what it teaches</text><text x=\"566\" y=\"343\" font-size=\"13\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">6</text><rect x=\"24\" y=\"364\" width=\"552\" height=\"42\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"24\" y=\"364\" width=\"7\" height=\"42\" rx=\"3\" fill=\"#16202C\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"44\" y=\"383\" font-size=\"13\" text ht=\"56\" rx=\"6\" fill=\"#F1F4F7\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"415.0\" y=\"286\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\">no baseline</text><rect x=\"518\" y=\"258\" width=\"190\" height=\"56\" rx=\"6\" fill=\"#DFE7EE\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"613.0\" y=\"286\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\">one baseline, one budget</text><rect x=\"716\" y=\"258\" width=\"190\" height=\"56\" rx=\"6\" fill=\"#C2D3E2\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"811.0\" y=\"286\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\">random across ≥ 3 budgets</text><rect x=\"914\" y=\"258\" width=\"190\" height=\"56\" rx=\"6\" fill=\"#F8F1DF\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"1009.0\" y=\"279\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\">random with error bars;</text><text x=\"1009.0\" y=\"293\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\">losses reported too</text><rect x=\"16\" y=\"318\" width=\"290\" height=\"56\" rx=\"7\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"32\" y=\"351\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Reported failure modes</text><rect x=\"320\" y=\"318\" width=\"190\" height=\"56\" rx=\"6\" fill=\"#F1F4F7\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"415.0\" y=\"346\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\">“future work”</text><rect x=\"518\" y=\"318\" width=\"190\" height=\"56\" rx=\"6\" fill=\"#DFE7EE\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"613.0\" y=\"346\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\">generic limitations</text><rect x=\"716\" y=\"318\" width=\"190\" height=\"56\" rx=\"6\" fill=\"#C2D3E2\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"811.0\" y=\"339\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\">failure modes named with</text><text x=\"811.0\" y=\"353\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\">the slice affected</text><rect x=\"914\" y=\"318\" width=\"190\" height=\"56\" rx=\"6\" fill=\"#F8F1DF\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"1009.0\" y=\"339\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\">demonstrated on a</text><text x=\"1009.0\" y=\"353\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\">held-out failure set</text><rect x=\"16\" y=\"386\" width=\"700\" height=\"62\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"410\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Turning five scores into one mark</text><text x=\"36\" y=\"432\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Mean ≥ 1.5 passes · mean ≥ 2.5 with nothing below 2 is a distinction · a 0 on either gate is a referral, whatever the mean.</text><rect x=\"732\" y=\"386\" width=\"402\" height=\"62\" rx=\"9\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1.4\"/><text x=\"752\" y=\"408\" font-size=\"13\" text-anchor=\"start\" fill=\"#8A6A12\" font-weight=\"700\">Why gates rather than weights</text><text x=\"752\" y=\"426\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A leaky result is not 80% of a clean one. It is a</text><text x=\"752\" y=\"440\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">different claim.</text></svg>", "f_capstone": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"22\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">A capstone template drawn from a real project: the OV-RDT screening platform</text><rect x=\"21\" y=\"52\" width=\"204\" height=\"82\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"123.0\" y=\"76\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\">Raw source</text><text x=\"123.0\" y=\"98\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">field photographs,</text><text x=\"123.0\" y=\"113\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">phone cameras</text><path d=\"M228 93 L236.0 93.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M243.0 93.0 L234.0 88.6 L234.0 97.4 z\" fill=\"#8494A5\"/><text x=\"21\" y=\"158\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">STUDENT MUST PRODUCE</text><text x=\"21\" y=\"178\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">name the acquisition device</text><text x=\"21\" y=\"193\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">and the person holding it</text><rect x=\"247\" y=\"52\" width=\"204\" height=\"82\" rx=\"9\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1.8\"/><text x=\"349.0\" y=\"76\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\">Quality gate</text><text x=\"349.0\" y=\"98\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8A6A12\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">YOLOv5m capture check,</text><text x=\"349.0\" y=\"113\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8A6A12\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">574 annotated images</text><path d=\"M454 93 L462.0 93.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M469.0 93.0 L460.0 88.6 L460.0 97.4 z\" fill=\"#8494A5\"/><text x=\"247\" y=\"158\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">STUDENT MUST PRODUCE</text><text x=\"247\" y=\"178\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">a separate model, with its own</text><text x=\"247\" y=\"193\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">annotation budget and its own</text><text x=\"247\" y=\"208\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">metric</text><rect x=\"473\" y=\"52\" width=\"204\" height=\"82\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"575.0\" y=\"76\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\">Annotation protocol</text><text x=\"575.0\" y=\"98\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">expert-annotated,</text><text x=\"575.0\" y=\"113\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">8,624 images</text><path d=\"M680 93 L688.0 93.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M695.0 93.0 L686.0 88.6 L686.0 97.4 z\" fill=\"#8494A5\"/><text x=\"473\" y=\"158\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">STUDENT MUST PRODUCE</text><text x=\"473\" y=\"178\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">decision rules, an edge-case</text><text x=\"473\" y=\"193\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">catalogue, and a refusal class</text><rect x=\"699\" y=\"52\" width=\"204\" height=\"82\" rx=\"9\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1.8\"/><text x=\"801.0\" y=\"76\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\">Grouped split</text><text x=\"801.0\" y=\"98\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8A6A12\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">6,900 train /</text><text x=\"801.0\" y=\"113\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8A6A12\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">1,724 test</text><path d=\"M906 93 L914.0 93.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M921.0 93.0 L912.0 88.6 L912.0 97.4 z\" fill=\"#8494A5\"/><text x=\"699\" y=\"158\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">STUDENT MUST PRODUCE</text><text x=\"699\" y=\"178\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">declared before the first</text><text x=\"699\" y=\"193\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">experiment, at the specimen</text><text x=\"699\" y=\"208\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">level</text><rect x=\"925\" y=\"52\" width=\"204\" height=\"82\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"1027.0\" y=\"76\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\">Deployment constraint</text><text x=\"1027.0\" y=\"98\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">field use, one shot,</text><text x=\"1027.0\" y=\"113\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">non-expert operator</text><text x=\"925\" y=\"158\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">STUDENT MUST PRODUCE</text><text x=\"925\" y=\"178\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the constraint that decides</text><text x=\"925\" y=\"193\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">what preprocessing may cost</text><rect x=\"16\" y=\"246\" width=\"1118\" height=\"44\" rx=\"9\" fill=\"#16202C\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"575.0\" y=\"273\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"600\">A capstone missing any one of these five is not a capstone — it is a model on somebody else's dataset</text><rect x=\"16\" y=\"306\" width=\"552\" height=\"106\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"332\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Why this project makes such a good template</text><text x=\"36\" y=\"354\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">It is the rare published pipeline where all five stages are</text><text x=\"36\" y=\"370\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">visible and documented, including the one students always omit —</text><text x=\"36\" y=\"386\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the quality gate that refuses an un-answerable input rather than</text><text x=\"36\" y=\"402\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">guessing at it.</text><rect x=\"582\" y=\"306\" width=\"552\" height=\"106\" rx=\"9\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1.4\"/><text x=\"602\" y=\"332\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#8A6A12\" font-weight=\"700\">Institutional datasets that fit the same shape</text><text x=\"602\" y=\"354\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Hospital ultrasound archives, university CCTV with a consent</text><text x=\"602\" y=\"370\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">regime, registry exports, Thai-language social-media corpora. Each</text><text x=\"602\" y=\"386\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">has a raw source, a quality problem, a grouping unit and a</text><text x=\"602\" y=\"402\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">deployment constraint.</text><text x=\"575.0\" y=\"438\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Junsawang, Techasen, Wiratchawa, Wanna, Wongphutorn, Worasith, Sithithaworn, Bulathwela &amp; Intharah, Scientific Reports 15:31062 (2025)</text></svg>", "f_thesismap": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"22\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Open problems, grouped by chapter — the shaded ones are supervisable in the Visual Intelligence Laboratory</text><rect x=\"17\" y=\"44\" width=\"264\" height=\"316\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"17\" y=\"44\" width=\"264\" height=\"5\" rx=\"2\" fill=\"#A3384F\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"33\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Chapter 0</text><text x=\"33\" y=\"94\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.2\">FOUNDATIONS</text><rect x=\"29\" y=\"110\" width=\"240\" height=\"44\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"39\" y=\"129\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Multi-objective pipeline search</text><text x=\"39\" y=\"144\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">with honest nested validation</text><rect x=\"29\" y=\"161\" width=\"240\" height=\"44\" rx=\"6\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1\"/><text x=\"39\" y=\"180\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Pruning metrics that transfer</text><text x=\"39\" y=\"195\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">across architectures</text><rect x=\"29\" y=\"212\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"39\" y=\"231\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Label aggregation when the</text><text x=\"39\" y=\"246\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">reference standard is itself</text><text x=\"39\" y=\"261\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">imperfect</text><rect x=\"29\" y=\"278\" width=\"240\" height=\"44\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"39\" y=\"297\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Measuring what a filter removed,</text><text x=\"39\" y=\"312\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">and from whom</text><rect x=\"301\" y=\"44\" width=\"264\" height=\"316\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"301\" y=\"44\" width=\"264\" height=\"5\" rx=\"2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"317\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Chapter 1</text><text x=\"317\" y=\"94\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.2\">TABULAR</text><rect x=\"313\" y=\"110\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1\"/><text x=\"323\" y=\"129\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Uncertainty-aware imputation</text><text x=\"323\" y=\"144\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">under MNAR and informative</text><text x=\"323\" y=\"159\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">missingness</text><rect x=\"313\" y=\"176\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"323\" y=\"195\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Calibration-preserving treatment</text><text x=\"323\" y=\"210\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">of imbalance in clinical risk</text><text x=\"323\" y=\"225\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">models</text><rect x=\"313\" y=\"242\" width=\"240\" height=\"44\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"323\" y=\"261\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">What preprocessing a tabular</text><text x=\"323\" y=\"276\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">foundation model still needs</text><rect x=\"313\" y=\"293\" width=\"240\" height=\"44\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"323\" y=\"312\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Cohort construction as a</text><text x=\"323\" y=\"327\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">reproducible, versioned artefact</text><rect x=\"585\" y=\"44\" width=\"264\" height=\"316\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"585\" y=\"44\" width=\"264\" height=\"5\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"601\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Chapter 2</text><text x=\"601\" y=\"94\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.2\">TEXT AND LLM</text><rect x=\"597\" y=\"110\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1\"/><text x=\"607\" y=\"129\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Multilingually fair tokenisers</text><text x=\"607\" y=\"144\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">for Thai and Southeast Asian</text><text x=\"607\" y=\"159\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">scripts</text><rect x=\"597\" y=\"176\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"607\" y=\"195\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">How Thai word-segmentation error</text><text x=\"607\" y=\"210\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">propagates through the whole</text><text x=\"607\" y=\"225\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">stack</text><rect x=\"597\" y=\"242\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"607\" y=\"261\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Chunking evaluation that</text><text x=\"607\" y=\"276\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">separates retrieval failure from</text><text x=\"607\" y=\"291\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">generation failure</text><rect x=\"597\" y=\"308\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"607\" y=\"327\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Building a Thai clinical</text><text x=\"607\" y=\"342\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">instruction set with expert</text><text x=\"607\" y=\"357\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">review in the loop</text><rect x=\"869\" y=\"44\" width=\"264\" height=\"316\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"869\" y=\"44\" width=\"264\" height=\"5\" rx=\"2\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"885\" y=\"76\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Chapter 3</text><text x=\"885\" y=\"94\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.2\">IMAGE AND VIDEO</text><rect x=\"881\" y=\"110\" width=\"240\" height=\"74\" rx=\"6\" fill=\"#F8F1DF\" stroke=\"#8A6A12\" stroke-width=\"1\"/><text x=\"891\" y=\"129\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Preparation for CCTV and edge</text><text x=\"891\" y=\"144\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">deployment, where training and</text><text x=\"891\" y=\"159\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">serving preprocessing must match</text><text x=\"891\" y=\"174\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">exactly</text><rect x=\"881\" y=\"191\" width=\"240\" height=\"59\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"891\" y=\"210\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Capture-quality gates as</text><text x=\"891\" y=\"225\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">first-class models with their own</text><text x=\"891\" y=\"240\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">datasets</text><rect x=\"881\" y=\"257\" width=\"240\" height=\"44\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"891\" y=\"276\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Scanner and stain harmonisation</text><text x=\"891\" y=\"291\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">judged by downstream utility</text><rect x=\"881\" y=\"308\" width=\"240\" height=\"44\" rx=\"6\" fill=\"#F6F8FA\" stroke=\"#D3DCE6\" stroke-width=\"1\"/><text x=\"891\" y=\"327\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Annotation cost models for video</text><text x=\"891\" y=\"342\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">and tracking</text><rect x=\"16\" y=\"372\" width=\"1118\" height=\"74\" rx=\"9\" fill=\"#16202C\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"36\" y=\"400\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#fff\" font-weight=\"700\">How to use this slide with a student</text><text x=\"36\" y=\"424\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#B9C6D3\" font-weight=\"400\">Ask which box they would want to be wrong about. A topic you would enjoy disproving is a topic with a real hypothesis in it — and every box here already has an honest baseline waiting to beat it.</text></svg>"}, "slides": [{"kind": "title", "kick": "Research Master · Data Science and Machine Learning", "title": "Labs, seminars and assessment", "lead": "The deck that turns the curriculum map into a runnable course — eleven labs, five seminar formats, one rubric, and a capstone that produces a release rather than a result.", "meta": "<b>Chapter 4 of 4</b> &nbsp;·&nbsp; Data Preparation for Machine Learning and AI<br>Thanapong Intharah &nbsp;·&nbsp; Visual Intelligence Laboratory &nbsp;·&nbsp; Khon Kaen University<br>Runs throughout the twelve weeks &nbsp;·&nbsp; use in session 1 and in supervision meetings", "notes": "This is the deck you open at 8am before the first session, and again in supervision. It is written so a co-teacher who did not design the labs can run one. If you have twenty minutes in session 1, show slide 3 and the rubric, and nothing else."}, {"kind": "bullets", "sec": "4.0", "secTitle": "What this chapter is for", "kick": "Orientation", "title": "What this chapter is for", "lead": "Chapters 0 to 3 are what we teach. This one is how it is taught, marked, and defended to somebody who was not in the room.", "b": ["<b>It makes the map runnable.</b> Fifty-one topics do not schedule themselves. Section 4.1 places eleven labs across twelve weeks.", "<b>It makes the labs defensible.</b> Every brief names a public dataset, an exact comparison, a deliverable, a marking criterion, an expected time, and <em>the failure mode we expect students to hit</em>.", "<b>It stitches the four chapters together.</b> Every lab carries a <b>grounded in &sect;x.y</b> line. A lab that cannot name its section is a tool demonstration and should be cut.", "<b>It makes the marking survive an external examiner.</b> One rubric, five criteria, four levels, two hard gates — printed on one page and used from week 2 onward, not invented at the end.", "<b>It protects the honest-baseline rule.</b> Random across budgets with error bars, and the naive split number reported beside the honest one.", "<b>It is a working document.</b> Press <b>E</b> to edit any line in place, <b>N</b> for speaker notes, <b>O</b> for the slide grid, <b>P</b> to print the lab briefs as a handout."], "callout": {"h": "The organising claim of this chapter", "p": "A student who got a disappointing number and can say exactly why should outrank a student who got a good number and cannot say where it came from. Every design decision in this deck follows from that one sentence."}, "notes": "Say the organising claim out loud in session 1 and then point at the rubric. Students discover very quickly whether a stated marking philosophy is real. This one has to be, or the labs collapse into leaderboard chasing by week 5."}, {"kind": "figure", "title": "The twelve-week plan, with the labs on it", "kick": "Course plan", "tag": "both", "lead": "One page. Which chapter each week draws on, where the eleven labs sit, and when each of the five seminar formats runs.", "fig": "f_weekgrid", "figcap": "<b>Week titles from the module outline.</b> Chapter 0 sections recur in weeks 1, 2, 3, 5, 11 and 12; Chapters 1–3 run in blocks of three. Labs are placed one week <em>after</em> the lecture that grounds them wherever adjudication or compute time is needed.", "notes": "The two deliberate gaps are worth defending out loud: week 1 has no lab because orientation and the annotated-bibliography launch fill it, and week 9 has none because the image block opens with three lecture-heavy sections. Week 8 carries two labs. If the term is compressed, Lab 7 becomes reading.", "sec": "4.0", "secTitle": "What this chapter is for"}, {"kind": "divider", "sec": "4.1", "secTitle": "Laboratory sequence", "no": "4.1", "title": "Laboratory sequence", "lead": "Eleven labs, each designed so the student produces a defensible artefact rather than a notebook that merely runs.", "chips": ["Anatomy of a brief", "Grounded in §x.y", "Leakage", "Missingness", "Calibration", "Corpus filtering", "Tokenisers", "Chunking", "Selection", "Augmentation", "Fingerprints", "Label errors", "Documentation"], "notes": "Before turning the page: tell the room that the labs are the assessment, not homework attached to it. Eleven briefs follow in week order after the two framing slides. If you are handing this deck to a co-teacher, this is the section to print — each brief is one page and self-contained."}, {"kind": "split", "title": "Anatomy of a lab brief", "kick": "4.1.0", "tag": "both", "wide": "text", "lead": "The template every brief in this section fills in. Use it for any lab you add.", "b": ["<b>Dataset</b> — named, public, and small enough that a run finishes in the session.", "<b>The comparison</b> — two or three arms, everything else held fixed. Write down what “everything else” means <em>before</em> the first run.", "<b>Deliverable</b> — the artefact, not the number: a model info sheet, an ablation table, an adjudication log, a datasheet.", "<b>Marking criterion</b> — which two rubric rows this lab is graded on.", "<b>Expected time</b> — supervised hours plus own hours, stated honestly.", "<b>Expected failure mode</b> — what they will get wrong, and what that mistake teaches. This is the field that turns a demonstration into a lab.", "<b>Grounded in &sect;x.y</b> — the chapter section this lab makes concrete."], "fig": "f_labanatomy", "figcap": "A brief missing any one field produces work that runs and cannot be marked.", "callout": {"h": "For a co-teacher running a lab they did not design", "p": "Read the failure-mode line first, then the comparison. Those two tell you what to watch for as you walk the room."}, "notes": "The failure-mode field is the one people skip when they write their own labs. Insist on it. If you cannot name the mistake you expect, you have written a demonstration, and demonstrations do not change anyone's habits.", "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "figure", "title": "Every lab traces back to a section", "kick": "4.1.0", "tag": "both", "lead": "The dependency map. It is also the answer to “why are we doing this in week 6?”", "fig": "f_labmap", "figcap": "<b>The Chapter 0 column is never empty.</b> Split design, label quality, reduction and documentation reach into every lab regardless of data family — which is the argument for teaching Chapter 0 first and returning to it in week 12.", "notes": "Use this in supervision, not just in the lecture. Ask a student which row their thesis chapter sits on. If they cannot point at one, the method they are proposing has no stated purpose yet.", "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "both", "kick": "Lab 1 · week 2 · grounded in §0.3", "sm": true, "title": "Build a leak-proof pipeline, then break it", "lead": "The anchor lab. Everything else in the module assumes the student has done this one.", "b": ["<b>Dataset.</b> UCI <span class='k'>Diabetes 130-US hospitals, 1999–2008</span> — around a hundred thousand hospital encounters carrying a patient identifier, so the same patient recurs many times. Target: readmission within 30 days.", "<b>The comparison.</b> One gradient-boosted model, four arms: (a) scaler, imputer and target encoder fitted on all rows, then a random split; (b) fitted inside the folds, split at random by encounter; (c) fitted inside the folds, grouped by patient; (d) grouped by patient <em>and</em> near-duplicate encounters removed first.", "<b>Deliverable.</b> A completed <b>model info sheet</b> (Kapoor &amp; Narayanan<sup class=\"fn\">1</sup>'s template, one row per leakage type), the four held-out numbers in one table, and a paragraph naming which leakage types each arm exhibits.", "<b>Marked on.</b> Leakage control (gate) and documented decisions.", "<b>Time.</b> 3 h supervised + about 5 h own.", "<b>Grounded in &sect;0.3</b> — the eight-type taxonomy stops being a reading and becomes a number the student produced."], "callout": {"h": "The failure mode to plan for", "p": "They wrap everything in a <span class='k'>Pipeline</span>, feel safe, and still leak — because one patient has many encounters and <span class='k'>train_test_split</span> does not know that. <b>Fold discipline and split design are two different controls</b>, and almost everyone conflates them the first time. That confusion is the lesson; arm (c) is where they see it."}, "notes": "Run this in week 2, before anyone has a result they are attached to. Ask for a show of hands on arm (a) versus arm (c) predictions before they run it — the room usually guesses the gap is small. It is not. Keep the four numbers on the board for the rest of the term.", "cites": ["Kapoor & Narayanan. <i>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</i> Patterns 4(9), 2023."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "both", "kick": "Lab 2 · week 3 · grounded in §1.2", "sm": true, "title": "Missing-data study: where sophistication stops paying", "lead": "Not “which imputer wins”. Which imputer wins under which mechanism, judged by which metric.", "b": ["<b>Dataset.</b> <span class='k'>NHANES</span> (CDC, public) — a laboratory and questionnaire subset where the missingness is real and demonstrably not at random: fasting labs missing by appointment time, income refusals concentrated in particular groups. Plus a complete-case subset for synthetic masking.", "<b>The comparison.</b> Median fill, MICE, MissForest and a boosted tree's native NA handling, under MCAR, MAR and MNAR masks at 10 / 30 / 50%. Every arm evaluated <em>twice</em>: reconstruction error against the masked truth, and downstream held-out performance.", "<b>Deliverable.</b> A two-panel figure — reconstruction ranking beside downstream ranking — and one paragraph arguing the mechanism for two <em>real</em> columns from the collection process, not from the data.", "<b>Marked on.</b> Mechanism-aware handling and honest baselines.", "<b>Time.</b> 3 h supervised + about 6 h own.", "<b>Grounded in &sect;1.2</b> — Rubin's taxonomy is only useful once you have tried to argue it out loud for a column somebody actually collected."], "callout": {"h": "The failure mode to plan for", "p": "They rank methods by reconstruction error. That metric rewards conditional-mean imputers and correlates poorly with the downstream ranking — the two panels disagree, and the disagreement is the finding. Worse, under MNAR every method is biased in the same direction, so the ranking looks reassuringly stable while meaning nothing at all."}, "notes": "The two-panel figure is the slide students remember. If a group reports only one panel, send it back. The mechanism paragraph is where the marks are: nearly everyone tries to infer the mechanism from the data, which is exactly what cannot be done.", "cites": ["Stekhoven & Bühlmann. <i>MissForest — non-parametric missing value imputation for mixed-type data.</i> Bioinformatics, 2012."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "frontier", "kick": "Lab 3 · week 5 · grounded in §1.9", "sm": true, "title": "Imbalance and calibration: the correction that costs you something", "lead": "Reproduce, at small scale, the finding that resampling improves apparent discrimination while degrading the numbers a clinician would act on.", "b": ["<b>Dataset.</b> The same Diabetes 130 cohort with the &lt; 30-day readmission label (a strongly minority positive class), so students already know the split design. Optional second arm: a public card-fraud table for the extreme case.", "<b>The comparison.</b> No correction / random oversampling / SMOTE / class weights / threshold moving. Each reported with <b>five</b> things: ROC-AUC, PR-AUC, a calibration curve, Brier score, and net benefit across a plausible threshold range.", "<b>Deliverable.</b> The calibration-curve panel, plus a one-page recommendation written to a clinical reader that names the operating threshold <em>and</em> the cost assumption behind it.", "<b>Marked on.</b> Mechanism-aware handling and reported failure modes.", "<b>Time.</b> 3 h supervised + about 5 h own.", "<b>Grounded in &sect;1.9</b> — a small-scale reproduction of van den Goorbergh et al. (2022) and Carriero et al.<sup class=\"fn\">3</sup> (2024)."], "callout": {"h": "The failure mode to plan for", "p": "They report AUC before and after resampling, see almost no change, and conclude that resampling is harmless. It is not — the predicted risks are inflated, and the calibration curve is the only place that shows. <b>Discrimination and calibration are different objects.</b>"}, "notes": "The clinical recommendation is the part that reveals whether they understood it. Ask each group what cost ratio they assumed. Most have not thought about it, which is precisely why they reached for resampling instead of a threshold in the first place.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013.", "Carriero et al. <i>The harms of class imbalance corrections for machine-learning-based prediction models.</i> 2024."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "frontier", "kick": "Lab 4 · week 7 · grounded in §2.4–2.6", "sm": true, "title": "A miniature web-corpus pipeline", "lead": "Four corpora from the same crawl segment, one fixed token budget, one ablation table.", "b": ["<b>Dataset.</b> One <span class='k'>Common Crawl</span> WARC segment, a few gigabytes, restricted to Thai and English. Small enough to run on a workstation, large enough that the filters bite.", "<b>The comparison.</b> Four corpora built from the same segment, cumulatively: raw main-content extraction; plus Gopher-style heuristic rules; plus MinHash near-deduplication; plus a fastText quality classifier. Then a small causal LM trained to an <b>identical token budget</b> on each, evaluated on held-out perplexity and one small multiple-choice benchmark.", "<b>Deliverable.</b> The ablation table at fixed tokens, the per-stage yield curve (documents in, documents out, and what each stage cost), and a <b>200-document manual read</b> of what each filter removed.", "<b>Marked on.</b> Honest baselines and documented decisions.", "<b>Time.</b> 3 h supervised + about 8 h own, plus one overnight training run.", "<b>Grounded in &sect;2.4–2.6</b> — filters are not commutative, and ablation on a fixed downstream benchmark is the only reliable way to order them."], "callout": {"h": "The failure mode to plan for", "p": "The aggressively filtered corpus scores <em>worse</em>, and the group concludes that filtering does not work. It does — they compared at fixed <b>documents</b>, so the filtered arm trained on a third of the tokens. Fix the token budget, not the document count; it is also one of the commonest confounds in the published corpus literature."}, "notes": "The 200-document manual read is non-negotiable and takes an afternoon. Nobody has ever come back from it without a surprise. Ask specifically what the Thai-language documents looked like after the English-tuned heuristics ran.", "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "frontier", "kick": "Lab 5 · week 6 · grounded in §2.3", "sm": true, "title": "Tokenizer study: Thai against English, and who pays", "lead": "Fertility, sequence cost and inference price, measured on your own vocabularies rather than quoted from a paper.", "b": ["<b>Dataset.</b> Thai and English Wikipedia dumps, with a matched subset of parallel article pairs so “the same content” means something.", "<b>The comparison.</b> SentencePiece unigram and BPE vocabularies at 16k / 32k / 64k / 128k, trained Thai-only, English-only and 50/50. Measure <b>fertility</b> (tokens per word for English, tokens per character for Thai, which has no whitespace word boundaries), sequence length for matched content, and cost per thousand words at a stated per-token price.", "<b>Deliverable.</b> The fertility table, the cost table, and one paragraph on who pays the difference and what it does to context-window budgets for Thai users.", "<b>Marked on.</b> Documented decisions and reported failure modes.", "<b>Time.</b> 3 h supervised + about 5 h own.", "<b>Grounded in &sect;2.3</b> — Petrov et al.<sup class=\"fn\">1</sup> (2023) report tokenisation-length disparities up to fifteen-fold across languages; Ahia et al.<sup class=\"fn\">2</sup> (2023) show API cost varying by an order of magnitude for equivalent content."], "callout": {"h": "The failure mode to plan for", "p": "They compute Thai fertility as tokens-per-<em>word</em> using a word segmenter — and end up measuring the segmenter's error rate rather than the tokeniser. <b>In an unsegmented script the measurement instrument is itself a model.</b> Say which one, report tokens per character alongside, and the whole comparison becomes honest."}, "notes": "This lab lands hard with a Thai cohort because the cost is theirs. Push it one step further in discussion: the same fertility gap shows up in training-data budgets, not just in API bills, which is one route into the thesis topic on multilingually fair tokenisers.", "cites": ["Petrov et al. <i>Language Model Tokenizers Introduce Unfairness Between Languages.</i> NeurIPS, 2023.", "Ahia et al. <i>Do All Languages Cost the Same? Tokenization in the Era of Commercial Language Models.</i> EMNLP, 2023."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "frontier", "kick": "Lab 6 · week 8 · grounded in §2.10", "sm": true, "title": "Chunking for RAG: a stage metric is not a system metric", "lead": "Five chunking strategies, two levels of evaluation, and a cost column that most published comparisons omit.", "b": ["<b>Dataset.</b> A 300-document domain corpus the group assembles — Thai clinical practice guidelines as PDFs alongside their English equivalents — plus 50 student-written questions, each carrying the gold source span it should be answered from.", "<b>The comparison.</b> Fixed-size, recursive, semantic, late chunking, and contextual retrieval. Two metrics per arm: retrieval recall@k and nDCG at the chunk level, then end-to-end answer quality with a fixed generator and a fixed prompt.", "<b>Deliverable.</b> The two-level results table, the preprocessing cost per arm in seconds and in tokens, and a recommendation that states the cost it is asking the institution to pay.", "<b>Marked on.</b> Honest baselines and documented decisions.", "<b>Time.</b> 3 h supervised + about 7 h own.", "<b>Grounded in &sect;2.10</b> — Qu<sup class=\"fn\">1</sup>, Tu &amp; Bao (Findings of NAACL 2025) find semantic chunking's extra cost is not consistently justified; Günther et al.<sup class=\"fn\">2</sup> (2024) propose late chunking; Anthropic<sup class=\"fn\">3</sup>'s contextual-retrieval improvements are self-reported and should be labelled as such."], "callout": {"h": "The failure mode to plan for", "p": "Retrieval recall goes <em>up</em> while answer quality goes <em>down</em>, because larger chunks retrieve more and dilute the context window. A group that measured only recall would have shipped the wrong pipeline. <b>Optimising a stage metric is not optimising the system</b> — and this is the cheapest demonstration of it in the whole module."}, "notes": "Building the 50-question set with gold spans is half the work and all of the value; do not let them skip it and use an LLM-generated question set, which will be answerable from any chunking. The fixed generator and fixed prompt matter — otherwise they are ablating three things at once.", "cites": ["Qu et al. <i>Is Semantic Chunking Worth the Computational Cost?.</i> Findings of NAACL, 2025.", "Günther et al. <i>Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models. Jina AI.</i> 2024.", "Anthropic. <i>Introducing Contextual Retrieval. September.</i> 2024."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "frontier", "kick": "Lab 7 · week 8 · grounded in §2.9", "sm": true, "title": "Instruction-data selection, judged against random", "lead": "The lab where the honest baseline usually wins, and where that counts as a good result.", "b": ["<b>Dataset.</b> <span class='k'>Alpaca</span>, 52,002 self-instruct pairs — small enough to fine-tune repeatedly, well enough studied that the students can compare their numbers to a literature.", "<b>The comparison.</b> Select roughly 10% (about 5,200 pairs) three ways: instruction-following difficulty scoring, an LLM judge on an explicit rubric, and <b>uniform random</b>. Fine-tune the same small base model with identical hyper-parameters and seeds on each, plus a full-data arm.", "<b>Deliverable.</b> A win-rate table with <b>the random baseline plotted across at least three budgets, with error bars</b>, and an explicit confound check regressing win rate on mean response length.", "<b>Marked on.</b> Honest baselines (gate) and reported failure modes.", "<b>Time.</b> 3 h supervised + about 8 h own, plus GPU queue time.", "<b>Grounded in &sect;2.9</b> — AlpaGasus keeps 9k of Alpaca's 52k; the map's &sect;2.9.8 names response length as the hidden proxy for quality that many selection results are really measuring."], "callout": {"h": "The failure mode to plan for", "p": "The selected slice wins, and the entire win is explained by the selected responses being longer. Regress before you celebrate. Roughly half the groups find their method's advantage vanishes under the length control — <b>mark that as a success</b>, loudly, or you will teach them to hide it next time."}, "notes": "This is the lab that most changes how students read selection papers. Make the point that a single budget is a cherry-pick: methods often win at 10% and lose at 50%, and papers tend to plot only the budget where they win.", "cites": ["Chen et al. <i>AlpaGasus: Training a Better Alpaca with Fewer Data.</i> ICLR, 2024."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "both", "kick": "Lab 8 · week 10 · grounded in §3.5–3.6", "sm": true, "title": "Augmentation ablation at a fixed budget", "lead": "A short lab whose real subject is the phrase “fixed budget”.", "b": ["<b>Dataset.</b> CIFAR-10 at 10% of the training set, so a run finishes in minutes and three seeds are affordable. Plus one small medical image set for the invariance argument.", "<b>The comparison.</b> No augmentation / flips and crops / RandAugment / TrivialAugment, at an identical number of optimiser steps, identical schedule, three seeds each. Report mean ± standard deviation, never a single run.", "<b>Deliverable.</b> The mean ± sd table, the training curves, and a written <b>invariance argument</b> for the medical set: which transforms are legal for this task and why a vertical flip of a chest radiograph is not.", "<b>Marked on.</b> Honest baselines and mechanism-aware handling.", "<b>Time.</b> 3 h supervised + about 4 h own.", "<b>Grounded in &sect;3.5–3.6</b> — TrivialAugment (Müller &amp; Hutter<sup class=\"fn\">2</sup>, ICCV 2021) is parameter-free and still matches tuned policies, which makes it a lesson about baselines at least as much as about augmentation."], "callout": {"h": "The failure mode to plan for", "p": "The augmented arms win, and they win because the un-augmented baseline overfits and was never early-stopped. <b>“Fixed budget” has to be defined before the first run</b> — optimiser steps, epochs, or wall-clock — and each definition produces a different winner. Make them write the definition into the brief and defend it."}, "notes": "Three seeds is the minimum and the point of the lab. A one-seed table is where most student augmentation results come from, and the standard deviation is usually larger than the effect they are reporting.", "cites": ["Cubuk et al. <i>RandAugment: Practical automated data augmentation with a reduced search space.</i> NeurIPS, 2020.", "Müller & Hutter. <i>TrivialAugment: Tuning-free Yet State-of-the-Art Data Augmentation.</i> ICCV, 2021."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "frontier", "kick": "Lab 9 · week 11 · grounded in §3.2, §3.3, §3.10", "sm": true, "title": "nnU-Net fingerprint, then a normalisation ablation", "lead": "Read a preprocessing plan that was derived from rules, then break one rule at a time and measure the damage.", "b": ["<b>Dataset.</b> A small <span class='k'>Medical Segmentation Decathlon</span> task — the hippocampus task is the usual choice because it trains in hours rather than days.", "<b>The comparison.</b> Run the automatic configuration unchanged as the reference. Then change <em>one</em> preprocessing decision at a time: swap the per-case z-score for a global one, skip resampling to the target voxel spacing, and drop the foreground cropping. Architecture, schedule and folds held fixed.", "<b>Deliverable.</b> The dataset fingerprint printed and annotated by hand (what each field is, and where in the data it came from), the Dice table per variant, and a paragraph on which of these changes would count as a device change under a regulator.", "<b>Marked on.</b> Mechanism-aware handling and documented decisions.", "<b>Time.</b> 3 h supervised + about 6 h own, plus overnight GPU.", "<b>Grounded in &sect;3.2, &sect;3.3 and &sect;3.10</b> — Isensee et al.<sup class=\"fn\">1</sup> (<i>Nature Methods</i>, 2021) is the canonical example of preprocessing configured from a fingerprint rather than from intuition."], "callout": {"h": "The failure mode to plan for", "p": "They break the normalisation, Dice on the validation fold barely moves, and they conclude that normalisation does not matter. It moves on a <em>held-out site</em>. <b>Preprocessing robustness is a transfer property</b>, and a single-site validation fold cannot see it. If no second site is available, simulate one with a systematic intensity shift — and say in the report that you simulated it."}, "notes": "The hand-annotated fingerprint is the deliverable that teaches the most and takes the least compute. The regulator paragraph connects straight back to §0.7: a locked, versioned preprocessing chain is not an academic nicety for a medical product.", "cites": ["Isensee et al. <i>nnU-Net: a self-configuring method for deep learning-based biomedical image segmentation.</i> Nature Methods, 2021."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "frontier", "kick": "Lab 10 · week 4 · grounded in §0.4", "sm": true, "title": "Label-error hunt: did the ranking change?", "lead": "The one lab where the deliverable is a question, and where “no” is a perfectly good answer.", "b": ["<b>Dataset.</b> The CIFAR-10 test set as the calibration exercise — it is one of the sets Northcutt et al.<sup class=\"fn\">3</sup> audited, so the students can check themselves — and then the group's own dataset, where it matters.", "<b>The comparison.</b> Confident learning flags ranked by Prune-By-Noise-Rate. The top 200 adjudicated by hand by two students independently, disagreements escalated to a third. Then three models re-benchmarked on the original and the corrected labels.", "<b>Deliverable.</b> The adjudication log with an agreement statistic, the corrected label file, and the answer to exactly one question: <b>did the model ranking change?</b>", "<b>Marked on.</b> Mechanism-aware handling and reported failure modes.", "<b>Time.</b> 3 h supervised + about 6 h own, of which at least 3 h is adjudication and cannot be shortened.", "<b>Grounded in &sect;0.4</b> — Northcutt, Athalye &amp; Mueller estimate an average of roughly 3.4% label error across ten canonical test sets, including about 6% of the ImageNet validation set."], "callout": {"h": "The failure mode to plan for", "p": "Most flagged items turn out to be genuinely <em>ambiguous</em> rather than wrong, and the ranking does not change. Both are results. “We found 41 real errors in 200 flags and the model ordering was unchanged” is a better piece of work than a manufactured reversal — and saying so in week 4 is how you stop students from p-hacking their capstones in week 11."}, "notes": "Run it in week 4, one week after the label-quality lecture, so the confident-learning material is fresh but the adjudication hours are not competing with the missing-data lab. The agreement statistic between the two adjudicators is the sleeper fin
