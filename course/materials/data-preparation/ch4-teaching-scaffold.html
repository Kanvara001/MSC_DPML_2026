ding: it is often lower than they expect.", "cites": ["Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Northcutt et al. <i>Confident Learning: Estimating Uncertainty in Dataset Labels.</i> JAIR 70, 2021."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "bullets", "cls": "lab", "tag": "both", "kick": "Lab 11 · week 12 · grounded in §0.8", "sm": true, "title": "Documentation sprint, tested by a stranger", "lead": "Documentation is not marked by reading it. It is marked by watching somebody else try to use it.", "b": ["<b>Dataset.</b> One the group actually owns — a thesis dataset, a laboratory archive, or their own capstone release. Not a public benchmark; the point is the tacit knowledge they do not know they have.", "<b>The exercise.</b> Not a comparison but an exchange. Each group writes a <b>datasheet</b> (Gebru et al.<sup class=\"fn\">1</sup>) and a valid <b>Croissant</b> record, hands the bundle to another group with no verbal explanation, and that group attempts a stated task from the documentation alone, in 90 minutes, in the same room but not talking.", "<b>Deliverable.</b> The receiving group's written list of everything missing, ambiguous or wrong — and then the corrected bundle, resubmitted.", "<b>Marked on.</b> Documented decisions and reported failure modes. <em>The receiving group's list is part of the author group's mark.</em>", "<b>Time.</b> 3 h supervised, both halves in the same session, + about 4 h own.", "<b>Grounded in &sect;0.8</b> — NeurIPS now requires a Croissant record for dataset-track submissions, so this is a submission skill rather than a classroom courtesy."], "callout": {"h": "The failure mode to plan for", "p": "The receiving group cannot load the files at all, because the datasheet describes the <em>intended</em> release rather than the bytes on disk: a column renamed late, a folder reorganised, an encoding nobody wrote down. It is faintly humiliating and it works. Nobody who has sat through it writes a fictional datasheet again."}, "notes": "The silence rule matters — no talking across groups for the full 90 minutes. Schedule the corrected resubmission for the following week so the fix is real rather than promised. This lab is the single best predictor of who will produce a usable capstone release.", "cites": ["Gebru et al. <i>Datasheets for Datasets.</i> CACM 64(12), 2021."], "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "refs", "title": "Section 4.1 — references and lab reading", "kick": "Reading", "sm": true, "refs": ["<b>Kapoor &amp; Narayanan. Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</b> <i>Patterns</i> 4(9), 2023 (arXiv:2207.07048). <i>Lab 1; the model info sheet template.</i>", "Little &amp; Rubin. <b>Statistical Analysis with Missing Data</b>, 3rd ed., 2019; van Buuren &amp; Groothuis-Oudshoorn, <b>MICE</b>, <i>JSS</i> 2011; Stekhoven &amp; Bühlmann, <b>MissForest</b>, <i>Bioinformatics</i> 2012. <i>Lab 2.</i>", "van den Goorbergh et al. (2022) and Carriero et al. (2024) on imbalance corrections damaging calibration; Chawla et al., <b>SMOTE</b>, <i>JAIR</i> 2002. <i>Lab 3.</i>", "Penedo et al. <b>RefinedWeb</b>, <i>NeurIPS</i> 2023; <b>FineWeb and FineWeb-Edu</b>, <i>NeurIPS</i> 2024 (arXiv:2406.17557); Lee et al., <i>ACL</i> 2022 (arXiv:2107.06499) on deduplication. <i>Lab 4.</i>", "Kudo &amp; Richardson, <b>SentencePiece</b>, <i>EMNLP</i> 2018; Petrov et al., <b>Language Model Tokenizers Introduce Unfairness Between Languages</b>, <i>NeurIPS</i> 2023 (arXiv:2305.15425); Ahia et al., <b>Do All Languages Cost the Same?</b>, <i>EMNLP</i> 2023. <i>Lab 5.</i>", "Günther et al., <b>Late Chunking</b>, 2024 (arXiv:2409.04701); Qu, Tu &amp; Bao, <b>Is Semantic Chunking Worth the Computational Cost?</b>, Findings of <i>NAACL</i> 2025 (arXiv:2410.13070); Anthropic, <b>Contextual Retrieval</b>, 2024. <i>Lab 6.</i>", "Taori et al., <b>Alpaca</b>, Stanford 2023 (release, not a paper); Chen et al., <b>AlpaGasus</b>, <i>ICLR</i> 2024; Li et al., <b>IFD / Cherry LLM</b>, <i>NAACL</i> 2024; Xia et al., <b>LESS</b>, <i>ICML</i> 2024. <i>Lab 7.</i>", "Cubuk et al., <b>RandAugment</b>, <i>NeurIPS</i> 2020; Müller &amp; Hutter, <b>TrivialAugment</b>, <i>ICCV</i> 2021; Shorten &amp; Khoshgoftaar, <i>J. Big Data</i> 2019. <i>Lab 8.</i>", "Isensee, Jaeger, Kohl, Petersen &amp; Maier-Hein. <b>nnU-Net.</b> <i>Nature Methods</i>, 2021. <i>Lab 9.</i>", "Northcutt, Jiang &amp; Chuang, <b>Confident Learning</b>, <i>JAIR</i> 70, 2021; Northcutt, Athalye &amp; Mueller, <b>Pervasive Label Errors in Test Sets</b>, <i>NeurIPS D&amp;B</i> 2021; tooling: cleanlab. <i>Lab 10.</i>", "Gebru et al., <b>Datasheets for Datasets</b>, <i>CACM</i> 64(12), 2021; MLCommons, <b>Croissant</b>, <i>NeurIPS D&amp;B</i> 2024. <i>Lab 11.</i>"], "notes": "One reading per lab, issued with the brief rather than in a week-one bundle nobody opens. Entry 1 is the only compulsory one for the whole cohort — everything else is read by the group running that lab and reported back. Keep the “Lab n” tags: students use them to work out what they can skip, and that is a legitimate use.", "sec": "4.1", "secTitle": "Laboratory sequence"}, {"kind": "divider", "sec": "4.2", "secTitle": "Seminar and critique track", "no": "4.2", "title": "Seminar and critique track", "lead": "Five formats, run across the term. The labs build the skill; the seminars build the judgement that decides when to use it.", "chips": ["Paper clinic", "Debate", "Reproduction", "Ethics from primary text", "Annotated bibliography"], "notes": "The seminars are the cheapest part of the module to run and the part students remember longest. Five formats, six slots across twelve weeks — the annotated bibliography opens in week 1 and is presented in week 11. Each format has a chairing note on its slide; those notes are the whole difficulty, because every one of these sessions has a characteristic way of going flat."}, {"kind": "bullets", "tag": "frontier", "kick": "4.2.1 · week 2 · grounded in §0.3", "title": "Paper clinic: find the leakage", "lead": "Each student takes one published applied-ML paper from their own field — ideally one they already cite.", "b": ["<b>Preparation.</b> Fill in a <b>model info sheet</b> on the authors' behalf: one row per leakage type, each marked <span class='k'>clean</span>, <span class='k'>leaky</span> or <span class='k'>cannot tell from the text</span>.", "<b>In the room.</b> Eight minutes each: the claim, the row that fails, the exact sentence that reveals it, and an estimate of what the honest number would probably be.", "<b>The rule.</b> Be specific and be fair. Name the leakage type, quote the sentence. “Cannot tell from the text” is the most common verdict and the most useful one — and it is a statement about the reporting, not an accusation.", "<b>Why week 2.</b> Before anyone has a result of their own to defend. It is far easier to be rigorous about somebody else's work first, and the habit transfers.", "<b>Marked on.</b> Leakage control and documented decisions.", "<b>Chairing note.</b> Require one paper per term to be <em>defended</em> rather than attacked. Otherwise the room learns that critique is a performance."], "callout": {"h": "What actually happens", "p": "About a third of the room will find that the paper they chose — often one central to their own thesis — cannot be assessed at all from its text. That discovery does more for their own reporting standards than any lecture on reproducibility."}, "notes": "Print the eight-type taxonomy table from Chapter 0 §0.3 and hand it out at the door. Set a firm eight-minute limit; the discipline of the format is half its value. Collect the completed info sheets — they are the marked artefact.", "sec": "4.2", "secTitle": "Seminar and critique track"}, {"kind": "bullets", "tag": "frontier", "kick": "4.2.2 · week 7 · grounded in §0.1, §2.5", "title": "Debate: data-centric versus model-centric", "lead": "Two teams, positions assigned by coin toss, so nobody gets to argue their prior.", "b": ["<b>The evidence base, given in advance.</b> DataComp (Gadre et al.<sup class=\"fn\">3</sup>, <i>NeurIPS</i> 2023), where the model is fixed and <em>the dataset is the submission</em>; the DCLM comparisons; and the FineWeb-Edu ablations.", "<b>The move that makes it work.</b> Each team must state, before the debate, <b>what evidence would change their mind</b>. It is read out at the start and returned to at the end.", "<b>The complication to force into the room.</b> The strongest data-centric evidence comes from the dataset authors' own ablations. That is not misconduct — it is a structural fact about who can afford to run a controlled comparison at that scale — and it belongs in how the evidence is weighted.", "<b>The counter-evidence the model-centric side should find.</b> Reported cases where aggressive deduplication <em>reduced</em> downstream performance, and the fact that architecture choices still decide what preprocessing is even necessary.", "<b>Marked on.</b> Honest baselines and reported failure modes.", "<b>Time.</b> 90 minutes: 15 preparation, 2 × 12 opening, 20 cross, 20 floor, 10 to revisit the mind-changing evidence."], "callout": {"h": "The failure mode to plan for", "p": "It collapses into “both matter”, which is true and useless. Force the quantitative form of the question instead: <b>at a fixed compute budget, where does the next hour of work go?</b> Then make each side name the regime in which the other side wins. Nobody leaves with a slogan."}, "notes": "The coin toss is essential. Students with a strong prior produce much better arguments when made to argue against it, and the room stops treating the question as tribal. Keep the 'what would change my mind' cards; they are useful again in the capstone viva.", "cites": ["Penedo et al. <i>The FineWeb Datasets.</i> NeurIPS, 2024.", "Li et al. <i>DataComp-LM (DCLM).</i> 2024.", "Gadre et al. <i>DataComp: In search of the next generation of multimodal datasets.</i> NeurIPS Datasets & Benchmarks, 2023."], "sec": "4.2", "secTitle": "Seminar and critique track"}, {"kind": "bullets", "tag": "both", "kick": "4.2.3 · week 9 · grounded in §0.8, §3.3", "title": "Reproduction exercise: rebuild it from the text alone", "lead": "Pairs. Take a published paper with a preprocessing section and reconstruct the pipeline from the prose — no repository, no email to the authors.", "b": ["<b>Deliverable.</b> A numbered list of every decision the paper left unspecified, with the value the pair chose and the range of values that would have been equally defensible. Underspecification, quantified.", "<b>Good targets.</b> Any clinical-imaging paper with a normalisation recipe; any corpus paper with a filter ordering. nnU-Net is the interesting counter-example, because it specifies the <em>rule</em> rather than the value — which is why it reproduces.", "<b>What it teaches.</b> Underspecification is usually invisible to the authors. They had a default in their head and did not know it was a choice. Students recognise themselves in that immediately.", "<b>The rule.</b> The repository is banned for the duration of the session. So is asking a language model to reconstruct the missing code.", "<b>Marked on.</b> Documented decisions and mechanism-aware handling.", "<b>Time.</b> 3 h in one session, plus 2 h of reading beforehand."], "callout": {"h": "The twenty minutes that make the seminar", "p": "At the end of the session, let them open the repository and count how many of their guesses were right. The scoreboard is usually humbling in both directions — and it converts an abstract complaint about reporting standards into a personal one."}, "notes": "Choose the papers yourself and make sure at least one has a public repository, or the reveal does not work. Ask each pair, at the end, what they will now put in their own methods section that they would not have put there this morning.", "sec": "4.2", "secTitle": "Seminar and critique track"}, {"kind": "bullets", "tag": "both", "kick": "4.2.4 · week 12 · grounded in §0.7", "title": "Ethics case study, argued from the regulatory text", "lead": "A decision with no clean answer, argued from the primary instrument rather than from a summary of it.", "b": ["<b>Case A — a filter with a victim.</b> A toxicity classifier removes text in one dialect at roughly three times the base rate. Argue the decision under the EU AI Act's data-governance obligations for high-risk systems: examination for bias, representativeness, and <em>documented gaps</em>.", "<b>Case B — de-identification of free text.</b> Surrogate replacement against deletion in clinical notes: different residual re-identification risks, different downstream utility, different obligations under GDPR-style pseudonymisation rules and Thailand's PDPA.", "<b>Case C — a licence that is not what it says.</b> A widely used instruction corpus whose licence audit disagrees with its stated licence (Longpre et al.<sup class=\"fn\">1</sup>, 2024). What do you do with the model you already trained?", "<b>The discipline.</b> Nobody may cite a blog summary. The article, the recital, or the section number — or the point does not count. Everyone reads the actual text before the session.", "<b>Marked on.</b> Documented decisions and reported failure modes.", "<b>The output.</b> A one-page decision memo per group, written to a named audience: an IRB, a data-protection officer, or a hospital director."], "callout": {"h": "Chairing note", "p": "The discussion drifts into a values argument with no text in it within about ten minutes. Interrupt on a timer and ask the same question every time: <b>which sentence of which instrument are you relying on?</b> Students find this annoying for one session and useful for the rest of their careers."}, "notes": "For a Thai cohort, spend ten minutes on the PDPA-GDPR mapping; it is close enough for these purposes and the students will be governed by the former. Case C is the one that provokes real disagreement, because the honest answers all cost somebody something.", "cites": ["Longpre et al. <i>The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing and Attribution in AI.</i> 2024."], "sec": "4.2", "secTitle": "Seminar and critique track"}, {"kind": "bullets", "tag": "both", "kick": "4.2.5 · weeks 1–11 · grounded in §4.4", "title": "Annotated bibliography, built across the term", "lead": "Each student owns one section of the curriculum map for twelve weeks. This is where the reading actually happens.", "b": ["<b>The requirement.</b> Twelve to twenty entries, each with a two-sentence annotation answering three things: what it claims, what evidence supports the claim, and <b>where it would break</b>. Not an abstract.", "<b>Cadence.</b> Three entries a week for the first four weeks, then maintenance. A mid-term swap, so somebody else has to use your bibliography to prepare a lab — and tells you what was missing.", "<b>Presented in week 11</b>, ten minutes each: the three entries that changed your mind, and the one claim in your section that you now think is wrong.", "<b>Marked on.</b> Documented decisions and reported failure modes.", "<b>Cost to the lecturer.</b> Almost nothing. Cost to the student: real, spread thin, and the piece of coursework they most often say they kept.", "<b>Reuse.</b> The pooled bibliographies become next year's reading list, with the previous cohort credited by name."], "callout": {"h": "The failure mode to plan for", "p": "Annotations that paraphrase the abstract. The fix is entirely in the third clause — <em>where it would break</em> — because it cannot be copied from anywhere. Mark the first submission hard on that clause alone and the standard holds for the rest of the term."}, "notes": "Assign sections rather than letting students choose, and give the unglamorous ones (§0.8, §1.1, §3.1) to the strongest students — they produce the most useful bibliographies and those sections are the ones nobody reads otherwise.", "sec": "4.2", "secTitle": "Seminar and critique track"}, {"kind": "refs", "title": "Section 4.2 — references", "kick": "Reading", "sm": true, "refs": ["Kapoor &amp; Narayanan. <b>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</b> <i>Patterns</i>, 2023 — the model info sheet, for the paper clinic.", "Gadre et al. <b>DataComp: In search of the next generation of multimodal datasets.</b> <i>NeurIPS</i>, 2023 (arXiv:2304.14108) — the dataset is the submission.", "Li et al. <b>DataComp-LM (DCLM).</b> 2024 — controlled comparisons at fixed compute; model-based filtering and deduplication as the dominant levers.", "Penedo et al. <b>The FineWeb Datasets.</b> <i>NeurIPS</i>, 2024 (arXiv:2406.17557) — over seventy ablation models, and the authors' own caveat about who ran them.", "Isensee et al. <b>nnU-Net.</b> <i>Nature Methods</i>, 2021 — the reproduction exercise's counter-example: a paper that specifies rules rather than values.", "Longpre et al. <b>The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing and Attribution in AI.</b> 2024 — ethics case C.", "Elazar et al. <b>What's In My Big Data?</b> <i>ICLR</i>, 2024; Dodge et al., <b>Documenting Large Webtext Corpora</b>, <i>EMNLP</i> 2021 — what filters remove, and from whom.", "<b>EU AI Act</b> — data-governance obligations for high-risk systems; <b>GDPR</b> Art. 4(5) on pseudonymisation; <b>Thailand PDPA</b>. Read the instrument, not a summary.", "CommonPool privacy analysis, arXiv:2506.17185 (2025) — personally identifiable content surviving at web scale, for ethics case B."], "notes": "Entry 8 is the one to insist on: the instruments themselves, not commentary. Print the relevant articles and bring them to the ethics session on paper — it changes the register of the discussion more than you would expect. Entries 2 to 4 are the debate's evidence pack and should go out a full week ahead so both teams have read the same thing.", "sec": "4.2", "secTitle": "Seminar and critique track"}, {"kind": "divider", "sec": "4.3", "secTitle": "Assessment design", "no": "4.3", "title": "Assessment design", "lead": "Marks attached to artefacts that are true or false independently of how the number came out — and a rubric an external examiner can read in ninety seconds.", "chips": ["Artefact-based marking", "Preregistration", "The rubric", "Two hard gates", "The capstone brief", "Templates from real projects"], "notes": "This is the section that gets argued about at the programme board, so know which slide answers which objection: the weighting figure answers “is this rigorous enough?”, the rubric table answers “how is it moderated?”, and the preregistration timeline answers “what stops them fishing?”. Have the rubric printed before you present this."}, {"kind": "split", "title": "Grade the artefacts, not the headline metric", "kick": "4.3.1", "tag": "both", "wide": "text", "lead": "The metric is the least informative object in the submission. It is a property of the split design and the label quality at least as much as of the student's work.", "b": ["<b>Four artefacts carry the marks:</b> datasheet, pipeline code, ablation table, limitations section. Each is independently gradeable and independently hard to fabricate.", "<b>The lab portfolio uses the same rubric</b>, from week 2 onward.", "<b>It survives a strong cohort:</b> none of the four can be tuned into a good mark. There is no leaderboard to climb.", "<b>It survives a hard dataset:</b> a difficult institutional project can score a distinction with a mediocre model, provided the four artefacts are honest.", "<b>Weightings are a proposal, not a finding.</b> Move them; keep the shape.", "<b>The one thing not to move:</b> no mark anywhere in the scheme is the model's accuracy."], "fig": "f_assessstack", "figcap": "A worked weighting. The capstone's 45% is itself split across the four artefacts.", "callout": {"h": "The external examiner's question", "p": "“How do you distinguish a good result from good luck?” The answer must be structural: the marks attach to things checkable without rerunning anything, and two rows are gates."}, "notes": "If you present one slide from this section at a programme board, present this one. The objection you will get is that it is soft on technical achievement — the answer is the rubric on the next-but-one slide, which is harder on technical achievement than a metric threshold ever was.", "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "figure", "title": "Preregistration, and the moment the test set is unsealed", "kick": "4.3.2", "tag": "frontier", "lead": "Students commit to the split design, the metric and the stopping rule before they have seen the test set. One page, filed with a timestamp.", "fig": "f_prereg", "figcap": "<b>Adapted from clinical-trial and Registered-Report practice.</b> A signed commit in the course repository is as good as a registry entry; what matters is that the filing time is verifiable and earlier than the unsealing.", "notes": "The unsealing ritual sounds theatrical and is the most effective single intervention in the scheme. Doing it in front of a witness converts an abstract norm into a social one. Expect one group per cohort to ask for a second run — say yes, in writing, with the reason recorded, and require both numbers in the report.", "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "table", "title": "The rubric for data work", "kick": "4.3.3", "tag": "both", "sm": true, "lead": "Five criteria, four levels. Print it, hand it out in week 1, and mark every lab on two of its rows.", "table": {"head": ["Criterion", "0 · absent", "1 · asserted", "2 · justified", "3 · justified and tested"], "rows": [["Mechanism-aware handling", "A default applied silently — mean fill, drop rows, SMOTE", "The choice is named but not argued", "The mechanism is argued from the data <em>and</em> the collection process", "Two mechanisms compared, and the decision is shown to change the answer"], ["Leakage control &nbsp;<b>(gate)</b>", "No split design stated anywhere", "A split is named, but transforms are fitted outside the fold", "Grouping unit declared before the first experiment and enforced in code", "Naive and honest numbers both reported; model info sheet completed"], ["Documented decisions", "No record of what was removed or why", "Prose description only, no artefact", "Datasheet plus a versioned, pinned config", "A config hash traces to the reported number, and a colleague reproduced it"], ["Honest baselines &nbsp;<b>(gate)</b>", "No baseline at all", "One baseline, one budget, no variance reported", "Random baseline across at least three budgets", "Random with error bars, and the regions where the method <em>loses</em> are reported too"], ["Reported failure modes", "“Future work”", "Generic limitations paragraph", "Failure modes named, with the subgroup or slice affected", "Failure modes demonstrated on a held-out set built for the purpose"]]}, "callout": {"h": "How the five scores become one mark", "p": "Mean &ge; 1.5 passes. Mean &ge; 2.5 with nothing below 2 is a distinction. <b>A zero on either gate is a referral regardless of the mean</b> — because a leaky result is not eighty per cent of a clean one, it is a different claim about the world."}, "notes": "This is the most reusable slide in the deck and the one to print. It works unchanged for a thesis chapter, a journal review form and a lab report. The two gates are the part people argue about; the argument is worth having once, at the programme board, and then not again.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013."], "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "figure", "title": "The rubric as a ladder, and why two rows are gates", "kick": "4.3.3", "tag": "both", "lead": "The same five criteria, laid out so a student can see what the next level actually asks of them.", "fig": "f_rubric", "figcap": "Levels 2 and 3 are the difference between a decision that was <em>made</em> and a decision that was <em>tested</em>. Most submissions cluster at level 1 in week 2 and at level 2 by week 8; level 3 is where the capstone marks live.", "notes": "Show students the ladder rather than the table when you hand back marks — it turns feedback into a next action instead of a judgement. Ask each student to name the one cell they will move this month.", "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "cols", "title": "The capstone brief", "kick": "4.3.4", "tag": "both", "sm": true, "lead": "Take a raw institutional dataset to a documented, versioned, ML-ready release with a reproducible pipeline and a written risk assessment.", "cols": [{"sub": "The task", "h": "Raw institutional data to an ML-ready release", "b": ["A dataset the institution already holds and currently cannot share", "You deliver a <b>versioned release</b>, a reproducible pipeline and a written risk assessment", "One model is trained, and only to demonstrate that the release is usable", "Twelve weeks, in parallel with the labs, not after them"]}, {"sub": "The bundle", "h": "Six files, no more", "b": ["<span class='k'>datasheet.md</span> and <span class='k'>croissant.json</span>", "<span class='k'>pipeline/</span> — one entry point, pinned environment, no notebook state", "<span class='k'>prereg.md</span>, with its filing timestamp", "<span class='k'>ablations.csv</span>, including the random baseline", "<span class='k'>RISK.md</span> — named failure modes and named affected groups", "<span class='k'>CHANGELOG.md</span> — every amendment, dated"], "acc": true}, {"sub": "The constraints", "h": "Three things that are not negotiable", "b": ["The <b>grouping unit</b> is declared in week 4 and never changed", "The <b>test set is unsealed once</b>, in week 11, as filed", "Nothing is released without a licence and a provenance column", "A breach of any of the three is a referral, not a deduction"]}, {"sub": "The defence", "h": "Twenty minutes, two questions", "b": ["“Hand your release to the person beside you. Can they load it?”", "“Which of your decisions would change the answer?”", "The second question <em>is</em> the viva — a student who cannot name one has not run the ablations", "Marked on all five rubric rows"]}], "notes": "Sourcing the datasets is the lecturer's job and should start a term early: a hospital archive, a university registry export, a CCTV deployment with a consent regime, a Thai-language corpus. The students should never be the ones negotiating data access — that is a six-month job, not a twelve-week one.", "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "figure", "cls": "vilab", "kick": "From the VI Lab", "tag": "frontier", "title": "A capstone template drawn from a real project", "lead": "Our opisthorchiasis rapid-test platform happens to contain all five stages a capstone needs, documented, in one project.", "fig": "f_capstone", "figcap": "<b>Junsawang et al.<sup class=\"fn\">1</sup>, <i>Scientific Reports</i> 15:31062 (2025).</b> The numbers are the paper's: 8,624 expert-annotated images split 6,900 / 1,724, a further 574-image set to train the YOLOv5m capture-quality gate, and a 200-image set to evaluate the gate itself.", "notes": "Use this to make the capstone brief concrete rather than abstract. The stage students omit is always the quality gate: they assume the input will be usable. In a field deployment with a non-expert operator, refusing bad input is a larger source of accuracy than any classifier improvement.", "cites": ["Junsawang et al. <i>AI-enhanced rapid diagnostic testing platform for mass opisthorchiasis screening.</i> Scientific Reports 15:31062, 2025."], "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "cols", "cls": "vilab", "kick": "From the VI Lab", "tag": "frontier", "sm": true, "title": "What a good artefact looks like, with real numbers", "lead": "Four artefacts from our own published work, each of which would earn a level 3 on one rubric row — and each of which would be invisible in a results table.", "cols": [{"sub": "Annotation", "h": "8,624 expert-annotated images", "b": ["Split <b>6,900 / 1,724</b>, declared before anything else was done", "A further <b>574</b>-image set annotated purely to train the capture-quality gate", "And a <b>200</b>-image set to evaluate that gate on its own terms", "<b>The artefact is the protocol and the counts</b>, not the model that consumed them"]}, {"sub": "Two models, not one", "h": "A gate in front of the task", "b": ["The gate refuses an un-answerable image instead of guessing at it", "Each model carries its own dataset, its own metric and its own failure mode", "The gate's dataset would be entirely invisible in a headline results table", "<b>Budget annotation for the gate</b>, not only for the task"], "acc": true}, {"sub": "Reported per language", "h": "96.24% Thai vs 80.89% English", "b": ["The same three-class taxonomy, the same pipeline, two very different numbers", "A single averaged accuracy would have concealed the gap entirely", "<b>The artefact is the disaggregated table</b>", "Thippimanporn et al.<sup class=\"fn\">1</sup>, <i>PLOS ONE</i> 20(9):e0332484, 2025"]}, {"sub": "Evaluated with humans", "h": "Mean accuracy 0.50 → 0.74", "b": ["Eleven healthcare professionals, assisted versus unassisted (p &lt; 0.001)", "Radiologist workload reduced by <b>35%</b> at roughly one false negative per 455 images", "<b>The artefact is the study protocol</b>; a model card without it is incomplete", "Intharah et al.<sup class=\"fn\">2</sup>, BiTNet, <i>Artificial Intelligence in Medicine</i>, 2023"]}], "notes": "Be modest here — the point is not that these are exemplary papers, it is that each one contains a preparation artefact that took real work and does not appear in any leaderboard. That is the argument for marking artefacts. The 574-image gate dataset is the example students remember.", "cites": ["Thippimanporn et al. <i>Democratizing social media for health research: LLM-powered data analytics platform for NCDs.</i> PLOS ONE 20(9), 2025.", "Intharah et al. <i>BiTNet: Hybrid deep convolutional model for ultrasound image analysis of human biliary tract….</i> Artificial Intelligence in Medicine, 2023."], "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "refs", "title": "Section 4.3 — references", "kick": "Reading", "sm": true, "refs": ["Gebru, Morgenstern, Vecchione, Vaughan, Wallach, Daumé &amp; Crawford. <b>Datasheets for Datasets.</b> <i>CACM</i> 64(12), 2021.", "Pushkarna, Zaldivar &amp; Kjartansson. <b>Data Cards.</b> <i>ACM FAccT</i>, 2022; Mitchell et al., <b>Model Cards for Model Reporting</b>, <i>ACM FAT*</i>, 2019.", "MLCommons. <b>Croissant: a metadata format for ML-ready datasets.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2024 — required for the NeurIPS dataset track.", "Kapoor &amp; Narayanan. <b>Model info sheets</b>, in <i>Patterns</i>, 2023 — the required appendix for every submitted project.", "Seedat, Imrie &amp; van der Schaar. <b>DC-Check: A Data-Centric AI Checklist.</b> 2022 — a good first deliverable for a capstone proposal.", "Breck, Cai, Nielsen, Salib &amp; Sculley. <b>The ML Test Score.</b> <i>IEEE Big Data</i>, 2017 — where the “pipeline code” marks come from.", "Reporting standards worth marking against: <b>CLAIM</b>, <b>TRIPOD+AI</b> and <b>STARD-AI</b> for anything clinical.", "<b>Intharah, Wiratchawa, Wanna, Junsawang, Techasen, Worasith, Sithithaworn &amp; Khuntikeo. BiTNet: Hybrid deep convolutional model for ultrasound image analysis of human biliary tract and its applications.</b> <i>Artificial Intelligence in Medicine</i>, 2023.", "<b>Junsawang, Techasen, Wiratchawa, Wanna, Wongphutorn, Worasith, Sithithaworn, Bulathwela &amp; Intharah. AI-enhanced rapid diagnostic testing platform for mass opisthorchiasis screening.</b> <i>Scientific Reports</i> 15:31062, 2025. DOI 10.1038/s41598-025-16893-7.", "<b>Thippimanporn, Khamna, Wiratchawa &amp; Intharah. Democratizing social media for health research: LLM-powered data analytics platform for NCDs.</b> <i>PLOS ONE</i> 20(9):e0332484, 2025."], "notes": "Entries 1 to 4 are the documentation templates students actually fill in; hand them out as files, not as citations. Entry 7 matters for anyone whose capstone is clinical — a reporting checklist makes an excellent second marker. Entries 8 to 10 are ours, and are on the list because each one contains a preparation artefact the students can inspect, not because they are exemplary papers.", "sec": "4.3", "secTitle": "Assessment design"}, {"kind": "divider", "sec": "4.4", "secTitle": "Course-level references and living resources", "no": "4.4", "title": "Course-level references and living resources", "lead": "The shelf that does not move, the surveys that anchor each block, and the leaderboards you must re-check before you teach.", "chips": ["The shelf", "Four anchor surveys", "Thesis topics", "Living resources", "Maintenance cost"], "notes": "Two very different kinds of reference sit in this section, and it is worth naming the difference out loud: books that will still be right in ten years, and leaderboards that will be wrong in eighteen months. Students who cannot tell them apart cite the second kind as if it were the first."}, {"kind": "refs", "title": "The shelf, and the four anchor surveys", "kick": "4.4.1–4.4.3", "sm": true, "refs": ["<b>Hastie, Tibshirani &amp; Friedman. The Elements of Statistical Learning.</b> 2009 — the statistical frame, and ch. 7 for everything about honest error estimation.", "<b>Jurafsky &amp; Martin. Speech and Language Processing</b>, 3rd ed. draft — the NLP spine; Manning, Raghavan &amp; Schütze, <b>Introduction to Information Retrieval</b>, 2008, for the retrieval half of Chapter 2.", "<b>Goodfellow, Bengio &amp; Courville. Deep Learning.</b> — the deep-learning reference; Szeliski, <b>Computer Vision: Algorithms and Applications</b>, 2nd ed. 2022, and Gonzalez &amp; Woods for Chapter 3.", "<b>Harrell. Regression Modeling Strategies.</b> — clinical modelling, splines, and the case against dichotomising a continuous predictor.", "<b>Little &amp; Rubin. Statistical Analysis with Missing Data</b>, 3rd ed. 2019 — Chapter 1's missingness material rests on this.", "<b>Kleppmann. Designing Data-Intensive Applications.</b> O'Reilly, 2017 — storage, throughput and streaming, for §0.8.", "<b>Wickham. Tidy Data.</b> <i>Journal of Statistical Software</i>, 2014; Christen, <b>Data Matching</b>, Springer 2012; García, Luengo &amp; Herrera, <b>Data Preprocessing in Data Mining</b>, Springer 2015.", "<b>Zheng &amp; Casari. Feature Engineering for Machine Learning</b>, 2018; Kuhn &amp; Johnson, <b>Applied Predictive Modeling</b>, 2013; Géron, <b>Hands-On Machine Learning</b>, 3rd ed. 2022 — the practical layer students will actually open.", "<b>Anchor survey 1 — Zha et al. Data-centric Artificial Intelligence: A Survey.</b> <i>ACM Computing Surveys</i>, 2025 (arXiv:2303.10158). Sets the framing for Chapter 0.", "<b>Anchor survey 2 — the LLM-and-data survey (2025)</b> for Chapter 2's corpus-construction material.", "<b>Anchor survey 3 — Shorten &amp; Khoshgoftaar. A survey on image data augmentation.</b> <i>J. Big Data</i>, 2019, for Chapter 3.", "<b>Anchor survey 4 — Yu, Liu &amp; Wang. Dataset Distillation: A Comprehensive Review.</b> <i>IEEE TPAMI</i>, 2023, for the reduction material in §0.5 and §3.11."], "notes": "Do not assign the whole shelf. Entries 1 and 5 are the two students genuinely need to own; the rest are for looking things up, and saying so plainly saves the cohort a great deal of guilt. The four anchor surveys are read one per block, and they are also the right starting points for the annotated bibliographies in §4.2.", "sec": "4.4", "secTitle": "Course-level references and living resources"}, {"kind": "figure", "cls": "vilab", "kick": "From the VI Lab", "tag": "frontier", "title": "Open problems, and which ones we can supervise", "lead": "For students choosing a thesis topic in week 3, when the deadline for a proposal is week 6.", "fig": "f_thesismap", "figcap": "The shaded boxes are directions currently active in the Visual Intelligence Laboratory, with data and a supervisor attached. The unshaded ones are real problems that would need a collaborator to be feasible in a master's timescale.", "notes": "Say plainly which of these has data already in the building and which does not — that is the single most useful piece of information a master's student can get in week 3, and it is the one most often withheld. The CCTV and edge-deployment box is the one where the startup work and the teaching material genuinely coincide: training and serving preprocessing must match exactly, and almost nothing in the literature measures whether they do.", "sec": "4.4", "secTitle": "Course-level references and living resources"}, {"kind": "table", "title": "Living resources, and when to re-check them", "kick": "4.4.4", "tag": "frontier", "sm": true, "lead": "The parts of this course with a shelf life. Put a re-check into the week-zero preparation or the deck starts lying to students.", "table": {"head": ["Resource", "What it settles", "Re-check"], "rows": [["DataComp &amp; DCLM leaderboards", "Whether a curation claim survives a fixed model at a fixed compute budget", "Before §2.5 and §3.8, yearly"], ["TabArena, TALENT, TabRepo", "Whether a tabular preprocessing recipe still beats current baselines", "Before week 4"], ["MLCommons Croissant", "The format NeurIPS requires; spec and validator both move", "Before Lab 11"], ["cleanlab", "The reference implementation for Lab 10, plus its label-error catalogues", "Before week 4"], ["nnU-Net repository", "The fingerprint rules Lab 9 ablates; the config logic moves between releases", "Before week 11"], ["DataPerf; SELECT (arXiv:2410.05057)", "Benchmarks where the data, not the model, is the submission", "On any selection proposal"], ["FineWeb / FineWeb-Edu ablations", "What an honest, fully written-up corpus ablation looks like", "Yearly; hand out after Lab 4"]]}, "callout": {"h": "The maintenance cost of this deck, stated honestly", "p": "Sections 4.1 and 4.3 are stable: the labs and the rubric will outlive the tooling. Section 4.4 is not. Assume every leaderboard row and roughly half the library versions are stale after eighteen months, and budget one day of week-zero preparation to re-check them."}, "notes": "The FineWeb note matters: hand the ablation report out only after the students have produced their own, or they will reproduce its conclusions instead of testing them. Same principle as the repository ban in the reproduction seminar.", "cites": ["Mazumder et al. <i>DataPerf: Benchmarks for Data-Centric AI Development.</i> NeurIPS Datasets & Benchmarks, 2023.", "Erickson et al. <i>TabArena: A Living Benchmark for Machine Learning on Tabular Data.</i> 2025.", "Liu et al. <i>TALENT: A Tabular Analytics and Learning Toolbox.</i> JMLR, 2025.", "Penedo et al. <i>The FineWeb Datasets.</i> NeurIPS, 2024."], "sec": "4.4", "secTitle": "Course-level references and living resources"}, {"kind": "bullets", "sec": "4.5", "secTitle": "Closing", "title": "What to take from Chapter 4", "kick": "Key takeaways", "lead": "Eight sentences. If a co-teacher reads only this slide before running a session, the chapter has done its job.", "b": ["<b>Every lab produces an artefact somebody else can check.</b> A notebook that runs is not a deliverable.", "<b>Every lab is grounded in a section.</b> If you cannot write the <span class='k'>§x.y</span>, cut the lab — it is a tool demonstration.", "<b>Design the lab around the failure you expect.</b> The mistake is the teaching; the correct result is just the receipt.", "<b>The honest baseline is not optional.</b> Random across budgets with error bars, and the naive split number reported beside the honest one.", "<b>Preregister, then unseal once.</b> Amend openly and in writing; the silent amendment is the thing the whole mechanism exists to prevent.", "<b>Two rubric rows are gates, not weights.</b> A leaky result is not eighty per cent of a clean one — it is a different claim.", "<b>Grade four artefacts</b> — datasheet, pipeline, ablation table, limitations — and let no mark in the scheme be the model's accuracy.", "<b>The capstone shape is fixed:</b> raw source, quality gate, annotation protocol, grouped split, deployment constraint. Five stages, all documented, or it is not a capstone."], "callout": {"h": "The sentence to leave on the board", "p": "Design every assessment so that a student who got a disappointing number and understands exactly why outranks a student who got a good number and cannot say where it came from."}, "notes": "End here if you are out of time. The final slide is navigation only. If you have five more minutes, go back to the twelve-week grid and ask the room which week they would cut — the answers tell you what they think the course is about."}, {"kind": "cols", "title": "Where this chapter draws from", "kick": "Onward", "sm": true, "lead": "Chapter 4 has no content of its own. It is the scheduling, marking and supervision layer over the other three.", "cols": [{"sub": "Chapter 0", "h": "Cross-cutting foundations", "p": "Splitting and leakage, labels and label noise, reduction and valuation, documentation and governance.", "b": ["Grounds Labs 1, 4, 5, 7, 10 and 11, and both hard rubric gates", "Weeks 1, 2, 3, 5, 11 and 12"], "acc": true}, {"sub": "Chapter 1", "h": "Classical and tabular data", "p": "Missingness mechanisms, encoding, imbalance and calibration, tabular foundation models, longitudinal cohorts.", "b": ["Grounds Labs 1, 2 and 3", "Weeks 3–5"]}, {"sub": "Chapter 2", "h": "Text: NLP and LLM data", "p": "Thai and unsegmented scripts, subword tokenisation, web-corpus filtering, deduplication, instruction and RAG data.", "b": ["Grounds Labs 4, 5, 6 and 7, and the data-centric debate", "Weeks 6–8"]}, {"sub": "Chapter 3", "h": "Image and video data", "p": "DICOM and WSI handling, intensity and stain normalisation, augmentation, image-text curation, CCTV and medical imaging.", "b": ["Grounds Labs 8, 9 and 10, and the reproduction seminar", "Weeks 9–11"]}], "notes": "Use the Course index button in the toolbar to move between decks. If you are handing this module to a colleague, hand them this deck first and the other three second.", "sec": "4.5", "secTitle": "Closing"}]}</script>
<script>
(function(){
"use strict";
function boom(e){
  try{var b=document.getElementById("err");b.style.display="block";
    b.textContent="Something broke: "+((e&&e.message)||e)+"\n"+((e&&e.stack)||"");}catch(_){}
  if(window.console)console.error(e);
}
window.addEventListener("error",function(ev){boom(ev.error||ev.message);});

try{

var D      = JSON.parse(document.getElementById("deckdata").textContent);
var SLIDES = D.slides, FIGS = D.figs, META = D.meta, SECS = D.secs || [];
var KEY    = "dpslides-"+META.key+"-v1";
var EDITS  = {}, NOTES = {};
var cur = 0, editing = false, ovOn = false, notesOn = false;
var t0 = null, tAcc = 0;

/* ---------------- storage ---------------- */
var Store = {
  get:function(){
    try{ if(window.storage&&window.storage.get)
      return window.storage.get(KEY).then(function(r){return r&&r.value?r.value:null;}).catch(function(){return null;}); }catch(e){}
    try{ return Promise.resolve(window.localStorage.getItem(KEY)); }catch(e){ return Promise.resolve(null); }
  },
  set:function(v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(KEY,v).catch(function(){}); return; } }catch(e){}
    try{ window.localStorage.setItem(KEY,v); }catch(e){}
  }
};
var svT=null;
function save(){ clearTimeout(svT); svT=setTimeout(function(){
  try{ Store.set(JSON.stringify({v:1,edits:EDITS,notes:NOTES})); }catch(e){} },350); }

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function txt(h){var d=document.createElement("div");d.innerHTML=h==null?"":h;return (d.textContent||"").trim();}
function val(i,path,dflt){ var k=i+"."+path; return (k in EDITS)?EDITS[k]:dflt; }
function ed(i,path,html,cls,tag){
  tag=tag||"div";
  return "<"+tag+' class="ed '+(cls||"")+'" data-k="'+i+"."+path+'">'+(val(i,path,html)||"")+"</"+tag+">";
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1800);}

/* ---------------- slide rendering ---------------- */
function bullets(i,arr,key,cls){
  if(!arr||!arr.length)return "";
  var h='<ul class="bul '+(cls||"")+'">';
  for(var j=0;j<arr.length;j++){
    h+='<li class="ed" data-k="'+i+"."+key+"."+j+'">'+(val(i,key+"."+j,arr[j])||"")+"</li>";
  }
  return h+"</ul>";
}
function fig(s){
  if(!s.fig)return "";
  var svg=FIGS[s.fig]||'<svg viewBox="0 0 900 380"><rect width="900" height="380" fill="#F1F5F9"/><text x="450" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#8A97A6">figure: '+esc(s.fig)+"</text></svg>";
  return svg;
}
function figblock(i,s){
  if(!s.fig)return "";
  return '<div class="figwrap col"><div class="figbox">'+fig(s)+"</div>"+
    (s.figcap?'<div class="figcap ed" data-k="'+i+'.figcap">'+val(i,"figcap",s.figcap)+"</div>":"")+"</div>";
}
function head(i,s,small){
  var h="";
  if(s.kick)h+='<p class="kick"><span class="dot"></span><span class="ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick)+"</span></p>";
  if(s.title)h+=ed(i,"title",s.title,small?"sm":"","h2");
  if(s.lead)h+=ed(i,"lead",s.lead,"lead","p");
  return h;
}
function citesHTML(i,s){
  if(!s.cites||!s.cites.length)return "";
  var h='<div class="cites">';
  for(var j=0;j<s.cites.length;j++)
    h+='<span class="c"><b>'+(j+1)+'</b><span class="ed" data-k="'+i+".cites."+j+'">'+
       val(i,"cites."+j,s.cites[j])+"</span></span>";
  return h+"</div>";
}
function foot(i,s){
  var sec=s.sec?("&sect; "+s.sec+(s.secTitle?" &nbsp;"+s.secTitle:"")):META.title;
  return '<div class="foot"><span>'+esc(META.short)+"</span><span>"+sec+'</span><span class="sp"></span>'+
    (s.tag?'<span class="tag '+s.tag+'">'+s.tag+"</span>":"")+
    "<span>"+(i+1)+" / "+SLIDES.length+"</span></div>";
}
function colsHTML(i,s){
  var n=s.cols.length,h='<div class="cols n'+n+'">';
  for(var j=0;j<n;j++){
    var c=s.cols[j];
    h+='<div class="cbox'+(c.acc?" acc":"")+'">';
    if(c.sub)h+='<div class="sub ed" data-k="'+i+".cols."+j+'.sub">'+val(i,"cols."+j+".sub",c.sub)+"</div>";
    if(c.h)h+='<h4 class="ed" data-k="'+i+".cols."+j+'.h">'+val(i,"cols."+j+".h",c.h)+"</h4>";
    if(c.p)h+='<p class="ed" data-k="'+i+".cols."+j+'.p">'+val(i,"cols."+j+".p",c.p)+"</p>";
    if(c.b&&c.b.length){
      h+='<ul class="bul">';
      for(var m=0;m<c.b.length;m++)
        h+='<li class="ed" data-k="'+i+".cols."+j+".b."+m+'">'+val(i,"cols."+j+".b."+m,c.b[m])+"</li>";
      h+="</ul>";
    }
    h+="</div>";
  }
  return h+"</div>";
}
function tableHTML(i,s){
  var h='<table class="t"><thead><tr>';
  s.table.head.forEach(function(x){h+="<th>"+x+"</th>";});
  h+="</tr></thead><tbody>";
  s.table.rows.forEach(function(r,ri){
    h+="<tr>";
    r.forEach(function(c,ci){h+='<td class="ed" data-k="'+i+".table."+ri+"."+ci+'">'+val(i,"table."+ri+"."+ci,c)+"</td>";});
    h+="</tr>";
  });
  return h+"</tbody></table>";
}
function statHTML(i,s){
  var h='<div class="stat">';
  s.stats.forEach(function(x,j){
    h+='<div><div class="v ed" data-k="'+i+".stats."+j+'.v">'+val(i,"stats."+j+".v",x.v)+"</div>"+
       '<div class="l ed" data-k="'+i+".stats."+j+'.l">'+val(i,"stats."+j+".l",x.l)+"</div></div>";
  });
  return h+"</div>";
}
function refsHTML(i,s){
  var h='<ol class="refs'+(s.refs.length>7?" two":"")+'">';
  for(var j=0;j<s.refs.length;j++)
    h+='<li class="ed" data-k="'+i+".refs."+j+'">'+val(i,"refs."+j,s.refs[j])+"</li>";
  return h+"</ol>";
}
function calloutHTML(i,s){
  return '<div class="callout"><div class="h">'+esc(s.callout.h||"Teaching point")+"</div>"+
    '<p class="ed" data-k="'+i+'.callout.p">'+val(i,"callout.p",s.callout.p)+"</p></div>";
}

function slideHTML(i){
  var s=SLIDES[i],k=s.kind||"bullets",h="";
  var cls="slide "+k+(s.cls?" "+s.cls:"");

  if(k==="title"){
    h='<div class="pad">'+
      '<p class="no ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick||"")+"</p>"+
      ed(i,"title",s.title,"","h1")+
      (s.lead?ed(i,"lead",s.lead,"dek","p"):"")+
      (s.meta?'<div class="meta ed" data-k="'+i+'.meta">'+val(i,"meta",s.meta)+"</div>":"")+
      "</div>";
  }else if(k==="divider"){
    h='<div class="pad">'+
      '<div class="n">'+esc(s.no||"")+"</div>"+
      ed(i,"title",s.title,"","h2")+
      (s.lead?ed(i,"lead",s.lead,"lead","p"):"")+
      (s.chips&&s.chips.length?'<div class="chips">'+s.chips.map(function(c){return "<span>"+esc(c)+"</span>";}).join("")+"</div>":"")+
      "</div>";
  }else{
    var inner="";
    if(k==="figure"){
      inner='<div class="body v">'+figblock(i,s).replace('class="figwrap col"','class="figwrap"')+
            (s.callout?calloutHTML(i,s):"")+"</div>";
    }else if(k==="split"||k==="splitr"){
      var left='<div class="col '+(s.wide==="text"?"wide":"")+'">'+bullets(i,s.b,"b")+
        (s.callout?calloutHTML(i,s):"")+(s.stats?statHTML(i,s):"")+"</div>";
      var right=figblock(i,s);
      if(s.wide==="text")right=right.replace('class="figwrap col"','class="figwrap col narrow"');
      inner='<div class="body">'+(k==="splitr"?right+left:left+right)+"</div>";
    }else if(k==="cols"){
      inner=colsHTML(i,s)+(s.callout?calloutHTML(i,s):"");
    }else if(k==="refs"){
      inner='<div class="body v">'+refsHTML(i,s)+"</div>";
    }else if(k==="table"){
      inner='<div class="body v">'+tableHTML(i,s)+(s.callout?calloutHTML(i,s):"")+"</div>";
    }else{
      inner='<div class="body v">'+bullets(i,s.b,"b",s.b&&s.b.length>6?"tight":"")+
        (s.stats?statHTML(i,s):"")+(s.callout?calloutHTML(i,s):"")+"</div>";
    }
    h='<div class="pad" style="flex:1;display:flex;flex-direction:column;min-height:0">'+
      head(i,s,s.sm)+'<div class="rule"></div>'+inner+citesHTML(i,s)+"</div>"+foot(i,s);
  }
  return '<section class="'+cls+'" data-i="'+i+'">'+h+
    '<div class="pnotes">'+esc(NOTES[i]||s.notes||"")+"</div></section>";
}

/* ---------------- shrink-to-fit ---------------- */
function autofit(sl){
  try{
    if(!sl)return;
    var box=sl.querySelector(".body")||sl.querySelector(".cols");
    if(!box)return;
    var foot=sl.querySelector(".foot"),cit=sl.querySelector(".cites");
    sl.style.setProperty("--k","1");
    for(var i=0;i<9;i++){
      var lim=cit?cit.getBoundingClientRect().top
              :(foot?foot.getBoundingClientRect().top:sl.getBoundingClientRect().bottom);
      var over=(box.scrollHeight>box.clientHeight+1)||(box.getBoundingClientRect().bottom>lim+1);
      var kid=false;
      var cbs=sl.querySelectorAll(".cbox");
      for(var j=0;j<cbs.length;j++)if(cbs[j].scrollHeight>cbs[j].clientHeight+1){kid=true;break;}
      if(!over&&!kid)break;
      sl.style.setProperty("--k",(1-0.035*(i+1)).toFixed(3));
    }
  }catch(e){}
}

/* ---------------- layout / scale ---------------- */
function fit(){
  var st=document.querySelector(".stage"),ho=document.getElementById("holder");
  if(!st)return;
  var pad=26;
  var sc=Math.min((st.clientWidth-pad*2)/1280,(st.clientHeight-pad*2)/720);
  if(!isFinite(sc)||sc<=0)sc=.5;
  ho.style.transform="scale("+sc+")";
}
window.addEventListener("resize",fit);

/* ---------------- render current ---------------- */
function render(){
  var ho=document.getElementById("holder");
  ho.innerHTML=slideHTML(cur);
  applyEdit();
  autofit(ho.querySelector(".slide"));
  fit();
  var s=SLIDES[cur];
  document.getElementById("secNow").innerHTML=s.sec?("&sect; "+s.sec+" &nbsp;"+(s.secTitle||"")):"";
  document.getElementById("cnt").innerHTML="<b>"+(cur+1)+"</b> / "+SLIDES.length;
  var f=document.querySelector(".fill");
  if(f)f.style.width=((cur+1)/SLIDES.length*100)+"%";
  var nb=document.getElementById("noteBox");
  if(nb)nb.value=NOTES[cur]!=null?NOTES[cur]:(SLIDES[cur].notes||"");
  var nx=document.getElementById("nxt");
  if(nx)nx.textContent=cur+1<SLIDES.length?txt(val(cur+1,"title",SLIDES[cur+1].title||"—")):"End of deck";
  if(ovOn)markOv();
  if(location.hash!=="#"+(cur+1))history.replaceState(null,"","#"+(cur+1));
}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur){render();return;}
  cur=i;render();
}
function applyEdit(){
  var els=document.querySelectorAll("#holder .ed");
  for(var i=0;i<els.length;i++){
    if(editing)els[i].setAttribute("contenteditable","true");
    else els[i].removeAttribute("contenteditable");
  }
}

/* ---------------- overview ---------------- */
function buildOv(){
  var g=document.getElementById("ovgrid"),h="",lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    var sk=(s.sec||"")+"|"+(s.secTitle||"");
    if(sk!==lastSec){
      lastSec=sk;
      h+='<div class="ovsec">'+(s.sec?esc(s.sec)+" &nbsp; "+esc(s.secTitle||""):esc(META.short))+"</div>";
    }
    h+='<div class="ovc" data-go="'+i+'"><div class="shell" data-shell><div class="mini" data-mini>'+
      slideHTML(i)+'</div></div><div class="no">'+(i+1)+'</div><div class="lb">'+
      esc(txt(val(i,"title",s.title||""))||(s.kind==="divider"?"Section":"Slide"))+"</div></div>";
  }
  g.innerHTML=h;
  var ms=g.querySelectorAll(".mini .slide");
  for(var q=0;q<ms.length;q++)autofit(ms[q]);
  // scale minis
  var cards=g.querySelectorAll(".ovc");
  for(var j=0;j<cards.length;j++){
    var shell=cards[j].querySelector("[data-shell]"),mini=cards[j].querySelector("[data-mini]");
    var w=cards[j].clientWidth||232,sc=w/1280;
    mini.style.transform="scale("+sc+")";
    shell.style.height=(720*sc)+"px";
  }
  markOv();
}
function markOv(){
  var cards=document.querySelectorAll(".ovc");
  for(var i=0;i<cards.length;i++)cards[i].classList.toggle("cur",+cards[i].getAttribute("data-go")===cur);
  var c=document.querySelector(".ovc.cur");
  if(c)c.scrollIntoView({block:"nearest"});
}

/* ---------------- export ---------------- */
function toMarkdown(){
  var L=[];
  L.push("# "+META.title);
  L.push("");
  L.push("_"+META.short+" · "+SLIDES.length+" slides · exported from the editable HTML deck._");
  L.push("");
  var lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    if(s.sec&&s.sec!==lastSec){lastSec=s.sec;L.push("");L.push("## "+s.sec+" "+(s.secTitle||""));L.push("");}
    var t=txt(val(i,"title",s.title||""));
    L.push("### ["+(i+1)+"] "+(t||"(untitled)"));
    var ld=txt(val(i,"lead",s.lead||""));
    if(ld)L.push("");
    if(ld)L.push("_"+ld+"_");
    if(s.b&&s.b.length){L.push("");for(var j=0;j<s.b.length;j++)L.push("- "+txt(val(i,"b."+j,s.b[j])));}
    if(s.cols)s.cols.forEach(function(c,j){
      L.push("");L.push("**"+txt(val(i,"cols."+j+".h",c.h||""))+"**");
      var p=txt(val(i,"cols."+j+".p",c.p||""));if(p)L.push(p);
      (c.b||[]).forEach(function(x,m){L.push("- "+txt(val(i,"cols."+j+".b."+m,x)));});
    });
    if(s.table){L.push("");L.push("| "+s.table.head.join(" | ")+" |");
      L.push("|"+s.table.head.map(function(){return "---";}).join("|")+"|");
      s.table.rows.forEach(function(r,ri){L.push("| "+r.map(function(c,ci){
        return txt(val(i,"table."+ri+"."+ci,c));}).join(" | ")+" |");});}
    if(s.stats){L.push("");s.stats.forEach(function(x,j){
      L.push("- **"+txt(val(i,"stats."+j+".v",x.v))+"** — "+txt(val(i,"stats."+j+".l",x.l)));});}
    if(s.callout){L.push("");L.push("> **"+(s.callout.h||"Teaching point")+".** "+txt(val(i,"callout.p",s.callout.p)));}
    if(s.figcap){L.push("");L.push("_Figure: "+txt(val(i,"figcap",s.figcap))+"_");}
    if(s.refs){L.push("");s.refs.forEach(function(r,j){L.push((j+1)+". "+txt(val(i,"refs."+j,r)));});}
    if(s.cites&&s.cites.length){L.push("");
      L.push("_Sources: "+s.cites.map(function(c,j){
        return "["+(j+1)+"] "+txt(val(i,"cites."+j,c));}).join(" · ")+"_");}
    var nt=(NOTES[i]!=null?NOTES[i]:(s.notes||"")).trim();
    if(nt){L.push("");L.push("> **Speaker notes.** "+nt.replace(/\n/g," "));}
    L.push("");
  }
  return L.join("\n");
}
function openModal(title,text,name,mode){
  var m=document.getElementById("modal");
  document.getElementById("mTitle").textContent=title;
  var body=document.getElementById("mBody");
  if(mode==="help"){ body.innerHTML=HELP; }
  else{
    body.innerHTML='<textarea id="mText" spellcheck="false"></textarea>';
    var ta=document.getElementById("mText");ta.value=text;ta.setAttribute("data-name",name||"export.txt");
  }
  document.querySelector('[data-act="mcopy"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mdl"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mload"]').style.display=mode==="import"?"":"none";
  m.classList.add("on");
}
var HELP='<div class="help"><h4>Moving around</h4><table>'+
  '<tr><td><kbd>&rarr;</kbd> <kbd>&larr;</kbd> <kbd>Space</kbd></td><td>Next / previous slide</td></tr>'+
  '<tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>First / last slide</td></tr>'+
  '<tr><td><kbd>O</kbd></td><td>Overview grid of every slide, click one to jump</td></tr>'+
  '<tr><td><kbd>/</kbd></td><td>Search titles, bullets, references and your notes</td></tr>'+
  '<tr><td>number then <kbd>Enter</kbd></td><td>Jump to that slide</td></tr>'+
  '<tr><td><kbd>F</kbd></td><td>Fullscreen</td></tr></table>'+
  '<h4>Teaching and editing</h4><table>'+
  '<tr><td><kbd>E</kbd></td><td>Edit mode: click any heading, bullet, caption, table cell or reference and rewrite it</td></tr>'+
  '<tr><td><kbd>N</kbd></td><td>Speaker-notes panel, with the next slide title shown above it</td></tr>'+
  '<tr><td><kbd>T</kbd></td><td>Start / pause the lecture timer</td></tr>'+
  '<tr><td><kbd>P</kbd></td><td>Print or save as PDF, one slide per page with notes underneath</td></tr>'+
  '</table><h4>Keeping your work</h4><table>'+
  '<tr><td>Autosave</td><td>Edits and notes save to this browser automatically</td></tr>'+
  '<tr><td>Export</td><td>Markdown for handouts and lecture prep, JSON as a portable backup</td></tr>'+
  '<tr><td>Import</td><td>Paste a JSON backup to move your edits to another machine</td></tr>'+
  '</table></div>';

/* ---------------- search ---------------- */
function slideText(i){
  var s=SLIDES[i],parts=[txt(val(i,"title",s.title||"")),txt(val(i,"lead",s.lead||""))];
  (s.b||[]).forEach(function(x,j){parts.push(txt(val(i,"b."+j,x)));});
  (s.refs||[]).forEach(function(x,j){parts.push(txt(val(i,"refs."+j,x)));});
  (s.cols||[]).forEach(function(c,j){parts.push(txt(val(i,"cols."+j+".h",c.h||"")));
    parts.push(txt(val(i,"cols."+j+".p",c.p||"")));
    (c.b||[]).forEach(function(x,m){parts.push(txt(val(i,"cols."+j+".b."+m,x)));});});
  if(s.table)s.table.rows.forEach(function(r,ri){r.forEach(function(c,ci){
    parts.push(txt(val(i,"table."+ri+"."+ci,c)));});});
  if(s.figcap)parts.push(txt(val(i,"figcap",s.figcap)));
  (s.cites||[]).forEach(function(c,j){parts.push(txt(val(i,"cites."+j,c)));});
  if(s.callout)parts.push(txt(val(i,"callout.p",s.callout.p)));
  parts.push(NOTES[i]||s.notes||"");
  parts.push(s.sec||"",s.secTitle||"");
  return parts.join("  ");
}
function doSearch(q){
  var box=document.getElementById("sres");
  q=(q||"").trim();
  if(q.length<2){box.innerHTML="";return;}
  var lq=q.toLowerCase(),h="",n=0;
  for(var i=0;i<SLIDES.length&&n<40;i++){
    var t=slideText(i),p=t.toLowerCase().indexOf(lq);
    if(p<0)continue;
    n++;
    var a=Math.max(0,p-46),snip=esc(t.slice(a,p))+"<mark>"+esc(t.slice(p,p+q.length))+"</mark>"+esc(t.slice(p+q.length,p+q.length+80));
    h+='<button data-go="'+i+'"><span class="n">slide '+(i+1)+(SLIDES[i].sec?" &nbsp;&sect; "+esc(SLIDES[i].sec):"")+
       '</span><div class="t">'+esc(txt(val(i,"title",SLIDES[i].title||"")))+'</div><div class="n" style="margin-top:3px">'+
       (a>0?"…":"")+snip+"…</div></button>";
  }
  box.innerHTML=h||'<button style="cursor:default"><span class="n">no match</span></button>';
}

/* ---------------- timer ---------------- */
function tick(){
  var el=document.querySelector(".timer");if(!el)return;
  var ms=tAcc+(t0?(Date.now()-t0):0),s=Math.floor(ms/1000);
  el.textContent=(t0?"":"⏸ ")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
setInterval(tick,500);

/* ---------------- events ---------------- */
document.addEventListener("click",function(ev){
try{
  var t=ev.target;
  var g=t.closest?t.closest("[data-go]"):null;
  if(g){ go(+g.getAttribute("data-go"));
    if(ovOn)setOv(false);
    document.body.classList.remove("srch-on");
    return; }
  var b=t.closest?t.closest("[data-act]"):null;
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="next"){go(cur+1);return;}
  if(a==="prev"){go(cur-1);return;}
  if(a==="ov"){setOv(!ovOn);return;}
  if(a==="notes"){notesOn=!notesOn;document.body.classList.toggle("notes-on",notesOn);
    b.setAttribute("aria-pressed",String(notesOn));fit();return;}
  if(a==="edit"){editing=!editing;document.body.classList.toggle("edit",editing);
    b.setAttribute("aria-pressed",String(editing));applyEdit();
    toast(editing?"Edit mode on — click any text to rewrite it":"Edit mode off");return;}
  if(a==="search"){document.body.classList.toggle("srch-on");
    if(document.body.classList.contains("srch-on"))document.getElementById("q").focus();return;}
  if(a==="print"){printAll();return;}
  if(a==="help"){openModal("Keyboard and features","","","help");return;}
  if(a==="hub"){window.location.href=META.hub;return;}
  if(a==="export"){
    openModal("Export — Markdown",toMarkdown(),META.key+"-slides.md");
    document.getElementById("mSeg").innerHTML=
      '<button class="mbtn" data-act="expmd">Markdown</button>'+
      '<button class="mbtn" data-act="expjson">JSON backup</button>'+
      '<button class="mbtn" data-act="expimp">Import…</button>';
    return;}
  if(a==="expmd"){document.getElementById("mTitle").textContent="Export — Markdown";
    var t1=document.getElementById("mText");if(t1){t1.value=toMarkdown();t1.setAttribute("data-name",META.key+"-slides.md");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expjson"){document.getElementById("mTitle").textContent="Export — JSON backup";
    var t2=document.getElementById("mText");if(t2){t2.value=JSON.stringify({v:1,edits:EDITS,notes:NOTES},null,2);
      t2.setAttribute("data-name",META.key+"-backup.json");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expimp"){document.getElementById("mTitle").textContent="Import — paste a JSON backup, then Load";
    var t3=document.getElementById("mText");if(t3)t3.value="";
    document.querySelector('[data-act="mload"]').style.display="";return;}
  if(a==="mload"){
    try{ var o=JSON.parse(document.getElementById("mText").value);
      EDITS=o.edits||{};NOTES=o.notes||{};save();render();
      document.getElementById("modal").classList.remove("on");toast("Backup loaded");
    }catch(e){toast("That is not valid JSON");}
    return;}
  if(a==="mclose"){document.getElementById("modal").classList.remove("on");return;}
  if(a==="mcopy"){var ta=document.getElementById("mText");if(!ta)return;
    ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast("Copied");},function(){toast("Select and copy manually");});
    else toast(ok?"Copied to clipboard":"Select and copy manually");return;}
  if(a==="mdl"){var ta2=document.getElementById("mText");if(!ta2)return;
    var nm=ta2.getAttribute("data-name")||"export.txt";
    var bl=new Blob([ta2.value],{type:"text/plain;charset=utf-8"});
    var A=document.createElement("a");A.href=URL.createObjectURL(bl);A.download=nm;
    document.body.appendChild(A);A.click();A.remove();toast("Downloaded "+nm);return;}
}catch(e){boom(e);}
},false);

function setOv(on){
  ovOn=on;document.body.classList.toggle("ov-on",on);
  var b=document.querySelector('[data-act="ov"]');if(b)b.setAttribute("aria-pressed",String(on));
  if(on)buildOv();
}
function printAll(){
  var ho=document.getElementById("holder"),h="";
  for(var i=0;i<SLIDES.length;i++)h+=slideHTML(i);
  ho.innerHTML=h;ho.style.transform="none";
  var ps=ho.querySelectorAll(".slide");
  for(var q=0;q<ps.length;q++)autofit(ps[q]);
  document.body.classList.add("handout");
  window.print();
  setTimeout(function(){document.body.classList.remove("handout");render();},400);
}

/* progress bar click */
document.addEventListener("mousedown",function(ev){
  var tr=ev.target.closest?ev.target.closest(".track"):null;
  if(!tr)return;
  var r=tr.getBoundingClientRect();
  go(Math.round((ev.clientX-r.left)/r.width*(SLIDES.length-1)));
});

/* edits */
document.addEventListener("focusout",function(ev){
  try{
    var t=ev.target;
    if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
      var k=t.getAttribute("data-k");
      if(k){EDITS[k]=t.innerHTML.trim();save();}
    }
  }catch(e){boom(e);}
},true);
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="noteBox"){NOTES[cur]=t.value;save();return;}
  if(t.id==="q"){doSearch(t.value);return;}
});
document.addEventListener("paste",function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
    ev.preventDefault();
    var s=(ev.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,s);
  }
});

/* keys */
var numBuf="";
document.addEventListener("keydown",function(ev){
try{
  var tag=(ev.target.tagName||"").toLowerCase();
  var typing=ev.target.isContentEditable||tag==="input"||tag==="textarea";
  if(ev.key==="Escape"){
    document.getElementById("modal").classList.remove("on");
    document.body.classList.remove("srch-on");
    if(ovOn)setOv(false);
    if(ev.target.isContentEditable)ev.target.blur();
    return;
  }
  if(typing){
    if(ev.target.id==="q"&&ev.key==="Enter"){
      var f=document.querySelector("#sres [data-go]");
      if(f){go(+f.getAttribute("data-go"));document.body.classList.remove("srch-on");}
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==="ArrowRight"||ev.key==="PageDown"||ev.key===" "){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="ArrowDown"){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="Home"){ev.preventDefault();go(0);return;}
  if(ev.key==="End"){ev.preventDefault();go(SLIDES.length-1);return;}
  if(ev.key>="0"&&ev.key<="9"){numBuf+=ev.key;return;}
  if(ev.key==="Enter"&&numBuf){go(parseInt(numBuf,10)-1);numBuf="";return;}
  var k=ev.key.toLowerCase();
  numBuf="";
  if(k==="o"){setOv(!ovOn);return;}
  if(k==="n"){document.querySelector('[data-act="notes"]').click();return;}
  if(k==="e"){document.querySelector('[data-act="edit"]').click();return;}
  if(k==="p"){ev.preventDefault();printAll();return;}
  if(k==="/"||k==="?"){ev.preventDefault();
    if(ev.key==="?"){openModal("Keyboard and features","","","help");return;}
    document.body.classList.add("srch-on");document.getElementById("q").focus();return;}
  if(k==="t"){ if(t0){tAcc+=Date.now()-t0;t0=null;}else{t0=Date.now();} tick(); return;}
  if(k==="f"){ if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); return;}
}catch(e){boom(e);}
},false);

/* progress bar dom */
(function(){
  var p=document.createElement("div");p.className="prog";
  var ticks="";
  for(var i=0;i<SLIDES.length;i++){
    if(SLIDES[i].kind==="divider")ticks+='<i style="left:'+(i/(SLIDES.length-1)*100)+'%"></i>';
  }
  p.innerHTML='<span class="hint">&larr;/&rarr; move &nbsp;·&nbsp; O overview &nbsp;·&nbsp; E edit &nbsp;·&nbsp; N notes &nbsp;·&nbsp; T timer &nbsp;·&nbsp; ? help</span>'+
    '<div class="track"><div class="ticks">'+ticks+'</div><div class="fill"></div></div>'+
    '<span class="timer">⏸ 00:00</span>';
  document.body.appendChild(p);
})();

/* boot */
Store.get().then(function(raw){
  try{ if(raw){var o=JSON.parse(raw);EDITS=o.edits||{};NOTES=o.notes||{};} }catch(e){}
  var h=parseInt((location.hash||"").replace("#",""),10);
  if(h>0&&h<=SLIDES.length)cur=h-1;
  render();
  if(raw)toast("Your saved edits and notes are back");
}).catch(function(){render();});

}catch(e){boom(e);}
})();
</script>
</body>
</html>
