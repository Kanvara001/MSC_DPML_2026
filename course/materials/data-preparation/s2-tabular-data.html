<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Preparation, condensed — Session 2: Tabular and clinical table data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2D5C8A;
  --accent-soft:#EAF0F7;
  --accent-ink:#23486B;
  --paper:#EDF1F6;
  --card:#FFFFFF;
  --ink:#111823;
  --ink-2:#41505F;
  --ink-3:#78859A;
  --rule:#D3DCE6;
  --rule-2:#E7EDF3;
  --shell:#171E28;
  --shell-2:#212A36;
  --shell-3:#2E3946;
  --ok:#0F7A6A;
  --warn:#A3384F;
  --f-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-thai:"Noto Sans Thai","Archivo",sans-serif;
  --W:1280px; --H:720px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================ CHROME ============================ */
.bar{
  position:fixed;left:0;right:0;top:0;height:44px;z-index:40;
  background:var(--shell-2);border-bottom:1px solid #000;
  display:flex;align-items:center;gap:10px;padding:0 12px;color:#C6D1DD;
}
.bar .ch{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;flex:none;
}
.bar .tt{font-family:var(--f-ui);font-size:13px;font-weight:600;color:#EAF0F6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.bar .sec{font-family:var(--f-mono);font-size:10.5px;color:#7C8C9C;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.bar .grp{display:flex;gap:4px;align-items:center;flex:none}
.tb{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:6px 9px;
  border:1px solid var(--shell-3);border-radius:5px;color:#A9B7C5;background:transparent;white-space:nowrap;
}
.tb:hover{background:var(--shell-3);color:#fff}
.tb[aria-pressed="true"]{background:#E9EEF3;color:var(--shell);border-color:#E9EEF3;font-weight:600}
.tb.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.count{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;padding:0 4px;flex:none}
.count b{color:#fff}

/* ============================ STAGE ============================ */
.stage{
  position:fixed;inset:44px 0 30px 0;display:grid;place-items:center;overflow:hidden;
  background:var(--shell);
}
body.notes-on .stage{right:340px}
.holder{width:var(--W);height:var(--H);transform-origin:center center;position:relative}
.slide{
  width:var(--W);height:var(--H);background:var(--card);position:relative;overflow:hidden;
  box-shadow:0 12px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;
}

/* progress */
.prog{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:40;background:var(--shell-2);
  border-top:1px solid #000;display:flex;align-items:center;gap:10px;padding:0 12px}
.track{flex:1;height:6px;background:#0D131A;border-radius:3px;position:relative;overflow:hidden;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;transition:width .15s}
.ticks{position:absolute;inset:0}
.ticks i{position:absolute;top:0;bottom:0;width:1px;background:#33404E}
.prog .hint{font-family:var(--f-mono);font-size:9.5px;color:#5F6E7D;letter-spacing:.05em;white-space:nowrap}
.timer{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;min-width:52px;text-align:right}

/* ============================ SLIDE LAYOUTS ============================ */
.pad{padding:52px 64px 46px}
.slide{--k:1}
.slide .kick{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px;
}
.slide .kick .dot{width:22px;height:2px;background:var(--accent);display:inline-block}
.slide h2{
  font-family:var(--f-ui);font-size:calc(37px * var(--k));line-height:1.14;letter-spacing:-.022em;
  font-weight:650;margin:0 0 6px;color:var(--ink);
}
.slide h2.sm{font-size:calc(31px * var(--k))}
.slide .lead{
  font-size:calc(18.5px * var(--k));line-height:1.5;color:var(--ink-2);margin:calc(12px * var(--k)) 0 0;max-width:96ch;font-style:italic;
}
.slide .lead b{font-style:normal;color:var(--ink);font-weight:600}
.rule{height:2px;background:var(--accent);width:64px;margin:calc(16px * var(--k)) 0 calc(20px * var(--k));flex:none}

ul.bul{list-style:none;margin:0;padding:0}
ul.bul>li{
  position:relative;padding:0 0 0 24px;margin:0 0 calc(13px * var(--k));font-size:calc(17.5px * var(--k));line-height:1.48;color:var(--ink-2);
}
ul.bul>li:before{
  content:"";position:absolute;left:3px;top:11px;width:9px;height:2px;background:var(--accent);
}
ul.bul>li b,ul.bul>li strong{color:var(--ink);font-weight:600}
ul.bul>li em{font-style:italic;color:var(--ink)}
ul.bul.tight>li{margin-bottom:calc(9px * var(--k));font-size:calc(16.5px * var(--k))}
ul.bul.sm>li{font-size:calc(15.5px * var(--k));margin-bottom:calc(8px * var(--k));padding-left:20px}
ul.bul.sm>li:before{width:7px;top:10px}
.k{font-family:var(--f-mono);font-size:.86em;background:#EEF3F8;border:1px solid var(--rule-2);
  border-radius:3px;padding:1px 5px;color:var(--ink)}
.cite{font-family:var(--f-mono);font-size:.8em;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
.th{font-family:var(--f-thai)}

/* two column body */
.body{flex:1;min-height:0;display:flex;gap:34px}
.body.v{flex-direction:column;gap:16px}
.col{flex:1;min-width:0}
.col.narrow{flex:0 0 40%}
.col.wide{flex:0 0 58%}
.figwrap{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;flex:1 1 auto}
.figbox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.figbox svg{width:100%;height:100%;max-height:100%;display:block}
.figcap{
  font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.45;
  border-top:1px solid var(--rule-2);padding-top:8px;
}
.figcap b{color:var(--ink-2);font-weight:600}

/* columns layout */
.cols{display:grid;gap:18px;flex:1;min-height:0}
.cols.n2{grid-template-columns:1fr 1fr}
.cols.n3{grid-template-columns:1fr 1fr 1fr}
.cols.n4{grid-template-columns:repeat(4,1fr)}
.cbox{
  border:1px solid var(--rule);border-radius:9px;padding:calc(16px * var(--k)) 17px;background:#FBFDFE;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.cbox.acc{border-color:var(--accent);background:var(--accent-soft)}
.cbox h4{
  font-family:var(--f-ui);font-size:calc(15px * var(--k));font-weight:650;margin:0 0 4px;letter-spacing:-.01em;color:var(--ink);
}
.cbox .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 9px;font-weight:600}
.cbox p{margin:0 0 calc(8px * var(--k));font-size:calc(14.5px * var(--k));line-height:1.46;color:var(--ink-2)}
.cbox ul.bul>li{font-size:calc(14.5px * var(--k));margin-bottom:calc(7px * var(--k));padding-left:18px}
.cbox ul.bul>li:before{width:7px;top:9px}

/* title slide */
.slide.title{background:var(--shell);color:#E9EFF5;justify-content:center}
.slide.title .pad{padding:0 78px}
.slide.title .no{
  font-family:var(--f-mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 20px;
}
.slide.title h1{
  font-family:var(--f-ui);font-size:60px;line-height:1.06;letter-spacing:-.03em;font-weight:700;
  margin:0 0 20px;max-width:20ch;color:#fff;
}
.slide.title .dek{font-size:20px;line-height:1.5;color:#9DAEBE;max-width:62ch;margin:0 0 30px;font-style:italic}
.slide.title .meta{
  font-family:var(--f-mono);font-size:12px;color:#6F7F90;letter-spacing:.05em;line-height:1.9;
  border-top:1px solid #303B48;padding-top:18px;max-width:62ch;
}
.slide.title .meta b{color:#C3D0DC;font-weight:500}
.slide.title:after{
  content:"";position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.30;
}
.slide.title:before{
  content:"";position:absolute;right:-40px;bottom:-240px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.16;
}

/* divider */
.slide.divider{background:var(--accent-soft);justify-content:center}
.slide.divider .pad{padding:0 78px}
.slide.divider .n{
  font-family:var(--f-mono);font-size:96px;line-height:1;font-weight:600;letter-spacing:-.05em;
  color:var(--accent);opacity:.30;margin:0 0 6px;
}
.slide.divider h2{font-size:46px;max-width:22ch;color:var(--accent-ink)}
.slide.divider .lead{color:var(--ink-2);font-size:19px;max-width:70ch}
.slide.divider .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px;max-width:84ch}
.slide.divider .chips span{
  font-family:var(--f-mono);font-size:11px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--accent);color:var(--accent-ink);background:rgba(255,255,255,.6);
}

/* refs */
ol.refs{list-style:none;counter-reset:r;margin:0;padding:0;column-gap:34px}
ol.refs.two{column-count:2}
ol.refs>li{
  counter-increment:r;position:relative;padding:0 0 0 30px;margin:0 0 11px;
  font-size:calc(14.5px * var(--k));line-height:1.45;color:var(--ink-2);break-inside:avoid;
}
ol.refs>li:before{
  content:counter(r);position:absolute;left:0;top:2px;font-family:var(--f-mono);font-size:10px;
  font-weight:600;color:#fff;background:var(--accent);width:19px;height:19px;border-radius:4px;
  display:grid;place-items:center;
}
ol.refs>li b{color:var(--ink);font-weight:600}
ol.refs>li i{color:var(--ink-3);font-style:italic}

/* callout / lab / vilab */
.callout{
  border-left:3px solid var(--accent);background:var(--accent-soft);padding:calc(14px * var(--k)) 18px;border-radius:0 8px 8px 0;
  margin-top:calc(16px * var(--k));
}
.callout .h{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:600;margin-bottom:6px;
}
.callout p{margin:0;font-size:calc(15.5px * var(--k));line-height:1.5;color:var(--ink-2)}
.slide.vilab{background:linear-gradient(180deg,#FBFDFE 0%,#F2F6FA 100%)}
.slide.vilab .badge{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff;background:var(--ink);
  padding:5px 11px;border-radius:20px;margin-bottom:14px;
}
.slide.vilab .badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.slide.lab{background:#FCFBF6}
.stat{display:flex;gap:calc(26px * var(--k));margin:calc(18px * var(--k)) 0 0;flex-wrap:wrap}
.stat div{flex:0 0 auto}
.stat .v{font-family:var(--f-ui);font-size:calc(34px * var(--k));font-weight:700;letter-spacing:-.03em;color:var(--accent);line-height:1}
.stat .l{margin-top:calc(6px * var(--k))!important}
.stat .l{font-family:var(--f-mono);font-size:calc(10px * var(--k));letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-top:6px;max-width:22ch;line-height:1.5}

/* table */
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:0 12px 9px;border-bottom:2px solid var(--accent);font-weight:600;
}
table.t td{padding:calc(10px * var(--k)) 12px;font-size:calc(14.5px * var(--k));border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top;line-height:1.42}
table.t td:first-child{font-weight:600;color:var(--ink)}
table.t tr:last-child td{border-bottom:none}

/* per-slide citation footnotes */
sup.fn{font-family:var(--f-mono);font-size:.62em;font-weight:600;color:var(--accent);
  vertical-align:super;line-height:0;padding-left:1px}
.cites{
  flex:none;margin-top:calc(9px * var(--k));padding-top:6px;border-top:1px solid var(--rule-2);
  display:flex;flex-direction:column;gap:calc(2px * var(--k));
}
.cites .c{
  font-family:var(--f-ui);font-size:calc(10.5px * var(--k));line-height:1.42;color:var(--ink-3);
  display:flex;gap:6px;align-items:baseline;
}
.cites .c b{color:var(--accent);font-weight:700;flex:none;font-family:var(--f-mono);font-size:.94em}
.cites .c i{color:var(--ink-2);font-style:italic}
.cites .c .ed{min-width:0}
.slide.figure .cites,.slide.split .cites,.slide.splitr .cites{margin-top:calc(8px * var(--k))}

/* slide footer */
.foot{
  position:absolute;left:64px;right:64px;bottom:16px;display:flex;align-items:center;gap:12px;
  font-family:var(--f-mono);font-size:9.5px;color:#9FADBC;letter-spacing:.08em;text-transform:uppercase;
  border-top:1px solid var(--rule-2);padding-top:9px;
}
.foot .sp{flex:1}
.foot .tag{padding:2px 7px;border-radius:3px;border:1px solid var(--rule);letter-spacing:.09em}
.foot .tag.frontier{color:var(--warn);border-color:#E4BCC4;background:#FDF2F4}
.foot .tag.textbook{color:#3A4A57;border-color:#C3CCD4;background:#F2F5F7}
.foot .tag.both{color:#8A6A12;border-color:#E0D0A4;background:#FDF8EA}
.slide.title .foot,.slide.divider .foot{display:none}

/* editing */
body.edit .ed{border-radius:3px;cursor:text}
body.edit .ed:hover{background:#F1F7FC;box-shadow:0 0 0 4px #F1F7FC}
body.edit .ed:focus{background:#FFFBE6;box-shadow:0 0 0 4px #FFFBE6;outline:none}
.slide.title .ed:hover,.slide.title .ed:focus{background:#2C3742!important;box-shadow:0 0 0 4px #2C3742!important}

/* ============================ OVERVIEW ============================ */
.ov{position:fixed;inset:44px 0 30px 0;z-index:35;background:#10161E;overflow-y:auto;display:none;padding:20px}
body.ov-on .ov{display:block}
body.ov-on .stage{visibility:hidden}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;max-width:1500px;margin:0 auto}
.ovc{position:relative;cursor:pointer;border-radius:6px;overflow:hidden;background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.35);border:2px solid transparent}
.ovc:hover{border-color:var(--accent)}
.ovc.cur{border-color:#fff}
.ovc .mini{width:var(--W);height:var(--H);transform-origin:top left;pointer-events:none}
.ovc .shell{position:relative;overflow:hidden}
.ovc .lb{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.82));
  color:#fff;font-family:var(--f-mono);font-size:9.5px;padding:16px 8px 6px;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovc .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;
  font-family:var(--f-mono);font-size:9.5px;padding:2px 6px;border-radius:3px}
.ovsec{grid-column:1/-1;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7E8E9E;border-bottom:1px solid #29333F;padding:14px 0 7px;margin-top:6px}

/* ============================ NOTES ============================ */
.notes{
  position:fixed;right:0;top:44px;bottom:30px;width:340px;z-index:38;background:#131A23;
  border-left:1px solid #000;display:none;flex-direction:column;
}
body.notes-on .notes{display:flex}
.notes .nh{padding:12px 14px;border-bottom:1px solid #262F3B;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E8E9E}
.notes .nb{flex:1;overflow-y:auto;padding:12px 14px}
.notes .nxt{background:#0D131A;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.notes .nxt .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#5D6C7B;margin-bottom:5px}
.notes .nxt .t{font-family:var(--f-ui);font-size:13px;color:#C6D3DF;line-height:1.35}
.notes textarea{
  width:100%;min-height:280px;background:#0D131A;border:1px solid #262F3B;border-radius:6px;
  color:#D2DCE6;padding:11px 12px;font-family:var(--f-body);font-size:14px;line-height:1.55;resize:vertical;
}
.notes textarea:focus{outline:none;border-color:var(--accent)}
.notes .tip{font-family:var(--f-mono);font-size:9.5px;color:#4F5D6B;line-height:1.7;margin-top:12px}

/* ============================ MODAL ============================ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,17,.72);display:none;padding:26px}
.modal.on{display:flex;align-items:center;justify-content:center}
.sheet{background:#fff;border-radius:10px;width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.sheet header h3{margin:0;font-family:var(--f-ui);font-size:15px;font-weight:650;flex:1}
.sheet .mb{padding:0;flex:1;overflow:auto;min-height:0}
.sheet textarea{width:100%;height:56vh;border:0;padding:16px 20px;font-family:var(--f-mono);font-size:11.5px;
  line-height:1.6;resize:none;outline:none;background:#F7F9FB;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.mbtn{font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:6px;
  border:1px solid var(--rule);background:#fff;color:var(--ink)}
.mbtn:hover{border-color:var(--ink-3)}
.mbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.help{padding:6px 20px 20px}
.help table{width:100%;border-collapse:collapse;font-size:13.5px}
.help td{padding:7px 10px;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
.help td:first-child{width:150px}
.help kbd{font-family:var(--f-mono);font-size:11px;background:#EEF3F8;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--ink)}
.help h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:20px 0 6px}

/* search */
.srch{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:55;width:min(680px,92vw);display:none}
body.srch-on .srch{display:block}
.srch input{width:100%;padding:13px 16px;border-radius:9px;border:1px solid #33404E;background:#0D131A;
  color:#E4EBF2;font-family:var(--f-ui);font-size:15px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.srch input:focus{outline:none;border-color:var(--accent)}
.sres{margin-top:6px;background:#131A23;border:1px solid #262F3B;border-radius:9px;max-height:52vh;
  overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sres button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid #1E2732;color:#C0CDD9}
.sres button:hover{background:#1C2530;color:#fff}

  padding:10px 18px;border-radius:8px;font-family:var(--f-ui);font-size:13px;opacity:0;pointer-events:none;
  transition:.18s;z-index:70;box-shadow:0 8px 26px rgba(0,0,0,.5)}

#err{display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;background:#5A1020;color:#FFD9DF;
  padding:12px 16px;font-family:var(--f-mono);font-size:11.5px;white-space:pre-wrap;line-height:1.5}

/* ============================ PRINT ============================ */
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;overflow:visible}
  .bar,.prog,.notes,.ov,.modal,.srch,#toast,.navbtn{display:none!important}
  .stage{position:static;inset:auto;display:block;overflow:visible}
  .holder{transform:none!important;width:auto;height:auto}
  .print-all{display:block}
  .slide{width:277mm;height:auto;min-height:180mm;box-shadow:none;border:1px solid #CCC;
    break-after:page;page-break-after:always;margin:0 0 6mm}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .slide.title,.slide.divider{color:#111;background:#fff!important}
  .slide.title h1,.slide.title .no{color:#111}
  .slide.title .dek,.slide.title .meta{color:#444}
  .slide.title:after,.slide.title:before{display:none}
  .cites{border-top:1px solid #CCC}
  .pnotes{display:block!important;border-top:1px dashed #BBB;margin:10px 64px 0;padding:8px 0;
    font-family:var(--f-mono);font-size:9.5px;color:#666;white-space:pre-wrap;line-height:1.55}
}
.pnotes{display:none}
body.handout .slide{margin-bottom:18px}

FFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"34\" y=\"70\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">MCAR</text><text x=\"34\" y=\"89\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P(M) depends on nothing</text><circle cx=\"88\" cy=\"146\" r=\"26\" fill=\"#F2F6FA\" stroke=\"#8494A5\" stroke-width=\"1.6\"/><text x=\"88\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">X obs</text><circle cx=\"188\" cy=\"146\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#8494A5\" stroke-width=\"1.6\" opacity=\"0.95\"/><text x=\"188\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">X mis</text><circle cx=\"292\" cy=\"146\" r=\"26\" fill=\"#EAF0F7\" stroke=\"#2D5C8A\" stroke-width=\"1.9\"/><text x=\"292\" y=\"150\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">M</text><text x=\"292\" y=\"190\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">= 1 if missing</text><text x=\"36\" y=\"214\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">nothing points at M</text><text x=\"36\" y=\"240\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Missing completely at random. The rate is all</text><text x=\"36\" y=\"255\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">there is. Complete-case analysis is unbiased, only</text><text x=\"36\" y=\"270\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">less efficient — and it is almost never true in a</text><text x=\"36\" y=\"285\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">hospital.</text><rect x=\"401\" y=\"42\" width=\"347\" height=\"258\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"419\" y=\"70\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">MAR</text><text x=\"419\" y=\"89\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P(M) depends on what you saw</text><circle cx=\"473\" cy=\"146\" r=\"26\" fill=\"#F2F6FA\" stroke=\"#8494A5\" stroke-width=\"1.6\"/><text x=\"473\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">X obs</text><circle cx=\"573\" cy=\"146\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#8494A5\" stroke-width=\"1.6\" opacity=\"0.95\"/><text x=\"573\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">X mis</text><circle cx=\"677\" cy=\"146\" r=\"26\" fill=\"#EAF0F7\" stroke=\"#2D5C8A\" stroke-width=\"1.9\"/><text x=\"677\" y=\"150\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">M</text><text x=\"677\" y=\"190\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">= 1 if missing</text><path d=\"M477 120 Q574.0 96.0 664.2049017637668 118.31873858072579\" fill=\"none\" stroke=\"#2D5C8A\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M671.0 120.0 L663.3 113.6 L661.2 122.1 z\" fill=\"#2D5C8A\"/><text x=\"421\" y=\"214\" font-size=\"11\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">observed column → M</text><text x=\"421\" y=\"240\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Missing at random, conditional on the observed</text><text x=\"421\" y=\"255\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">columns. This is the assumption MICE, MissForest</text><text x=\"421\" y=\"270\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">and every regression imputer are built on.</text><rect x=\"786\" y=\"42\" width=\"347\" height=\"258\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#2D5C8A\" stroke-width=\"1.8\"/><text x=\"804\" y=\"70\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">MNAR</text><text x=\"804\" y=\"89\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P(M) depends on the missing value</text><circle cx=\"858\" cy=\"146\" r=\"26\" fill=\"#F2F6FA\" stroke=\"#8494A5\" stroke-width=\"1.6\"/><text x=\"858\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">X obs</text><circle cx=\"958\" cy=\"146\" r=\"26\" fill=\"#FFFFFF\" stroke=\"#8494A5\" stroke-width=\"1.6\" opacity=\"0.95\"/><text x=\"958\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">X mis</text><circle cx=\"1062\" cy=\"146\" r=\"26\" fill=\"#EAF0F7\" stroke=\"#2D5C8A\" stroke-width=\"1.9\"/><text x=\"1062\" y=\"150\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">M</text><text x=\"1062\" y=\"190\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">= 1 if missing</text><path d=\"M986 146 L1025.0 146.0\" fill=\"none\" stroke=\"#2D5C8A\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M1032.0 146.0 L1023.0 141.6 L1023.0 150.4 z\" fill=\"#2D5C8A\"/><text x=\"806\" y=\"214\" font-size=\"11\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">the unseen value → M</text><text x=\"806\" y=\"240\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">The magnitude of the value drives its own absence:</text><text x=\"806\" y=\"255\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">a level below the assay's limit, a patient too</text><text x=\"806\" y=\"270\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">unwell to attend. No imputer recovers it from</text><text x=\"806\" y=\"285\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">observed data alone.</text><rect x=\"16\" y=\"316\" width=\"558\" height=\"128\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"344\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">The uncomfortable part</text><text x=\"38\" y=\"368\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">MAR and MNAR cannot be told apart from the observed data, because the</text><text x=\"38\" y=\"384\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">information that would distinguish them is exactly the information you do</text><text x=\"38\" y=\"400\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">not have. So the mechanism is an argument from the data-generating</text><text x=\"38\" y=\"416\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">process, backed by a sensitivity analysis — never a p-value.</text><rect x=\"576\" y=\"316\" width=\"558\" height=\"128\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"598\" y=\"344\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Three concrete clinical cases</text><text x=\"598\" y=\"368\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">MCAR</text><text x=\"650\" y=\"368\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">a rack of samples dropped in transit</text><text x=\"598\" y=\"390\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">MAR</text><text x=\"650\" y=\"390\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">older patients are sent for the scan more often — and age is recorded</text><text x=\"598\" y=\"412\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">MNAR</text><text x=\"650\" y=\"412\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the value was below the assay's detection limit, so nothing was reported</text><text x=\"598\" y=\"436\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Little's test can rule out MCAR. Nothing rules out MNAR.</text></svg>", "f_missind": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The indicator can be the strongest feature in the table</text><text x=\"20\" y=\"48\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">In an EHR, a test is absent because a clinician decided not to order it.</text><text x=\"20\" y=\"62\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">That decision is data.</text><text x=\"36\" y=\"99\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">PATIENT</text><text x=\"140\" y=\"99\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">LACTATE</text><text x=\"232\" y=\"99\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">WAS ORDERED</text><text x=\"354\" y=\"99\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">HRS TO LAB</text><text x=\"460\" y=\"99\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">DIED</text><line x1=\"30\" y1=\"106\" x2=\"544\" y2=\"106\" stroke=\"#2D5C8A\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"26\" y=\"110\" width=\"522\" height=\"24\" rx=\"3\" fill=\"#F6E3E8\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"36\" y=\"125.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P-014</text><text x=\"140\" y=\"125.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">4.8</text><text x=\"232\" y=\"125.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">yes</text><text x=\"354\" y=\"125.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">0.5</text><text x=\"460\" y=\"125.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">yes</text><text x=\"36\" y=\"151.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P-027</text><text x=\"140\" y=\"151.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">—</text><text x=\"232\" y=\"151.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no</text><text x=\"354\" y=\"151.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">—</text><text x=\"460\" y=\"151.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no</text><text x=\"36\" y=\"177.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P-031</text><text x=\"140\" y=\"177.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">2.1</text><text x=\"232\" y=\"177.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">yes</text><text x=\"354\" y=\"177.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">2.0</text><text x=\"460\" y=\"177.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no</text><text x=\"36\" y=\"203.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P-045</text><text x=\"140\" y=\"203.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">—</text><text x=\"232\" y=\"203.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no</text><text x=\"354\" y=\"203.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">—</text><text x=\"460\" y=\"203.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no</text><rect x=\"26\" y=\"214\" width=\"522\" height=\"24\" rx=\"3\" fill=\"#F6E3E8\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"36\" y=\"229.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P-052</text><text x=\"140\" y=\"229.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">6.9</text><text x=\"232\" y=\"229.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">yes</text><text x=\"354\" y=\"229.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">0.3</text><text x=\"460\" y=\"229.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">yes</text><text x=\"36\" y=\"255.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">P-063</text><text x=\"140\" y=\"255.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">—</text><text x=\"232\" y=\"255.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no</text><text x=\"354\" y=\"255.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">—</text><text x=\"460\" y=\"255.5\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no</text><text x=\"30\" y=\"290\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">62% missing — and the pattern is a record of triage</text><rect x=\"20\" y=\"292\" width=\"560\" height=\"102\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"318\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Modelling it directly</text><text x=\"38\" y=\"340\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">GRU-D (Che et al., Scientific Reports 2018) feeds the mask and the time</text><text x=\"38\" y=\"355\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">since the last observation into the network alongside the value, so the</text><text x=\"38\" y=\"370\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">model learns from the absence rather than around it.</text><rect x=\"20\" y=\"404\" width=\"560\" height=\"104\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"430\" font-size=\"13\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">…and the trap on the other side</text><text x=\"38\" y=\"452\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">An indicator that is only ever set after the outcome is known is an</text><text x=\"38\" y=\"467\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">illegitimate feature (leakage type L2, §0.3). Ask of every indicator: was</text><text x=\"38\" y=\"482\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">this knowable at the prediction time?</text></svg>", "f_impute": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">The ladder of imputation methods, and where the rungs stop paying</text><rect x=\"16\" y=\"42\" width=\"706\" height=\"358\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"34\" y=\"70\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Each rung buys you something, and assumes something</text><text x=\"42\" y=\"93\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">METHOD</text><text x=\"254\" y=\"93\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">ASSUMES</text><text x=\"440\" y=\"93\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">WHAT IT COSTS YOU</text><line x1=\"36\" y1=\"100\" x2=\"702\" y2=\"100\" stroke=\"#2D5C8A\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"42\" y=\"123.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">Mean / median</text><text x=\"254\" y=\"123.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">MCAR</text><text x=\"440\" y=\"123.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">variance shrinks, correlations break</text><text x=\"42\" y=\"156.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">kNN (Troyanskaya 2001)</text><text x=\"254\" y=\"156.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">MAR + a sane metric</text><text x=\"440\" y=\"156.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">distance degrades in high dimension</text><text x=\"42\" y=\"189.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">Regression fill</text><text x=\"254\" y=\"189.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">MAR, correct model</text><text x=\"440\" y=\"189.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">deterministic fill understates error</text><text x=\"42\" y=\"222.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">MICE (van Buuren 2011)</text><text x=\"254\" y=\"222.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">MAR, compatible models</text><text x=\"440\" y=\"222.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">m datasets and pooling rules</text><text x=\"42\" y=\"255.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">MissForest (Stekhoven 2012)</text><text x=\"254\" y=\"255.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">MAR, nonlinear, mixed</text><text x=\"440\" y=\"255.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">no uncertainty, slow on wide data</text><text x=\"42\" y=\"288.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">GAIN (Yoon et al. 2018)</text><text x=\"254\" y=\"288.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">MAR, plenty of rows</text><text x=\"440\" y=\"288.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">unstable, tuned on masked data</text><text x=\"42\" y=\"321.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">Native NA in GBMs</text><text x=\"254\" y=\"321.0\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" fon \"600\" font-family=\"IBM Plex Mono,monospace\">exactly normal, by construction</text><text x=\"806\" y=\"302\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">The default in modern tabular deep-learning</text><text x=\"806\" y=\"316\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">benchmarks (Gorishniy et al., 2021). Unstable at</text><text x=\"806\" y=\"330\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">small n.</text><rect x=\"16\" y=\"344\" width=\"558\" height=\"108\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"370\" font-size=\"13\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">Every one of these is a fitted parameter</text><text x=\"38\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">The mean, the standard deviation, the median, the IQR, λ and the empirical</text><text x=\"38\" y=\"407\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">quantiles are all estimated from data. Fit them on the training fold and apply</text><text x=\"38\" y=\"422\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">them to the validation fold — never the other way round (§0.3.5).</text><rect x=\"576\" y=\"344\" width=\"558\" height=\"108\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"598\" y=\"370\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The target is a column too</text><text x=\"598\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Log-transforming y changes what the model optimises and introduces</text><text x=\"598\" y=\"407\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">back-transformation bias in the mean. Standardising y helps neural regression</text><text x=\"598\" y=\"422\" font-size=\"11.5\" text- xt><rect x=\"388\" y=\"378\" width=\"50\" height=\"26\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"413\" y=\"395\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">r7</text><rect x=\"446\" y=\"378\" width=\"50\" height=\"26\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"471\" y=\"395\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">r8</text><rect x=\"504\" y=\"378\" width=\"50\" height=\"26\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"529\" y=\"395\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">r9</text><path d=\"M38 378 q-5.0 0 -5.0 5.0 L33.0 386.0 q-5.0 0 -5.0 5.0 M38 404 q-5.0 0 -5.0 -5.0 L33.0 396.0 q-5.0 0 -5.0 -5.0\" fill=\"none\" stroke=\"#0F7A6A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M272 412 L272.0 421.0\" fill=\"none\" stroke=\"#0F7A6A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M272.0 428.0 L276.4 419.0 L267.6 419.0 z\" fill=\"#0F7A6A\"/><text x=\"40\" y=\"440\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">row 5 is encoded from rows 1–4 only, under a random permutation;</text><text x=\"40\" y=\"458\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">several permutations are averaged. No row ever sees its own label.</text><text x=\"20\" y=\"500\" font-size=\"12\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-style=\"italic\">All three are stateful transforms. All three belong inside the fold (§0.3.5).</text></svg>", "f_selection": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Three families of selection — and the one mistake that invalidates all of them</text><rect x=\"16\" y=\"42\" width=\"347\" height=\"152\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"16\" y=\"42\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"36\" y=\"76\" font-size=\"15\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Filter</text><text x=\"36\" y=\"96\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">score each feature against y, then cut</text><text x=\"36\" y=\"118\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">variance · correlation · mutual information ·</text><text x=\"36\" y=\"131\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">chi-square · ANOVA F</text><text x=\"36\" y=\"152\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Fast, model-free, and blind to interactions: two</text><text x=\"36\" y=\"167\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">features useless alone can be decisive together.</text><rect x=\"401\" y=\"42\" width=\"347\" height=\"152\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"401\" y=\"42\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"421\" y=\"76\" font-size=\"15\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Wrapper</text><text x=\"421\" y=\"96\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">search subsets, refit the model each time</text><text x=\"421\" y=\"118\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">forward · backward · stepwise · recursive</text><text x=\"421\" y=\"131\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">feature elimination</text><text x=\"421\" y=\"152\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Sees interactions, costs a model fit per step, and</text><text x=\"421\" y=\"167\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">overfits the search criterion unless nested.</text><rect x=\"786\" y=\"42\" width=\"347\" height=\"152\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"786\" y=\"42\" width=\"347\" height=\"5\" rx=\"2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"806\" y=\"76\" font-size=\"15\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Embedded</text><text x=\"806\" y=\"96\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">selection falls out of fitting</text><text x=\"806\" y=\"118\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">L1 / elastic net · tree gain · permutation</text><text x=\"806\" y=\"131\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">importance</text><text x=\"806\" y=\"152\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Cheapest per unit of signal. Gain-based importance</text><text x=\"806\" y=\"167\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">is biased towards high-cardinality features.</text><rect x=\"16\" y=\"208\" width=\"558\" height=\"236\" rx=\"10\" fill=\"#FBF0F2\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"238\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Wrong: screen once on everything, then cross-validate</text><rect x=\"42\" y=\"254\" width=\"506\" height=\"32\" rx=\"6\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"295\" y=\"275\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">rank all 20,000 features by correlation with y — using every row</text><path d=\"M295 288 L295.0 297.0\" fill=\"none\" stroke=\"#2D5C8A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M295.0 304.0 L299.4 295.0 L290.6 295.0 z\" fill=\"#2D5C8A\"/><rect x=\"42\" y=\"310\" width=\"100\" height=\"22\" rx=\"4\" fill=\"#8494A5\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"92\" y=\"325\" font-size=\"10\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">val</text><rect x=\"146\" y=\"310\" width=\"100\" height=\"22\" rx=\"4\" fill=\"#E9A8B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"196\" y=\"325\" font-size=\"10\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train</text><rect x=\"250\" y=\"310\" width=\"100\" height=\"22\" rx=\"4\" fill=\"#E9A8B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"300\" y=\"325\" font-size=\"10\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train</text><rect x=\"354\" y=\"310\" width=\"100\" height=\"22\" rx=\"4\" fill=\"#E9A8B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"404\" y=\"325\" font-size=\"10\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train</text><rect x=\"42\" y=\"336\" width=\"100\" height=\"22\" rx=\"4\" fill=\"#E9A8B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"92\" y=\"351\" font-size=\"10\" text-anchor=\"middle\" f ll=\"#2D5C8A\" stroke=\"#fff\" stroke-width=\"1.4\"/><circle cx=\"666\" cy=\"196\" r=\"6\" fill=\"#2D5C8A\" stroke=\"#fff\" stroke-width=\"1.4\"/><text x=\"439\" y=\"214\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">three rows that could not exist</text><text x=\"421\" y=\"268\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A noisy or isolated minority case drags</text><text x=\"421\" y=\"283\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">synthetic rows straight through majority</text><text x=\"421\" y=\"298\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">territory. Hybrid cleaning (Batista et al.</text><text x=\"421\" y=\"313\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">2004) removes some, after the fact.</text><rect x=\"786\" y=\"42\" width=\"347\" height=\"272\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"804\" y=\"70\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">In high dimensions</text><text x=\"804\" y=\"89\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">Blagus &amp; Lusa, BMC Bioinformatics 2013</text><line x1=\"838\" y1=\"208\" x2=\"1093\" y2=\"208\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"838\" y1=\"100\" x2=\"838\" y2=\"208\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"965.5\" y=\"244\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">number of features</text><g transform=\"translate(804,154.0) rotate(-90)\"><text x=\"0\" y=\"0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">distance</text></g><line x1=\"838.0\" y1=\"208\" x2=\"838.0\" y2=\"213\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"838.0\" y=\"228\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">10</text><line x1=\"923.0\" y1=\"208\" x2=\"923.0\" y2=\"213\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"923.0\" y=\"228\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">10²</text><line x1=\"1008.0\" y1=\"208\" x2=\"1008.0\" y2=\"213\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"1008.0\" y=\"228\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">10³</text><line x1=\"1093.0\" y1=\"208\" x2=\"1093.0\" y2=\"213\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><text x=\"1093.0\" y=\"228\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">10⁴</text><path d=\"M838.0 184.2 L846.5 180.3 L855.0 176.7 L863.5 173.4 L872.0 170.3 L880.5 167.5 L889.0 165.0 L897.5 162.6 L906.0 160.5 L914.5 158.5 L923.0 156.7 L931.5 155.0 L940.0 153.5 L948.5 152.1 L957.0 150.8 L965.5 149.7 L974.0 148.6 L982.5 147.6 L991.0 146.7 L999.5 145.9 L1008.0 145.1 L1016.5 144.4 L1025.0 143.8 L1033.5 143.2 L1042.0 142.7 L1050.5 142.2 L1059.0 141.7 L1067.5 141.3 L1076.0 140.9 L1084.5 140.6 L1093.0 140.2\" fill=\"none\" stroke=\"#2D5C8A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M838.0 108.6 L846.5 110.8 L855.0 112.8 L863.5 114.6 L872.0 116.2 L880.5 117.8 L889.0 119.2 L897.5 120.4 L906.0 121.6 L914.5 122.7 L923.0 123.7 L931.5 124.6 L940.0 125.4 L948.5 126.2 L957.0 126.9 L965.5 127.5 L974.0 128.1 L982.5 128.6 L991.0 129.1 L999.5 129.6 L1008.0 130.0 L1016.5 130.4 L1025.0 130.7 L1033.5 131.0 L1042.0 131.3 L1050.5 131.6 L1059.0 131.8 L1067.5 132.1 L1076.0 132.3 L1084.5 132.5 L1093.0 132.6\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"5 4\"/><text x=\"1091\" y=\"112\" font-size=\"10\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">farthest neighbour</text><text x=\"1091\" y=\"198\" font-size=\"10\" text-anchor=\"end\" fill=\"#2D5C8A\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">nearest neighbour</text><text x=\"806\" y=\"268\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Distances concentrate, so the “nearest minority</text><text x=\"806\" y=\"283\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">neighbour” is close to arbitrary and SMOTE</text><text x=\"806\" y=\"298\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">degenerates towards random oversampling — while</text><text x=\"806\" y=\"313\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">still biasing the majority class.</text><rect x=\"16\" y=\"328\" width=\"1118\" height=\"116\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"356\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">What resampling never fixes</text><text x=\"38\" y=\"382\" font-size=\"13\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">It changes the base rate the model is trained on, so the output stops being an estimate of risk. Discrimination barely moves; calibration breaks.</text><text x=\"38\" y=\"408\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The catalogue problem:</text><text x=\"216\" y=\"408\" font-size=\"13\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Borderline-SMOTE, Safe-Level, ADASYN (He et al. 2008) and dozens more are catalogued (Kovács 2019); which wins is dataset-dependent.</text><text x=\"38\" y=\"432\" font-size=\"12\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">And it is stateful: applied before the split, it puts a synthetic sibling of every test row into the training set (§0.3.5).</text></svg>", "f_calib": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The cost of “fixing” imbalance, in one plot</text><text x=\"20\" y=\"48\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Calibration curve: predicted risk on the x-axis, observed frequency on</text><text x=\"20\" y=\"62\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">the y-axis. Shape, not measured values.</text><line x1=\"76\" y1=\"145.5\" x2=\"506\" y2=\"145.5\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"76\" y1=\"199.0\" x2=\"506\" y2=\"199.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"76\" y1=\"252.5\" x2=\"506\" y2=\"252.5\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"76\" y1=\"306\" x2=\"506\" y2=\"306\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"76\" y1=\"92\" x2=\"76\" y2=\"306\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"291.0\" y=\"342\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">predicted probability</text><g transform=\"translate(42,199.0) rotate(-90)\"><text x=\"0\" y=\"0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" f \" stroke-width=\"1.4\"/><text x=\"616\" y=\"408\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">immortal time — patients who could not have had the event yet</text><circle cx=\"606\" cy=\"418\" r=\"2.6\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"616\" y=\"426\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">censoring silently recoded as “did not have the outcome”</text></svg>", "f_windowleak": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Every window must close before the prediction time</text><text x=\"20\" y=\"48\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">The two failures below look exactly like ordinary feature engineering.</text><rect x=\"20\" y=\"70\" width=\"560\" height=\"180\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"96\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">1 · Rolling statistics</text><line x1=\"60\" y1=\"206\" x2=\"520\" y2=\"206\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><path d=\"M500 206 L525.0 206.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M532.0 206.0 L523.0 201.6 L523.0 210.4 z\" fill=\"#8494A5\"/><line x1=\"345.2\" y1=\"108\" x2=\"345.2\" y2=\"216\" stroke=\"#2D5C8A\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"351.2\" y=\"226\" font-size=\"12\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">t₀</text><rect x=\"227.2\" y=\"112\" width=\"200\" height=\"30\" rx=\"5\" fill=\"#F6D9DF\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"327.2\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">centred 30-day mean</text><text x=\"437.2\" y=\"132\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">uses the future</text><rect x=\"145.2\" y=\"154\" width=\"200\" height=\"30\" rx=\"5\" fill=\"#D8EAE4\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"245.2\" y=\"174\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">trailing 30-day mean</text><text x=\"355.2\" y=\"174\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">closes at t₀</text><text x=\"38\" y=\"240\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">min_periods, centre=False, and a shift(1) you can point to in the diff.</text><rect x=\"20\" y=\"262\" width=\"560\" height=\"150\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"288\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">2 · Aggregates and encodings across time</text><rect x=\"40\" y=\"302\" width=\"250\" height=\"44\" rx=\"6\" fill=\"#F6D9DF\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"52\" y=\"322\" font-size=\"11\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">target encoding over the</text><text x=\"52\" y=\"338\" font-size=\"11\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">whole series</text><rect x=\"310\" y=\"302\" width=\"250\" height=\"44\" rx=\"6\" fill=\"#D8EAE4\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"322\" y=\"322\" font-size=\"11\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">expanding, as-of t — only</text><text x=\"322\" y=\"338\" font-size=\"11\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">rows already in the past</text><text x=\"40\" y=\"370\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">The same applies to group means over a child table, to “number of prior</text><text x=\"40\" y=\"385\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">admissions”, and to any statistic computed once over the full history.</text><rect x=\"20\" y=\"424\" width=\"560\" height=\"84\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"38\" y=\"450\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">The test to apply to every feature</text><text x=\"38\" y=\"472\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Could this number have been computed, with the data that existed, at the</text><text x=\"38\" y=\"487\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">moment the prediction is made? If you cannot answer with a timestamp, it</text><text x=\"38\" y=\"502\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">is not a feature yet.</text></svg>"}, "slides": [{"kind": "title", "kick": "Condensed edition · session 2 of 5", "title": "Tabular and clinical table data", "lead": "The oldest and most codified pipeline. Almost every step has a well-known default and a well-known way it goes wrong — and one of the defaults is actively harmful in clinical prediction.", "meta": "<b>Session 2 of 5</b> &nbsp;·&nbsp; Data Preparation for Machine Learning and AI<br>Thanapong Intharah &nbsp;·&nbsp; Visual Intelligence Laboratory &nbsp;·&nbsp; Khon Kaen University<br>2 h lecture + 1 h paper clinic &nbsp;·&nbsp; long-form reference: Chapter 1", "notes": "Ask who has used SMOTE. Most hands go up. Say you will come back to it in block B, and that the evidence is not on its side for risk prediction."}, {"kind": "cols", "kick": "Learning outcomes", "sm": true, "title": "What you should be able to do by the end of today", "cols": [{"sub": "Argue", "h": "A missingness mechanism", "b": ["Distinguish MCAR, MAR and MNAR and argue for one", "Recognise informative missingness in EHR data", "Know where imputation sophistication stops paying"]}, {"sub": "Encode", "h": "Without leaking", "b": ["Choose between one-hot, target, hashing and embeddings", "Explain the leak inside target encoding, and CatBoost's fix", "Fit every encoder inside the fold"]}, {"sub": "Resist", "h": "The imbalance reflex", "acc": true, "b": ["State why resampling damages calibration", "Use class weights, thresholds and cost matrices instead", "Report PR, MCC, Brier and net benefit, not accuracy"]}, {"sub": "Construct", "h": "A defensible cohort", "b": ["Define index event, windows, washout and censoring", "Spot window leakage in rolling features", "Know what tabular foundation models change"]}], "notes": "Outcome three is the one that changes behaviour. Everything else is technique.", "cites": ["Prokhorenkova et al. <i>CatBoost: unbiased boosting with categorical features.</i> NeurIPS, 2018."]}, {"kind": "table", "kick": "Run sheet", "title": "How the three hours run", "sm": true, "table": {"head": ["Block", "Clock", "What happens"], "rows": [["Lecture A", "0:00 – 1:05", "Ingestion, missingness, outliers and encoding — typing as a contract, Rubin's mechanisms, the imputation ladder, and the leak inside the best encoder"], ["Break", "1:05 – 1:20", "Coffee. Use it: the second block is the harder one."], ["Lecture B", "1:20 – 2:10", "Imbalance, foundation models and cohorts — why resampling damages calibration, what TabPFN changes, and how an EHR cohort is really defined"], ["Paper clinic", "2:10 – 3:00", "Read a clinical prediction model against TRIPOD+AI — is calibration reported at all?"]]}, "callout": {"h": "Deck controls", "p": "<b>E</b> edit any line in place &nbsp;·&nbsp; <b>N</b> speaker notes &nbsp;·&nbsp; <b>O</b> slide grid &nbsp;·&nbsp; <b>T</b> timer &nbsp;·&nbsp; <b>/</b> search &nbsp;·&nbsp; <b>P</b> print a handout with notes underneath each slide."}, "notes": "Start the timer (T) at the top of the hour. The clinic is not optional padding — it is where the lecture material becomes a skill.", "cites": ["Hollmann et al. <i>Accurate predictions on small data with a tabular foundation model (TabPFN v2).</i> Nature, 2025.", "Collins et al. <i>TRIPOD+AI statement.</i> BMJ, 2024."]}, {"kind": "bullets", "sec": "1.0", "secTitle": "Why this chapter comes second", "kick": "Orientation", "title": "Why tabular data still decides most projects", "lead": "Not because it is fashionable. Because it is where the outcome is defined, where the confounders live, and where regulators look.", "b": ["<b>It is where the label comes from.</b> Even in an imaging project, the diagnosis, the follow-up outcome and the eligibility criteria come out of a relational database. Chapter 3's model inherits Chapter 1's mistakes.", "<b>Gradient-boosted trees remain hard to beat</b> on typical tabular problems — Grinsztajn<sup class=\"fn\">1</sup>, Oyallon &amp; Varoquaux (NeurIPS 2022) give three structural reasons, not one benchmark. So the leverage is in the data, not the architecture.", "<b>Every step here is a fitted transform.</b> Imputers, scalers, encoders, discretisers, selectors and resamplers all learn parameters from data — which makes this chapter the largest single surface for the leakage taxonomy of §0.3.", "<b>The defaults are strong and the failure modes are documented.</b> That combination is rare, and it makes tabular work the best possible teaching ground for evaluating a preparation decision honestly.", "<b>And the ground is moving.</b> Section 1.11 argues that tabular foundation models are shifting the preprocessing budget away from encoding and scaling towards leakage control, target definition and evaluation design."], "callout": {"h": "The organising claim of this chapter", "p": "A tabular pipeline is a sequence of fitted transforms. Every one of them has a default that is usually right, a hyper-parameter nobody tunes, and a documented way of leaking. Your job is to know which is which."}, "notes": "Push back gently on anyone who says tabular data is “solved”. Ask them how they would handle a column that is 60% missing because a clinician chose not to order the test. Nobody has a clean answer, and that is section 1.2.", "cites": ["Grinsztajn et al. <i>Why do tree-based models still outperform deep learning on typical tabular data?.</i> NeurIPS Datasets & Benchmarks, 2022."]}, {"kind": "divider", "sec": "1.1", "secTitle": "Ingestion, typing and integration", "no": "1.1", "title": "Ingestion, typing and integration", "lead": "Before any technique: what is a row, what is a column, and what happens when you join two tables that disagree.", "chips": ["Schema inference", "Measurement scales", "Units and time zones", "Defining the grain", "Joins and fan-out", "Entity resolution", "Reshaping", "Source integration"]}, {"kind": "bullets", "title": "Typing is a contract, not an inference", "kick": "1.1.1–1.1.3", "tag": "textbook", "lead": "Every parser will guess. The guess is right often enough to be dangerous and wrong often enough to ruin a study.", "b": ["<b>Declare dtypes explicitly.</b> <span class='k'>read_csv</span> infers from the first N rows; a value on row 200,001 can silently demote a numeric column to <span class='k'>object</span>, and every downstream mean becomes a concatenation.", "<b>The classic silent corruptions:</b> leading zeros stripped from an ID, a locale that reads <span class='k'>1.234</span> as one point two three four, integer overflow on a hospital number, an Excel round-trip turning a gene symbol into a date.", "<b>Measurement scale constrains everything after it.</b> Stevens<sup class=\"fn\">1</sup> (1946): nominal, ordinal, interval, ratio. A ratio scale has a true zero, so a ratio is meaningful; an interval scale does not — and neither does the mean of an ordinal pain score.", "<b>Units, calendars and time zones</b> are where multi-site studies break: mg/dL against mmol/L, local time against UTC, the Buddhist Era against the Common Era, a daylight-saving boundary that duplicates an hour of monitoring.", "<b>The rule:</b> carry the unit in the column name (<span class='k'>creatinine_mg_dl</span>), store timestamps in UTC with the site's offset in its own column, and assert the permitted range at ingestion. Then reshape to tidy data <span class='cite'>Wickham<sup class=\"fn\">2</sup>, 2014</span>."], "callout": {"h": "War story worth telling", "p": "A unit change upstream — mg/dL to mmol/L for one site, mid-study — passes every type check, every null check and every range check that was written before the change. It surfaces months later as a site effect nobody can explain. Range assertions must be per-site, not global."}, "notes": "Ask the room what the most expensive typing bug they have personally caused was. Someone always has a good one. It normalises the admission and makes the assertion discipline feel less pedantic.", "cites": ["Stevens. <i>On the Theory of Scales of Measurement.</i> Science, 1946.", "Wickham. <i>Tidy Data.</i> Journal of Statistical Software, 2014."], "sec": "1.1", "secTitle": "Ingestion, typing and integration"}, {"kind": "figure", "title": "Grain, joins and the fan-out", "kick": "1.1.4–1.1.6, 1.1.8", "tag": "textbook", "lead": "The single most common way a tabular dataset acquires a sample size it has not earned.", "fig": "f_grain", "figcap": "<b>The grain is a modelling decision.</b> It fixes the unit of analysis, and therefore the split design of §0.3 — patient, visit, specimen, camera-hour. Declare it before the first join, and assert the join cardinality every time.", "notes": "The fan-out is worth doing live: merge a patient table with a labs table in front of them, print the row count before and after, and then compute a mean age. It will be wrong, and everyone can see why. Then point out that a significance test on the inflated n is wrong in exactly the same way.", "cites": ["Christen. <i>Data Matching: Concepts and Techniques for Record Linkage, Entity Resolution and Duplicate….</i> 2012."], "sec": "1.1", "secTitle": "Ingestion, typing and integration"}, {"kind": "divider", "sec": "1.2", "secTitle": "Missing data", "no": "1.2", "title": "Missing data", "lead": "The mechanism decides whether imputation is even valid. Everything else is implementation.", "chips": ["MCAR / MAR / MNAR", "Missingness as signal", "Simple fills", "kNN and regression", "MICE", "MissForest", "GAIN and deep imputers", "Native NA handling", "Diminishing returns"]}, {"kind": "figure", "title": "Rubin's three mechanisms", "kick": "1.2.1", "tag": "textbook", "lead": "MCAR, MAR and MNAR are not properties you can measure. They are claims about how the data came to exist.", "fig": "f_mechanisms", "figcap": "<b>Rubin<sup class=\"fn\">1</sup> (1976); Little &amp; Rubin<sup class=\"fn\">2</sup>, 3rd ed. 2019.</b> Every imputation method on the next slides is valid under MAR and silently biased under MNAR. Since you cannot test the difference, the honest move is to state the assumption and show what happens if it is wrong.", "notes": "The exercise that lands: give each group one column from a real clinical extract and ask them to argue a mechanism out loud. The argument is always about the clinical workflow, never about the numbers — which is exactly the point.", "cites": ["Rubin. <i>Inference and Missing Data.</i> Biometrika, 1976.", "Little & Rubin. <i>Statistical Analysis with Missing Data, 3rd ed.</i> 2019."], "sec": "1.2", "secTitle": "Missing data"}, {"kind": "split", "title": "Informative missingness: the norm in EHR data", "kick": "1.2.2", "tag": "both", "wide": "text", "lead": "In a hospital, absence is a decision. A column that is 60% empty may carry more signal than any column that is full.", "b": ["<b>The generating process is a clinician.</b> A lactate is ordered because someone was worried, and that worry is a proxy for severity.", "<b>So add the indicator</b> — a binary <span class='k'>was_measured</span> column per variable with meaningful missingness — and keep it in the model. It is often the strongest feature in the table.", "<b>Add the timing too:</b> hours from admission to the first measurement, and the number of measurements. Both encode intensity of monitoring.", "<b>GRU-D (Che et al.<sup class=\"fn\">1</sup>, <i>Scientific Reports</i>, 2018)</b> makes it architectural: the mask and the time since last observation are model inputs, with a learned decay.", "<b>The counter-argument:</b> an indicator only ever set <em>after</em> the outcome is known is an illegitimate feature — leakage type L2 in §0.3. Test every one against a timestamp."], "fig": "f_missind", "figcap": "Six rows from a sepsis-style extract. The missingness pattern is a record of triage.", "callout": {"h": "Deployment warning", "p": "A missingness indicator is a feature about your hospital's ordering practice. Move the model to a site with a different testing protocol and that feature's meaning changes — a concept drift you built in deliberately. Say so in the limitations section."}, "notes": "This is the slide clinicians in the room will engage with most. Ask them which test in their own unit is ordered “only when we are already worried”. That answer is a feature.", "cites": ["Che et al. <i>Recurrent Neural Networks for Multivariate Time Series with Missing Values (GRU-D).</i> Scientific Reports, 2018."], "sec": "1.2", "secTitle": "Missing data"}, {"kind": "figure", "title": "The ladder — and where the rungs stop paying", "kick": "1.2.3–1.2.11", "tag": "frontier", "lead": "Sophistication is not free, and for prediction the returns flatten sooner than the literature's enthusiasm suggests.", "fig": "f_impute", "figcap": "<b>Le Morvan &amp; Varoquaux<sup class=\"fn\"
