>1</sup> (ICLR 2025)</b> is the reference for the flattening: for prediction with an expressive model, elaborate imputation buys little. <b>Perez-Lebel et al.<sup class=\"fn\">2</sup> (GigaScience 2022)</b> benchmark on real clinical databases rather than artificially masked ones — a distinction worth insisting on, because masking a complete dataset manufactures MCAR by construction.", "notes": "The most common student error is running MICE because it is what the statistics course taught, then reporting a single completed dataset and no pooled standard errors. If you are not using the pooling rules, you are not doing multiple imputation — you are doing one expensive regression fill.", "cites": ["Le Morvan & Varoquaux. <i>Imputation for prediction: beware of diminishing returns.</i> ICLR, 2025.", "Perez-Lebel et al. <i>Benchmarking missing-values approaches for predictive models on health databases.</i> GigaScience, 2022.", "Troyanskaya et al. <i>Missing value estimation methods for DNA microarrays.</i> 2001.", "Stekhoven & Bühlmann. <i>MissForest — non-parametric missing value imputation for mixed-type data.</i> Bioinformatics, 2012."], "sec": "1.2", "secTitle": "Missing data"}, {"kind": "divider", "sec": "1.3", "secTitle": "Outliers, noise and error repair", "no": "1.3", "title": "Outliers, noise and error repair", "lead": "Three questions in order: is it possible, is it plausible, and is it the thing I am trying to predict?", "chips": ["Univariate rules", "Mahalanobis and robust covariance", "Isolation Forest, LOF, ECOD", "ADBench", "Repair strategies", "Constraint-based cleaning", "Outlier vs rare event"]}, {"kind": "figure", "title": "Three geometries of “unusual”", "kick": "1.3.1–1.3.3", "tag": "both", "lead": "Each detector answers a different question. Choosing one without saying which question you asked is the actual error.", "fig": "f_outliers", "figcap": "<b>Han et al.<sup class=\"fn\">1</sup>, ADBench (NeurIPS 2022)</b> benchmarked a large set of detectors and found no dominant method; the unsolved problem is selecting one without labels. Report the detector, its contamination parameter and the number of points it flagged — those three numbers make the decision auditable.", "notes": "The Mahalanobis panel is the one worth pausing on: a systolic of 200 is unremarkable and an age of 24 is unremarkable, but together they are worth a phone call to the ward. Students almost always screen column by column and miss exactly this.", "cites": ["Han et al. <i>ADBench: Anomaly Detection Benchmark.</i> NeurIPS Datasets & Benchmarks, 2022."], "sec": "1.3", "secTitle": "Outliers, noise and error repair"}, {"kind": "bullets", "title": "Repair by mechanism, not by rule", "kick": "1.3.4–1.3.7", "tag": "textbook", "lead": "“Remove points beyond three standard deviations” is not a policy. It is a way of deleting your rarest patients without recording that you did.", "b": ["<b>Impossible values</b> — a negative haemoglobin, a birth date after the visit date, a diastolic above the systolic. These are data-entry or unit errors: fix or delete, and log the count.", "<b>Implausible but possible</b> — a lactate of 14, a creatinine of 900. Verify against a second source if one exists. If not, <em>keep them</em> and use an estimator they cannot dominate.", "<b>Winsorise or cap</b> when the tail is real but the model is fragile — then check the tail's calibration, because clipping the top 1% of a risk score truncates the patients the score exists to find.", "<b>Transform instead of deleting</b> where the problem is skew rather than error (§1.4), or model the tail separately when the mechanism genuinely differs.", "<b>Rule-based repair</b> — functional dependencies, denial constraints, HoloClean (Rekatsinas et al.<sup class=\"fn\">1</sup>, <i>VLDB</i> 2017) — is powerful for relational integrity and no help at all with plausible-but-wrong numbers. <b>Domain plausibility</b> catches more: physiological ranges, valid codes, date orderings, unit checks."], "callout": {"h": "The health-data inversion", "p": "In most of machine learning the outlier is noise to be removed. In screening, surveillance and diagnosis the outlier is frequently the <b>event</b> — the case the whole model exists to catch. Deleting outliers before defining the outcome is how a cohort quietly loses its sickest patients."}, "notes": "Ask what fraction of rows their cleaning script currently drops, and whether anyone has ever looked at the dropped rows as a group. Almost nobody has. Twenty minutes of reading dropped rows is the highest-yield debugging in the whole pipeline.", "cites": ["Rekatsinas et al. <i>HoloClean: Holistic Data Repairs with Probabilistic Inference.</i> VLDB, 2017."], "sec": "1.3", "secTitle": "Outliers, noise and error repair"}, {"kind": "divider", "sec": "1.4", "secTitle": "Scaling and distributional transforms", "no": "1.4", "title": "Scaling and distributional transforms", "lead": "Cheap, reversible, and responsible for a surprising number of leaks — because every one of them is a parameter estimated from data.", "chips": ["Standardise and normalise", "Which models care", "log and log1p", "Box–Cox and Yeo–Johnson", "Quantile and rank-gauss", "Target transformation", "Clipping"]}, {"kind": "figure", "title": "Moving the axis, and moving the distribution", "kick": "1.4.1–1.4.5", "tag": "textbook", "lead": "Scaling changes the units and nothing else. Power and quantile transforms change the shape — and therefore change what “linear” means.", "fig": "f_transforms", "figcap": "<b>Box &amp; Cox<sup class=\"fn\">1</sup> (1964)</b> for strictly positive data, <b>Yeo &amp; Johnson<sup class=\"fn\">2</sup> (2000)</b> when zeros and negatives are present. Quantile / rank-gauss is the de-facto default in modern tabular deep-learning benchmarks <span class='cite'>Gorishniy et al.<sup class=\"fn\">3</sup>, NeurIPS 2021</span>, and it is also the most aggressive thing on this slide.", "notes": "Two live demonstrations that pay for themselves: fit a StandardScaler on the full dataset and then cross-validate — the AUC moves. And apply a QuantileTransformer with n=40 rows, then look at what it does to a new value outside the training range.", "cites": ["Box & Cox. <i>An Analysis of Transformations.</i> JRSS-B, 1964.", "Yeo & Johnson. <i>A New Family of Power Transformations to Improve Normality or Symmetry.</i> Biometrika, 2000.", "Gorishniy et al. <i>Revisiting Deep Learning Models for Tabular Data.</i> NeurIPS, 2021."], "sec": "1.4", "secTitle": "Scaling and distributional transforms"}, {"kind": "divider", "sec": "1.5", "secTitle": "Categorical encoding", "no": "1.5", "title": "Categorical encoding", "lead": "Six schemes, one column. The choice depends on the model family, the cardinality and how much you trust your fold discipline.", "chips": ["One-hot and dummy", "Ordinal", "Contrast codings", "Count and frequency", "Target encoding", "Ordered target statistics", "Hashing", "Entity embeddings", "Dirty categories"]}, {"kind": "figure", "title": "One column, six representations", "kick": "1.5.1–1.5.8", "tag": "both", "lead": "Each encoding makes a different promise to the model about what the levels mean and how far apart they are.", "fig": "f_encodings", "figcap": "Contrast codings (effect, Helmert, backward-difference, polynomial) from the statistics tradition are a further family, mostly useful when you want the model's coefficients to answer a specific comparison. <span class='cite'>Micci-Barreca<sup class=\"fn\">1</sup> 2001 · Weinberger et al.<sup class=\"fn\">2</sup>, ICML 2009 · Guo &amp; Berkhahn<sup class=\"fn\">3</sup> 2016</span>", "notes": "The ordinal panel is the one that catches people: encoding {mild, moderate, severe} as 0/1/2 is fine; encoding {KKU, SRN, UBN, NKN} as 0/1/2/3 tells a linear model that two hospitals are three times further apart than two others. Trees survive it; linear and neural models do not.", "cites": ["Micci-Barreca. <i>A Preprocessing Scheme for High-Cardinality Categorical Attributes in Classification and….</i> SIGKDD Explorations, 2001.", "Weinberger et al. <i>Feature Hashing for Large Scale Multitask Learning.</i> ICML, 2009.", "Guo & Berkhahn. <i>Entity Embeddings of Categorical Variables.</i> 2016."], "sec": "1.5", "secTitle": "Categorical encoding"}, {"kind": "split", "title": "The leak that lives in the best encoder", "kick": "1.5.5–1.5.6, 1.5.9–1.5.10", "tag": "frontier", "wide": "text", "lead": "The strongest transformation available on a high-cardinality column is also the easiest one to compute dishonestly.", "b": ["<b>The mechanism:</b> the encoded value for a row is computed from target values that include that row's own. For a level seen once, the encoding <em>is</em> the label.", "<b>Smoothing (Micci-Barreca<sup class=\"fn\">1</sup>, 2001)</b> shrinks each level's mean towards the global mean with a prior weight. It controls variance for rare levels; it does not remove the leak.", "<b>Out-of-fold encoding</b> does remove it: compute each fold's encoding from the other folds only. An inner loop, and the minimum acceptable practice.", "<b>CatBoost's ordered target statistics</b> (Prokhorenkova et al.<sup class=\"fn\">2</sup>, NeurIPS 2018) go further: a random permutation, each row encoded from the rows before it, averaged over permutations.", "<b>Unseen levels are a policy decision.</b> Fix a minimum count, fold the rest into <span class='k'>other</span>, and define what happens when a new category first arrives in production.", "<b>Dirty and free-text categories</b> — misspelled ward names, free-typed drug strings — need similarity or min-hash encoding <span class='cite'>Cerda &amp; Varoquaux<sup class=\"fn\">3</sup>, 2020</span>, or language-model embeddings."], "fig": "f_targetleak", "figcap": "Three ways to compute the same statistic, in increasing order of honesty.", "notes": "Point out that this is leakage type L1.2 from §0.3 wearing a different hat, and that scikit-learn's TargetEncoder now does the cross-fitting for you — but only if you put it inside a Pipeline. Everyone who has done a Kaggle competition has leaked this way at least once.", "cites": ["Micci-Barreca. <i>A Preprocessing Scheme for High-Cardinality Categorical Attributes in Classification and….</i> SIGKDD Explorations, 2001.", "Prokhorenkova et al. <i>CatBoost: unbiased boosting with categorical features.</i> NeurIPS, 2018.", "Cerda & Varoquaux. <i>Encoding High-Cardinality String Categorical Variables.</i> IEEE TKDE, 2020."], "sec": "1.5", "secTitle": "Categorical encoding"}, {"kind": "divider", "sec": "1.8", "secTitle": "Feature selection and dimensionality reduction", "no": "1.8", "title": "Selection and dimensionality reduction", "lead": "Fewer columns, for a stated reason. The reason is almost never “accuracy”, and pretending otherwise is where the leakage comes from.", "chips": ["Filter", "Wrapper", "Embedded", "Boruta", "Stability selection", "SHAP and its misuse", "Multicollinearity", "PCA and friends", "UMAP", "Selection inside CV"]}, {"kind": "figure", "title": "Three families, one fatal mistake", "kick": "1.8.1–1.8.3, 1.8.10", "tag": "textbook", "lead": "Selecting features is fitting a model. Everything §0.3 says about fitting therefore applies without modification.", "fig": "f_selection", "figcap": "<b>Ambroise &amp; McLachlan<sup class=\"fn\">1</sup> (PNAS 2002)</b> is the canonical demonstration: screen genes on the full dataset, then cross-validate what survives, and you get near-zero error on data with no signal at all. Twenty-three years later it is still one of the most common errors in published applied ML.", "notes": "Run this as a two-minute live demo if you can: generate 200 rows of pure noise with 5,000 columns and a random binary label, screen the top 20 by correlation, then cross-validate. The AUC comes out around 0.8. Nothing convinces faster.", "cites": ["Ambroise & McLachlan. <i>Selection bias in gene extraction on the basis of microarray gene-expression data.</i> PNAS, 2002."], "sec": "1.8", "secTitle": "Feature selection and dimensionality reduction"}, {"kind": "cols", "title": "Doing it for the right reason", "kick": "1.8.4–1.8.9", "tag": "both", "sm": true, "lead": "Prediction, interpretation, cost and stability are four different objectives, and they select different columns.", "cols": [{"sub": "All-relevant", "h": "Boruta and shadow features", "b": ["Duplicate every feature, shuffle the copy, and keep only features that beat their own shadow", "Answers “which variables carry information?”, not “which minimal set predicts best?”", "The right tool when the goal is understanding a mechanism", "Kursa &amp; Rudnicki<sup class=\"fn\">2</sup>, 2010"]}, {"sub": "Stability", "h": "Selection frequency under subsampling", "b": ["Refit the selector on many subsamples and keep features chosen often", "Controls false discoveries in high dimensions, where a single fit is essentially arbitrary", "Also a free diagnostic: if the selected set changes wildly across folds, report that", "Meinshausen &amp; Bühlmann<sup class=\"fn\">3</sup>, <i>JRSS-B</i>, 2010"], "acc": true}, {"sub": "Attribution", "h": "SHAP-based selection, and its trap", "b": ["Popular, useful, and easy to misuse (Lundberg &amp; Lee<sup class=\"fn\">4</sup>, 2017)", "Correlated features <b>split their attribution</b>, so both look weak and both get dropped", "SHAP values are computed from a fitted model — so ranking, then refitting, then ranking again is a search you must nest", "Use it to explain, and be careful using it to choose"]}, {"sub": "Projection", "h": "PCA, factor analysis, UMAP", "b": ["PCA maximises variance, which need not be the direction of the signal — a low-variance column can be the whole outcome", "PCA is also fitted, so it belongs inside the fold like everything else", "t-SNE and UMAP (McInnes et al., 2018) are visualisation tools; their embeddings are not stable features", "Multicollinearity harms interpretation of coefficients far more than it harms prediction"]}], "notes": "The SHAP trap is worth ten minutes: two near-duplicate lab tests each get half the credit, both fall below the cut, and the model loses a signal it was using. Ask them to cluster correlated features first and select at the cluster level.", "cites": ["Hirunchavarod et al. <i>OPG-SHAP: A Dental AI Tool for Explaining Learned Orthopantomogram Image Recognition.</i> ITC-CSCC, 2024.", "Kursa & Rudnicki. <i>Feature Selection with the Boruta Package.</i> Journal of Statistical Software, 2010.", "Meinshausen & Bühlmann. <i>Stability Selection.</i> JRSS-B, 2010.", "Lundberg & Lee. <i>A Unified Approach to Interpreting Model Predictions (SHAP).</i> NeurIPS, 2017."], "sec": "1.8", "secTitle": "Feature selection and dimensionality reduction"}, {"kind": "divider", "sec": "1.9", "secTitle": "Class imbalance and cost", "no": "1.9", "title": "Class imbalance and cost", "lead": "The most contested section in this chapter. The standard answer is popular, well cited, and — for clinical risk prediction — usually wrong.", "chips": ["Framing", "Random resampling", "SMOTE and family", "Hybrid cleaning", "Where SMOTE fails", "Harm to calibration", "Class weights and thresholds", "Probability calibration", "PR, MCC, net benefit"]}, {"kind": "figure", "title": "SMOTE, and the two places it breaks", "kick": "1.9.2–1.9.5", "tag": "textbook", "lead": "Interpolating between minority neighbours is an elegant idea. Whether it is a good one depends on the geometry it interpolates through.", "fig": "f_smote", "figcap": "<b>Chawla et al.<sup class=\"fn\">1</sup> (JAIR 2002)</b> is one of the most-cited papers in applied machine learning, and deservedly so — it reframed imbalance as something you could act on. <b>Blagus &amp; Lusa<sup class=\"fn\">2</sup> (BMC Bioinformatics 2013)</b> showed that in high-dimensional settings it degenerates towards random oversampling while still biasing the majority class.", "notes": "Ask how many people have used SMOTE. Nearly every hand goes up. Then ask how many checked calibration afterwards. That gap is the next slide, and it is the most useful ten minutes in the chapter.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013.", "He et al. <i>ADASYN: Adaptive Synthetic Sampling.</i> IJCNN, 2008.", "Kovács. <i>smote-variants: a collection of oversampling techniques.</i> 2019."], "sec": "1.9", "secTitle": "Class imbalance and cost"}, {"kind": "split", "title": "Imbalance correction damages the number you care about", "kick": "1.9.6–1.9.8", "tag": "frontier", "wide": "text", "lead": "Resampling changes the base rate the model trains on. It learns that new base rate — which is not the one in your clinic.", "b": ["<b>van den Goorbergh, van Smeden, Timmerman &amp; Van<sup class=\"fn\">3</sup> Calster (2022)</b>: in simulation and in clinical data, imbalance corrections systematically <b>inflate predicted risks</b> and harm calibration.", "<b>Carriero<sup class=\"fn\">4</sup>, Luijken, de Hond, Moons, van Calster &amp; van Smeden (2024)</b> reach the same conclusion for clinical prediction models, and no gain elsewhere compensates for it.", "<b>Why AUC does not notice.</b> Ranking is invariant to a monotone shift of the scores, so the metric most people report stays flat while the probabilities become unusable.", "<b>What to do instead, in order:</b> leave the distribution alone; move the <b>decision threshold</b> to reflect the costs; use <b>class weights</b> or a cost matrix <span class='cite'>Elkan 2001</span>; then calibrate.", "<b>Calibration methods:</b> Platt scaling (1999), isotonic regression, Venn–Abers. Fit them on a held-out calibration set — never on the training fold."], "fig": "f_calib", "figcap": "The curve that a discrimination-only evaluation cannot show you.", "callout": {"h": "The exam question", "p": "“My AUC went from 0.79 to 0.80 after SMOTE, so I kept it.” What else should you have measured, and what would you expect to have happened to it?"}, "notes": "Be fair to the other side: there are settings — extreme imbalance, ranking-only use, some high-dimensional non-clinical tasks — where resampling helps. The claim is not that SMOTE is never useful; it is that for clinical risk prediction the calibration cost is real and almost never reported. Lab 3 reproduces it.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013.", "Timmerman & Van Calster. <i>The harm of class imbalance corrections for risk prediction models.</i> JAMIA, 2022.", "Carriero et al. <i>The harms of class imbalance corrections for machine-learning-based prediction models.</i> 2024."], "sec": "1.9", "secTitle": "Class imbalance and cost"}, {"kind": "table", "title": "Evaluating under imbalance", "kick": "1.9.9", "tag": "both", "sm": true, "lead": "The metric you choose decides what counts as an improvement. Under low prevalence, several familiar ones stop being informative.", "table": {"head": ["Metric", "What it actually answers", "Where it misleads"], "rows": [["ROC AUC", "Ranking: will a random positive outrank a random negative?", "Insensitive to prevalence and to calibration; looks good at 1% prevalence even when precision is hopeless"], ["PR AUC / average precision", "Ranking, weighted towards the positive class", "Baseline is the prevalence, not 0.5 — so the number is not comparable across cohorts (Saito &amp; Rehmsmeier<sup class=\"fn\">1</sup>, 2015)"], ["Accuracy", "Nothing useful under imbalance", "99% accuracy by predicting “no” forever"], ["Balanced accuracy / MCC", "Performance across both classes at one threshold", "Still a single threshold, and MCC is hard to communicate to clinicians"], ["Brier score", "Squared error of the probabilities — accuracy and calibration together", "Dominated by the majority class; decompose it into calibration and refinement"], ["Calibration curve + slope/intercept", "Are the predicted risks the actual risks?", "Needs enough events per bin; the plot is the deliverable, not a single number"], ["Decision curve analysis (net benefit)", "Is the model useful at the thresholds a clinician would act on?", "Requires you to state the threshold range — which is the point (Vickers &amp; Elkin<sup class=\"fn\">2</sup>, 2006)"]]}, "callout": {"h": "The reporting minimum for a clinical model", "p": "Discrimination (AUC with a confidence interval), calibration (curve, slope and intercept), and clinical utility (net benefit across a stated threshold range) — all three, on a held-out set that respects the grouping unit from §0.3."}, "notes": "Decision curve analysis is the one to push hardest for a health audience: it is the only metric here that requires the analyst to state what the model is for. Most theses cannot answer that question on the day of the viva.", "cites": ["Saito & Rehmsmeier. <i>The Precision-Recall Plot Is More Informative than the ROC Plot on Imbalanced Datasets.</i> PLOS ONE, 2015.", "Vickers & Elkin. <i>Decision Curve Analysis: A Novel Method for Evaluating Prediction Models.</i> Medical Decision Making, 2006."], "sec": "1.9", "secTitle": "Class imbalance and cost"}, {"kind": "bullets", "kick": "From the VI Lab", "cls": "vilab", "title": "Over-confidence, workload and where the threshold goes", "tag": "both", "lead": "Our ultrasound work ran into the same problem from the other direction: the model was not badly ranked, it was badly calibrated.", "b": ["<b>BiTNet</b> <span class='cite'>Intharah et al.<sup class=\"fn\">1</sup>, Artificial Intelligence in Medicine, 2023</span> is a hybrid deep convolutional model for ultrasound screening of the human biliary tract, developed for mass screening in the Northeast of Thailand.", "The architectural work was specifically about <b>deep-network over-confidence</b>: the modifications to EfficientNet exist because the base model's probabilities were not trustworthy enough to act on. That is a calibration problem, and it is the same problem §1.9 describes for tables.", "<b>The reported operating point is a cost decision, not an accuracy decision:</b> the system reduces radiologist workload by <b>35%</b> while holding false negatives to roughly <b>1 in 455 images</b>. You cannot choose that point from an AUC — you choose it from a threshold and a stated cost ratio.", "<b>With BiTNet as an assisting tool</b>, across 11 healthcare professionals at four experience levels, mean accuracy rose from <b>0.50 to 0.74</b> and mean precision from <b>0.46 to 0.61</b> (p&lt;0.001).", "<b>The transferable lesson:</b> the question “how do we handle the rare class?” is almost always really “what does a miss cost, and where should the threshold sit?” Resampling answers neither."], "stats": [{"v": "35%", "l": "reduction in radiologist workload"}, {"v": "~1 in 455", "l": "false negatives per image"}, {"v": "0.50 → 0.74", "l": "mean accuracy of 11 professionals"}], "notes": "Be careful to state these as what the paper reports, in its own setting, not as a general claim. The teaching value is the shape of the decision: a workload–safety trade-off chosen deliberately and reported explicitly. Ask the room what their own cost ratio is. Most have never written it down.", "cites": ["Intharah et al. <i>BiTNet: Hybrid deep convolutional model for ultrasound image analysis of human biliary tract….</i> Artificial Intelligence in Medicine, 2023."], "sec": "1.9", "secTitle": "Class imbalance and cost"}, {"kind": "refs", "title": "Section 1.9 — references", "kick": "Reading", "sm": true, "refs": ["Chawla, Bowyer, Hall &amp; Kegelmeyer. <b>SMOTE: Synthetic Minority Over-sampling Technique.</b> <i>JAIR</i>, 2002.", "He, Bai, Garcia &amp; Li. <b>ADASYN: Adaptive Synthetic Sampling.</b> <i>IJCNN</i>, 2008; Batista, Prati &amp; Monard, <b>SMOTE+Tomek / SMOTE+ENN</b>, 2004.", "Blagus &amp; Lusa. <b>SMOTE for high-dimensional class-imbalanced data.</b> <i>BMC Bioinformatics</i>, 2013.", "<b>van den Goorbergh, van Smeden, Timmerman &amp; Van Calster. The harm of class imbalance corrections for risk prediction models.</b> <i>JAMIA</i>, 2022.", "<b>Carriero, Luijken, de Hond, Moons, van Calster &amp; van Smeden. The harms of class imbalance corrections for machine-learning-based prediction models.</b> 2024.", "Elkan. <b>The Foundations of Cost-Sensitive Learning.</b> <i>IJCAI</i>, 2001; Lin et al., <b>Focal Loss</b>, <i>ICCV</i>, 2017.", "Platt. <b>Probabilistic Outputs for Support Vector Machines.</b> 1999; Niculescu-Mizil &amp; Caruana, <b>Predicting Good Probabilities with Supervised Learning</b>, <i>ICML</i>, 2005.", "Saito &amp; Rehmsmeier. <b>The Precision-Recall Plot Is More Informative than the ROC Plot on Imbalanced Datasets.</b> <i>PLOS ONE</i>, 2015.", "Vickers &amp; Elkin. <b>Decision Curve Analysis: A Novel Method for Evaluating Prediction Models.</b> <i>Medical Decision Making</i>, 2006.", "Kovács. <b>smote-variants: a collection of oversampling techniques.</b> 2019; <b>Stop Oversampling for Class Imbalance Learning</b>, arXiv:2202.03579."], "sec": "1.9", "secTitle": "Class imbalance and cost"}, {"kind": "divider", "sec": "1.11", "secTitle": "How tabular foundation models change the prep calculus", "no": "1.11", "title": "How tabular foundation models change the prep calculus", "lead": "The punchline of the chapter: the preprocessing budget is moving, and it is moving towards the things Chapter 0 taught.", "chips": ["Why trees still win", "Prior-data fitted networks", "TabPFN and TabPFN v2", "Real-TabPFN", "TabM", "TabArena and TALENT", "Repository hygiene", "What it means for teaching"]}, {"kind": "figure", "title": "In-context inference, and where the budget goes", "kick": "1.11.2–1.11.4, 1.11.7", "tag": "frontier", "lead": "TabPFN does not fit a model to your dataset. It was fitted once, to a prior over datasets, and your table is the prompt.", "fig": "f_tabpfn", "figcap": "<b>Hollmann et al.<sup class=\"fn\">2</sup><sup class=\"fn\">1</sup>, ICLR 2023;</b> TabPFN v2 in <i>Nature</i>, 2025. Related lines: <b>Real-TabPFN<sup class=\"fn\">3</sup></b> (2025) continues pretraining on real-world tables rather than purely synthetic priors, and <b>TabM</b> (Gorishniy et al.<sup class=\"fn\">4</sup>, ICLR 2025) shows parameter-efficient ensembling closes much of the gap from the neural side.", "notes": "The honest framing: TabPFN's original constraints were small tables, modest feature counts and no high-cardinality categoricals, and v2 relaxes them substantially. It is not a universal replacement. But even where it does not win, it changes what a strong baseline costs — a few seconds — and that alone changes how you plan an experiment.", "cites": ["Hollmann et al. <i>Accurate predictions on small data with a tabular foundation model (TabPFN v2).</i> Nature, 2025.", "Hollmann et al. <i>Large Language Models for Automated Data Science: Introducing CAAFE for Context-Aware Automated….</i> NeurIPS, 2023.", "Real-TabPFN. 2025.", "Gorishniy et al. <i>TabM: Advancing Tabular Deep Learning with Parameter-Efficient Ensembling.</i> ICLR, 2025."], "sec": "1.11", "secTitle": "How tabular foundation models change the prep calculus"}, {"kind": "cols", "title": "What actually changes for the person preparing the data", "kick": "1.11.5–1.11.7", "tag": "frontier", "sm": true, "lead": "Less of the mechanical work, more of the work that was always the hard part. <b>The budget is moving from making the data model-shaped to making the evaluation trustworthy</b> — which is to say, Chapter 0 is not the preamble to this course, it is the part that survives.", "cols": [{"sub": "Shrinking", "h": "The mechanical layer", "b": ["Encoding schemes: handled internally, or far less sensitive", "Scaling and power transforms: largely absorbed", "Imputation: models increasingly consume incomplete inputs directly", "Hyper-parameter search: less of it, or none in one forward pass"]}, {"sub": "Growing", "h": "The design layer", "b": ["<b>Leakage control</b> — the same eight types from §0.3, now with fewer places to hide", "<b>Target definition</b> — what counts as the outcome, over what horizon, for whom", "<b>Evaluation design</b> — the grouping unit, the temporal split, the metric that matches the decision", "<b>Cohort construction</b> — §1.12, and it is not automatable"], "acc": true}, {"sub": "New hazard", "h": "Repository hygiene", "b": ["Tschalzev et al.<sup class=\"fn\">2</sup> (2025) warn that unreflected reuse of tabular repositories — without checking provenance and the preprocessing already applied — undermines conclusions", "Many public tables arrive pre-imputed, pre-encoded and pre-split by someone whose goals were not yours", "A foundation model pretrained on such tables inherits those choices", "Ask what was done to a dataset before you got it. Usually nobody knows"]}, {"sub": "Where to look", "h": "Living benchmarks", "b": ["<b>TabArena</b> (Erickson et al.<sup class=\"fn\">4</sup>, 2025) and <b>TALENT</b> (Liu et al., <i>JMLR</i> 2025) are the current reference points", "Read their preprocessing protocols before their leaderboards — the protocol is the experiment", "Track them the way you would track DataComp for images", "And treat a leaderboard position as a hypothesis about your data, not a result"]}], "notes": "This is the intellectual centre of the chapter. Give it time. The students who take it seriously stop asking “which encoder should I use?” and start asking “what is my prediction time, and what is knowable at it?” — which is a much better question.", "cites": ["Gadre et al. <i>DataComp: In search of the next generation of multimodal datasets.</i> NeurIPS Datasets & Benchmarks, 2023.", "Tschalzev et al. <i>Unreflected use of tabular data repositories can undermine research quality.</i> 2025.", "Li et al. <i>DataComp-LM (DCLM).</i> 2024.", "Erickson et al. <i>TabArena: A Living Benchmark for Machine Learning on Tabular Data.</i> 2025."], "sec": "1.11", "secTitle": "How tabular foundation models change the prep calculus"}, {"kind": "divider", "sec": "1.12", "secTitle": "Time series and longitudinal tables", "no": "1.12", "title": "Time series and longitudinal tables", "lead": "Where the preparation decisions stop being about columns and start being about time — and where the leakage is hardest to see.", "chips": ["Alignment and resampling", "Stationarity", "Lags and rolling features", "Window leakage", "Missing values in MTS", "Irregular clinical series", "EHR cohort construction", "Temporal validation"]}, {"kind": "figure", "title": "Building an EHR cohort", "kick": "1.12.7", "tag": "textbook", "lead": "The cohort definition is the single most consequential preparation artefact in an EHR study, and it is usually a paragraph nobody checks.", "fig": "f_cohort", "figcap": "Every band on this timeline is a decision that changes the answer. Write them down as a table with the SQL beside them; that table is what makes the study reproducible, and it is what a second analyst will disagree with productively.", "notes": "Set this as an exercise: give two groups the same clinical question and the same database, ask each to write a cohort definition, then compare row counts. They will differ by a factor of two or more, and the discussion about why is the entire learning outcome.", "sec": "1.12", "secTitle": "Time series and longitudinal tables"}, {"kind": "split", "title": "Window leakage: the failure that looks like good practice", "kick": "1.12.3–1.12.4", "tag": "textbook", "wide": "text", "lead": "Lags and rolling statistics are the standard vocabulary of longitudinal features. Two of the standard defaults are wrong.", "b": ["<b>A centred rolling window uses the future by construction.</b> It is a library default, and it is invisible in code review because the line looks entirely ordinary.", "<b>Statistics computed once over the full series</b> — a target encoding, a per-patient mean, a “total admissions” count — carry post-prediction information into every row. Use expanding, as-of computations.", "<b>Resampling and interpolation are also leaks.</b> Filling forward is legitimate; interpolating between a past and a future observation is not, and neither is a symmetric filter kernel.", "<b>The label has width in time too.</b> “Died within 30 days” makes the last 30 days of any training window unknowable — hence the purge and embargo band of §0.3.8 <span class='cite'>López de Prado 2018</span>.", "<b>The one test that catches all of them:</b> name the timestamp at which each feature's value becomes computable. If you cannot name it, the feature is not ready."], "fig": "f_windowleak", "figcap": "Both failures pass every unit test you are likely to have written.", "callout": {"h": "Cheap defence", "p": "Build the feature table with an explicit <span class='k'>as_of</span> timestamp column and compute every aggregate as a function of it. Then a leaking feature becomes a type error rather than a silent optimism."}, "notes": "Ask whether anyone has a centred rolling window in their current code. Someone always does. Then ask how they would have found out — the honest answer is usually “when the prospective validation failed”, which is eighteen months later.", "sec": "1.12", "secTitle": "Time series and longitudinal tables"}, {"kind": "refs", "title": "Section 1.12 — references", "kick": "Reading", "sm": true, "refs": ["Box, Jenkins, Reinsel &amp; Ljung. <b>Time Series Analysis: Forecasting and Control.</b> 5th ed., 2015.", "López de Prado. <b>Advances in Financial Machine Learning</b>, ch. 7 — purging and embargo around the split boundary.", "Che, Purushotham, Cho, Sontag &amp; Liu. <b>Recurrent Neural Networks for Multivariate Time Series with Missing Values (GRU-D).</b> <i>Scientific Reports</i>, 2018.", "Wang et al. <b>Deep Learning for Multivariate Time Series Imputation: A Survey.</b> <i>IJCAI</i>, 2025.", "Hyndman &amp; Athanasopoulos. <b>Forecasting: Principles and Practice</b>, 3rd ed. — the practical reference for alignment, decomposition and evaluation.", "OHDSI. <b>The Book of OHDSI</b> — OMOP Common Data Model and cohort definition; HL7 <b>FHIR</b> for exchange.", "Kapoor &amp; Narayanan. <b>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</b> <i>Patterns</i>, 2023 — leakage types L3.1 and L3.2 are the temporal ones.", "Johnson et al. <b>MIMIC-III / MIMIC-IV.</b> <i>Scientific Data</i>, 2016 onward — the standard teaching database for this material."], "sec": "1.12", "secTitle": "Time series and longitudinal tables"}, {"kind": "bullets", "kick": "Paper clinic · 50 minutes", "cls": "lab", "title": "Read a clinical prediction model", "tag": "frontier", "lead": "Bring one published clinical or health-economic prediction model. A risk score, a triage tool, a readmission predictor — anything with a table and an AUC.", "b": ["<b>Score it against seven questions.</b> What was the unit of analysis? What was the split design? Was any transform fitted before the split? Was resampling used? Is a <b>calibration curve</b> shown? Is a decision-curve or net-benefit analysis shown? Was there external validation?", "<b>Fifteen minutes, in threes.</b> Compare answers across the three papers on your table. Count how many report calibration at all.", "<b>Twenty minutes, whole room.</b> Two presentations: one paper you would trust to deploy, one you would not — and the specific sentence that decided it.", "<b>The argument to rehearse:</b> if the paper used SMOTE and reports only discrimination, you can predict what happened to its calibration without rerunning anything. Say so out loud, with the citation.", "<b>Ground rule:</b> a well-calibrated model with modest AUC beats a sharp one that systematically over-predicts risk. Judge it by the decision it supports."], "callout": {"h": "Take home", "p": "For your own tabular project: plot the calibration curve, with and without any resampling you currently apply. Bring the two plots to session 3."}, "notes": "Have TRIPOD+AI open on screen. The seven questions are worth printing as a half-page handout.", "sec": "Close", "secTitle": "Clinic, takeaways and next steps", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013."]}, {"kind": "bullets", "kick": "Key takeaways", "title": "The five sentences from today", "b": ["<b>Type explicitly and define the grain first.</b> Silent object columns and one-to-many joins inflate sample size before any model exists.", "<b>The missingness mechanism decides whether imputation is even valid</b> — and in EHR data, absence of a test is a clinical decision, so the indicator can be the strongest feature.", "<b>Target encoding is the strongest encoder and the easiest leak.</b> Out-of-fold or ordered statistics, always.", "<b>Imbalance is a threshold and cost problem, not a distribution defect.</b> Resampling inflates predicted risk and damages calibration while barely helping discrimination.", "<b>The cohort definition is data preparation.</b> Index event, observation window, prediction window, washout and censoring decide the result before the model sees a row."], "callout": {"h": "On the board as they leave", "p": "If your model will be used to make a decision at a threshold, calibration is the property that matters — and the most popular fix for imbalance is the thing most likely to destroy it."}, "notes": "Land the last line. It is the single most useful thing a clinical data scientist takes from this course.", "sec": "Close", "secTitle": "Clinic, takeaways and next steps"}]}</script>
<script>
(function(){
"use strict";
function boom(e){
  try{var b=document.getElementById("err");b.style.display="block";
    b.textContent="Something broke: "+((e&&e.message)||e)+"\n"+((e&&e.stack)||"");}catch(_){}
  if(window.console)console.error(e);
}
window.addEventListener("error",function(ev){boom(ev.error||ev.message);});

try{

var D      = JSON.parse(document.getElementById("deckdata").textContent);
var SLIDES = D.slides, FIGS = D.figs, META = D.meta, SECS = D.secs || [];
var KEY    = "dpslides-"+META.key+"-v1";
var EDITS  = {}, NOTES = {};
var cur = 0, editing = false, ovOn = false, notesOn = false;
var t0 = null, tAcc = 0;

/* ---------------- storage ---------------- */
var Store = {
  get:function(){
    try{ if(window.storage&&window.storage.get)
      return window.storage.get(KEY).then(function(r){return r&&r.value?r.value:null;}).catch(function(){return null;}); }catch(e){}
    try{ return Promise.resolve(window.localStorage.getItem(KEY)); }catch(e){ return Promise.resolve(null); }
  },
  set:function(v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(KEY,v).catch(function(){}); return; } }catch(e){}
    try{ window.localStorage.setItem(KEY,v); }catch(e){}
  }
};
var svT=null;
function save(){ clearTimeout(svT); svT=setTimeout(function(){
  try{ Store.set(JSON.stringify({v:1,edits:EDITS,notes:NOTES})); }catch(e){} },350); }

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function txt(h){var d=document.createElement("div");d.innerHTML=h==null?"":h;return (d.textContent||"").trim();}
function val(i,path,dflt){ var k=i+"."+path; return (k in EDITS)?EDITS[k]:dflt; }
function ed(i,path,html,cls,tag){
  tag=tag||"div";
  return "<"+tag+' class="ed '+(cls||"")+'" data-k="'+i+"."+path+'">'+(val(i,path,html)||"")+"</"+tag+">";
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1800);}

/* ---------------- slide rendering ---------------- */
function bullets(i,arr,key,cls){
  if(!arr||!arr.length)return "";
  var h='<ul class="bul '+(cls||"")+'">';
  for(var j=0;j<arr.length;j++){
    h+='<li class="ed" data-k="'+i+"."+key+"."+j+'">'+(val(i,key+"."+j,arr[j])||"")+"</li>";
  }
  return h+"</ul>";
}
function fig(s){
  if(!s.fig)return "";
  var svg=FIGS[s.fig]||'<svg viewBox="0 0 900 380"><rect width="900" height="380" fill="#F1F5F9"/><text x="450" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#8A97A6">figure: '+esc(s.fig)+"</text></svg>";
  return svg;
}
function figblock(i,s){
  if(!s.fig)return "";
  return '<div class="figwrap col"><div class="figbox">'+fig(s)+"</div>"+
    (s.figcap?'<div class="figcap ed" data-k="'+i+'.figcap">'+val(i,"figcap",s.figcap)+"</div>":"")+"</div>";
}
function head(i,s,small){
  var h="";
  if(s.kick)h+='<p class="kick"><span class="dot"></span><span class="ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick)+"</span></p>";
  if(s.title)h+=ed(i,"title",s.title,small?"sm":"","h2");
  if(s.lead)h+=ed(i,"lead",s.lead,"lead","p");
  return h;
}
function citesHTML(i,s){
  if(!s.cites||!s.cites.length)return "";
  var h='<div class="cites">';
  for(var j=0;j<s.cites.length;j++)
    h+='<span class="c"><b>'+(j+1)+'</b><span class="ed" data-k="'+i+".cites."+j+'">'+
       val(i,"cites."+j,s.cites[j])+"</span></span>";
  return h+"</div>";
}
function foot(i,s){
  var sec=s.sec?("&sect; "+s.sec+(s.secTitle?" &nbsp;"+s.secTitle:"")):META.title;
  return '<div class="foot"><span>'+esc(META.short)+"</span><span>"+sec+'</span><span class="sp"></span>'+
    (s.tag?'<span class="tag '+s.tag+'">'+s.tag+"</span>":"")+
    "<span>"+(i+1)+" / "+SLIDES.length+"</span></div>";
}
function colsHTML(i,s){
  var n=s.cols.length,h='<div class="cols n'+n+'">';
  for(var j=0;j<n;j++){
    var c=s.cols[j];
    h+='<div class="cbox'+(c.acc?" acc":"")+'">';
    if(c.sub)h+='<div class="sub ed" data-k="'+i+".cols."+j+'.sub">'+val(i,"cols."+j+".sub",c.sub)+"</div>";
    if(c.h)h+='<h4 class="ed" data-k="'+i+".cols."+j+'.h">'+val(i,"cols."+j+".h",c.h)+"</h4>";
    if(c.p)h+='<p class="ed" data-k="'+i+".cols."+j+'.p">'+val(i,"cols."+j+".p",c.p)+"</p>";
    if(c.b&&c.b.length){
      h+='<ul class="bul">';
      for(var m=0;m<c.b.length;m++)
        h+='<li class="ed" data-k="'+i+".cols."+j+".b."+m+'">'+val(i,"cols."+j+".b."+m,c.b[m])+"</li>";
      h+="</ul>";
    }
    h+="</div>";
  }
  return h+"</div>";
}
function tableHTML(i,s){
  var h='<table class="t"><thead><tr>';
  s.table.head.forEach(function(x){h+="<th>"+x+"</th>";});
  h+="</tr></thead><tbody>";
  s.table.rows.forEach(function(r,ri){
    h+="<tr>";
    r.forEach(function(c,ci){h+='<td class="ed" data-k="'+i+".table."+ri+"."+ci+'">'+val(i,"table."+ri+"."+ci,c)+"</td>";});
    h+="</tr>";
  });
  return h+"</tbody></table>";
}
function statHTML(i,s){
  var h='<div class="stat">';
  s.stats.forEach(function(x,j){
    h+='<div><div class="v ed" data-k="'+i+".stats."+j+'.v">'+val(i,"stats."+j+".v",x.v)+"</div>"+
       '<div class="l ed" data-k="'+i+".stats."+j+'.l">'+val(i,"stats."+j+".l",x.l)+"</div></div>";
  });
  return h+"</div>";
}
function refsHTML(i,s){
  var h='<ol class="refs'+(s.refs.length>7?" two":"")+'">';
  for(var j=0;j<s.refs.length;j++)
    h+='<li class="ed" data-k="'+i+".refs."+j+'">'+val(i,"refs."+j,s.refs[j])+"</li>";
  return h+"</ol>";
}
function calloutHTML(i,s){
  return '<div class="callout"><div class="h">'+esc(s.callout.h||"Teaching point")+"</div>"+
    '<p class="ed" data-k="'+i+'.callout.p">'+val(i,"callout.p",s.callout.p)+"</p></div>";
}

function slideHTML(i){
  var s=SLIDES[i],k=s.kind||"bullets",h="";
  var cls="slide "+k+(s.cls?" "+s.cls:"");

  if(k==="title"){
    h='<div class="pad">'+
      '<p class="no ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick||"")+"</p>"+
      ed(i,"title",s.title,"","h1")+
      (s.lead?ed(i,"lead",s.lead,"dek","p"):"")+
      (s.meta?'<div class="meta ed" data-k="'+i+'.meta">'+val(i,"meta",s.meta)+"</div>":"")+
      "</div>";
  }else if(k==="divider"){
    h='<div class="pad">'+
      '<div class="n">'+esc(s.no||"")+"</div>"+
      ed(i,"title",s.title,"","h2")+
      (s.lead?ed(i,"lead",s.lead,"lead","p"):"")+
      (s.chips&&s.chips.length?'<div class="chips">'+s.chips.map(function(c){return "<span>"+esc(c)+"</span>";}).join("")+"</div>":"")+
      "</div>";
  }else{
    var inner="";
    if(k==="figure"){
      inner='<div class="body v">'+figblock(i,s).replace('class="figwrap col"','class="figwrap"')+
            (s.callout?calloutHTML(i,s):"")+"</div>";
    }else if(k==="split"||k==="splitr"){
      var left='<div class="col '+(s.wide==="text"?"wide":"")+'">'+bullets(i,s.b,"b")+
        (s.callout?calloutHTML(i,s):"")+(s.stats?statHTML(i,s):"")+"</div>";
      var right=figblock(i,s);
      if(s.wide==="text")right=right.replace('class="figwrap col"','class="figwrap col narrow"');
      inner='<div class="body">'+(k==="splitr"?right+left:left+right)+"</div>";
    }else if(k==="cols"){
      inner=colsHTML(i,s)+(s.callout?calloutHTML(i,s):"");
    }else if(k==="refs"){
      inner='<div class="body v">'+refsHTML(i,s)+"</div>";
    }else if(k==="table"){
      inner='<div class="body v">'+tableHTML(i,s)+(s.callout?calloutHTML(i,s):"")+"</div>";
    }else{
      inner='<div class="body v">'+bullets(i,s.b,"b",s.b&&s.b.length>6?"tight":"")+
        (s.stats?statHTML(i,s):"")+(s.callout?calloutHTML(i,s):"")+"</div>";
    }
    h='<div class="pad" style="flex:1;display:flex;flex-direction:column;min-height:0">'+
      head(i,s,s.sm)+'<div class="rule"></div>'+inner+citesHTML(i,s)+"</div>"+foot(i,s);
  }
  return '<section class="'+cls+'" data-i="'+i+'">'+h+
    '<div class="pnotes">'+esc(NOTES[i]||s.notes||"")+"</div></section>";
}

/* ---------------- shrink-to-fit ---------------- */
function autofit(sl){
  try{
    if(!sl)return;
    var box=sl.querySelector(".body")||sl.querySelector(".cols");
    if(!box)return;
    var foot=sl.querySelector(".foot"),cit=sl.querySelector(".cites");
    sl.style.setProperty("--k","1");
    for(var i=0;i<9;i++){
      var lim=cit?cit.getBoundingClientRect().top
              :(foot?foot.getBoundingClientRect().top:sl.getBoundingClientRect().bottom);
      var over=(box.scrollHeight>box.clientHeight+1)||(box.getBoundingClientRect().bottom>lim+1);
      var kid=false;
      var cbs=sl.querySelectorAll(".cbox");
      for(var j=0;j<cbs.length;j++)if(cbs[j].scrollHeight>cbs[j].clientHeight+1){kid=true;break;}
      if(!over&&!kid)break;
      sl.style.setProperty("--k",(1-0.035*(i+1)).toFixed(3));
    }
  }catch(e){}
}

/* ---------------- layout / scale ---------------- */
function fit(){
  var st=document.querySelector(".stage"),ho=document.getElementById("holder");
  if(!st)return;
  var pad=26;
  var sc=Math.min((st.clientWidth-pad*2)/1280,(st.clientHeight-pad*2)/720);
  if(!isFinite(sc)||sc<=0)sc=.5;
  ho.style.transform="scale("+sc+")";
}
window.addEventListener("resize",fit);

/* ---------------- render current ---------------- */
function render(){
  var ho=document.getElementById("holder");
  ho.innerHTML=slideHTML(cur);
  applyEdit();
  autofit(ho.querySelector(".slide"));
  fit();
  var s=SLIDES[cur];
  document.getElementById("secNow").innerHTML=s.sec?("&sect; "+s.sec+" &nbsp;"+(s.secTitle||"")):"";
  document.getElementById("cnt").innerHTML="<b>"+(cur+1)+"</b> / "+SLIDES.length;
  var f=document.querySelector(".fill");
  if(f)f.style.width=((cur+1)/SLIDES.length*100)+"%";
  var nb=document.getElementById("noteBox");
  if(nb)nb.value=NOTES[cur]!=null?NOTES[cur]:(SLIDES[cur].notes||"");
  var nx=document.getElementById("nxt");
  if(nx)nx.textContent=cur+1<SLIDES.length?txt(val(cur+1,"title",SLIDES[cur+1].title||"—")):"End of deck";
  if(ovOn)markOv();
  if(location.hash!=="#"+(cur+1))history.replaceState(null,"","#"+(cur+1));
}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur){render();return;}
  cur=i;render();
}
function applyEdit(){
  var els=document.querySelectorAll("#holder .ed");
  for(var i=0;i<els.length;i++){
    if(editing)els[i].setAttribute("contenteditable","true");
    else els[i].removeAttribute("contenteditable");
  }
}

/* ---------------- overview ---------------- */
function buildOv(){
  var g=document.getElementById("ovgrid"),h="",lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    var sk=(s.sec||"")+"|"+(s.secTitle||"");
    if(sk!==lastSec){
      lastSec=sk;
      h+='<div class="ovsec">'+(s.sec?esc(s.sec)+" &nbsp; "+esc(s.secTitle||""):esc(META.short))+"</div>";
    }
    h+='<div class="ovc" data-go="'+i+'"><div class="shell" data-shell><div class="mini" data-mini>'+
      slideHTML(i)+'</div></div><div class="no">'+(i+1)+'</div><div class="lb">'+
      esc(txt(val(i,"title",s.title||""))||(s.kind==="divider"?"Section":"Slide"))+"</div></div>";
  }
  g.innerHTML=h;
  var ms=g.querySelectorAll(".mini .slide");
  for(var q=0;q<ms.length;q++)autofit(ms[q]);
  // scale minis
  var cards=g.querySelectorAll(".ovc");
  for(var j=0;j<cards.length;j++){
    var shell=cards[j].querySelector("[data-shell]"),mini=cards[j].querySelector("[data-mini]");
    var w=cards[j].clientWidth||232,sc=w/1280;
    mini.style.transform="scale("+sc+")";
    shell.style.height=(720*sc)+"px";
  }
  markOv();
}
function markOv(){
  var cards=document.querySelectorAll(".ovc");
  for(var i=0;i<cards.length;i++)cards[i].classList.toggle("cur",+cards[i].getAttribute("data-go")===cur);
  var c=document.querySelector(".ovc.cur");
  if(c)c.scrollIntoView({block:"nearest"});
}

/* ---------------- export ---------------- */
function toMarkdown(){
  var L=[];
  L.push("# "+META.title);
  L.push("");
  L.push("_"+META.short+" · "+SLIDES.length+" slides · exported from the editable HTML deck._");
  L.push("");
  var lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    if(s.sec&&s.sec!==lastSec){lastSec=s.sec;L.push("");L.push("## "+s.sec+" "+(s.secTitle||""));L.push("");}
    var t=txt(val(i,"title",s.title||""));
    L.push("### ["+(i+1)+"] "+(t||"(untitled)"));
    var ld=txt(val(i,"lead",s.lead||""));
    if(ld)L.push("");
    if(ld)L.push("_"+ld+"_");
    if(s.b&&s.b.length){L.push("");for(var j=0;j<s.b.length;j++)L.push("- "+txt(val(i,"b."+j,s.b[j])));}
    if(s.cols)s.cols.forEach(function(c,j){
      L.push("");L.push("**"+txt(val(i,"cols."+j+".h",c.h||""))+"**");
      var p=txt(val(i,"cols."+j+".p",c.p||""));if(p)L.push(p);
      (c.b||[]).forEach(function(x,m){L.push("- "+txt(val(i,"cols."+j+".b."+m,x)));});
    });
    if(s.table){L.push("");L.push("| "+s.table.head.join(" | ")+" |");
      L.push("|"+s.table.head.map(function(){return "---";}).join("|")+"|");
      s.table.rows.forEach(function(r,ri){L.push("| "+r.map(function(c,ci){
        return txt(val(i,"table."+ri+"."+ci,c));}).join(" | ")+" |");});}
    if(s.stats){L.push("");s.stats.forEach(function(x,j){
      L.push("- **"+txt(val(i,"stats."+j+".v",x.v))+"** — "+txt(val(i,"stats."+j+".l",x.l)));});}
    if(s.callout){L.push("");L.push("> **"+(s.callout.h||"Teaching point")+".** "+txt(val(i,"callout.p",s.callout.p)));}
    if(s.figcap){L.push("");L.push("_Figure: "+txt(val(i,"figcap",s.figcap))+"_");}
    if(s.refs){L.push("");s.refs.forEach(function(r,j){L.push((j+1)+". "+txt(val(i,"refs."+j,r)));});}
    if(s.cites&&s.cites.length){L.push("");
      L.push("_Sources: "+s.cites.map(function(c,j){
        return "["+(j+1)+"] "+txt(val(i,"cites."+j,c));}).join(" · ")+"_");}
    var nt=(NOTES[i]!=null?NOTES[i]:(s.notes||"")).trim();
    if(nt){L.push("");L.push("> **Speaker notes.** "+nt.replace(/\n/g," "));}
    L.push("");
  }
  return L.join("\n");
}
function openModal(title,text,name,mode){
  var m=document.getElementById("modal");
  document.getElementById("mTitle").textContent=title;
  var body=document.getElementById("mBody");
  if(mode==="help"){ body.innerHTML=HELP; }
  else{
    body.innerHTML='<textarea id="mText" spellcheck="false"></textarea>';
    var ta=document.getElementById("mText");ta.value=text;ta.setAttribute("data-name",name||"export.txt");
  }
  document.querySelector('[data-act="mcopy"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mdl"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mload"]').style.display=mode==="import"?"":"none";
  m.classList.add("on");
}
var HELP='<div class="help"><h4>Moving around</h4><table>'+
  '<tr><td><kbd>&rarr;</kbd> <kbd>&larr;</kbd> <kbd>Space</kbd></td><td>Next / previous slide</td></tr>'+
  '<tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>First / last slide</td></tr>'+
  '<tr><td><kbd>O</kbd></td><td>Overview grid of every slide, click one to jump</td></tr>'+
  '<tr><td><kbd>/</kbd></td><td>Search titles, bullets, references and your notes</td></tr>'+
  '<tr><td>number then <kbd>Enter</kbd></td><td>Jump to that slide</td></tr>'+
  '<tr><td><kbd>F</kbd></td><td>Fullscreen</td></tr></table>'+
  '<h4>Teaching and editing</h4><table>'+
  '<tr><td><kbd>E</kbd></td><td>Edit mode: click any heading, bullet, caption, table cell or reference and rewrite it</td></tr>'+
  '<tr><td><kbd>N</kbd></td><td>Speaker-notes panel, with the next slide title shown above it</td></tr>'+
  '<tr><td><kbd>T</kbd></td><td>Start / pause the lecture timer</td></tr>'+
  '<tr><td><kbd>P</kbd></td><td>Print or save as PDF, one slide per page with notes underneath</td></tr>'+
  '</table><h4>Keeping your work</h4><table>'+
  '<tr><td>Autosave</td><td>Edits and notes save to this browser automatically</td></tr>'+
  '<tr><td>Export</td><td>Markdown for handouts and lecture prep, JSON as a portable backup</td></tr>'+
  '<tr><td>Import</td><td>Paste a JSON backup to move your edits to another machine</td></tr>'+
  '</table></div>';

/* ---------------- search ---------------- */
function slideText(i){
  var s=SLIDES[i],parts=[txt(val(i,"title",s.title||"")),txt(val(i,"lead",s.lead||""))];
  (s.b||[]).forEach(function(x,j){parts.push(txt(val(i,"b."+j,x)));});
  (s.refs||[]).forEach(function(x,j){parts.push(txt(val(i,"refs."+j,x)));});
  (s.cols||[]).forEach(function(c,j){parts.push(txt(val(i,"cols."+j+".h",c.h||"")));
    parts.push(txt(val(i,"cols."+j+".p",c.p||"")));
    (c.b||[]).forEach(function(x,m){parts.push(txt(val(i,"cols."+j+".b."+m,x)));});});
  if(s.table)s.table.rows.forEach(function(r,ri){r.forEach(function(c,ci){
    parts.push(txt(val(i,"table."+ri+"."+ci,c)));});});
  if(s.figcap)parts.push(txt(val(i,"figcap",s.figcap)));
  (s.cites||[]).forEach(function(c,j){parts.push(txt(val(i,"cites."+j,c)));});
  if(s.callout)parts.push(txt(val(i,"callout.p",s.callout.p)));
  parts.push(NOTES[i]||s.notes||"");
  parts.push(s.sec||"",s.secTitle||"");
  return parts.join("  ");
}
function doSearch(q){
  var box=document.getElementById("sres");
  q=(q||"").trim();
  if(q.length<2){box.innerHTML="";return;}
  var lq=q.toLowerCase(),h="",n=0;
  for(var i=0;i<SLIDES.length&&n<40;i++){
    var t=slideText(i),p=t.toLowerCase().indexOf(lq);
    if(p<0)continue;
    n++;
    var a=Math.max(0,p-46),snip=esc(t.slice(a,p))+"<mark>"+esc(t.slice(p,p+q.length))+"</mark>"+esc(t.slice(p+q.length,p+q.length+80));
    h+='<button data-go="'+i+'"><span class="n">slide '+(i+1)+(SLIDES[i].sec?" &nbsp;&sect; "+esc(SLIDES[i].sec):"")+
       '</span><div class="t">'+esc(txt(val(i,"title",SLIDES[i].title||"")))+'</div><div class="n" style="margin-top:3px">'+
       (a>0?"…":"")+snip+"…</div></button>";
  }
  box.innerHTML=h||'<button style="cursor:default"><span class="n">no match</span></button>';
}

/* ---------------- timer ---------------- */
function tick(){
  var el=document.querySelector(".timer");if(!el)return;
  var ms=tAcc+(t0?(Date.now()-t0):0),s=Math.floor(ms/1000);
  el.textContent=(t0?"":"⏸ ")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
setInterval(tick,500);

/* ---------------- events ---------------- */
document.addEventListener("click",function(ev){
try{
  var t=ev.target;
  var g=t.closest?t.closest("[data-go]"):null;
  if(g){ go(+g.getAttribute("data-go"));
    if(ovOn)setOv(false);
    document.body.classList.remove("srch-on");
    return; }
  var b=t.closest?t.closest("[data-act]"):null;
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="next"){go(cur+1);return;}
  if(a==="prev"){go(cur-1);return;}
  if(a==="ov"){setOv(!ovOn);return;}
  if(a==="notes"){notesOn=!notesOn;document.body.classList.toggle("notes-on",notesOn);
    b.setAttribute("aria-pressed",String(notesOn));fit();return;}
  if(a==="edit"){editing=!editing;document.body.classList.toggle("edit",editing);
    b.setAttribute("aria-pressed",String(editing));applyEdit();
    toast(editing?"Edit mode on — click any text to rewrite it":"Edit mode off");return;}
  if(a==="search"){document.body.classList.toggle("srch-on");
    if(document.body.classList.contains("srch-on"))document.getElementById("q").focus();return;}
  if(a==="print"){printAll();return;}
  if(a==="help"){openModal("Keyboard and features","","","help");return;}
  if(a==="hub"){window.location.href=META.hub;return;}
  if(a==="export"){
    openModal("Export — Markdown",toMarkdown(),META.key+"-slides.md");
    document.getElementById("mSeg").innerHTML=
      '<button class="mbtn" data-act="expmd">Markdown</button>'+
      '<button class="mbtn" data-act="expjson">JSON backup</button>'+
      '<button class="mbtn" data-act="expimp">Import…</button>';
    return;}
  if(a==="expmd"){document.getElementById("mTitle").textContent="Export — Markdown";
    var t1=document.getElementById("mText");if(t1){t1.value=toMarkdown();t1.setAttribute("data-name",META.key+"-slides.md");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expjson"){document.getElementById("mTitle").textContent="Export — JSON backup";
    var t2=document.getElementById("mText");if(t2){t2.value=JSON.stringify({v:1,edits:EDITS,notes:NOTES},null,2);
      t2.setAttribute("data-name",META.key+"-backup.json");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expimp"){document.getElementById("mTitle").textContent="Import — paste a JSON backup, then Load";
    var t3=document.getElementById("mText");if(t3)t3.value="";
    document.querySelector('[data-act="mload"]').style.display="";return;}
  if(a==="mload"){
    try{ var o=JSON.parse(document.getElementById("mText").value);
      EDITS=o.edits||{};NOTES=o.notes||{};save();render();
      document.getElementById("modal").classList.remove("on");toast("Backup loaded");
    }catch(e){toast("That is not valid JSON");}
    return;}
  if(a==="mclose"){document.getElementById("modal").classList.remove("on");return;}
  if(a==="mcopy"){var ta=document.getElementById("mText");if(!ta)return;
    ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast("Copied");},function(){toast("Select and copy manually");});
    else toast(ok?"Copied to clipboard":"Select and copy manually");return;}
  if(a==="mdl"){var ta2=document.getElementById("mText");if(!ta2)return;
    var nm=ta2.getAttribute("data-name")||"export.txt";
    var bl=new Blob([ta2.value],{type:"text/plain;charset=utf-8"});
    var A=document.createElement("a");A.href=URL.createObjectURL(bl);A.download=nm;
    document.body.appendChild(A);A.click();A.remove();toast("Downloaded "+nm);return;}
}catch(e){boom(e);}
},false);

function setOv(on){
  ovOn=on;document.body.classList.toggle("ov-on",on);
  var b=document.querySelector('[data-act="ov"]');if(b)b.setAttribute("aria-pressed",String(on));
  if(on)buildOv();
}
function printAll(){
  var ho=document.getElementById("holder"),h="";
  for(var i=0;i<SLIDES.length;i++)h+=slideHTML(i);
  ho.innerHTML=h;ho.style.transform="none";
  var ps=ho.querySelectorAll(".slide");
  for(var q=0;q<ps.length;q++)autofit(ps[q]);
  document.body.classList.add("handout");
  window.print();
  setTimeout(function(){document.body.classList.remove("handout");render();},400);
}

/* progress bar click */
document.addEventListener("mousedown",function(ev){
  var tr=ev.target.closest?ev.target.closest(".track"):null;
  if(!tr)return;
  var r=tr.getBoundingClientRect();
  go(Math.round((ev.clientX-r.left)/r.width*(SLIDES.length-1)));
});

/* edits */
document.addEventListener("focusout",function(ev){
  try{
    var t=ev.target;
    if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
      var k=t.getAttribute("data-k");
      if(k){EDITS[k]=t.innerHTML.trim();save();}
    }
  }catch(e){boom(e);}
},true);
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="noteBox"){NOTES[cur]=t.value;save();return;}
  if(t.id==="q"){doSearch(t.value);return;}
});
document.addEventListener("paste",function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
    ev.preventDefault();
    var s=(ev.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,s);
  }
});

/* keys */
var numBuf="";
document.addEventListener("keydown",function(ev){
try{
  var tag=(ev.target.tagName||"").toLowerCase();
  var typing=ev.target.isContentEditable||tag==="input"||tag==="textarea";
  if(ev.key==="Escape"){
    document.getElementById("modal").classList.remove("on");
    document.body.classList.remove("srch-on");
    if(ovOn)setOv(false);
    if(ev.target.isContentEditable)ev.target.blur();
    return;
  }
  if(typing){
    if(ev.target.id==="q"&&ev.key==="Enter"){
      var f=document.querySelector("#sres [data-go]");
      if(f){go(+f.getAttribute("data-go"));document.body.classList.remove("srch-on");}
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==="ArrowRight"||ev.key==="PageDown"||ev.key===" "){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="ArrowDown"){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="Home"){ev.preventDefault();go(0);return;}
  if(ev.key==="End"){ev.preventDefault();go(SLIDES.length-1);return;}
  if(ev.key>="0"&&ev.key<="9"){numBuf+=ev.key;return;}
  if(ev.key==="Enter"&&numBuf){go(parseInt(numBuf,10)-1);numBuf="";return;}
  var k=ev.key.toLowerCase();
  numBuf="";
  if(k==="o"){setOv(!ovOn);return;}
  if(k==="n"){document.querySelector('[data-act="notes"]').click();return;}
  if(k==="e"){document.querySelector('[data-act="edit"]').click();return;}
  if(k==="p"){ev.preventDefault();printAll();return;}
  if(k==="/"||k==="?"){ev.preventDefault();
    if(ev.key==="?"){openModal("Keyboard and features","","","help");return;}
    document.body.classList.add("srch-on");document.getElementById("q").focus();return;}
  if(k==="t"){ if(t0){tAcc+=Date.now()-t0;t0=null;}else{t0=Date.now();} tick(); return;}
  if(k==="f"){ if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); return;}
}catch(e){boom(e);}
},false);

/* progress bar dom */
(function(){
  var p=document.createElement("div");p.className="prog";
  var ticks="";
  for(var i=0;i<SLIDES.length;i++){
    if(SLIDES[i].kind==="divider")ticks+='<i style="left:'+(i/(SLIDES.length-1)*100)+'%"></i>';
  }
  p.innerHTML='<span class="hint">&larr;/&rarr; move &nbsp;·&nbsp; O overview &nbsp;·&nbsp; E edit &nbsp;·&nbsp; N notes &nbsp;·&nbsp; T timer &nbsp;·&nbsp; ? help</span>'+
    '<div class="track"><div class="ticks">'+ticks+'</div><div class="fill"></div></div>'+
    '<span class="timer">⏸ 00:00</span>';
  document.body.appendChild(p);
})();

/* boot */
Store.get().then(function(raw){
  try{ if(raw){var o=JSON.parse(raw);EDITS=o.edits||{};NOTES=o.notes||{};} }catch(e){}
  var h=parseInt((location.hash||"").replace("#",""),10);
  if(h>0&&h<=SLIDES.length)cur=h-1;
  render();
  if(raw)toast("Your saved edits and notes are back");
}).catch(function(){render();});

}catch(e){boom(e);}
})();
</script>
</body>
