00\" font-family=\"IBM Plex Mono,monospace\">100 + 100</text><text x=\"150\" y=\"322\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">good / failed, for QC eval</text><rect x=\"398\" y=\"208\" width=\"356\" height=\"132\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"416\" y=\"236\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Why QC is a separate model</text><text x=\"416\" y=\"260\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A blurred or half-framed strip is not a hard</text><text x=\"416\" y=\"276\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">example, it is an un-answerable one. Rejecting</text><text x=\"416\" y=\"292\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">it at capture time is cheaper and safer than</text><text x=\"416\" y=\"308\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">asking the grading model to be robust to it.</text><rect x=\"766\" y=\"208\" width=\"356\" height=\"132\" rx=\"9\" fill=\"#FAEEF2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"784\" y=\"236\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">The transferable lesson</text><text x=\"784\" y=\"260\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">In a field deployment, the largest quality</text><text x=\"784\" y=\"276\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">gains come from refusing bad input, not from a</text><text x=\"784\" y=\"292\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">better classifier. Budget annotation for the</text><text x=\"784\" y=\"308\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">gate, not only for the task.</text><text x=\"575.0\" y=\"380\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Junsawang, Techasen, Wiratchawa, Wanna, Wongphutorn, Worasith, Sithithaworn, Bulathwela &amp; Intharah, Scientific Reports 15:31062 (2025)</text><text x=\"575.0\" y=\"418\" font-size=\"13\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Ask the room: what is the equivalent “refuse to answer” gate in your project, and who currently plays that role?</text></svg>", "f_walkforward": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Temporal validation: walk forward, and cut a hole around the boundary</text><rect x=\"90\" y=\"60\" width=\"306.0\" height=\"38\" rx=\"5\" fill=\"#C6D3DF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"243.0\" y=\"84\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train</text><rect x=\"396.0\" y=\"60\" width=\"40.5\" height=\"38\" rx=\"5\" fill=\"#F0E2C8\" stroke=\"#8A6A12\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><rect x=\"436.5\" y=\"60\" width=\"117.0\" height=\"38\" rx=\"5\" fill=\"#A3384F\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"495.0\" y=\"84\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">test</text><rect x=\"553.5\" y=\"60\" width=\"436.4999999999999\" height=\"38\" rx=\"5\" fill=\"#F1F4F7\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><text x=\"76\" y=\"84\" font-size=\"11\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">fold 1</text><rect x=\"90\" y=\"122\" width=\"423.0\" height=\"38\" rx=\"5\" fill=\"#C6D3DF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"301.5\" y=\"146\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train</text><rect x=\"513.0\" y=\"122\" width=\"40.5\" height=\"38\" rx=\"5\" fill=\"#F0E2C8\" stroke=\"#8A6A12\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><rect x=\"553.5\" y=\"122\" width=\"117.0\" height=\"38\" rx=\"5\" fill=\"#A3384F\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"612.0\" y=\"146\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">test</text><rect x=\"670.5\" y=\"122\" width=\"319.50000000000006\" height=\"38\" rx=\"5\" fill=\"#F1F4F7\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><text x=\"76\" y=\"146\" font-size=\"11\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">fold 2</text><rect x=\"90\" y=\"184\" width=\"540.0000000000001\" height=\"38\" rx=\"5\" fill=\"#C6D3DF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"360.00000000000006\" y=\"208\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train</text><rect x=\"630.0000000000001\" y=\"184\" width=\"40.5\" height=\"38\" rx=\"5\" fill=\"#F0E2C8\" stroke=\"#8A6A12\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><rect x=\"670.5000000000001\" y=\"184\" width=\"117.0\" height=\"38\" rx=\"5\" fill=\"#A3384F\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"729.0000000000001\" y=\"208\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">test</text><rect x=\"787.5000000000001\" y=\"184\" width=\"202.49999999999994\" height=\"38\" rx=\"5\" fill=\"#F1F4F7\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><text x=\"76\" y=\"208\" font-size=\"11\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">fold 3</text><rect x=\"90\" y=\"246\" width=\"657.0\" height=\"38\" rx=\"5\" fill=\"#C6D3DF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"418.5\" y=\"270\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">train</text><rect x=\"747.0\" y=\"246\" width=\"40.5\" height=\"38\" rx=\"5\" fill=\"#F0E2C8\" stroke=\"#8A6A12\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><rect x=\"787.5\" y=\"246\" width=\"117.0\" height=\"38\" rx=\"5\" fill=\"#A3384F\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"846.0\" y=\"270\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">test</text><rect x=\"904.5\" y=\"246\" width=\"85.50000000000003\" height=\"38\" rx=\"5\" fill=\"#F1F4F7\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><text x=\"76\" y=\"270\" font-size=\"11\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">fold 4</text><text x=\"414.0\" y=\"48\" font-size=\"11\" text-anchor=\"middle\" fill=\"#8A6A12\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">purge / embargo</text><path d=\"M414.0 54 L411.9578640911187 59.445695757016686\" fill=\"none\" stroke=\"#8A6A12\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M409.5 66.0 L416.8 59.1 L408.5 56.0 z\" fill=\"#8A6A12\"/><line x1=\"90\" y1=\"316\" x2=\"990\" y2=\"316\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M970 316 L993.0 316.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M1000.0 316.0 L991.0 311.6 L991.0 320.4 z\" fill=\"#8494A5\"/><text x=\"540.0\" y=\"338\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">calendar time</text><rect x=\"16\" y=\"358\" width=\"552\" height=\"88\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"386\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Why the gap exists</text><text x=\"36\" y=\"408\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Any feature computed over a window that straddles the boundary — a</text><text x=\"36\" y=\"424\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">30-day rolling mean, a centred filter, a label defined by a future</text><text x=\"36\" y=\"440\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">event — leaks the test period into training.</text><rect x=\"582\" y=\"358\" width=\"552\" height=\"88\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"602\" y=\"386\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">The two classic silent failures</text><text x=\"602\" y=\"408\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A centred rolling window (uses the future by construction), and target</text><text x=\"602\" y=\"424\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">encoding computed over the whole series. Both look like ordinary</text><text x=\"602\" y=\"440\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">feature engineering.</text></svg>"}, "slides": [{"kind": "title", "kick": "Condensed edition · five three-hour classes", "title": "Getting a number you can defend", "lead": "Framing, data quality, and the evaluation hygiene that decides whether anything you do in the next four sessions produced a real result.", "meta": "<b>Session 1 of 5</b> &nbsp;·&nbsp; Data Preparation for Machine Learning and AI<br>Thanapong Intharah &nbsp;·&nbsp; Visual Intelligence Laboratory &nbsp;·&nbsp; Khon Kaen University<br>2 h lecture + 1 h paper clinic &nbsp;·&nbsp; long-form reference: Chapter 0, §0.1–§0.3", "notes": "Open by asking how the room currently splits data. Almost everyone says random 80/20. Hold that answer — it will look different by the end of block B."}, {"kind": "cols", "kick": "Learning outcomes", "sm": true, "title": "What you should be able to do by the end of today", "cols": [{"sub": "Diagnose", "h": "Find the leak in someone else's pipeline", "b": ["Name the split design a claim requires, and say why", "Apply the eight-type leakage taxonomy to a published paper", "Spot preprocessing fitted outside the fold"]}, {"sub": "Measure", "h": "Put a number on data quality", "b": ["Turn the six quality dimensions into computable, failing tests", "Choose a drift statistic and state its caveat", "Audit a corpus instead of trusting its README"]}, {"sub": "Decide", "h": "Commit before you touch the data", "b": ["Fix the task, the unit of analysis, the metric and the deployment constraint", "Derive the split and the grain from that unit", "Report both the naive and the honest number"], "acc": true}, {"sub": "Defend", "h": "Write it down so a reviewer can check", "b": ["Fill in a model info sheet, per leakage type", "State what your validation gate asserts, and what makes it fail", "Carry these habits into sessions 2–4"]}], "notes": "These four verbs recur in every session and in the assessment rubric."}, {"kind": "table", "kick": "Run sheet", "title": "How the three hours run", "sm": true, "table": {"head": ["Block", "Clock", "What happens"], "rows": [["Lecture A", "0:00 – 1:05", "Framing and data quality — why preparation is now the experimental variable, and how to make quality computable"], ["Break", "1:05 – 1:20", "Coffee. Use it: the second block is the harder one."], ["Lecture B", "1:20 – 2:10", "Splitting and leakage — split designs, cross-validation, the eight leakage types, and the optimism gap"], ["Paper clinic", "2:10 – 3:00", "Find the leakage: each student brings one applied-ML paper from their own field."]]}, "callout": {"h": "Deck controls", "p": "<b>E</b> edit any line in place &nbsp;·&nbsp; <b>N</b> speaker notes &nbsp;·&nbsp; <b>O</b> slide grid &nbsp;·&nbsp; <b>T</b> timer &nbsp;·&nbsp; <b>/</b> search &nbsp;·&nbsp; <b>P</b> print a handout with notes underneath each slide."}, "notes": "Start the timer (T) at the top of the hour. The clinic is not optional padding — it is where the lecture material becomes a skill."}, {"kind": "split", "sec": "0.0", "secTitle": "Why this chapter comes first", "kick": "Orientation", "title": "Why this chapter comes first", "lead": "The tabular, text and image chapters are technique catalogues. This one is the discipline that decides whether any of those techniques produced a real number.", "b": ["Every later chapter has a step where a transform is fitted. <b>Where</b> you fit it is decided here.", "Every later chapter has labels. <b>How much you trust them</b> is decided here.", "Every later chapter reduces data — filtering, deduplication, pruning, resampling. Whether that reduction was a <b>sampling decision with a victim</b> is decided here.", "And every later chapter produces a claim someone will try to reproduce."], "fig": "f_crisp", "figcap": "<b>CRISP-DM, 1996/2000.</b> Still the best shared vocabulary for where preparation sits. Its blind spots are the reason this course exists.", "callout": {"h": "The organising claim", "p": "Curation choices now drive downstream performance at least as much as architecture — so they need the same evaluation rigour we already demand of models."}, "notes": "The two highlighted phases in the diagram are the whole course. Point out what CRISP-DM does NOT model: labels as an object of study, corpus-scale curation, and preparation as the main experimental variable.", "cites": ["Chapman et al. <i>CRISP-DM 1.0 Step-by-step data mining guide.</i> 2000."]}, {"kind": "divider", "sec": "0.1", "secTitle": "Framing: where preparation sits", "no": "0.1", "title": "Framing: where preparation sits", "lead": "Before any technique: what problem are we actually solving, and against what metric?", "chips": ["The data-centric turn", "Three-goal decomposition", "CRISP-DM and its limits", "The 80% folklore", "Task-first design", "DC-Check", "Automated preparation"]}, {"kind": "figure", "title": "The data-centric turn", "kick": "0.1.1", "tag": "frontier", "lead": "Same compute budget. The difference is which of the two things you hold constant.", "fig": "f_datacentric", "figcap": "Andrew Ng's framing, formalised in the data-centric AI surveys. The claim is not that architecture stopped mattering — it is that at a fixed model, systematic data improvement is now the higher-yield lever, and it is far less explored.", "notes": "Ask: in your last project, how many hours went to the left loop and how many to the right? Nearly everyone reports the left. That asymmetry is the opportunity.", "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "figure", "title": "Three goals that get collapsed into one", "kick": "0.1.2", "tag": "frontier", "lead": "Zha et al.<sup class=\"fn\">1</sup> split data work into three problems with three different success criteria. Keeping them apart is most of the discipline.", "fig": "f_threegoal", "figcap": "<b>Teaching use:</b> when a student says “I improved the data”, ask which of the three columns they mean, and which metric moved.", "notes": "The classic student failure: improve training data, evaluate on an inference set built from the same contaminated pool, and report a gain that is really an overlap.", "cites": ["Zha et al. <i>Data-centric Artificial Intelligence: A Survey.</i> ACM Computing Surveys, 2025."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "bullets", "title": "The “80% of the time” claim, and how to replace it", "kick": "0.1.3–0.1.4", "tag": "textbook", "lead": "The number is folklore repeated from industry surveys with small, self-selected samples. It is a useful conversation opener and a bad citation.", "b": ["<b>What it gets right:</b> preparation dominates the calendar in most applied projects, and it is undervalued in publication.", "<b>What it hides:</b> the fraction varies enormously by data family. A curated tabular benchmark is not a hospital PACS export.", "<b>Better move:</b> measure it in your own project. Log hours against CRISP-DM phases for one term and report your own number in the capstone.", "<b>Even better:</b> log <em>rework</em> hours separately — time spent redoing preparation after a downstream discovery. That is the number that motivates validation gates.", "This is also the honest answer when a reviewer asks why a data paper deserves a slot: because the effort is real and currently invisible."], "callout": {"h": "Habit to build", "p": "Whenever you meet a striking quantitative claim in this course, ask three questions: who measured it, on what sample, and were they the same people who benefit from the answer? Several claims in the later chapters are the dataset authors' own ablations."}, "notes": "This slide is where you set the epistemic tone for the whole module.", "cites": ["Chapman et al. <i>CRISP-DM 1.0 Step-by-step data mining guide.</i> 2000."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "cols", "title": "Task-first design, and DC-Check as a project gate", "kick": "0.1.5–0.1.6", "tag": "both", "sm": true, "lead": "Every transform should be traceable to a decision you already made about the task. If it is not, you are decorating.", "cols": [{"sub": "Decide first", "h": "Four commitments before you touch the data", "b": ["<b>Downstream task</b> — classification, ranking, segmentation, generation?", "<b>Unit of analysis</b> — patient, visit, image, camera-hour, document, chunk?", "<b>Evaluation metric</b> — and the decision it stands in for", "<b>Deployment constraint</b> — latency, device, who acts on the output"]}, {"sub": "Then derive", "h": "Each one constrains the preparation", "b": ["The unit of analysis fixes the <b>split design</b> and the join grain", "The metric fixes whether <b>calibration</b> matters or only ranking", "The deployment constraint fixes the <b>preprocessing budget</b> at inference", "The task fixes what counts as an <b>outlier</b> versus a rare event"], "acc": true}, {"sub": "Then check", "h": "DC-Check, stage by stage", "b": ["A data-centric checklist answered <em>before</em> building, not after", "Forces the uncomfortable questions early: provenance, subgroup coverage, drift plan", "Works well as the first deliverable of a research project", "Seedat<sup class=\"fn\">1</sup>, Imrie & van der Schaar, 2022"]}], "notes": "Make the four commitments a required section of the project proposal. Students who skip them produce the leakage you will diagnose in week 2.", "cites": ["Seedat & Imrie. <i>DC-Check: A Data-Centric AI Checklist to Guide the Development of Reliable Machine Learning….</i> 2022."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "split", "title": "Automated data preparation, and why it lags AutoML", "kick": "0.1.7", "tag": "frontier", "wide": "text", "lead": "Model search is largely solved as an engineering problem. Preparation search is not, and the reasons are instructive.", "b": ["<b>The search space is not closed.</b> A model space is a set of known architectures; a preparation space includes “construct a feature nobody has named yet”.", "<b>The objective is not scalar.</b> Fidelity, fairness, privacy and cost all move, and a single validation score hides three of them.", "<b>Order matters and is not commutative.</b> Impute-then-scale differs from scale-then-impute; filter ordering changes corpus composition.", "<b>Validation is fragile.</b> The thing being searched is the thing that leaks — so a naive AutoML loop over preprocessing overfits the validation set faster than model search does.", "<b>Where it works today:</b> constrained, well-typed pipelines with strong fold discipline. Treat published pipeline-search results with the same scepticism you apply to any tuned number."], "fig": "f_validgate", "figcap": "Any automated search is only as honest as the gate it must pass through.", "notes": "Good thesis territory: pipeline optimisation with a multi-objective criterion and nested validation.", "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "refs", "title": "Section 0.1 — references", "kick": "Reading", "sm": true, "refs": ["Zha, Bhat, Lai, Yang, Jiang, Zhong &amp; Hu. <b>Data-centric Artificial Intelligence: A Survey.</b> <i>ACM Computing Surveys</i>, 2025 (arXiv:2303.10158).", "Jakubik, Vössing, Kühl, Walk &amp; Satzger. <b>Data-centric Artificial Intelligence.</b> 2024 (arXiv:2212.11854).", "Seedat, Imrie &amp; van der Schaar. <b>DC-Check: A Data-Centric AI Checklist to Guide the Development of Reliable Machine Learning Systems.</b> 2022.", "Chapman et al. <b>CRISP-DM 1.0 Step-by-step data mining guide.</b> 2000; Fayyad, Piatetsky-Shapiro &amp; Smyth, <b>From Data Mining to Knowledge Discovery.</b> <i>AI Magazine</i>, 1996.", "Whang, Roh, Song &amp; Lee. <b>Data Collection and Quality Challenges in Deep Learning: A Data-Centric AI Perspective.</b> <i>VLDB Journal</i>, 2023.", "Mazumder et al. <b>DataPerf: Benchmarks for Data-Centric AI Development.</b> <i>NeurIPS Datasets &amp; Benchmarks</i>, 2023."], "sec": "0.1", "secTitle": "Framing: where preparation sits"}, {"kind": "divider", "sec": "0.2", "secTitle": "Data quality, profiling and validation", "no": "0.2", "title": "Quality, profiling and validation", "lead": "A quality dimension you cannot compute is an adjective. This section turns six adjectives into failing tests.", "chips": ["Six dimensions", "Profiling", "Schema contracts", "Unit tests for data", "Drift taxonomy", "Drift statistics", "Corpus auditing"]}, {"kind": "figure", "title": "Six quality dimensions, operationalised", "kick": "0.2.1", "tag": "textbook", "lead": "Wang &amp; Strong<sup class=\"fn\">1</sup>'s dimensions are forty years old and still the right list. The teaching move is to insist on the third line of each box.", "fig": "f_quality", "figcap": "Adapted from Wang &amp; Strong (1996) and Batini &amp; Scannapieco. The right-hand test column is the part students skip.", "notes": "Exercise, five minutes: pick any dataset in the room and write the six tests. Most groups stall on Accuracy — which is the point, because it needs a reference standard they have not defined.", "cites": ["Wang & Strong. <i>Beyond Accuracy: What Data Quality Means to Data Consumers.</i> JMIS, 1996."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "bullets", "title": "Profiling: the first pass you never skip", "kick": "0.2.2", "tag": "textbook", "b": ["<b>Per column:</b> type, cardinality, null rate, min/max, distribution shape, top values, and how many values are impossible.", "<b>Per pair:</b> correlation, and the missingness co-occurrence map — columns that go missing together tell you about the collection process.", "<b>Per row:</b> duplicate rate, near-duplicate rate, and completeness profile.", "<b>Per group:</b> everything above, stratified by site, scanner, camera, clinician or time window. This is where site effects announce themselves.", "<b>Tooling:</b> <span class='k'>ydata-profiling</span>, <span class='k'>Sweetviz</span>, <span class='k'>pandas.describe</span> for a first look; <span class='k'>Great Expectations</span>, <span class='k'>TFDV</span>, <span class='k'>Deequ</span> once you know what to assert.", "The profiling report is <em>not</em> a deliverable. The assertions you write after reading it are."], "callout": {"h": "Teaching point", "p": "Tukey<sup class=\"fn\">1</sup>'s <i>Exploratory Data Analysis</i> (1977) argued for looking before modelling. The modern version of that argument is: look, then encode what you saw as a test that will fail next month when it stops being true."}, "notes": "Show a real ydata-profiling report on screen for two minutes. Then close it and ask what they would assert.", "cites": ["Tukey. <i>Exploratory Data Analysis. Addison-Wesley.</i> 1977."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "split", "title": "Schema contracts and unit tests for data", "kick": "0.2.3–0.2.4", "tag": "both", "wide": "text", "b": ["<b>Declare the contract:</b> expected types, ranges, allowed categories, referential integrity, row-count bounds, and the acceptable null rate per column.", "<b>Assert twice:</b> once on the raw source, once after transformation. A transform that silently produces NaNs passes the first gate and fails the second.", "<b>Fail loudly.</b> A warning in a log is not a gate. The pipeline stops and a human is paged.", "<b>Treat data like code:</b> assertions, fixtures, golden files, and CI that runs on every data refresh — the ML Test Score framing (Breck et al.<sup class=\"fn\">1</sup>, 2017).", "<b>Version the contract</b> alongside the data. A relaxed threshold is a decision that should appear in a diff.", "<b>What to assert about distributions:</b> not equality, but bounded divergence from the previous accepted release."], "fig": "f_validgate", "figcap": "Two suites, not one: the raw gate catches upstream change, the post-transform gate catches your own bugs.", "notes": "War story worth telling: a unit change upstream (mg/dL to mmol/L) that passed every type check and silently halved a model's sensitivity for four months.", "cites": ["Breck et al. <i>The ML Test Score.</i> IEEE Big Data, 2017."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "figure", "title": "Three shifts, three responses", "kick": "0.2.5", "tag": "textbook", "lead": "Covariate shift, prior shift and concept drift look identical on a dashboard. They demand different fixes.", "fig": "f_drift", "figcap": "Taxonomy after Quiñonero-Candela et al.<sup class=\"fn\">1</sup> (2009) and Moreno-Torres et al.<sup class=\"fn\">2</sup> (2012). The distinction matters because only the third one forces you to relabel.", "notes": "Concrete Thai examples: a new ultrasound machine at a district hospital is covariate shift; moving screening from a referral clinic to a village is prior shift; a revised diagnostic guideline is concept drift.", "cites": ["Quiñonero-Candela et al. <i>Dataset Shift in Machine Learning. MIT Press.</i> 2009.", "Moreno-Torres et al. <i>A unifying view on dataset shift.</i> Pattern Recognition, 2012."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "table", "title": "Choosing a drift statistic — and its caveat", "kick": "0.2.6", "tag": "both", "sm": true, "table": {"head": ["Statistic", "What it compares", "Where it misleads"], "rows": [["PSI (population stability index)", "Binned marginal distributions", "Bin choice dominates the value; industry thresholds (0.1 / 0.25) are conventions, not theory"], ["Kolmogorov–Smirnov", "Empirical CDFs, one dimension", "Univariate only, and at n &gt; 10⁵ it flags differences far too small to matter"], ["Chi-square", "Categorical frequencies", "Sensitive to rare categories and to sample size in the same way"], ["MMD (kernel two-sample)", "Full multivariate distributions", "Kernel and bandwidth choice; expensive; hard to attribute to a column"], ["Classifier two-sample test", "Can a model tell old from new?", "The most interpretable — the classifier's importances name the drifting feature — but it needs its own honest split"]]}, "callout": {"h": "The caveat that matters most", "p": "Every one of these is a hypothesis test. With enough rows, everything is significant. Monitor <b>effect size and downstream metric impact</b>, not p-values — and always ask whether the change is one you should adapt to or one you should reject at the gate."}, "notes": "The classifier two-sample test is the one to teach in the lab: it is trivial to implement and it tells you WHICH feature moved.", "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "bullets", "title": "Auditing what is actually in a corpus", "kick": "0.2.7", "tag": "frontier", "lead": "For anything web-scale, the README is a hypothesis. Treat it as one.", "b": ["<b>Search it, do not trust it.</b> Elazar et al.<sup class=\"fn\">1</sup>, <em>What's In My Big Data?</em> (ICLR 2024), built tooling precisely because nobody could answer basic questions about their own pretraining corpora.", "<b>Documented findings that should worry you:</b> benchmark contamination, large volumes of machine-generated and duplicated text, and PII sitting in supposedly public data.", "<b>Dodge et al.<sup class=\"fn\">2</sup> (2021)</b> did the same for C4 and found blocklist filtering removing whole registers of legitimate text along with the noise.", "<b>Minimum audit for any corpus you use:</b> sample 200 documents at random and read them. Yes, actually read them. It takes an afternoon and it changes every downstream decision.", "<b>Then quantify:</b> language mix, source-domain mix, duplication rate, date distribution, and overlap with every benchmark you intend to report."], "callout": {"h": "Seminar exercise", "p": "Hand each student a different public dataset and one instruction: “find three things in it that its documentation does not mention.” Nobody has ever come back empty-handed."}, "notes": "This is the highest-value-per-minute exercise in the whole module.", "cites": ["Elazar et al. <i>What's In My Big Data?.</i> ICLR, 2024.", "Dodge et al. <i>Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus.</i> EMNLP, 2021."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "refs", "title": "Section 0.2 — references", "kick": "Reading", "sm": true, "refs": ["Wang &amp; Strong. <b>Beyond Accuracy: What Data Quality Means to Data Consumers.</b> <i>JMIS</i>, 1996.", "Breck, Cai, Nielsen, Salib &amp; Sculley. <b>The ML Test Score.</b> <i>IEEE Big Data</i>, 2017.", "Quiñonero-Candela, Sugiyama, Schwaighofer &amp; Lawrence. <b>Dataset Shift in Machine Learning.</b> MIT Press, 2009.", "Moreno-Torres, Raeder, Alaiz-Rodríguez, Chawla &amp; Herrera. <b>A unifying view on dataset shift.</b> <i>Pattern Recognition</i>, 2012.", "Elazar et al. <b>What's In My Big Data?</b> <i>ICLR</i>, 2024.", "Dodge et al. <b>Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus.</b> <i>EMNLP</i>, 2021.", "Tukey. <b>Exploratory Data Analysis.</b> Addison-Wesley, 1977.", "Tooling: Great Expectations, TensorFlow Data Validation, Amazon Deequ, ydata-profiling, Evidently, NannyML."], "sec": "0.2", "secTitle": "Data quality, profiling and validation"}, {"kind": "divider", "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene", "no": "0.3", "title": "Splitting, leakage and evaluation hygiene", "lead": "The anchor section of the whole module. If a student remembers one thing from this course, make it this.", "chips": ["Split designs", "Cross-validation", "Eight leakage types", "Fitting inside folds", "Duplicates", "Temporal validity", "Contamination", "Model info sheets"]}, {"kind": "figure", "title": "The same data, split three ways", "kick": "0.3.1", "tag": "textbook", "lead": "Only one of these designs answers the question a clinical or surveillance claim is actually making.", "fig": "f_splits", "figcap": "Eight patients, three images each. The grouping unit is a modelling decision, not a technicality — and it must be declared before the first experiment.", "notes": "This is the slide to slow down on. Ask each group to name the grouping unit for their own project and write it on the board. Disagreements within a group are the interesting part.", "cites": ["Intharah et al. <i>BiTNet: Hybrid deep convolutional model for ultrasound image analysis of human biliary tract….</i> Artificial Intelligence in Medicine, 2023.", "Kapoor & Narayanan. <i>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</i> Patterns 4(9), 2023."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "split", "title": "Cross-validation, and the variant you probably need", "kick": "0.3.2", "tag": "textbook", "wide": "text", "b": ["<b>k-fold</b> — the default. Fine when rows are exchangeable and plentiful, which in health data they almost never are.", "<b>Stratified k-fold</b> — preserves class balance per fold. Mandatory under imbalance; still wrong if rows are grouped.", "<b>Group k-fold / leave-one-group-out</b> — the correct default for patients, sites, scanners, cameras and sessions.", "<b>Nested CV</b> — an inner loop for tuning, an outer loop for estimating. Without it, the reported score includes the model-selection search (Cawley &amp; Talbot<sup class=\"fn\">3</sup>, 2010).", "<b>Blocked / walk-forward</b> — for anything with a time index. Covered in 0.3.8.", "<b>Repeated CV</b> — reduces variance of the estimate; does <em>not</em> reduce bias from a wrong design. Repeating a leaky split just gives you a precise wrong number."], "fig": "f_foldfit", "figcap": "Whichever variant you pick, the transform must be fitted inside the training portion of every fold.", "callout": {"h": "The rule of thumb", "p": "Pick the split that makes the training set <em>least</em> like the test set among all designs that are still honest. Optimism comes from similarity you did not intend."}, "notes": "Varma & Simon (2006) is the cleanest demonstration that selecting features on all data then cross-validating gives near-zero error on pure noise.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013.", "Cawley & Talbot. <i>On Over-fitting in Model Selection and Subsequent Selection Bias in Performance Evaluation.</i> JMLR, 2010."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "table", "title": "The eight-type leakage taxonomy", "kick": "0.3.3", "tag": "frontier", "sm": true, "lead": "Kapoor &amp; Narayanan<sup class=\"fn\">1</sup> surveyed 22 reviews and found leakage in 17 fields, collectively affecting 294 papers.", "table": {"head": ["#", "Type", "How it shows up in practice"], "rows": [["L1.1", "No test set at all", "The reported number is training performance, sometimes without the authors realising"], ["L1.2", "Pre-processing on the full dataset", "Scaler, imputer, encoder or PCA fitted before the split"], ["L1.3", "Feature selection on the full dataset", "Screening by correlation with y across all rows, then cross-validating what survives"], ["L1.4", "Duplicates across the split", "Exact or near-duplicate rows, images, frames or documents on both sides"], ["L2", "Illegitimate features", "A feature that is a proxy for the target, or is only recorded after the outcome is known"], ["L3.1", "Temporal leakage", "Training on data from after the prediction time; centred windows; future-looking aggregates"], ["L3.2", "Non-independence", "Same patient, site, device, author or session on both sides of the split"], ["L3.3", "Sampling bias in test", "The test set is not drawn from the population the claim is about"]]}, "callout": {"h": "The finding worth quoting", "p": "In their civil-war-prediction reproduction, once the leakage is corrected, complex ML models do <b>not</b> perform substantively better than decades-old logistic regression."}, "notes": "Print this table. It becomes the marking rubric for the paper-clinic seminar in Chapter 4.", "cites": ["Kapoor & Narayanan. <i>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</i> Patterns 4(9), 2023."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "figure", "title": "Where you fit the transform", "kick": "0.3.5", "tag": "textbook", "lead": "The single most common leak in applied machine learning, and the easiest to prevent in code.", "fig": "f_foldfit", "figcap": "The guard is architectural: wrap every stateful transform in a <span class='k'>Pipeline</span> / <span class='k'>ColumnTransformer</span> and hand the pipeline — never a pre-fitted array — to the cross-validator.", "notes": "Ask them to name a stateful transform they have fitted outside a fold. Everyone has. The honest answer normalises the discussion and makes the lab less threatening.", "cites": ["Chawla et al. <i>SMOTE: Synthetic Minority Over-sampling Technique.</i> JAIR, 2002.", "Blagus & Lusa. <i>SMOTE for high-dimensional class-imbalanced data.</i> BMC Bioinformatics, 2013."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "split", "title": "The optimism gap, measured", "kick": "0.3.5", "tag": "frontier", "lead": "Leakage does not produce a small bias. It produces the difference between a publishable result and a real one.", "b": ["Every bar to the left of the dashed line is a <b>result someone has published</b>, in some field, in the last five years.", "The gap is largest exactly where data is scarcest and grouping is strongest — which is to say, in clinical research.", "<b>Lab 1 is built on this figure:</b> students fit the same model with transforms inside and outside the folds, then quantify their own gap.", "Writing it up against the eight-type taxonomy is the deliverable, not the number.", "<b>The professional habit:</b> report both numbers. “Random split 0.94, patient-grouped split 0.79” is a stronger paper than either number alone, because it demonstrates you knew to look."], "fig": "f_leakbars", "figcap": "Illustrative shape only — the point is the ordering and the size of the gap, not these specific values.", "notes": "Be explicit that the bar heights are illustrative. Students will otherwise cite them.", "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "split", "title": "Duplicates, and grouping in clinical and CCTV data", "kick": "0.3.6–0.3.7", "tag": "both", "wide": "text", "b": ["<b>Near-duplicates are the silent accuracy inflator.</b> Two frames one second apart, the same slide scanned twice, the same report copy-forwarded, the same web page under two URLs.", "<b>Detection:</b> exact hashing, then perceptual hashing or MinHash/LSH for the near cases, then embedding nearest-neighbours for the semantic ones. Cheap; do it before you split.", "<b>In clinical imaging</b> the grouping unit is the <b>patient</b> at minimum, and the <b>site or scanner</b> for any generalisation claim.", "<b>In video and CCTV</b> the unit is the <b>camera and the session</b> — never the frame. Frames within a clip are almost perfectly correlated.", "<b>In text</b> it is the <b>document or the author</b>, and for RAG evaluation it is the <b>source document</b>, not the chunk.", "<b>The test:</b> if two rows would still be in the dataset had you sampled one fewer patient, camera or document, they belong to the same group."], "fig": "f_ovrdt", "figcap": "In our own OV-RDT work the grouping unit is the specimen, and capture quality is handled by a separate model before grading — a preparation decision that carries its own dataset and its own metric.", "notes": "Cite: Junsawang et al., Sci Rep 15:31062 (2025). Emphasise that the QC detector needed its own 574-image annotated set — preparation work that would be invisible in a results table.", "cites": ["Junsawang et al. <i>AI-enhanced rapid diagnostic testing platform for mass opisthorchiasis screening.</i> Scientific Reports 15:31062, 2025."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "figure", "title": "Temporal validity: walk forward and cut a hole", "kick": "0.3.8", "tag": "textbook", "lead": "For anything with a time index, the only honest evaluation trains on the past and tests on the future.", "fig": "f_walkforward", "figcap": "The purge/embargo band exists because features and labels have width in time. López de Prado's treatment is the clearest, though the problem is not specific to finance.", "notes": "The clinical version: a label defined as 'died within 30 days' makes the last 30 days of the training window unusable, because the label is not yet knowable.", "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "cols", "title": "Contamination, test-set reuse, and the fix", "kick": "0.3.9–0.3.10", "tag": "frontier", "sm": true, "cols": [{"sub": "Benchmark contamination", "h": "The eval set is in the training corpus", "b": ["At web scale it is the default, not the exception", "Detect with n-gram overlap and embedding-based matching", "Decontaminate <em>before</em> training, and publish a contamination report", "Revisited in Chapter 2 for pretraining corpora"]}, {"sub": "Adaptive overfitting", "h": "A thousand papers tuned on one test set", "b": ["Each paper is honest; the community is not", "Recht et al.<sup class=\"fn\">2</sup> (2019) rebuilt CIFAR-10 and ImageNet test sets and saw accuracy drop across the board", "Reassuringly, the <em>ranking</em> largely survived — so relative claims aged better than absolute ones", "Argues for fresh held-out sets, not just bigger ones"]}, {"sub": "The fix", "h": "Model info sheets", "b": ["A fill-in template forcing authors to state, <b>per leakage type</b>, why their setup is clean", "Kapoor &amp; Narayanan<sup class=\"fn\">3</sup> propose it precisely because informal reporting failed", "Cheap to adopt: one page, eight rows", "<b>Make it a required appendix</b> in every project you supervise"], "acc": true}], "notes": "The model info sheet is the single highest-leverage thing you can impose on a research group.", "cites": ["Krizhevsky et al. <i>ImageNet Classification with Deep Convolutional Neural Networks.</i> NeurIPS, 2012.", "Recht et al. <i>Do ImageNet Classifiers Generalize to ImageNet?.</i> ICML, 2019.", "Kapoor & Narayanan. <i>Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</i> Patterns 4(9), 2023."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "refs", "title": "Section 0.3 — references", "kick": "Reading", "sm": true, "refs": ["<b>Kapoor &amp; Narayanan. Leakage and the Reproducibility Crisis in Machine-Learning-Based Science.</b> <i>Patterns</i> 4(9), 2023 (arXiv:2207.07048). <i>Anchor reading for the whole module.</i>", "Cawley &amp; Talbot. <b>On Over-fitting in Model Selection and Subsequent Selection Bias in Performance Evaluation.</b> <i>JMLR</i>, 2010.", "Varma &amp; Simon. <b>Bias in error estimation when using cross-validation for model selection.</b> <i>BMC Bioinformatics</i>, 2006.", "Ambroise &amp; McLachlan. <b>Selection bias in gene extraction on the basis of microarray gene-expression data.</b> <i>PNAS</i>, 2002.", "Recht, Roelofs, Schmidt &amp; Shankar. <b>Do ImageNet Classifiers Generalize to ImageNet?</b> <i>ICML</i>, 2019.", "Hastie, Tibshirani &amp; Friedman. <b>The Elements of Statistical Learning</b>, ch. 7. 2009.", "López de Prado. <b>Advances in Financial Machine Learning</b>, ch. 7 (purging and embargo). 2018.", "Pedregosa et al. <b>Scikit-learn.</b> <i>JMLR</i>, 2011 — for <span class='k'>Pipeline</span> and <span class='k'>ColumnTransformer</span> semantics."], "sec": "0.3", "secTitle": "Splitting, leakage and evaluation hygiene"}, {"kind": "bullets", "kick": "Paper clinic · 50 minutes", "cls": "lab", "title": "Find the leakage", "tag": "frontier", "lead": "Bring one published applied-ML paper from your own field — ideally one you have cited, or one you were about to.", "b": ["<b>Ten minutes, alone.</b> Fill in a model info sheet: for each of the eight leakage types, state what the paper says, or that it says nothing.", "<b>Fifteen minutes, in pairs.</b> Swap papers. Your partner argues the case <em>for</em> the paper; you argue against. Then swap sides.", "<b>Twenty minutes, whole room.</b> Three presentations of three minutes: name the type, quote the sentence, say whether the headline result survives.", "<b>Five minutes.</b> Vote: how many of the papers in the room reported the grouping unit explicitly?", "<b>Ground rules:</b> be specific and be fair. “The split is unclear” is a finding; “this paper is bad” is not. Most of these authors made an ordinary mistake in a field-wide blind spot."], "callout": {"h": "Take home", "p": "Fill in the same sheet for <b>your own</b> current project before session 2. Bring the row you could not complete."}, "notes": "Have three or four spare papers printed for students who forget. Pick ones with a known grouping problem — clinical imaging without patient-level splits works every time.", "sec": "Close", "secTitle": "Clinic, takeaways and next steps"}, {"kind": "bullets", "kick": "Key takeaways", "title": "The five sentences from today", "b": ["<b>Curation is now the experimental variable.</b> At a fixed model, systematic data improvement is the higher-yield and far less explored lever.", "<b>A quality dimension you cannot compute is an adjective.</b> Write the assertion, make the pipeline stop when it fails.", "<b>The grouping unit is a modelling decision.</b> Declare it before the first experiment: patient, site, camera, session, document, author.", "<b>Fit every stateful transform inside the fold.</b> Enforce it architecturally, not by remembering.", "<b>Report both numbers.</b> “Random split 0.94, patient-grouped 0.79” is a stronger paper than either alone, because it shows you knew to look."], "callout": {"h": "On the board as they leave", "p": "The number in your abstract is a property of your split design, your label quality and your fold discipline at least as much as it is a property of your model."}, "notes": "If you are out of time, this slide is the one to keep.", "sec": "Close", "secTitle": "Clinic, takeaways and next steps"}, {"kind": "cols", "kick": "Next", "sm": true, "title": "Where this goes", "lead": "The next three sessions are technique catalogues. Today was the discipline that makes them mean something.", "cols": [{"sub": "Session 2", "h": "Tabular data", "p": "Missingness mechanisms, encoding, the imbalance-versus-calibration argument, tabular foundation models, EHR cohorts.", "b": ["Every transform today gets fitted inside a fold"]}, {"sub": "Session 3", "h": "Text and LLM data", "p": "Thai segmentation, subword tokenisation and its cost, web-corpus filtering, deduplication, instruction and RAG data.", "b": ["Deduplication is both a quality and a leakage control"]}, {"sub": "Session 4", "h": "Image and video data", "p": "DICOM and whole-slide handling, intensity and stain normalisation, augmentation policy, CCTV and medical imaging.", "b": ["Patient- and camera-level grouping, applied"]}, {"sub": "Session 5", "h": "Labels, reduction and governance", "p": "Annotation and label noise, coresets and pruning, synthetic data, privacy, fairness and documentation.", "b": ["Where the capstone brief is set"], "acc": true}], "notes": "Reading before session 2: Kapoor & Narayanan, Patterns 2023.", "sec": "Close", "secTitle": "Clinic, takeaways and next steps"}]}</script>
<script>
(function(){
"use strict";
function boom(e){
  try{var b=document.getElementById("err");b.style.display="block";
    b.textContent="Something broke: "+((e&&e.message)||e)+"\n"+((e&&e.stack)||"");}catch(_){}
  if(window.console)console.error(e);
}
window.addEventListener("error",function(ev){boom(ev.error||ev.message);});

try{

var D      = JSON.parse(document.getElementById("deckdata").textContent);
var SLIDES = D.slides, FIGS = D.figs, META = D.meta, SECS = D.secs || [];
var KEY    = "dpslides-"+META.key+"-v1";
var EDITS  = {}, NOTES = {};
var cur = 0, editing = false, ovOn = false, notesOn = false;
var t0 = null, tAcc = 0;

/* ---------------- storage ---------------- */
var Store = {
  get:function(){
    try{ if(window.storage&&window.storage.get)
      return window.storage.get(KEY).then(function(r){return r&&r.value?r.value:null;}).catch(function(){return null;}); }catch(e){}
    try{ return Promise.resolve(window.localStorage.getItem(KEY)); }catch(e){ return Promise.resolve(null); }
  },
  set:function(v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(KEY,v).catch(function(){}); return; } }catch(e){}
    try{ window.localStorage.setItem(KEY,v); }catch(e){}
  }
};
var svT=null;
function save(){ clearTimeout(svT); svT=setTimeout(function(){
  try{ Store.set(JSON.stringify({v:1,edits:EDITS,notes:NOTES})); }catch(e){} },350); }

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function txt(h){var d=document.createElement("div");d.innerHTML=h==null?"":h;return (d.textContent||"").trim();}
function val(i,path,dflt){ var k=i+"."+path; return (k in EDITS)?EDITS[k]:dflt; }
function ed(i,path,html,cls,tag){
  tag=tag||"div";
  return "<"+tag+' class="ed '+(cls||"")+'" data-k="'+i+"."+path+'">'+(val(i,path,html)||"")+"</"+tag+">";
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1800);}

/* ---------------- slide rendering ---------------- */
function bullets(i,arr,key,cls){
  if(!arr||!arr.length)return "";
  var h='<ul class="bul '+(cls||"")+'">';
  for(var j=0;j<arr.length;j++){
    h+='<li class="ed" data-k="'+i+"."+key+"."+j+'">'+(val(i,key+"."+j,arr[j])||"")+"</li>";
  }
  return h+"</ul>";
}
function fig(s){
  if(!s.fig)return "";
  var svg=FIGS[s.fig]||'<svg viewBox="0 0 900 380"><rect width="900" height="380" fill="#F1F5F9"/><text x="450" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#8A97A6">figure: '+esc(s.fig)+"</text></svg>";
  return svg;
}
function figblock(i,s){
  if(!s.fig)return "";
  return '<div class="figwrap col"><div class="figbox">'+fig(s)+"</div>"+
    (s.figcap?'<div class="figcap ed" data-k="'+i+'.figcap">'+val(i,"figcap",s.figcap)+"</div>":"")+"</div>";
}
function head(i,s,small){
  var h="";
  if(s.kick)h+='<p class="kick"><span class="dot"></span><span class="ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick)+"</span></p>";
  if(s.title)h+=ed(i,"title",s.title,small?"sm":"","h2");
  if(s.lead)h+=ed(i,"lead",s.lead,"lead","p");
  return h;
}
function citesHTML(i,s){
  if(!s.cites||!s.cites.length)return "";
  var h='<div class="cites">';
  for(var j=0;j<s.cites.length;j++)
    h+='<span class="c"><b>'+(j+1)+'</b><span class="ed" data-k="'+i+".cites."+j+'">'+
       val(i,"cites."+j,s.cites[j])+"</span></span>";
  return h+"</div>";
}
function foot(i,s){
  var sec=s.sec?("&sect; "+s.sec+(s.secTitle?" &nbsp;"+s.secTitle:"")):META.title;
  return '<div class="foot"><span>'+esc(META.short)+"</span><span>"+sec+'</span><span class="sp"></span>'+
    (s.tag?'<span class="tag '+s.tag+'">'+s.tag+"</span>":"")+
    "<span>"+(i+1)+" / "+SLIDES.length+"</span></div>";
}
function colsHTML(i,s){
  var n=s.cols.length,h='<div class="cols n'+n+'">';
  for(var j=0;j<n;j++){
    var c=s.cols[j];
    h+='<div class="cbox'+(c.acc?" acc":"")+'">';
    if(c.sub)h+='<div class="sub ed" data-k="'+i+".cols."+j+'.sub">'+val(i,"cols."+j+".sub",c.sub)+"</div>";
    if(c.h)h+='<h4 class="ed" data-k="'+i+".cols."+j+'.h">'+val(i,"cols."+j+".h",c.h)+"</h4>";
    if(c.p)h+='<p class="ed" data-k="'+i+".cols."+j+'.p">'+val(i,"cols."+j+".p",c.p)+"</p>";
    if(c.b&&c.b.length){
      h+='<ul class="bul">';
      for(var m=0;m<c.b.length;m++)
        h+='<li class="ed" data-k="'+i+".cols."+j+".b."+m+'">'+val(i,"cols."+j+".b."+m,c.b[m])+"</li>";
      h+="</ul>";
    }
    h+="</div>";
  }
  return h+"</div>";
}
function tableHTML(i,s){
  var h='<table class="t"><thead><tr>';
  s.table.head.forEach(function(x){h+="<th>"+x+"</th>";});
  h+="</tr></thead><tbody>";
  s.table.rows.forEach(function(r,ri){
    h+="<tr>";
    r.forEach(function(c,ci){h+='<td class="ed" data-k="'+i+".table."+ri+"."+ci+'">'+val(i,"table."+ri+"."+ci,c)+"</td>";});
    h+="</tr>";
  });
  return h+"</tbody></table>";
}
function statHTML(i,s){
  var h='<div class="stat">';
  s.stats.forEach(function(x,j){
    h+='<div><div class="v ed" data-k="'+i+".stats."+j+'.v">'+val(i,"stats."+j+".v",x.v)+"</div>"+
       '<div class="l ed" data-k="'+i+".stats."+j+'.l">'+val(i,"stats."+j+".l",x.l)+"</div></div>";
  });
  return h+"</div>";
}
function refsHTML(i,s){
  var h='<ol class="refs'+(s.refs.length>7?" two":"")+'">';
  for(var j=0;j<s.refs.length;j++)
    h+='<li class="ed" data-k="'+i+".refs."+j+'">'+val(i,"refs."+j,s.refs[j])+"</li>";
  return h+"</ol>";
}
function calloutHTML(i,s){
  return '<div class="callout"><div class="h">'+esc(s.callout.h||"Teaching point")+"</div>"+
    '<p class="ed" data-k="'+i+'.callout.p">'+val(i,"callout.p",s.callout.p)+"</p></div>";
}

function slideHTML(i){
  var s=SLIDES[i],k=s.kind||"bullets",h="";
  var cls="slide "+k+(s.cls?" "+s.cls:"");

  if(k==="title"){
    h='<div class="pad">'+
      '<p class="no ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick||"")+"</p>"+
      ed(i,"title",s.title,"","h1")+
      (s.lead?ed(i,"lead",s.lead,"dek","p"):"")+
      (s.meta?'<div class="meta ed" data-k="'+i+'.meta">'+val(i,"meta",s.meta)+"</div>":"")+
      "</div>";
  }else if(k==="divider"){
    h='<div class="pad">'+
      '<div class="n">'+esc(s.no||"")+"</div>"+
      ed(i,"title",s.title,"","h2")+
      (s.lead?ed(i,"lead",s.lead,"lead","p"):"")+
      (s.chips&&s.chips.length?'<div class="chips">'+s.chips.map(function(c){return "<span>"+esc(c)+"</span>";}).join("")+"</div>":"")+
      "</div>";
  }else{
    var inner="";
    if(k==="figure"){
      inner='<div class="body v">'+figblock(i,s).replace('class="figwrap col"','class="figwrap"')+
            (s.callout?calloutHTML(i,s):"")+"</div>";
    }else if(k==="split"||k==="splitr"){
      var left='<div class="col '+(s.wide==="text"?"wide":"")+'">'+bullets(i,s.b,"b")+
        (s.callout?calloutHTML(i,s):"")+(s.stats?statHTML(i,s):"")+"</div>";
      var right=figblock(i,s);
      if(s.wide==="text")right=right.replace('class="figwrap col"','class="figwrap col narrow"');
      inner='<div class="body">'+(k==="splitr"?right+left:left+right)+"</div>";
    }else if(k==="cols"){
      inner=colsHTML(i,s)+(s.callout?calloutHTML(i,s):"");
    }else if(k==="refs"){
      inner='<div class="body v">'+refsHTML(i,s)+"</div>";
    }else if(k==="table"){
      inner='<div class="body v">'+tableHTML(i,s)+(s.callout?calloutHTML(i,s):"")+"</div>";
    }else{
      inner='<div class="body v">'+bullets(i,s.b,"b",s.b&&s.b.length>6?"tight":"")+
        (s.stats?statHTML(i,s):"")+(s.callout?calloutHTML(i,s):"")+"</div>";
    }
    h='<div class="pad" style="flex:1;display:flex;flex-direction:column;min-height:0">'+
      head(i,s,s.sm)+'<div class="rule"></div>'+inner+citesHTML(i,s)+"</div>"+foot(i,s);
  }
  return '<section class="'+cls+'" data-i="'+i+'">'+h+
    '<div class="pnotes">'+esc(NOTES[i]||s.notes||"")+"</div></section>";
}

/* ---------------- shrink-to-fit ---------------- */
function autofit(sl){
  try{
    if(!sl)return;
    var box=sl.querySelector(".body")||sl.querySelector(".cols");
    if(!box)return;
    var foot=sl.querySelector(".foot"),cit=sl.querySelector(".cites");
    sl.style.setProperty("--k","1");
    for(var i=0;i<9;i++){
      var lim=cit?cit.getBoundingClientRect().top
              :(foot?foot.getBoundingClientRect().top:sl.getBoundingClientRect().bottom);
      var over=(box.scrollHeight>box.clientHeight+1)||(box.getBoundingClientRect().bottom>lim+1);
      var kid=false;
      var cbs=sl.querySelectorAll(".cbox");
      for(var j=0;j<cbs.length;j++)if(cbs[j].scrollHeight>cbs[j].clientHeight+1){kid=true;break;}
      if(!over&&!kid)break;
      sl.style.setProperty("--k",(1-0.035*(i+1)).toFixed(3));
    }
  }catch(e){}
}

/* ---------------- layout / scale ---------------- */
function fit(){
  var st=document.querySelector(".stage"),ho=document.getElementById("holder");
  if(!st)return;
  var pad=26;
  var sc=Math.min((st.clientWidth-pad*2)/1280,(st.clientHeight-pad*2)/720);
  if(!isFinite(sc)||sc<=0)sc=.5;
  ho.style.transform="scale("+sc+")";
}
window.addEventListener("resize",fit);

/* ---------------- render current ---------------- */
function render(){
  var ho=document.getElementById("holder");
  ho.innerHTML=slideHTML(cur);
  applyEdit();
  autofit(ho.querySelector(".slide"));
  fit();
  var s=SLIDES[cur];
  document.getElementById("secNow").innerHTML=s.sec?("&sect; "+s.sec+" &nbsp;"+(s.secTitle||"")):"";
  document.getElementById("cnt").innerHTML="<b>"+(cur+1)+"</b> / "+SLIDES.length;
  var f=document.querySelector(".fill");
  if(f)f.style.width=((cur+1)/SLIDES.length*100)+"%";
  var nb=document.getElementById("noteBox");
  if(nb)nb.value=NOTES[cur]!=null?NOTES[cur]:(SLIDES[cur].notes||"");
  var nx=document.getElementById("nxt");
  if(nx)nx.textContent=cur+1<SLIDES.length?txt(val(cur+1,"title",SLIDES[cur+1].title||"—")):"End of deck";
  if(ovOn)markOv();
  if(location.hash!=="#"+(cur+1))history.replaceState(null,"","#"+(cur+1));
}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur){render();return;}
  cur=i;render();
}
function applyEdit(){
  var els=document.querySelectorAll("#holder .ed");
  for(var i=0;i<els.length;i++){
    if(editing)els[i].setAttribute("contenteditable","true");
    else els[i].removeAttribute("contenteditable");
  }
}

/* ---------------- overview ---------------- */
function buildOv(){
  var g=document.getElementById("ovgrid"),h="",lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    var sk=(s.sec||"")+"|"+(s.secTitle||"");
    if(sk!==lastSec){
      lastSec=sk;
      h+='<div class="ovsec">'+(s.sec?esc(s.sec)+" &nbsp; "+esc(s.secTitle||""):esc(META.short))+"</div>";
    }
    h+='<div class="ovc" data-go="'+i+'"><div class="shell" data-shell><div class="mini" data-mini>'+
      slideHTML(i)+'</div></div><div class="no">'+(i+1)+'</div><div class="lb">'+
      esc(txt(val(i,"title",s.title||""))||(s.kind==="divider"?"Section":"Slide"))+"</div></div>";
  }
  g.innerHTML=h;
  var ms=g.querySelectorAll(".mini .slide");
  for(var q=0;q<ms.length;q++)autofit(ms[q]);
  // scale minis
  var cards=g.querySelectorAll(".ovc");
  for(var j=0;j<cards.length;j++){
    var shell=cards[j].querySelector("[data-shell]"),mini=cards[j].querySelector("[data-mini]");
    var w=cards[j].clientWidth||232,sc=w/1280;
    mini.style.transform="scale("+sc+")";
    shell.style.height=(720*sc)+"px";
  }
  markOv();
}
function markOv(){
  var cards=document.querySelectorAll(".ovc");
  for(var i=0;i<cards.length;i++)cards[i].classList.toggle("cur",+cards[i].getAttribute("data-go")===cur);
  var c=document.querySelector(".ovc.cur");
  if(c)c.scrollIntoView({block:"nearest"});
}

/* ---------------- export ---------------- */
function toMarkdown(){
  var L=[];
  L.push("# "+META.title);
  L.push("");
  L.push("_"+META.short+" · "+SLIDES.length+" slides · exported from the editable HTML deck._");
  L.push("");
  var lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    if(s.sec&&s.sec!==lastSec){lastSec=s.sec;L.push("");L.push("## "+s.sec+" "+(s.secTitle||""));L.push("");}
    var t=txt(val(i,"title",s.title||""));
    L.push("### ["+(i+1)+"] "+(t||"(untitled)"));
    var ld=txt(val(i,"lead",s.lead||""));
    if(ld)L.push("");
    if(ld)L.push("_"+ld+"_");
    if(s.b&&s.b.length){L.push("");for(var j=0;j<s.b.length;j++)L.push("- "+txt(val(i,"b."+j,s.b[j])));}
    if(s.cols)s.cols.forEach(function(c,j){
      L.push("");L.push("**"+txt(val(i,"cols."+j+".h",c.h||""))+"**");
      var p=txt(val(i,"cols."+j+".p",c.p||""));if(p)L.push(p);
      (c.b||[]).forEach(function(x,m){L.push("- "+txt(val(i,"cols."+j+".b."+m,x)));});
    });
    if(s.table){L.push("");L.push("| "+s.table.head.join(" | ")+" |");
      L.push("|"+s.table.head.map(function(){return "---";}).join("|")+"|");
      s.table.rows.forEach(function(r,ri){L.push("| "+r.map(function(c,ci){
        return txt(val(i,"table."+ri+"."+ci,c));}).join(" | ")+" |");});}
    if(s.stats){L.push("");s.stats.forEach(function(x,j){
      L.push("- **"+txt(val(i,"stats."+j+".v",x.v))+"** — "+txt(val(i,"stats."+j+".l",x.l)));});}
    if(s.callout){L.push("");L.push("> **"+(s.callout.h||"Teaching point")+".** "+txt(val(i,"callout.p",s.callout.p)));}
    if(s.figcap){L.push("");L.push("_Figure: "+txt(val(i,"figcap",s.figcap))+"_");}
    if(s.refs){L.push("");s.refs.forEach(function(r,j){L.push((j+1)+". "+txt(val(i,"refs."+j,r)));});}
    if(s.cites&&s.cites.length){L.push("");
      L.push("_Sources: "+s.cites.map(function(c,j){
        return "["+(j+1)+"] "+txt(val(i,"cites."+j,c));}).join(" · ")+"_");}
    var nt=(NOTES[i]!=null?NOTES[i]:(s.notes||"")).trim();
    if(nt){L.push("");L.push("> **Speaker notes.** "+nt.replace(/\n/g," "));}
    L.push("");
  }
  return L.join("\n");
}
function openModal(title,text,name,mode){
  var m=document.getElementById("modal");
  document.getElementById("mTitle").textContent=title;
  var body=document.getElementById("mBody");
  if(mode==="help"){ body.innerHTML=HELP; }
  else{
    body.innerHTML='<textarea id="mText" spellcheck="false"></textarea>';
    var ta=document.getElementById("mText");ta.value=text;ta.setAttribute("data-name",name||"export.txt");
  }
  document.querySelector('[data-act="mcopy"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mdl"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mload"]').style.display=mode==="import"?"":"none";
  m.classList.add("on");
}
var HELP='<div class="help"><h4>Moving around</h4><table>'+
  '<tr><td><kbd>&rarr;</kbd> <kbd>&larr;</kbd> <kbd>Space</kbd></td><td>Next / previous slide</td></tr>'+
  '<tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>First / last slide</td></tr>'+
  '<tr><td><kbd>O</kbd></td><td>Overview grid of every slide, click one to jump</td></tr>'+
  '<tr><td><kbd>/</kbd></td><td>Search titles, bullets, references and your notes</td></tr>'+
  '<tr><td>number then <kbd>Enter</kbd></td><td>Jump to that slide</td></tr>'+
  '<tr><td><kbd>F</kbd></td><td>Fullscreen</td></tr></table>'+
  '<h4>Teaching and editing</h4><table>'+
  '<tr><td><kbd>E</kbd></td><td>Edit mode: click any heading, bullet, caption, table cell or reference and rewrite it</td></tr>'+
  '<tr><td><kbd>N</kbd></td><td>Speaker-notes panel, with the next slide title shown above it</td></tr>'+
  '<tr><td><kbd>T</kbd></td><td>Start / pause the lecture timer</td></tr>'+
  '<tr><td><kbd>P</kbd></td><td>Print or save as PDF, one slide per page with notes underneath</td></tr>'+
  '</table><h4>Keeping your work</h4><table>'+
  '<tr><td>Autosave</td><td>Edits and notes save to this browser automatically</td></tr>'+
  '<tr><td>Export</td><td>Markdown for handouts and lecture prep, JSON as a portable backup</td></tr>'+
  '<tr><td>Import</td><td>Paste a JSON backup to move your edits to another machine</td></tr>'+
  '</table></div>';

/* ---------------- search ---------------- */
function slideText(i){
  var s=SLIDES[i],parts=[txt(val(i,"title",s.title||"")),txt(val(i,"lead",s.lead||""))];
  (s.b||[]).forEach(function(x,j){parts.push(txt(val(i,"b."+j,x)));});
  (s.refs||[]).forEach(function(x,j){parts.push(txt(val(i,"refs."+j,x)));});
  (s.cols||[]).forEach(function(c,j){parts.push(txt(val(i,"cols."+j+".h",c.h||"")));
    parts.push(txt(val(i,"cols."+j+".p",c.p||"")));
    (c.b||[]).forEach(function(x,m){parts.push(txt(val(i,"cols."+j+".b."+m,x)));});});
  if(s.table)s.table.rows.forEach(function(r,ri){r.forEach(function(c,ci){
    parts.push(txt(val(i,"table."+ri+"."+ci,c)));});});
  if(s.figcap)parts.push(txt(val(i,"figcap",s.figcap)));
  (s.cites||[]).forEach(function(c,j){parts.push(txt(val(i,"cites."+j,c)));});
  if(s.callout)parts.push(txt(val(i,"callout.p",s.callout.p)));
  parts.push(NOTES[i]||s.notes||"");
  parts.push(s.sec||"",s.secTitle||"");
  return parts.join("  ");
}
function doSearch(q){
  var box=document.getElementById("sres");
  q=(q||"").trim();
  if(q.length<2){box.innerHTML="";return;}
  var lq=q.toLowerCase(),h="",n=0;
  for(var i=0;i<SLIDES.length&&n<40;i++){
    var t=slideText(i),p=t.toLowerCase().indexOf(lq);
    if(p<0)continue;
    n++;
    var a=Math.max(0,p-46),snip=esc(t.slice(a,p))+"<mark>"+esc(t.slice(p,p+q.length))+"</mark>"+esc(t.slice(p+q.length,p+q.length+80));
    h+='<button data-go="'+i+'"><span class="n">slide '+(i+1)+(SLIDES[i].sec?" &nbsp;&sect; "+esc(SLIDES[i].sec):"")+
       '</span><div class="t">'+esc(txt(val(i,"title",SLIDES[i].title||"")))+'</div><div class="n" style="margin-top:3px">'+
       (a>0?"…":"")+snip+"…</div></button>";
  }
  box.innerHTML=h||'<button style="cursor:default"><span class="n">no match</span></button>';
}

/* ---------------- timer ---------------- */
function tick(){
  var el=document.querySelector(".timer");if(!el)return;
  var ms=tAcc+(t0?(Date.now()-t0):0),s=Math.floor(ms/1000);
  el.textContent=(t0?"":"⏸ ")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
setInterval(tick,500);

/* ---------------- events ---------------- */
document.addEventListener("click",function(ev){
try{
  var t=ev.target;
  var g=t.closest?t.closest("[data-go]"):null;
  if(g){ go(+g.getAttribute("data-go"));
    if(ovOn)setOv(false);
    document.body.classList.remove("srch-on");
    return; }
  var b=t.closest?t.closest("[data-act]"):null;
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="next"){go(cur+1);return;}
  if(a==="prev"){go(cur-1);return;}
  if(a==="ov"){setOv(!ovOn);return;}
  if(a==="notes"){notesOn=!notesOn;document.body.classList.toggle("notes-on",notesOn);
    b.setAttribute("aria-pressed",String(notesOn));fit();return;}
  if(a==="edit"){editing=!editing;document.body.classList.toggle("edit",editing);
    b.setAttribute("aria-pressed",String(editing));applyEdit();
    toast(editing?"Edit mode on — click any text to rewrite it":"Edit mode off");return;}
  if(a==="search"){document.body.classList.toggle("srch-on");
    if(document.body.classList.contains("srch-on"))document.getElementById("q").focus();return;}
  if(a==="print"){printAll();return;}
  if(a==="help"){openModal("Keyboard and features","","","help");return;}
  if(a==="hub"){window.location.href=META.hub;return;}
  if(a==="export"){
    openModal("Export — Markdown",toMarkdown(),META.key+"-slides.md");
    document.getElementById("mSeg").innerHTML=
      '<button class="mbtn" data-act="expmd">Markdown</button>'+
      '<button class="mbtn" data-act="expjson">JSON backup</button>'+
      '<button class="mbtn" data-act="expimp">Import…</button>';
    return;}
  if(a==="expmd"){document.getElementById("mTitle").textContent="Export — Markdown";
    var t1=document.getElementById("mText");if(t1){t1.value=toMarkdown();t1.setAttribute("data-name",META.key+"-slides.md");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expjson"){document.getElementById("mTitle").textContent="Export — JSON backup";
    var t2=document.getElementById("mText");if(t2){t2.value=JSON.stringify({v:1,edits:EDITS,notes:NOTES},null,2);
      t2.setAttribute("data-name",META.key+"-backup.json");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expimp"){document.getElementById("mTitle").textContent="Import — paste a JSON backup, then Load";
    var t3=document.getElementById("mText");if(t3)t3.value="";
    document.querySelector('[data-act="mload"]').style.display="";return;}
  if(a==="mload"){
    try{ var o=JSON.parse(document.getElementById("mText").value);
      EDITS=o.edits||{};NOTES=o.notes||{};save();render();
      document.getElementById("modal").classList.remove("on");toast("Backup loaded");
    }catch(e){toast("That is not valid JSON");}
    return;}
  if(a==="mclose"){document.getElementById("modal").classList.remove("on");return;}
  if(a==="mcopy"){var ta=document.getElementById("mText");if(!ta)return;
    ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast("Copied");},function(){toast("Select and copy manually");});
    else toast(ok?"Copied to clipboard":"Select and copy manually");return;}
  if(a==="mdl"){var ta2=document.getElementById("mText");if(!ta2)return;
    var nm=ta2.getAttribute("data-name")||"export.txt";
    var bl=new Blob([ta2.value],{type:"text/plain;charset=utf-8"});
    var A=document.createElement("a");A.href=URL.createObjectURL(bl);A.download=nm;
    document.body.appendChild(A);A.click();A.remove();toast("Downloaded "+nm);return;}
}catch(e){boom(e);}
},false);

function setOv(on){
  ovOn=on;document.body.classList.toggle("ov-on",on);
  var b=document.querySelector('[data-act="ov"]');if(b)b.setAttribute("aria-pressed",String(on));
  if(on)buildOv();
}
function printAll(){
  var ho=document.getElementById("holder"),h="";
  for(var i=0;i<SLIDES.length;i++)h+=slideHTML(i);
  ho.innerHTML=h;ho.style.transform="none";
  var ps=ho.querySelectorAll(".slide");
  for(var q=0;q<ps.length;q++)autofit(ps[q]);
  document.body.classList.add("handout");
  window.print();
  setTimeout(function(){document.body.classList.remove("handout");render();},400);
}

/* progress bar click */
document.addEventListener("mousedown",function(ev){
  var tr=ev.target.closest?ev.target.closest(".track"):null;
  if(!tr)return;
  var r=tr.getBoundingClientRect();
  go(Math.round((ev.clientX-r.left)/r.width*(SLIDES.length-1)));
});

/* edits */
document.addEventListener("focusout",function(ev){
  try{
    var t=ev.target;
    if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
      var k=t.getAttribute("data-k");
      if(k){EDITS[k]=t.innerHTML.trim();save();}
    }
  }catch(e){boom(e);}
},true);
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="noteBox"){NOTES[cur]=t.value;save();return;}
  if(t.id==="q"){doSearch(t.value);return;}
});
document.addEventListener("paste",function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
    ev.preventDefault();
    var s=(ev.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,s);
  }
});

/* keys */
var numBuf="";
document.addEventListener("keydown",function(ev){
try{
  var tag=(ev.target.tagName||"").toLowerCase();
  var typing=ev.target.isContentEditable||tag==="input"||tag==="textarea";
  if(ev.key==="Escape"){
    document.getElementById("modal").classList.remove("on");
    document.body.classList.remove("srch-on");
    if(ovOn)setOv(false);
    if(ev.target.isContentEditable)ev.target.blur();
    return;
  }
  if(typing){
    if(ev.target.id==="q"&&ev.key==="Enter"){
      var f=document.querySelector("#sres [data-go]");
      if(f){go(+f.getAttribute("data-go"));document.body.classList.remove("srch-on");}
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==="ArrowRight"||ev.key==="PageDown"||ev.key===" "){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="ArrowDown"){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="Home"){ev.preventDefault();go(0);return;}
  if(ev.key==="End"){ev.preventDefault();go(SLIDES.length-1);return;}
  if(ev.key>="0"&&ev.key<="9"){numBuf+=ev.key;return;}
  if(ev.key==="Enter"&&numBuf){go(parseInt(numBuf,10)-1);numBuf="";return;}
  var k=ev.key.toLowerCase();
  numBuf="";
  if(k==="o"){setOv(!ovOn);return;}
  if(k==="n"){document.querySelector('[data-act="notes"]').click();return;}
  if(k==="e"){document.querySelector('[data-act="edit"]').click();return;}
  if(k==="p"){ev.preventDefault();printAll();return;}
  if(k==="/"||k==="?"){ev.preventDefault();
    if(ev.key==="?"){openModal("Keyboard and features","","","help");return;}
    document.body.classList.add("srch-on");document.getElementById("q").focus();return;}
  if(k==="t"){ if(t0){tAcc+=Date.now()-t0;t0=null;}else{t0=Date.now();} tick(); return;}
  if(k==="f"){ if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); return;}
}catch(e){boom(e);}
},false);

/* progress bar dom */
(function(){
  var p=document.createElement("div");p.className="prog";
  var ticks="";
  for(var i=0;i<SLIDES.length;i++){
    if(SLIDES[i].kind==="divider")ticks+='<i style="left:'+(i/(SLIDES.length-1)*100)+'%"></i>';
  }
  p.innerHTML='<span class="hint">&larr;/&rarr; move &nbsp;·&nbsp; O overview &nbsp;·&nbsp; E edit &nbsp;·&nbsp; N notes &nbsp;·&nbsp; T timer &nbsp;·&nbsp; ? help</span>'+
    '<div class="track"><div class="ticks">'+ticks+'</div><div class="fill"></div></div>'+
    '<span class="timer">⏸ 00:00</span>';
  document.body.appendChild(p);
})();

/* boot */
Store.get().then(function(raw){
  try{ if(raw){var o=JSON.parse(raw);EDITS=o.edits||{};NOTES=o.notes||{};} }catch(e){}
  var h=parseInt((location.hash||"").replace("#",""),10);
  if(h>0&&h<=SLIDES.length)cur=h-1;
  render();
  if(raw)toast("Your saved edits and notes are back");
}).catch(function(){render();});

}catch(e){boom(e);}
})();
</script>
