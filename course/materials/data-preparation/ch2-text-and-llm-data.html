<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Preparation for ML and AI — Chapter 2: Text, NLP and LLM data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6A4C93;
  --accent-soft:#F1ECF8;
  --accent-ink:#503872;
  --paper:#EDF1F6;
  --card:#FFFFFF;
  --ink:#111823;
  --ink-2:#41505F;
  --ink-3:#78859A;
  --rule:#D3DCE6;
  --rule-2:#E7EDF3;
  --shell:#171E28;
  --shell-2:#212A36;
  --shell-3:#2E3946;
  --ok:#0F7A6A;
  --warn:#A3384F;
  --f-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-thai:"Noto Sans Thai","Archivo",sans-serif;
  --W:1280px; --H:720px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================ CHROME ============================ */
.bar{
  position:fixed;left:0;right:0;top:0;height:44px;z-index:40;
  background:var(--shell-2);border-bottom:1px solid #000;
  display:flex;align-items:center;gap:10px;padding:0 12px;color:#C6D1DD;
}
.bar .ch{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;flex:none;
}
.bar .tt{font-family:var(--f-ui);font-size:13px;font-weight:600;color:#EAF0F6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.bar .sec{font-family:var(--f-mono);font-size:10.5px;color:#7C8C9C;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.bar .grp{display:flex;gap:4px;align-items:center;flex:none}
.tb{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:6px 9px;
  border:1px solid var(--shell-3);border-radius:5px;color:#A9B7C5;background:transparent;white-space:nowrap;
}
.tb:hover{background:var(--shell-3);color:#fff}
.tb[aria-pressed="true"]{background:#E9EEF3;color:var(--shell);border-color:#E9EEF3;font-weight:600}
.tb.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.count{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;padding:0 4px;flex:none}
.count b{color:#fff}

/* ============================ STAGE ============================ */
.stage{
  position:fixed;inset:44px 0 30px 0;display:grid;place-items:center;overflow:hidden;
  background:var(--shell);
}
body.notes-on .stage{right:340px}
.holder{width:var(--W);height:var(--H);transform-origin:center center;position:relative}
.slide{
  width:var(--W);height:var(--H);background:var(--card);position:relative;overflow:hidden;
  box-shadow:0 12px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;
}

/* progress */
.prog{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:40;background:var(--shell-2);
  border-top:1px solid #000;display:flex;align-items:center;gap:10px;padding:0 12px}
.track{flex:1;height:6px;background:#0D131A;border-radius:3px;position:relative;overflow:hidden;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;transition:width .15s}
.ticks{position:absolute;inset:0}
.ticks i{position:absolute;top:0;bottom:0;width:1px;background:#33404E}
.prog .hint{font-family:var(--f-mono);font-size:9.5px;color:#5F6E7D;letter-spacing:.05em;white-space:nowrap}
.timer{font-family:var(--f-mono);font-size:11px;color:#8FA0B0;min-width:52px;text-align:right}

/* ============================ SLIDE LAYOUTS ============================ */
.pad{padding:52px 64px 46px}
.slide{--k:1}
.slide .kick{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px;
}
.slide .kick .dot{width:22px;height:2px;background:var(--accent);display:inline-block}
.slide h2{
  font-family:var(--f-ui);font-size:calc(37px * var(--k));line-height:1.14;letter-spacing:-.022em;
  font-weight:650;margin:0 0 6px;color:var(--ink);
}
.slide h2.sm{font-size:calc(31px * var(--k))}
.slide .lead{
  font-size:calc(18.5px * var(--k));line-height:1.5;color:var(--ink-2);margin:calc(12px * var(--k)) 0 0;max-width:96ch;font-style:italic;
}
.slide .lead b{font-style:normal;color:var(--ink);font-weight:600}
.rule{height:2px;background:var(--accent);width:64px;margin:calc(16px * var(--k)) 0 calc(20px * var(--k));flex:none}

ul.bul{list-style:none;margin:0;padding:0}
ul.bul>li{
  position:relative;padding:0 0 0 24px;margin:0 0 calc(13px * var(--k));font-size:calc(17.5px * var(--k));line-height:1.48;color:var(--ink-2);
}
ul.bul>li:before{
  content:"";position:absolute;left:3px;top:11px;width:9px;height:2px;background:var(--accent);
}
ul.bul>li b,ul.bul>li strong{color:var(--ink);font-weight:600}
ul.bul>li em{font-style:italic;color:var(--ink)}
ul.bul.tight>li{margin-bottom:calc(9px * var(--k));font-size:calc(16.5px * var(--k))}
ul.bul.sm>li{font-size:calc(15.5px * var(--k));margin-bottom:calc(8px * var(--k));padding-left:20px}
ul.bul.sm>li:before{width:7px;top:10px}
.k{font-family:var(--f-mono);font-size:.86em;background:#EEF3F8;border:1px solid var(--rule-2);
  border-radius:3px;padding:1px 5px;color:var(--ink)}
.cite{font-family:var(--f-mono);font-size:.8em;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
.th{font-family:var(--f-thai)}

/* two column body */
.body{flex:1;min-height:0;display:flex;gap:34px}
.body.v{flex-direction:column;gap:16px}
.col{flex:1;min-width:0}
.col.narrow{flex:0 0 40%}
.col.wide{flex:0 0 58%}
.figwrap{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;flex:1 1 auto}
.figbox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.figbox svg{width:100%;height:100%;max-height:100%;display:block}
.figcap{
  font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.45;
  border-top:1px solid var(--rule-2);padding-top:8px;
}
.figcap b{color:var(--ink-2);font-weight:600}

/* columns layout */
.cols{display:grid;gap:18px;flex:1;min-height:0}
.cols.n2{grid-template-columns:1fr 1fr}
.cols.n3{grid-template-columns:1fr 1fr 1fr}
.cols.n4{grid-template-columns:repeat(4,1fr)}
.cbox{
  border:1px solid var(--rule);border-radius:9px;padding:calc(16px * var(--k)) 17px;background:#FBFDFE;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.cbox.acc{border-color:var(--accent);background:var(--accent-soft)}
.cbox h4{
  font-family:var(--f-ui);font-size:calc(15px * var(--k));font-weight:650;margin:0 0 4px;letter-spacing:-.01em;color:var(--ink);
}
.cbox .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 9px;font-weight:600}
.cbox p{margin:0 0 calc(8px * var(--k));font-size:calc(14.5px * var(--k));line-height:1.46;color:var(--ink-2)}
.cbox ul.bul>li{font-size:calc(14.5px * var(--k));margin-bottom:calc(7px * var(--k));padding-left:18px}
.cbox ul.bul>li:before{width:7px;top:9px}

/* title slide */
.slide.title{background:var(--shell);color:#E9EFF5;justify-content:center}
.slide.title .pad{padding:0 78px}
.slide.title .no{
  font-family:var(--f-mono);font-size:13px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 20px;
}
.slide.title h1{
  font-family:var(--f-ui);font-size:60px;line-height:1.06;letter-spacing:-.03em;font-weight:700;
  margin:0 0 20px;max-width:20ch;color:#fff;
}
.slide.title .dek{font-size:20px;line-height:1.5;color:#9DAEBE;max-width:62ch;margin:0 0 30px;font-style:italic}
.slide.title .meta{
  font-family:var(--f-mono);font-size:12px;color:#6F7F90;letter-spacing:.05em;line-height:1.9;
  border-top:1px solid #303B48;padding-top:18px;max-width:62ch;
}
.slide.title .meta b{color:#C3D0DC;font-weight:500}
.slide.title:after{
  content:"";position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.30;
}
.slide.title:before{
  content:"";position:absolute;right:-40px;bottom:-240px;width:520px;height:520px;
  border:2px solid var(--accent);border-radius:50%;opacity:.16;
}

/* divider */
.slide.divider{background:var(--accent-soft);justify-content:center}
.slide.divider .pad{padding:0 78px}
.slide.divider .n{
  font-family:var(--f-mono);font-size:96px;line-height:1;font-weight:600;letter-spacing:-.05em;
  color:var(--accent);opacity:.30;margin:0 0 6px;
}
.slide.divider h2{font-size:46px;max-width:22ch;color:var(--accent-ink)}
.slide.divider .lead{color:var(--ink-2);font-size:19px;max-width:70ch}
.slide.divider .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px;max-width:84ch}
.slide.divider .chips span{
  font-family:var(--f-mono);font-size:11px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--accent);color:var(--accent-ink);background:rgba(255,255,255,.6);
}

/* refs */
ol.refs{list-style:none;counter-reset:r;margin:0;padding:0;column-gap:34px}
ol.refs.two{column-count:2}
ol.refs>li{
  counter-increment:r;position:relative;padding:0 0 0 30px;margin:0 0 11px;
  font-size:calc(14.5px * var(--k));line-height:1.45;color:var(--ink-2);break-inside:avoid;
}
ol.refs>li:before{
  content:counter(r);position:absolute;left:0;top:2px;font-family:var(--f-mono);font-size:10px;
  font-weight:600;color:#fff;background:var(--accent);width:19px;height:19px;border-radius:4px;
  display:grid;place-items:center;
}
ol.refs>li b{color:var(--ink);font-weight:600}
ol.refs>li i{color:var(--ink-3);font-style:italic}

/* callout / lab / vilab */
.callout{
  border-left:3px solid var(--accent);background:var(--accent-soft);padding:calc(14px * var(--k)) 18px;border-radius:0 8px 8px 0;
  margin-top:calc(16px * var(--k));
}
.callout .h{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);font-weight:600;margin-bottom:6px;
}
.callout p{margin:0;font-size:calc(15.5px * var(--k));line-height:1.5;color:var(--ink-2)}
.slide.vilab{background:linear-gradient(180deg,#FBFDFE 0%,#F2F6FA 100%)}
.slide.vilab .badge{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff;background:var(--ink);
  padding:5px 11px;border-radius:20px;margin-bottom:14px;
}
.slide.vilab .badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.slide.lab{background:#FCFBF6}
.stat{display:flex;gap:calc(26px * var(--k));margin:calc(18px * var(--k)) 0 0;flex-wrap:wrap}
.stat div{flex:0 0 auto}
.stat .v{font-family:var(--f-ui);font-size:calc(34px * var(--k));font-weight:700;letter-spacing:-.03em;color:var(--accent);line-height:1}
.stat .l{margin-top:calc(6px * var(--k))!important}
.stat .l{font-family:var(--f-mono);font-size:calc(10px * var(--k));letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-top:6px;max-width:22ch;line-height:1.5}

/* table */
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:0 12px 9px;border-bottom:2px solid var(--accent);font-weight:600;
}
table.t td{padding:calc(10px * var(--k)) 12px;font-size:calc(14.5px * var(--k));border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top;line-height:1.42}
table.t td:first-child{font-weight:600;color:var(--ink)}
table.t tr:last-child td{border-bottom:none}

/* per-slide citation footnotes */
sup.fn{font-family:var(--f-mono);font-size:.62em;font-weight:600;color:var(--accent);
  vertical-align:super;line-height:0;padding-left:1px}
.cites{
  flex:none;margin-top:calc(9px * var(--k));padding-top:6px;border-top:1px solid var(--rule-2);
  display:flex;flex-direction:column;gap:calc(2px * var(--k));
}
.cites .c{
  font-family:var(--f-ui);font-size:calc(10.5px * var(--k));line-height:1.42;color:var(--ink-3);
  display:flex;gap:6px;align-items:baseline;
}
.cites .c b{color:var(--accent);font-weight:700;flex:none;font-family:var(--f-mono);font-size:.94em}
.cites .c i{color:var(--ink-2);font-style:italic}
.cites .c .ed{min-width:0}
.slide.figure .cites,.slide.split .cites,.slide.splitr .cites{margin-top:calc(8px * var(--k))}

/* slide footer */
.foot{
  position:absolute;left:64px;right:64px;bottom:16px;display:flex;align-items:center;gap:12px;
  font-family:var(--f-mono);font-size:9.5px;color:#9FADBC;letter-spacing:.08em;text-transform:uppercase;
  border-top:1px solid var(--rule-2);padding-top:9px;
}
.foot .sp{flex:1}
.foot .tag{padding:2px 7px;border-radius:3px;border:1px solid var(--rule);letter-spacing:.09em}
.foot .tag.frontier{color:var(--warn);border-color:#E4BCC4;background:#FDF2F4}
.foot .tag.textbook{color:#3A4A57;border-color:#C3CCD4;background:#F2F5F7}
.foot .tag.both{color:#8A6A12;border-color:#E0D0A4;background:#FDF8EA}
.slide.title .foot,.slide.divider .foot{display:none}

/* editing */
body.edit .ed{border-radius:3px;cursor:text}
body.edit .ed:hover{background:#F1F7FC;box-shadow:0 0 0 4px #F1F7FC}
body.edit .ed:focus{background:#FFFBE6;box-shadow:0 0 0 4px #FFFBE6;outline:none}
.slide.title .ed:hover,.slide.title .ed:focus{background:#2C3742!important;box-shadow:0 0 0 4px #2C3742!important}

/* ============================ OVERVIEW ============================ */
.ov{position:fixed;inset:44px 0 30px 0;z-index:35;background:#10161E;overflow-y:auto;display:none;padding:20px}
body.ov-on .ov{display:block}
body.ov-on .stage{visibility:hidden}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;max-width:1500px;margin:0 auto}
.ovc{position:relative;cursor:pointer;border-radius:6px;overflow:hidden;background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.35);border:2px solid transparent}
.ovc:hover{border-color:var(--accent)}
.ovc.cur{border-color:#fff}
.ovc .mini{width:var(--W);height:var(--H);transform-origin:top left;pointer-events:none}
.ovc .shell{position:relative;overflow:hidden}
.ovc .lb{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.82));
  color:#fff;font-family:var(--f-mono);font-size:9.5px;padding:16px 8px 6px;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovc .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;
  font-family:var(--f-mono);font-size:9.5px;padding:2px 6px;border-radius:3px}
.ovsec{grid-column:1/-1;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7E8E9E;border-bottom:1px solid #29333F;padding:14px 0 7px;margin-top:6px}

/* ============================ NOTES ============================ */
.notes{
  position:fixed;right:0;top:44px;bottom:30px;width:340px;z-index:38;background:#131A23;
  border-left:1px solid #000;display:none;flex-direction:column;
}
body.notes-on .notes{display:flex}
.notes .nh{padding:12px 14px;border-bottom:1px solid #262F3B;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E8E9E}
.notes .nb{flex:1;overflow-y:auto;padding:12px 14px}
.notes .nxt{background:#0D131A;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.notes .nxt .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#5D6C7B;margin-bottom:5px}
.notes .nxt .t{font-family:var(--f-ui);font-size:13px;color:#C6D3DF;line-height:1.35}
.notes textarea{
  width:100%;min-height:280px;background:#0D131A;border:1px solid #262F3B;border-radius:6px;
  color:#D2DCE6;padding:11px 12px;font-family:var(--f-body);font-size:14px;line-height:1.55;resize:vertical;
}
.notes textarea:focus{outline:none;border-color:var(--accent)}
.notes .tip{font-family:var(--f-mono);font-size:9.5px;color:#4F5D6B;line-height:1.7;margin-top:12px}

/* ============================ MODAL ============================ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,17,.72);display:none;padding:26px}
.modal.on{display:flex;align-items:center;justify-content:center}
.sheet{background:#fff;border-radius:10px;width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.sheet header h3{margin:0;font-family:var(--f-ui);font-size:15px;font-weight:650;flex:1}
.sheet .mb{padding:0;flex:1;overflow:auto;min-height:0}
.sheet textarea{width:100%;height:56vh;border:0;padding:16px 20px;font-family:var(--f-mono);font-size:11.5px;
  line-height:1.6;resize:none;outline:none;background:#F7F9FB;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.mbtn{font-family:var(--f-ui);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:6px;
  border:1px solid var(--rule);background:#fff;color:var(--ink)}
.mbtn:hover{border-color:var(--ink-3)}
.mbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.help{padding:6px 20px 20px}
.help table{width:100%;border-collapse:collapse;font-size:13.5px}
.help td{padding:7px 10px;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
.help td:first-child{width:150px}
.help kbd{font-family:var(--f-mono);font-size:11px;background:#EEF3F8;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--ink)}
.help h4{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:20px 0 6px}

/* search */
.srch{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:55;width:min(680px,92vw);display:none}
body.srch-on .srch{display:block}
.srch input{width:100%;padding:13px 16px;border-radius:9px;border:1px solid #33404E;background:#0D131A;
  color:#E4EBF2;font-family:var(--f-ui);font-size:15px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.srch input:focus{outline:none;border-color:var(--accent)}
.sres{margin-top:6px;background:#131A23;border:1px solid #262F3B;border-radius:9px;max-height:52vh;
  overflow-y:auto;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sres button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid #1E2732;color:#C0CDD9}
.sres button:hover{background:#1C2530;color:#fff}

<script id="deckdata" type="application/json">{"meta": {"key": "ch2", "title": "Data Preparation for ML and AI — Chapter 2: Text, NLP and LLM data", "short": "Ch 2 · Text, NLP and LLM data", "hub": "index.html"}, "secs": ["2.1 Acquisition and extraction", "2.2 Classical preprocessing", "2.3 Subword tokenisation", "2.4 Heuristic filtering", "2.5 Model-based filtering", "2.6 Deduplication", "2.7 Safety, PII and compliance", "2.8 Mixing, curriculum and packing", "2.9 Instruction and preference data", "2.10 Retrieval and RAG", "2.11 Text augmentation", "2.12 Clinical and specialised text"], "figs": {"f_twoeras": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Two eras stacked on top of each other — and both are in production today</text><rect x=\"16\" y=\"44\" width=\"552\" height=\"326\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"16\" y=\"44\" width=\"552\" height=\"5\" rx=\"2\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"38\" y=\"80\" font-size=\"16\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The classical stack</text><text x=\"38\" y=\"100\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">1990s – 2018, and still the right answer for retrieval,</text><text x=\"38\" y=\"114\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">low-resource and clinical NLP</text><rect x=\"38\" y=\"130\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"50\" y=\"147\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Raw text</text><rect x=\"38\" y=\"159\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#EAF0F6\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"50\" y=\"176\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Sentence + word segmentation</text><rect x=\"38\" y=\"188\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#EAF0F6\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"50\" y=\"205\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Case-folding, punctuation strip</text><rect x=\"38\" y=\"217\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#EAF0F6\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"50\" y=\"234\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Stopword removal</text><rect x=\"38\" y=\"246\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#EAF0F6\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"50\" y=\"263\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Stemming / lemmatisation</text><rect x=\"38\" y=\"275\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#EAF0F6\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"50\" y=\"292\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Bag-of-words · TF-IDF · BM25</text><rect x=\"38\" y=\"304\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#EAF0F6\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"50\" y=\"321\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Linear model · CRF · SVM</text><text x=\"38\" y=\"346\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Every step is a human decision you can inspect, argue about</text><text x=\"38\" y=\"360\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">and ablate.</text><rect x=\"582\" y=\"44\" width=\"552\" height=\"326\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"582\" y=\"44\" width=\"552\" height=\"5\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"604\" y=\"80\" font-size=\"16\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The LLM stack</text><text x=\"604\" y=\"100\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">2018 – now, where corpus construction is the main research</text><text x=\"604\" y=\"114\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">contribution of most frontier models</text><rect x=\"604\" y=\"130\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"616\" y=\"147\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Raw text, near-untouched</text><rect x=\"604\" y=\"159\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"616\" y=\"176\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Extract · normalise · language ID</text><rect x=\"604\" y=\"188\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"616\" y=\"205\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Filter · deduplicate · decontaminate</text><rect x=\"604\" y=\"217\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"616\" y=\"234\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Subword or byte-level tokenisation</text><rect x=\"604\" y=\"246\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"616\" y=\"263\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Mix domains · pack sequences</text><rect x=\"604\" y=\"275\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"616\" y=\"292\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Instruction + preference data</text><rect x=\"604\" y=\"304\" width=\"508\" height=\"25\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#D3DCE6\" stroke-width=\"1.1\"/><text x=\"616\" y=\"321\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\">Retrieval index at serving time</text><text x=\"604\" y=\"346\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Almost every step is a corpus-scale decision that nobody can</text><text x=\"604\" y=\"360\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">inspect by eye.</text><rect x=\"16\" y=\"372\" width=\"1118\" height=\"72\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"398\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The teaching problem</text><text x=\"36\" y=\"420\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">You cannot teach one and skip the other. A Thai clinical-text project in 2026 uses dictionary segmentation, BM25 and a fine-tuned</text><text x=\"36\" y=\"437\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">encoder on Monday, and a filtered, deduplicated, chunked corpus for a retrieval system on Tuesday.</text></svg>", "f_crawl": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Where a pretraining corpus physically comes from, and the choice that decides its ceiling</text><rect x=\"24\" y=\"130\" width=\"176\" height=\"92\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width= troke-dasharray=\"6 5\"/><path d=\"M1018 250 L1018.0 227.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M1018.0 220.0 L1013.6 229.0 L1022.4 229.0 z\" fill=\"#8494A5\"/><text x=\"560\" y=\"306\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">the cheap path — and the one that caps your quality</text><rect x=\"24\" y=\"332\" width=\"1100\" height=\"112\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"44\" y=\"358\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The finding worth knowing before you start</text><text x=\"44\" y=\"380\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">RefinedWeb (Penedo et al., NeurIPS 2023) reports that re-extracting text from WARC with a good main-content extractor, then</text><text x=\"44\" y=\"397\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">filtering and deduplicating hard, produces web-only data that outperforms hand-curated corpus mixtures. WET is convenient; it also</text><text x=\"44\" y=\"414\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">bakes in navigation menus, cookie banners and footers that no downstream filter fully removes. Extraction is not a preliminary —</text><text x=\"44\" y=\"431\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">it is the first modelling decision you make.</text></svg>", "f_prepharm": "<svg viewBox=\"0 0 600 520\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"20\" y=\"26\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Aggressive preprocessing is lossy — the question is what you lose</text><text x=\"20\" y=\"48\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">One clinical sentence, run through the classical stack. Watch the</text><text x=\"20\" y=\"62\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">clinically decisive word disappear at step three.</text><rect x=\"24\" y=\"86\" width=\"552\" height=\"44\" rx=\"7\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"104\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">RAW</text><text x=\"38\" y=\"124\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">The patient's CD4 count was NOT low.</text><rect x=\"24\" y=\"138\" width=\"552\" height=\"62\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"156\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">CASE-FOLD</text><text x=\"38\" y=\"176\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">the patient's cd4 count was not low.</text><text x=\"38\" y=\"193\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">CD4 and NOT lose case — as do gene symbols and acronyms</text><rect x=\"24\" y=\"208\" width=\"552\" height=\"62\" rx=\"7\" fill=\"#FBF0F2\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"38\" y=\"226\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">STOPWORDS</text><text x=\"38\" y=\"246\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">patient's cd4 count low.</text><text x=\"38\" y=\"263\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"400\">“not” is on every standard stopword list; the meaning is inverted</text><rect x=\"24\" y=\"278\" width=\"552\" height=\"62\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"296\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">STEM</text><text x=\"38\" y=\"316\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">patient cd4 count low</text><text x=\"38\" y=\"333\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">tense, number and negation morphology gone; severe/severity merge</text><rect x=\"24\" y=\"366\" width=\"270\" height=\"140\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"42\" y=\"392\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Keep the classical stack</text><text x=\"42\" y=\"412\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">BM25 and TF-IDF retrieval · tiny</text><text x=\"42\" y=\"426\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">labelled sets · interpretable</text><text x=\"42\" y=\"440\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">feature models · languages with</text><text x=\"42\" y=\"454\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">no pretrained model · any</text><text x=\"42\" y=\"468\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">pipeline you must justify line</text><text x=\"42\" y=\"482\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">by line</text><rect x=\"306\" y=\"366\" width=\"270\" height=\"140\" rx=\"9\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"324\" y=\"392\" font-size=\"13\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">Drop it for transformers</text><text x=\"324\" y=\"412\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Subword models exploit case,</text><text x=\"324\" y=\"426\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">morphology and function words.</text><text x=\"324\" y=\"440\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Normalise encoding, fix</text><text x=\"324\" y=\"454\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">mojibake, strip boilerplate —</text><text x=\"324\" y=\"468\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">then stop.</text></svg>", "f_thaiseg": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Thai has no whitespace word boundary — segmentation is a model, and it is the first thing that can be wrong</text><text x=\"575.0\" y=\"50\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">ONE STRING · FIVE CHARACTERS · NO SPACE ANYWHERE IN IT</text><text x=\"575.0\" y=\"100\" font-size=\"44\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"Noto Sans Thai,Noto Serif Thai,Loma,Garuda,Norasi,Tahoma,sans-serif\">ตากลม</text><rect x=\"86\" y=\"138\" width=\"440\" height=\"112\" rx=\"9\" fill=\"#EAF0F6\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"110\" y=\"176\" font-size=\"27\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"Noto Sans Thai,Noto Serif Thai,Loma,Garuda,Norasi,Tahoma,sans-serif\">ตา | กลม</text><text x=\"110\" y=\"198\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">taa | klom</text><text x=\"110\" y=\"222\" font-size=\"13\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">eye + round</text><text x=\"110\" y=\"241\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">“round eyes”</text><path d=\"M575.0 126 L312.9982593799808 131.84390499524207\" fill=\"none\" stroke=\"#2D5C8A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M306.0 132.0 L315.1 136.2 L314.9 127.4 z\" fill=\"#2D5C8A\"/><rect x=\"624\" y=\"138\" width=\"440\" height=\"112\" rx=\"9\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"648\" y=\"176\" font-size=\"27\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"Noto Sans Thai,Noto Serif Thai,Loma,Garuda,Norasi,Tahoma,sans-serif\">ตาก | ลม</text><text x=\"648\" y=\"198\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">taak | lom</text><text x=\"648\" y=\"222\" font-size=\"13\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">to air out + wind</text><text x=\"648\" y=\"241\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">“to air something in the wind”</text><path d=\"M575.0 126 L837.0017406200192 131.84390499524207\" fill=\"none\" stroke=\"#6A4C93\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M844.0 132.0 L835.1 127.4 L834.9 136.2 z\" fill=\"#6A4C93\"/><rect x=\"37\" y=\"266\" width=\"196\" height=\"48\" rx=\"8\" fill=\"#FBF0F2\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"135.0\" y=\"295.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Segmentation</text><path d=\"M236 290 L245.0 290.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M252.0 290.0 L243.0 285.6 L243.0 294.4 z\" fill=\"#8494A5\"/><rect x=\"257\" y=\"266\" width=\"196\" height=\"48\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"355.0\" y=\"295.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Tokens</text><path d=\"M456 290 L465.0 290.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M472.0 290.0 L463.0 285.6 L463.0 294.4 z\" fill=\"#8494A5\"/><rect x=\"477\" y=\"266\" width=\"196\" height=\"48\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"575.0\" y=\"295.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Features / embeddings</text><path d=\"M676 290 L685.0 290.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M692.0 290.0 L683.0 285.6 L683.0 294.4 z\" fill=\"#8494A5\"/><rect x=\"697\" y=\"266\" width=\"196\" height=\"48\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"795.0\" y=\"295.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Model</text><path d=\"M896 290 L905.0 290.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M912.0 290.0 L903.0 285.6 L903.0 294.4 z\" fill=\"#8494A5\"/><rect x=\"917\" y=\"266\" width=\"196\" height=\"48\" rx=\"8\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"1015.0\" y=\"295.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Decision</text><text x=\"37\" y=\"334\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">an error here…</text><text x=\"1113\" y=\"334\" font-size=\"11.5\" text-anchor=\"end\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">…is invisible everywhere after it</text><line x1=\"150\" y1=\"330\" x2=\"880\" y2=\"330\" stroke=\"#6A4C93\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><rect x=\"16\" y=\"348\" width=\"1118\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"374\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">What this changes in practice</text><text x=\"36\" y=\"396\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Spaces in Thai mark phrase boundaries, not words, and there is no sentence-final full stop. PyThaiNLP's newmm is dictionary-based</text><text x=\"36\" y=\"413\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">maximal matching — fast, and wrong on any word outside its dictionary. deepcut is a neural character-level segmenter — better on</text><text x=\"36\" y=\"430\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">unseen words, slower, domain-bound. Report which you used, and its version, as you would a model.</text></svg>", "f_ncds": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">NCDs Listener — Thippimanporn, Khamna, Wiratchawa &amp; Intharah, PLOS ONE 20(9):e0332484, 2025</text><rect x=\"27\" y=\"44\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"127.0\" y=\"76.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Scrape</text><text x=\"127.0\" y=\"92.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Selenium + BeautifulSoup</text><path d=\"M230 79 L239.0 79.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M246.0 79.0 L237.0 74.6 L237.0 83.4 z\" fill=\"#8494A5\"/><rect x=\"251\" y=\"44\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"351.0\" y=\"76.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Preprocess</text><text x=\"351.0\" y=\"92.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">dedup + anonymise</text><path d=\"M454 79 L463.0 79.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M470.0 79.0 L461.0 74.6 L461.0 83.4 z\" fill=\"#8494A5\"/><rect x=\"475\" y=\"44\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"575.0\" y=\"76.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Tokenise</text><text x=\"575.0\" y=\"92.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">language-specific</text><path d=\"M678 79 L687.0 79.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M694.0 79.0 L685.0 74.6 L685.0 83.4 z\" fill=\"#8494A5\"/><rect x=\"699\" y=\"44\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"799.0\" y=\"76.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Fine-tune BERT</text><text x=\"799.0\" y=\"92.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Thai and English, separately</text><path d=\"M902 79 L911.0 79.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M918.0 79.0 L909.0 74.6 L909.0 83.4 z\" fill=\"#8494A5\"/><rect x=\"923\" y=\"44\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"1023.0\" y=\"76.0\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Classify</text><text x=\"1023.0\" y=\"92.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">three classes</text><rect x=\"340\" y=\"126\" width=\"115.65\" height=\"21\" rx=\"10.5\" fill=\"#F2F6FA\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"397.825\" y=\"140.3\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">NON-INFORMATIVE</text><rect x=\"467.65\" y=\"126\" width=\"135.18\" height=\"21\" rx=\"10.5\" fill=\"#F2F6FA\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"535.24\" y=\"140.3\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">SHARING EXPERIENCE</text><rect x=\"614.8299999999999\" y=\"126\" width=\"76.59\" height=\"21\" rx=\"10.5\" fill=\"#F2F6FA\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"653.1249999999999\" y=\"140.3\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1\">INQUIRING</text><rect x=\"27\" y=\"166\" width=\"340\" height=\"142\" rx=\"10\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"49\" y=\"194\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Thai classifier</text><text x=\"49\" y=\"250\" font-size=\"44\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">96.24%</text><text x=\"49\" y=\"274\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">accuracy, three-class</text><text x=\"49\" y=\"294\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">same architecture, same three classes</text><rect x=\"391\" y=\"166\" width=\"340\" height=\"142\" rx=\"10\" fill=\"#EAF0F6\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"413\" y=\"194\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">English classifier</text><text x=\"413\" y=\"250\" font-size=\"44\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">80.89%</text><text x=\"413\" y=\"274\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">accuracy, same taxonomy</text><text x=\"413\" y=\"294\" font-size=\"11\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">same architecture, same three classes</text><rect x=\"755\" y=\"166\" width=\"368\" height=\"142\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"777\" y=\"194\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The gap runs the wrong way</text><text x=\"777\" y=\"216\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">The usual story says the low-resource language</text><text x=\"777\" y=\"232\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">should lose. Here it wins by fifteen points.</text><text x=\"777\" y=\"248\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">So the explanation is not “Thai is hard” — it</text><text x=\"777\" y=\"264\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">is somewhere in the corpus.</text><text x=\"777\" y=\"296\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">ask the room: where?</text><rect x=\"27\" y=\"316\" width=\"1096\" height=\"128\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"47\" y=\"342\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Four candidate explanations, all of them preparation problems</text><text x=\"47\" y=\"364\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Corpus composition — the Thai and English comment pools were scraped from different platforms and communities. Annotation</text><text x=\"47\" y=\"381\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">quality — different annotators, same rubric, different reading of “inquiring”. Class balance — an 80% majority class flatters</text><text x=\"47\" y=\"398\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">accuracy. And segmentation — English word boundaries are free, Thai ones are a model output. A 30-participant user study</text><text x=\"47\" y=\"415\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">separately found medical-focused generative summaries beat general summaries on domain knowledge, societal impact and</text><text x=\"47\" y=\"432\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">reasoning (p &lt; 0.001).</text></svg>", "f_bpe": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">BPE learns a vocabulary by repeatedly merging the most frequent adjacent pair</text><rect x=\"16\" y=\"44\" width=\"470\" height=\"312\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"38\" y=\"74\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The corpus, as counted words</text><text x=\"38\" y=\"100\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">low ×5   lower ×2   newest ×6   widest ×3</text><line x1=\"38\" y1=\"116\" x2=\"464\" y2=\"116\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"38\" y=\"138\" font-size=\"10.5\" t 400\">→</text><text x=\"246\" y=\"303\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">low</text><text x=\"452\" y=\"303\" font-size=\"11\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">7</text><rect x=\"38\" y=\"316\" width=\"426\" height=\"27\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"50\" y=\"335\" font-size=\"11\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">6</text><text x=\"76\" y=\"335\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">n  +  e</text><text x=\"214\" y=\"335\" font-size=\"12\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\">→</text><text x=\"246\" y=\"335\" font-size=\"12\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">ne</text><text x=\"452\" y=\"335\" font-size=\"11\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">6</text><text x=\"38\" y=\"352\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">· marks the end of a word</text><rect x=\"502\" y=\"44\" width=\"632\" height=\"312\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"524\" y=\"74\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The merges as a tree</text><rect x=\"560\" y=\"282\" width=\"70\" height=\"40\" rx=\"6\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"595\" y=\"308\" font-size=\"15\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">e</text><rect x=\"650\" y=\"282\" width=\"70\" height=\"40\" rx=\"6\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"685\" y=\"308\" font-size=\"15\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">s</text><rect x=\"740\" y=\"282\" width=\"70\" height=\"40\" rx=\"6\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"775\" y=\"308\" font-size=\"15\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">t</text><rect x=\"830\" y=\"282\" width=\"70\" height=\"40\" rx=\"6\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"865\" y=\"308\" font-size=\"15\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">·</text><rect x=\"595\" y=\"224\" width=\"90\" height=\"38\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"640.0\" y=\"249\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">es</text><text x=\"583\" y=\"248\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">1</text><rect x=\"657\" y=\"166\" width=\"100\" height=\"38\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"707.0\" y=\"191\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">est</text><text x=\"645\" y=\"190\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">2</text><rect x=\"721\" y=\"108\" width=\"130\" height=\"38\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"786.0\" y=\"133\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">est·</text><text x=\"709\" y=\"132\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">3</text><path d=\"M595 282 L640 262\" fill=\"none\" stroke=\"#8494A5\" stroke- own token is possible. But a Latin character is one byte and a Thai</text><text x=\"36\" y=\"427\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">character is three — so a Thai string starts three times longer before a single merge is learned.</text></svg>", "f_fertility": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Tokenizer fertility: how many tokens the same content costs, relative to English</text><line x1=\"96\" y1=\"117.0\" x2=\"636\" y2=\"117.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"96\" y1=\"170.0\" x2=\"636\" y2=\"170.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"96\" y1=\"223.0\" x2=\"636\" y2=\"223.0\" stroke=\"#D3DCE6\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-dasharray=\"3 5\" opacity=\"0.7\"/><line x1=\"96\" y1=\"276\" x2=\"636\" y2=\"276\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"96\" y1=\"64\" x2=\"96\" y2=\"276\" stroke=\"#8494A5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><g transform=\"translate(62,170.0) rotate(-90)\"><text x=\"0\" y=\"0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">tokens per unit of content</text></g><text x=\"87\" y=\"280.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">0</text><text x=\"87\" y=\"227.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">4x</text><text x=\"87\" y=\"174.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">8x</text><text x=\"87\" y=\"121.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">12x</text><text x=\"87\" y=\"68.0\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">16x</text><rect x=\"122.0\" y=\"262.75\" width=\"76\" height=\"13.25\" rx=\"4\" fill=\"#8FA0B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"160.0\" y=\"253.75\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">1x</text><text x=\"160.0\" y=\"295\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">English</text><rect x=\"259.33333333333337\" y=\"256.125\" width=\"76\" height=\"19.875\" rx=\"4\" fill=\"#8FA0B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"297.33333333333337\" y=\"247.125\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">~1.5x</text><text x=\"297.33333333333337\" y=\"295\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Spanish</text><rect x=\"396.6666666666667\" y=\"223.0\" width=\"76\" height=\"53.0\" rx=\"4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"434.6666666666667\" y=\"214.0\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">~4x</text><text x=\"434.6666666666667\" y=\"295\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Thai</text><rect x=\"534.0\" y=\"156.75\" width=\"76\" height=\"119.25\" rx=\"4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"572.0\" y=\"147.75\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">~9x</text><text x=\"572.0\" y=\"295\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Burmese</text><line x1=\"96\" y1=\"77.25\" x2=\"636\" y2=\"77.25\" stroke=\"#A3384F\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><text x=\"632\" y=\"69.25\" font-size=\"11\" text-anchor=\"end\" fill=\"#A3384F\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">15x — the worst disparity measured (Petrov et al., NeurIPS 2023)</text><text x=\"96\" y=\"318\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\" font-style=\"italic\">Illustrative magnitudes, not measured values — Lab 5 has you measure your own.</text><rect x=\"680\" y=\"64\" width=\"454\" height=\"74\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"680\" y=\"64\" width=\"5\" height=\"74\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"700\" y=\"88\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Accuracy</text><text x=\"700\" y=\"108\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">More tokens per word means less context per fact, worse</text><text x=\"700\" y=\"122\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">arithmetic, and rare-word fragmentation that hides morphology.</text><rect x=\"680\" y=\"150\" width=\"454\" height=\"74\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"680\" y=\"150\" width=\"5\" height=\"74\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"700\" y=\"174\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Context window</text><text x=\"700\" y=\"194\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">A 128k window is a different window in Thai. The same document</text><text x=\"700\" y=\"208\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">may not fit, so retrieval and chunking budgets shift too.</text><rect x=\"680\" y=\"236\" width=\"454\" height=\"74\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"680\" y=\"236\" width=\"5\" height=\"74\" rx=\"2\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"700\" y=\"260\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Cost</text><text x=\"700\" y=\"280\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Ahia et al. (EMNLP 2023) find API cost varies by an order of</text><text x=\"700\" y=\"294\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">magnitude for equivalent content. Users pay for the alphabet</text><text x=\"700\" y=\"308\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">they were born into.</text><rect x=\"16\" y=\"334\" width=\"1118\" height=\"110\" rx=\"9\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"36\" y=\"360\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">A thesis topic, and the routes people are taking</text><text x=\"36\" y=\"382\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Multilingually fair tokenisers for Thai and Southeast Asian scripts is an open, publishable problem with a measurable objective and a</text><text x=\"36\" y=\"399\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">directly affected user base. Three families of answer exist: retrain or extend the vocabulary on in-language data; go tokenizer-free</text><text x=\"36\" y=\"416\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">with byte or character models (ByT5, CANINE, both TACL 2022); or re-engineer the byte representation itself (MYTE and MAGNET, 2024) to</text><text x=\"36\" y=\"433\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">equalise sequence length across scripts. Measure fertility on your own corpus before you choose.</text></svg>", "f_cascade": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">A web-corpus filter cascade — every stage is a sampling decision with a victim</text><text x=\"40\" y=\"74\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">UNITS OF TEXT SURVIVING EACH STAGE</text><rect x=\"40.0\" y=\"87.0\" width=\"440.0\" height=\"35.714285714285715\" rx=\"5\" fill=\"#C8D6E4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"107.85714285714286\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">100</text><text x=\"496\" y=\"109.85714285714286\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Raw extracted text</text><rect x=\"123.6\" y=\"130.71428571428572\" width=\"272.8\" height=\"35.714285714285715\" rx=\"5\" fill=\"#C8D6E4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"151.57142857142858\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">62</text><text x=\"496\" y=\"153.57142857142858\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Language ID + confidence threshold</text><rect x=\"139.0\" y=\"174.42857142857144\" width=\"242.00000000000003\" height=\"35.714285714285715\" rx=\"5\" fill=\"#C8D6E4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"195.2857142857143\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">55</text><text x=\"496\" y=\"197.2857142857143\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">URL and domain blocklists</text><rect x=\"167.60000000000002\" y=\"218.14285714285714\" width=\"184.79999999999998\" height=\"35.714285714285715\" rx=\"5\" fill=\"#C8D6E4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"239.0\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">42</text><text x=\"496\" y=\"241.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">C4 rules (Raffel et al., 2020)</text><rect x=\"194.0\" y=\"261.8571428571429\" width=\"132.0\" height=\"35.714285714285715\" rx=\"5\" fill=\"#C8D6E4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"282.7142857142857\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">30</text><text x=\"496\" y=\"284.7142857142857\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Gopher quality + repetition (2021)</text><rect x=\"220.4\" y=\"305.57142857142856\" width=\"79.2\" height=\"35.714285714285715\" rx=\"5\" fill=\"#C8D6E4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"326.4285714285714\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">18</text><text x=\"496\" y=\"328.4285714285714\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">MinHash near-dedup — biggest drop</text><rect x=\"230.0\" y=\"349.2857142857143\" width=\"60.0\" height=\"35.714285714285715\" rx=\"5\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"370.1428571428571\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"600\">7</text><text x=\"496\" y=\"372.1428571428571\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Model-based quality score (§2.5)</text><rect x=\"780\" y=\"60\" width=\"354\" height=\"330\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"802\" y=\"90\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Filters are not commutative</text><text x=\"802\" y=\"114\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Deduplicating before quality filtering</text><text x=\"802\" y=\"130\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">gives a different corpus from doing it the</text><text x=\"802\" y=\"146\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">other way round, because both stages</text><text x=\"802\" y=\"162\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">change the base rates the next stage sees.</text><line x1=\"802\" y1=\"190\" x2=\"1112\" y2=\"190\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"802\" y=\"214\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">So the only honest method is:</text><circle cx=\"812\" cy=\"236\" r=\"3.4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"826\" y=\"240\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">fix one small downstream benchmark</text><circle cx=\"812\" cy=\"264\" r=\"3.4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"826\" y=\"268\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">ablate each stage at fixed compute</text><circle cx=\"812\" cy=\"292\" r=\"3.4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"826\" y=\"296\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">report tokens surviving each stage</text><circle cx=\"812\" cy=\"320\" r=\"3.4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"826\" y=\"324\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">report language and register counts</text><circle cx=\"812\" cy=\"348\" r=\"3.4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"826\" y=\"352\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">and publish the order you settled on</text><text x=\"575.0\" y=\"420\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#4B5A6B\" font-weight=\"400\" font-style=\"italic\">Ask of every stage: how many tokens did it remove, and from which languages, registers and sources?</text></svg>", "f_fineweb": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">FineWeb / FineWeb-Edu — Penedo et al., NeurIPS 2024 (arXiv:2406.17557)</text><rect x=\"27\" y=\"46\" width=\"250\" height=\"82\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"152.0\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">FineWeb</text><text x=\"152.0\" y=\"100.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">15T tokens, filtered web</text><path d=\"M280 87 L297.0 87.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M304.0 87.0 L295.0 82.6 L295.0 91.4 z\" fill=\"#8494A5\"/><rect x=\"309\" y=\"46\" width=\"250\" height=\"82\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"434.0\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">LLM annotates a seed</text><text x=\"434.0\" y=\"100.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">educational value, 0-5 rubric</text><path d=\"M562 87 L579.0 87.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M586.0 87.0 L577.0 82.6 L577.0 91.4 z\" fill=\"#8494A5\"/><rect x=\"591\" y=\"46\" width=\"250\" height=\"82\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"716.0\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Distil into a classifier</text><text x=\"716.0\" y=\"100.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">small, cheap, runs on 15T</text><path d=\"M844 87 L861.0 87.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M868.0 87.0 L859.0 82.6 L859.0 91.4 z\" fill=\"#8494A5\"/><rect x=\"873\" y=\"46\" width=\"250\" height=\"82\" rx=\"8\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"998.0\" y=\"84.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\">Keep score ≥ 3</text><text x=\"998.0\" y=\"100.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">FineWeb-Edu, 1.3T tokens</text><rect x=\"24\" y=\"148\" width=\"350\" height=\"88\" rx=\"9\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"44\" y=\"196\" font-size=\"30\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">15T → 1.3T</text><text x=\"44\" y=\"220\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">tokens kept</text><rect x=\"400\" y=\"148\" width=\"350\" height=\"88\" rx=\"9\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"420\" y=\"196\" font-size=\"30\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">≈ 92%</text><text x=\"420\" y=\"220\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">of FineWeb removed</text><rect x=\"776\" y=\"148\" width=\"350\" height=\"88\" rx=\"9\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"796\" y=\"196\" font-size=\"30\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">70+</text><text x=\"796\" y=\"220\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">ablation models released</text><rect x=\"24\" y=\"250\" width=\"640\" height=\"106\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"44\" y=\"276\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Reported downstream effect</text><text x=\"166\" y=\"322\" font-size=\"12\" text-anchor=\"end\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">MMLU</text><rect x=\"210\" y=\"288\" width=\"62.699999999999996\" height=\"22\" rx=\"4\" fill=\"#9FB0C0\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"280.7\" y=\"304\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">33%</text><rect x=\"210\" y=\"316\" width=\"70.3\" height=\"22\" rx=\"4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"288.3\" y=\"332\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">37%</text><text x=\"386\" y=\"322\" font-size=\"12\" text-anchor=\"end\" fill=\"#4B5A6B\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">ARC</text><rect x=\"430\" y=\"288\" width=\"87.39999999999999\" height=\"22\" rx=\"4\" fill=\"#9FB0C0\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"525.4\" y=\"304\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">46%</text><rect x=\"430\" y=\"316\" width=\"108.3\" height=\"22\" rx=\"4\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"546.3\" y=\"332\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">57%</text><text x=\"44\" y=\"348\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">grey = FineWeb   ·   accent = FineWeb-Edu</text><rect x=\"690\" y=\"250\" width=\"434\" height=\"106\" rx=\"9\" fill=\"#FBF0F2\" stroke=\"#A3384F\" stroke-width=\"1.4\"/><text x=\"710\" y=\"276\" font-size=\"13\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\">Read these numbers carefully</text><text x=\"710\" y=\"296\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">These are the dataset authors' own ablations. They are</text><text x=\"710\" y=\"311\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">strong evidence, carefully run and unusually well</text><text x=\"710\" y=\"326\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">documented — and they are not independent replication.</text><text x=\"710\" y=\"341\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Say so when you cite them.</text><rect x=\"24\" y=\"362\" width=\"1100\" height=\"82\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"44\" y=\"388\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The same idea, a different reference set</text><text x=\"44\" y=\"410\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">DCLM does not use an LLM rubric at all: it trains a fastText classifier to separate OpenHermes 2.5 and highly-upvoted ELI5 posts</text><text x=\"44\" y=\"427\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">from random web text.
