 data"}, {"kind": "refs", "title": "Section 2.9 — references", "kick": "Reading", "sm": true, "refs": ["Wang, Kordi, Mishra, Liu, Smith, Khashabi &amp; Hajishirzi. <b>Self-Instruct.</b> <i>ACL</i>, 2023 (arXiv:2212.10560). Taori et al., <b>Alpaca</b>, Stanford release, 2023 — 52,002 pairs; no peer-reviewed paper.", "Xu et al. <b>WizardLM: Empowering Large Language Models to Follow Complex Instructions (Evol-Instruct).</b> <i>ICLR</i>, 2024 (arXiv:2304.12244); <b>Magpie</b>, 2024.", "<b>Zhou et al. LIMA: Less Is More for Alignment.</b> <i>NeurIPS</i>, 2023 (arXiv:2305.11206) — the Superficial Alignment Hypothesis.", "Chen et al. <b>AlpaGasus: Training a Better Alpaca with Fewer Data.</b> <i>ICLR</i>, 2024 — 9K of 52K, 5.7× faster training.", "Liu et al. <b>What Makes Good Data for Alignment? (DEITA).</b> <i>ICLR</i>, 2024; Lu et al., <b>InsTag</b>, 2024; Li et al., <b>IFD / Cherry LLM</b>, <i>NAACL</i> 2024, and <b>Superfiltering</b>, 2024.", "Xia, Malladi, Gururangan, Arora &amp; Chen. <b>LESS: Selecting Influential Data for Targeted Instruction Tuning.</b> <i>ICML</i>, 2024 — about 5% beating the full dataset.", "Lin et al. <b>RHO-1: Not All Tokens Are What You Need.</b> 2024 — selective language modelling at token level.", "Ouyang et al. <b>InstructGPT.</b> <i>NeurIPS</i>, 2022; Rafailov et al., <b>Direct Preference Optimization</b>, <i>NeurIPS</i> 2023; Lightman et al., <b>Let's Verify Step by Step</b>, 2023."], "sec": "2.9", "secTitle": "Instruction, preference and reasoning data"}, {"kind": "divider", "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation", "no": "2.10", "title": "Retrieval corpora and RAG preparation", "lead": "The one place in this chapter where preparation happens at serving time, gets rebuilt weekly, and is almost never evaluated on its own terms.", "chips": ["The indexing pipeline", "Fixed and recursive chunking", "Semantic chunking", "Structure-aware chunking", "Parent-child retrieval", "Late chunking", "Contextual retrieval", "Metadata", "Index hygiene", "Evaluating chunking"]}, {"kind": "cols", "title": "The indexing pipeline, stage by failure mode", "kick": "2.10.1, 2.10.8–2.10.9", "tag": "frontier", "sm": true, "lead": "Parse, clean, chunk, embed, index, maintain. Each stage is a tunable, and each has a failure that looks like a retrieval bug.", "cols": [{"sub": "Parse and clean", "h": "Where most RAG failures start", "b": ["A table flattened into prose is a table you can no longer answer questions about", "Reading order errors put a heading with the wrong section", "Headers, footers and page numbers become noise in every chunk", "Fix this before touching chunk size — it is almost always the bigger lever"]}, {"sub": "Chunk", "h": "The tunable everyone tunes first", "b": ["Size, overlap and boundary rule, covered on the next slide", "Structure-aware splitting on Markdown headings, HTML sections or code syntax trees (cAST, 2025) beats character counting whenever structure exists", "<b>Parent–child:</b> index small units for precision, return the enclosing section for context"], "acc": true}, {"sub": "Enrich and embed", "h": "Metadata is not optional", "b": ["Title, breadcrumb, section path, date, source and access-control tag on every chunk", "Metadata drives filtering, citation and permissions — three things a demo never needs and a deployment always does", "Embedding model choice fixes the language coverage; check it on Thai before you commit"]}, {"sub": "Maintain", "h": "Index hygiene", "b": ["Deduplicate the index, not just the corpus — the same guideline in three formats is three retrieved chunks that say one thing", "Staleness and TTL: a superseded clinical guideline that still retrieves is a safety issue", "Re-embed on any model change, with a version", "Deletion must propagate — a removed source must leave the index"]}], "notes": "The parent-child pattern is the highest-value trick on this slide and takes ten minutes to implement. The staleness point is the one clinicians in the room react to.", "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "figure", "title": "Five ways to cut a document", "kick": "2.10.2–2.10.7", "tag": "frontier", "lead": "In rising order of preprocessing cost — and, importantly, not in rising order of measured benefit.", "fig": "f_chunking", "figcap": "Günther et al.<sup class=\"fn\">2</sup> <b>Late Chunking.</b> Jina AI, 2024 (arXiv:2409.04701). <b>Contextual Retrieval</b>, Anthropic<sup class=\"fn\">3</sup>, September 2024 — <b>self-reported</b>. Qu<sup class=\"fn\">4</sup>, Tu &amp; Bao. <b>Is Semantic Chunking Worth the Computational Cost?</b> <i>Findings of NAACL</i> 2025 (arXiv:2410.13070).", "notes": "Late chunking is the one to highlight for a resource-constrained lab: it needs no extra training and no extra LLM calls, only a long-context encoder. Contextual retrieval reports better numbers and costs an LLM call per chunk at index time.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009.", "Günther et al. <i>Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models. Jina AI.</i> 2024.", "Anthropic. <i>Introducing Contextual Retrieval. September.</i> 2024.", "Qu et al. <i>Is Semantic Chunking Worth the Computational Cost?.</i> Findings of NAACL, 2025."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "figure", "title": "Where the chunks actually live", "kick": "2.10.9 · vector stores", "tag": "frontier", "lead": "A vector database is an approximate-nearest-neighbour index with a service around it. Choosing one is choosing what to lose.", "fig": "f_vectorindex", "figcap": "<b>The teaching point:</b> “we use a vector DB” is not a design decision. The decision is the index family, the knob setting on it, and the recall you accepted — and it belongs in the methods section next to the chunk size.", "callout": {"h": "Ask in the room", "p": "Whoever has a RAG system running: what is your recall@10 against a flat index on the same embeddings? Almost nobody has measured it, which is the point."}, "notes": "Draw the triangle on the board and put three real systems on it: a 20k-chunk hospital SOP index (flat, exact, nobody cares), a 2M-chunk literature index (HNSW), a 200M-chunk web index (IVF+PQ, on disk). The exercise is to justify the point on the triangle, not to name a product.", "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "bullets", "title": "Retrieval, filtering and the index lifecycle", "kick": "2.10.8–2.10.9", "tag": "frontier", "lead": "The parts that break in production, none of which are visible in a chunking benchmark.", "b": ["<b>Hybrid beats dense alone, reliably.</b> Dense embeddings miss exact strings — a drug code, an ICD-10 label, a Thai proper noun, a part number. Run BM25 alongside and fuse the rankings; the two fail on different queries.", "<b>Metadata is not decoration.</b> Date, source, section path, department, access level. A filter applied <em>after</em> ANN retrieval silently shrinks your k — a common cause of “the answer was in the corpus but never came back”.", "<b>Access control belongs in the index.</b> If a chunk a user may not read can be retrieved and passed to the model, the model will paraphrase it. Filter at retrieval, never in the prompt.", "<b>Changing the embedding model invalidates the whole index.</b> Vectors from two models are not comparable. Re-embedding a large corpus is a scheduled migration with a cost and a rollback — so version the index by (model, chunker, corpus snapshot), exactly as §0.8.4 versions a dataset.", "<b>Deletion must propagate.</b> A retracted guideline, a withdrawn consent, a corrected reference range. If your only path is a full rebuild you cannot honour a deletion request inside a week, which for clinical or personal data is a compliance problem rather than an engineering preference.", "<b>Staleness is a quality dimension here</b> (§0.2.1, timeliness). Stamp every chunk at ingest and set the TTL deliberately, or the system will quote the 2019 protocol with total confidence."], "callout": {"h": "The one-line summary", "p": "Chunking decides what <em>can</em> be retrieved; the index, the filter and the refresh policy decide what <em>is</em>. Only the first is usually written down."}, "notes": "The deletion point lands hardest with a clinical audience. Ask how they would remove one patient’s note from a live index today — most groups discover they would have to rebuild.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "bullets", "title": "Evaluating the preparation, not just the answers", "kick": "2.10.10–2.10.11", "tag": "frontier", "b": ["<b>Build a retrieval-only harness first</b> — a held-out question set with known relevant documents, scored by recall@k and nDCG. Without it you are tuning chunk size by vibes.", "<b>Then measure end-to-end answer quality separately,</b> so you can tell a retrieval failure from a generation failure. They need different fixes and are routinely confused.", "<b>Split by source document, never by chunk</b> (&sect;0.3.6) — chunks of one document on both sides of a split is the text version of the same-patient leak.", "<b>Know when not to chunk at all.</b> If the documents fit the context window, retrieval over whole documents is simpler and easier to cite.", "<b>Domain corpora move the bottleneck.</b> For clinical guidelines and Thai-language documents, table and layout fidelity dominates chunk-size tuning — and &sect;2.2 segmentation decides where a “sentence” boundary even is."], "stats": [{"v": "35%", "l": "contextual embeddings alone (self-reported)"}, {"v": "49%", "l": "with BM25 added"}, {"v": "67%", "l": "with reranking added"}], "callout": {"h": "Lab 6", "p": "Compare fixed, recursive, semantic, late and contextual chunking on a domain corpus with a retrieval-recall and answer-quality harness. Report the preprocessing cost per document alongside the quality gain — the Qu et al. question is whether the second justifies the first, and for your corpus the answer may differ from theirs."}, "notes": "Push hard on split-by-document. It is the single most common leak in student RAG evaluations and it inflates recall dramatically.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "refs", "title": "Section 2.10 — references", "kick": "Reading", "sm": true, "refs": ["Günther et al. <b>Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models.</b> Jina AI, 2024 (arXiv:2409.04701).", "Anthropic. <b>Introducing Contextual Retrieval.</b> September 2024 — <b>self-reported</b> results; treat as a strong engineering report, not an independent benchmark.", "<b>Qu, Tu &amp; Bao. Is Semantic Chunking Worth the Computational Cost?</b> <i>Findings of NAACL</i>, 2025 (arXiv:2410.13070). <i>The sceptical counterweight — assign both.</i>", "Xu et al. <b>LayoutLM: Pre-training of Text and Layout for Document Image Understanding.</b> <i>KDD</i>, 2020.", "<b>cAST</b>, 2025 — chunking code on abstract syntax tree boundaries.", "Robertson &amp; Zaragoza, 2009 — BM25, still half of every strong hybrid retriever.", "Tooling: LangChain, LlamaIndex, FAISS, Chroma, and a hand-written recall harness you trust more than any of them."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "divider", "sec": "2.11", "secTitle": "Text augmentation for small-data regimes", "no": "2.11", "title": "Text augmentation for small-data regimes", "lead": "What still helps when you have four hundred labelled clinical sentences and no prospect of four thousand.", "chips": ["Easy data augmentation", "Back-translation", "Contextual substitution", "LLM paraphrase", "Embedding-space mixup", "Adversarial and robustness data", "Imbalance in text classification"]}, {"kind": "cols", "title": "Five techniques, and what each one actually varies", "kick": "2.11.1–2.11.5", "tag": "both", "sm": true, "lead": "Ordered by how much of the sentence they are willing to disturb — and therefore by how likely they are to break the label.", "cols": [{"sub": "Surface edits", "h": "EDA", "b": ["Synonym replacement, random insertion, swap, deletion", "Wei &amp; Zou<sup class=\"fn\">1</sup>, <i>EMNLP</i> 2019 — real gains on small datasets, shrinking to nothing as data grows", "<b>Label preservation is not guaranteed:</b> deleting “no” changes the class", "Needs a Thai synonym resource that mostly does not exist"]}, {"sub": "Round-trip", "h": "Back-translation", "b": ["Translate out to a pivot language and back for paraphrase diversity", "Sennrich et al.<sup class=\"fn\">2</sup>, <i>ACL</i> 2016", "Quality is bounded by the MT system — for Thai↔English clinical text that bound is low and the failures are silent", "Check a sample by hand; do not trust round-trip BLEU"], "acc": true}, {"sub": "Contextual", "h": "Masked-LM substitution", "b": ["Replace words with masked-language-model predictions that respect context", "Kobayashi<sup class=\"fn\">3</sup>, 2018 — better than a thesaurus because it sees the sentence", "Can still flip sentiment or negation; condition on the label where you can"]}, {"sub": "Generative and latent", "h": "LLM paraphrase, mixup", "b": ["Prompted paraphrase, style transfer, or whole synthetic examples — deduplicate against the seed set or you have inflated your training count, not your information", "Interpolating hidden representations avoids breaking grammar entirely", "All of it inherits &sect;0.6: mark provenance, tune the mixing ratio on real validation data only"]}], "notes": "The honest summary is that augmentation gains in text are real but modest, and they vanish as the labelled set grows. Say so — it saves students a wasted month.", "cites": ["Wei & Zou. <i>EDA: Easy Data Augmentation Techniques for Boosting Performance on Text Classification Tasks.</i> EMNLP, 2019.", "Sennrich et al. <i>Neural Machine Translation of Rare Words with Subword Units.</i> ACL, 2016.", "Kobayashi. <i>Contextual Augmentation.</i> NAACL, 2018."], "sec": "2.11", "secTitle": "Text augmentation for small-data regimes"}, {"kind": "bullets", "title": "Robustness data, imbalance, and honest evaluation", "kick": "2.11.6–2.11.7", "tag": "both", "b": ["<b>Adversarial suites are better as tests than as training data.</b> Character noise, typos, negation flips and attack suites (TextAttack, Morris et al., 2020) tell you where a model breaks; adding them to training fixes that break and rarely generalises.", "<b>Typos and OCR noise are the realistic adversary</b> for a Thai clinical or social-media system — build the perturbation set from your own error logs.", "<b>Imbalance in text classification is &sect;1.9 again,</b> with the same answer: thresholds, class weights and cost-sensitive losses first; class-conditional generation only when those are exhausted.", "<b>Generating minority-class examples with an LLM is seductive and dangerous.</b> The generator's idea of a rare clinical category is a stereotype of that category, and a model trained on it learns the stereotype.", "<b>Augment inside the fold.</b> Augmented copies of a training example must never appear in validation — that is &sect;0.3.4 leakage with extra steps, and it is easy to do by accident when augmentation runs before splitting.", "<b>Evaluate on real data only,</b> and report the baseline without augmentation at the same compute budget. Most reported augmentation gains shrink when either of those two rules is applied."], "callout": {"h": "The order to try things in", "p": "Fix the labels first (&sect;0.4), then thresholds and class weights, then transfer from a related model, then retrieval, and only then augmentation. Augmentation is the cheapest thing to try and almost never the largest effect — which is exactly why it gets tried first and reported optimistically."}, "notes": "The augment-inside-the-fold error is extremely common and produces spectacular, entirely fake, validation scores. Show it happening once in the lab.", "sec": "2.11", "secTitle": "Text augmentation for small-data regimes"}, {"kind": "divider", "sec": "2.12", "secTitle": "Clinical and specialised text", "no": "2.12", "title": "Clinical and specialised text", "lead": "Where every general-purpose assumption in this chapter breaks, and where this cohort's projects actually live.", "chips": ["Note structure", "Copy-forward text", "Abbreviation expansion", "Negation and assertion", "Terminology normalisation", "Radiology reports", "Bilingual Thai clinical text", "Privacy-preserving release"]}, {"kind": "figure", "title": "Note structure and negation scope", "kick": "2.12.1–2.12.4", "tag": "both", "lead": "A clinical note is sections, templates and copy-forward bulk wrapped around a handful of decisive words — several of which are negated.", "fig": "f_clinical", "figcap": "Chapman et al.<sup class=\"fn\">1</sup> (2001) for NegEx; Harkema et al.<sup class=\"fn\">2</sup> (2009) for ConText, which adds experiencer, temporality and uncertainty. Both are rule-based, both are English, and both still outperform naive neural extraction on scope because the rules encode where a scope ends.", "notes": "The copy-forward point is the one clinicians confirm immediately: a note may be 80% unchanged text from the previous visit. If you do not strip it, you are training on the same paragraph a hundred times — which is &sect;2.6 again, inside a single patient record.", "cites": ["Chapman et al. <i>A simple algorithm for identifying negated findings and diseases in discharge summaries (NegEx).</i> JBI, 2001.", "Harkema et al. <i>ConText: An algorithm for determining negation, experiencer, and temporal status.</i> JBI, 2009."], "sec": "2.12", "secTitle": "Clinical and specialised text"}, {"kind": "bullets", "title": "Reports as weak supervision, Thai records, and safe release", "kick": "2.12.5–2.12.7", "tag": "frontier", "b": ["<b>Radiology reports are free labels for imaging models.</b> CheXpert (Irvin et al.<sup class=\"fn\">2</sup>, 2019) built its labels by rule-based extraction from report text — with an explicit uncertainty class, because “cannot exclude” is not a negative. This is the text-to-vision bridge into Chapter 3.", "<b>Impression and Findings are different sections with different reliability.</b> Extracting from the whole report mixes a hedged observation with a committed conclusion.", "<b>Abbreviations are locally ambiguous and locally resolvable.</b> The same three letters mean different things in two departments of the same hospital; a local dictionary built with clinicians beats any general expansion model.", "<b>Thai clinical text is bilingual at the clause level:</b> Thai narrative, English drug names, transliterated terms and English abbreviations in one sentence. Language ID fails, segmentation must survive script switching, and NegEx trigger lists have to be written and validated in Thai.", "<b>There is no large annotated Thai clinical corpus.</b> That is a gap, and building one — with a published protocol, an agreement study and a de-identification pipeline — is a defensible master's project with a real user.", "<b>Synthetic clinical notes are not a privacy solution by themselves.</b> Residual re-identification risk in free text is real; evaluate with the &sect;0.6 protocol — fidelity, utility, privacy and diversity — not fluency."], "callout": {"h": "The minimum for a Thai clinical text project", "p": "IRB approval defining permitted use; a de-identification pass with measured recall <em>and</em> over-redaction; a documented segmentation and normalisation chain; a locked, versioned preprocessing config shipped with the model (&sect;0.8.5); and a written statement of what the corpus does not contain."}, "notes": "End the section by connecting to the NCDs Listener slide: the same four preparation variables — corpus composition, annotation, class balance, segmentation — explain most of what happens in a Thai clinical NLP project, and none of them are modelling choices.", "cites": ["Chapman et al. <i>A simple algorithm for identifying negated findings and diseases in discharge summaries (NegEx).</i> JBI, 2001.", "Irvin et al. <i>CheXpert: A Large Chest Radiograph Dataset with Uncertainty Labels and Expert Comparison.</i> AAAI, 2019."], "sec": "2.12", "secTitle": "Clinical and specialised text"}, {"kind": "refs", "title": "Sections 2.11 and 2.12 — references", "kick": "Reading", "sm": true, "refs": ["Wei &amp; Zou. <b>EDA: Easy Data Augmentation Techniques for Boosting Performance on Text Classification Tasks.</b> <i>EMNLP</i>, 2019.", "Sennrich, Haddow &amp; Birch. <b>Improving Neural Machine Translation Models with Monolingual Data.</b> <i>ACL</i>, 2016 — back-translation.", "Kobayashi. <b>Contextual Augmentation.</b> <i>NAACL</i>, 2018; Morris et al., <b>TextAttack</b>, <i>EMNLP</i> 2020.", "Chapman, Bridewell, Hanbury, Cooper &amp; Buchanan. <b>A simple algorithm for identifying negated findings and diseases in discharge summaries (NegEx).</b> <i>JBI</i>, 2001.", "Harkema, Dowling, Thornblade &amp; Chapman. <b>ConText: An algorithm for determining negation, experiencer, and temporal status.</b> <i>JBI</i>, 2009.", "Irvin et al. <b>CheXpert: A Large Chest Radiograph Dataset with Uncertainty Labels and Expert Comparison.</b> <i>AAAI</i>, 2019.", "Johnson et al. <b>MIMIC-III, a freely accessible critical care database.</b> <i>Scientific Data</i>, 2016; MIMIC-IV, 2023.", "Uzuner et al., 2007 and Stubbs et al., 2015 — the i2b2 and n2c2 de-identification shared tasks; UMLS, SNOMED CT, ICD and LOINC for terminology normalisation."], "sec": "2.12", "secTitle": "Clinical and specialised text"}, {"kind": "cols", "sec": "2.13", "secTitle": "Closing", "title": "Labs and seminars driven by this chapter", "kick": "Chapter 4 cross-reference", "sm": true, "cls": "lab", "cols": [{"sub": "Lab 4", "h": "A miniature web-corpus pipeline", "b": ["Language ID, heuristic filters, MinHash dedup and a quality classifier on a Common Crawl sample", "Ablate each stage on one small downstream benchmark", "Read 200 rejected documents and report what the filters took by mistake", "<b>Deliverable:</b> the surviving-tokens table, with language mix before and after"], "acc": true}, {"sub": "Lab 5", "h": "Tokenizer study", "b": ["Train SentencePiece vocabularies of several sizes on Thai and on English", "Measure fertility, sequence cost and context-window occupancy", "Convert that into an inference price per document", "<b>Deliverable:</b> the fertility table, and one sentence on who pays"]}, {"sub": "Labs 6 and 7", "h": "Chunking, and instruction selection", "b": ["Lab 6: fixed, recursive, semantic, late and contextual chunking against a recall harness", "Lab 7: select 10% of an instruction pool by IFD, by an LLM judge, and at random", "Both are split-by-document, both report preprocessing cost", "<b>Deliverable:</b> the random baseline, plotted with error bars"]}, {"sub": "Seminar", "h": "Whose text survived?", "b": ["Each student takes one published corpus paper", "Reconstructs the filter cascade from the paper text alone", "Names one register, dialect or language the cascade would remove", "<b>Rule:</b> quote the filter, then quote a document it would reject"]}], "notes": "Labs 4 and 5 are the two that change how this cohort works. Run Lab 5 early — the fertility number for their own language is what makes the chapter personal."}, {"kind": "bullets", "title": "What to take from Chapter 2", "kick": "Key takeaways", "lead": "Eight sentences. If a student leaves with only these, the chapter worked.", "b": ["<b>Learn both stacks and say which one you are feeding.</b> Classical preprocessing is not obsolete; it is conditional, and with a subword transformer most of it is harmful.", "<b>For unsegmented scripts, segmentation is a model at the front of your pipeline.</b> Normalise before it, measure it, version it, and report it as you would report any other model.", "<b>Tokenizer fertility is an accuracy, context and cost problem simultaneously,</b> and it is measured in one afternoon. Measure it for your language before you design anything else.", "<b>Deduplication is the largest single lever</b> — and it is also a privacy control and an evaluation-hygiene control. Normalise, then dedup, then decontaminate, then split.", "<b>Every filter encodes the values of its reference set.</b> Count what you removed, by language and by register, and find one document the filter should not have taken.", "<b>Ablate filter order, not just filter presence.</b> Filters are not commutative and the ordering is a reportable result.", "<b>In instruction selection, plot the random baseline and check the length distribution.</b> Most published gains survive neither test unexamined.", "<b>Mark and cite honestly.</b> The strongest curation numbers in this chapter are the dataset authors' own ablations, and one of the most-quoted RAG results is self-reported. Say so when you use them."], "callout": {"h": "The sentence to leave on the board", "p": "In this era the corpus <em>is</em> the contribution — so it deserves the split discipline, the ablations, the baselines and the documentation you would demand of any model."}, "notes": "End here if you are out of time. The next slide is navigation only.", "sec": "2.13", "secTitle": "Closing"}, {"kind": "cols", "title": "Where this chapter is used", "kick": "Onward", "sm": true, "lead": "Chapter 2 is a technique catalogue. It only produces real numbers when it is run under the Chapter 0 discipline.", "cols": [{"sub": "Chapter 0", "h": "Cross-cutting foundations", "p": "The discipline this chapter borrows throughout: splitting, leakage, label quality, reduction, synthesis, privacy and documentation.", "b": ["&sect;0.3.6 for split-by-document, &sect;0.3.9 for decontamination", "&sect;0.5.8 for the random baseline, &sect;0.7.7 for filters as bias entry points", "Weeks 1, 2 and 12"], "acc": true}, {"sub": "Chapter 1", "h": "Classical and tabular data", "p": "Free-text columns, dirty categories and clinical notes joined onto structured EHR tables.", "b": ["&sect;1.5.10 uses the embeddings this chapter builds", "&sect;1.9 is the imbalance material behind &sect;2.11.7", "Weeks 3–5"]}, {"sub": "Chapter 3", "h": "Image and video data", "p": "Image–text curation is this chapter's filtering machinery pointed at caption text: CLIP-score filtering, recaptioning, metadata balancing.", "b": ["&sect;3.8 reuses semantic dedup and quality classifiers directly", "&sect;2.12.5 supplies the report-derived labels for &sect;3.10", "Weeks 9–11"]}, {"sub": "Chapter 4", "h": "Teaching scaffold", "p": "Labs 4 to 7 are this chapter's assessment, plus the corpus-audit seminar and the capstone brief.", "b": ["Every lab here produces an artefact, not a notebook", "Runs throughout"]}], "notes": "Use the Course index button in the toolbar to move between decks.", "cites": ["Radford et al. <i>Learning Transferable Visual Models From Natural Language Supervision (CLIP).</i> ICML, 2021."], "sec": "2.13", "secTitle": "Closing"}]}</script>
<script>
(function(){
"use strict";
function boom(e){
  try{var b=document.getElementById("err");b.style.display="block";
    b.textContent="Something broke: "+((e&&e.message)||e)+"\n"+((e&&e.stack)||"");}catch(_){}
  if(window.console)console.error(e);
}
window.addEventListener("error",function(ev){boom(ev.error||ev.message);});

try{

var D      = JSON.parse(document.getElementById("deckdata").textContent);
var SLIDES = D.slides, FIGS = D.figs, META = D.meta, SECS = D.secs || [];
var KEY    = "dpslides-"+META.key+"-v1";
var EDITS  = {}, NOTES = {};
var cur = 0, editing = false, ovOn = false, notesOn = false;
var t0 = null, tAcc = 0;

/* ---------------- storage ---------------- */
var Store = {
  get:function(){
    try{ if(window.storage&&window.storage.get)
      return window.storage.get(KEY).then(function(r){return r&&r.value?r.value:null;}).catch(function(){return null;}); }catch(e){}
    try{ return Promise.resolve(window.localStorage.getItem(KEY)); }catch(e){ return Promise.resolve(null); }
  },
  set:function(v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(KEY,v).catch(function(){}); return; } }catch(e){}
    try{ window.localStorage.setItem(KEY,v); }catch(e){}
  }
};
var svT=null;
function save(){ clearTimeout(svT); svT=setTimeout(function(){
  try{ Store.set(JSON.stringify({v:1,edits:EDITS,notes:NOTES})); }catch(e){} },350); }

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function txt(h){var d=document.createElement("div");d.innerHTML=h==null?"":h;return (d.textContent||"").trim();}
function val(i,path,dflt){ var k=i+"."+path; return (k in EDITS)?EDITS[k]:dflt; }
function ed(i,path,html,cls,tag){
  tag=tag||"div";
  return "<"+tag+' class="ed '+(cls||"")+'" data-k="'+i+"."+path+'">'+(val(i,path,html)||"")+"</"+tag+">";
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1800);}

/* ---------------- slide rendering ---------------- */
function bullets(i,arr,key,cls){
  if(!arr||!arr.length)return "";
  var h='<ul class="bul '+(cls||"")+'">';
  for(var j=0;j<arr.length;j++){
    h+='<li class="ed" data-k="'+i+"."+key+"."+j+'">'+(val(i,key+"."+j,arr[j])||"")+"</li>";
  }
  return h+"</ul>";
}
function fig(s){
  if(!s.fig)return "";
  var svg=FIGS[s.fig]||'<svg viewBox="0 0 900 380"><rect width="900" height="380" fill="#F1F5F9"/><text x="450" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#8A97A6">figure: '+esc(s.fig)+"</text></svg>";
  return svg;
}
function figblock(i,s){
  if(!s.fig)return "";
  return '<div class="figwrap col"><div class="figbox">'+fig(s)+"</div>"+
    (s.figcap?'<div class="figcap ed" data-k="'+i+'.figcap">'+val(i,"figcap",s.figcap)+"</div>":"")+"</div>";
}
function head(i,s,small){
  var h="";
  if(s.kick)h+='<p class="kick"><span class="dot"></span><span class="ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick)+"</span></p>";
  if(s.title)h+=ed(i,"title",s.title,small?"sm":"","h2");
  if(s.lead)h+=ed(i,"lead",s.lead,"lead","p");
  return h;
}
function citesHTML(i,s){
  if(!s.cites||!s.cites.length)return "";
  var h='<div class="cites">';
  for(var j=0;j<s.cites.length;j++)
    h+='<span class="c"><b>'+(j+1)+'</b><span class="ed" data-k="'+i+".cites."+j+'">'+
       val(i,"cites."+j,s.cites[j])+"</span></span>";
  return h+"</div>";
}
function foot(i,s){
  var sec=s.sec?("&sect; "+s.sec+(s.secTitle?" &nbsp;"+s.secTitle:"")):META.title;
  return '<div class="foot"><span>'+esc(META.short)+"</span><span>"+sec+'</span><span class="sp"></span>'+
    (s.tag?'<span class="tag '+s.tag+'">'+s.tag+"</span>":"")+
    "<span>"+(i+1)+" / "+SLIDES.length+"</span></div>";
}
function colsHTML(i,s){
  var n=s.cols.length,h='<div class="cols n'+n+'">';
  for(var j=0;j<n;j++){
    var c=s.cols[j];
    h+='<div class="cbox'+(c.acc?" acc":"")+'">';
    if(c.sub)h+='<div class="sub ed" data-k="'+i+".cols."+j+'.sub">'+val(i,"cols."+j+".sub",c.sub)+"</div>";
    if(c.h)h+='<h4 class="ed" data-k="'+i+".cols."+j+'.h">'+val(i,"cols."+j+".h",c.h)+"</h4>";
    if(c.p)h+='<p class="ed" data-k="'+i+".cols."+j+'.p">'+val(i,"cols."+j+".p",c.p)+"</p>";
    if(c.b&&c.b.length){
      h+='<ul class="bul">';
      for(var m=0;m<c.b.length;m++)
        h+='<li class="ed" data-k="'+i+".cols."+j+".b."+m+'">'+val(i,"cols."+j+".b."+m,c.b[m])+"</li>";
      h+="</ul>";
    }
    h+="</div>";
  }
  return h+"</div>";
}
function tableHTML(i,s){
  var h='<table class="t"><thead><tr>';
  s.table.head.forEach(function(x){h+="<th>"+x+"</th>";});
  h+="</tr></thead><tbody>";
  s.table.rows.forEach(function(r,ri){
    h+="<tr>";
    r.forEach(function(c,ci){h+='<td class="ed" data-k="'+i+".table."+ri+"."+ci+'">'+val(i,"table."+ri+"."+ci,c)+"</td>";});
    h+="</tr>";
  });
  return h+"</tbody></table>";
}
function statHTML(i,s){
  var h='<div class="stat">';
  s.stats.forEach(function(x,j){
    h+='<div><div class="v ed" data-k="'+i+".stats."+j+'.v">'+val(i,"stats."+j+".v",x.v)+"</div>"+
       '<div class="l ed" data-k="'+i+".stats."+j+'.l">'+val(i,"stats."+j+".l",x.l)+"</div></div>";
  });
  return h+"</div>";
}
function refsHTML(i,s){
  var h='<ol class="refs'+(s.refs.length>7?" two":"")+'">';
  for(var j=0;j<s.refs.length;j++)
    h+='<li class="ed" data-k="'+i+".refs."+j+'">'+val(i,"refs."+j,s.refs[j])+"</li>";
  return h+"</ol>";
}
function calloutHTML(i,s){
  return '<div class="callout"><div class="h">'+esc(s.callout.h||"Teaching point")+"</div>"+
    '<p class="ed" data-k="'+i+'.callout.p">'+val(i,"callout.p",s.callout.p)+"</p></div>";
}

function slideHTML(i){
  var s=SLIDES[i],k=s.kind||"bullets",h="";
  var cls="slide "+k+(s.cls?" "+s.cls:"");

  if(k==="title"){
    h='<div class="pad">'+
      '<p class="no ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick||"")+"</p>"+
      ed(i,"title",s.title,"","h1")+
      (s.lead?ed(i,"lead",s.lead,"dek","p"):"")+
      (s.meta?'<div class="meta ed" data-k="'+i+'.meta">'+val(i,"meta",s.meta)+"</div>":"")+
      "</div>";
  }else if(k==="divider"){
    h='<div class="pad">'+
      '<div class="n">'+esc(s.no||"")+"</div>"+
      ed(i,"title",s.title,"","h2")+
      (s.lead?ed(i,"lead",s.lead,"lead","p"):"")+
      (s.chips&&s.chips.length?'<div class="chips">'+s.chips.map(function(c){return "<span>"+esc(c)+"</span>";}).join("")+"</div>":"")+
      "</div>";
  }else{
    var inner="";
    if(k==="figure"){
      inner='<div class="body v">'+figblock(i,s).replace('class="figwrap col"','class="figwrap"')+
            (s.callout?calloutHTML(i,s):"")+"</div>";
    }else if(k==="split"||k==="splitr"){
      var left='<div class="col '+(s.wide==="text"?"wide":"")+'">'+bullets(i,s.b,"b")+
        (s.callout?calloutHTML(i,s):"")+(s.stats?statHTML(i,s):"")+"</div>";
      var right=figblock(i,s);
      if(s.wide==="text")right=right.replace('class="figwrap col"','class="figwrap col narrow"');
      inner='<div class="body">'+(k==="splitr"?right+left:left+right)+"</div>";
    }else if(k==="cols"){
      inner=colsHTML(i,s)+(s.callout?calloutHTML(i,s):"");
    }else if(k==="refs"){
      inner='<div class="body v">'+refsHTML(i,s)+"</div>";
    }else if(k==="table"){
      inner='<div class="body v">'+tableHTML(i,s)+(s.callout?calloutHTML(i,s):"")+"</div>";
    }else{
      inner='<div class="body v">'+bullets(i,s.b,"b",s.b&&s.b.length>6?"tight":"")+
        (s.stats?statHTML(i,s):"")+(s.callout?calloutHTML(i,s):"")+"</div>";
    }
    h='<div class="pad" style="flex:1;display:flex;flex-direction:column;min-height:0">'+
      head(i,s,s.sm)+'<div class="rule"></div>'+inner+citesHTML(i,s)+"</div>"+foot(i,s);
  }
  return '<section class="'+cls+'" data-i="'+i+'">'+h+
    '<div class="pnotes">'+esc(NOTES[i]||s.notes||"")+"</div></section>";
}

/* ---------------- shrink-to-fit ---------------- */
function autofit(sl){
  try{
    if(!sl)return;
    var box=sl.querySelector(".body")||sl.querySelector(".cols");
    if(!box)return;
    var foot=sl.querySelector(".foot"),cit=sl.querySelector(".cites");
    sl.style.setProperty("--k","1");
    for(var i=0;i<9;i++){
      var lim=cit?cit.getBoundingClientRect().top
              :(foot?foot.getBoundingClientRect().top:sl.getBoundingClientRect().bottom);
      var over=(box.scrollHeight>box.clientHeight+1)||(box.getBoundingClientRect().bottom>lim+1);
      var kid=false;
      var cbs=sl.querySelectorAll(".cbox");
      for(var j=0;j<cbs.length;j++)if(cbs[j].scrollHeight>cbs[j].clientHeight+1){kid=true;break;}
      if(!over&&!kid)break;
      sl.style.setProperty("--k",(1-0.035*(i+1)).toFixed(3));
    }
  }catch(e){}
}

/* ---------------- layout / scale ---------------- */
function fit(){
  var st=document.querySelector(".stage"),ho=document.getElementById("holder");
  if(!st)return;
  var pad=26;
  var sc=Math.min((st.clientWidth-pad*2)/1280,(st.clientHeight-pad*2)/720);
  if(!isFinite(sc)||sc<=0)sc=.5;
  ho.style.transform="scale("+sc+")";
}
window.addEventListener("resize",fit);

/* ---------------- render current ---------------- */
function render(){
  var ho=document.getElementById("holder");
  ho.innerHTML=slideHTML(cur);
  applyEdit();
  autofit(ho.querySelector(".slide"));
  fit();
  var s=SLIDES[cur];
  document.getElementById("secNow").innerHTML=s.sec?("&sect; "+s.sec+" &nbsp;"+(s.secTitle||"")):"";
  document.getElementById("cnt").innerHTML="<b>"+(cur+1)+"</b> / "+SLIDES.length;
  var f=document.querySelector(".fill");
  if(f)f.style.width=((cur+1)/SLIDES.length*100)+"%";
  var nb=document.getElementById("noteBox");
  if(nb)nb.value=NOTES[cur]!=null?NOTES[cur]:(SLIDES[cur].notes||"");
  var nx=document.getElementById("nxt");
  if(nx)nx.textContent=cur+1<SLIDES.length?txt(val(cur+1,"title",SLIDES[cur+1].title||"—")):"End of deck";
  if(ovOn)markOv();
  if(location.hash!=="#"+(cur+1))history.replaceState(null,"","#"+(cur+1));
}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur){render();return;}
  cur=i;render();
}
function applyEdit(){
  var els=document.querySelectorAll("#holder .ed");
  for(var i=0;i<els.length;i++){
    if(editing)els[i].setAttribute("contenteditable","true");
    else els[i].removeAttribute("contenteditable");
  }
}

/* ---------------- overview ---------------- */
function buildOv(){
  var g=document.getElementById("ovgrid"),h="",lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    var sk=(s.sec||"")+"|"+(s.secTitle||"");
    if(sk!==lastSec){
      lastSec=sk;
      h+='<div class="ovsec">'+(s.sec?esc(s.sec)+" &nbsp; "+esc(s.secTitle||""):esc(META.short))+"</div>";
    }
    h+='<div class="ovc" data-go="'+i+'"><div class="shell" data-shell><div class="mini" data-mini>'+
      slideHTML(i)+'</div></div><div class="no">'+(i+1)+'</div><div class="lb">'+
      esc(txt(val(i,"title",s.title||""))||(s.kind==="divider"?"Section":"Slide"))+"</div></div>";
  }
  g.innerHTML=h;
  var ms=g.querySelectorAll(".mini .slide");
  for(var q=0;q<ms.length;q++)autofit(ms[q]);
  // scale minis
  var cards=g.querySelectorAll(".ovc");
  for(var j=0;j<cards.length;j++){
    var shell=cards[j].querySelector("[data-shell]"),mini=cards[j].querySelector("[data-mini]");
    var w=cards[j].clientWidth||232,sc=w/1280;
    mini.style.transform="scale("+sc+")";
    shell.style.height=(720*sc)+"px";
  }
  markOv();
}
function markOv(){
  var cards=document.querySelectorAll(".ovc");
  for(var i=0;i<cards.length;i++)cards[i].classList.toggle("cur",+cards[i].getAttribute("data-go")===cur);
  var c=document.querySelector(".ovc.cur");
  if(c)c.scrollIntoView({block:"nearest"});
}

/* ---------------- export ---------------- */
function toMarkdown(){
  var L=[];
  L.push("# "+META.title);
  L.push("");
  L.push("_"+META.short+" · "+SLIDES.length+" slides · exported from the editable HTML deck._");
  L.push("");
  var lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    if(s.sec&&s.sec!==lastSec){lastSec=s.sec;L.push("");L.push("## "+s.sec+" "+(s.secTitle||""));L.push("");}
    var t=txt(val(i,"title",s.title||""));
    L.push("### ["+(i+1)+"] "+(t||"(untitled)"));
    var ld=txt(val(i,"lead",s.lead||""));
    if(ld)L.push("");
    if(ld)L.push("_"+ld+"_");
    if(s.b&&s.b.length){L.push("");for(var j=0;j<s.b.length;j++)L.push("- "+txt(val(i,"b."+j,s.b[j])));}
    if(s.cols)s.cols.forEach(function(c,j){
      L.push("");L.push("**"+txt(val(i,"cols."+j+".h",c.h||""))+"**");
      var p=txt(val(i,"cols."+j+".p",c.p||""));if(p)L.push(p);
      (c.b||[]).forEach(function(x,m){L.push("- "+txt(val(i,"cols."+j+".b."+m,x)));});
    });
    if(s.table){L.push("");L.push("| "+s.table.head.join(" | ")+" |");
      L.push("|"+s.table.head.map(function(){return "---";}).join("|")+"|");
      s.table.rows.forEach(function(r,ri){L.push("| "+r.map(function(c,ci){
        return txt(val(i,"table."+ri+"."+ci,c));}).join(" | ")+" |");});}
    if(s.stats){L.push("");s.stats.forEach(function(x,j){
      L.push("- **"+txt(val(i,"stats."+j+".v",x.v))+"** — "+txt(val(i,"stats."+j+".l",x.l)));});}
    if(s.callout){L.push("");L.push("> **"+(s.callout.h||"Teaching point")+".** "+txt(val(i,"callout.p",s.callout.p)));}
    if(s.figcap){L.push("");L.push("_Figure: "+txt(val(i,"figcap",s.figcap))+"_");}
    if(s.refs){L.push("");s.refs.forEach(function(r,j){L.push((j+1)+". "+txt(val(i,"refs."+j,r)));});}
    if(s.cites&&s.cites.length){L.push("");
      L.push("_Sources: "+s.cites.map(function(c,j){
        return "["+(j+1)+"] "+txt(val(i,"cites."+j,c));}).join(" · ")+"_");}
    var nt=(NOTES[i]!=null?NOTES[i]:(s.notes||"")).trim();
    if(nt){L.push("");L.push("> **Speaker notes.** "+nt.replace(/\n/g," "));}
    L.push("");
  }
  return L.join("\n");
}

    body.innerHTML='<textarea id="mText" spellcheck="false"></textarea>';

  }
  document.querySelector('[data-act="mcopy"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mdl"]').style.display=mode==="help"?"none":"";

  m.classList.add("on");
}

/* ---------------- search ---------------- */
function slideText(i){
  var s=SLIDES[i],parts=[txt(val(i,"title",s.title||"")),txt(val(i,"lead",s.lead||""))];
  (s.b||[]).forEach(function(x,j){parts.push(txt(val(i,"b."+j,x)));});
  (s.refs||[]).forEach(function(x,j){parts.push(txt(val(i,"refs."+j,x)));});
  (s.cols||[]).forEach(function(c,j){parts.push(txt(val(i,"cols."+j+".h",c.h||"")));
    parts.push(txt(val(i,"cols."+j+".p",c.p||"")));
    (c.b||[]).forEach(function(x,m){parts.push(txt(val(i,"cols."+j+".b."+m,x)));});});
  if(s.table)s.table.rows.forEach(function(r,ri){r.forEach(function(c,ci){
    parts.push(txt(val(i,"table."+ri+"."+ci,c)));});});
  if(s.figcap)parts.push(txt(val(i,"figcap",s.figcap)));
  (s.cites||[]).forEach(function(c,j){parts.push(txt(val(i,"cites."+j,c)));});
  if(s.callout)parts.push(txt(val(i,"callout.p",s.callout.p)));
  parts.push(NOTES[i]||s.notes||"");
  parts.push(s.sec||"",s.secTitle||"");
  return parts.join("  ");
}
function doSearch(q){
  var box=document.getElementById("sres");
  q=(q||"").trim();
  if(q.length<2){box.innerHTML="";return;}
  var lq=q.toLowerCase(),h="",n=0;
  for(var i=0;i<SLIDES.length&&n<40;i++){
    var t=slideText(i),p=t.toLowerCase().indexOf(lq);
    if(p<0)continue;
    n++;
    var a=Math.max(0,p-46),snip=esc(t.slice(a,p))+"<mark>"+esc(t.slice(p,p+q.length))+"</mark>"+esc(t.slice(p+q.length,p+q.length+80));
    h+='<button data-go="'+i+'"><span class="n">slide '+(i+1)+(SLIDES[i].sec?" &nbsp;&sect; "+esc(SLIDES[i].sec):"")+
       '</span><div class="t">'+esc(txt(val(i,"title",SLIDES[i].title||"")))+'</div><div class="n" style="margin-top:3px">'+
       (a>0?"…":"")+snip+"…</div></button>";
  }
  box.innerHTML=h||'<button style="cursor:default"><span class="n">no match</span></button>';
}

/* ---------------- timer ---------------- */
function tick(){
  var el=document.querySelector(".timer");if(!el)return;
  var ms=tAcc+(t0?(Date.now()-t0):0),s=Math.floor(ms/1000);
  el.textContent=(t0?"":"⏸ ")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
setInterval(tick,500);

/* ---------------- events ---------------- */
document.addEventListener("click",function(ev){
try{
  var t=ev.target;
  var g=t.closest?t.closest("[data-go]"):null;
  if(g){ go(+g.getAttribute("data-go"));
    if(ovOn)setOv(false);
    document.body.classList.remove("srch-on");
    return; }
  var b=t.closest?t.closest("[data-act]"):null;
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="next"){go(cur+1);return;}
  if(a==="prev"){go(cur-1);return;}
  if(a==="ov"){setOv(!ovOn);return;}
  if(a==="notes"){notesOn=!notesOn;document.body.classList.toggle("notes-on",notesOn);
    b.setAttribute("aria-pressed",String(notesOn));fit();return;}
  if(a==="edit"){editing=!editing;document.body.classList.toggle("edit",editing);
    b.setAttribute("aria-pressed",String(editing));applyEdit();
    toast(editing?"Edit mode on — click any text to rewrite it":"Edit mode off");return;}
  if(a==="search"){document.body.classList.toggle("srch-on");
    if(document.body.classList.contains("srch-on"))document.getElementById("q").focus();return;}
  if(a==="print"){printAll();return;}
  if(a==="help"){openModal("Keyboard and features","","","help");return;}
  if(a==="hub"){window.location.href=META.hub;return;}
  if(a==="export"){
    openModal("Export — Markdown",toMarkdown(),META.key+"-slides.md");
    document.getElementById("mSeg").innerHTML=
      '<button class="mbtn" data-act="expmd">Markdown</button>'+
      '<button class="mbtn" data-act="expjson">JSON backup</button>'+
      '<button class="mbtn" data-act="expimp">Import…</button>';
    return;}
  if(a==="expmd"){document.getElementById("mTitle").textContent="Export — Markdown";
    var t1=document.getElementById("mText");if(t1){t1.value=toMarkdown();t1.setAttribute("data-name",META.key+"-slides.md");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expjson"){document.getElementById("mTitle").textContent="Export — JSON backup";
    var t2=document.getElementById("mText");if(t2){t2.value=JSON.stringify({v:1,edits:EDITS,notes:NOTES},null,2);
      t2.setAttribute("data-name",META.key+"-backup.json");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expimp"){document.getElementById("mTitle").textContent="Import — paste a JSON backup, then Load";
    var t3=document.getElementById("mText");if(t3)t3.value="";
    document.querySelector('[data-act="mload"]').style.display="";return;}
  if(a==="mload"){
    try{ var o=JSON.parse(document.getElementById("mText").value);
      EDITS=o.edits||{};NOTES=o.notes||{};save();render();
      document.getElementById("modal").classList.remove("on");toast("Backup loaded");
    }catch(e){toast("That is not valid JSON");}
    return;}
  if(a==="mclose"){document.getElementById("modal").classList.remove("on");return;}
  if(a==="mcopy"){var ta=document.getElementById("mText");if(!ta)return;
    ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast("Copied");},function(){toast("Select and copy manually");});
    else toast(ok?"Copied to clipboard":"Select and copy manually");return;}
  if(a==="mdl"){var ta2=document.getElementById("mText");if(!ta2)return;
    var nm=ta2.getAttribute("data-name")||"export.txt";
    var bl=new Blob([ta2.value],{type:"text/plain;charset=utf-8"});
    var A=document.createElement("a");A.href=URL.createObjectURL(bl);A.download=nm;
    document.body.appendChild(A);A.click();A.remove();toast("Downloaded "+nm);return;}
}catch(e){boom(e);}
},false);

function setOv(on){
  ovOn=on;document.body.classList.toggle("ov-on",on);
  var b=document.querySelector('[data-act="ov"]');if(b)b.setAttribute("aria-pressed",String(on));
  if(on)buildOv();
}
function printAll(){
  var ho=document.getElementById("holder"),h="";
  for(var i=0;i<SLIDES.length;i++)h+=slideHTML(i);
  ho.innerHTML=h;ho.style.transform="none";
  var ps=ho.querySelectorAll(".slide");
  for(var q=0;q<ps.length;q++)autofit(ps[q]);
  document.body.classList.add("handout");
  window.print();
  setTimeout(function(){document.body.classList.remove("handout");render();},400);
}

/* progress bar click */
document.addEventListener("mousedown",function(ev){
  var tr=ev.target.closest?ev.target.closest(".track"):null;
  if(!tr)return;
  var r=tr.getBoundingClientRect();
  go(Math.round((ev.clientX-r.left)/r.width*(SLIDES.length-1)));
});

/* edits */
document.addEventListener("focusout",function(ev){
  try{
    var t=ev.target;
    if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
      var k=t.getAttribute("data-k");
      if(k){EDITS[k]=t.innerHTML.trim();save();}
    }
  }catch(e){boom(e);}
},true);
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="noteBox"){NOTES[cur]=t.value;save();return;}
  if(t.id==="q"){doSearch(t.value);return;}
});
document.addEventListener("paste",function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
    ev.preventDefault();
    var s=(ev.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,s);
  }
});

/* keys */
var numBuf="";
document.addEventListener("keydown",function(ev){
try{
  var tag=(ev.target.tagName||"").toLowerCase();
  var typing=ev.target.isContentEditable||tag==="input"||tag==="textarea";
  if(ev.key==="Escape"){
    document.getElementById("modal").classList.remove("on");
    document.body.classList.remove("srch-on");
    if(ovOn)setOv(false);
    if(ev.target.isContentEditable)ev.target.blur();
    return;
  }
  if(typing){
    if(ev.target.id==="q"&&ev.key==="Enter"){
      var f=document.querySelector("#sres [data-go]");
      if(f){go(+f.getAttribute("data-go"));document.body.classList.remove("srch-on");}
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==="ArrowRight"||ev.key==="PageDown"||ev.key===" "){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="ArrowDown"){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="Home"){ev.preventDefault();go(0);return;}
  if(ev.key==="End"){ev.preventDefault();go(SLIDES.length-1);return;}
  if(ev.key>="0"&&ev.key<="9"){numBuf+=ev.key;return;}
  if(ev.key==="Enter"&&numBuf){go(parseInt(numBuf,10)-1);numBuf="";return;}
  var k=ev.key.toLowerCase();
  numBuf="";
  if(k==="o"){setOv(!ovOn);return;}
  if(k==="n"){document.querySelector('[data-act="notes"]').click();return;}
  if(k==="e"){document.querySelector('[data-act="edit"]').click();return;}
  if(k==="p"){ev.preventDefault();printAll();return;}
  if(k==="/"||k==="?"){ev.preventDefault();
    if(ev.key==="?"){openModal("Keyboard and features","","","help");return;}
    document.body.classList.add("srch-on");document.getElementById("q").focus();return;}
  if(k==="t"){ if(t0){tAcc+=Date.now()-t0;t0=null;}else{t0=Date.now();} tick(); return;}
  if(k==="f"){ if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); return;}
}catch(e){boom(e);}
},false);

    if(SLIDES[i].kind==="divider")ticks+='<i style="left:'+(i/(SLIDES.length-1)*100)+'%"></i>';
  }
  p.innerHTML='<span class="hint">&larr;/&rarr; move &nbsp;·&nbsp; O overview &nbsp;·&nbsp; E edit &nbsp;·&nbsp; N notes &nbsp;·&nbsp; T timer &nbsp;·&nbsp; ? help</span>'+
    '<div class="track"><div class="ticks">'+ticks+'</div><div class="fill"></div></div>'+
    '<span class="timer">⏸ 00:00</span>';
  document.body.appendChild(p);
})();

/* boot */
Store.get().then(function(raw){
  try{ if(raw){var o=JSON.parse(raw);EDITS=o.edits||{};NOTES=o.notes||{};} }catch(e){}
  var h=parseInt((location.hash||"").replace("#",""),10);
  if(h>0&&h<=SLIDES.length)cur=h-1;
  render();
  if(raw)toast("Your saved edits and notes are back");
}).catch(function(){render();});

}catch(e){boom(e);}
})();
</script>
</body>
</html>
