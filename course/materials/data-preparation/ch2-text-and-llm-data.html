\" fill=\"#16202C\" font-weight=\"600\">A Thai clinical adaptation</text><rect x=\"40\" y=\"230\" width=\"190.0\" height=\"44\" rx=\"3\" fill=\"#8FA0B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"135.0\" y=\"258\" font-size=\"11\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">30%</text><rect x=\"232.0\" y=\"230\" width=\"36.4\" height=\"44\" rx=\"3\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><rect x=\"270.4\" y=\"230\" width=\"49.2\" height=\"44\" rx=\"3\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><rect x=\"321.59999999999997\" y=\"230\" width=\"100.4\" height=\"44\" rx=\"3\" fill=\"#8A6A12\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"371.79999999999995\" y=\"258\" font-size=\"11\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">16%</text><rect x=\"424.0\" y=\"230\" width=\"254.0\" height=\"44\" rx=\"3\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"551.0\" y=\"258\" font-size=\"11\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">40%</text><rect x=\"40\" y=\"307\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#8FA0B4\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"57\" y=\"318\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Web</text><rect x=\"94.94\" y=\"307\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#2D5C8A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"111.94\" y=\"318\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Code</text><rect x=\"155.86\" y=\"307\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#0F7A6A\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"172.86\" y=\"318\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Books</text><rect x=\"222.76000000000002\" y=\"307\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#8A6A12\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"239.76000000000002\" y=\"318\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Academic</text><rect x=\"307.6\" y=\"307\" width=\"11\" height=\"11\" rx=\"2.5\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"324.6\" y=\"318\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Multilingual</text><rect x=\"720\" y=\"62\" width=\"414\" height=\"250\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"742\" y=\"90\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">DoReMi, in three steps</text><text x=\"742\" y=\"110\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Xie et al., NeurIPS 2023</text><circle cx=\"756\" cy=\"140\" r=\"11\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"756\" y=\"144\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">1</text><text x=\"776\" y=\"144\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Train a small reference model on the initial</text><text x=\"776\" y=\"160\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">mixture.</text><circle cx=\"756\" cy=\"190\" r=\"11\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"756\" y=\"194\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">2</text><text x=\"776\" y=\"194\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Train a proxy model with Group-DRO, raising</text><text x=\"776\" y=\"210\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the weight of domains with the largest</text><text x=\"776\" y=\"226\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">excess loss.</text><circle cx=\"756\" cy=\"256\" r=\"11\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"756\" y=\"260\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">3</text><text x=\"776\" y=\"260\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Take the resulting weights and train the</text><text x=\"776\" y=\"276\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">full model once.</text><rect x=\"16\" y=\"336\" width=\"1118\" height=\"108\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"362\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">What to be careful about</text><text x=\"36\" y=\"384\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Data mixing laws (Ye et al. 2024; RegMix 2025) go further and fit loss as a function of the proportions, so the ratio can be optimised</text><text x=\"36\" y=\"401\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">without full training runs. All of it rests on one assumption: that weights found with a small proxy transfer to the run you care about</text><text x=\"36\" y=\"418\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">— testable, and rarely tested. For a Thai or clinical adaptation the live question is how much in-language data you can upsample before</text><text x=\"36\" y=\"435\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">you are simply repeating tokens (Muennighoff et al., NeurIPS 2023).</text></svg>", "f_packing": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Packing decides how many documents share \"165\" height=\"16\" rx=\"3\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"952\" y=\"214\" font-size=\"8.5\" text-anchor=\"start\" fill=\"#fff\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">context line</text><rect x=\"946\" y=\"220\" width=\"165\" height=\"18\" rx=\"3\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"946\" y=\"270\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">50-100 tokens prepended</text><text x=\"946\" y=\"290\" font-size=\"9.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">before embedding + BM25</text><text x=\"938\" y=\"322\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">best reported, most expensive</text><rect x=\"16\" y=\"348\" width=\"1118\" height=\"96\" rx=\"9\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"374\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The two numbers to quote, and the caveat that goes with them</text><text x=\"36\" y=\"396\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Contextual Retrieval (Anthropic, Sep 2024) is self-reported: from a 5.7% baseline failure rate, contextual embeddings alone cut failures</text><text x=\"36\" y=\"413\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">35%, adding BM25 49%, adding reranking 67%. Late Chunking (Günther et al., 2024) needs no extra training. Against that, Qu, Tu &amp; Bao</text><text x=\"36\" y=\"430\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">(Findings of NAACL 2025) find semantic chunking's extra cost is not consistently justified.</text></svg>", "f_clinical": "<svg viewBox=\"0 0 1150 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo,sans-serif\" role=\"img\"><text x=\"575.0\" y=\"24\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">A clinical note is not prose — it is sections, templates and copy-forward text wrapped around a few decisive words</text><rect x=\"24\" y=\"52\" width=\"560\" height=\"286\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"46\" y=\"80\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">The note, by section</text><rect x=\"46\" y=\"92\" width=\"516\" height=\"46\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"60\" y=\"110\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">CHIEF COMPLAINT</text><text x=\"60\" y=\"128\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">RUQ pain, 3 days</text><rect x=\"46\" y=\"146\" width=\"516\" height=\"46\" rx=\"6\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"60\" y=\"164\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">HISTORY</text><text x=\"60\" y=\"182\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">known gallstones; no prior surgery</text><rect x=\"46\" y=\"200\" width=\"516\" height=\"62\" rx=\"6\" fill=\"#F1F4F7\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"60\" y=\"218\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">MEDICATIONS  (COPY-FORWARD)</text><text x=\"60\" y=\"236\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">18 lines, unchanged from the last four visits — auto-generated</text><text x=\"60\" y=\"250\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">bulk that no clinician re-read</text><rect x=\"46\" y=\"270\" width=\"516\" height=\"46\" rx=\"6\" fill=\"#F1ECF8\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"60\" y=\"288\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\" letter-spacing=\"1.4\">ASSESSMENT / PLAN</text><text x=\"60\" y=\"306\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">no evidence of cholangiocarcinoma; US in 3 months</text><text x=\"46\" y=\"331\" font-size=\"11\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">the two accented sections carry almost all of the signal</text><rect x=\"610\" y=\"52\" width=\"524\" height=\"150\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"632\" y=\"80\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Negation and assertion flip the meaning</text><text x=\"632\" y=\"112\" font-size=\"14\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">No evidence of</text><text x=\"760\" y=\"112\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">cholangiocarcinoma</text><text x=\"922\" y=\"112\" font-size=\"14\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">, but</text><text x=\"972\" y=\"112\" font-size=\"14\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">gallstones</text><line x1=\"756\" y1=\"122\" x2=\"918\" y2=\"122\" stroke=\"#A3384F\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"756\" y1=\"118\" x2=\"756\" y2=\"126\" stroke=\"#A3384F\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"918\" y1=\"118\" x2=\"918\" y2=\"126\" stroke=\"#A3384F\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"632\" y=\"142\" font-size=\"11\" text-anchor=\"start\" fill=\"#A3384F\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">scope opens at the trigger and closes at “but”</text><text x=\"632\" y=\"170\" font-size=\"13\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">Family history of liver cancer.</text><text x=\"632\" y=\"188\" font-size=\"11\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">experiencer = family, not the patient — ConText, not NegEx</text><rect x=\"610\" y=\"214\" width=\"524\" height=\"124\" rx=\"10\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"632\" y=\"242\" font-size=\"14\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">Then normalise the surviving concepts</text><rect x=\"632\" y=\"258\" width=\"108\" height=\"34\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"686\" y=\"280\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">mention</text><path d=\"M742 275 L743.0 275.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M750.0 275.0 L741.0 270.6 L741.0 279.4 z\" fill=\"#8494A5\"/><rect x=\"760\" y=\"258\" width=\"108\" height=\"34\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"814\" y=\"280\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">UMLS CUI</text><path d=\"M870 275 L871.0 275.0\" fill=\"none\" stroke=\"#8494A5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M878.0 275.0 L869.0 270.6 L869.0 279.4 z\" fill=\"#8494A5\"/><rect x=\"880\" y=\"258\" width=\"108\" height=\"34\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"934\" y=\"280\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16202C\" y=\"360\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">what the index</text><text x=\"394\" y=\"373\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">bill actually is</text><text x=\"36\" y=\"404\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Fix any two and the third follows. A benchmark that quotes latency without recall,</text><text x=\"36\" y=\"419\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">or recall without the index size, has told you nothing.</text><rect x=\"584\" y=\"276\" width=\"546\" height=\"166\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"604\" y=\"304\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">Measure it on your own questions</text><text x=\"604\" y=\"330\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">recall@k</text><text x=\"700\" y=\"330\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">against a flat index on the same vectors — not</text><text x=\"700\" y=\"343\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">against the vendor's number</text><text x=\"604\" y=\"355\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">nDCG / MRR</text><text x=\"700\" y=\"355\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">when rank order matters, which for a reranked</text><text x=\"700\" y=\"368\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">pipeline it does</text><text x=\"604\" y=\"380\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">p95 latency</text><text x=\"700\" y=\"380\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">at your real concurrency, with the filter you</text><text x=\"700\" y=\"393\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">actually apply</text><text x=\"604\" y=\"405\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">bytes / chunk</text><text x=\"700\" y=\"405\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">index size ÷ chunk count, the number that decides</text><text x=\"700\" y=\"418\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the bill</text></svg>"}, "slides": [{"kind": "title", "kick": "Research Master · Data Science and Machine Learning", "title": "Text, NLP and LLM data", "lead": "Two eras stacked on top of each other — and the chapter where the corpus, not the architecture, became the contribution.", "meta": "<b>Chapter 2 of 4</b> &nbsp;·&nbsp; Data Preparation for Machine Learning and AI<br>Thanapong Intharah &nbsp;·&nbsp; Visual Intelligence Laboratory &nbsp;·&nbsp; Khon Kaen University<br>Maps to weeks 6, 7 and 8 of the twelve-week plan", "notes": "Open with the question that runs through the whole chapter: what is the smallest change to a corpus that would change your headline number? Almost nobody has an answer, and that is the gap this chapter is trying to close. Hold the room's answers; you return to them in 2.4 and 2.5."}, {"kind": "figure", "sec": "2.0", "secTitle": "Why this chapter has two halves", "kick": "Orientation", "title": "Two eras, both still live", "tag": "both", "lead": "The classical stack did not go away. It moved — into retrieval, into low-resource languages, and into every clinical pipeline that must be justified line by line.", "fig": "f_twoeras", "figcap": "<b>The trap to avoid:</b> students who only learn the right-hand column cannot build a Thai clinical NLP system, and students who only learn the left-hand column cannot read a 2024 dataset paper. This chapter teaches both, and — more importantly — when each applies.", "notes": "Ask who in the room has built a TF-IDF or BM25 baseline in the last year. Usually a third of the hands. Then ask who has read a pretraining-corpus paper. Usually a different third. The overlap is the interesting group.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."]}, {"kind": "cols", "title": "What you should be able to do by the end", "kick": "Learning outcomes", "sm": true, "cols": [{"sub": "Build", "h": "A defensible text pipeline", "b": ["Extract main content from raw HTML and say why WET was not enough", "Segment Thai text and report which segmenter and version you used", "Choose between the classical and the subword stack, with a reason", "Chunk a domain corpus and evaluate the chunking, not just the answers"]}, {"sub": "Filter", "h": "At corpus scale, with an ablation", "b": ["Apply heuristic, model-based and deduplication filters in a stated order", "Ablate each stage on a fixed downstream benchmark at fixed compute", "Report tokens surviving each stage, and languages and registers lost", "Decontaminate against every benchmark you intend to quote"]}, {"sub": "Select", "h": "Instruction and preference data honestly", "b": ["Score instruction pairs by quality, difficulty and diversity", "Beat — or fail to beat — the random baseline, and report which", "Recognise response length masquerading as quality", "Design preference pairs that do not become a reward hack"], "acc": true}, {"sub": "Argue", "h": "About whose text survived", "b": ["Measure tokenizer fertility across scripts and price it", "Name what a quality classifier's reference set encodes", "Connect corpus composition to a measured performance gap", "Write the filtering section of a datasheet someone can act on"]}], "notes": "The four verbs map onto the Chapter 4 rubric exactly as in Chapter 0: build, filter, select, argue are this chapter's version of diagnose, measure, decide, document.", "sec": "2.0", "secTitle": "Why this chapter has two halves"}, {"kind": "table", "title": "The twelve sections of this chapter", "kick": "Chapter map", "sm": true, "table": {"head": ["Section", "What it settles", "Week"], "rows": [["2.1 Acquisition and extraction", "Where the text physically comes from, and the extraction choice that caps quality", "6"], ["2.2 Classical preprocessing", "The stack that still works, what it destroys, and Thai segmentation", "6"], ["2.3 Subword tokenisation", "BPE and its relatives, and why Thai costs several times more per character", "6"], ["2.4 Heuristic filtering", "Cheap document-level rules, and why filter order is not commutative", "7"], ["2.5 Model-based filtering", "Quality classifiers, the FineWeb-Edu result, and whose text they demote", "7"], ["2.6 Deduplication", "Exact, near and semantic duplicates — the largest single lever", "7"], ["2.7 Safety, PII and compliance", "Redaction, de-identification, licensing, and decontamination", "7"], ["2.8 Mixing, curriculum and packing", "Domain weights, repetition budgets, and cross-document masking", "7"], ["2.9 Instruction and preference data", "Generation, selection, and the baseline most methods fail to beat", "8"], ["2.10 Retrieval corpora and RAG", "Chunking, context, index hygiene, and how to evaluate any of it", "8"], ["2.11 Text augmentation", "What still helps when you have four hundred labelled examples", "8"], ["2.12 Clinical and specialised text", "Note structure, negation scope, and bilingual Thai records", "8"]]}, "notes": "Sections 2.2, 2.3 and 2.6 carry the most weight for this cohort. If a week goes missing, set 2.11 as reading and fold 2.7 into the Chapter 0 privacy material.", "cites": ["Penedo et al. <i>The FineWeb Datasets.</i> NeurIPS, 2024."], "sec": "2.0", "secTitle": "Why this chapter has two halves"}, {"kind": "divider", "sec": "2.1", "secTitle": "Acquisition and extraction", "no": "2.1", "title": "Acquisition and extraction", "lead": "Before any filter: what bytes did you actually get, and what did the converter throw away without telling you?", "chips": ["Crawl formats", "HTML to text", "Document parsing", "OCR quality control", "ASR transcripts", "Unicode normalisation", "Crawl ethics and licensing"]}, {"kind": "figure", "title": "WARC, WAT, WET — and the extraction decision", "kick": "2.1.1–2.1.2", "tag": "frontier", "lead": "Three files describe the same crawled page. Which one you start from sets a ceiling you can never recover from later.", "fig": "f_crawl", "figcap": "Main-content extraction is not preprocessing hygiene. It is the first modelling decision in the pipeline, and it is measurable on a downstream benchmark like any other.", "notes": "Show one real WET record on screen for thirty seconds. The cookie banner and the nav menu are always there, and everyone in the room sees the problem instantly.", "cites": ["Penedo et al. <i>The RefinedWeb Dataset for Falcon LLM.</i> NeurIPS, 2023."], "sec": "2.1", "secTitle": "Acquisition and extraction"}, {"kind": "cols", "title": "Everything that is not a web page", "kick": "2.1.3–2.1.5", "tag": "both", "sm": true, "lead": "Most institutional text is not HTML. It is PDFs, scans, dictated notes and spreadsheets pretending to be documents.", "cols": [{"sub": "PDF", "h": "Text layer or pixels?", "b": ["A born-digital PDF has a text layer; a scan does not", "Reading order is not storage order — two-column papers interleave", "Tables and formulas need layout-aware parsers: <span class='k'>Nougat</span>, <span class='k'>Docling</span>, LayoutLM-family models", "Always record which route each document took"]}, {"sub": "OCR", "h": "Quality control, not just recognition", "b": ["Keep the per-page confidence and threshold on it", "A language model can post-correct, and can also hallucinate a plausible wrong word", "<b>Give the pipeline a refusal option</b> — an unusable page should be rejected, not silently garbled", "Sample and read 50 pages by hand before trusting any of it"], "acc": true}, {"sub": "Speech", "h": "ASR transcripts are not written text", "b": ["Different error profile: homophone substitutions, no punctuation, speaker overlap", "Disfluencies carry information in clinical dictation — do not strip them by reflex", "Word error rate is a summary; the errors cluster on exactly the rare terms you care about"]}, {"sub": "Provenance", "h": "Recorded at acquisition, not later", "b": ["Source URL or system, retrieval date, licence, and the extractor version", "Honoured opt-out signals, and when you honoured them", "Longpre et al.<sup class=\"fn\">3</sup> (2024) found widespread licence mis-labelling in popular datasets — “open” frequently was not", "Retrofitting provenance is a project, not a task (&sect;0.7.6)"]}], "notes": "The refusal-option point is the same argument as the OV-RDT capture gate in Chapter 0: rejecting unusable input is cheaper and safer than asking the next model to be robust to it.", "cites": ["Blecher et al. <i>Nougat. 2023; Docling, 2024; Xu et al., LayoutLM.</i> KDD, 2023.", "Xu et al. <i>LayoutLM: Pre-training of Text and Layout for Document Image Understanding.</i> KDD, 2020.", "Longpre et al. <i>The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing and Attribution in AI.</i> 2024."], "sec": "2.1", "secTitle": "Acquisition and extraction"}, {"kind": "bullets", "title": "Encoding repair and Unicode normalisation", "kick": "2.1.6–2.1.7", "tag": "textbook", "lead": "The least glamorous slide in the chapter, and the one that silently decides whether two identical strings compare equal.", "b": ["<b>Fix mojibake first.</b> UTF-8 read as Latin-1 and re-encoded produces text that looks broken to a human and looks like ordinary rare tokens to a tokenizer. <span class='k'>ftfy</span> handles most of it.", "<b>Pick a normalisation form and write it down.</b> NFC composes; NFKC also folds compatibility characters — full-width Latin, ligatures, superscripts. NFKC is right for search and wrong when the distinction is data.", "<b>Strip the invisible ones.</b> Zero-width joiners and non-joiners, soft hyphens, BOMs mid-file, and the zero-width space that Thai text often carries as a line-break hint.", "<b>Homoglyphs are an attack surface as well as a nuisance</b> — Cyrillic <span class='k'>а</span> in a Latin word defeats exact deduplication and exact-match decontamination alike.", "<b>For Thai specifically:</b> decide how you treat <span class='th'>ำ</span> (SARA AM), which decomposes under NFKD; normalise the ordering of vowel and tone marks; and decide whether Thai digits <span class='th'>๐–๙</span> are folded to ASCII.", "<b>Then freeze it.</b> Normalisation is part of the transform chain that ships with the model (&sect;0.8.5). Changing it after training changes what the tokenizer sees."], "callout": {"h": "Why this belongs before deduplication", "p": "Two documents that differ only by normalisation form are duplicates that no hash will catch. Every downstream stage in this chapter — dedup, contamination checks, retrieval index keys — assumes the bytes have already been made canonical."}, "notes": "War story: a corpus where 8% of apparent 'unique' documents were the same document under two normalisation forms. It was discovered only when someone plotted document-length histograms per source.", "sec": "2.1", "secTitle": "Acquisition and extraction"}, {"kind": "divider", "sec": "2.2", "secTitle": "Classical preprocessing (still needed)", "no": "2.2", "title": "Classical preprocessing, and when it now hurts", "lead": "The stack every NLP textbook teaches, the paradigm shift that made most of it optional, and the languages where none of it was ever optional.", "chips": ["Tokenisation", "Case folding", "Stopwords", "Stemming", "TF-IDF and BM25", "When preprocessing hurts", "Thai and unsegmented scripts", "Code-mixing"]}, {"kind": "split", "title": "The paradigm shift, stated precisely", "kick": "2.2.1–2.2.8", "tag": "both", "wide": "text", "lead": "With subword-tokenised transformers, aggressive preprocessing is often unnecessary or actively harmful — it destroys information the model exploits.", "b": ["<b>Case is signal.</b> <span class='k'>CD4</span>, <span class='k'>US</span>, <span class='k'>MI</span> and proper nouns lose meaning when folded.", "<b>Stopwords are signal.</b> They carry negation, modality and tense. Removing “not” inverts the label.", "<b>Stemming is signal loss.</b> It collapses morphology the model would otherwise learn, and you cannot undo it at inference.", "<b>But the classical stack is still correct</b> for sparse retrieval, tiny labelled sets, interpretable feature models, and languages with no usable pretrained model.", "<b>BM25 is not a straw man.</b> It is still a strong baseline and half of every hybrid retriever in &sect;2.10."], "fig": "f_prepharm", "figcap": "One clinical sentence, four steps, and the negation gone by step three.", "callout": {"h": "The question to make them answer", "p": "“Which model family are you feeding?” If the answer is a transformer, every extra preprocessing step needs a justification and an ablation."}, "notes": "This is the slide where students who learned NLP from a 2016 textbook update their defaults. Give it time. Then point out that the ablation is trivial to run and almost nobody runs it.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."], "sec": "2.2", "secTitle": "Classical preprocessing (still needed)"}, {"kind": "figure", "title": "Thai: one string, two segmentations, two meanings", "kick": "2.2.9", "tag": "both", "lead": "There is no whitespace word boundary in Thai. Segmentation is therefore a model output, with an error rate, sitting at the very front of your pipeline.", "fig": "f_thaiseg", "figcap": "<b>The transferable point:</b> for Thai, Lao, Khmer, Burmese, Japanese and Chinese, the first step of the pipeline is already a learned component. Everything downstream inherits its errors, and no later stage can detect them.", "notes": "Have a Thai speaker in the room read both segmentations aloud. The two meanings are unmistakable and the point lands harder in one second of speech than in five minutes of explanation.", "sec": "2.2", "secTitle": "Classical preprocessing (still needed)"}, {"kind": "bullets", "title": "Working with Thai and other unsegmented scripts", "kick": "2.2.9–2.2.10", "tag": "both", "lead": "What to actually do, in order, and what to report when you write it up.", "b": ["<b>Normalise before you segment.</b> Tone-mark and vowel ordering, SARA AM, zero-width spaces and Thai digits all change which dictionary entries match. Segmenting un-normalised text produces errors that look like model failures.", "<b>Choose a segmenter deliberately.</b> PyThaiNLP's <span class='k'>newmm</span> is dictionary-based maximal matching — fast, deterministic, and wrong on every word outside its dictionary. <span class='k'>deepcut</span> is a neural character-level segmenter — better on unseen words, slower, and trained on a particular domain.", "<b>Extend the dictionary for your domain.</b> Drug names, hospital abbreviations, place names and transliterated English are exactly what a general dictionary lacks, and exactly what your task depends on.", "<b>Measure the segmenter itself</b> on a few hundred hand-segmented sentences from your own corpus. It is a component with a metric, not a utility function.", "<b>Code-mixing breaks language ID before it breaks anything else.</b> A Thai sentence containing three English drug names may be classified as English, dropped by a language filter, and never appear in your corpus at all (&sect;2.4.1).", "<b>Report it like a model:</b> segmenter, version, dictionary, and the accuracy you measured. “We used PyThaiNLP” is not a method section."], "callout": {"h": "Connects forward", "p": "Segmentation quality propagates into tokenizer fertility (&sect;2.3.5), into deduplication keys (&sect;2.6), into chunk boundaries for retrieval (&sect;2.10), and into every negation window in clinical text (&sect;2.12). It is the highest-leverage single component in a Thai NLP pipeline."}, "notes": "Ask the students with Thai data how they currently segment. The common answer is 'the default', and the common follow-up is that they have never looked at the output. Make them look, in the lab.", "sec": "2.2", "secTitle": "Classical preprocessing (still needed)"}, {"kind": "refs", "title": "Sections 2.1 and 2.2 — references", "kick": "Reading", "sm": true, "refs": ["Jurafsky &amp; Martin. <b>Speech and Language Processing</b>, 3rd edition draft — chapters on text normalisation and tokenisation.", "Manning, Raghavan &amp; Schütze. <b>Introduction to Information Retrieval.</b> Cambridge, 2008.", "Penedo et al. <b>The RefinedWeb Dataset for Falcon LLM.</b> <i>NeurIPS</i>, 2023 — extraction from WARC, and web-only beating curated mixtures.", "Robertson &amp; Zaragoza. <b>The Probabilistic Relevance Framework: BM25 and Beyond.</b> 2009.", "Porter. <b>An algorithm for suffix stripping.</b> 1980.", "Longpre et al. <b>The Data Provenance Initiative.</b> 2024 — licence and attribution auditing.", "Blecher et al. <b>Nougat.</b> 2023; <b>Docling</b>, 2024; Xu et al., <b>LayoutLM</b>, <i>KDD</i> 2020 — document parsing.", "Tooling: <span class='k'>trafilatura</span>, <span class='k'>resiliparse</span>, <span class='k'>jusText</span>, <span class='k'>ftfy</span>, NLTK, spaCy, PyThaiNLP (<span class='k'>newmm</span>, <span class='k'>deepcut</span>)."], "sec": "2.2", "secTitle": "Classical preprocessing (still needed)"}, {"kind": "divider", "sec": "2.3", "secTitle": "Subword tokenisation for modern models", "no": "2.3", "title": "Subword tokenisation for modern models", "lead": "The layer nobody trains and everybody inherits — and the one place where a preparation choice is also a fairness choice and a pricing choice.", "chips": ["Byte-pair encoding", "WordPiece and Unigram", "SentencePiece", "Vocabulary size", "Fertility and fairness", "Numbers and code", "Chat templates", "Tokenizer-free"]}, {"kind": "figure", "title": "Byte-pair encoding, from counts to a merge tree", "kick": "2.3.1", "tag": "both", "lead": "BPE is a compression algorithm repurposed as a vocabulary: repeatedly merge the most frequent adjacent pair, and stop when you have enough symbols.", "fig": "f_bpe", "figcap": "Sennrich<sup class=\"fn\">1</sup>, Haddow &amp; Birch (<i>ACL</i> 2016) introduced it for rare words in machine translation. The merge <em>order</em> is the vocabulary — which means the training mix silently decides which languages get whole words and which get fragments.", "notes": "Run the six merges on the board by hand. It takes four minutes and it removes all the mystery. Then ask what happens if the corpus is 95% English.", "cites": ["Sennrich et al. <i>Neural Machine Translation of Rare Words with Subword Units.</i> ACL, 2016."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "table", "title": "Four algorithms, and what actually differs", "kick": "2.3.2–2.3.4", "tag": "both", "sm": true, "table": {"head": ["Method", "Merge / prune criterion", "What it means for you"], "rows": [["BPE (Sennrich et al.<sup class=\"fn\">1</sup>, 2016)", "Greedy: merge the most frequent adjacent pair", "Deterministic segmentation; simple; the default in most GPT-style models"], ["Byte-level BPE (Radford et al.<sup class=\"fn\">2</sup>, 2019)", "Same, but over UTF-8 bytes", "No unknown token ever; but non-Latin scripts start 2–3× longer before merging begins"], ["WordPiece (Schuster &amp; Nakajima<sup class=\"fn\">3</sup>, 2012)", "Merge the pair that most increases corpus likelihood", "Used in BERT; slightly different segmentation of rare words"], ["Unigram LM (Kudo<sup class=\"fn\">4</sup>, <i>ACL</i> 2018)", "Start large, prune the subwords that cost least likelihood", "Gives a distribution over segmentations, so it supports subword regularisation"], ["SentencePiece (Kudo &amp; Richardson, 2018)", "Not an algorithm — a trainer that runs BPE or Unigram on raw text", "Whitespace becomes an ordinary symbol, so it works on Thai and Japanese unchanged, and detokenisation is exactly reversible"]]}, "callout": {"h": "Vocabulary size is a four-way trade-off", "p": "A larger vocabulary shortens sequences (less compute per document, more content per context window) but enlarges the embedding and output layers, gives each rare token fewer training updates, and fragments unseen words less gracefully. There is no default that is right across languages — which is exactly the problem on the next slide."}, "notes": "SentencePiece being a trainer rather than an algorithm confuses almost everyone. Say it twice.", "cites": ["Sennrich et al. <i>Neural Machine Translation of Rare Words with Subword Units.</i> ACL, 2016.", "Radford et al. <i>Learning Transferable Visual Models From Natural Language Supervision (CLIP).</i> ICML, 2021.", "Schuster & Nakajima. <i>Japanese and Korean voice search.</i> 2012.", "Kudo. <i>Subword Regularization: Improving NMT Models with Multiple Subword Candidates.</i> ACL, 2018."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "figure", "title": "Fertility: the same content, a different price", "kick": "2.3.5", "tag": "frontier", "lead": "Petrov et al.<sup class=\"fn\">2</sup> measured up to a fifteen-fold tokenisation-length disparity across languages. That is simultaneously an accuracy problem, a context-window problem and a bill.", "fig": "f_fertility", "figcap": "Petrov, Malkin, Bibi &amp; Torr. <b>Language Model Tokenizers Introduce Unfairness Between Languages.</b> <i>NeurIPS</i> 2023 (arXiv:2305.15425). Ahia et al.<sup class=\"fn\">3</sup>, <b>Do All Languages Cost the Same?</b> <i>EMNLP</i> 2023 — API cost varies by an order of magnitude for equivalent content.", "notes": "Make the cost concrete for this room: take a Thai clinical guideline, count characters, and price it against the English translation at current per-token rates. The number is usually met with silence.", "cites": ["Xue et al. <i>ByT5.</i> TACL, 2022.", "Petrov et al. <i>Language Model Tokenizers Introduce Unfairness Between Languages.</i> NeurIPS, 2023.", "Ahia et al. <i>Do All Languages Cost the Same? Tokenization in the Era of Commercial Language Models.</i> EMNLP, 2023."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "bullets", "title": "The tokenizer bugs that reach production", "kick": "2.3.6–2.3.8", "tag": "frontier", "b": ["<b>Digit policy changes arithmetic.</b> Whether numbers split per digit, in three-digit groups, or by frequency determines whether the model can do column arithmetic at all. Check it before blaming the model.", "<b>Whitespace policy changes code.</b> Indentation is syntax in Python; a tokenizer that collapses runs of spaces destroys it, and one that gives each indent level its own token makes code far cheaper.", "<b>Chat-template mismatch is the classic silent fine-tuning bug.</b> Train with one role-marker format and serve with another and the model degrades quietly — no error, no crash, just worse answers. Print one fully-rendered training example, tokens and all, before every run.", "<b>Special tokens must be reserved, not typed.</b> A BOS or EOS string that also appears in user text is an injection surface as well as a bug.", "<b>Domain and language adaptation:</b> retrain the vocabulary on in-domain text, or extend an existing vocabulary and initialise the new embeddings from subword averages. Both change the tokenizer, so both invalidate every fertility number you measured before.", "<b>Or leave tokenisation behind:</b> ByT5 and CANINE (both <i>TACL</i> 2022) operate on bytes or characters; MYTE and MAGNET (2024) re-engineer the byte representation to equalise sequence length across scripts."], "callout": {"h": "Thesis topic", "p": "Multilingually fair tokenisers for Thai and Southeast Asian scripts. It has a measurable objective (fertility parity at fixed downstream quality), a directly affected user base, an obvious baseline, and a lab in week 6 that already produces half the tooling."}, "notes": "The chat-template bug is worth two minutes of anecdote — it is the single most common cause of 'my fine-tune got worse' messages, and it is invisible in every metric until you look at raw text.", "cites": ["Xue et al. <i>ByT5.</i> TACL, 2022."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "refs", "title": "Section 2.3 — references", "kick": "Reading", "sm": true, "refs": ["Sennrich, Haddow &amp; Birch. <b>Neural Machine Translation of Rare Words with Subword Units.</b> <i>ACL</i>, 2016.", "Kudo. <b>Subword Regularization: Improving NMT Models with Multiple Subword Candidates.</b> <i>ACL</i>, 2018 — the Unigram LM tokenizer.", "Kudo &amp; Richardson. <b>SentencePiece: A simple and language independent subword tokenizer.</b> <i>EMNLP</i>, 2018.", "Schuster &amp; Nakajima. <b>Japanese and Korean voice search.</b> 2012 — WordPiece; Radford et al., <b>Language Models are Unsupervised Multitask Learners</b>, 2019 — byte-level BPE.", "<b>Petrov, Malkin, Bibi &amp; Torr. Language Model Tokenizers Introduce Unfairness Between Languages.</b> <i>NeurIPS</i>, 2023 (arXiv:2305.15425). <i>Anchor reading for this section.</i>", "Ahia, Kumar, Gonen, Kasai, Mortensen, Smith &amp; Tsvetkov. <b>Do All Languages Cost the Same? Tokenization in the Era of Commercial Language Models.</b> <i>EMNLP</i>, 2023.", "Xue et al. <b>ByT5.</b> <i>TACL</i>, 2022; Clark et al., <b>CANINE</b>, <i>TACL</i> 2022; MYTE and MAGNET, 2024.", "Tooling: Hugging Face <span class='k'>tokenizers</span>, <span class='k'>sentencepiece</span>, <span class='k'>tiktoken</span>."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "divider", "sec": "2.4", "secTitle": "Heuristic filtering of web corpora", "no": "2.4", "title": "Heuristic filtering of web corpora", "lead": "Cheap rules over documents, applied to trillions of them. Individually crude; collectively, the thing that decides what your model has read.", "chips": ["Language identification", "C4 rules", "Gopher quality rules", "Repetition filters", "Perplexity filtering", "Filter ordering", "Web-only beats curated"]}, {"kind": "figure", "title": "The cascade, and what falls out of it", "kick": "2.4.1–2.4.6", "tag": "frontier", "lead": "Every stage removes text. The engineering question is how much; the research question is whose.", "fig": "f_cascade", "figcap": "The survival percentages here are illustrative. What is not illustrative: in published pipelines, deduplication and model-based quality filtering are consistently the two largest levers, and the ordering between them changes the result.", "notes": "Connect straight back to &sect;0.7.7: every reduction step is a sampling decision. Ask what a subgroup count would even mean for a web corpus — the answer is language, register, domain and date, and almost nobody reports all four.", "cites": ["Raffel et al. <i>Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer (T5, C4).</i> JMLR, 2020."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "table", "title": "Gopher-style document rules, and why repetition is the best of them", "kick": "2.4.3–2.4.4", "tag": "frontier", "sm": true, "lead": "Rae et al.<sup class=\"fn\">1</sup> (2021) published the list that most subsequent pipelines copied. The repetition family is the one that survives every ablation.", "table": {"head": ["Rule", "Typical form", "What it is really catching"], "rows": [["Document length", "Reject very short and absurdly long documents", "Navigation stubs at one end, concatenated dumps at the other"], ["Mean word length", "Reject outside roughly 3–10 characters", "Minified code, base64 blobs, character-level noise"], ["Symbol-to-word ratio", "Reject when hashes and ellipses dominate", "Truncated listings and SEO spam"], ["Bullet and ellipsis fraction", "Reject when most lines are bullets or end in “…”", "Link farms and auto-summarised scrapes"], ["Stopword presence", "Require a minimum count of common function words", "Keyword stuffing and non-prose — <b>and it is language-specific, so it silently rejects languages you never wrote a list for</b>"], ["Repetition filters", "Fraction of duplicate lines, paragraphs and n-grams <em>within</em> one document", "Boilerplate, templated pages and generated filler — the strongest signal per unit of compute in the whole list"]]}, "callout": {"h": "The trap in the fifth row", "p": "A stopword-presence rule needs a stopword list per language. Pipelines built for English get a Thai stopword list late, badly, or never — so Thai documents fail a rule that was never calibrated for them, and disappear before anyone counts them."}, "notes": "Have them implement the repetition filters in Lab 4. They are twenty lines of code and they remove startling amounts of rubbish, which makes the point better than any slide.", "cites": ["Rae et al. <i>Scaling Language Models: Methods, Analysis &amp; Insights from Training Gopher.</i> 2021."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "bullets", "title": "Language ID, perplexity filtering, and the order you apply them", "kick": "2.4.1, 2.4.5–2.4.7", "tag": "frontier", "b": ["<b>Language identification is the first filter and the least examined.</b> fastText and CLD3 classifiers are fast and accurate on clean prose, and weak on short documents, code-mixed text and transliteration — which is to say, weak on exactly the Thai social-media and clinical text this cohort works with.", "<b>Confidence thresholds are a sampling decision.</b> Raise the threshold and you buy purity by discarding the hardest, most code-mixed, most interesting documents. Report the threshold and the volume it removed per language.", "<b>Perplexity filtering (CCNet, Wenzek et al.<sup class=\"fn\">1</sup>, LREC 2020):</b> score every document with a small language model trained on a clean reference corpus, then keep the low-perplexity head. Cheap, effective, and it encodes the reference corpus's idea of normal prose.", "<b>Filters are not commutative.</b> Deduplicating before quality filtering yields a different corpus from the reverse, because each stage changes the base rates the next stage sees. Ablate the order; do not assume it.", "<b>The result that reframed the field:</b> RefinedWeb (Penedo et al.<sup class=\"fn\">2</sup>, <i>NeurIPS</i> 2023) showed that stringent filtering plus deduplication of web data alone can outperform hand-curated corpus mixtures. Curation effort beat curation taste.", "<b>Read what you removed, not only what you kept.</b> Sample 200 rejected documents at random and read them. Every group finds at least one rule doing something it did not intend."], "callout": {"h": "Seminar exercise", "p": "Give each group the same 10,000-document sample and a different filter order. Compare the surviving corpora on language mix, mean document length and one downstream score. Nobody argues that ordering is a detail afterwards."}, "notes": "The 'read the rejects' habit is the text-domain version of the Chapter 0 corpus-audit exercise, and it is just as reliably productive.", "cites": ["Wenzek et al. <i>CCNet: Extracting High Quality Monolingual Datasets from Web Crawl Data.</i> LREC, 2020.", "Penedo et al. <i>The RefinedWeb Dataset for Falcon LLM.</i> NeurIPS, 2023."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "divider", "sec": "2.5", "secTitle": "Model-based quality filtering and selection", "no": "2.5", "title": "Model-based quality filtering and selection", "lead": "When a rule is not enough, train a classifier. The classifier's reference set is then the most consequential unpublished decision in the pipeline.", "chips": ["Classifier-based filtering", "LLM-annotated scores", "Rubric rating", "Importance resampling", "Ask-LLM", "What moves the needle", "Filters encode values", "Low-resource filtering"]}, {"kind": "figure", "title": "FineWeb-Edu: a rubric distilled into a cheap classifier", "kick": "2.5.2", "tag": "frontier", "lead": "Ask a large model to score a seed set on an explicit rubric, distil that into a small classifier, run it over fifteen trillion tokens, and throw away ninety-two percent.", "fig": "f_fineweb", "figcap": "Penedo et al.<sup class=\"fn\">1</sup> <b>The FineWeb Datasets: Decanting the Web for the Finest Text Data at Scale.</b> <i>NeurIPS</i> 2024 (arXiv:2406.17557). Released with 70+ ablation models — an unusually high standard of evidence, and still the dataset authors' own.", "notes": "Ask what a 0–5 'educational value' rubric encodes. Textbook prose scores high; a forum thread where a nurse explains something correctly in colloquial Thai scores low. That is a choice, not a fact.", "cites": ["Penedo et al. <i>The FineWeb Datasets.</i> NeurIPS, 2024."], "sec": "2.5", "secTitle": "Model-based quality filtering and selection"}, {"kind": "cols", "title": "Four other ways to choose what to keep", "kick": "2.5.1, 2.5.3–2.5.6", "tag": "frontier", "sm": true, "lead": "All four replace a hand-written rule with a learned scorer. They differ in what the scorer is asked to approximate.", "cols": [{"sub": "Reference contrast", "h": "fastText classifiers", "b": ["Train a linear classifier to separate a reference set from random web text", "RedPajama and DCLM both use this route", "DCLM's reference is OpenHermes 2.5 plus highly-upvoted ELI5 posts", "Fast enough to run over a whole crawl on CPU"]}, {"sub": "Named axes", "h": "Rubric rating — QuRating", "b": ["Score on separate axes: required expertise, writing style, facts and trivia, educational value", "Beats a single quality scalar because the axes can be traded off deliberately", "Wettig et al.<sup class=\"fn\">3</sup>, <i>ICML</i> 2024", "Makes the values question explicit rather than hidden"], "acc": true}, {"sub": "Distribution matching", "h": "Importance resampling — DSIR", "b": ["Do not ask “is this good?”, ask “does this look like my target domain?”", "Estimate importance weights in a hashed n-gram feature space, then resample", "Xie et al.<sup class=\"fn\">4</sup>, 2023", "The natural choice for building a Thai or clinical subcorpus from a general crawl"]}, {"sub": "Direct judgement", "h": "Ask-LLM and coverage sampling", "b": ["Prompt a model to judge each candidate example directly", "Expensive per document, and compared against coverage-maximising density sampling", "Sachdeva et al., 2024", "DataComp-LM (2024) finds model-based filtering and deduplication dominate at fixed compute"]}], "notes": "DSIR is the one this cohort will actually use. Frame it as: you already have 5,000 documents that look like your task; use them to fish 500,000 more out of a crawl.", "cites": ["Gadre et al. <i>DataComp: In search of the next generation of multimodal datasets.</i> NeurIPS Datasets & Benchmarks, 2023.", "Li et al. <i>DataComp-LM (DCLM).</i> 2024.", "Wettig et al. <i>QuRating: Selecting High-Quality Data for Training Language Models.</i> ICML, 2024.", "Xie et al. <i>Data Selection for Language Models via Importance Resampling (DSIR).</i> 2023."], "sec": "2.5", "secTitle": "Model-based quality filtering and selection"}, {"kind": "bullets", "title": "Filters encode values, and the evidence is not subtle", "kick": "2.5.7–2.5.8", "tag": "frontier", "lead": "A quality classifier does not measure quality. It measures resemblance to whatever its authors chose as a reference.", "b": ["<b>Dodge et al.<sup class=\"fn\">2</sup> (<i>EMNLP</i> 2021)</b> documented C4 and found blocklist filtering removing whole registers of legitimate text — much of it about and by minority communities — alongside the noise it was aimed at.", "<b>Gururangan et al. (2022)</b> asked whose language counts as high quality, and found reference-based filters preferring text from wealthier, better-educated, more urban authors.", "<b>Kreutzer et al. (<i>TACL</i> 2022)</b> hand-audited multilingual crawls and found large fractions of low-resource-language data that was not in the claimed language, or not language.", "<b>The mechanism is simple.</b> Wikipedia-like references define good prose; dialects and low-resource languages sit further from it; distance is scored as low quality; the filter removes them.", "<b>This is &sect;0.7.7 with a different dataset</b> — so the remedy is the same: count subgroups before and after every filter, and publish the table.", "<b>For multilingual work,</b> per-language classifiers and rubrics (FineWeb-2, 2024) are current practice — and somebody has to write down what good Thai prose is."], "callout": {"h": "The rule for this module", "p": "Any filtering result submitted in this course reports, at minimum, the volume removed per language and per source domain, and one worked example of a document the filter removed that it should not have. Finding that example is the assessment."}, "notes": "This is the ethical core of the chapter. Do not rush it. The honest framing is that filtering is unavoidable and every filter has a victim — the professional obligation is to know who.", "cites": ["Penedo et al. <i>The FineWeb Datasets.</i> NeurIPS, 2024.", "Dodge et al. <i>Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus.</i> EMNLP, 2021."], "sec": "2.5", "secTitle": "Model-based quality filtering and selection"}, {"kind": "refs", "title": "Sections 2.4 and 2.5 — references", "kick": "Reading", "sm": true, "refs": ["Raffel et al. <b>Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer (T5, C4).</b> <i>JMLR</i>, 2020.", "Rae et al. <b>Scaling Language Models: Methods, Analysis &amp; Insights from Training Gopher.</b> 2021 — the quality and repetition rules.", "Wenzek et al. <b>CCNet: Extracting High Quality Monolingual Datasets from Web Crawl Data.</b> <i>LREC</i>, 2020.", "Penedo et al. <b>The RefinedWeb Dataset for Falcon LLM.</b> <i>NeurIPS</i>, 2023.", "<b>Penedo et al. The FineWeb Datasets.</b> <i>NeurIPS</i>, 2024 (arXiv:2406.17557); Li et al., <b>DataComp-LM (DCLM)</b>, 2024; Weber et al., <b>RedPajama</b>, 2024; Soldaini et al., <b>Dolma</b>, <i>ACL</i> 2024.", "Wettig, Gupta, Malik &amp; Chen. <b>QuRating: Selecting High-Quality Data for Training Language Models.</b> <i>ICML</i>, 2024.", "Xie et al. <b>Data Selection for Language Models via Importance Resampling (DSIR).</b> 2023; Sachdeva et al., <b>How to Train Data-Efficient LLMs (Ask-LLM)</b>, 2024.", "<b>Dodge et al. Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus.</b> <i>EMNLP</i>, 2021; Gururangan et al., <b>Whose Language Counts as High Quality?</b>, 2022; Kreutzer et al., <b>Quality at a Glance</b>, <i>TACL</i> 2022."], "sec": "2.5", "secTitle": "Model-based quality filtering and selection"}, {"kind": "divider", "sec": "2.6", "secTitle": "Deduplication", "no": "2.6", "title": "Deduplication", "lead": "The largest single lever in corpus preparation, a privacy control, and an evaluation-hygiene control — all in one cheap pass.", "chips": ["Exact and substring", "MinHash and LSH", "Line-level dedup", "Semantic dedup", "Diversification", "Memorisation and extraction", "Over-deduplication", "Cross-split contamination"]}, {"kind": "figure", "title": "Three duplicate problems, three algorithms", "kick": "2.6.1–2.6.5", "tag": "frontier", "lead": "Exact copies, near-copies and paraphrases are different objects and need different machinery. Run them in increasing order of cost.", "fig": "f_dedup", "figcap": "Broder<sup class=\"fn\">1</sup> (1997) for MinHash; Lee et al.<sup class=\"fn\">2</sup> (<i>ACL</i> 2022) for exact substring matching with suffix arrays; Abbas et al.<sup class=\"fn\">3</sup> (SemDeDup, 2023) and Tirumala et al.<sup class=\"fn\">4</sup> (D4, 2023) for the embedding-space stage.", "notes": "The LSH banding intuition is worth drawing: you only need one band of r rows to match, so the probability of becoming a candidate is a steep S-curve in Jaccard similarity, and you set where the curve turns by choosing bands and rows.", "cites": ["Broder. <i>On the resemblance and containment of documents.</i> 1997.", "Lee et al. <i>Deduplicating Training Data Makes Language Models Better.</i> ACL, 2022.", "Abbas et al. <i>SemDeDup: Data-efficient learning at web-scale through semantic deduplication.</i> 2023.", "Tirumala et al. <i>D4: Improving LLM Pretraining via Document De-Duplication and Diversification.</i> 2023."], "sec": "2.6", "secTitle": "Deduplication"}, {"kind": "split", "title": "Why deduplication is also a privacy control", "kick": "2.6.6", "tag": "frontier", "wide": "text", "lead": "Duplicated sequences are what a model memorises. Remove the duplication and the memorisation largely goes with it.", "b": ["Lee et al.<sup class=\"fn\">1</sup> found <b>3.04% near-duplicate examples in C4</b> — including one 61-word English sentence repeated <b>over 60,000 times</b>.", "Deduplication also removed <b>train–test overlap affecting over 4%</b> of standard validation sets, so some published gains were partly measuring overlap.", "<b>Carlini et al.<sup class=\"fn\">2</sup> (2022) and Kandpal et al. (<i>ICML</i> 2022)</b> tie extraction risk directly to duplication count.", "<b>So the &sect;0.7.4 extraction attack has a data-cleaning defence</b> — a useful sentence in an ethics review, and it costs nothing you were not already doing."], "stats": [{"v": "3.04%", "l": "near-duplicates in C4"}, {"v": "60,000+", "l": "repeats of one sentence"}, {"v": "~10×", "l": "less memorised text"}], "fig": "f_memo", "figcap": "Lee, Ippolito, Nystrom, Zhang, Eck, Callison-Burch &amp; Carlini. <b>Deduplicating Training Data Makes Language Models Better.</b> <i>ACL</i> 2022 (arXiv:2107.06499).", "notes": "The 61-word sentence is the detail everyone remembers. Use it. Then ask what the Thai equivalent would be — a hospital footer, a government template, a Facebook auto-post.", "cites": ["Lee et al. <i>Deduplicating Training Data Makes Language Models Better.</i> ACL, 2022.", "Carlini et al. <i>Quantifying Memorization Across Neural Language Models.</i> 2022."], "sec": "2.6", "secTitle": "Deduplication"}, {"kind": "bullets", "title": "Over-deduplication, and the contamination pass you cannot skip", "kick": "2.6.7–2.6.8", "tag": "frontier", "b": ["<b>More deduplication is not monotonically better.</b> Cases are reported where aggressive removal reduced downstream performance — some repetition is legitimate signal about what matters. Treat the threshold as a tuned hyper-parameter with an ablation, not a constant copied from a paper.", "<b>Deduplicate at the right granularity.</b> Document-level hashing misses boilerplate <em>inside</em> otherwise distinct documents; line- and paragraph-level dedup is what removes the repeated header on ten million pages.", "<b>Cross-split contamination is a separate pass with a separate purpose.</b> Deduplicating the corpus against itself does not remove your benchmark from it.", "<b>Decontaminate before training, not after.</b> n-gram overlap for the exact cases, embedding matching for the paraphrased ones, and a stated contamination report either way — this is the decontamination in &sect;0.3.9, at corpus scale.", "<b>Normalisation first, always.</b> Two documents differing only in Unicode form, whitespace or homoglyphs are duplicates that every hash-based method will miss (&sect;2.1.6).", "<b>Report what you did:</b> method, shingle size, threshold, granularity, and the fraction removed. “We deduplicated the corpus” tells a reader nothing they can reproduce."], "callout": {"h": "Practical order of operations", "p": "Normalise → exact and substring dedup → MinHash/LSH near-dedup with connected components → optional semantic dedup with a diversity objective → decontaminate against every benchmark you will quote → then, and only then, split and train."}, "notes": "If time is short in week 7, this is the slide to keep. The order of operations is the deliverable.", "sec": "2.6", "secTitle": "Deduplication"}, {"kind": "refs", "title": "Section 2.6 — references", "kick": "Reading", "sm": true, "refs": ["<b>Lee, Ippolito, Nystrom, Zhang, Eck, Callison-Burch &amp; Carlini. Deduplicating Training Data Makes Language Models Better.</b> <i>ACL</i>, 2022 (arXiv:2107.06499). <i>Anchor reading for this section.</i>", "Broder. <b>On the resemblance and containment of documents.</b> 1997 — MinHash and shingling.", "Abbas, Tirumala, Simig, Ganguli &amp; Morcos. <b>SemDeDup: Data-efficient learning at web-scale through semantic deduplication.</b> 2023.", "Tirumala, Simig, Aghajanyan &amp; Morcos. <b>D4: Improving LLM Pretraining via Document De-Duplication and Diversification.</b> 2023.", "Carlini et al. <b>Quantifying Memorization Across Neural Language Models.</b> 2022; Kandpal, Wallace &amp; Raffel, <b>Deduplicating Training Data Mitigates Privacy Risks in Language Models</b>, <i>ICML</i> 2022.", "Elazar et al. <b>What's In My Big Data?</b> <i>ICLR</i>, 2024 — for auditing duplication and contamination in corpora you did not build.", "Tooling: <span class='k'>datasketch</span> for MinHash/LSH, <span class='k'>text-dedup</span>, FAISS for the embedding stage."], "sec": "2.6", "secTitle": "Deduplication"}, {"kind": "divider", "sec": "2.7", "secTitle": "Safety, PII and compliance filtering", "no": "2.7", "title": "Safety, PII and compliance filtering", "lead": "Removing what must not be there, without pretending the removal is free, neutral or complete.", "chips": ["PII detection", "Clinical de-identification", "Toxicity classifiers", "Copyright and licence", "Canaries", "Decontamination", "Documenting the decision"]}, {"kind": "cols", "title": "Four filters, four different failure modes", "kick": "2.7.1–2.7.4", "tag": "both", "sm": true, "cols": [{"sub": "PII", "h": "Regex plus NER, and two error rates", "b": ["Regex catches structured identifiers; NER catches names, places and organisations", "<b>Measure recall and over-redaction separately</b> — a filter that redacts every capitalised word scores perfectly on recall", "Entity-type coverage is the specification: list the types you claim to remove", "<span class='k'>Presidio</span> is the usual starting point, not the answer"]}, {"sub": "Clinical", "h": "De-identification, i2b2 / n2c2", "b": ["The eighteen HIPAA identifiers, plus whatever your IRB adds", "<b>Surrogate replacement beats deletion</b> — realistic fake names keep the text parseable and stop the model learning that redaction marks a name", "Shared-task systems set the benchmark: Uzuner et al.<sup class=\"fn\">1</sup> 2007; Stubbs et al. 2015", "Free text is never fully de-identified; state the residual risk (&sect;0.7.1)"], "acc": true}, {"sub": "Toxicity", "h": "A classifier with a known bias", "b": ["Threshold choice is a values decision, not a tuning detail", "Welbl et al.<sup class=\"fn\">2</sup> (2021) and Sap et al.<sup class=\"fn\">3</sup> (2019): toxicity filters disproportionately remove text in minority dialects", "So a safety filter can be a representation filter — the &sect;2.5.7 problem again", "Report removal volume by language and register"]}, {"sub": "Copyright", "h": "Licence-aware source selection", "b": ["Exclude known copyrighted collections deliberately, and say which", "Propagate licences through every derived artefact", "Honour and record crawler opt-out signals", "Active litigation makes this a moving target — document the decision and its date"]}], "notes": "The surrogate-replacement point surprises clinical students: replacing names with realistic fake names is better than [REDACTED] because the model otherwise learns redaction as a feature.", "cites": ["Uzuner et al. <i>Evaluating the state-of-the-art in automatic de-identification.</i> JAMIA, 2007.", "Welbl et al. <i>Challenges in Detoxifying Language Models.</i> Findings of EMNLP, 2021.", "Sap et al. <i>The Risk of Racial Bias in Hate Speech Detection.</i> ACL, 2019."], "sec": "2.7", "secTitle": "Safety, PII and compliance filtering"}, {"kind": "bullets", "title": "Auditing the filter, and writing down what you removed", "kick": "2.7.5–2.7.7", "tag": "frontier", "b": ["<b>Canaries are the cheapest audit you are not running.</b> Insert known unique sequences into the training corpus at controlled repetition counts, then try to extract them afterwards. You get a direct, empirical memorisation measurement instead of an argument (Carlini et al.<sup class=\"fn\">1</sup>, 2019).", "<b>Benchmark decontamination is a compliance task too,</b> not only an evaluation one: a contaminated model quoted in a clinical paper is a claim you cannot defend.", "<b>Publish a contamination report</b> — which benchmarks you checked, by which method, and what overlap you found. Absence of a report is not evidence of absence.", "<b>Every filter changes the distribution.</b> Safety, PII and licence filters are reduction steps exactly like quality filters, and they need the same before-and-after subgroup counts.", "<b>Document the decision, not just the code.</b> Downstream users need to reason about what your corpus does <em>not</em> contain — that is what makes a release reusable.", "<b>And accept that these filters conflict.</b> Maximum PII recall costs utility; minimum over-redaction costs privacy; strict toxicity thresholds cost dialect coverage. There is no setting that wins all three — so pick, and defend the pick."], "callout": {"h": "Ethics case study for the seminar", "p": "You have Thai Facebook comments about diabetes, scraped publicly, containing names, hospital names and identifiable personal narratives. Nobody consented to research use. Argue the filtering and release policy from the actual text of the PDPA and your IRB approval — not from what is technically convenient."}, "notes": "The case study is deliberately close to the NCDs Listener work, so the room cannot treat it as hypothetical. There is no clean answer, and saying so is the lesson.", "cites": ["Carlini et al. <i>The Secret Sharer: Evaluating and Testing Unintended Memorization in Neural Networks.</i> USENIX Security, 2019."], "sec": "2.7", "secTitle": "Safety, PII and compliance filtering"}, {"kind": "refs", "title": "Section 2.7 — references", "kick": "Reading", "sm": true, "refs": ["Uzuner, Luo &amp; Szolovits. <b>Evaluating the state-of-the-art in automatic de-identification.</b> <i>JAMIA</i>, 2007; Stubbs, Kotfila &amp; Uzuner, <b>Automated systems for the de-identification of longitudinal clinical narratives (i2b2/UTHealth 2014)</b>, <i>JBI</i> 2015.", "Welbl et al. <b>Challenges in Detoxifying Language Models.</b> <i>Findings of EMNLP</i>, 2021.", "Sap, Card, Gabriel, Choi &amp; Smith. <b>The Risk of Racial Bias in Hate Speech Detection.</b> <i>ACL</i>, 2019.", "Carlini, Liu, Erlingsson, Kos &amp; Song. <b>The Secret Sharer: Evaluating and Testing Unintended Memorization in Neural Networks.</b> <i>USENIX Security</i>, 2019 — the canary method.", "Carlini et al. <b>Extracting Training Data from Large Language Models.</b> <i>USENIX Security</i>, 2021.", "Longpre et al. <b>The Data Provenance Initiative.</b> 2024 — licensing and attribution at dataset scale.", "Tooling: Microsoft <span class='k'>Presidio</span>, <span class='k'>philter</span>, Detoxify; and Chapter 0 &sect;0.7 for the privacy models these filters sit inside."], "sec": "2.7", "secTitle": "Safety, PII and compliance filtering"}, {"kind": "divider", "sec": "2.8", "secTitle": "Mixing, curriculum and packing", "no": "2.8", "title": "Mixing, curriculum and packing", "lead": "You have the tokens. Now: in what proportions, how many times each, in what order, and packed into sequences how?", "chips": ["Domain mixture weights", "Learned mixtures and DoReMi", "Data mixing laws", "Repetition and epochs", "Rewriting instead of discarding", "Curriculum and annealing", "Sequence packing", "Long context", "Shuffling and shards"]}, {"kind": "figure", "title": "Domain mixture weights are a hyper-parameter", "kick": "2.8.1–2.8.3", "tag": "frontier", "lead": "The proportions of web, code, books, academic and multilingual text are a design choice with a measurable effect — not a consequence of what you happened to crawl.", "fig": "f_mixture", "figcap": "Gao et al.<sup class=\"fn\">1</sup> (<b>The Pile</b>, 2020) made mixture composition explicit and public. Xie et al.<sup class=\"fn\">2</sup> (<b>DoReMi</b>, <i>NeurIPS</i> 2023) made it learnable with a small proxy model. Data mixing laws (Ye et al.<sup class=\"fn\">3</sup>, 2024; RegMix, 2025) make it predictable without full training runs.", "notes": "For this cohort the practical version is the third bar: how much Thai and how much clinical text can you upsample before you are just repeating tokens? That is a question they can actually answer at their scale.", "cites": ["Gao et al. <i>The Pile: An 800GB Dataset of Diverse Text for Language Modeling.</i> 2020.", "Xie et al. <i>Data Selection for Language Models via Importance Resampling (DSIR).</i> 2023.", "Ye et al. <i>Data Mixing Laws: Optimizing Data Mixtures by Predicting Language Modeling Performance.</i> 2024.", "Muennighoff et al. <i>Scaling Data-Constrained Language Models.</i> NeurIPS, 2023."], "sec": "2.8", "secTitle": "Mixing, curriculum and packing"}, {"kind": "figure", "title": "Sequence packing and cross-document attention", "kick": "2.8.7", "tag": "frontier", "lead": "Documents rarely fill a training sequence exactly. What you do about that is either wasted compute or a silent dependency the model learns and you never intended.", "fig": "f_packing", "figcap": "The failure is invisible in every loss curve: the model simply learns a small amount of nonsense about how documents follow each other, and spends capacity on it. Masking plus a position-id reset costs almost nothing to implement.", "notes": "Ask whether anyone has checked their framework's packing behaviour. Almost nobody has, and defaults differ between libraries and between versions of the same library.", "sec": "2.8", "secTitle": "Mixing, curriculum and packing"}, {"kind": "bullets", "title": "Repetition, rewriting, curriculum and shard design", "kick": "2.8.4–2.8.6, 2.8.8–2.8.9", "tag": "frontier", "b": ["<b>Tokens can be reused, but not indefinitely.</b> Muennighoff et al.<sup class=\"fn\">1</sup> (<i>NeurIPS</i> 2023) quantified how returns decay with repeated epochs over the same data — the answer is “more repetition than people assumed, but far from free”. For a low-resource language this is the central budgeting question.", "<b>Upsampling a high-quality source is repetition by another name.</b> Count effective epochs per source, not just the mixture weight.", "<b>Rewriting instead of discarding</b> (Recycling the Web<sup class=\"fn\">2</sup>, 2025): send low-quality documents through an LLM rewrite rather than deleting them, expanding the usable token pool. Attractive, and it inherits every model-collapse concern from &sect;0.6.4 — mark the rewritten records.", "<b>Curriculum and annealing sets:</b> recent releases order data deliberately, ending training on a small, high-quality, heavily-curated mixture. The decay-phase mixture is now a reported design choice, and one of the few places curriculum learning demonstrably pays.", "<b>Long-context data has to be built, not found.</b> Naturally long documents are upsampled, and synthetic long-range retrieval tasks are constructed, because a 128k window trained only on 2k documents learns nothing about distance.", "<b>Shuffling and shard design are reproducibility, not plumbing.</b> Global shuffle quality, shard size, and a deterministic, restartable data order are what let you resume a run and still claim it is the same experiment (&sect;0.8.5)."], "callout": {"h": "The number to compute before you argue about mixtures", "p": "Total tokens available in your target language and domain, divided by the tokens your model will consume. If that ratio is well below one, mixture weights are not your problem — repetition budget, augmentation and retrieval are."}, "notes": "This slide is where a Thai-language project gets realistic. Do the arithmetic with them on the board using a real Thai corpus size; the conclusion is usually 'adapt an existing model', and that is a legitimate and defensible finding.", "cites": ["Muennighoff et al. <i>Scaling Data-Constrained Language Models.</i> NeurIPS, 2023.", "Web. 2025."], "sec": "2.8", "secTitle": "Mixing, curriculum and packing"}, {"kind": "refs", "title": "Section 2.8 — references", "kick": "Reading", "sm": true, "refs": ["Gao et al. <b>The Pile: An 800GB Dataset of Diverse Text for Language Modeling.</b> 2020.", "<b>Xie, Pham, Dong, Du, Liu, Lu, Liang, Le, Ma &amp; Yu. DoReMi: Optimizing Data Mixtures Speeds Up Language Model Pretraining.</b> <i>NeurIPS</i>, 2023.", "Ye et al. <b>Data Mixing Laws: Optimizing Data Mixtures by Predicting Language Modeling Performance.</b> 2024; <b>RegMix</b>, 2025.", "Muennighoff, Rush, Barak, Le Scao, Piktus, Tazi, Pyysalo, Wolf &amp; Raffel. <b>Scaling Data-Constrained Language Models.</b> <i>NeurIPS</i>, 2023 — the repetition budget.", "<b>Recycling the Web</b>, 2025 — LLM rewriting of low-quality documents as a token-pool expansion strategy.", "Shumailov, Shumaylov, Zhao, Papernot, Anderson &amp; Gal. <b>AI models collapse when trained on recursively generated data.</b> <i>Nature</i> 631:755–759, 2024 — the constraint on all rewriting and synthesis.", "Soldaini et al. <b>Dolma.</b> <i>ACL</i>, 2024 — one of the few releases documenting mixture, ordering and tooling together."], "sec": "2.8", "secTitle": "Mixing, curriculum and packing"}, {"kind": "divider", "sec": "2.9", "secTitle": "Instruction, preference and reasoning data", "no": "2.9", "title": "Instruction, preference and reasoning data", "lead": "Post-training data is small enough to curate by hand and consequential enough that the curation is the whole result.", "chips": ["Human-written sets", "Self-Instruct and Evol-Instruct", "LLM-as-judge", "Instruction-following difficulty", "Complexity and diversity", "Gradient influence", "Token-level selection", "Honest baselines", "Preference data", "Verifiable reasoning"]}, {"kind": "figure", "title": "Selection: 52,000 → 9,000 → 6,000 → 1,000", "kick": "2.9.3–2.9.6", "tag": "frontier", "lead": "Four published pipelines, each keeping a smaller slice of the same kind of pool — and one dashed line that decides whether any of it counted.", "fig": "f_instsel", "figcap": "Alpaca: 52,002 self-instruct pairs from <span class='k'>text-davinci-003</span> (Stanford release, 2023 — cite the release; there is no peer-reviewed paper). AlpaGasus (<i>ICLR</i> 2024) selects 9K with 5.7× faster training. DEITA (<i>ICLR</i> 2024) picks about 6K. LIMA (<i>NeurIPS</i> 2023) uses 1,000 hand-curated pairs. LESS (<i>ICML</i> 2024) reports about 5% of data beating full-dataset training.", "notes": "Draw attention to the fact that the four papers do not use the same evaluation, the same base model or the same pool. The funnel is a narrative, not a controlled comparison — and saying that out loud is the difference between a seminar and a summary.", "cites": ["Zhou et al. <i>LIMA: Less Is More for Alignment.</i> NeurIPS, 2023.", "Chen et al. <i>AlpaGasus: Training a Better Alpaca with Fewer Data.</i> ICLR, 2024.", "Liu et al. <i>What Makes Good Data for Alignment? (DEITA).</i> ICLR, 2024.", "Xia et al. <i>LESS: Selecting Influential Data for Targeted Instruction Tuning.</i> ICML, 2024."], "sec": "2.9", "secTitle": "Instruction, preference and reasoning data"}, {"kind": "cols", "title": "Where instruction data comes from", "kick": "2.9.1–2.9.2", "tag": "frontier", "sm": true, "lead": "Four generation strategies, in rising order of scale and falling order of provenance clarity.", "cols": [{"sub": "Human-written", "h": "LIMA, Dolly, OpenAssistant", "b": ["Expensive, slow, and the highest quality per example", "<b>LIMA:</b> a 65B LLaMa tuned on 1,000 curated pairs — the Superficial Alignment Hypothesis, that alignment mostly surfaces capability already present", "Zhou et al.<sup class=\"fn\">1</sup>, <i>NeurIPS</i> 2023", "Provenance and licence are clean, which matters more than people expect"], "acc": true}, {"sub": "Bootstrapped", "h": "Self-Instruct", "b": ["Seed tasks → model generates new instructions → filter → add back to the pool", "Wang et al.<sup class=\"fn\">2</sup>, <i>ACL</i> 2023 (arXiv:2212.10560)", "Alpaca is the best-known instance: 52,002 pairs from <span class='k'>text-davinci-003</span>", "Inherits the teacher's distribution, its errors and its licence terms"]}, {"sub": "Evolved", "h": "Evol-Instruct / WizardLM", "b": ["Iteratively rewrite instructions to be deeper (more constraints, reasoning steps) or broader (new topics)", "Xu et al.<sup class=\"fn\">3</sup>, <i>ICLR</i> 2024 (arXiv:2304.12244)", "Produces genuine difficulty, and also genuine nonsense — filter after evolving", "Complexity is not the same thing as quality"]}, {"sub": "Template-free", "h": "Magpie and self-synthesis", "b": ["Prompt an aligned model with only its chat prefix and let it produce the instruction itself", "Magpie, 2024", "Cheap and diverse; the distribution is entirely the teacher's", "<b>Mark every synthetic record</b> at creation (&sect;0.6.6) or it will contaminate an eval set later"]}], "notes": "The licence point on the Self-Instruct card is the practical one: data generated from a commercial API often carries terms that forbid training a competing model. Students routinely miss this.", "cites": ["Zhou et al. <i>LIMA: Less Is More for Alignment.</i> NeurIPS, 2023.", "Wang et al. <i>Self-Instruct.</i> ACL, 2023.", "Xu et al. <i>WizardLM: Empowering Large Language Models to Follow Complex Instructions (Evol-Instruct).</i> ICLR, 2024."], "sec": "2.9", "secTitle": "Instruction, preference and reasoning data"}, {"kind": "bullets", "title": "The confounds, and the baseline most methods lose to", "kick": "2.9.8–2.9.10", "tag": "frontier", "lead": "Instruction-data selection is a field with a measurement problem, and two of its confounds are embarrassingly simple.", "b": ["<b>Response length is a hidden proxy for quality.</b> Judges — human and model — prefer longer answers, so a selector that quietly prefers long responses looks like it is selecting quality. Regress out length, or report the length distribution of what you kept.", "<b>Random selection is a real baseline and many methods do not beat it</b> on diverse pools. Report the random curve across budgets, with variance (&sect;0.5.8). A single winning budget is a chosen budget.", "<b>Preference data has its own artefacts.</b> Pairwise comparisons inherit annotator disagreement, position bias, verbosity bias and sycophancy — each of which becomes a reward hack once you optimise against it.", "<b>On-policy pairs behave differently from off-policy pairs;</b> say which you used.", "<b>Verifiable data changes the game where it exists</b> — executable tests, checkable answers and rejection-sampled reasoning chains need no adjudication.", "<b>Process versus outcome supervision:</b> Lightman et al. (2023) find rewarding correct intermediate steps beats rewarding only the final answer — a labelling decision, not a modelling one."], "callout": {"h": "Lab 7 is built on this slide", "p": "Select ten percent of an instruction pool three ways — IFD, an LLM judge, and random — then fine-tune and compare at fixed compute. The deliverable is not which method won. It is the length distribution of each selected subset, and what that tells you about the judge."}, "notes": "The length confound is the single most useful thing a student can take from this section. Once seen, it is visible everywhere in the LLM-as-judge literature.", "sec": "2.9", "secTitle": "Instruction, preference and reasoning
