xt><text x=\"606\" y=\"96\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">graph</text><circle cx=\"612\" cy=\"118\" r=\"3\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"624\" y=\"122\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">navigable small-world</text><text x=\"624\" y=\"137\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">graph</text><circle cx=\"612\" cy=\"153\" r=\"3\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"624\" y=\"157\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">ef_search is the knob</text><circle cx=\"612\" cy=\"173\" r=\"3\" fill=\"#6A4C93\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"624\" y=\"177\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">memory-hungry, no</text><text x=\"624\" y=\"192\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">training step</text><line x1=\"606\" y1=\"200\" x2=\"828\" y2=\"200\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"606\" y=\"220\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">the default for most</text><text x=\"606\" y=\"233\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">RAG systems under a</text><text x=\"606\" y=\"246\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">few million chunks</text><rect x=\"874\" y=\"44\" width=\"258\" height=\"214\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><rect x=\"874\" y=\"44\" width=\"258\" height=\"5\" rx=\"2\" fill=\"#7A6A9E\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"892\" y=\"78\" font-size=\"14.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">PQ / OPQ</text><text x=\"892\" y=\"96\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#7A6A9E\" font-weight=\"600\" font-family=\"IBM Plex Mono,monospace\">quantised</text><circle cx=\"898\" cy=\"118\" r=\"3\" fill=\"#7A6A9E\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"910\" y=\"122\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">vectors compressed to</text><text x=\"910\" y=\"137\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">byte codes</text><circle cx=\"898\" cy=\"153\" r=\"3\" fill=\"#7A6A9E\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"910\" y=\"157\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">8–32x smaller</text><circle cx=\"898\" cy=\"173\" r=\"3\" fill=\"#7A6A9E\" stroke=\"none\" stroke-width=\"1.4\"/><text x=\"910\" y=\"177\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">recall loss is real and</text><text x=\"910\" y=\"192\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">must be measured</text><line x1=\"892\" y1=\"200\" x2=\"1114\" y2=\"200\" stroke=\"#D3DCE6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"892\" y=\"220\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">when the index no</text><text x=\"892\" y=\"233\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">longer fits in RAM</text><rect x=\"16\" y=\"276\" width=\"550\" height=\"166\" rx=\"10\" fill=\"#F2F6FA\" stroke=\"#D3DCE6\" stroke-width=\"1.4\"/><text x=\"36\" y=\"304\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#16202C\" font-weight=\"700\">You are picking a point on a triangle, not a product</text><rect x=\"36\" y=\"322\" width=\"156\" height=\"62\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"50\" y=\"344\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">recall@k</text><text x=\"50\" y=\"360\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">how much of the truth</text><text x=\"50\" y=\"373\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">comes back</text><text x=\"200\" y=\"358\" font-size=\"15\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\">↔</text><rect x=\"208\" y=\"322\" width=\"156\" height=\"62\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#2D5C8A\" stroke-width=\"1.4\"/><text x=\"222\" y=\"344\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#2D5C8A\" font-weight=\"700\">p95 latency</text><text x=\"222\" y=\"360\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">what the user waits</text><text x=\"222\" y=\"373\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">for, at real load</text><text x=\"372\" y=\"358\" font-size=\"15\" text-anchor=\"middle\" fill=\"#8494A5\" font-weight=\"400\">↔</text><rect x=\"380\" y=\"322\" width=\"156\" height=\"62\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0F7A6A\" stroke-width=\"1.4\"/><text x=\"394\" y=\"344\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#0F7A6A\" font-weight=\"700\">memory / cost</text><text x=\"394\" y=\"360\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">what the index</text><text x=\"394\" y=\"373\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#8494A5\" font-weight=\"400\" font-family=\"IBM Plex Mono,monospace\">bill actually is</text><text x=\"36\" y=\"404\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">Fix any two and the third follows. A benchmark that quotes latency without recall,</text><text x=\"36\" y=\"419\" font-size=\"12\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">or recall without the index size, has told you nothing.</text><rect x=\"584\" y=\"276\" width=\"546\" height=\"166\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#6A4C93\" stroke-width=\"1.4\"/><text x=\"604\" y=\"304\" font-size=\"13.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\">Measure it on your own questions</text><text x=\"604\" y=\"330\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">recall@k</text><text x=\"700\" y=\"330\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">against a flat index on the same vectors — not</text><text x=\"700\" y=\"343\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">against the vendor's number</text><text x=\"604\" y=\"355\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">nDCG / MRR</text><text x=\"700\" y=\"355\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">when rank order matters, which for a reranked</text><text x=\"700\" y=\"368\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">pipeline it does</text><text x=\"604\" y=\"380\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">p95 latency</text><text x=\"700\" y=\"380\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">at your real concurrency, with the filter you</text><text x=\"700\" y=\"393\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">actually apply</text><text x=\"604\" y=\"405\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#6A4C93\" font-weight=\"700\" font-family=\"IBM Plex Mono,monospace\">bytes / chunk</text><text x=\"700\" y=\"405\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">index size ÷ chunk count, the number that decides</text><text x=\"700\" y=\"418\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#4B5A6B\" font-weight=\"400\">the bill</text></svg>"}, "slides": [{"kind": "title", "kick": "Condensed edition · session 3 of 5", "title": "Text, NLP and LLM data", "lead": "Two eras stacked on top of each other — and a tokenizer decision that charges Thai several times more than English for the same sentence.", "meta": "<b>Session 3 of 5</b> &nbsp;·&nbsp; Data Preparation for Machine Learning and AI<br>Thanapong Intharah &nbsp;·&nbsp; Visual Intelligence Laboratory &nbsp;·&nbsp; Khon Kaen University<br>2 h lecture + 1 h paper clinic &nbsp;·&nbsp; long-form reference: Chapter 2", "notes": "Open with a Thai sentence on screen and ask the room to segment it. Two tables will disagree. That disagreement is the whole first block."}, {"kind": "cols", "kick": "Learning outcomes", "sm": true, "title": "What you should be able to do by the end of today", "cols": [{"sub": "Handle", "h": "Thai and other unsegmented scripts", "acc": true, "b": ["Explain why segmentation errors propagate through every later stage", "Choose between dictionary and neural segmenters knowingly", "Normalise tone marks and repair encoding before anything else"]}, {"sub": "Cost", "h": "A tokenizer decision", "b": ["Explain BPE, WordPiece, Unigram and SentencePiece", "Measure fertility and convert it into inference price", "Name the tokenizer bugs that reach production"]}, {"sub": "Filter", "h": "A web corpus, in the right order", "b": ["Apply language ID, heuristic and model-based filters", "Deduplicate exactly, near, and semantically", "Say who your filter removed, and write it down"]}, {"sub": "Prepare", "h": "Instruction and retrieval data", "b": ["Select instruction data and beat the random baseline", "Choose a chunking strategy on evidence, not fashion", "Evaluate retrieval, not just the final answer"]}], "notes": "Outcome one is the one that is specific to this cohort and almost absent from the textbooks."}, {"kind": "table", "kick": "Run sheet", "title": "How the three hours run", "sm": true, "table": {"head": ["Block", "Clock", "What happens"], "rows": [["Lecture A", "0:00 – 1:05", "Acquisition, Thai text and tokenisation — extraction and Unicode repair, unsegmented scripts, BPE and the fertility tax"], ["Break", "1:05 – 1:20", "Coffee. Use it: the second block is the harder one."], ["Lecture B", "1:20 – 2:10", "Corpus curation, instruction data and RAG — the filter cascade, deduplication as a privacy control, selection funnels and chunking"], ["Paper clinic", "2:10 – 3:00", "Audit a corpus or dataset paper: what was removed, in what order, and who disappeared?"]]}, "callout": {"h": "Deck controls", "p": "<b>E</b> edit any line in place &nbsp;·&nbsp; <b>N</b> speaker notes &nbsp;·&nbsp; <b>O</b> slide grid &nbsp;·&nbsp; <b>T</b> timer &nbsp;·&nbsp; <b>/</b> search &nbsp;·&nbsp; <b>P</b> print a handout with notes underneath each slide."}, "notes": "Start the timer (T) at the top of the hour. The clinic is not optional padding — it is where the lecture material becomes a skill."}, {"kind": "figure", "sec": "2.0", "secTitle": "Why this chapter has two halves", "kick": "Orientation", "title": "Two eras, both still live", "tag": "both", "lead": "The classical stack did not go away. It moved — into retrieval, into low-resource languages, and into every clinical pipeline that must be justified line by line.", "fig": "f_twoeras", "figcap": "<b>The trap to avoid:</b> students who only learn the right-hand column cannot build a Thai clinical NLP system, and students who only learn the left-hand column cannot read a 2024 dataset paper. This chapter teaches both, and — more importantly — when each applies.", "notes": "Ask who in the room has built a TF-IDF or BM25 baseline in the last year. Usually a third of the hands. Then ask who has read a pretraining-corpus paper. Usually a different third. The overlap is the interesting group.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."]}, {"kind": "divider", "sec": "2.1", "secTitle": "Acquisition and extraction", "no": "2.1", "title": "Acquisition and extraction", "lead": "Before any filter: what bytes did you actually get, and what did the converter throw away without telling you?", "chips": ["Crawl formats", "HTML to text", "Document parsing", "OCR quality control", "ASR transcripts", "Unicode normalisation", "Crawl ethics and licensing"]}, {"kind": "figure", "title": "WARC, WAT, WET — and the extraction decision", "kick": "2.1.1–2.1.2", "tag": "frontier", "lead": "Three files describe the same crawled page. Which one you start from sets a ceiling you can never recover from later.", "fig": "f_crawl", "figcap": "Main-content extraction is not preprocessing hygiene. It is the first modelling decision in the pipeline, and it is measurable on a downstream benchmark like any other.", "notes": "Show one real WET record on screen for thirty seconds. The cookie banner and the nav menu are always there, and everyone in the room sees the problem instantly.", "cites": ["Penedo et al. <i>The RefinedWeb Dataset for Falcon LLM.</i> NeurIPS, 2023."], "sec": "2.1", "secTitle": "Acquisition and extraction"}, {"kind": "bullets", "title": "Encoding repair and Unicode normalisation", "kick": "2.1.6–2.1.7", "tag": "textbook", "lead": "The least glamorous slide in the chapter, and the one that silently decides whether two identical strings compare equal.", "b": ["<b>Fix mojibake first.</b> UTF-8 read as Latin-1 and re-encoded produces text that looks broken to a human and looks like ordinary rare tokens to a tokenizer. <span class='k'>ftfy</span> handles most of it.", "<b>Pick a normalisation form and write it down.</b> NFC composes; NFKC also folds compatibility characters — full-width Latin, ligatures, superscripts. NFKC is right for search and wrong when the distinction is data.", "<b>Strip the invisible ones.</b> Zero-width joiners and non-joiners, soft hyphens, BOMs mid-file, and the zero-width space that Thai text often carries as a line-break hint.", "<b>Homoglyphs are an attack surface as well as a nuisance</b> — Cyrillic <span class='k'>а</span> in a Latin word defeats exact deduplication and exact-match decontamination alike.", "<b>For Thai specifically:</b> decide how you treat <span class='th'>ำ</span> (SARA AM), which decomposes under NFKD; normalise the ordering of vowel and tone marks; and decide whether Thai digits <span class='th'>๐–๙</span> are folded to ASCII.", "<b>Then freeze it.</b> Normalisation is part of the transform chain that ships with the model (&sect;0.8.5). Changing it after training changes what the tokenizer sees."], "callout": {"h": "Why this belongs before deduplication", "p": "Two documents that differ only by normalisation form are duplicates that no hash will catch. Every downstream stage in this chapter — dedup, contamination checks, retrieval index keys — assumes the bytes have already been made canonical."}, "notes": "War story: a corpus where 8% of apparent 'unique' documents were the same document under two normalisation forms. It was discovered only when someone plotted document-length histograms per source.", "sec": "2.1", "secTitle": "Acquisition and extraction"}, {"kind": "divider", "sec": "2.2", "secTitle": "Classical preprocessing (still needed)", "no": "2.2", "title": "Classical preprocessing, and when it now hurts", "lead": "The stack every NLP textbook teaches, the paradigm shift that made most of it optional, and the languages where none of it was ever optional.", "chips": ["Tokenisation", "Case folding", "Stopwords", "Stemming", "TF-IDF and BM25", "When preprocessing hurts", "Thai and unsegmented scripts", "Code-mixing"]}, {"kind": "split", "title": "The paradigm shift, stated precisely", "kick": "2.2.1–2.2.8", "tag": "both", "wide": "text", "lead": "With subword-tokenised transformers, aggressive preprocessing is often unnecessary or actively harmful — it destroys information the model exploits.", "b": ["<b>Case is signal.</b> <span class='k'>CD4</span>, <span class='k'>US</span>, <span class='k'>MI</span> and proper nouns lose meaning when folded.", "<b>Stopwords are signal.</b> They carry negation, modality and tense. Removing “not” inverts the label.", "<b>Stemming is signal loss.</b> It collapses morphology the model would otherwise learn, and you cannot undo it at inference.", "<b>But the classical stack is still correct</b> for sparse retrieval, tiny labelled sets, interpretable feature models, and languages with no usable pretrained model.", "<b>BM25 is not a straw man.</b> It is still a strong baseline and half of every hybrid retriever in &sect;2.10."], "fig": "f_prepharm", "figcap": "One clinical sentence, four steps, and the negation gone by step three.", "callout": {"h": "The question to make them answer", "p": "“Which model family are you feeding?” If the answer is a transformer, every extra preprocessing step needs a justification and an ablation."}, "notes": "This is the slide where students who learned NLP from a 2016 textbook update their defaults. Give it time. Then point out that the ablation is trivial to run and almost nobody runs it.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."], "sec": "2.2", "secTitle": "Classical preprocessing (still needed)"}, {"kind": "figure", "title": "Thai: one string, two segmentations, two meanings", "kick": "2.2.9", "tag": "both", "lead": "There is no whitespace word boundary in Thai. Segmentation is therefore a model output, with an error rate, sitting at the very front of your pipeline.", "fig": "f_thaiseg", "figcap": "<b>The transferable point:</b> for Thai, Lao, Khmer, Burmese, Japanese and Chinese, the first step of the pipeline is already a learned component. Everything downstream inherits its errors, and no later stage can detect them.", "notes": "Have a Thai speaker in the room read both segmentations aloud. The two meanings are unmistakable and the point lands harder in one second of speech than in five minutes of explanation.", "sec": "2.2", "secTitle": "Classical preprocessing (still needed)"}, {"kind": "refs", "title": "Sections 2.1 and 2.2 — references", "kick": "Reading", "sm": true, "refs": ["Jurafsky &amp; Martin. <b>Speech and Language Processing</b>, 3rd edition draft — chapters on text normalisation and tokenisation.", "Manning, Raghavan &amp; Schütze. <b>Introduction to Information Retrieval.</b> Cambridge, 2008.", "Penedo et al. <b>The RefinedWeb Dataset for Falcon LLM.</b> <i>NeurIPS</i>, 2023 — extraction from WARC, and web-only beating curated mixtures.", "Robertson &amp; Zaragoza. <b>The Probabilistic Relevance Framework: BM25 and Beyond.</b> 2009.", "Porter. <b>An algorithm for suffix stripping.</b> 1980.", "Longpre et al. <b>The Data Provenance Initiative.</b> 2024 — licence and attribution auditing.", "Blecher et al. <b>Nougat.</b> 2023; <b>Docling</b>, 2024; Xu et al., <b>LayoutLM</b>, <i>KDD</i> 2020 — document parsing.", "Tooling: <span class='k'>trafilatura</span>, <span class='k'>resiliparse</span>, <span class='k'>jusText</span>, <span class='k'>ftfy</span>, NLTK, spaCy, PyThaiNLP (<span class='k'>newmm</span>, <span class='k'>deepcut</span>)."], "sec": "2.2", "secTitle": "Classical preprocessing (still needed)"}, {"kind": "divider", "sec": "2.3", "secTitle": "Subword tokenisation for modern models", "no": "2.3", "title": "Subword tokenisation for modern models", "lead": "The layer nobody trains and everybody inherits — and the one place where a preparation choice is also a fairness choice and a pricing choice.", "chips": ["Byte-pair encoding", "WordPiece and Unigram", "SentencePiece", "Vocabulary size", "Fertility and fairness", "Numbers and code", "Chat templates", "Tokenizer-free"]}, {"kind": "figure", "title": "Byte-pair encoding, from counts to a merge tree", "kick": "2.3.1", "tag": "both", "lead": "BPE is a compression algorithm repurposed as a vocabulary: repeatedly merge the most frequent adjacent pair, and stop when you have enough symbols.", "fig": "f_bpe", "figcap": "Sennrich<sup class=\"fn\">1</sup>, Haddow &amp; Birch (<i>ACL</i> 2016) introduced it for rare words in machine translation. The merge <em>order</em> is the vocabulary — which means the training mix silently decides which languages get whole words and which get fragments.", "notes": "Run the six merges on the board by hand. It takes four minutes and it removes all the mystery. Then ask what happens if the corpus is 95% English.", "cites": ["Sennrich et al. <i>Neural Machine Translation of Rare Words with Subword Units.</i> ACL, 2016."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "figure", "title": "Fertility: the same content, a different price", "kick": "2.3.5", "tag": "frontier", "lead": "Petrov et al.<sup class=\"fn\">2</sup> measured up to a fifteen-fold tokenisation-length disparity across languages. That is simultaneously an accuracy problem, a context-window problem and a bill.", "fig": "f_fertility", "figcap": "Petrov, Malkin, Bibi &amp; Torr. <b>Language Model Tokenizers Introduce Unfairness Between Languages.</b> <i>NeurIPS</i> 2023 (arXiv:2305.15425). Ahia et al.<sup class=\"fn\">3</sup>, <b>Do All Languages Cost the Same?</b> <i>EMNLP</i> 2023 — API cost varies by an order of magnitude for equivalent content.", "notes": "Make the cost concrete for this room: take a Thai clinical guideline, count characters, and price it against the English translation at current per-token rates. The number is usually met with silence.", "cites": ["Xue et al. <i>ByT5.</i> TACL, 2022.", "Petrov et al. <i>Language Model Tokenizers Introduce Unfairness Between Languages.</i> NeurIPS, 2023.", "Ahia et al. <i>Do All Languages Cost the Same? Tokenization in the Era of Commercial Language Models.</i> EMNLP, 2023."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "bullets", "title": "The tokenizer bugs that reach production", "kick": "2.3.6–2.3.8", "tag": "frontier", "b": ["<b>Digit policy changes arithmetic.</b> Whether numbers split per digit, in three-digit groups, or by frequency determines whether the model can do column arithmetic at all. Check it before blaming the model.", "<b>Whitespace policy changes code.</b> Indentation is syntax in Python; a tokenizer that collapses runs of spaces destroys it, and one that gives each indent level its own token makes code far cheaper.", "<b>Chat-template mismatch is the classic silent fine-tuning bug.</b> Train with one role-marker format and serve with another and the model degrades quietly — no error, no crash, just worse answers. Print one fully-rendered training example, tokens and all, before every run.", "<b>Special tokens must be reserved, not typed.</b> A BOS or EOS string that also appears in user text is an injection surface as well as a bug.", "<b>Domain and language adaptation:</b> retrain the vocabulary on in-domain text, or extend an existing vocabulary and initialise the new embeddings from subword averages. Both change the tokenizer, so both invalidate every fertility number you measured before.", "<b>Or leave tokenisation behind:</b> ByT5 and CANINE (both <i>TACL</i> 2022) operate on bytes or characters; MYTE and MAGNET (2024) re-engineer the byte representation to equalise sequence length across scripts."], "callout": {"h": "Thesis topic", "p": "Multilingually fair tokenisers for Thai and Southeast Asian scripts. It has a measurable objective (fertility parity at fixed downstream quality), a directly affected user base, an obvious baseline, and a lab in week 6 that already produces half the tooling."}, "notes": "The chat-template bug is worth two minutes of anecdote — it is the single most common cause of 'my fine-tune got worse' messages, and it is invisible in every metric until you look at raw text.", "cites": ["Xue et al. <i>ByT5.</i> TACL, 2022."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "refs", "title": "Section 2.3 — references", "kick": "Reading", "sm": true, "refs": ["Sennrich, Haddow &amp; Birch. <b>Neural Machine Translation of Rare Words with Subword Units.</b> <i>ACL</i>, 2016.", "Kudo. <b>Subword Regularization: Improving NMT Models with Multiple Subword Candidates.</b> <i>ACL</i>, 2018 — the Unigram LM tokenizer.", "Kudo &amp; Richardson. <b>SentencePiece: A simple and language independent subword tokenizer.</b> <i>EMNLP</i>, 2018.", "Schuster &amp; Nakajima. <b>Japanese and Korean voice search.</b> 2012 — WordPiece; Radford et al., <b>Language Models are Unsupervised Multitask Learners</b>, 2019 — byte-level BPE.", "<b>Petrov, Malkin, Bibi &amp; Torr. Language Model Tokenizers Introduce Unfairness Between Languages.</b> <i>NeurIPS</i>, 2023 (arXiv:2305.15425). <i>Anchor reading for this section.</i>", "Ahia, Kumar, Gonen, Kasai, Mortensen, Smith &amp; Tsvetkov. <b>Do All Languages Cost the Same? Tokenization in the Era of Commercial Language Models.</b> <i>EMNLP</i>, 2023.", "Xue et al. <b>ByT5.</b> <i>TACL</i>, 2022; Clark et al., <b>CANINE</b>, <i>TACL</i> 2022; MYTE and MAGNET, 2024.", "Tooling: Hugging Face <span class='k'>tokenizers</span>, <span class='k'>sentencepiece</span>, <span class='k'>tiktoken</span>."], "sec": "2.3", "secTitle": "Subword tokenisation for modern models"}, {"kind": "divider", "sec": "2.4", "secTitle": "Heuristic filtering of web corpora", "no": "2.4", "title": "Heuristic filtering of web corpora", "lead": "Cheap rules over documents, applied to trillions of them. Individually crude; collectively, the thing that decides what your model has read.", "chips": ["Language identification", "C4 rules", "Gopher quality rules", "Repetition filters", "Perplexity filtering", "Filter ordering", "Web-only beats curated"]}, {"kind": "figure", "title": "The cascade, and what falls out of it", "kick": "2.4.1–2.4.6", "tag": "frontier", "lead": "Every stage removes text. The engineering question is how much; the research question is whose.", "fig": "f_cascade", "figcap": "The survival percentages here are illustrative. What is not illustrative: in published pipelines, deduplication and model-based quality filtering are consistently the two largest levers, and the ordering between them changes the result.", "notes": "Connect straight back to &sect;0.7.7: every reduction step is a sampling decision. Ask what a subgroup count would even mean for a web corpus — the answer is language, register, domain and date, and almost nobody reports all four.", "cites": ["Raffel et al. <i>Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer (T5, C4).</i> JMLR, 2020."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "table", "title": "Gopher-style document rules, and why repetition is the best of them", "kick": "2.4.3–2.4.4", "tag": "frontier", "sm": true, "lead": "Rae et al.<sup class=\"fn\">1</sup> (2021) published the list that most subsequent pipelines copied. The repetition family is the one that survives every ablation.", "table": {"head": ["Rule", "Typical form", "What it is really catching"], "rows": [["Document length", "Reject very short and absurdly long documents", "Navigation stubs at one end, concatenated dumps at the other"], ["Mean word length", "Reject outside roughly 3–10 characters", "Minified code, base64 blobs, character-level noise"], ["Symbol-to-word ratio", "Reject when hashes and ellipses dominate", "Truncated listings and SEO spam"], ["Bullet and ellipsis fraction", "Reject when most lines are bullets or end in “…”", "Link farms and auto-summarised scrapes"], ["Stopword presence", "Require a minimum count of common function words", "Keyword stuffing and non-prose — <b>and it is language-specific, so it silently rejects languages you never wrote a list for</b>"], ["Repetition filters", "Fraction of duplicate lines, paragraphs and n-grams <em>within</em> one document", "Boilerplate, templated pages and generated filler — the strongest signal per unit of compute in the whole list"]]}, "callout": {"h": "The trap in the fifth row", "p": "A stopword-presence rule needs a stopword list per language. Pipelines built for English get a Thai stopword list late, badly, or never — so Thai documents fail a rule that was never calibrated for them, and disappear before anyone counts them."}, "notes": "Have them implement the repetition filters in Lab 4. They are twenty lines of code and they remove startling amounts of rubbish, which makes the point better than any slide.", "cites": ["Rae et al. <i>Scaling Language Models: Methods, Analysis &amp; Insights from Training Gopher.</i> 2021."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "figure", "title": "FineWeb-Edu: a rubric distilled into a cheap classifier", "kick": "2.5.2", "tag": "frontier", "lead": "Ask a large model to score a seed set on an explicit rubric, distil that into a small classifier, run it over fifteen trillion tokens, and throw away ninety-two percent.", "fig": "f_fineweb", "figcap": "Penedo et al.<sup class=\"fn\">1</sup> <b>The FineWeb Datasets: Decanting the Web for the Finest Text Data at Scale.</b> <i>NeurIPS</i> 2024 (arXiv:2406.17557). Released with 70+ ablation models — an unusually high standard of evidence, and still the dataset authors' own.", "notes": "Ask what a 0–5 'educational value' rubric encodes. Textbook prose scores high; a forum thread where a nurse explains something correctly in colloquial Thai scores low. That is a choice, not a fact.", "cites": ["Penedo et al. <i>The FineWeb Datasets.</i> NeurIPS, 2024."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "bullets", "title": "Filters encode values, and the evidence is not subtle", "kick": "2.5.7–2.5.8", "tag": "frontier", "lead": "A quality classifier does not measure quality. It measures resemblance to whatever its authors chose as a reference.", "b": ["<b>Dodge et al.<sup class=\"fn\">2</sup> (<i>EMNLP</i> 2021)</b> documented C4 and found blocklist filtering removing whole registers of legitimate text — much of it about and by minority communities — alongside the noise it was aimed at.", "<b>Gururangan et al. (2022)</b> asked whose language counts as high quality, and found reference-based filters preferring text from wealthier, better-educated, more urban authors.", "<b>Kreutzer et al. (<i>TACL</i> 2022)</b> hand-audited multilingual crawls and found large fractions of low-resource-language data that was not in the claimed language, or not language.", "<b>The mechanism is simple.</b> Wikipedia-like references define good prose; dialects and low-resource languages sit further from it; distance is scored as low quality; the filter removes them.", "<b>This is &sect;0.7.7 with a different dataset</b> — so the remedy is the same: count subgroups before and after every filter, and publish the table.", "<b>For multilingual work,</b> per-language classifiers and rubrics (FineWeb-2, 2024) are current practice — and somebody has to write down what good Thai prose is."], "callout": {"h": "The rule for this module", "p": "Any filtering result submitted in this course reports, at minimum, the volume removed per language and per source domain, and one worked example of a document the filter removed that it should not have. Finding that example is the assessment."}, "notes": "This is the ethical core of the chapter. Do not rush it. The honest framing is that filtering is unavoidable and every filter has a victim — the professional obligation is to know who.", "cites": ["Penedo et al. <i>The FineWeb Datasets.</i> NeurIPS, 2024.", "Dodge et al. <i>Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus.</i> EMNLP, 2021."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "refs", "title": "Sections 2.4 and 2.5 — references", "kick": "Reading", "sm": true, "refs": ["Raffel et al. <b>Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer (T5, C4).</b> <i>JMLR</i>, 2020.", "Rae et al. <b>Scaling Language Models: Methods, Analysis &amp; Insights from Training Gopher.</b> 2021 — the quality and repetition rules.", "Wenzek et al. <b>CCNet: Extracting High Quality Monolingual Datasets from Web Crawl Data.</b> <i>LREC</i>, 2020.", "Penedo et al. <b>The RefinedWeb Dataset for Falcon LLM.</b> <i>NeurIPS</i>, 2023.", "<b>Penedo et al. The FineWeb Datasets.</b> <i>NeurIPS</i>, 2024 (arXiv:2406.17557); Li et al., <b>DataComp-LM (DCLM)</b>, 2024; Weber et al., <b>RedPajama</b>, 2024; Soldaini et al., <b>Dolma</b>, <i>ACL</i> 2024.", "Wettig, Gupta, Malik &amp; Chen. <b>QuRating: Selecting High-Quality Data for Training Language Models.</b> <i>ICML</i>, 2024.", "Xie et al. <b>Data Selection for Language Models via Importance Resampling (DSIR).</b> 2023; Sachdeva et al., <b>How to Train Data-Efficient LLMs (Ask-LLM)</b>, 2024.", "<b>Dodge et al. Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus.</b> <i>EMNLP</i>, 2021; Gururangan et al., <b>Whose Language Counts as High Quality?</b>, 2022; Kreutzer et al., <b>Quality at a Glance</b>, <i>TACL</i> 2022."], "sec": "2.4", "secTitle": "Heuristic filtering of web corpora"}, {"kind": "divider", "sec": "2.6", "secTitle": "Deduplication", "no": "2.6", "title": "Deduplication", "lead": "The largest single lever in corpus preparation, a privacy control, and an evaluation-hygiene control — all in one cheap pass.", "chips": ["Exact and substring", "MinHash and LSH", "Line-level dedup", "Semantic dedup", "Diversification", "Memorisation and extraction", "Over-deduplication", "Cross-split contamination"]}, {"kind": "figure", "title": "Three duplicate problems, three algorithms", "kick": "2.6.1–2.6.5", "tag": "frontier", "lead": "Exact copies, near-copies and paraphrases are different objects and need different machinery. Run them in increasing order of cost.", "fig": "f_dedup", "figcap": "Broder<sup class=\"fn\">1</sup> (1997) for MinHash; Lee et al.<sup class=\"fn\">2</sup> (<i>ACL</i> 2022) for exact substring matching with suffix arrays; Abbas et al.<sup class=\"fn\">3</sup> (SemDeDup, 2023) and Tirumala et al.<sup class=\"fn\">4</sup> (D4, 2023) for the embedding-space stage.", "notes": "The LSH banding intuition is worth drawing: you only need one band of r rows to match, so the probability of becoming a candidate is a steep S-curve in Jaccard similarity, and you set where the curve turns by choosing bands and rows.", "cites": ["Broder. <i>On the resemblance and containment of documents.</i> 1997.", "Lee et al. <i>Deduplicating Training Data Makes Language Models Better.</i> ACL, 2022.", "Abbas et al. <i>SemDeDup: Data-efficient learning at web-scale through semantic deduplication.</i> 2023.", "Tirumala et al. <i>D4: Improving LLM Pretraining via Document De-Duplication and Diversification.</i> 2023."], "sec": "2.6", "secTitle": "Deduplication"}, {"kind": "split", "title": "Why deduplication is also a privacy control", "kick": "2.6.6", "tag": "frontier", "wide": "text", "lead": "Duplicated sequences are what a model memorises. Remove the duplication and the memorisation largely goes with it.", "b": ["Lee et al.<sup class=\"fn\">1</sup> found <b>3.04% near-duplicate examples in C4</b> — including one 61-word English sentence repeated <b>over 60,000 times</b>.", "Deduplication also removed <b>train–test overlap affecting over 4%</b> of standard validation sets, so some published gains were partly measuring overlap.", "<b>Carlini et al.<sup class=\"fn\">2</sup> (2022) and Kandpal et al. (<i>ICML</i> 2022)</b> tie extraction risk directly to duplication count.", "<b>So the &sect;0.7.4 extraction attack has a data-cleaning defence</b> — a useful sentence in an ethics review, and it costs nothing you were not already doing."], "stats": [{"v": "3.04%", "l": "near-duplicates in C4"}, {"v": "60,000+", "l": "repeats of one sentence"}, {"v": "~10×", "l": "less memorised text"}], "fig": "f_memo", "figcap": "Lee, Ippolito, Nystrom, Zhang, Eck, Callison-Burch &amp; Carlini. <b>Deduplicating Training Data Makes Language Models Better.</b> <i>ACL</i> 2022 (arXiv:2107.06499).", "notes": "The 61-word sentence is the detail everyone remembers. Use it. Then ask what the Thai equivalent would be — a hospital footer, a government template, a Facebook auto-post.", "cites": ["Lee et al. <i>Deduplicating Training Data Makes Language Models Better.</i> ACL, 2022.", "Carlini et al. <i>Quantifying Memorization Across Neural Language Models.</i> 2022."], "sec": "2.6", "secTitle": "Deduplication"}, {"kind": "divider", "sec": "2.9", "secTitle": "Instruction, preference and reasoning data", "no": "2.9", "title": "Instruction, preference and reasoning data", "lead": "Post-training data is small enough to curate by hand and consequential enough that the curation is the whole result.", "chips": ["Human-written sets", "Self-Instruct and Evol-Instruct", "LLM-as-judge", "Instruction-following difficulty", "Complexity and diversity", "Gradient influence", "Token-level selection", "Honest baselines", "Preference data", "Verifiable reasoning"]}, {"kind": "figure", "title": "Selection: 52,000 → 9,000 → 6,000 → 1,000", "kick": "2.9.3–2.9.6", "tag": "frontier", "lead": "Four published pipelines, each keeping a smaller slice of the same kind of pool — and one dashed line that decides whether any of it counted.", "fig": "f_instsel", "figcap": "Alpaca: 52,002 self-instruct pairs from <span class='k'>text-davinci-003</span> (Stanford release, 2023 — cite the release; there is no peer-reviewed paper). AlpaGasus (<i>ICLR</i> 2024) selects 9K with 5.7× faster training. DEITA (<i>ICLR</i> 2024) picks about 6K. LIMA (<i>NeurIPS</i> 2023) uses 1,000 hand-curated pairs. LESS (<i>ICML</i> 2024) reports about 5% of data beating full-dataset training.", "notes": "Draw attention to the fact that the four papers do not use the same evaluation, the same base model or the same pool. The funnel is a narrative, not a controlled comparison — and saying that out loud is the difference between a seminar and a summary.", "cites": ["Zhou et al. <i>LIMA: Less Is More for Alignment.</i> NeurIPS, 2023.", "Chen et al. <i>AlpaGasus: Training a Better Alpaca with Fewer Data.</i> ICLR, 2024.", "Liu et al. <i>What Makes Good Data for Alignment? (DEITA).</i> ICLR, 2024.", "Xia et al. <i>LESS: Selecting Influential Data for Targeted Instruction Tuning.</i> ICML, 2024."], "sec": "2.9", "secTitle": "Instruction, preference and reasoning data"}, {"kind": "bullets", "title": "The confounds, and the baseline most methods lose to", "kick": "2.9.8–2.9.10", "tag": "frontier", "lead": "Instruction-data selection is a field with a measurement problem, and two of its confounds are embarrassingly simple.", "b": ["<b>Response length is a hidden proxy for quality.</b> Judges — human and model — prefer longer answers, so a selector that quietly prefers long responses looks like it is selecting quality. Regress out length, or report the length distribution of what you kept.", "<b>Random selection is a real baseline and many methods do not beat it</b> on diverse pools. Report the random curve across budgets, with variance (&sect;0.5.8). A single winning budget is a chosen budget.", "<b>Preference data has its own artefacts.</b> Pairwise comparisons inherit annotator disagreement, position bias, verbosity bias and sycophancy — each of which becomes a reward hack once you optimise against it.", "<b>On-policy pairs behave differently from off-policy pairs;</b> say which you used.", "<b>Verifiable data changes the game where it exists</b> — executable tests, checkable answers and rejection-sampled reasoning chains need no adjudication.", "<b>Process versus outcome supervision:</b> Lightman et al. (2023) find rewarding correct intermediate steps beats rewarding only the final answer — a labelling decision, not a modelling one."], "callout": {"h": "Lab 7 is built on this slide", "p": "Select ten percent of an instruction pool three ways — IFD, an LLM judge, and random — then fine-tune and compare at fixed compute. The deliverable is not which method won. It is the length distribution of each selected subset, and what that tells you about the judge."}, "notes": "The length confound is the single most useful thing a student can take from this section. Once seen, it is visible everywhere in the LLM-as-judge literature.", "sec": "2.9", "secTitle": "Instruction, preference and reasoning data"}, {"kind": "divider", "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation", "no": "2.10", "title": "Retrieval corpora and RAG preparation", "lead": "The one place in this chapter where preparation happens at serving time, gets rebuilt weekly, and is almost never evaluated on its own terms.", "chips": ["The indexing pipeline", "Fixed and recursive chunking", "Semantic chunking", "Structure-aware chunking", "Parent-child retrieval", "Late chunking", "Contextual retrieval", "Metadata", "Index hygiene", "Evaluating chunking"]}, {"kind": "figure", "title": "Five ways to cut a document", "kick": "2.10.2–2.10.7", "tag": "frontier", "lead": "In rising order of preprocessing cost — and, importantly, not in rising order of measured benefit.", "fig": "f_chunking", "figcap": "Günther et al.<sup class=\"fn\">2</sup> <b>Late Chunking.</b> Jina AI, 2024 (arXiv:2409.04701). <b>Contextual Retrieval</b>, Anthropic<sup class=\"fn\">3</sup>, September 2024 — <b>self-reported</b>. Qu<sup class=\"fn\">4</sup>, Tu &amp; Bao. <b>Is Semantic Chunking Worth the Computational Cost?</b> <i>Findings of NAACL</i> 2025 (arXiv:2410.13070).", "notes": "Late chunking is the one to highlight for a resource-constrained lab: it needs no extra training and no extra LLM calls, only a long-context encoder. Contextual retrieval reports better numbers and costs an LLM call per chunk at index time.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009.", "Günther et al. <i>Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models. Jina AI.</i> 2024.", "Anthropic. <i>Introducing Contextual Retrieval. September.</i> 2024.", "Qu et al. <i>Is Semantic Chunking Worth the Computational Cost?.</i> Findings of NAACL, 2025."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "figure", "title": "Where the chunks actually live", "kick": "2.10.9 · vector stores", "tag": "frontier", "lead": "A vector database is an approximate-nearest-neighbour index with a service around it. Choosing one is choosing what to lose.", "fig": "f_vectorindex", "figcap": "<b>The teaching point:</b> “we use a vector DB” is not a design decision. The decision is the index family, the knob setting on it, and the recall you accepted — and it belongs in the methods section next to the chunk size.", "callout": {"h": "Ask in the room", "p": "Whoever has a RAG system running: what is your recall@10 against a flat index on the same embeddings? Almost nobody has measured it, which is the point."}, "notes": "Draw the triangle on the board and put three real systems on it: a 20k-chunk hospital SOP index (flat, exact, nobody cares), a 2M-chunk literature index (HNSW), a 200M-chunk web index (IVF+PQ, on disk). The exercise is to justify the point on the triangle, not to name a product.", "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "bullets", "title": "Retrieval, filtering and the index lifecycle", "kick": "2.10.8–2.10.9", "tag": "frontier", "lead": "The parts that break in production, none of which are visible in a chunking benchmark.", "b": ["<b>Hybrid beats dense alone, reliably.</b> Dense embeddings miss exact strings — a drug code, an ICD-10 label, a Thai proper noun, a part number. Run BM25 alongside and fuse the rankings; the two fail on different queries.", "<b>Metadata is not decoration.</b> Date, source, section path, department, access level. A filter applied <em>after</em> ANN retrieval silently shrinks your k — a common cause of “the answer was in the corpus but never came back”.", "<b>Access control belongs in the index.</b> If a chunk a user may not read can be retrieved and passed to the model, the model will paraphrase it. Filter at retrieval, never in the prompt.", "<b>Changing the embedding model invalidates the whole index.</b> Vectors from two models are not comparable. Re-embedding a large corpus is a scheduled migration with a cost and a rollback — so version the index by (model, chunker, corpus snapshot), exactly as §0.8.4 versions a dataset.", "<b>Deletion must propagate.</b> A retracted guideline, a withdrawn consent, a corrected reference range. If your only path is a full rebuild you cannot honour a deletion request inside a week, which for clinical or personal data is a compliance problem rather than an engineering preference.", "<b>Staleness is a quality dimension here</b> (§0.2.1, timeliness). Stamp every chunk at ingest and set the TTL deliberately, or the system will quote the 2019 protocol with total confidence."], "callout": {"h": "The one-line summary", "p": "Chunking decides what <em>can</em> be retrieved; the index, the filter and the refresh policy decide what <em>is</em>. Only the first is usually written down."}, "notes": "The deletion point lands hardest with a clinical audience. Ask how they would remove one patient’s note from a live index today — most groups discover they would have to rebuild.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "bullets", "title": "Evaluating the preparation, not just the answers", "kick": "2.10.10–2.10.11", "tag": "frontier", "b": ["<b>Build a retrieval-only harness first</b> — a held-out question set with known relevant documents, scored by recall@k and nDCG. Without it you are tuning chunk size by vibes.", "<b>Then measure end-to-end answer quality separately,</b> so you can tell a retrieval failure from a generation failure. They need different fixes and are routinely confused.", "<b>Split by source document, never by chunk</b> (&sect;0.3.6) — chunks of one document on both sides of a split is the text version of the same-patient leak.", "<b>Know when not to chunk at all.</b> If the documents fit the context window, retrieval over whole documents is simpler and easier to cite.", "<b>Domain corpora move the bottleneck.</b> For clinical guidelines and Thai-language documents, table and layout fidelity dominates chunk-size tuning — and &sect;2.2 segmentation decides where a “sentence” boundary even is."], "stats": [{"v": "35%", "l": "contextual embeddings alone (self-reported)"}, {"v": "49%", "l": "with BM25 added"}, {"v": "67%", "l": "with reranking added"}], "callout": {"h": "Lab 6", "p": "Compare fixed, recursive, semantic, late and contextual chunking on a domain corpus with a retrieval-recall and answer-quality harness. Report the preprocessing cost per document alongside the quality gain — the Qu et al. question is whether the second justifies the first, and for your corpus the answer may differ from theirs."}, "notes": "Push hard on split-by-document. It is the single most common leak in student RAG evaluations and it inflates recall dramatically.", "cites": ["Robertson & Zaragoza. <i>The Probabilistic Relevance Framework: BM25 and Beyond.</i> 2009."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "refs", "title": "Section 2.10 — references", "kick": "Reading", "sm": true, "refs": ["Günther et al. <b>Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models.</b> Jina AI, 2024 (arXiv:2409.04701).", "Anthropic. <b>Introducing Contextual Retrieval.</b> September 2024 — <b>self-reported</b> results; treat as a strong engineering report, not an independent benchmark.", "<b>Qu, Tu &amp; Bao. Is Semantic Chunking Worth the Computational Cost?</b> <i>Findings of NAACL</i>, 2025 (arXiv:2410.13070). <i>The sceptical counterweight — assign both.</i>", "Xu et al. <b>LayoutLM: Pre-training of Text and Layout for Document Image Understanding.</b> <i>KDD</i>, 2020.", "<b>cAST</b>, 2025 — chunking code on abstract syntax tree boundaries.", "Robertson &amp; Zaragoza, 2009 — BM25, still half of every strong hybrid retriever.", "Tooling: LangChain, LlamaIndex, FAISS, Chroma, and a hand-written recall harness you trust more than any of them."], "sec": "2.10", "secTitle": "Retrieval corpora and RAG preparation"}, {"kind": "bullets", "kick": "Paper clinic · 50 minutes", "cls": "lab", "title": "Audit a corpus paper", "tag": "frontier", "lead": "Bring one paper that <em>releases a dataset or corpus</em> — a pretraining corpus, an instruction set, a benchmark, a domain collection. Not a modelling paper.", "b": ["<b>Reconstruct the pipeline from the text alone.</b> Write down every filter in the order it was applied. Note where the paper stops being specific enough to reimplement.", "<b>Answer four questions.</b> What fraction of the input survived? Was deduplication exact, near, or semantic? Is there a decontamination report against the benchmarks they evaluate on? Are per-language or per-subgroup counts given before <em>and</em> after filtering?", "<b>Fifteen minutes, in pairs.</b> Ask the uncomfortable one: which population does this corpus under-represent, and would the paper's own numbers reveal it?", "<b>Twenty minutes, whole room.</b> Three presentations: the filter you could not reimplement, the count that is missing, and the one thing you would ask the authors.", "<b>Ground rule:</b> almost every corpus paper fails at least one of these. The exercise is to see the shape of the gap, not to score a takedown."], "callout": {"h": "Take home", "p": "For a corpus you use: sample 200 documents at random and read them. Bring three things you found that its documentation does not mention."}, "notes": "The 200-document read is the highest-value-per-minute exercise in the whole module. Nobody has ever come back empty-handed.", "sec": "Close", "secTitle": "Clinic, takeaways and next steps"}, {"kind": "bullets", "kick": "Key takeaways", "title": "The five sentences from today", "b": ["<b>Segmentation is not preprocessing in Thai — it is a model with an error rate</b>, and every error propagates into tokenisation, retrieval and evaluation.", "<b>The tokenizer is a pricing decision.</b> Fertility differences make the same content several times more expensive per character in Thai than in English, and that cost lands on the user.", "<b>Filters are not commutative.</b> Ablate each stage on a fixed downstream benchmark; publish the order and the survival rate.", "<b>Deduplication is a quality control, a leakage control and a privacy control at once</b> — duplicated sequences drive verbatim memorisation.", "<b>Every filter is a values decision.</b> Quality classifiers trained on Wikipedia-like references systematically demote dialects, informal registers and low-resource languages. Write down what you removed."], "callout": {"h": "On the board as they leave", "p": "Nothing in a corpus README is a fact until you have counted it yourself."}, "notes": "Reading before session 4: Penedo et al., RefinedWeb (NeurIPS 2023), for the ablation discipline.", "sec": "Close", "secTitle": "Clinic, takeaways and next steps"}]}</script>
<script>
(function(){
"use strict";
function boom(e){
  try{var b=document.getElementById("err");b.style.display="block";
    b.textContent="Something broke: "+((e&&e.message)||e)+"\n"+((e&&e.stack)||"");}catch(_){}
  if(window.console)console.error(e);
}
window.addEventListener("error",function(ev){boom(ev.error||ev.message);});

try{

var D      = JSON.parse(document.getElementById("deckdata").textContent);
var SLIDES = D.slides, FIGS = D.figs, META = D.meta, SECS = D.secs || [];
var KEY    = "dpslides-"+META.key+"-v1";
var EDITS  = {}, NOTES = {};
var cur = 0, editing = false, ovOn = false, notesOn = false;
var t0 = null, tAcc = 0;

/* ---------------- storage ---------------- */
var Store = {
  get:function(){
    try{ if(window.storage&&window.storage.get)
      return window.storage.get(KEY).then(function(r){return r&&r.value?r.value:null;}).catch(function(){return null;}); }catch(e){}
    try{ return Promise.resolve(window.localStorage.getItem(KEY)); }catch(e){ return Promise.resolve(null); }
  },
  set:function(v){
    try{ if(window.storage&&window.storage.set){ window.storage.set(KEY,v).catch(function(){}); return; } }catch(e){}
    try{ window.localStorage.setItem(KEY,v); }catch(e){}
  }
};
var svT=null;
function save(){ clearTimeout(svT); svT=setTimeout(function(){
  try{ Store.set(JSON.stringify({v:1,edits:EDITS,notes:NOTES})); }catch(e){} },350); }

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function txt(h){var d=document.createElement("div");d.innerHTML=h==null?"":h;return (d.textContent||"").trim();}
function val(i,path,dflt){ var k=i+"."+path; return (k in EDITS)?EDITS[k]:dflt; }
function ed(i,path,html,cls,tag){
  tag=tag||"div";
  return "<"+tag+' class="ed '+(cls||"")+'" data-k="'+i+"."+path+'">'+(val(i,path,html)||"")+"</"+tag+">";
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1800);}

/* ---------------- slide rendering ---------------- */
function bullets(i,arr,key,cls){
  if(!arr||!arr.length)return "";
  var h='<ul class="bul '+(cls||"")+'">';
  for(var j=0;j<arr.length;j++){
    h+='<li class="ed" data-k="'+i+"."+key+"."+j+'">'+(val(i,key+"."+j,arr[j])||"")+"</li>";
  }
  return h+"</ul>";
}
function fig(s){
  if(!s.fig)return "";
  var svg=FIGS[s.fig]||'<svg viewBox="0 0 900 380"><rect width="900" height="380" fill="#F1F5F9"/><text x="450" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#8A97A6">figure: '+esc(s.fig)+"</text></svg>";
  return svg;
}
function figblock(i,s){
  if(!s.fig)return "";
  return '<div class="figwrap col"><div class="figbox">'+fig(s)+"</div>"+
    (s.figcap?'<div class="figcap ed" data-k="'+i+'.figcap">'+val(i,"figcap",s.figcap)+"</div>":"")+"</div>";
}
function head(i,s,small){
  var h="";
  if(s.kick)h+='<p class="kick"><span class="dot"></span><span class="ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick)+"</span></p>";
  if(s.title)h+=ed(i,"title",s.title,small?"sm":"","h2");
  if(s.lead)h+=ed(i,"lead",s.lead,"lead","p");
  return h;
}
function citesHTML(i,s){
  if(!s.cites||!s.cites.length)return "";
  var h='<div class="cites">';
  for(var j=0;j<s.cites.length;j++)
    h+='<span class="c"><b>'+(j+1)+'</b><span class="ed" data-k="'+i+".cites."+j+'">'+
       val(i,"cites."+j,s.cites[j])+"</span></span>";
  return h+"</div>";
}
function foot(i,s){
  var sec=s.sec?("&sect; "+s.sec+(s.secTitle?" &nbsp;"+s.secTitle:"")):META.title;
  return '<div class="foot"><span>'+esc(META.short)+"</span><span>"+sec+'</span><span class="sp"></span>'+
    (s.tag?'<span class="tag '+s.tag+'">'+s.tag+"</span>":"")+
    "<span>"+(i+1)+" / "+SLIDES.length+"</span></div>";
}
function colsHTML(i,s){
  var n=s.cols.length,h='<div class="cols n'+n+'">';
  for(var j=0;j<n;j++){
    var c=s.cols[j];
    h+='<div class="cbox'+(c.acc?" acc":"")+'">';
    if(c.sub)h+='<div class="sub ed" data-k="'+i+".cols."+j+'.sub">'+val(i,"cols."+j+".sub",c.sub)+"</div>";
    if(c.h)h+='<h4 class="ed" data-k="'+i+".cols."+j+'.h">'+val(i,"cols."+j+".h",c.h)+"</h4>";
    if(c.p)h+='<p class="ed" data-k="'+i+".cols."+j+'.p">'+val(i,"cols."+j+".p",c.p)+"</p>";
    if(c.b&&c.b.length){
      h+='<ul class="bul">';
      for(var m=0;m<c.b.length;m++)
        h+='<li class="ed" data-k="'+i+".cols."+j+".b."+m+'">'+val(i,"cols."+j+".b."+m,c.b[m])+"</li>";
      h+="</ul>";
    }
    h+="</div>";
  }
  return h+"</div>";
}
function tableHTML(i,s){
  var h='<table class="t"><thead><tr>';
  s.table.head.forEach(function(x){h+="<th>"+x+"</th>";});
  h+="</tr></thead><tbody>";
  s.table.rows.forEach(function(r,ri){
    h+="<tr>";
    r.forEach(function(c,ci){h+='<td class="ed" data-k="'+i+".table."+ri+"."+ci+'">'+val(i,"table."+ri+"."+ci,c)+"</td>";});
    h+="</tr>";
  });
  return h+"</tbody></table>";
}
function statHTML(i,s){
  var h='<div class="stat">';
  s.stats.forEach(function(x,j){
    h+='<div><div class="v ed" data-k="'+i+".stats."+j+'.v">'+val(i,"stats."+j+".v",x.v)+"</div>"+
       '<div class="l ed" data-k="'+i+".stats."+j+'.l">'+val(i,"stats."+j+".l",x.l)+"</div></div>";
  });
  return h+"</div>";
}
function refsHTML(i,s){
  var h='<ol class="refs'+(s.refs.length>7?" two":"")+'">';
  for(var j=0;j<s.refs.length;j++)
    h+='<li class="ed" data-k="'+i+".refs."+j+'">'+val(i,"refs."+j,s.refs[j])+"</li>";
  return h+"</ol>";
}
function calloutHTML(i,s){
  return '<div class="callout"><div class="h">'+esc(s.callout.h||"Teaching point")+"</div>"+
    '<p class="ed" data-k="'+i+'.callout.p">'+val(i,"callout.p",s.callout.p)+"</p></div>";
}

function slideHTML(i){
  var s=SLIDES[i],k=s.kind||"bullets",h="";
  var cls="slide "+k+(s.cls?" "+s.cls:"");

  if(k==="title"){
    h='<div class="pad">'+
      '<p class="no ed" data-k="'+i+'.kick">'+val(i,"kick",s.kick||"")+"</p>"+
      ed(i,"title",s.title,"","h1")+
      (s.lead?ed(i,"lead",s.lead,"dek","p"):"")+
      (s.meta?'<div class="meta ed" data-k="'+i+'.meta">'+val(i,"meta",s.meta)+"</div>":"")+
      "</div>";
  }else if(k==="divider"){
    h='<div class="pad">'+
      '<div class="n">'+esc(s.no||"")+"</div>"+
      ed(i,"title",s.title,"","h2")+
      (s.lead?ed(i,"lead",s.lead,"lead","p"):"")+
      (s.chips&&s.chips.length?'<div class="chips">'+s.chips.map(function(c){return "<span>"+esc(c)+"</span>";}).join("")+"</div>":"")+
      "</div>";
  }else{
    var inner="";
    if(k==="figure"){
      inner='<div class="body v">'+figblock(i,s).replace('class="figwrap col"','class="figwrap"')+
            (s.callout?calloutHTML(i,s):"")+"</div>";
    }else if(k==="split"||k==="splitr"){
      var left='<div class="col '+(s.wide==="text"?"wide":"")+'">'+bullets(i,s.b,"b")+
        (s.callout?calloutHTML(i,s):"")+(s.stats?statHTML(i,s):"")+"</div>";
      var right=figblock(i,s);
      if(s.wide==="text")right=right.replace('class="figwrap col"','class="figwrap col narrow"');
      inner='<div class="body">'+(k==="splitr"?right+left:left+right)+"</div>";
    }else if(k==="cols"){
      inner=colsHTML(i,s)+(s.callout?calloutHTML(i,s):"");
    }else if(k==="refs"){
      inner='<div class="body v">'+refsHTML(i,s)+"</div>";
    }else if(k==="table"){
      inner='<div class="body v">'+tableHTML(i,s)+(s.callout?calloutHTML(i,s):"")+"</div>";
    }else{
      inner='<div class="body v">'+bullets(i,s.b,"b",s.b&&s.b.length>6?"tight":"")+
        (s.stats?statHTML(i,s):"")+(s.callout?calloutHTML(i,s):"")+"</div>";
    }
    h='<div class="pad" style="flex:1;display:flex;flex-direction:column;min-height:0">'+
      head(i,s,s.sm)+'<div class="rule"></div>'+inner+citesHTML(i,s)+"</div>"+foot(i,s);
  }
  return '<section class="'+cls+'" data-i="'+i+'">'+h+
    '<div class="pnotes">'+esc(NOTES[i]||s.notes||"")+"</div></section>";
}

/* ---------------- shrink-to-fit ---------------- */
function autofit(sl){
  try{
    if(!sl)return;
    var box=sl.querySelector(".body")||sl.querySelector(".cols");
    if(!box)return;
    var foot=sl.querySelector(".foot"),cit=sl.querySelector(".cites");
    sl.style.setProperty("--k","1");
    for(var i=0;i<9;i++){
      var lim=cit?cit.getBoundingClientRect().top
              :(foot?foot.getBoundingClientRect().top:sl.getBoundingClientRect().bottom);
      var over=(box.scrollHeight>box.clientHeight+1)||(box.getBoundingClientRect().bottom>lim+1);
      var kid=false;
      var cbs=sl.querySelectorAll(".cbox");
      for(var j=0;j<cbs.length;j++)if(cbs[j].scrollHeight>cbs[j].clientHeight+1){kid=true;break;}
      if(!over&&!kid)break;
      sl.style.setProperty("--k",(1-0.035*(i+1)).toFixed(3));
    }
  }catch(e){}
}

/* ---------------- layout / scale ---------------- */
function fit(){
  var st=document.querySelector(".stage"),ho=document.getElementById("holder");
  if(!st)return;
  var pad=26;
  var sc=Math.min((st.clientWidth-pad*2)/1280,(st.clientHeight-pad*2)/720);
  if(!isFinite(sc)||sc<=0)sc=.5;
  ho.style.transform="scale("+sc+")";
}
window.addEventListener("resize",fit);

/* ---------------- render current ---------------- */
function render(){
  var ho=document.getElementById("holder");
  ho.innerHTML=slideHTML(cur);
  applyEdit();
  autofit(ho.querySelector(".slide"));
  fit();
  var s=SLIDES[cur];
  document.getElementById("secNow").innerHTML=s.sec?("&sect; "+s.sec+" &nbsp;"+(s.secTitle||"")):"";
  document.getElementById("cnt").innerHTML="<b>"+(cur+1)+"</b> / "+SLIDES.length;
  var f=document.querySelector(".fill");
  if(f)f.style.width=((cur+1)/SLIDES.length*100)+"%";
  var nb=document.getElementById("noteBox");
  if(nb)nb.value=NOTES[cur]!=null?NOTES[cur]:(SLIDES[cur].notes||"");
  var nx=document.getElementById("nxt");
  if(nx)nx.textContent=cur+1<SLIDES.length?txt(val(cur+1,"title",SLIDES[cur+1].title||"—")):"End of deck";
  if(ovOn)markOv();
  if(location.hash!=="#"+(cur+1))history.replaceState(null,"","#"+(cur+1));
}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur){render();return;}
  cur=i;render();
}
function applyEdit(){
  var els=document.querySelectorAll("#holder .ed");
  for(var i=0;i<els.length;i++){
    if(editing)els[i].setAttribute("contenteditable","true");
    else els[i].removeAttribute("contenteditable");
  }
}

/* ---------------- overview ---------------- */
function buildOv(){
  var g=document.getElementById("ovgrid"),h="",lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    var sk=(s.sec||"")+"|"+(s.secTitle||"");
    if(sk!==lastSec){
      lastSec=sk;
      h+='<div class="ovsec">'+(s.sec?esc(s.sec)+" &nbsp; "+esc(s.secTitle||""):esc(META.short))+"</div>";
    }
    h+='<div class="ovc" data-go="'+i+'"><div class="shell" data-shell><div class="mini" data-mini>'+
      slideHTML(i)+'</div></div><div class="no">'+(i+1)+'</div><div class="lb">'+
      esc(txt(val(i,"title",s.title||""))||(s.kind==="divider"?"Section":"Slide"))+"</div></div>";
  }
  g.innerHTML=h;
  var ms=g.querySelectorAll(".mini .slide");
  for(var q=0;q<ms.length;q++)autofit(ms[q]);
  // scale minis
  var cards=g.querySelectorAll(".ovc");
  for(var j=0;j<cards.length;j++){
    var shell=cards[j].querySelector("[data-shell]"),mini=cards[j].querySelector("[data-mini]");
    var w=cards[j].clientWidth||232,sc=w/1280;
    mini.style.transform="scale("+sc+")";
    shell.style.height=(720*sc)+"px";
  }
  markOv();
}
function markOv(){
  var cards=document.querySelectorAll(".ovc");
  for(var i=0;i<cards.length;i++)cards[i].classList.toggle("cur",+cards[i].getAttribute("data-go")===cur);
  var c=document.querySelector(".ovc.cur");
  if(c)c.scrollIntoView({block:"nearest"});
}

/* ---------------- export ---------------- */
function toMarkdown(){
  var L=[];
  L.push("# "+META.title);
  L.push("");
  L.push("_"+META.short+" · "+SLIDES.length+" slides · exported from the editable HTML deck._");
  L.push("");
  var lastSec=null;
  for(var i=0;i<SLIDES.length;i++){
    var s=SLIDES[i];
    if(s.sec&&s.sec!==lastSec){lastSec=s.sec;L.push("");L.push("## "+s.sec+" "+(s.secTitle||""));L.push("");}
    var t=txt(val(i,"title",s.title||""));
    L.push("### ["+(i+1)+"] "+(t||"(untitled)"));
    var ld=txt(val(i,"lead",s.lead||""));
    if(ld)L.push("");
    if(ld)L.push("_"+ld+"_");
    if(s.b&&s.b.length){L.push("");for(var j=0;j<s.b.length;j++)L.push("- "+txt(val(i,"b."+j,s.b[j])));}
    if(s.cols)s.cols.forEach(function(c,j){
      L.push("");L.push("**"+txt(val(i,"cols."+j+".h",c.h||""))+"**");
      var p=txt(val(i,"cols."+j+".p",c.p||""));if(p)L.push(p);
      (c.b||[]).forEach(function(x,m){L.push("- "+txt(val(i,"cols."+j+".b."+m,x)));});
    });
    if(s.table){L.push("");L.push("| "+s.table.head.join(" | ")+" |");
      L.push("|"+s.table.head.map(function(){return "---";}).join("|")+"|");
      s.table.rows.forEach(function(r,ri){L.push("| "+r.map(function(c,ci){
        return txt(val(i,"table."+ri+"."+ci,c));}).join(" | ")+" |");});}
    if(s.stats){L.push("");s.stats.forEach(function(x,j){
      L.push("- **"+txt(val(i,"stats."+j+".v",x.v))+"** — "+txt(val(i,"stats."+j+".l",x.l)));});}
    if(s.callout){L.push("");L.push("> **"+(s.callout.h||"Teaching point")+".** "+txt(val(i,"callout.p",s.callout.p)));}
    if(s.figcap){L.push("");L.push("_Figure: "+txt(val(i,"figcap",s.figcap))+"_");}
    if(s.refs){L.push("");s.refs.forEach(function(r,j){L.push((j+1)+". "+txt(val(i,"refs."+j,r)));});}
    if(s.cites&&s.cites.length){L.push("");
      L.push("_Sources: "+s.cites.map(function(c,j){
        return "["+(j+1)+"] "+txt(val(i,"cites."+j,c));}).join(" · ")+"_");}
    var nt=(NOTES[i]!=null?NOTES[i]:(s.notes||"")).trim();
    if(nt){L.push("");L.push("> **Speaker notes.** "+nt.replace(/\n/g," "));}
    L.push("");
  }
  return L.join("\n");
}
function openModal(title,text,name,mode){
  var m=document.getElementById("modal");
  document.getElementById("mTitle").textContent=title;
  var body=document.getElementById("mBody");
  if(mode==="help"){ body.innerHTML=HELP; }
  else{
    body.innerHTML='<textarea id="mText" spellcheck="false"></textarea>';
    var ta=document.getElementById("mText");ta.value=text;ta.setAttribute("data-name",name||"export.txt");
  }
  document.querySelector('[data-act="mcopy"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mdl"]').style.display=mode==="help"?"none":"";
  document.querySelector('[data-act="mload"]').style.display=mode==="import"?"":"none";
  m.classList.add("on");
}
var HELP='<div class="help"><h4>Moving around</h4><table>'+
  '<tr><td><kbd>&rarr;</kbd> <kbd>&larr;</kbd> <kbd>Space</kbd></td><td>Next / previous slide</td></tr>'+
  '<tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>First / last slide</td></tr>'+
  '<tr><td><kbd>O</kbd></td><td>Overview grid of every slide, click one to jump</td></tr>'+
  '<tr><td><kbd>/</kbd></td><td>Search titles, bullets, references and your notes</td></tr>'+
  '<tr><td>number then <kbd>Enter</kbd></td><td>Jump to that slide</td></tr>'+
  '<tr><td><kbd>F</kbd></td><td>Fullscreen</td></tr></table>'+
  '<h4>Teaching and editing</h4><table>'+
  '<tr><td><kbd>E</kbd></td><td>Edit mode: click any heading, bullet, caption, table cell or reference and rewrite it</td></tr>'+
  '<tr><td><kbd>N</kbd></td><td>Speaker-notes panel, with the next slide title shown above it</td></tr>'+
  '<tr><td><kbd>T</kbd></td><td>Start / pause the lecture timer</td></tr>'+
  '<tr><td><kbd>P</kbd></td><td>Print or save as PDF, one slide per page with notes underneath</td></tr>'+
  '</table><h4>Keeping your work</h4><table>'+

  '</table></div>';

/* ---------------- search ---------------- */
function slideText(i){
  var s=SLIDES[i],parts=[txt(val(i,"title",s.title||"")),txt(val(i,"lead",s.lead||""))];
  (s.b||[]).forEach(function(x,j){parts.push(txt(val(i,"b."+j,x)));});
  (s.refs||[]).forEach(function(x,j){parts.push(txt(val(i,"refs."+j,x)));});
  (s.cols||[]).forEach(function(c,j){parts.push(txt(val(i,"cols."+j+".h",c.h||"")));
    parts.push(txt(val(i,"cols."+j+".p",c.p||"")));
    (c.b||[]).forEach(function(x,m){parts.push(txt(val(i,"cols."+j+".b."+m,x)));});});
  if(s.table)s.table.rows.forEach(function(r,ri){r.forEach(function(c,ci){
    parts.push(txt(val(i,"table."+ri+"."+ci,c)));});});
  if(s.figcap)parts.push(txt(val(i,"figcap",s.figcap)));
  (s.cites||[]).forEach(function(c,j){parts.push(txt(val(i,"cites."+j,c)));});
  if(s.callout)parts.push(txt(val(i,"callout.p",s.callout.p)));
  parts.push(NOTES[i]||s.notes||"");
  parts.push(s.sec||"",s.secTitle||"");
  return parts.join("  ");
}
function doSearch(q){
  var box=document.getElementById("sres");
  q=(q||"").trim();
  if(q.length<2){box.innerHTML="";return;}
  var lq=q.toLowerCase(),h="",n=0;
  for(var i=0;i<SLIDES.length&&n<40;i++){
    var t=slideText(i),p=t.toLowerCase().indexOf(lq);
    if(p<0)continue;
    n++;
    var a=Math.max(0,p-46),snip=esc(t.slice(a,p))+"<mark>"+esc(t.slice(p,p+q.length))+"</mark>"+esc(t.slice(p+q.length,p+q.length+80));
    h+='<button data-go="'+i+'"><span class="n">slide '+(i+1)+(SLIDES[i].sec?" &nbsp;&sect; "+esc(SLIDES[i].sec):"")+
       '</span><div class="t">'+esc(txt(val(i,"title",SLIDES[i].title||"")))+'</div><div class="n" style="margin-top:3px">'+
       (a>0?"…":"")+snip+"…</div></button>";
  }
  box.innerHTML=h||'<button style="cursor:default"><span class="n">no match</span></button>';
}

/* ---------------- timer ---------------- */
function tick(){
  var el=document.querySelector(".timer");if(!el)return;
  var ms=tAcc+(t0?(Date.now()-t0):0),s=Math.floor(ms/1000);
  el.textContent=(t0?"":"⏸ ")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
setInterval(tick,500);

/* ---------------- events ---------------- */
document.addEventListener("click",function(ev){
try{
  var t=ev.target;
  var g=t.closest?t.closest("[data-go]"):null;
  if(g){ go(+g.getAttribute("data-go"));
    if(ovOn)setOv(false);
    document.body.classList.remove("srch-on");
    return; }
  var b=t.closest?t.closest("[data-act]"):null;
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="next"){go(cur+1);return;}
  if(a==="prev"){go(cur-1);return;}
  if(a==="ov"){setOv(!ovOn);return;}
  if(a==="notes"){notesOn=!notesOn;document.body.classList.toggle("notes-on",notesOn);
    b.setAttribute("aria-pressed",String(notesOn));fit();return;}
  if(a==="edit"){editing=!editing;document.body.classList.toggle("edit",editing);
    b.setAttribute("aria-pressed",String(editing));applyEdit();
    toast(editing?"Edit mode on — click any text to rewrite it":"Edit mode off");return;}
  if(a==="search"){document.body.classList.toggle("srch-on");
    if(document.body.classList.contains("srch-on"))document.getElementById("q").focus();return;}
  if(a==="print"){printAll();return;}
  if(a==="help"){openModal("Keyboard and features","","","help");return;}
  if(a==="hub"){window.location.href=META.hub;return;}
  if(a==="export"){
    openModal("Export — Markdown",toMarkdown(),META.key+"-slides.md");
    document.getElementById("mSeg").innerHTML=
      '<button class="mbtn" data-act="expmd">Markdown</button>'+
      '<button class="mbtn" data-act="expjson">JSON backup</button>'+
      '<button class="mbtn" data-act="expimp">Import…</button>';
    return;}
  if(a==="expmd"){document.getElementById("mTitle").textContent="Export — Markdown";
    var t1=document.getElementById("mText");if(t1){t1.value=toMarkdown();t1.setAttribute("data-name",META.key+"-slides.md");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expjson"){document.getElementById("mTitle").textContent="Export — JSON backup";
    var t2=document.getElementById("mText");if(t2){t2.value=JSON.stringify({v:1,edits:EDITS,notes:NOTES},null,2);
      t2.setAttribute("data-name",META.key+"-backup.json");}
    document.querySelector('[data-act="mload"]').style.display="none";return;}
  if(a==="expimp"){document.getElementById("mTitle").textContent="Import — paste a JSON backup, then Load";
    var t3=document.getElementById("mText");if(t3)t3.value="";
    document.querySelector('[data-act="mload"]').style.display="";return;}
  if(a==="mload"){
    try{ var o=JSON.parse(document.getElementById("mText").value);
      EDITS=o.edits||{};NOTES=o.notes||{};save();render();
      document.getElementById("modal").classList.remove("on");toast("Backup loaded");
    }catch(e){toast("That is not valid JSON");}
    return;}
  if(a==="mclose"){document.getElementById("modal").classList.remove("on");return;}
  if(a==="mcopy"){var ta=document.getElementById("mText");if(!ta)return;
    ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){toast("Copied");},function(){toast("Select and copy manually");});
    else toast(ok?"Copied to clipboard":"Select and copy manually");return;}
  if(a==="mdl"){var ta2=document.getElementById("mText");if(!ta2)return;
    var nm=ta2.getAttribute("data-name")||"export.txt";
    var bl=new Blob([ta2.value],{type:"text/plain;charset=utf-8"});
    var A=document.createElement("a");A.href=URL.createObjectURL(bl);A.download=nm;
    document.body.appendChild(A);A.click();A.remove();toast("Downloaded "+nm);return;}
}catch(e){boom(e);}
},false);

function setOv(on){
  ovOn=on;document.body.classList.toggle("ov-on",on);
  var b=document.querySelector('[data-act="ov"]');if(b)b.setAttribute("aria-pressed",String(on));
  if(on)buildOv();
}
function printAll(){
  var ho=document.getElementById("holder"),h="";
  for(var i=0;i<SLIDES.length;i++)h+=slideHTML(i);
  ho.innerHTML=h;ho.style.transform="none";
  var ps=ho.querySelectorAll(".slide");
  for(var q=0;q<ps.length;q++)autofit(ps[q]);
  document.body.classList.add("handout");
  window.print();
  setTimeout(function(){document.body.classList.remove("handout");render();},400);
}

/* progress bar click */
document.addEventListener("mousedown",function(ev){
  var tr=ev.target.closest?ev.target.closest(".track"):null;
  if(!tr)return;
  var r=tr.getBoundingClientRect();
  go(Math.round((ev.clientX-r.left)/r.width*(SLIDES.length-1)));
});

/* edits */
document.addEventListener("focusout",function(ev){
  try{
    var t=ev.target;
    if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
      var k=t.getAttribute("data-k");
      if(k){EDITS[k]=t.innerHTML.trim();save();}
    }
  }catch(e){boom(e);}
},true);
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="noteBox"){NOTES[cur]=t.value;save();return;}
  if(t.id==="q"){doSearch(t.value);return;}
});
document.addEventListener("paste",function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains("ed")&&t.isContentEditable){
    ev.preventDefault();
    var s=(ev.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,s);
  }
});

/* keys */
var numBuf="";
document.addEventListener("keydown",function(ev){
try{
  var tag=(ev.target.tagName||"").toLowerCase();
  var typing=ev.target.isContentEditable||tag==="input"||tag==="textarea";
  if(ev.key==="Escape"){
    document.getElementById("modal").classList.remove("on");
    document.body.classList.remove("srch-on");
    if(ovOn)setOv(false);
    if(ev.target.isContentEditable)ev.target.blur();
    return;
  }
  if(typing){
    if(ev.target.id==="q"&&ev.key==="Enter"){
      var f=document.querySelector("#sres [data-go]");
      if(f){go(+f.getAttribute("data-go"));document.body.classList.remove("srch-on");}
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==="ArrowRight"||ev.key==="PageDown"||ev.key===" "){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="ArrowDown"){ev.preventDefault();go(cur+1);return;}
  if(ev.key==="ArrowUp"){ev.preventDefault();go(cur-1);return;}
  if(ev.key==="Home"){ev.preventDefault();go(0);return;}
  if(ev.key==="End"){ev.preventDefault();go(SLIDES.length-1);return;}
  if(ev.key>="0"&&ev.key<="9"){numBuf+=ev.key;return;}
  if(ev.key==="Enter"&&numBuf){go(parseInt(numBuf,10)-1);numBuf="";return;}
  var k=ev.key.toLowerCase();
  numBuf="";
  if(k==="o"){setOv(!ovOn);return;}
  if(k==="n"){document.querySelector('[data-act="notes"]').click();return;}
  if(k==="e"){document.querySelector('[data-act="edit"]').click();return;}
  if(k==="p"){ev.preventDefault();printAll();return;}
  if(k==="/"||k==="?"){ev.preventDefault();
    if(ev.key==="?"){openModal("Keyboard and features","","","help");return;}
    document.body.classList.add("srch-on");document.getElementById("q").focus();return;}
  if(k==="t"){ if(t0){tAcc+=Date.now()-t0;t0=null;}else{t0=Date.now();} tick(); return;}
  if(k==="f"){ if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); return;}
}catch(e){boom(e);}
},false);

/* progress bar dom */
(function(){
  var p=document.createElement("div");p.className="prog";
  var ticks="";
  for(var i=0;i<SLIDES.length;i++){
    if(SLIDES[i].kind==="divider")ticks+='<i style="left:'+(i/(SLIDES.length-1)*100)+'%"></i>';
  }
  p.innerHTML='<span class="hint">&larr;/&rarr; move &nbsp;·&nbsp; O overview &nbsp;·&nbsp; E edit &nbsp;·&nbsp; N notes &nbsp;·&nbsp; T timer &nbsp;·&nbsp; ? help</span>'+
    '<div class="track"><div class="ticks">'+ticks+'</div><div class="fill"></div></div>'+
    '<span class="timer">⏸ 00:00</span>';
  document.body.appendChild(p);
})();

/* boot */
Store.get().then(function(raw){
  try{ if(raw){var o=JSON.parse(raw);EDITS=o.edits||{};NOTES=o.notes||{};} }catch(e){}
  var h=parseInt((location.hash||"").replace("#",""),10);
  if(h>0&&h<=SLIDES.length)cur=h-1;
  render();
  if(raw)toast("Your saved edits and notes are back");
}).catch(function(){render();});

}catch(e){boom(e);}
})();
</script>
